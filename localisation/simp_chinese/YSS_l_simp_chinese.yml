l_simp_chinese:
 YSS_focus_1: "关键的一年"
 YSS_focus_1_desc: "今年是联盟走过的第二十六个年头，并且是第二个三年计划的最后一个年头，这无疑是我们承上启下开展工作的关键一年。"
 YSS_focus_2: "即将召开的第八次党大会"
 YSS_focus_2_desc: "按照惯例，党每三年召开一次全国代表大会，今年正是第八次全国代表大会召开的年头。"
 YSS_focus_3: "关于国内状况的报告"
 YSS_focus_3_desc: "中央书记处需向全体代表提交一份详尽的国内形势报告。报告中必须直面‘三年计划’落实不均衡、贵族势力渗透工业体系等尖锐问题。"
 YSS_focus_4: "对于过去成果的总结"
 YSS_focus_4_desc: "尽管荆棘遍布，但联盟在教育革新与中央直辖区的工业化上取得了史无前例的突破。我们需要用这些成果来鼓舞党内士气，证明‘文化教育大革命’的正确性。"
 YSS_focus_5: "对于现今国际局势的报告"
 YSS_focus_5_desc: "欧洲的机械轰鸣声从未停止，周围的列强仍在虎视眈眈。我们将分析圣杯王国与幻想乡在非洲之角的最新动向，为联盟的外交选择提供依据。"
 YSS_focus_6: "宣布新宪法的草案进度"
 YSS_focus_6_desc: "修正阿克苏姆帝国旧法、制定一部属于‘联盟’的新宪法，是联盟建立以来最根本的遗留任务。今日，草案的编纂进度将首次被公之于众。"
 YSS_focus_7: "将宪法上升到全联盟高度"
 YSS_focus_7_desc: "宪法不能只是一纸空文。我们必须通过宣传机器与行政网络，让‘联盟宪法’的知名度覆盖到每一块王公领地与军阀辖区，而非仅停留于亚的斯亚贝巴。"
 YSS_focus_8: "达成有限妥协"
 YSS_focus_8_desc: "为了宪法的顺利通过，我们可以允许贵族在地方治理中保留部分‘传统惯例’，以此换取他们对新宪法的书面承认。"
 YSS_focus_9: "号召民众集体讨论"
 YSS_focus_9_desc: "将宪法草案印发至工厂、学校和农村苏维埃，鼓励工农兵代表提出修改意见。这将是联盟历史上首次真正意义上的大众政治参与。"
 YSS_focus_10: "与党政干部达成协议"
 YSS_focus_10_desc: "在草案进入投票环节前，必须先统一党内高级干部的思想。通过闭门会议与政治承诺，确保关键人物不会在表决时发难。"
 YSS_focus_11: "下令放宽言论限制"
 YSS_focus_11_desc: "为了让宪法真正反映民意，中央决定暂时放宽报刊与集会的审查尺度。允许群众公开批评草案中的遗留封建条款。"
 YSS_focus_12: "对部分内容进行修订"
 YSS_focus_12_desc: "吸收群众讨论与干部协议中的“合理”建议，我们对草案中关于‘王公领地征税权’和‘军事指挥归属’的条款进行了文字性修订，使其更符合联盟现状。"
 YSS_focus_13: "强行通过新宪法"
 YSS_focus_13_desc: "当协商陷入僵局时，唯有依靠中央权威强行表决。这将是一场政治豪赌：要么一举奠定联盟的法理基础，要么激化与封建残余的全面对立。"
 YSS_focus_14: "投票通过新宪法"
 YSS_focus_14_desc: "经过漫长的讨论、妥协与修订，将宪法草案提交至全国代表大会进行最终表决。若票数通过，联盟将拥有一部“真正”承载人民意志的根本大法。"
 YSS_focus_15: "关于党员革命性质的报告"
 YSS_focus_15_desc: "中央发现现有的党员成分异常复杂。我们将逐一审查党员的家庭出身、留洋背景及与封建贵族的私人往来，为后续整顿提供依据。"
 YSS_focus_16: "核对党内文件"
 YSS_focus_16_desc: "调取内务部与各级党委的存档文件，逐页核对党员登记表、思想汇报与人事调令。大量模糊不清的履历和相互矛盾的签名开始浮出水面......"
 YSS_focus_17: "隐藏在身边的反对派"
 YSS_focus_17_desc: "随着文件核对的深入，一个令人不安的事实被揭示：某些出身王公家庭的党员，利用联姻与贿赂在党内构筑了隐秘的关系网。他们未必反对联盟，但他们效忠的对象并非中央。"
 YSS_focus_18: "对内务部进行整顿"
 YSS_focus_18_desc: "内务部作为专政机关，其自身却充斥着旧帝国的密探与投机分子。必须首先将内务部清洗干净，才能让它成为可靠的调查工具。"
 YSS_focus_19: "成立中央调查委员会"
 YSS_focus_19_desc: "由总书记直接授权，组建一个独立于内务部与各级党委的中央调查委员会。其成员全部来自出身贫寒或中产的后辈，以确保忠诚。"
 YSS_focus_20: "揪出反革命分子"
 YSS_focus_20_desc: "调查委员会的第一轮行动已锁定证据确凿的目标。这些人利用职务之便，为封建王公输送工业物资与军事情报，构成了事实上的叛国行为。"
 YSS_focus_21: "保持党的纯洁性"
 YSS_focus_21_desc: "清除叛徒只是开始。我们必须建立一套长效机制，从入党审核、定期考核到群众监督，全方位杜绝不纯洁分子再次混入党的队伍。"
 YSS_focus_22: "重审党中央权威"
 YSS_focus_22_desc: "经过前阶段的调查与清除，中央权威已得到初步重塑。但在地方层面，仍有不少干部阳奉阴违。现在是时候将整顿推向全联盟了。"
 YSS_focus_23: "撤换地方干部"
 YSS_focus_23_desc: "各州、各军区、各重要工厂的第一负责人中，有相当数量是政变时与贵族妥协的产物。中央决定以‘革命觉悟不足’为由，对这批干部进行大规模撤换。"
 YSS_focus_24: "调查规模扩大化"
 YSS_focus_24_desc: "仅撤换地方干部远不足以撼动贵族-官僚同盟。将调查范围从军队与政府扩大到教育界、出版界、甚至贵族子弟学校。凡有勾结封建势力嫌疑者，一律审查。"
 YSS_focus_25: "限制内务部职权"
 YSS_focus_25_desc: "中央应适时收回内务部的无限调查权，防止其沦为个人报复工具。清洗应止于病灶，而非蔓延全身。"
 YSS_focus_26: "彻查内部敌人"
 YSS_focus_26_desc: "利用扩大的调查网络，中央调查委员会开始对各省王公领地内的党组织进行突击式清剿。许多隐藏极深的旧帝国暗桩在这一轮中将被连根拔起。"
 YSS_focus_28: "肃清不合因素"
 YSS_focus_28_desc: "只要你对苏维埃不利，或者你想要对苏维埃不利，那你就要被清除！"
 YSS_focus_29: "于是清洗开始了"
 YSS_focus_29_desc: "大清洗最终演变为一场席卷联盟上下的政治风暴。军委、内务部、中央调查委员会三位一体，向一切‘不纯洁的党组织’发起总攻。"
 YSS_focus_30: "紧急叫停"
 YSS_focus_30_desc: "清洗已波及许多无辜的基层党员。必须立即下令停止盲目扩大，防止自我吞噬。"
 YSS_focus_31: "将负责人撤职"
 YSS_focus_31_desc: "为了向党内外的恐慌情绪负责，中央决定将主导扩大化清洗的内务部负责人及调查委员会部分激进成员撤职调离。这是保全联盟制度完整性的必要牺牲。"
 YSS_focus_32: "平反冤假错案"
 YSS_focus_32_desc: "中央成立专门委员会重新审理被清洗者的案件。凡证据不足或属诬告者，予以平反昭雪、恢复党籍。"
 YSS_focus_33: "二三计划到达尾声"
 YSS_focus_33_desc: "第二个三年计划即将结束。中央统计委员会汇总了各行业数据。这份总结既是成绩单，也是问题清单。"
 YSS_focus_34: "来自国家经济统筹委员会的报告"
 YSS_focus_34_desc: "国家经济统筹委员会提交了一份详尽的经济结构分析。"
 YSS_focus_35: "关于地方建设的报告"
 YSS_focus_35_desc: "地方建设报告充满了令人不安的数据。"
 YSS_focus_36: "建设当中的实际问题"
 YSS_focus_36_desc: "我们的建设水平普遍落后，这对我们的工作造成了很大的影响。"
 YSS_focus_37: "混乱的具体流程"
 YSS_focus_37_desc: "从中央拨款到地方落实，中间经过了至少五层转手。每一层都截留一部分，最终到达工地的资金往往不足预算的六成。流程混乱不仅浪费资源，更腐蚀了基层对中央的信任。"
 YSS_focus_38: "杂乱无章的交通网络"
 YSS_focus_38_desc: "联盟的铁路与公路多建于帝国时期，以亚的斯亚贝巴为中心呈放射状，却缺少横向联络线。王公们各自为政修建的窄轨支线更是让物资调度举步维艰。"
 YSS_focus_39: "偷工减料的建筑工程"
 YSS_focus_39_desc: "调查委员会抽查了十二处在建工程，发现其中九处存在使用劣质建材或缩减设计规格的问题。承包商多为贵族亲戚，工程验收形同虚设。"
 YSS_focus_40: "不配合的地方官僚"
 YSS_focus_40_desc: "部分地方官僚公开抵触中央调查组，以‘地方特殊性’为由拒绝提供账目。他们背后往往站着当地王公。"
 YSS_focus_41: "向着胜利迈步"
 YSS_focus_41_desc: "虽然前路漫长，但联盟已经有了清晰的经济改革路线图。现在是时候正式吹响第三个三年计划的号角了。"
 YSS_focus_42: "开展第三个三年计划"
 YSS_focus_42_desc: "在总结教训、诊断问题的基础上，中央正式发布《第三个三年计划指导纲要》。核心目标为：将分散的小农经济纳入集体农庄体系、将失控的外贸渠道收归国家统筹委员会管理，并在国防、轻工、农业三大领域设定量化指标。"
 YSS_focus_43: "改组政治局"
 YSS_focus_43_desc: "原有的政治局组成已无法反映新的权力格局。部分旧委员被撤职或调离，调查委员会骨干及留洋军官团中的激进派亟待补入。本次改组将彻底打破贵族—官僚同盟在最高决策层中的残余影响。"
 YSS_focus_44: "召开政治局会议"
 YSS_focus_44_desc: "新组成的政治局首次召开全体会议。议程包括：听取大清洗总结报告、确认各省新干部任命名单、以及审议关于‘党性’的理论修订提案。这次会议标志着联盟权力中枢的正式重置。"
 YSS_focus_45: "对于党性的重新定义"
 YSS_focus_45_desc: "经过实践检验，旧的‘出身论’与‘阶级成分’标准已不足以应对当前复杂的革命环境。中央委员会提出新党性定义：以‘对联盟的绝对忠诚、对封建残余的彻底决裂、对群众路线的切实贯彻’为核心标准，不再单纯以家庭出身作为评判依据。"
 YSS_focus_46: "国防工业人民委员部"
 YSS_focus_46_desc: "在第三个三年计划框架下，中央决定成立独立的国防工业人民委员部，统一管理所有与军工生产相关的工厂、设计局与原材料供应。"
 YSS_focus_47: "轻工业人民委员部"
 YSS_focus_47_desc: "为改善民众生活、减少对进口消费品依赖，中央设立轻工业人民委员部，统筹纺织、食品加工、日用品制造等产业。同时，它也被赋予‘为大工业积累资金’的次要使命。"
 YSS_focus_48: "农业人民委员部"
 YSS_focus_48_desc: "农业是联盟最庞大也最滞后的部门。新成立的农业人民委员部将负责推动集体化、推广农业技术、并建立从田间到餐桌的粮食管理体系。它的成败直接关系到三年计划能否站稳脚跟。"
 YSS_focus_49: "国防工业的合理组织"
 YSS_focus_49_desc: "当前军工生产分散在十七个省的六十余家大小工厂中，缺乏统一的技术标准与生产调度。国防工业人民委员部的首要任务，就是绘制一份完整的军工产能地图，并确立分级管理体系。"
 YSS_focus_50: "清理国防工业乱象"
 YSS_focus_50_desc: "普查结果显示：大量军工合同被转包给贵族关联企业，这些‘皮包工厂’既无设备也无技术，仅靠关系截留经费。必须将这些寄生环节彻底斩断。"
 YSS_focus_51: "轻工业的技术基础"
 YSS_focus_51_desc: "联盟的轻工业仍以手工作坊为主，缺乏现代化机械设备。轻工业人民委员部计划从国外采购一批纺织机与食品加工设备，并建立技术培训中心，培养本土技术工人。"
 YSS_focus_52: "提高劳动效率"
 YSS_focus_52_desc: "通过工时研究、工序优化与计件工资制试点，轻工业人民委员部试图在不增加设备的情况下，将现有工人的日均产出提升30%。"
 YSS_focus_53: "呼吁集体农庄"
 YSS_focus_53_desc: "小农经济的分散性严重制约了农业生产力。农业人民委员部发出号召：鼓励农民以村为单位组建集体农庄，共享耕牛与农具、统一规划种植品种、集体应对市场风险。"
 YSS_focus_54: "一万拖拉机计划"
 YSS_focus_54_desc: "机械化是农业现代化的前提。农业人民委员部提出雄心勃勃的‘一万拖拉机计划’——在三年内为本国农业提供一万台拖拉机，替代传统的牛耕与人力耕作。"
 YSS_focus_55: "红军装备改进局"
 YSS_focus_55_desc: "现有陆军装备多为一战时期帝国军队遗留的老旧型号，空军更是缺乏任何自主研发能力。装备改进局将联合各设计所，制定一代新型步枪、火炮与侦察飞行器的技术指标。"
 YSS_focus_56: "严打国防工业中的懒惰主义"
 YSS_focus_56_desc: "清理外部寄生虫之后，内部的问题同样触目惊心：工人迟到早退、管理人员消极怠工、工程师敷衍了事。中央决定将‘懒惰主义’列为国防工业的头号敌人，开展全国性劳动纪律整顿。"
 YSS_focus_57: "总军事建设局"
 YSS_focus_57_desc: "为整合分散的军工生产能力，中央决定成立总军事建设局，直属国防工业人民委员部。该局负责规划新兵工厂选址、扩建现有车间、并建立统一的后勤保障体系。"
 YSS_focus_58: "成立质量监察委员会"
 YSS_focus_58_desc: "在清理与整顿之后，必须建立长效机制防止质量滑坡。质量监察委员会将向每一家兵工厂派驻独立监察员，拥有‘一票否决’的权力——任何不合格产品不得出厂。"
 YSS_focus_59: "引入标准化生产概念"
 YSS_focus_59_desc: "此前各兵工厂各自为政，同一款步枪的零件竟互不通用。标准化生产的引入，要求所有军工企业统一图纸、统一量具、统一检验标准，这是迈向现代军工体系的关键一步。"
 YSS_focus_60: "整顿生产纪律"
 YSS_focus_60_desc: "纪律整顿从道德号召升级为制度约束。新的生产纪律条例规定：旷工者扣发配给、延误节点者追究责任、弄虚作假者送交军事法庭。纪律是国防工业的生命线。"
 YSS_focus_61: "工厂设备的适应化改进"
 YSS_focus_61_desc: "进口设备与本地原材料之间存在不匹配问题。工程师们正在对纺织机进行本土化改造，使其能够处理埃塞俄比亚本地棉花品种，减少对进口原棉的依赖。"
 YSS_focus_62: "树立先进生产模范"
 YSS_focus_62_desc: "在劳动竞赛中涌现出的优秀工人，被授予‘劳动英雄’称号。他们的照片张贴在工厂车间，他们的工作方法被编写成手册推广。榜样的力量正在改变车间里的风气。"
 YSS_focus_63: "学习流水线模式"
 YSS_focus_63_desc: "参观过欧洲工厂的留洋工程师带回了一种全新的生产组织方式——流水线。在罐头厂与纺织厂率先试点后，这一模式被证明可以大幅提高产出并降低培训成本。"
 YSS_focus_64: "试验工会民主制度"
 YSS_focus_64_desc: "在提高效率的同时，中央也希望探索一条不同于旧帝国‘家长制’管理的新路。部分工厂试点成立工会委员会，工人代表参与生产计划制定与福利分配决策。"
 YSS_focus_65: "制定生产任务"
 YSS_focus_65_desc: "根据三年计划纲要，轻工业人民委员部向各省工厂下达了年度生产指标。指标既要体现雄心，也必须考虑各厂实际条件——历史教训告诉我们，脱离实际的任务只会催生造假。"
 YSS_focus_66: "宣扬保尔·柯察金精神"
 YSS_focus_66_desc: "在苏联文学的影响下，中央宣传部门将‘保尔·柯察金’塑造为联盟工人阶级的精神偶像——面对困难永不屈服、将全部生命奉献给社会主义建设。青年工人中掀起了‘向保尔学习’的运动。"
 YSS_focus_67: "成立农产品合作社"
 YSS_focus_67_desc: "为改善农民的市场地位，中央鼓励成立农产品合作社，由合作社统一收购粮食与经济作物，以集体议价方式与城市工厂进行交易，减少中间商盘剥。"
 YSS_focus_68: "燃料与化学工业的推进"
 YSS_focus_68_desc: "农业现代化离不开化肥与燃料。农业人民委员部与重工业部门协调，加速建设小型化肥厂与农用燃油供应站，确保‘一万拖拉机计划’不因缺油而落空。"
 YSS_focus_69: "管控市场价格"
 YSS_focus_69_desc: "粮食价格的大幅波动不仅伤害农民，也威胁城市工人的生活。中央决定对主要粮食与经济作物实行价格指导制度，防止投机商囤积居奇。"
 YSS_focus_70: "建立国家粮食安全储备"
 YSS_focus_70_desc: "在二三计划期间，多次区域性歉收暴露了联盟缺乏应急粮食储备的致命弱点。国家粮食安全储备的需要要求各省按年产量比例向中央上交储备粮，专用于灾荒与战时。"
 YSS_focus_71: "农庄夜校"
 YSS_focus_71_desc: "为了让集体农庄的农民掌握现代农业知识，农业人民委员部将在各地开办夜校，教授作物轮作、病虫害防治、农具保养等实用技能。识字教育也被纳入课程。"
 YSS_focus_72: "成立国家动员委员会"
 YSS_focus_72_desc: "随着国防、轻工、农业三大领域的建设进入深水区，跨部门协调问题日益突出：军工需要钢材，轻工也需要钢材；农业需要拖拉机，但发动机产能被国防工业占用。为解决这种‘各自为战’的困境，中央决定成立超越各人民委员部的国家动员委员会，由总书记同志直接领导，负责统筹资源配置、协调生产矛盾、并对各分支进度进行统一考核。"
 YSS_focus_73: "国防工业正在跃进"
 YSS_focus_73_desc: "经过系统的整顿、标准化与质量监察体系建设，国防工业终于交出了一份令人振奋的答卷：主要兵工厂的产能比整顿前提升近一倍，产品质量也通过了新监察委员会的验收。"
 YSS_focus_74: "轻工业的辉煌成就"
 YSS_focus_74_desc: "从手工作坊到流水线、从依赖进口到本土化生产，轻工业人民委员部在三年内让联盟的日用消费品产量翻了一番。工人们穿上了更好的制服、食堂里有了更丰富的食品。"
 YSS_focus_75: "农业的历史性跨越"
 YSS_focus_75_desc: "尽管集体农庄的推进充满阻力、拖拉机的数量也远未达标，但农业人民委员部在粮食产量、合作社覆盖面与农民教育方面仍取得了历史性突破。联盟第一次有了初步的粮食安全底线。"
 YSS_focus_76: "完成第三个三年计划"
 YSS_focus_76_desc: "三大分支的成就共同汇聚成一份沉甸甸的答卷。尽管与理想目标仍有差距，但联盟的经济面貌已发生根本性改变：国家经济统筹委员会真正掌握了国民经济的主导权，小农经济与失控外贸被统合进统一规划体系，联盟正逐渐走向未来！"
 YSS_focus_77: "紧急预案动员计划"
 YSS_focus_77_desc: "和平建设固然重要，但周边列强的军事存在始终是悬在联盟头顶的利剑。中央决定在完成三年计划的基础上，制定一套全面战时动员预案，涵盖工业转产、人力征调与物资储备。"
 YSS_focus_78: "强调装备水平优越性"
 YSS_focus_78_desc: "通过国防工业的整顿与标准化改革，联盟已具备生产一定数量现代化装备的能力。但这远远不够。我们的装备要不逊于任何潜在对手。"
 YSS_focus_79: "对战时生产进行预演"
 YSS_focus_79_desc: "将部分民用工厂转入半军工状态进行演练，测试工业体系在紧急状况下的转产速度与协调能力。这是一次不带动员令的动员预演。"
 YSS_focus_80: "限制出口"
 YSS_focus_80_desc: "为确保战时物资自给，中央决定对粮食、燃油、金属原料等战略物资实施出口配额管制。"
 YSS_focus_81: "建立国家物资仓库"
 YSS_focus_81_desc: "在各省交通枢纽与隐蔽山区，中央开始修建一批永久性物资仓库，储存粮食、药品、燃料与备件。这些仓库将成为战时联盟的‘血管’。"
 YSS_focus_82: "成立枪支弹药局"
 YSS_focus_82_desc: "为统一管理战时弹药生产与分配，中央从国防工业人民委员部分离出枪支弹药局，专责弹药标准化、产量规划与前线补给测算。"
 YSS_focus_83: "资源预储备规划局"
 YSS_focus_83_desc: "除了成品物资，原材料同样需要预储备。新成立的资源预储备规划局将负责梳理全国矿藏、森林与水力的分布，并制定战时优先开采清单。"
 YSS_focus_84: "战时疏散规划"
 YSS_focus_84_desc: "一旦战争爆发，边境地区的工厂与人口必须向内地转移。交通人民委员部与国防工业人民委员部联合制定了详细的疏散路线图与优先顺序表。"
 YSS_focus_85: "后备人力局"
 YSS_focus_85_desc: "战争不仅需要装备，也需要人。后备人力局负责登记所有适龄公民的技能、职业与健康状况，建立战时人力调配数据库。"
 YSS_focus_86: "对军工生产基地进行统合"
 YSS_focus_86_desc: "将分散在十七省的军工企业按地理与产品类型重组为若干大型生产基地，每个基地拥有完整的生产链与独立供电供水系统，增强抗打击能力。"
 YSS_focus_87: "对战时财政进行推算"
 YSS_focus_87_desc: "战争将是财政的黑洞。财政部提交了多套战时财政模型，估算不同战争规模下的开支、通胀与税收极限，为中央决策提供数据支撑。"
 YSS_focus_88: "调整现有工业布局"
 YSS_focus_88_desc: "根据疏散规划与生产基地重组的成果，中央对全国工业布局进行了最后调整：将关键企业从亚的斯亚贝巴等易受攻击的地区向南部与西部山区转移，新建工厂优先选址在内陆交通枢纽。"
 YSS_focus_89: "专注国内事务"
 YSS_focus_89_desc: "外部世界的纷争固然引人注目，但联盟的根本问题在于内部。马里亚姆同志指出：只有先把国内的人心与阵地巩固好，联盟才有资格在国际舞台上发声。"
 YSS_focus_90: "进军文艺圈"
 YSS_focus_90_desc: "旧帝国的文艺界仍被封建贵族资助的诗人、画家与音乐家所主导。中央决定向文艺领域注入革命血液，扶持一批出身工农的青年艺术家，创作讴歌劳动与革命的作品。"
 YSS_focus_91: "群众工作必须抓紧"
 YSS_focus_91_desc: "许多地方党委将群众工作视为‘次要任务’，重生产轻宣传、重指标轻人心。中央发出指示：群众工作是一切工作的基础，必须从工厂到农村、从学校到军营全面铺开。"
 YSS_focus_92: "核心思想不能动摇"
 YSS_focus_92_desc: "在文化教育大革命的基础上，中央重申马克思主义的核心指导地位。任何试图用‘传统习俗’或‘宗教教义’替代革命理论的倾向，都必须被坚决纠正。"
 YSS_focus_93: "关于国际形势变化的报告"
 YSS_focus_93_desc: "联共布在欧陆的扩张、圣杯王国在非洲的殖民巩固、以及南美大陆日益高涨的革命浪潮，共同构成了联盟必须面对的外部环境。"
 YSS_focus_94: "当前红海军的窘境"
 YSS_focus_94_desc: "中央海军委员会提交了一份令人沮丧的报告——如果不采取根本性措施，联盟将在可预见的未来彻底丧失制海权。"
 YSS_focus_95: "对于红军航空兵部队的有关报告"
 YSS_focus_95_desc: "针对当前红军航空兵部队现状的初步调查报告，是后续所有空军调查、整顿工作的开端。"
 YSS_focus_96: "人民军队的第二十六个年头"
 YSS_focus_96_desc: "联盟红军已走过二十六年风雨。从1914年政变时的学生军与起义士兵，到今天名义上数十万人的正规武装，这支部队承载着革命的火种。"
 YSS_focus_97: "人民歌舞团"
 YSS_focus_97_desc: "中央决定组建一支国家级人民歌舞团，巡回演出于城市与乡村。其节目以民间曲调填新词、以革命故事编舞蹈，将红色价值观以大众喜闻乐见的形式传遍联盟。"
 YSS_focus_98: "电影行业的努力"
 YSS_focus_98_desc: "电影是教育群众最有力的工具之一。中央电影局计划拍摄三部反映联盟建设成就的纪录片与一部革命历史故事片，用光影记录时代、用银幕传播思想。"
 YSS_focus_99: "妇女能顶半边天"
 YSS_focus_99_desc: "旧帝国时期，女性被排除在公共生活之外。联盟成立以来，虽在法律上赋予女性平等权利，但实际生活中歧视仍普遍存在。中央将发起妇女运动，鼓励女性走出家庭、参与生产、进入学校和政府。"
 YSS_focus_100: "新一代的共产党员"
 YSS_focus_100_desc: "随着文化教育大革命的推进，第一批在联盟体制下成长起来的年轻人即将进入社会。他们接受的是革命教育、目睹的是建设成就，他们是联盟的未来。如何培养并吸收这批‘新一代’入党，是组织工作的重中之重。"
 YSS_focus_101: "关于建立共青团的报告"
 YSS_focus_101_desc: "青年人需要有自己的组织。中央青年工作委员会提交了一份关于建立‘联盟共产主义青年团’的详细方案，旨在将14至25岁的先进青年纳入统一组织，接受政治训练与社会实践。"
 YSS_focus_102: "革命要从幼儿开始"
 YSS_focus_102_desc: "思想阵地要从娃娃抓起。中央教育部与青年工作委员会联合推出‘红色幼儿园’计划，在教材中融入革命故事、在游戏中植入集体主义精神，从幼儿阶段就开始塑造社会主义新人。"
 YSS_focus_103: "年轻的党政干部生力军"
 YSS_focus_103_desc: "随着共青团的建立与新一代党员的涌现，中央开始有计划地选拔30岁以下的优秀青年进入各级党委和政府机关任职。这些年轻人没有旧帝国的包袱，对革命事业充满热忱，正在成为党政体系中最活跃的生力军。”"
 YSS_focus_104: "不断革命论"
 YSS_focus_104_desc: "革命不是一次性的行动，而是永不停歇的过程。总书记同志在青年干部会议上提出‘不断革命论’：阶级斗争与思想改造没有终点，每一代人都必须在自己的时代完成属于自己的革命任务。"
 YSS_focus_105: "关于社会主义现实主义的报告"
 YSS_focus_105_desc: "联盟必须以‘社会主义现实主义’为根本方法——既要真实反映社会矛盾与劳动人民的生活，又要以积极向上的革命精神指引未来。"
 YSS_focus_106: "尝试打破外交僵局"
 YSS_focus_106_desc: "联盟成立以来，除少数兄弟党外，绝大多数国家拒绝承认我们的合法性。这种外交孤立状态不仅限制了贸易，也让我们在边境争议中处于被动。中央决定主动出击，向主要势力发出外交照会，试探破局可能。"
 YSS_focus_107: "我们在兄弟党中的地位"
 YSS_focus_107_desc: "在国际共产主义运动中，联盟是一个年轻且遥远的成员。联共布如何看待我们？是将我们视为非洲之角的革命前哨，还是仅仅看作一个无关紧要的边陲政权？这份内部评估将帮助我们定位自己在国际左翼阵营中的真实位置。"
 YSS_focus_108: "再度与圣杯交涉"
 YSS_focus_108_desc: "我们的周边几乎全是圣杯王国的殖民领地，如果我们想要搞好外交，就绕不开这个资本主义头目。"
 YSS_focus_109: "来自异族的威胁"
 YSS_focus_109_desc: "一个被长期忽视的问题浮出水面：德意志地区的非人种族正在酝酿着惊人的谋划，南美的混沌帝国正在吞噬着人类文明的一切。我们势必要作出回应。"
 YSS_focus_110: "再次联系联共布"
 YSS_focus_110_desc: "中央决定向俄罗斯共产党发出正式联络函件，表达联盟的意愿，并请求技术援助与政治承认。这封信件的后续将显示如何莫斯科看待我们。"
 YSS_focus_111: "严峻的革命形势"
 YSS_focus_111_desc: "世界上的社会主义国家屈指可数，如果我们不做点什么，那么国际革命形势将彻底暗淡。"
 YSS_focus_112: "支援南美的同志"
 YSS_focus_112_desc: "远在南美洲的野火革命军正面临政府军与外国干涉势力的联合围剿。作为社会主义的一员，联盟有义务在力所能及的范围内提供援助。虽然联盟自身并不富裕，但国际主义义务不容推辞。"
 YSS_focus_113: "加入第三国际"
 YSS_focus_113_desc: "经过反复外交斡旋，联共布终于向联盟发出正式邀请——承认联盟为第三国际在非洲之角的正式成员。"
 YSS_focus_114: "达成共识"
 YSS_focus_114_desc: "在与圣杯代表团的进一步会谈中，双方就非洲之角的前景、殖民斗争协调以及经济互助安排达成了系列共识。这将是我们融入世界的一次伟大尝试。"
 YSS_focus_115: "过去领土的有关问题"
 YSS_focus_115_desc: "圣杯王国在红海沿岸拥有多处殖民据点，其中部分领土在阿克苏姆帝国时期的文献中明确记载为帝国法理疆域。中央决定以外交渠道重启领土谈判，尝试以经济补偿或贸易特权换取部分土地的归还。"
 YSS_focus_116: "军事检查刻不容缓"
 YSS_focus_116_desc: "中央调查委员会与内务部联合派出十二个检查组，分赴各大军区与独立部队，进行为期三个月的突袭式检查。目标是摸清红军的真实家底——究竟有多少兵、多少枪、多少能打仗的部队。"
 YSS_focus_117: "红军中的严重错误思想"
 YSS_focus_117_desc: "检查组在多个部队发现了令人震惊的思想状况：部分军官公开质疑苏维埃体制、怀念帝国时期的‘秩序与荣耀’；另一些则陷入军阀式的‘山头主义’，将部队视为个人私产。这些错误思想正在侵蚀红军的根基。"
 YSS_focus_118: "军事改革一塌糊涂"
 YSS_focus_118_desc: "过去十二年间的多次军改，非但没有增强战斗力，反而制造了大量重叠的指挥机构与混乱的编制序列。三个军区竟有七种不同的编制表，同一番号的部队在不同文件中兵力相差三倍。"
 YSS_focus_119: "中央下驻特派员"
 YSS_focus_119_desc: "面对检查发现的触目惊心的问题，中央决定向各大军区派遣常驻特派员，拥有直接向政治局报告的‘特别通讯权’。特派员不干涉日常指挥，但有权调阅任何财务与人事档案。"
 YSS_focus_120: "消灭官僚主义恶习"
 YSS_focus_120_desc: "检查组汇总的报告中，‘文山会海、推诿扯皮、报表造假’成为高频词。一些指挥部里，参谋们忙于填写没有意义的统计表格，却无人关心士兵是否领到了军装。"
 YSS_focus_121: "扫清形式主义迷雾"
 YSS_focus_121_desc: "阅兵式上的正步走得再整齐，也掩盖不了实战中的无能。检查组发现，多支部队的‘训练记录’纯属编造，实弹射击次数不及纸面记载的十分之一。形式主义已成为掩盖无能的保护伞。"
 YSS_focus_122: "改组各级军事机关"
 YSS_focus_122_desc: "检查暴露了军事机关的重叠与臃肿。中央决定对总参谋部、各军区司令部及师级指挥机构进行精简重组，撤销多余岗位，合并职能重叠的部门。"
 YSS_focus_123: "我们在政治工作上的失败"
 YSS_focus_123_desc: "政治工作的真空让错误思想与山头主义有机可乘。必须承认，我们在政治工作上负有不可推卸的责任。"
 YSS_focus_124: "空有斗志的红军"
 YSS_focus_124_desc: "检查发现，基层士兵的革命热情并未消退——许多人仍相信联盟的事业。但他们的斗志被浪费在无休止的队列操练与工地劳动上，而非真正的军事训练。有斗志而无技能，这是红军最尴尬的处境。"
 YSS_focus_125: "严重漏缺的各式装备"
 YSS_focus_125_desc: "清点结果令人震惊：账面上的数据显示，很多部队有几乎完全没有火炮；枪支数量不足编制的一半。装备缺额之大，已到了威胁国家安全的地步。"
 YSS_focus_126: "补救十二年军改光阴"
 YSS_focus_126_desc: "过去十二年的军改非但没有解决问题，反而制造了新的混乱。现在需要的不再是‘小修小补’，而是彻底推翻那些失败的改革方案，从零开始重新设计红军的组织架构与建设路径。"
 YSS_focus_127: "关于重建红军内部思想教育的条令"
 YSS_focus_127_desc: "思想是军队的灵魂。新条令规定：每周必须安排不少于四个课时的政治学习，内容涵盖马克思主义基本原理、联盟革命史与当前国际形势。政治学习将与军事训练同等重要。"
 YSS_focus_128: "对各个军区进行整顿"
 YSS_focus_128_desc: "根据调查报告列出的问题，中央向各军区下达限期整改令：三个月内完成人员重新登记、资产清查与编制核定。拒不配合的军区主官将被撤职。"
 YSS_focus_129: "全力补足装备空缺"
 YSS_focus_129_desc: "国防工业人民委员部接到紧急任务：优先为红军生产步枪、机枪与弹药。同时，中央从国库中拨出专款，向国外采购一批急缺的火炮与通信设备。"
 YSS_focus_130: "恢复政委制度"
 YSS_focus_130_desc: "中央正式下令：在所有团级以上单位恢复政治委员制度。政委与军事主官共同负责部队建设，享有对重大决策的否决权，确保党对军队的绝对领导。"
 YSS_focus_131: "杜绝应付式工作"
 YSS_focus_131_desc: "过去的军改常常以‘应付检查’告终——检查组一走，一切照旧。中央宣布：本次军改将建立长效监督机制，特派员转为常设岗位，定期复查整改进度。"
 YSS_focus_132: "全方面重组计划"
 YSS_focus_132_desc: "在军区整顿与装备补缺的基础上，中央批准了红军的全面重组方案：撤销所有虚设番号，将实有兵力重新编组为若干齐装满员的师与旅。重组后的编制将统一化、标准化。"
 YSS_focus_133: "对装甲部队重新定义"
 YSS_focus_133_desc: "联盟现有的装甲部队仅有少量老旧坦克，且分散配属给步兵师，从未形成拳头力量。新构想要求集中所有装甲力量，组建独立坦克旅，作为战役突破的尖刀。"
 YSS_focus_134: "将炮兵下放到基干"
 YSS_focus_134_desc: "过去炮兵过于集中，师级以下部队几乎得不到直接火力支援。新编制将部分炮兵下放到团营级，确保基层部队在战斗的第一时间就能获得炮火掩护。"
 YSS_focus_135: "政委介入战时指挥"
 YSS_focus_135_desc: "在恢复政委制度的基础上，中央进一步明确：战时政委不仅负责政治工作，还必须参与作战决策——特别是涉及部队士气、撤退与俘虏处理等涉及政治影响的决定。"
 YSS_focus_136: "直接应用党政干部"
 YSS_focus_136_desc: "为解决军中文职干部严重不足的问题，中央决定从各级党委和政府机关中抽调一批有经验的党政干部，经短期军事培训后补充到部队的政治工作岗位上。"
 YSS_focus_137: "改革总参谋部"
 YSS_focus_137_desc: "旧总参谋部长期被贵族出身的军官把持，热衷于纸上谈兵的‘大陆军学’，对联盟的实际国情与红军的真实能力缺乏了解。中央决定对总参谋部进行彻底改组，引入熟悉现代战争的新生代。"
 YSS_focus_138: "摒弃固有军事教条"
 YSS_focus_138_desc: "我们要全面摒弃照搬欧洲列强的陈旧教条。一切战术原则必须基于实际地理与兵力条件重新制定。"
 YSS_focus_139: "关于合成兵种的报告"
 YSS_focus_139_desc: "经过重组后的红军首次具备了合成作战的雏形——步兵、炮兵、装甲兵与工兵开始在同一编制内协同训练。总参谋部提交的这份报告，总结了第一次合成兵种演习的经验与教训。"
 YSS_focus_140: "政委逐级监督"
 YSS_focus_140_desc: "为确保军改措施在基层不折不扣落实，建立政委逐级监督制度：师政委监督团政委、团政委监督营教导员、营教导员监督连指导员，一级盯一级，形成闭环。"
 YSS_focus_141: "党员发挥先锋队作用"
 YSS_focus_141_desc: "在各级政委的组织下，军中党员被要求佩戴党徽、在训练与战斗中带头冲锋。党员突击队成为红军中最具战斗力的单元，他们的表现直接影响着普通士兵对党的信心。"
 YSS_focus_142: "大型军事演习"
 YSS_focus_142_desc: "经过一年多整顿与重组，中央决定举行联盟成立以来规模最大的军事演习。演习将检验新编制、新装备与新战术的实战效能，同时向周边国家展示红军的崭新面貌。"
 YSS_focus_143: "新型机械化部队的应用"
 YSS_focus_143_desc: "从国外引进的装甲车与牵引式火炮，与国产卡车完成了整合测试。机械化步兵营的机动速度与火力密度令军区主官们印象深刻。"
 YSS_focus_144: "设立红军后勤保障部门"
 YSS_focus_144_desc: "过去后勤保障由各部队自行解决，导致分配不均与贪腐频发。中央决定成立统一的红军后勤保障部门，负责全军物资采购、仓储、运输与分配，切断后勤领域的‘诸侯经济’。"
 YSS_focus_145: "焕然一新的红军"
 YSS_focus_145_desc: "经过调查、清理、重组与实战演练，联盟红军终于脱胎换骨：编制精简、装备充实、思想统一、指挥流畅。虽然与世界一流军队仍有差距，但已不再是当年那支徒有其表的‘纸面大军’。红军的重建，为联盟的安全提供了最坚实的保障。"
 YSS_focus_146: "海洋工业的欠缺"
 YSS_focus_146_desc: "联盟拥有修船坞和小型造船厂，可无一具备建造千吨以上舰艇的能力。关键配套产业——船用钢材、轮机、导航仪器——几乎完全依赖进口。没有自主的海洋工业体系，建设红海军就是一句空话。"
 YSS_focus_147: "地理环境的限制"
 YSS_focus_147_desc: "红海是一个狭窄而炎热的水域，夏季气温常超过40°C，对舰艇通风与船员耐力构成严峻考验。同时，联盟的海岸线缺乏天然深水良港，现有港口大多面临淤积问题，大型舰艇难以靠泊。"
 YSS_focus_148: "极为有限的财政预算"
 YSS_focus_148_desc: "在三年计划优先发展工业的背景下，海军所能分得的预算仅占国防总支出的不到百分之八。即便是维持现有老旧舰艇的日常运转，也时常因经费短缺而推迟维护。任何雄心勃勃的海军计划都必须面对预算的现实。"
 YSS_focus_149: "《1936年暂行红海军条令》"
 YSS_focus_149_desc: "中央海军委员会制定了《1936年暂行红海军条令》。这份条令放弃了不切实际的大舰队梦想，转而确立了‘近海防御、轻型为主、航空辅助’的现实方针。它将成为未来五年红海军建设的纲领性文件。"
 YSS_focus_150: "尽力完成造舰计划"
 YSS_focus_150_desc: "尽管预算有限，但新式舰艇不能不建，各造船厂开始按计划推进建造工作。"
 YSS_focus_151: "海军航空兵的尝试"
 YSS_focus_151_desc: "鉴于大型舰艇建造周期漫长且成本高昂，海军委员会提出一条替代路径：利用航空兵执行海上侦察与攻击任务，以相对低廉的成本弥补舰艇数量的不足。"
 YSS_focus_152: "简约式舰艇"
 YSS_focus_152_desc: "面对工业与预算的双重限制，海军设计师提出‘简约式舰艇’概念——降低航速要求、简化装甲防护、采用商用标准建造舰体，以牺牲部分性能换取可批量生产的能力。"
 YSS_focus_153: "成立海军航空部"
 YSS_focus_153_desc: "随着航空兵试点的推进，中央决定正式成立海军航空部，统一管辖海军所属的所有飞行单位。该部门将独立于空军航空体系运作，专注于海上侦察、反潜与对舰攻击。"
 YSS_focus_154: "要求更多预算"
 YSS_focus_154_desc: "随着造舰计划与海军航空建设的推进，现有预算已捉襟见肘。海军委员会向中央提交了一份请求书，要求将海军预算在国防总支出中的比例从百分之八提升至百分之十五。"
 YSS_focus_155: "新式航母研发"
 YSS_focus_155_desc: "海军委员会提出了一个更具雄心但同样务实的设想：利用现有商船船体，改建一艘简易航空母舰——不追求正规航母的完整性能，但能为舰队提供最基本的空中掩护与侦察能力。"
 YSS_focus_156: "勉强够用的红海军"
 YSS_focus_156_desc: "经过三年努力，红海军终于成长为一支‘勉强够用’的近海防御力量。虽然与世界列强的远洋舰队相比依然不值一提，但至少，联盟的领海不再是不设防的空白地带。"
 YSS_focus_157: "只剩滚木的空军"
 YSS_focus_157_desc: "调查结果令人震惊：所谓的红空军早已名存实亡。大量机场只剩下废弃的‘滚木’般的破旧机身，整体战斗力趋近于零。"
 YSS_focus_159: "不称职的军官"
 YSS_focus_159_desc: "空军内部充斥着大量不称职的军官，他们缺乏现代空战指挥能力，严重阻碍了部队的发展。"
 YSS_focus_160: "空无一物的库存"
 YSS_focus_160_desc: "空军的武器装备库存实际上已经空无一物，连最基本的零件和油料补给都难以维持，更不要说作战飞机了。"
 YSS_focus_161: "空军中的破坏分子"
 YSS_focus_161_desc: "频繁发生的非战斗损失引起了政治局的注意，揭露了隐藏在空军内部的破坏分子正在蓄意制造事故、破坏设施。"
 YSS_focus_162: "联盟空军人民委员会成立"
 YSS_focus_162_desc: "为了统一指挥和统筹管理，中央决定成立联盟空军人民委员会，全权负责空军的清理、整顿与重建工作。"
 YSS_focus_158: "玄学训练法"
 YSS_focus_158_desc: "现有的飞行员训练方法极其落后，甚至带有浓厚的迷信与‘玄学’色彩。亟需引入现代化的科学训练体系，提升飞行员的实战素质。"
 YSS_focus_163: "整顿航空兵部队内部"
 YSS_focus_163_desc: "委员会决定首先从内部纪律抓起，严明军纪，肃清腐败与懒散之风，重塑空军的纪律性。"
 YSS_focus_164: "侦破空军阴谋"
 YSS_focus_164_desc: "我们必须彻底侦破隐藏极深的空军阴谋，揪出破坏分子背后的组织网络。"
 YSS_focus_165: "努力重建空军"
 YSS_focus_165_desc: "在整顿内部的同时，着手从人员和装备上努力重建空军，使其恢复最基本的作战效能。"
 YSS_focus_166: "将不务正业的干部撤职"
 YSS_focus_166_desc: "坚决将那些不务正业、占据高位却毫无作为的干部撤职查办，将关键岗位让位给真正有能力的人才。"
 YSS_focus_167: "从外国采购先进战机"
 YSS_focus_167_desc: "鉴于国内工业基础薄弱，委员会决定暂时从国外采购先进战机，以快速弥补当前战斗力的空白。"
 YSS_focus_168: "支持自主研发战斗机"
 YSS_focus_168_desc: "在引进国外技术的同时，必须大力支持自主研发战斗机，为空军的长远发展和真正的独立自主奠定基础。"
 YSS_focus_169: "全面扫荡空军系统里的反革命"
 YSS_focus_169_desc: "为了保障重建工作的彻底性，必须在整个空军系统内进行一次全面扫荡，将隐藏的所有反革命分子一网打尽。"
 YSS_focus_170: "建立航空师团"
 YSS_focus_170_desc: "在获得新式战机之后，着手重新编制并建立航空师团，搭建起红空军完整的作战体系和编制结构。"
 YSS_focus_171: "重新展翅的红空军"
 YSS_focus_171_desc: "经历了艰难的蜕变和痛苦的洗礼，红空军终于摆脱了阴影，重新展翅翱翔，即将成为一支保卫联盟的空中铁拳。"
