l_simp_chinese:
 9_focus_1: "十字路口"
 9_focus_1_desc: "我们正处在革命的十字路口，接下来的路该怎么走，怎么样才能不摔跟头，这是我们贻需解决的问题。"
 9_focus_2: "清扫遗毒"
 9_focus_2_desc: "旧自治领的官僚体系严重阻碍了民主制度的推广，如果我们想要有所作为，就该把“屋子”打扫干净。"
 9_focus_3: "正式确立政体"
 9_focus_3_desc: "共和国是什么样的？我们的政体是什么？我们的政党在国家治理中起到了什么样的作用？这是我们要解释并确定的东西。"
 9_focus_4: "谁来治理乡村"
 9_focus_4_desc: "我们从未拥有基层治理经验，但我们不能放弃广大乡村，积极学习是重中之重！"
 9_focus_5: "新的国籍法"
 9_focus_5_desc: "我们发布了一项新的国籍法：凡在罗德西亚土地上出生或居住满三年者，不论种族、不论出身，自动获得共和国公民身份。旧殖民体系中被剥夺了身份的兽人，如今第一次在法律上拥有了完整的姓名。"
 9_focus_6: "土地改革"
 9_focus_6_desc: "富农们占据了绝大多数的土地，这对于我们的农业来说百害无益，应当劝说她们将部分土地交由国家重新分配。"
 9_focus_7: "民主监察委员会"
 9_focus_7_desc: "贪腐始终是新生共和国的一道难关，我们要做点什么，并且得让人民也能参与进来。"
 9_focus_8: "共同的黎明"
 9_focus_8_desc: "我们推翻了旧秩序。但新世界的图纸还是一片空白。而我们将带领信任我们的人民在这张纸上写下属于共和国的最好的答卷！"
 9_focus_9: "战争不是形容词"
 9_focus_9_desc: "关起门来固然好，但外面一直有人在敲共和国的大门。战争并未离我们而去。"
 9_focus_10: "提升单兵素质"
 9_focus_10_desc: "我们的军队看起来和刚放下锄头扛起枪的农民没什么两样，大元帅则发誓要改变这一切。"
 9_focus_11: "召集企业家"
 9_focus_11_desc: "我们是罗德西亚诸多势力中少有的与外界保持联系的人，因此企业家对于我国的重要性不言而喻。将这些企业家们聚集起来，一同为国家服务。"
 9_focus_12: "装甲兵训令"
 9_focus_12_desc: "我们的工厂完全有大规模生产坦克的能力，军队要胜任除了填线以外的工作。"
 9_focus_13: "联合戴姆勒工厂"
 9_focus_13_desc: "戴姆勒是我们最大的坦克生产公司，取得它的支持对我们的军队发展尤其重要。"
 9_focus_14: "短促突击"
 9_focus_14_desc: "短促突击是由巴伐利亚苏维埃共和国奥托·布劳恩将军提出的战术原则。 该战术主张在战斗中依托阵地和地形，集中兵力对敌人进行近距离快速攻击，元帅改进了这一战术，并将其确立为我军的基本战术，这将提升我军的战斗水平。"
 9_focus_15: "签订固有合同"
 9_focus_15_desc: "元帅将与这些企业签订固定额度的月度长期军火订单合同，这对双方都有巨大的好处，也同时增强了我们的国力。"
 9_focus_16: "武器的语言"
 9_focus_16_desc: "既然其他人乐意打生打死，那么共和国也要用坦克来和她们“说说话”了。"
 9_focus_17: "那窜篝火"
 9_focus_17_desc: "他们需要帮助。"
 9_focus_18: "送去粮食"
 9_focus_18_desc: "他们一定饿坏了吧。"
 9_focus_19: "送去武器"
 9_focus_19_desc: "干革命手里没有趁手的家伙可不行。"
