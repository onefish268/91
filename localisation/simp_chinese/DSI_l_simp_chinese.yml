# 殖民地事件
  ############################################################################################################
  ############################################################################################################

  SA_DSI_event.00000.t: "走马灯的回忆"
  SA_DSI_event.00000.d: "当海伦脖颈上的绞索被系紧时，她的思绪飘回了那个炙热的下午：当殖民者的剥削步步紧逼、生活不可避免地堕入地狱时，曾经对殖民者忍气吞声、逆来顺受的原住民，将她们长久以来积蓄的怒火倾泻了出来，她们拿出了平时劳作的工具，结成一支又一支起义军，向那些荷枪实弹的警察和军队展开了你死我活的战斗，今天的起义规模远超了以往，殖民者再也无法通过简单的鸣枪示威和朝人群射击来驱散群众，她们惊恐地面对汹涌的人潮却无能为力，最后被淹没其中，人们围在广场上庆祝着，庆祝她们攻陷了曾经不可一世的政府机构、解除了以往战无不胜的反革命武装。这样的思潮也深深影响着其他原住民，作为殖民地学校的老师——海伦在听说了起义的事情后，很快就自告奋勇加入其中，并作为宣传人员积极动员民众，并宣传革命形势。"
  SA_DSI_event.00000.a: "我们从未感到如此快乐……"

  SA_DSI_event.00001.t: "昙花一现的希望"
  SA_DSI_event.00001.d: "曾经叠加在原住民身上的苛捐杂税、种族限制等等规定全部废除，昔日繁荣但是排斥兽族的白人聚居区也可以被原住民随意进进出出了，农工们可以自己在种植园、矿场里面共同商议、并决定决策了，像海伦老师一样具备一定文化知识的原住民开始填补上白人官员消失所遗留下来的空白，曾经死气沉沉的城镇焕发出了从来没有过的生机与活力，这份快乐不再局限于小小的白人聚集区，生活在厂房之下、狭窄的集体宿舍之内和禁锢在“保留地”的原住民夺回了属于她们自己的权益。海伦仍旧在老师岗位上工作，但闲暇之余，她会以笔为剑，用生动的语言和充满希望的文字去写下一个又一个通俗易懂的童话故事，这些故事的原型发生在海伦周围每一天每一刻，但以往的她无法向自己的同胞们控诉这些悲剧，只能成为视而不见的沉默者。现如今，海伦将这些深埋在内心的悲剧写了出来并向其中倾注希望，让她们以喜闻乐见的童话故事展现在了人们面前，孩子们入迷地看，大人们则对其中的情节心领神会，并在心中发誓一定要把童话实现。"
  SA_DSI_event.00001.a: "我们曾经充满希望……"

  SA_DSI_event.00002.t: "熄灭的火焰"
  SA_DSI_event.00002.d: "然而，殖民地永远不会允许自己的领地上出现独立的火苗，因为从殖民秩序脱离的地区将会作为原住民的模范蛊惑民众学习，并且这些地区同样能作为火种去传染她们恐怖的革命思想，因此，罗德西亚政府无论如何都不会放过这些起义军的。这株试图驱散黑暗，传递温暖的火苗很快迎来了殖民者最为残酷的镇压和屠杀，很快，弱势的起义军被粉碎并撤出城镇，人们惊恐地透过门窗，看着阴森森的殖民者军队从天边压了过来，并最终出现在了她们面前，人们想要逃跑，但还是胆战心惊地在家里等待着殖民者对她们的残酷报复。"
  SA_DSI_event.00002.a: "恶毒的黑蟒缠住了城镇……"

  SA_DSI_event.00003.t: "丧心病狂的报复"
  SA_DSI_event.00003.d: "面对反抗殖民者、突袭白人聚居地的原住民，殖民者对原住民的报复可以说是无所不用其极，粗鲁的叫嚷声和破门声在一家又一家房屋前响起，老人和小孩被拖走、大人被刺刀驱赶至其他地方，许多人在家中、路上和集中营里虐杀以发泄殖民者们的怒火，殖民者还开始威胁起人群，任何的隐瞒和包庇都会招致她们最为残忍的报复，迫于屠刀的震慑，人们战战兢兢地指认革命者、造反者以及协助者，如实交代了她们所知道的一切，很快，许多人包括海伦在内遭到了最为残酷的毒打和审讯，并在简单的判决之后便执行了绞刑或者其他私刑。"
  SA_DSI_event.00003.a: "至暗时刻……"

  SA_DSI_event.00004.t: "最后时刻"
  SA_DSI_event.00004.d: "当海伦被审讯时，那些宣传资料与童话成为了她死刑的借口。遭受审讯的海伦那沾满血污的脸庞几近扭曲、双目唯有紧闭才能缓解疼痛，但她仍会同狱中的人们用口述的办法悄悄讲故事，去鼓励她们坚强地活下去。某一日，狱卒不再为海伦送来饭菜，而是将其带走——所有同伴都知道这意味着什么，人们在哽咽中目送同伴的最后一程。当她被押上囚车，一个可怜的人儿在她面前哭泣，海伦安慰了眼前的同伴并问道：“你要听一些故事吗？”那人在恍惚中点了点头，于是，海伦开始将其内心的故事一一倾诉给了眼前的人，囚笼在颠簸的道路上发出刺耳声响，但海伦的话语从未中断，其他同伴也开始侧耳倾听起来，想象着童话故事里描绘的世界和歌颂的精神。当囚笼被打开时，殖民者呵斥她们赶快下车，海伦一行被领到了一排排绞刑架前，殖民者就要在这里让她们以最扭曲的姿态缓慢地死去，在四周围起的人们眼前痛苦地死去。殖民者的口令声打断了海伦的回忆，现在她又看到了眼前乌泱泱的人群，她们的眼里充满了哀伤和无力，海伦又闭上了眼睛，想象着自己往下坠落，然后脖子被锁紧的未来……"
  SA_DSI_event.00004.a: "……"

  SA_DSI_event.00005.t: "奇怪的现象"
  SA_DSI_event.00005.d: "当拉杆被拉下，脚下失去支撑，预想中的坠落发生了，人体本能的恐惧感瞬间充满了她的思绪，海伦的四肢开始变得无力并条件反射地分泌着汗液。然而，海伦感受到了一丝不对劲，明明自己在下落着，时间一分一秒地流失着，但那预想当中的绞索始终没有在脖颈上收紧，好像她根本不在绞刑架上而是跳入了万丈深渊一样，下落的感觉一点一点剥离了她的理智，恐惧感逐渐成为了她唯一能够察觉到的情感，直到她失去了意识。"
  SA_DSI_event.00005.a: "海伦仍然在坠落"

  SA_DSI_event.00006.t: "诡异的空间"
  SA_DSI_event.00006.d: "海伦不知道自己昏迷了多久，当她的意识再次恢复时，她发现自己仍然在“坠落”，那令人发毛的恐惧感再次萦绕在自己身边，她试图调整自己的姿态，但只要一个微小的动作，她就会在“空中”旋转不止，令她更加头痛想吐，自己的身体摸起来还是完整的，但是这一望无际的黑暗空间真的令她感到压抑。就在她思考自己究竟身处何处时，她的视野突然渐变成暗红色，海伦感到惊讶，可她怔住的这一下下又不小心让自己旋转了起来，又让自己恶心了好一会。好不容易保持住了姿势，海伦小心翼翼地四处张望，突然发现在右手边，有一团黑雾在涌动着，她吞了吞口水，感觉不是什么好东西。海伦又继续盯了那团黑雾一会，便惊恐地发现这团黑雾的轮廓好像越来越大了，她不清楚是自己靠近了它还是它在靠近自己，她只能眼睁睁地看着这个东西越来越大，直到淹没了自己眼前的全部世界。刹那间，几句低沉的话语涌进了她的耳朵。\n“这里也有奇妙的事物存在……”\n“你的思想，有趣……”"
  SA_DSI_event.00006.a: "海伦再次陷入了黑暗当中"

  SA_DSI_event.00007.t: "与神秘存在的交易"
  SA_DSI_event.00007.d: "突然间，海伦不再坠落了，她摔在漆黑的平面上，但是毫发无伤，不过海伦还是感到了刺骨般的疼痛感，在原地缓了好一会。\n“你是谁！”海伦在四周仍然只看到了黑色。\n“小家伙，你写的东西，很有趣……真的很有趣……”\n“谢谢你对我作品的赞赏，但是我希望你最好能够回答我，你究竟是谁！”\n“我在你的故事里窥见了我在漫长时光里最缺乏、最向往的东西——扭曲。”\n“你……你说什么？”\n“听着，小家伙，我知道你的过往，我能看见，你被昔日悉心照顾的学生指控时的那一幕，她的手指无力地伸向你，但那指头又好像有力得很，好像要扎穿了你的心。我能看见，你倾心的作品在审讯室里摆在你面前时，那些家伙在你面前撕碎时，你的内心燃起的怒火，就要蹦出来烧死她呢。我还能看见，你还挂在那个孤零零的杆子上，就在那里腐烂着，双眼还在睁着，但只是在那干巴巴地无神地看着。”\n“你……你是怎么窥探到我的内心的！你是怎么知道这一切的！”海伦愤怒地向黑暗喊道，可是，她的声音在这广阔的空间很快就消失了。“还有，我死成什么样无所谓！我不需要你这种奇怪的同情！”\n“你……想不想看看现在的罗德西亚变成了什么样？”\n海伦怔住了：“你说什么……？”，很明显，原本海伦强硬的语气弱了些许。\n“我……可以帮你改变……”那个奇怪的声音建议道。\n“你这家伙……究竟想要做什么？如果你真那么厉害，可以改变这一切，为什么要我帮忙？”海伦对这种提议感到警惕。\n“别激动……别激动……我来告诉你，为什么要这样做……我的力量要作用在实物上，而你的童话，有很多天马行空的设定与造物，这些东西才可以承载我的能力，而我为什么要帮你……因为，我在这漫长时光里待得太久了……没有任何改变，我想要看点特别的，而你的世界，有趣，真的很有趣……”\n低沉的话语萦绕在脑海里迟迟不走，海伦试探性地问道：“你塑造的东西，真的都是只能作用在我的这些创作之上吗？”\n“嗯哼？”似乎是肯定的语气。\n“你真的能改变这一切吗？”\n“当然……我很有兴趣去做这样的事情……如果你同意的话。”\n“我……我同意，那我要还做点什么？”\n"
  SA_DSI_event.00007.a: "“我要你不断地创作……”"

  #谁TM让你写又臭又长的东西的（恼）

  SA_DSI_event.00008.t: "在苦难上种出怨恨……"
  SA_DSI_event.00008.d: "这天晚上，几队巡逻兵在死一般寂静的村镇里巡逻着，为了相应总督的宵禁政策，她们挨个扫视了各个街道，点起灯来，检查每一处房屋的四周和窗户情况，当地的原住民早在天完全黑下来之前被赶回家中去了，若是不好好遵守便会直接被殖民地武装当起义人员处理掉。而另外一些士兵则肩负起了核查村民信息的职责，她们拿着当地长老提供的居住名单，一家一家地核对信息是否对应。午夜，殖民者的皮靴声在门外越来越近，女人焦虑不安地安抚着哭闹的孩子们入睡，就在这时，房门被粗暴地撞开了，几个全副武装的士兵鱼贯而入，为首的士兵趾高气昂地站在她面前。\n“夫人，请把你一家人都交出来——还有，出示你们的通行证。”\n坐在床前缓慢起身的女人，从怀里翻出了几张边缘磨破的纸片。\n“我只有几个孩子陪伴着，这是我们全家的通行证。”\n士兵接过纸片检查着，煤油灯的光芒照得纸片闪闪的，突然，她笑了笑。\n“有趣。名单上还有两个成年人——你丈夫和你的公公。她们人呢？”\n“死了。”\n女人疲惫的脸庞只吐露出一个词语。士兵又笑了一声，把通行证粗鲁地丢到地上。\n“死了？怎么死的？病死的？饿死的？被叛军杀害了？还是去当叛军了？”\n“她们……她们是……被叛军杀害的……”\n“可你根本不在向政府举报叛军动向的名单里呢，还在隐瞒着什么吗？”\n女人看着她，没有回答。士兵直起身，朝身后摆了摆手，心领神会的手下立刻架住了眼前的女人，其他人则开始在屋子里翻箱倒柜——掀开米缸、倒空陶罐、搜查衣服。被子里蜷缩的三个小婴儿被惊醒了，她们的哭啼声是如此尖锐而令人烦躁，但士兵们没有停手。几分钟之后，她们离开了，原先的房子像被洪水席卷一般凌乱。"
  SA_DSI_event.00008.a: "婴儿的啼哭声仍旧，它穿过门窗，凄惨地回荡在寂静的街道上。"

  SA_DSI_event.00009.t: "……终有一天会让她们吞下"
  SA_DSI_event.00009.d: ""
  SA_DSI_event.00009.a: ""

  SA_DSI_event.00010.t: "祂的神迹……"
  SA_DSI_event.00010.d: "海伦飞速地写下自己脑海里的各种奇思妙想，这些黑暗超凡智能变给她的纸和笔使得她终于有机会将一度中断的童话编写重新续上。很快，海伦便在几张草稿上写完了她的第一份故事，还附上了自己在一旁绘制的插画，她整理好这几张纸并从椅子上站起。转眼间，面前的桌椅和笔墨化作尘埃消散，而那团熟悉的黑雾再一次在自己眼前汇聚了起来。\n“这么快就完成了？不错不错，我已经迫不及待地想要阅读你写的故事了。”\n“这是我写的故事，是关于一个叫做‘华丽果树’的东西。不过，我还是很好奇……我写出来的这些东西，真的能够将你的神威传播到我的家乡吗？”\n“你不用担心，海伦·紫罗兰老师，我将会向你展现，通过你的创造，我们能够做到什么。”\n突然，海伦只感觉周围一阵疾风呼啸而过，没有紧紧攥住的草稿被狂风卷起，然后飞入了黑雾的核心，海伦疑惑地等在原地，想见识见识黑暗超凡智能究竟会拿她的故事做什么。过了一会，一个黑雾裹挟着一个物体缓缓降落在海伦数十米开外的地方，待到黑雾散去，一棵生长旺盛、枝条上长满了看起来鲜嫩可口的果实的大树挺立着，海伦被惊讶到了，她缓缓走向那颗华丽而又迷人的果树前，发现它的树皮像老人的手背龟裂开来，湿润的苔藓长满缝隙，抬头，千万条枝干在空中张开大网，叶片参差不齐地在枝干上分布，密密匝匝的，而那圆润的果实三五成群地点缀在绿色的伞上，但是海伦没有伸手触碰它——海伦的故事里描写了华丽果树是一个会伤害人的造物。\n “它……它真的完美符合我想象当中的那株果树……”\n“现在……就让它在你的世界，演绎你为它写好的故事吧……”\n原本在面前撑开的巨伞化作尘埃消散，应该如黑暗超凡智能所说的那样，他已经去到了他曾经的世界，残忍地吞噬掉了那些贪婪的殖民者……"
  SA_DSI_event.00010.a: "“这是多么不可思议……”"

  SA_DSI_event.00100.t: "骄傲的果树"  #华丽果树
  SA_DSI_event.00100.d: "“……从前，有一棵神奇的果树长在一个小小河畔上，它长得又高又大，撑开了一顶由绿油油的叶片组成的雨伞，枝干上结满了红彤彤的硕果，好像漂亮的灯笼挂在那里，每当暖风轻柔地拂过这棵果树，它就骄傲地发出‘沙沙’声响，摇动它那引以为傲的果实与枝条，挺拔的树干纹丝不动，像是果树在接受风儿对自己的检阅。……但是，这棵太骄傲自满了，它对其他树木呵斥道。\n‘瞧瞧你们，长得东倒西歪、无精打采的，这简直是糟蹋了养分！你们都应该让出这些宝贵的养分给我！’\n树木们被果树吓到了，它们战战兢兢地生活在果树旁边，每一天都要面对这个小霸王的贬低。渐渐地，这些生活在果树旁边的树木受不了果树的羞辱，在自卑中凋零了，而果树却哈哈大笑，将这些树木的养分统统占为己有，让自己越长越大了……\n……直到有一天，一个探险家闯入了这个森林，她立刻发现了果树上硕果累累的风景，便欣喜若狂地攀爬着树干、掰弄着枝条，将这些果实——果树最看重的荣誉全都抖落、采摘下来了。果树痛苦地发现，它的树干填满了靴子和小刀划蹭得像小花猫一样乱的花纹，绿叶组成的雨伞被毁坏一番，曾经最令自己感到自豪的果实也全都被洗劫一空。果树恼羞成怒了，它那布满惊心动魄的划痕的树干生出了一只血盆大口，它那厚植在这片土地上的根系被自己残忍拔出，并成为它的脚丫，让它游走于茂密的树林里，时刻狩猎着任何它见到的人。它隐藏自己的血口，生出虚假的果实，悄悄地驻扎在一个显眼的地方，总是勾引着贪婪、抑或是好奇的人儿前去查看，而当人靠近时，它的血盆大口会再次出现，最后把人残忍地吃下……”"
  SA_DSI_event.00100.a: "……"

  SA_DSI_event.00101.t: "骄傲的果树（下）"
  SA_DSI_event.00101.d: "“……\n过了一段时间，在一个没有月亮的夜晚，果树一路逃跑着，沿途丢下了它的枝条与树皮，原来，它血腥的报复遭到了人们的反击，人们拿出伐木斧、举着火把，大喊着杀掉这个可怕的怪物。突然，果树发现自己狼狈地跑到了森林深处，那些树木们冷冷地收着枝条，还是如同以往那样无精打采。\n‘喂！你们……帮帮我吧！’\n树木们只是沉默着，果树很生气，正想着要狠狠教训这些树木时，追赶过来的人们发现了定定呆着的果树，大手一挥，用伐木斧砍下了果树的一大块皮，果树轰然倒下，人们又用火把点燃它，微小的火点在这棵果树上瞬间爆燃成熊熊大火，它的不甘与痛苦，也如同它的存在化作灰烬，消失了。人们庆祝着，突然，周围沉默的树木们张开它们的枝干，将森林的天空盖得严丝合缝而没有一丝光透进来，人们手里的火把也突然熄灭，人们恐慌地在漆黑的地上打转，有些人想要爬树，可是曾经被果树嘲笑的那层树皮如同打滑的冰面，将抓紧的人们一次又一次甩下去，人们在黑暗中摸索着，最后在这片森林里彻底消失了，当树木们再次收回它们舒张的枝条，一切都变成了以往宁静祥和的氛围。人们在小镇交流着，之前只是零星几个人在那不详的森林里消失，现在是一大队人，之后都再也没有人踏足那片被人告诫是危险的区域了。”"
  SA_DSI_event.00101.a: "……"

  #考证易燃性问题

  #华丽果树（骄傲自满的原住民）、其他树木（原住民）、探险家（殖民者），果树不是殖民者的对手——真正让殖民者消失的，是那片沉默的森林。

  SA_DSI_event.00102.t: "一朵花的旅程"  #扑克兵
  SA_DSI_event.00102.d: "“……很久以前，一个主教从原住民手中收缴到了一颗据说很神奇的种子，她欣喜若狂,用最精致的花盆供奉着这个小小的种子，每天悉心照料，最充足的养料培养它，希望它带来财富与地位。但是种子不发芽，主教生气地将它丢出了教堂外，跌入了泥泞的道路上。一个士兵巡逻时发现了它，便将它拾起，种在了一个小盆栽里，并用最好的露水和红土培养它，希望给自己带来谈资和身份。一天天过去了，种子还是没有发芽，士兵生气地丢弃了种子。种子再次跌入土里，被一个商人发现了，她将其放入玻璃瓶，用阳光和养料悉心照料，可是种子还是没有萌发，商人暴跳如雷，将种子丢入河里。种子被河边洗衣的农夫捡起，她仅仅只是像她种过的千千万万的种子一样随意埋进土里，既没有悉心的照料更没有期盼它能带来些什么。但是，有一天，这颗种子萌发了，它结出来最漂亮的花，之后再也没有凋谢过……”"
  SA_DSI_event.00102.a: "……"

  SA_DSI_event.00103.t: "一朵花的旅程（下）"
  SA_DSI_event.00103.d: "“……有一天，商人路过了农夫的农舍，窥见了田野里那独树一帜的花朵，便向农夫提出购买花朵的请求，并承诺给出价格不菲的回报，农夫早就对商人那油嘴滑舌的本质深感厌恶，便将商人痛骂一顿并驱逐走了。士兵在农舍附近巡逻时，发现了那朵美艳的鲜花，便尝试翻过栅栏，去摘下它，在一旁休息的农夫见状便举起锄头，作势要毁掉那朵美丽的花儿那样，卡在栅栏上的士兵感觉自己占不到便宜，便尴尬地翻回去了。商人和军人向主教报告了那朵花的信息，主教感到愤怒，便借口要给原住民治病，在到达农夫家里时，她为农夫喂下了毒药熬制的汤羹，将不明不白的农夫毒死在了床上，而那朵奇艳的花朵则被主教带回教堂里精心呵护了。然而，不出几日，这朵鲜花便迅速凋零衰败，只有难看、朴素的灰黑色停留在花瓣上，枝条无精打采地耷拉着。不出几日，那朵花便开始枯萎。花瓣没有变色，只是慢慢蜷缩起来，像在收回自己。最后，它变成了一截干枯的茎秆，轻轻一碰就碎了……”"
  SA_DSI_event.00103.a: "……"


  #主教（殖民地牧师）、士兵（殖民地武装）、商人（殖民地商人（在罗德西亚里，商人的职业被白人们垄断了））、农夫（原住民），

  SA_DSI_event.00104.t: ""  #幽怨执念
  SA_DSI_event.00104.d: "“……曾经有一个享誉天下的艺术家生活在海边，她创造出了许多巧夺天工的艺术品，在很多地方都广受人们的好评。直到有一天，一个新的国王统治了这个国家，她捉摸不透这个艺术家的艺术品，总是对她的艺术深感恐惧和厌恶，便呵斥她的作品是妖魔化般的存在，要求军队摧毁她的所有作品，并限制她的创作，受到如此羞辱和巨大打击的艺术家陷入了疯狂，最后在寂寞中死去。艺术家死后便化作了一股怨念，她在暗地里，总是诅咒任何创造者和曾经的她一样，将即将完成的作品被扭曲，失去美感和作用，此时，她那不平、愤怒的心灵便会感到欣喜若狂。越来越多的创作者身边发生蹊跷的、却又有有点共通的事情，那就是她们付诸心血的作品总是莫名其妙地毁于一旦……”"
  SA_DSI_event.00104.a: "……"

  SA_DSI_event.00105.t: ""
  SA_DSI_event.00105.d: "“对于这种灵异事件，人们逐渐注意到了事情的不对劲，便开始调查并发现了怨灵的存在，当人们准备消灭她，让这个躁动的怨灵彻底安息时，怨灵也发现了人群当中，不乏同和她一样是创作者的人遭受的打击和失望，和她当初的情况如出一辙，那些人同她一样遭到了这样的巨大打击，但仍坚持自己的创作，她对此懊悔不已，当她即将被消灭的那一刻，她听到了人群中有人赞美她曾经的作品，她心里最后一丝不甘和愤怒也消散了……”"
  SA_DSI_event.00105.a: "……"

  #曾经创造出许多艺术品的艺术家，后来在殖民时期被殖民者妖魔化而封存，艺术家陷入疯狂，死后化成了怨念，在暗地里诅咒任何人创作的作品被扭曲掉。

  SA_DSI_event.00106.t: ""  #诅咒
  SA_DSI_event.00106.d: "“……很久很久以前，王国里有一位凶神恶煞的贵族，她压迫人民，欺瞒国王，做着许多无法无天的事情。最终这位作恶多端的贵族被英明的国王和她领导着的人民合力消灭，但她并未就此甘心死去，而是在临死前恶狠狠地诅咒道：‘我诅咒你们所有人！要是你们和你们的后代在我选定的日子里做出了我讨厌之事的话，你们就会遭到我的报复！’从那以后，所有的鼠鼠们都在那一天到来的时候小心翼翼，不愿做出任何冒险的事情，甚至都不敢说出那名贵族的名字，甚至连隔壁王国的居民也会自觉地避开诅咒的影响……”"
  SA_DSI_event.00106.a: "……"

  SA_DSI_event.00107.t: ""
  SA_DSI_event.00107.d: ""
  SA_DSI_event.00107.a: "……"

  #随着一阵灵能波动掠过天空，邪恶的诅咒降临了！这股力量本质上来源于黑暗超凡智能的程序，尽管覆盖范围相当广，其精度却很低。如果我们能避免做出容易引起祂注意的事情，就应该不会有大问题。 殖民者们听见一阵低沉的耳语说道：不得伐倒任何树木。如敢违反，将受到严惩。（游戏文本）

