#宗主国相关事件

  SA_FRA_event.00000.t: "远方的纸鹤"
  SA_FRA_event.00000.d: "正当魔理沙想要在这来之不易的元旦节在家休息一番，她察觉到了一丝熟悉的魔法波动，魔理沙如同往常一样打开窗户，一只纸鹤在夜幕的笼罩下轻轻降落在了魔理沙家的窗前。轻轻展开纸鹤，熟悉的字迹歪歪扭扭地展现在她眼前：“新年。别太累。有空多玩玩。”魔理沙笑了笑，不像其他东西随意堆放就完事了，她重新折好纸鹤，将它放到了一个小抽屉里。抽屉里还有几只形态各异的纸鹤静静地停着。"
  SA_FRA_event.00000.a: "师傅那家伙……"
  SA_FRA_event.00000.a_tip: "空"

  SA_FRA_event.00100.t: "魔界溪谷领地的年度报告" 
  SA_FRA_event.00100.d: "去年魅魔呈递的报告还有三页，今年只剩一页，上面写着“各部族安居乐业，殖民地各项生产指数达标，没有反抗和游行”“公路建设增加数条，更多种植园开张，殖民地人口增加”“魔界溪谷领地收入稳中向好，逐年增加”逐年简略的年度报告叠放在办公室内，殖民署官员核对了相关报告的数据和海关报告的数据无误后，便在这些文件上面签上潦草的“核对无误”和她们的署名。"
  SA_FRA_event.00100.a: "报告叠好放入积灰的文件夹当中"
  SA_FRA_event.00100.a_tip: "空"

  ####开始大萧条

  SA_FRA_event.00101.t: "对殖民地的紧急措施"
  SA_FRA_event.00101.d: "现在，幻想乡因为大萧条受到了沉重打击，大量人口失业，货币迅速贬值，企业和银行相继倒闭，堆积如山的商品堆积在仓库里坏掉，除了在我们国内采取经济措施外，我们还需要殖民地来帮助我们度过难关。\n一名议员对天狗的采访表示“殖民地是我们摆脱大萧条的好伙伴”，随后他详细阐述了具体措施：“我们需要她们以更加实惠的价格销售她们的原材料，买入我们生产过剩的产品，以此缓解我们的生产问题。她们本土的工业发展条件比较欠缺，所以完全可以由我们幻想乡本土来加工，最后为她们提供更好更实惠更有技术含量的产品。她们的乡村环境更适合她们专注于最基础的原材料产出。同时，我们也要鼓励殖民地的外汇转到国家银行里，让我们一起分担大萧条的压力等等。这些举措有助于我们更快地从大萧条的打击中恢复。”\n虽然有人反驳到这些措施更像是往殖民地转移矛盾。"
  SA_FRA_event.00101.a: "“相信我，这是困难时期大家渡过难关的最佳选择。”"
  SA_FRA_event.00101.a_tip: ""

  SA_FRA_event.00102.t: "殖民地的抉择"
  SA_FRA_event.00102.d: "来自宗主国的指示，官员口口声声说：“这是有利于双方的决策”，但这张指示上分明写满了各种各样针对殖民地的限制政策和严苛的条例，暴露了宗主国绝不是止于口头上的计划，而有更深层的意图，明眼人都能看出来宗主国发这么个指示下来，是要借殖民地的血续共和国的命。"
  SA_FRA_event.00102.a: "我们有什么办法？只能接受"
  SA_FRA_event.00102.a_tip: "空"
  SA_FRA_event.00102.b: "哦"
  SA_FRA_event.00102.b_tip: "空"

  SA_FRA_event.00103.t: "日益显露的问题" 
  SA_FRA_event.00103.d: "虽然所有的殖民总督都在第一时间内回复了我们的指示，但诡异的是，魅魔鲜少遵守指示，她在各种各样的政策上敷衍了事，讨价还价，对于签署价值价格不菲的大宗商品交易，增添人头税和要求其接受本土的失业人员，她推托几番，用含糊其辞的承诺来拖延时间，即使谈妥了，一笔小小的交易居然要用20年的时间去支付完！幻想乡官员逐渐发觉了魔界溪谷领地的深层问题。左右翼人士对魅魔的“不作为”“自由放任”和“缺乏主观能动性”展开了疯狂的批判"
  SA_FRA_event.00103.a: "魅魔那家伙究竟在做什么？！"
  SA_FRA_event.00103.a_tip: "如果她还在这阳奉阴违，那她可以滚了"

  SA_FRA_event.00104.t: "一则晴天霹雳的秘密报告"
  SA_FRA_event.00104.d: "§R关于“魔界溪谷殖民地”真实状况的考察报告§ \n\n本人以独立学者身份，经“鼠族商路”进入殖民地，历时三个月，未与总督府进行官方接触。考察范围覆盖萌螈、鼠族、绮罗等部族的聚居地及混居区。\n\n核心发现： 该殖民地的真实状况，与总督府提交的年度报告存在系统性偏差。总督魅魔的“无为而治”并非失职，而是一套自成一体的、以最低成本维持最高稳定性的隐性治理体系。\n第一部分：…………\n………………\n第二部分：武装力量评估：\n总督直属武装，魅魔直接统领的武装力量，她们在殖民地事务上几乎排不上用场，仅仅发挥象征性和仪仗队的作用。占绝大多数的地方武装才是这片土地的绝对力量。\n魅魔对地方武装长期疏于管理和放任，导致殖民者对于她们的实力没有精准的把握，这些地方武装甚至还有我们不为熟悉的技术和魔法。这表明，以强硬的武力迫使殖民地屈服极有可能引发不可避免的悲剧。\n第三部分：原住民社会的“碎裂状结构”\n魅魔统治的殖民地下，各个部族没法形成绝对的统治，没有一个部族凭借经济和实力压倒其他部族，鼠族王国之间，旅鼠城邦之间和萌螈王庭之间像碎裂的玻璃一样分散，虽然长期以来都存在混居和贸易，但是缺乏统一的政治认同和联盟，在面对外来压力时，她们能否共度难关的决心有待观察。\n第四部分：大萧条背景下的风险评估\n报告不否认“分而治之”策略的理论可行性。各部族之间的竞争意识是客观存在的。但是，在大萧条期间启动此类策略，风险极高。任何外部“挑拨”都可能被误读为“全面干涉”，反而促使各部族因恐惧而走向联合。建议： 维持现状。待经济复苏、本土实力增强后，再考虑渐进式渗透。目前，魅魔的统治是代价最小的选择。"
  SA_FRA_event.00104.a: "我们从来都没感觉殖民地的事务这么棘手！"
  SA_FRA_event.00104.a_tip: "空"

  SA_FRA_event.00105.t: "魔界溪谷领地的未来" 
  SA_FRA_event.00105.d: "秘密报告使得左右翼双方的理智派都静下来开始分析了：“谁想换掉她，谁就先为这场‘不可避免的悲剧’负责。你们准备好了吗？比起让殖民地陷入血雨腥风，这可能是唯一符合我们自身利益的理性选择。”而其他人则提议“魅魔是那个压舱石不错，但是她缺乏做大做强的动力便是作为总督最大的弱点，一个上进的总督，一个能够宣传宗主国福祉的总督才是好总督！现在，我们得派出人员去逐渐取代她，而不是让她一直呆在那里浪费我们的殖民地资源。”"
  SA_FRA_event.00105.a: "不如偶尔敲打敲打她就行了"
  SA_FRA_event.00105.a_tip: "殖民地的稳定还是得靠她"
  SA_FRA_event.00105.b: "派遣本土官员，要求魅魔积极配合她"
  SA_FRA_event.00105.b_tip: "她现在得留着，不过未来的位子，她没得坐了"

# 殖民地带来的国家精神