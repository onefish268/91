l_simp_chinese:
 ZIM_Wartime_coordination: "战时统筹"
 ZIM_Wartime_coordination_desc: "战争不是一场只有前线的表演——后方的每一顿口粮、每一寸布料、每一桶燃油都决定了前线的成败。我们必须建立一个超越部门壁垒的统筹体系：粮食局直接向军需处汇报配给方案，铁路调度优先服务于部队调动，民政系统将每日收集的废旧金属全部上交兵工厂。每一项资源的使用权都不再属于原单位，而是由一个战时统筹委员会统一分配。这不是官僚主义的扩张——恰恰相反，这是为了砍掉官僚主义的多余环节。在这套体系下，没有人能以一纸公文拖延弹药运送，也没有人能因部门利益而囤积物资。战争的逻辑压倒一切其他逻辑，因为输掉战争，其他一切逻辑都将失去存在的意义。"
 ZIM_Internal_collaboration: "里应外合"
 ZIM_Internal_collaboration_desc: "堡垒最容易从内部攻破。对于盘踞在周边的大小势力，我们无需每一座城池都强攻硬打——派出密使联络其内部的失意军官、被排挤的旧官僚或心怀不满的商人，许以保全其财产和地位为条件，换取他们在关键时刻倒戈或开门献城。一场不流血的胜利，远胜过一场消耗殆尽的惨胜。"
 ZIM_Expand_recruitment: "扩大兵源"
 ZIM_Expand_recruitment_desc: "仅靠募兵站的几张征兵海报是填不满战壕的。我们必须把触角伸向每一个村庄、每一条矿道、每一个能扛起步枪的角落——工厂里的年轻工人实行轮训制，农忙结束后的壮劳力编入预备役，甚至那些因战乱而流离失所的难民，只要肯拿起枪便有一口饭吃。我们降低了入伍的身高要求，放宽了年龄上限，也不再拘泥于是否受过基本教育。纪律可以在训练场上慢慢培养，忠诚可以在战火中逐渐淬炼，但首先——我们得有足够多的肩膀去扛起这场战争。乱世之中，人口本身就是最宝贵的战略资源。"
 ZIM_Request_foreign_aid: "向他国求援"
 ZIM_Request_foreign_aid_desc: "我们承认，单凭一己之力难以在漫长的消耗中支撑下去。向那些友好的邻国或域外势力提出请求——不求他们直接派兵，而是争取武器贷款、药品援助或技术顾问。代价或许是开放部分矿产开采权或承诺战后贸易优惠，但在生存面前，这些不过是日后可以重新谈判的筹码。只要他们还愿意与我们对话，我们就还有路可走。"
 ZIM_Campaign_launch: "出征"
 ZIM_Campaign_launch_desc: "时机已至。当我们守住了地盘、理顺了产业、练成了新军，便不能再偏安一隅。主动出击不是鲁莽，而是以战迫和——选定防区外最薄弱的目标，集中优势兵力速战速决，在其余势力尚未反应过来之前便吃掉对手。这一仗打的是威慑：让所有旁观的势力明白，与我们为敌的成本，远高于与我们共存。"
 ZIM_Industry_consolidation: "产业整合"
 ZIM_Industry_consolidation_desc: "我们必须马上进行经济产业上的整合，特别是优先恢复那些与生存直接相关的产业，如粮食、煤炭、简单军工，好让我们实现财政与物资自给——毕竟“有粮则稳，有钱则久”，失去了产业的“造血供应”的政府是不可能长久的。"
 ZIM_Tactical_improvement: "改进战术"
 ZIM_Tactical_improvement_desc: "旧式的正面列阵对射已经不适合我们这片破碎的土地了。我们必须根据实际地形和有限的兵力，发展出一套适合我们的打法——利用铁路路基作掩体、以矿山坑道设伏、组织小股精锐渗透而非大规模正面推进。战术的改进不仅仅关乎胜败，更关乎每一颗子弹能否换来最大的战果。"
 ZIM_Wartime_preparation: "战时准备"
 ZIM_Wartime_preparation_desc: "和平只存在于两场战争之间。我们必须清点库存弹药、检修每一门能响的火炮、储备足够的干粮与药品。同时，划定防区内所有可用民房为临时伤员收容所，征调每一匹骡马编入运输序列。不打无准备之仗——准备越充分，流血的代价就越小。"
 ZIM_Consolidate_territorial_hold: "据地自固"
 ZIM_Consolidate_territorial_hold_desc: "死去的伊菲尔总督所留下的巨大政治遗产和权力没有任何一个人把持得住，她苦心维持的旧秩序仅仅在她身躯倒下的那一刻便不可避免地土崩瓦解了。现在，我们必须在她死后留下的巨大政治真空里，迅速圈占一块我们自己的地盘，好让我们在这场疯狂内战中胜算多一分。"
 ZIM_Military_reform: "军队改革"
 ZIM_Military_reform_desc: "乱世下不囤枪养兵就是被打败的命运，只有训练起一支可靠的军队，才有助于我们抵御外敌入侵，并帮助我们有力地维持住内部的稳定，因此，拉练起一支自己的军队是尤为必要的。"
 ZIM_Suppress_opposition: "铲除异己"
 ZIM_Suppress_opposition_desc: "在我们初步站稳脚跟并拥有稳定的物资供应之后，那些仍然拒绝归附或者阳奉阴违地执行我们命令的地方势力便成为心腹之患。我们必须以最小的代价逐一清除或收编这些异己力量——暴力的成本太高，能策反的绝不动武，能用经济手段绑定的绝不流血，但必要时也不得不以雷霆之势扫清障碍，确保我们的意志能够在控制区内畅通无阻。"
 ZIM_Frontier_defense: "防务整备"
 ZIM_Frontier_defense_desc: "稳住内政的同时，我们必须立即在控制区边界布设防御——扼守铁路枢纽、水源地与矿产通道，建立情报前哨，确保任何入侵企图都能被提前数日察觉。大萧条之下，其他势力是没有余力发动持久远征的，只要拖长战事、抬高成本，入侵者自会知难而退。"
 ZIM_Stabilize_situation: "暂稳局势"
 ZIM_Stabilize_situation_desc: "乱局之中，民心即根基。我们必须迅速在控制区内恢复基本的社会运转——发放赈济以安流民，恢复集市以通货货，重申简易律令以止暴掠。百姓所求不过一日两餐与枕上安眠，只要让他们感觉到明日仍有盼头，便不会有人甘愿铤而走险。稳住人心，便是稳住了我们立足的土壤。"
 ZIM_Civilian_to_military: "民转军"
 ZIM_Civilian_to_military_desc: "正规军的编制终究有限，而防区内的青壮劳力却是取之不尽的兵源储备。我们必须建立一套完备的后备动员体系——农闲时组织民兵训练，工厂里推行半工半训制，将铁路工人编入抢修与运输预备队。平日里他们是锄头和扳手的主人，战时只需一封征召令，便能在三日内成建制地补入一线。养兵于民，方能久战不竭。"
 ZIM_Limited_strategy: "有限策略"
 ZIM_Limited_strategy_desc: "我们不追求毕其功于一役，而是做好打一场持久消耗战的准备。确立几个切实可行的小目标——切断对方一条补给线、拔掉对方一个前沿据点、策反对方一个编队——每次只咬下一小块，积小胜为大胜。不急于求成，不给对手决战的机会，在持续的拉锯中逐步压缩其活动空间。等对方耗尽耐心、耗尽粮弹、耗尽士气之时，胜利自然瓜熟蒂落。"
 ZIM_Steady_advance: "步步为营"
 ZIM_Steady_advance_desc: "战略既定，战术上便不能冒进。每攻克一处阵地，不急于继续推进，而是就地修筑工事、布设地雷、架设通信线路，确保补给线能够跟上脚步。前锋与后方之间的每一里路都必须在我们绝对控制之下。宁可前进三里花上十天，也决不在一天之内冲出十里而后继乏力。一步一个脚印踩实了，整条战线才不会在对手一次反击中全线动摇。"
 ZIM_Desperate_gamble: "孤注一掷"
 ZIM_Desperate_gamble_desc: "在弱肉强食的环境下，我们已经没有退路了，唯有将国库中的最后一粒粮食、兵工厂里的最后一颗子弹、十六岁以上五十岁以下每一个能扛枪的人——全部投入前线，才能保证我们在这场浩劫中笑到最后。这不是一场精心计算的战役，而是一场以国运为赌注的豪赌。要么一战定乾坤，要么连同我们的旗帜一同从地图上被抹去。既然选择了这条路，就别再回头张望。"
 ZIM_Predatory_exploitation: "强取豪夺"
 ZIM_Predatory_exploitation_desc: "既然已经选择了倾尽国运打一场速决战，那就别再顾忌什么体面与长远。所过之处，征用一切能征用的物资——地主粮仓里的陈粮、商号库房里的布匹、富户宅院中的金银细软。不必谈什么补偿与借条，此刻前线将士的枪膛比任何契约都更有说服力。战争本身就是最残酷的再分配，只有把后方的每一分资源都变成前线的枪炮与干粮，我们才能在对手喘息之前一举砸碎他的脊梁。"
