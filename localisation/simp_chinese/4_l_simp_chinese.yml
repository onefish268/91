l_simp_chinese:
 3_focus_1: "建国宣言"
 3_focus_1_desc: "我们是最棒的！"
 3_focus_2: "召开第一届全国法西斯党大会"
 3_focus_2_desc: "我们法西斯党人是燎原的火种，罗德西亚的土地与人民是唯一的沃土，我们扎根故土、收拢民心，在乱世废墟中重建新秩序。"
 3_focus_3: "老大原则"
 3_focus_three_desc: "一切从事国家工作、党务工作、文化教育工作的党员，都是人民的勤务员。"
 three_focus_4: "得力干将卡尔帕乔"
 3_focus_4_desc: "3_focus_4_desc"
 three_focus_5: "得力干将齐亚诺"
 3_focus_5_desc: "3_focus_5_desc"
 three_focus_6: "得力干将斯塔拉切"
 3_focus_6_desc: "3_focus_6_desc"
 three_focus_7: "得力干将佩帕罗妮"
 3_focus_7_desc: "3_focus_7_desc"
 three_focus_8: "得力干将帕沃利尼"
 3_focus_8_desc: "3_focus_8_desc"
 3_focus_9: "一切权力归于领袖"
 3_focus_9_desc: "领袖当然不是孤高的僭主，我们法西斯党人好比脊梁，国家权力好比血脉，唯有将全数权柄汇聚于唯一核心，动荡的罗德西亚方能真正站立。"
 3_focus_10: "警惕反革命分子"
 3_focus_10_desc: "我们当然不会无懈可击，唯有时刻肃清内部蛀虫与反动余孽，新生的罗德西亚方能长治久安。"
 3_focus_11: "统一思想"
 3_focus_11_desc: "秩序当然不止依靠枪炮，我们法西斯党人好比星火，万民思想好比荒原，唯有涤除杂言、归一信念，新生的罗德西亚方能万众一心。"
 3_focus_12: "动员大会"
 3_focus_12_desc: "国家当然不会自行强盛，我们法西斯党人好比引擎，举国民众好比薪柴，唯有凝聚全员之力、穷尽举国所能，废墟之上的罗德西亚方能奋勇前行。"
 3_focus_13: "描述前景"
 3_focus_1three_desc: "我们将有美好的未来，这是肯定的，我们的党员们要意识到这一点。"
 3_focus_14: "战斗的法西斯"
 3_focus_14_desc: "和平当然不会凭空降临，我们法西斯党人好比刀锋，民族意志好比坚甲，唯有以战斗为信仰、以铁血为国魂，罗德西亚的新生秩序方能屹立不倒。"
 3_focus_15: "运用党员"
 3_focus_15_desc: "法西斯党员无论何时何地都不应以个人利益放在第一位，而应以个人利益服从于民族的和人民群众的利益。"
 3_focus_16: "罗德西亚曾短暂到达过未来"
 3_focus_16_desc: "罗德西亚产生了法西斯党，这是开天辟地的大事变。"
