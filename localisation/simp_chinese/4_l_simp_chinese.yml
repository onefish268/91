l_simp_chinese:
 3_focus_1: "建国宣言"
 3_focus_1_desc: "我们是最棒的！"
 3_focus_2: "召开第一届全国法西斯党大会"
 3_focus_2_desc: "我们法西斯党人是燎原的火种，罗德西亚的土地与人民是唯一的沃土，我们扎根故土、收拢民心，在乱世废墟中重建新秩序。"
 3_focus_3: "老大原则"
 3_focus_3_desc: "一切从事国家工作、党务工作、文化教育工作的党员，都是人民的勤务员。"
 three_focus_4: "得力干将卡尔帕乔"
 three_focus_4_desc: "在过去的斗争中，卡尔帕乔同志以其卓越的组织能力和坚定的信念，为我们党赢得了宝贵的胜利。"
 three_focus_5: "得力干将齐亚诺"
 three_focus_5_desc: "齐亚诺同志在党的建设中展现了非凡的领导才能，他的智慧和勇气为我们党注入了新的活力。"
 three_focus_6: "得力干将斯塔拉切"
 three_focus_6_desc: "斯塔拉切同志以其卓越的战略眼光和坚定的执行力，为我们党在关键时刻提供了宝贵的支持。"
 three_focus_7: "得力干将佩帕罗妮"
 three_focus_7_desc: "佩帕罗妮同志以其对党的忠诚和卓越的工作能力，为我们党做出了重要贡献。"
 three_focus_8: "得力干将帕沃利尼"
 three_focus_8_desc: "帕沃利尼同志以其对党的思想的深刻理解和卓越的组织能力，为我们党在各项工作中提供了坚实的支持。"
 3_focus_9: "一切权力归于领袖"
 3_focus_9_desc: "领袖当然不是孤高的僭主，我们法西斯党人好比脊梁，国家权力好比血脉，唯有将全数权柄汇聚于唯一核心，动荡的罗德西亚方能真正站立。"
 3_focus_10: "警惕反革命分子"
 3_focus_10_desc: "我们当然不会无懈可击，唯有时刻肃清内部蛀虫与反动余孽，新生的罗德西亚方能长治久安。"
 3_focus_11: "统一思想"
 3_focus_11_desc: "秩序当然不止依靠枪炮，我们法西斯党人好比星火，万民思想好比荒原，唯有涤除杂言、归一信念，新生的罗德西亚方能万众一心。"
 3_focus_12: "动员大会"
 3_focus_12_desc: "国家当然不会自行强盛，我们法西斯党人好比引擎，举国民众好比薪柴，唯有凝聚全员之力、穷尽举国所能，废墟之上的罗德西亚方能奋勇前行。"
 3_focus_13: "描述前景"
 3_focus_13_desc: "我们将有美好的未来，这是肯定的，我们的党员们要意识到这一点。"
 3_focus_14: "战斗的法西斯"
 3_focus_14_desc: "和平当然不会凭空降临，我们法西斯党人好比刀锋，民族意志好比坚甲，唯有以战斗为信仰、以铁血为国魂，罗德西亚的新生秩序方能屹立不倒。"
 3_focus_15: "运用党员"
 3_focus_15_desc: "法西斯党员无论何时何地都不应以个人利益放在第一位，而应以个人利益服从于民族的和人民群众的利益。"
 3_focus_16: "罗德西亚曾短暂到达过未来"
 3_focus_16_desc: "罗德西亚产生了法西斯党，这是开天辟地的大事变。"
 three_focus_17: "全国招募褐衫军"
 three_focus_17_desc: "褐衫军是我们党最忠诚的战士，他们将以无畏的勇气和坚定的信念，捍卫国家的尊严和人民的利益。我们将通过全国范围的招募，吸引更多有志之士加入褐衫军，为国家的繁荣和稳定贡献力量。"
 three_focus_18: "掌控企业集团"
 three_focus_18_desc: "我们将通过掌控企业集团，确保国家经济的稳定和发展。通过有效的管理和监督，我们将推动企业的创新和竞争力，为国家的繁荣提供坚实的基础。"
 three_focus_19: "平等原则"
 three_focus_19_desc: "我们将坚持平等原则，确保每个公民在法律面前享有平等的权利和机会。无论性别、种族、宗教或社会地位，每个人都应受到尊重和保护，共同建设一个公正和谐的社会。"
 three_focus_20: "确立党的领导地位"
 three_focus_20_desc: "我们将确立党的领导地位，确保党在国家治理中的核心作用。通过加强党的组织建设和思想教育，我们将巩固党的权威，推动国家的稳定和发展，实现民族复兴的伟大目标。"
 three_focus_21: "扩大青年团"
 three_focus_21_desc: "我们将扩大青年团的规模和影响力，吸引更多年轻人加入我们的组织。通过提供培训、教育和实践机会，我们将培养新一代的领导者和社会栋梁，为国家的未来注入新的活力和创造力。"
 three_focus_22: "回顾斗争精神"
 three_focus_22_desc: "我们将回顾和弘扬斗争精神，铭记历史上的艰辛与奋斗。通过教育和宣传，我们将激励人民继承先辈的勇气和智慧，坚定信念，勇往直前，为实现国家的长远发展和民族的伟大复兴而努力奋斗。"
 three_focus_23: "提供订单"
 three_focus_23_desc: "我们将通过提供订单，支持本国企业的发展和创新。通过政府采购和政策扶持，我们将促进产业升级和技术进步，增强国家的经济实力和国际竞争力，为人民创造更多就业机会和福祉。"
 three_focus_24: "呼吁团结"
 three_focus_24_desc: "我们将呼吁全国人民团结一致，携手共进。通过加强社会凝聚力和共同价值观的建设，我们将形成强大的国家力量，应对各种挑战和困难，实现国家的繁荣和稳定。"
 three_focus_25: "发起节约运动"
 three_focus_25_desc: "我们将发起节约运动，倡导资源的合理利用和环境保护。通过宣传教育和政策引导，我们将鼓励全民节约能源、减少浪费，推动可持续发展，为子孙后代创造一个美好的生活环境。"
 three_focus_26: "崇尚罗马精神"
 three_focus_26_desc: "我们将崇尚罗马精神，弘扬坚韧不拔、勇敢无畏和忠诚奉献的价值观。通过教育和文化活动，我们将激励人民继承和发扬这种精神，增强国家的凝聚力和战斗力，为实现民族复兴和国家强盛而努力奋斗。"
 3_focus_27: "继承人集团"
 3_focus_27_desc: "数风流人物，还看今朝。"
 3_focus_28: "老大第一"
 3_focus_28_desc: "永远追随老大！"
 3_focus_29: "国家重建"
 3_focus_29_desc: "任何新生事物的成长都是要经过艰难曲折的。"
 3_focus_30: "老革命区"
 3_focus_30_desc: "老革命区是我们的基本盘，应当放在第一位。"
 3_focus_31: "广大东部"
 3_focus_31_desc: "东部是我们宝贵的农业地区，应当促进这里的发展。"
 3_focus_32: "中部城市群"
 3_focus_32_desc: "中部城市群是我们工业发展的核心，应当加大投资和建设力度。"
 3_focus_33: "加丹加矿区"
 3_focus_33_desc: "加丹加矿区是我们重要的资源基地，应当加强开采和利用。"
 3_focus_34: "狂野西部"
 3_focus_34_desc: "西部是我们潜力巨大的地区，应当加快开发和建设。"
 3_focus_35: "旧核心区"
 3_focus_35_desc: "旧核心区是我们历史的见证，应当保护和传承这里的遗产。"
 3_focus_36: "迁都"
 3_focus_36_desc: "我们的革命故乡乌伦迪显然无法胜任首都的重任，我们应当迁都至更适合的城市，以推动国家的发展和繁荣。"
 3_focus_37: "审视国内"
 3_focus_37_desc: "我们应当审视国内的各项事务，确保国家的治理和发展方向符合人民的利益和国家的长远目标。"
 3_focus_38: "创办国家电工"
 3_focus_38_desc: "我们应当创办国家电工企业，推动电力行业的发展和技术创新，为国家的工业化和现代化提供坚实的基础。"
 3_focus_39: "铁路规划"
 3_focus_39_desc: "我们应当制定铁路规划，建设高效便捷的铁路网络，促进区域经济发展和人员流动，为国家的繁荣和人民的福祉提供有力支持。"
 3_focus_40: "真正的五年计划"
 3_focus_40_desc: "之前的经验告诉我们，五年计划的制定和实施需要科学合理的规划和有效的执行。我们应当制定真正符合国家发展需求的五年计划，确保经济、社会和环境的协调发展，实现国家的长远目标。"
 3_focus_41: "重启科研"
 3_focus_41_desc: "我们应当重启科研工作，推动科学技术的发展和创新。通过加大科研投入、培养人才和加强国际合作，我们将提升国家的科技实力，为经济发展和社会进步提供有力支撑。"
 3_focus_42: "鼓励创新"
 3_focus_42_desc: "我们应当鼓励创新精神，激发人民的创造力和潜力。通过提供政策支持、资金投入和创新平台，我们将推动科技创新、产业升级和社会进步，为国家的繁荣和人民的福祉创造更多机会。"
 3_focus_43: "建立青年理工学院"
 3_focus_43_desc: "我们应当建立青年理工学院，培养新一代的科技人才和工程师。通过提供优质的教育资源、实践机会和创新平台，我们将为国家的科技发展和产业升级提供坚实的人才基础，推动国家的现代化进程。"
 3_focus_44: "影视行业"
 3_focus_44_desc: "我们应当发展影视行业，推动文化产业的发展和创新。通过支持影视创作、培养人才和加强国际合作，我们将提升国家的文化影响力和软实力，为人民提供丰富多彩的文化生活和娱乐体验。"
 3_focus_45: "神秘武器"
 3_focus_45_desc: "我们应当提升国家的军事能力和战略威慑力。领袖已经批准了一批特别资金，我们将确保国家在国际舞台上的安全和地位，为人民的和平与繁荣提供有力保障。"
 3_focus_46: "跑步进入法团主义"
 3_focus_46_desc: "我们应当加快推进法团主义建设，确保国家的政治、经济和社会体系更加高效和有序。通过完善法律法规、加强组织建设和推动社会参与，我们将实现国家治理的现代化和法治化，为人民创造更加稳定和繁荣的生活环境。"
 3_focus_47: "农业学福加"
 3_focus_47_desc: "东部有一个叫做福加的农场，它是我们农业发展的典范。我们应当学习福加的经验和做法，推动农业现代化和可持续发展，为国家的粮食安全和农村经济繁荣提供有力支持。"
 3_focus_48: "工业学旺达"
 3_focus_48_desc: "旺达工业区是我们工业发展的典范。我们应当学习旺达的经验和做法，推动工业现代化和技术创新，为国家的经济发展和产业升级提供坚实基础。"
 3_focus_49: "粮食之战"
 3_focus_49_desc: "仅仅依靠现有的农业产量是无法满足国家发展的需求的，我们必须采取积极措施，提升粮食生产能力，确保国家的粮食安全和人民的生活质量。"
 3_focus_50: "生育之战"
 3_focus_50_desc: "如果我们要成为一个强大的国家，我们必须确保人口的持续增长和社会的稳定。我们将采取一系列措施，鼓励生育、改善家庭福利和提供支持服务，以应对人口老龄化和劳动力短缺的问题，确保国家的长远发展和繁荣。"
 3_focus_51: "农业生产建设兵团"
 3_focus_51_desc: "我们将组建农业生产建设兵团，集中力量发展农业生产和农村建设。通过党员身先士卒、优化资源配置和加强基础设施建设，我们将提升农业产量和质量，推动农村经济发展，为国家的粮食安全和社会稳定提供有力保障。"
 3_focus_52: "设立生育基金"
 3_focus_52_desc: "我们将设立生育基金，提供经济支持和激励措施，鼓励家庭增加生育率。通过资金补助、税收优惠和社会福利政策，我们将减轻家庭的经济负担，促进人口增长和社会的可持续发展，为国家的未来奠定坚实基础。"
 3_focus_53: "大海航行靠舵手"
 3_focus_53_desc: "我们将加强国家的领导，确保国家在复杂多变的国际环境中稳健前行。通过提升决策水平、优化管理体系和增强执行力，我们将引领国家走向繁荣和稳定，为人民创造更加美好的生活。"
 3_focus_54: "国有矿产法案"
 3_focus_54_desc: "我们将制定国有矿产法案，确保国家对矿产资源的有效管理和利用。通过法律法规的制定和执行，我们将保护国家的资源利益，促进矿产开发的可持续发展，为国家的经济增长和社会进步提供坚实基础。"
 3_focus_55: "成立煤钢共同体"
 3_focus_55_desc: "我们将成立煤钢共同体，整合煤炭和钢铁产业资源，实现产业协同发展。通过优化生产流程、提升技术水平和加强市场竞争力，我们将推动国家工业化进程，为经济发展和社会繁荣提供有力支撑。"
 3_focus_56: "深入挖掘"
 3_focus_56_desc: "很明显，罗德西亚的资源潜力尚未完全开发，我们必须采取积极措施，深入挖掘和利用这些资源。我们将提升资源产量和质量，为国家的经济发展提供坚实保障。"
 3_focus_57: "生产效率最大化"
 3_focus_57_desc: "为了达到五年计划的目标，我们必须最大化生产效率。通过优化生产流程、引入先进技术和加强管理，我们将提升工业产能和经济效益，为五年计划的实施提供有力支持。"
 3_focus_58: "现代生产线"
 3_focus_58_desc: "我们将建设现代化生产线，提升工业生产的自动化和智能化水平。通过引入先进设备、优化工艺流程和加强技术培训，我们将提高生产效率和产品质量。"
 3_focus_59: "全国人民学褐衫军"
 3_focus_59_desc: "我们将通过全国范围的宣传和教育，推广褐衫军的精神和理念。通过组织培训、开展活动和提供实践机会，我们将激励人民继承和发扬褐衫军的勇敢、忠诚和奉献精神，为国家的繁荣和稳定贡献力量。"
 3_focus_60: "康乐汽车厂"
 3_focus_60_desc: "新生活可不止要有粮食和衣物，还要有汽车。康乐汽车厂将为人民提供大量的汽车产品，满足日益增长的交通需求，推动国家的工业发展和经济繁荣。"
 3_focus_61: "钢城乌伦迪"
 3_focus_61_desc: "钢城乌伦迪是我们工业发展的重要基地。我们将加大对乌伦迪钢铁厂的投资和建设力度，提升钢铁生产能力和技术水平，为国家的工业化进程提供坚实支撑。"
 3_focus_62: "扩建津巴布钢铁厂"
 3_focus_62_desc: "我们将扩建津巴布钢铁厂，提升钢铁产量和质量。通过引入先进设备、优化生产流程和加强技术培训，我们将增强钢铁产业的竞争力，为国家的工业发展和经济繁荣提供有力支持。"
 3_focus_63: "国家石油公司"
 3_focus_63_desc: "我们将成立国家石油公司，统筹管理和开发石油资源。通过科学规划、技术创新和市场拓展，我们将提升石油产量和质量，为国家的能源安全和经济发展提供坚实保障。"
 3_focus_64: "农业现代化"
 3_focus_64_desc: "我们将推动农业现代化，提升农业生产效率和质量。通过引入先进技术、优化种植结构和加强农民培训，我们将实现农业的可持续发展，为国家的粮食安全和农村经济繁荣提供有力支持。"
 3_focus_145: "超级橡胶产业"
 3_focus_145_desc: "我国拥有天然的橡胶产地，我们将充分利用这一资源，发展超级橡胶产业。通过引进先进技术、优化生产流程和加强市场拓展，我们将提升橡胶产量和质量，为国家的工业发展和经济繁荣提供坚实支撑。"
 3_focus_65: "整合军工产业"
 3_focus_65_desc: "我们将整合军工产业资源，提升武器装备的研发和生产能力。通过优化产业布局、引入先进技术和加强人才培养，我们将增强国家的国防实力和战略威慑力，为国家的安全和稳定提供有力保障。"
 3_focus_66: "公共住房计划"
 3_focus_66_desc: "我们将实施公共住房计划，改善人民的居住条件和生活质量。通过建设经济适用房、提供住房补贴和优化城市规划，我们将满足人民的住房需求，推动社会的和谐发展。"
 3_focus_67: "拖拉机厂"
 3_focus_67_desc: "铁犁牛耕的时代已经过去了，我们必须让农民们使用现代化的拖拉机来耕种土地。拖拉机厂将为农民提供高质量的拖拉机产品，提升农业生产效率和质量，为国家的粮食安全和农村经济繁荣提供有力支持。"
 3_focus_68: "建设医疗设施"
 3_focus_68_desc: "我们将建设现代化的医疗设施，提升医疗服务的质量和可及性。通过引进先进设备、优化医疗资源配置和加强医务人员培训，我们将改善人民的健康状况，保障公共卫生安全，为国家的社会发展和人民福祉提供坚实保障。"
 3_focus_69: "新工业区"
 3_focus_69_desc: "随着工业化进程的加快，我们将建设新的工业区，推动产业集聚和经济发展。通过规划合理的工业布局、提供基础设施和政策支持，我们将吸引企业投资，提升工业产能和技术水平，为国家的经济繁荣和社会进步提供有力支撑。"
 3_focus_71: "保障抚恤金"
 3_focus_71_desc: "我们将保障抚恤金的发放，确保退役军人及其家属的生活得到妥善照顾。通过完善相关政策、提高资金投入和优化管理机制，我们将为退役军人提供稳定的经济支持和社会保障，体现国家对他们的尊重和关怀。"
 3_focus_72: "墨家思想税制改革"
 3_focus_72_desc: "我们将推进墨家思想指导下的税制改革，优化税收结构和管理方式。通过简化税收流程、提高征管效率和减轻企业负担，我们将促进经济发展和社会公平。"
 3_focus_73: "产业重构"
 3_focus_73_desc: "我们将进行产业重构，优化产业结构和资源配置。通过推动高新技术产业、现代服务业和传统产业的协调发展，我们将提升国家的经济竞争力和可持续发展能力，为人民创造更多就业机会和福祉。"
 3_focus_74: "挖掘西部潜力"
 3_focus_74_desc: "西部连接着大西洋，是我们国家的战略要地。我们将加大对西部地区的投资和建设力度，挖掘其潜力，推动经济发展和社会进步。"
 3_focus_75: "重铸中部荣光"
 3_focus_75_desc: "中部是我们国家的工业和经济核心，我们将加大对中部地区的投资和建设力度，重铸其荣光，推动产业升级和技术创新。"
 3_focus_76: "东部大开发"
 3_focus_76_desc: "东部是我们国家的重要农业和经济区域，我们将实施东部大开发战略，提升基础设施建设和产业发展，推动区域经济繁荣和社会进步。"
 3_focus_77: "建军大业"
 3_focus_77_desc: "我们将致力于建设强大的军队，提升国家的国防实力和战略威慑力。通过加强军事训练、优化装备配置和提升指挥能力，我们将确保国家的安全和稳定，为未来可能爆发的战争提供有力保障。"
 3_focus_70: "发行新版货币"
 3_focus_70_desc: "我们将发行新版货币，提升货币的稳定性和流通效率。通过优化货币设计、加强金融监管和提高公众信心，我们将促进经济发展和社会稳定，为国家的繁荣和人民的福祉提供坚实保障。"
 3_focus_78: "武器弹药委员会"
