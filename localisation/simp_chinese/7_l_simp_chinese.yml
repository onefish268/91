l_simp_chinese:
 6_focus_1: "准备总统选举"
 6_focus_1_desc: "斯坦利伯爵的任务已经完成了，是时候结束军政府时期了。总统是联邦的象征，选举将会让人民有机会选择他们的领导人。"
 6_focus_2: "支持斯坦利，再干三十年"
 6_focus_2_desc: "斯坦利伯爵在任期间取得了显著成就，我们将支持她继续领导国家发展，如果再给她一些时间，她将会带领联邦走向更辉煌的未来。"
 6_focus_3: "国民大会党的胜利"
 6_focus_3_desc: "斯坦利已经完成了她的任务，国民大会党的领导人卡洛将会让联邦走向一个新的时代。"
 6_focus_4: "自由的国度，勇敢的家园"
 6_focus_4_desc: "在这片土地上，自由不仅是写在独立宣言中的理想，更是每一个公民呼吸的空气、行走的权利与奋斗的尊严。从卢萨卡的枪声到索尔兹伯里的演说，从加丹加的冲锋到莫桑比克的滩头，联邦人用勇气守护着这份自由。这里不问出身，只问梦想；不惧挑战，只畏退缩。正是这种对自由的信仰与面对危难时的勇敢，铸就了圣杯联邦的灵魂。只要自由的火炬仍在高举，这片家园就永远是勇敢者的归宿。"
 6_focus_5: "战争部"
 6_focus_5_desc: "战争部是联邦的核心防御机构，肩负着保卫国家安全、维护领土完整的重任。它不仅是军事力量的象征，更是国家战略与政策的执行者。战争部将确保联邦在面对外部威胁时能够迅速反应、有效应对。无论是在陆地、空中还是海洋，战争部都致力于保护公民的安全与国家的利益，为联邦的和平与繁荣提供坚实保障。"
 6_focus_6: "联邦陆军"
 6_focus_6_desc: "对于联邦的国家安全而言，现有的军队数量太少了，并且没有一个统一的指挥系统。联邦陆军将会是联邦的核心防御力量，确保国家在面对外部威胁时能够迅速反应、有效应对。"
 6_focus_7: "联邦空军"
 6_focus_7_desc: "如果我们想要追上其他国家的军事脚步，那一支强大的空军力量是我们不得不考虑的一部分，因为空军不仅是现代战争的关键力量，更是国家安全与战略威慑的重要支柱。"
 6_focus_8: "联邦海军"
 6_focus_8_desc: "罗德西亚过去有海军吗？有，但只是几艘平板船，没有任何的战斗力。如果我们不想看到敌人从海上入侵我们的国家，那么我们必须建立一支海军力量。"
 6_focus_9: "对外策略"
 6_focus_9_desc: "联邦不是世界孤儿，但外界对我们的情况并没有多少了解，也许我们不需要其他人的认可，但至少让她们知道联邦屹立在非洲的中央。"
 6_focus_10: "介入亚洲"
 6_focus_10_desc: "亚洲经常被欧洲的光芒所掩盖，但亚洲也有自己的多事之地，如果我们想和亚洲人打交道，那么我们势必要拿出我们的诚意。"
 6_focus_11: "斯坦利新政"
 6_focus_11_desc: "我们现在不能迷失方向，斯坦利的新政会对联邦的发展大有脾益。"
 6_focus_12: "卡洛的新思路"
 6_focus_12_desc: "卡洛拥有丰富的对内经验，搞经济也是一把好手，她将会给国家带来新的发展机遇。"
 6_focus_13: "重视大萧条"
 6_focus_13_desc: "大萧条对我们造成的伤害是无可否认的，猖獗的通货膨胀会吃掉人民的财产并贬低她们的劳动，联邦政府将会把重心放在解决大萧条上，通过一切手段来让国民经济复苏。"
 6_focus_14: "公共事业振兴署"
 6_focus_14_desc: "目前仍有数十万国民因为找不到工作而变成了无家可归的流浪汉，政府可以拨款建立一个公共项目机构收容他们，这可能不能完全解决这个问题，但公共事业振兴署仍是往正确方向前进的一个小步骤。"
 6_focus_15: "农业调整法案"
 6_focus_15_desc: "我们的农民也受到了大萧条的波及，我们不能让生产粮食的人也被无法控制的市场毁掉。"
 6_focus_16: "实现经济独立"
 6_focus_16_desc: "大萧条的问题出在了我国的经济不平衡上，如果联邦的经济结构形成一个稳定的三角关系，那任何经济上的困难对我们只是小儿科。"
 6_focus_17: "国家繁荣项目"
 6_focus_17_desc: "确保迅速恢复并持久繁荣的关键在于国家的干预，一个宏大的经济规划可以让市场和资本向着同一个目标前进，而不是互相拆台。"
 6_focus_18: "公共财产法案"
 6_focus_18_desc: "多数人的需求不应被少数人的意愿所压倒，将一些公共区域收为国有资产，以便让地方政府有更多的选择余地。"
 6_focus_19: "公平劳动标准法案"
 6_focus_19_desc: "资本家剥削工人的剩余价值的现象是普遍的，但在眼下我们不应该允许这类现象出现，建立最低工资标准是必要的。"
 6_focus_20: "联邦住宅法案"
 6_focus_20_desc: "很多经济困难的人们在过去也有属于自己的避风港，现在联邦是时候庇护他们了，政府将为国民补贴住房，联邦的每个人都是重要的，没有人会被国家抛弃。"
 6_focus_21: "劳资关系法案"
 6_focus_21_desc: "很多时候工人与资本家的关系是不对等的，这让他们无法提出自己的合理诉求，联邦政府会给他们说“不”的权利。"
 6_focus_22: "补偿金调整法案"
 6_focus_22_desc: "工人们在工厂里干活不可能是无风险的，而补偿金额却微乎其微。政府将为她们买下工伤保险，让她们没有后顾之忧。"
 6_focus_23: "所得税改革"
 6_focus_23_desc: "所得税从每个联邦国民手里缴纳，但大企业家们往往为了利益最大化而偷税漏税，我们会给与她们最严厉的处罚。"
 6_focus_24: "保护性关税"
 6_focus_24_desc: "我们的企业面临着数不清的困难与挫折，而外国的企业却有着关税壁垒的保护，这种情况必须结束。"
 6_focus_25: "扩大企业自主权"
 6_focus_25_desc: "政府的工作不是去插手那些被私人企业已经证明能做得更好的事情，我们应该给我们的国民企业家一些空间，她们会帮得上我们的。"
 6_focus_26: "审视现状"
 6_focus_26_desc: "没有调查就没有发言权。我们不能捂着耳朵说联邦已经“风调雨顺，国泰民安”了，联邦要重视国内的问题。"
 6_focus_27: "乡村发展项目"
 6_focus_27_desc: "我国有着大片大片的乡村地区，忽视它们不可能搞好我们的经济，政府会出台有关乡村发展的建设项目。"
 6_focus_28: "设立最高法院"
 6_focus_28_desc: "过去的民主制度表明立法权不能让国会握在手里，最高法院的诞生是必需品。"
 6_focus_29: "科研与开发办公室"
 6_focus_29_desc: "我们必须关注我们的科研努力，确保科技的继续前进是联邦发展的重要前提。"
 6_focus_30: "紧急权力授权法案"
 6_focus_30_desc: "在当前的世界局势下，总统理应在国家紧急时刻拥有不受任何人约束的特殊权利，尽管会有人抨击总统的独裁，但这是保卫民主的必由之路。"
 6_focus_31: "专利法案"
 6_focus_31_desc: "民间的天才们有着巧妙地构思，政府将出台专利法案，这会激励她们勇于创新，为联邦的科技兴旺做贡献。"
 6_focus_32: "联邦工业复兴"
 6_focus_32_desc: "以《国家工业复兴法》为核心，我们将凝聚工商界，劳工界与政府的力量，稳定生产，刺激消费，引领联邦工业走向复兴之路。"
 6_focus_33: "启动财政刺激"
 6_focus_33_desc: "我们决定启用积极的财政政策，增加政府支出，向关键领域注入资金，以刺激需求，创造就业。"
 6_focus_34: "海岸投资"
 6_focus_34_desc: "从大西洋沿岸到印度洋沿岸，我们的沿海城市是贸易和创新的桥头堡，政府会加大对东西两岸城市的投入，以两翼带动全国的经济腾飞。"
 6_focus_35: "国有化矿产法案"
 6_focus_35_desc: "加丹加的经历告诉我们矿产资源必须掌握在国家手里才安全，矿石是我国重要的能源和战略物资。"
 6_focus_36: "内陆建设"
 6_focus_36_desc: "广袤的内陆地区是联邦的龙兴之地，政府将着重实现内陆地区的工业体系和道路体系优化，巩固联邦的腹部力量。"
 6_focus_37: "民生重心"
 6_focus_37_desc: "人民的福祉是国家的基石，民生建设既是道义责任，亦是社会长期稳定的前提。"
 6_focus_38: "军事重心"
 6_focus_38_desc: "在动荡的国际局势下，强大的国防是和平最可靠的保障。联邦将加大对军工体系的投入，确保国家能在任何风暴前都有信心度过。"
 6_focus_39: "规律化挖掘"
 6_focus_39_desc: "经过政府的勘探，我国有着大量的深层矿产资源，但这些矿石如何显露于世对我们是一个难题。我们可以优先处理已经裸露的矿脉，在逐步完成下一步的开采任务。"
 6_focus_40: "建立锐克银行"
 6_focus_40_desc: "没有银行业的金融保障，国家的经济就始终无法回到正轨。联邦将会把资金注入一个新的国家银行，并呼吁国民把钱都存进来，以稳定国内的经济局势。"
 6_focus_41: "累计财富税法案"
 6_focus_41_desc: "我们国家的有些人积累了大量资本，这些钱的用处都只是为了她们的一己私欲，对国家没有半点好处。我们将迫使这些积累了无用财富的公民把资金再投入经济之中，促进经济内循环。"
 6_focus_42: "国民就业战略"
 6_focus_42_desc: "失业来自一个简单的事实：人民与提供的工作不相匹配，工厂闲置是因为雇主找不到合适的人。政府将在劳动力与工厂之间穿针引线，确保每一位国民都能找到合适的岗位，每一座工厂都能找到合适的员工。"
 6_focus_43: "养老金法案"
 6_focus_43_desc: "在工作了一辈子后，国民理应在老年时得到基本的生活保障和应有的尊重。政府将通过养老金来回应这些问题，国民会因此感受到联邦的温度。"
 6_focus_44: "注意侧重"
 6_focus_44_desc: "以现有的财政显然无力支撑大规模的建设，我们必须面临一个艰难的抉择。"
 6_focus_45: "重组国家电台"
 6_focus_45_desc: "为了联邦的政策顺利推行，我们将重组旧时代的总督府宣讲电台为国家炉边电台，利用媒体让国民加深对联邦政府现有政策的理解。"
 6_focus_46: "劳工管理法案"
 6_focus_46_desc: "工厂的车间总是由从未在生产线上工作的人管理，由于无法理解生产的实际情况，这些人总会提出一些不切实际的任务。为了保护联邦的经济不受她们的影响，我们将推行工人有限自治制度。"
 6_focus_47: "工会代表法案"
 6_focus_47_desc: "工作是人类生活的核心部分，而组建工会则是组织民主社会的重要部分，我们应该承认这一点，并让工会代表登上国会讲台，而不是让资本家完全霸占本属于工人的席位。"
 6_focus_48: "捍卫联邦梦"
 6_focus_48_desc: "联邦是我们的家，而自己的家园是需要自己来守护的。它是所有人的梦想，我们不允许任何人来打碎它！"
 6_focus_49: "唤醒民众"
 6_focus_49_desc: "尽管许多人尚未意识到，但刚刚统一的联邦事实上面临着内忧外患的巨大危机，政府将敦促提高国民的思想觉悟，唤醒民众的爱国精神。"
 6_focus_50: "保卫祖国"
 6_focus_50_desc: "不是一定得要外国入侵才要保卫祖国，豺狼们正对着稚嫩的联邦垂涎欲滴，我们在正式与她们交手之前，努力让自身变得强大是必要的。"
 6_focus_51: "撸起袖子加油干"
 6_focus_51_desc: "劳工圈子里有一句口号“撸起袖子加油干”，这很符合目前我国的精神文化，我们将推广这句口号，激励更多的人专注于工作。"
 6_focus_52: "公平就业实践委员会"
 6_focus_52_desc: "我们设立这个委员会，旨在禁止工作中的种族歧视，确保所有公民无论肤色都能公平的获得就业机会。"
 6_focus_53: "井喷式增长"
 6_focus_53_desc: "在国防订单和内需扩张的双重驱动下，联邦经济正经历前所未有的爆发式增长，我们必须抓住这个机遇，将短暂的繁荣转化为持久的经济活力。"
 6_focus_54: "奋起直追"
 6_focus_54_desc: "事实证明人民的创造力是无穷的，再加把劲，一路追上世界强国的步伐！"
 6_focus_55: "强化劳工权益"
 6_focus_55_desc: "工人是国家建设的脊梁。我们将进一步强化劳工权益，扩大集体谈判覆盖范围，加强职业安全保障。有力的工会和负责的资方相结合，方能构建持久和谐的劳资关系，为经济繁荣提供稳定基础。"
 6_focus_56: "社会保障法案"
 6_focus_56_desc: "我们将加大对养老金，失业保险投入与弱势群体救助的力度，健全联邦的社会保障体系，它将成为国民抵御风险的“安全网”。"
 6_focus_57: "超英赶苏"
 6_focus_57_desc: "我们要打出“超英赶苏”的政治口号，进一步激发国民的建设积极性，或许我们难以实现这个目标，但这将给予国民一个伟大的行动方向。"
 6_focus_58: "先进生产模式"
 6_focus_58_desc: "我们将推广工会与企业管理层协同决策的先进生产模式。通过劳资合作委员会、利润分享计划与技术培训项目，大幅提升劳动生产率。这种模式不仅使工人分享发展成果，也让企业在效率上获得竞争优势。"
 6_focus_59: "自由灯塔"
 6_focus_59_desc: "若当全世界都臣服于暴政的阴影，我们必须成为那束刺破黑暗的光。让所有仍在抵抗的意志，无论多么微弱，都能看到希望的方向。这不仅是战略，更是我们存在的意义——向世界证明，自由，永不沉沦。"
 6_focus_60: "介入非洲"
 6_focus_60_desc: "我们的首要任务必须是确保我们为自己半球的任何事态做好准备。"
 6_focus_61: "与母国的链接"
 6_focus_61_desc: "联邦的命运与我们的母国圣杯王国息息相关，和当今世界最强大的国家建立紧密联系有利无害，我们可以从中捞到不少好处。"
 6_focus_62: "介入欧洲"
 6_focus_62_desc: "在伟大战争过后不到20年，欧洲各国就准备再次开战。我们必须做好准备，在局势需要的时候迅速干预。"
 6_focus_63: "导向式贸易法案"
 6_focus_63_desc: "联邦拥有着巨额的资源和粮食产出，工业机床和先进产品却相对短缺，圣杯王国则恰恰相反。我们可以根据这个情况实行导向式贸易法案，双方各取所需。"
 6_focus_64: "教导总队"
 6_focus_64_desc: "圣杯王国的军事实力世界一流，国防部长多次请求聘请一支王国军官团来训练我们的军队，那么应该实现部长的愿望，这会加强联邦陆军的军事水平。"
 6_focus_65: "圣杯经济专家"
 6_focus_65_desc: "作为大萧条的发生地，圣杯王国在应对经济危机上有着自己的独到见解，我们可以适当听取一下专家们的建议，以更好地建设国家。"
 6_focus_66: "哈佛尔军校"
 6_focus_66_desc: "个人要服从集体或更大的整体，服从部队，服从一个团队。\n\n纪律和军容是我们比其他学校甚至部队要求更严格的地方。\n\n最重要的是，在关键的时候能够坚持原则。\n\n恪尽职守的精神比个人的声望更重要。"
 6_focus_67: "抗日援华"
 6_focus_67_desc: "日本人，人类的恶种。他们对亚洲人民犯下了滔天的恶行，现在是时候承受世界对它的愤怒了。"
 6_focus_68: "战争计划处"
 6_focus_68_desc: "我们正迈向一场决定性冲突，这或许是‘最后的战争’。我们将倾尽国力，确保彻底击败敌人，并在此后建立永久的和平秩序。为此，任何牺牲都将是值得的。"
 6_focus_69: "大棒主义"
 6_focus_69_desc: "对付这些畏威而不怀德的国家我们有自己的一套办法：与我们步伐一致的人，用萝卜喂饱她们；对我们抱有敌意的人，用棒槌敲打她们。"
 6_focus_70: "建造六角大楼"
 6_focus_70_desc: "我们军队的扩张需要一个全新的总部来指挥，而不是和公务员们挤在同一个屋檐下。"
 6_focus_71: "国民兵役法案"
 6_focus_71_desc: "我国的兵员储备远远不能满足军队的需求，政府将出台国民兵役法案，让每一个公民都进行为期三年的基础军事教育，意在战争爆发时我们将有充足的后备人力。"
 6_focus_72: "紫色战争计划"
 6_focus_72_desc: "邪恶势力是人类的公敌，我们必须铲除。"
 6_focus_73: "黄色战争计划"
 6_focus_73_desc: "共产主义是民主的敌人，也是对人民思想的恶劣荼毒，我们应当消灭。"
 6_focus_74: "蓝色战争计划"
 6_focus_74_desc: "法西斯是个人独裁的温床，也是所有民主国家的混乱之源，我们必须履行自由的义务。"
 6_focus_75: "国防部"
 6_focus_75_desc: "将战争部扩建为国防部，是要强调我们再也不能在考验的时刻来临前忽略我们的防御，我们必须始终保持警惕。"
 6_focus_76: "妇女同等服役法案"
 6_focus_76_desc: "联邦不能拒绝任何想要为国出力的人，每个穿制服的女性公民都会空闲出一名士兵，让他在前线为了国家而战斗。"
 6_focus_77: "一体化训练法案"
 6_focus_77_desc: "统一的训练计划是必要的，联邦陆军负责人应致力于这个方向。"
 6_focus_78: "卢萨卡演习"
 6_focus_78_desc: "没有经历过实弹训练的士兵连枪都不知道怎么开，这是我们无法接受的。政府将在首都郊区进行大规模的军事演习，这无疑会大大提升军队的总体水平。"
 6_focus_79: "国民警卫队"
 6_focus_79_desc: "很多时候联邦警察并不能解决所有治安问题，联邦将筹建国民警卫队这个类军队的官方组织，与警探们一起解决问题。"
 6_focus_80: "军工复合体"
 6_focus_80_desc: "我们的军工产业十分强劲，但有限的资源分配掣肘了它们，实行有效的措施以让兵工厂们更为高效的利用资源是提高产量的关键。"
 6_focus_81: "老兵俱乐部"
 6_focus_81_desc: "老兵是联邦的重要财产，为了防止在国家需要她们的时候找不到人，由政府资助的老兵俱乐部应时而生。"
 6_focus_82: "新式战术"
 6_focus_82_desc: "有句格言说得好“打内战内行，打外战外行”，这十分形象的体现了我军的现状。为了应对复杂局势，新的战术思想势在必行。"
 6_focus_83: "摩托化"
 6_focus_83_desc: "步兵始终是战场的主要单位，任何战斗都需要步兵来占领土地。为步兵提供卡车运输不仅能够快速向目标前进，还能让她们面对突发情况做出快速的反应。"
 6_focus_84: "坦克实验"
 6_focus_84_desc: "坦克是现代战争的主旋律，我们必须找出最好的利用它们的方法。"
 6_focus_85: "远程火力支援"
 6_focus_85_desc: "尽我们所能去支援我们勇敢的军队是减少伤亡的关键，这可以通过远距离炮火打击或者更多战场的直接支援来实现。"
 6_focus_86: "游骑兵战法"
 6_focus_86_desc: "古代的游骑兵为我们的参谋部提供了新的思路，这会让我们的部队变得极其难缠且胜券在握。"
 6_focus_87: "火力协同"
 6_focus_87_desc: "“大炮轰完步兵上”的方法并不能对敌人造成有效的创伤，在技术进步的今天，我们可以采用大炮和步兵一起上的方法来赢得胜利。"
 6_focus_88: "空战计划部"
 6_focus_88_desc: "军事空中力量的根本目标是摧毁敌人的空域防守，一个行之有效的计划部将使得达成目的更加有规律。"
 6_focus_89: "加入同盟国"
 6_focus_89_desc: "现在不是我们独善其身的时候，世界上的其他民主国家正在拼尽全力维护秩序与和平，我们要加入她们的行列，用自己的方式为自由献出力量。"
 6_focus_90: "空中支援"
 6_focus_90_desc: "将飞机与陆地单位联动起来，会有卓越的成效，德国已经证明了这一点。"
 6_focus_91: "战略轰炸"
 6_focus_91_desc: "在前线摧毁多少敌人的装备都没有用，后方的工厂会源源不断的给她们输送物资，而我们的飞行堡垒可以解决这个“痛点”。"
 6_focus_92: "贴地轰炸"
 6_focus_92_desc: "德国人的舔地机叫斯图卡，我们的叫什么？斯坦利？"
 6_focus_93: "紧急航空法案"
 6_focus_93_desc: "联邦连木头飞机都没有，这是一个残酷的现实。号召国民为了飞机捐款，政府也会投入海量资金来快速充实我们的空军家底。"
 6_focus_94: "护航编队"
 6_focus_94_desc: "联邦的贸易往来离不开运输船，防止有意之人破坏是海军的任务之一。"
 6_focus_95: "两洋海军法案"
 6_focus_95_desc: "我们的海军要有能力在任何一片大洋中对抗任何敌人，联邦将专门用一项法案来落实这一需求。"
 6_focus_96: "海军船务局"
 6_focus_96_desc: "我们将合并船坞修理局和海军工程局来监督未来的海军发展，任何可能分散海军的机构都要进行集中化管理。"
 6_focus_97: "海事委员会"
 6_focus_97_desc: "运输货船才是联邦在远离本土的战争中轻松取胜的关键。为了增加战时可用的运输船储备，我们将成立专门的委员会来注重此事。"
 6_focus_98: "扩大海军基地"
 6_focus_98_desc: "现有的民用码头显然无法停靠钢筋铁骨的大头军用舰船，专业的海军港口势在必行。"
 6_focus_99: "订单约定"
 6_focus_99_desc: "政府将拨款给海军以扩大规模，而海军则给造船厂下达大量订单，这会提高造船厂们的建造速度，“有钱不赚是王八蛋”嘛。"
 6_focus_100: "轮船招商处"
 6_focus_100_desc: "一个成熟的运输船管理机构有利于提高货轮的效率。"
 6_focus_101: "远洋客轮"
 6_focus_101_desc: "我们的贸易网络遍布全球，我们的客人来自五湖四海，对现有的货轮进行适当的长途化改造，会让我们的运输船效率更高。"
 6_focus_102: "自由轮"
 6_focus_102_desc: "我们的国度是自由的国度，我们的轮船象征着我们的自由旗帜。自由轮会载着自由的儿郎们穿越艰难险阻，抵达需要她们的地方。"
 6_focus_9999: "只是调味汁"
 6_focus_9999_desc: "6_focus_9999_desc"
