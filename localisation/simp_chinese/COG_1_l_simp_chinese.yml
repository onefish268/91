  #啊，我死了
  #以后要用的东西、设定

  #幻想乡（大概类似现实的法国）对于这个远在天边的殖民地的经济与政治不是很上心。

  #中非在魅魔的“无为而治”之下，即使富强了，也会倾向于和幻想乡保持较强的联系（一方面是魅魔所代表的殖民势力反而没有本土的剥削势力耀眼，另一方面绮罗作为殖民地改革的急先锋，在经历了旧势力土崩瓦解的阶段后，绮罗构建的秩序作为最完全、最先进的，被其他部族采用，因为绮罗本身倾向于向宗主国学习、获得技术，当然，不是说愿意卑躬屈膝当奴仆，因此中非和宗主国——幻想乡到了独立的时候，不是直接决裂，而是基本就是作为澳大利亚之于英国一样，成为一个自治领般存在的国家），还会有额外的事件去刺激魅魔挺身而出带领原住民们抗击黑暗超凡智能，进一步强化原住民向着魅魔（以及其代表的幻想乡）。

  #各族对宗主国的接受肯定有差别，到时候，在正常的线路走向里，中非会因为幻想乡的认可(当然还有原住民对于自由与权利的争取，这才是最主要的)得到解放，到时候，中非内部会展开辩论，因为各族的接纳程度不一，最后，绮罗、鼠族、萌螈、龙娘共同组建了一个共和国，但是，以萌螈为首的地区，在政策上谢绝外国资本的进入，而其他地区则容纳入世界市场，形成大体上两种格局的国家。

  #到时候，这些原住民也会产生这样的意识（要求经历共同的磨难和战争，要求旧秩序全部土崩瓦解）:虽然，我们是不同的民族，其他国家似乎也总在高举什么高大上的旗帜，但是，这些都没法解释我们身边的美好:鼠族姑娘在稻田里耕种，绮罗厨师在为大家准备美味的饭菜，旅鼠们捎来了远方奇特的物品，萌螈收获的蘑菇与凝胶着实可口，龙娘们憨态可掬的样子让我心情舒畅。我们曾经走过了艰难的岁月，我们的过往早已交织在一起不可分割，未来，我们仍会像彩虹一样，共同存在。

  #魅魔的统治来源与逻辑是这样的:从第一次伟大战争到1936年，魅魔是一个逐渐懒惰最后完全脱离治理的总督，基本把事情放任给绮罗们了，在这期间，为什么绮罗、萌螈、鼠族、龙娘不反抗，是因为，魅魔刚开始是带着一些武装来的，即使大家再怎么不乐意也得认她是新主，不过，她先是解除螈气禁令和保护龙娘，赢得了萌螈和龙娘的好感(同时，萌螈势力曾遭遇摧残，需要时间恢复，所以在很长一段时间没有完全要独立，赖在雨林里斡旋的意思)。对于绮罗，绮罗们发现新来的统治者相比之前的态度很好，便尝试接触，后面发现她竟然委以重任，便欣然接受，绮罗们也是各个部族最为积极合作的。对于鼠族，鼠族早之前因为内斗削弱了不少，各个领主完全没有意愿团结在一起，也惧怕单独面对魅魔，所以索性接受魅魔的统治(而且，魅魔的剥削比起上一届的德国殖民者好)，龙娘甚至是被保护的，这个就不用说了

  #魅魔的存在，让中非独自繁荣发展有了6个极其重要的条件：1、魅魔代表的幻想乡势力在名义上统治了这片土地，这种隶属的身份在一定程度上阻挡了外国对这片土地的觊觎，为中非的独自发展提供了干扰较少的外交环境。2、魅魔的低压统治没有造成太大的剥削压力，保证了中非的生产力、财富和活力不会被抑制得太死，并且，魅魔压根不会在乎殖民地建设太多的工厂、实现更好的自主化会威胁殖民统治，而放任了中非的自主发展。3、宗主国的先进技术得以直接输入到殖民地内部为原住民学习，通常，输入进殖民地的各种先进工业设备和生产技术都是被殖民者严格把控、对原住民严防死守的，但是，魅魔的不作为让这些技术随意地被原住民特别是绮罗一族给偷学过去了。4、魅魔的殖民统治在名义上把大中非的天南地北变成了一个整体，为所有部族提供了一个共同的身份标签——中非人的基础，为人口、物资、财富在内的流动和整个中非的市场构建打下了基础。5、魅魔的名号可以被原住民随意借用，在外界看来，很多来自总督的请求实际上是原住民借总督之名发出的，也因此能够更加顺利地向他国寻求帮助。6、魅魔代表的宗主国虽然不掌控殖民地秩序，但是，她们的存在或多或少还是对当地部族造成了一定的威慑，确保了一些混乱事件不会发生。

  #绮罗官员体系的构建。最初，绮罗是以后来者的身份进入了中非，当时，许多地区已经被萌螈和鼠族所占领，只有那些真正穷山恶水、被鼠族遗弃的地方才能容纳这些迟到的猫猫。居住环境的低下和人口上的劣势促使她们放下用武力去和人家硬碰硬的想法，而是干脆以改造环境或者是融入其他部族为策略来求生。改造环境的绮罗通过多年的尝试和总结，掌握了一种能够有效改良土壤的办法，并且，出于改造环境的需要，她们在手工制作工具方面也积攒下了许多独到的经验。对于这些试图融入其他部族的绮罗，她们往往表现出极大的善意和高超的谈判技巧来为自己斡旋权利，同时，又恪守底线来保证自身利益并维持她们在其他部族的形象，因此，在漫长的岁月里，这些绮罗变成了能说会道、善于制作、维持底线的部族。在1884年，当柏林会议召开之后，许多探险家在荣誉和财富的驱动下纷纷进入中非“探险”，并通过签署条约、设立据点等手段，将这些土地变成国家的殖民地。殖民者的魔爪不是一两天内收紧的，一些绮罗提前察觉到了不对，通过信使系统提醒其他绮罗尽早撤离，一些则继续观望，寄希望于这些殖民者不会做出太过分的事情。然而，殖民者完全不同于先前她们遇到的部族，殖民者不是来定居的，而是来剥削财富回宗主国的，原住民未曾见识过的坚船利炮将当地的军队打得粉碎，很多绮罗没能在殖民者到来之前逃走，便沦为了殖民秩序下的治民。有一天，殖民者研究起来这些地方的部族特性后，发现了绮罗——这是一个人口稀少，没有自己稳定的地盘在沿海地区（也就是殖民者控制最强的那些地区），并且，相比于喜欢内斗的鼠族、不稳定的萌螈、完全没有开化的龙娘，绮罗拥有善于社交和学习的品质，于是，这些绮罗被殖民者大量委派成殖民地官员，协助殖民者加强统治和剥削。这样的体系，本来应该会成为殖民者的趁手工具，然而，德国殖民者万万没有想到，这样的工具未来会被一个懒惰的总督给接手，并迅速异化成了对殖民统治十分致命的改革势力。

  #黑暗超凡智能的干涉可以加强坐牢魅魔是“中非拯救者”的形象，当黑暗超凡智能捏造的扭曲怪物越过国界，袭扰中非时，魅魔喜出望外，认为这是一个强大的对手与自己切磋的绝妙机会，被怪物们袭击的各个部族会被魅魔(魅魔会以有怪物出现为由除掉某些碍事的鼠族领主，会以诅咒附着在了一些商人身上，打击那些贪婪的不听话的旅鼠，会强制推进修士规模扩编，并让那些执着于限制数量的修士最好想想‘你如果不希望自己被毁灭，最好做聪明的事情’‘你如果没有底气打败那些家伙，就老老实实让出你的权利给更多人吧’)要求听命与她，然后在魅魔的带领下获得胜利，灾难和魅魔会在某种程度上冲击中非原有的架构，这反而使得绮罗的系统是唯一保持完整的(龙娘那种还是忽略掉吧)，当其他部族失去了旧日的秩序，希望寻找新的方向时，会选择绮罗的方向，从而让中非焕发新生(正好绮罗的影响力也在随着她们的建设渗透到各个地方)

  #萌螈的螈气来源，其实是萌螈自身身体特性导致的，拥有外腮以及布满更多血管和神经的皮肤，更加能够感受外部物质的变化和流动，在源萃石的影响下，萌螈成功觉醒了一种能力，操纵体内的一种力量从而改变世界。螈气有五种，每个萌螈都有自己唯一选定一种经脉，这种经脉，其实本质是萌螈特化使用螈气的方式，为了收集螈气，萌螈会进入打坐状态，放空思想，去努力感受周围的环境和自己的身体变化，这时，萌螈最外层的血液降温变成20度(萌螈先祖——美西螈的最适温度)，这样的温度差，令环境那些游离的热，吸收到体内，然后在一些特殊的酶作用下，转化为高效的螈气，最后就能使用了

  #设想了萌螈修士早期社会可能存在的一个现象:一个萌螈商人从一处矿场买来了铁矿，她希望打造成一把好剑，于是交给了一名磐岩宗派的萌螈，那个萌螈强化了自己，用可怕的力量将这个矿石打碎，并筛出杂质，之后把提炼的铁矿交给了一名灼炎宗派的萌螈，那名萌螈将铁矿放入一个模具中，然后把自己的手往上放了放，螈气被激活，大量的热量定向跑入了这个铁矿里，将其熔化成了合适的形状，熔化的铁被交给了那个磐岩宗派的萌螈，她继续用强化的力量捶打着那些铁，如果感觉温度有点不均或是偏差，就让灼炎宗派的萌螈调整一下，很快两人将锻好好的剑油淬，并适当掰正剑身(一个上古时期萌螈社会的剪影)。

  #萌螈体系在现代前的残酷性:萌螈的修炼，激发经脉需要真气(这种东西需要从烧炼尸体获取，尤其以人类最甚)，早期修炼材料的稀缺，和萌螈体质的差距便造成了这种可怕的制度建设，一些无天赋或者破产、被俘的萌螈沦为奴隶，在需要的时候，她们会被无情地烧炼，不需要的时候，则变成“生育机器”和劳动力(这些奴隶的命运直到外部铁路修入，大量廉价牲畜进入萌螈地区才开始瓦解)，这样特殊的修士培养过程，也说明了为什么修士总是长期不增长。当然，因为她们能够应用先进的技术，能够在贫瘠的雨林干活，这也是她们以前能够有恃无恐地维持如此残暴秩序的原因。
  
  #萌螈的定位，是一个奇特的热带民族，她们的身体特性，成功创造了一种前所未有的体系和相关特性。

  #萌螈修士阶层不能说是脱产，早期的选拔确实是靠天赋，而且很多一部分是要在社会上出卖自己天赋的劳动力的(打铁匠、冶炼匠、农使(催化作物生长发育的专家)、水运使(掌控水源流动)等等)，只是到了一定程度，确实只是专注于政治了，这其他的平时就是从事生产，需要的时候便去参与政治

  #萌螈除了睡眠和打坐能提供螈气之外，其实一天下来能够获取并调用的螈气是比较有限的，因此，她们在一些物理法则上反而很有了解:水运使从低处到高处输水时，发现当水流已经有向上运动的趋势时，只需提供一点点维持趋势的力量，便可将大量的水运上高处。（四两拨千斤）

  #修士会有很多工程知识，并且因为知识都是在修士内流通的，是比较偏经验，也比较零散，除了完全脱产的修士可能会去整理这些，一般普通修士忙于生产，高级一点的修士又工于政治，所以整理的人较为少

  #萌螈们局限在小小的雨林里，只知道很长很长一段时间，如果太阳能够正午露出头来，那么，影子会“消失”，她们发现了这个恒定不变的特征，因此，便认为一年“是两个直射日之间的间隔”(其实就是半年，而且，要在特别特别漫长的时间去发现这一特性，因为雨林多雨难观测的缘故)，因为多雨的天气，她们更多地只能依赖不仅多变而且更容易捕捉的月亮(正午太阳想看到的时间太短了，月亮好歹一年有一半的时间都可能看到，正午太阳就那一会，有一阵雨就完了)

  #文字可能会更多是象形，一点是萌螈社会过于稳定的缘故，因而方言差异极低，口语与书面语会比较趋同，当然，因为修士更多地会描写螈气感知等等极其抽象的事情，平民和修士的内容存在一定的隔阂。热带动植物资源丰富，染料可能会比较多，会不会引入染料写字这种奇葩的方式？(不同颜色代表不同经脉甚至是不同状态)因为萌螈有一些功法是各个经脉的萌螈都学习的，因此，对于极其细小的墨水掌控还是可以的，她们写字的笔会像是钢笔，吸纳了各个颜色的水，然后稍微调动就可以控制那些退回去，或者灌下来，不至于写3种颜色字要三种笔。萌螈写一个字，一笔一捺，便可，在她大脑浮现那个字的时候，颜色的信息也一同出来了，脑海里浮现的影像，成功拨动了螈气，最后螈气注入螈毫里，萌螈仅仅是边想字形边动笔，一切就成了，颜色的调整完全靠自己的螈气波动即可，而这是萌螈所不需要关心的(就像跑步了，呼吸、眨眼、咽口水也不用太去关注)

  #一本史书上记载：“xx年，修士景春，不忍以同族奴婢祭告，遂以动物焚之以明其志。朝廷有数人赞之。修士崇曰:‘既不忍同族人伤，何又以其他动物替之？此止徒增笑尔。’修士怀石曰:‘今以同胞献祭，自然之理尔，非吾族不善也，不知羞耻也，不明同情也。景春之举，乃逆天行道。’” 这似乎是古代修士对人祭的大辩论，这种事情直到今天也没有结果……

  #“大火三月，黑烟蔽月，一片生灵涂炭，故国山河，顷刻支离破碎，旧日友人，悉数离去。余远望之，忽觉袖间螈气微微战栗。夜半焚香，触其气，飘忽不定。昔年镇邪御敌，今镇邪御敌之人安在？何处乃通途？香尽烟散，余怅然若失。不知螈气何往，不知修士何存。” 似乎是一个迷茫的修士在生前对历史大变局的抒发。

  #“尔辈同腐尸毒虫何异！余观之，天下最适为奴者，唯尔辈！” 似乎是一封来自“闲置区”的信，是一个外逃的萌螈写信痛斥雨林里的修士们，不过，这些修士可管不了那么远的地方，更何况，那是魅魔名义上的地盘。

  #在1936年的某个时间段，居住在雨林边缘的一些鼠族小镇突然爆发了波及作物、牲畜甚至当地居民的疾病，造成了比较惨重的损失，一方面鼠族王国内部要派遣一定的物资去缓和当地的灾情，另一方面，她们也在向国际求助（当然，是绕道魅魔那里，然后魅魔发布出去的），国际上的“红十字会”——罗德岛（在这个世界观，明日方舟的罗德岛公司存在于此），就派遣了以蓝毒为队长、蓝毒的好友们克劳格斯与深靛组成的医疗小队前去治疗。为什么派遣她们，是因为罗德岛的宗旨就是治疗、制药，支援中非符合理念，第二，罗德岛的支援常常也伴随和当地的合作，拥有当地领袖邀请那么一个契机可以让罗德岛势力参与进来，第三，蓝毒等人虽然并非医疗干员，但蓝毒本身精通毒理学，对药理制作应该是比较熟练的，深靛、克劳格斯虽然不从事医疗，但是其在抗毒等方面都是比较好的，无需担心几人也被当地疾病伤害。（同时，这些人的进入也会有更多的故事可以写，让故事变得更加生动有趣且充满更多变化，比如罗德岛是否抗击疫情完毕就撤走小队了？小队里擅长武器改进、电磁精通的克劳格斯会不会参与到中非的现代化？蓝毒的那种渴望被人理解，而不是当成毒物的愿望能不能实现？深靛能不能在中非的世界里找到“老师”希望她学习的东西？）

  #鼠族总是携带一些花卉在附近，可能是从自家花盆上轻轻剪下的红花，可能是从农夫手里买下的芳香黄花，她们把她们夹在衣服的口袋上、别在帽子上,因为数组本身的嗅觉是灵敏的，这些花也许对于普通人来说只是淡淡的清香，但是对于她们确实令心情十分畅快的提神剂，甚至不少花朵释放的物质对于一些害虫有毒杀、驱散的作用。而在军队，自从“闪耀世界”(西方世界在非洲的代称，而非洲则被称为“边缘世界”)传来的火器和制度颠覆了原有的军事体系后，装备日益轻便的鼠族士兵也开始在她们的软帽和制服上携带花朵，这样的花朵不仅让她们显得更加精神，也让枯燥的军旅生活有了些许慰藉。后续可以就士兵戴花这件事写个事件:出身优越的士兵通常为自己佩戴更加色彩绚丽的花朵，而出身较低的可能很少甚至没有花。领主们为了提高士兵的精气神和团结意识，可以统一安排花卉的品种和数目，统一分配，兵种之间可以做区别。领主有对花朵的位置和大小和气味(也就是振奋的作用大小)的规范，毕竟士兵的花可能导致在战场上过于显眼(鼠族本来是近视，但是鼠族是可以戴眼镜的，这点还是要注意)，因此需要佩戴的地方变成帽子后边或者侧面，花朵可能得夹在口袋或者裹在外套里(可以要求鼠族培育出耐挤压的花)，花朵的飘香范围可能要小一些不然可能在战场上被敌人察觉而无法隐蔽(培育花飘香的范围小但是振奋精神一样不低的花朵)在平时，军人就可以放心地将这些花袒露出来了，也成为阅兵、或者日常执勤时，她们军队区别于其他任何部队的鲜明特征。在鼠族的栽培下，花朵可以朝着更香更耐存更鲜艳(或者更像叶子颜色以隐蔽)的方向发展，因此军队采用是可能的，而且鼠族从来没有经历过太长久的正面战争，因此，花大部分时候也只用藏数天即可(而不是凡尔登战役连续数月)。遭遇长期战争是未来的事情，那恰恰是要等到之后玩家们去“回答”了。“领主不是贪婪的吗，怎么还费心思给军队配花？”“军队是领主维持秩序的统治工具，在某种程度上是自己的私人物品(毕竟这些军队只效忠于领主)，因此犒劳这些人只会加强自己的统治，并让自己能够以此攫取更多利益，统治更安定”

  #鼠族戴花是非洲自身花种繁多、鼠族嗅觉灵敏、鼠族农业发达共同推动的，且也可以和领主贪婪接上（修建各种花园花圃去存花展现实力）萌螈写字是非洲植物繁多，各种染料都容易找到和获取、五种灵脉，不同宗派记载的需要、地理上是封闭的，文字是比较固定的，容易约定俗成、用人的脑电波推导萌螈螈气的波动，说不定可以检测螈气波动

  #鼠族位于热带，农作收成大，但不耐保存，因此，她们在漫长的历史进程里逐渐发展了酿酒、制作加工品、种花等大量消耗农产品的办法，这并不是她们铺张浪费，而是当下存下的粮食，可能不出一两周便会发霉生虫，不如大量消耗，变成她们喜欢的酒精、爱闻的花朵，来满足她们的精神生活。当然，这也造成了她们在面对大灾害时，不太具备较强的抗风险能力。

  #鼠族招摇的大耳朵意味着往往一场战争，便会导致许多鼠族耳朵伤残（这是她们最重要的部位之一），这就会导致一些人基本上就算是社会功能废了（鼠族的大耳朵是她们最大的身份标识，能够求偶和亚种识别，同时，大耳朵是她们散热的一大途径，失去大耳朵容易在劳作中中暑）。因此，鼠族的战争一般都是小规模的袭扰或者冲突，很少演变成骇人的战争，这成为了鼠族分裂的一大诱因。鼠族极其适应环境，但是，这在另一方面导致她们通常演化出许许多多的亚种而产生外观差异，亚种的习俗、外观差异在一定程度上增加了双方的偏见和距离，进一步加剧鼠族分裂。鼠族领主通常没有办法积蓄足够的力量压倒性地盖过其他领主，因此，她们的统治决心基本就是：让家族永续，让领地屹立不倒。因此，在外交上，领主们默契地共同反对那些可能过于强大的或是不安分的领主，并用尽全力去削弱那些极有可能威胁到自身安全的势力，从而进一步加固了鼠族碎裂的政治格局。

  #鼠族老农民世世代代生活在一块领地上，那城堡里的领主是她们能够见到的最德高望重的领袖，也是和她们血缘最为亲近的宗族长老，领主们的脱产让她们掌握了节日、秩序和习俗的知识，并在领地里为农民们主持节日和指导习俗，因此，在一定程度上来讲，鼠族领主即是农民的压迫者，也是一个巨大宗族的长老，给农民们过好节日，执行好习俗，维持好秩序。

  #报纸名字：
  #《猫腻说法》猫腻有蹊跷、让人想探究的意思。
  #《专鼠新闻》专鼠则是有声明面向鼠族为服务对象之意，也有领主们专制的思想映射其中。
  #《道明螈来》道明螈来，萌螈在格物致知上有自己的理解，也有一种自信，因此高傲地说出螈来，也谐音了道明原来(事情的来龙去脉)。
  #《故事启龙》故事启龙，很多时候，龙娘们只能听懂故事，便以为写在纸上都是故事，有谐音启蒙之意。

  #万事都有原因，从因推导到果
  #让国家变得生动、有趣而且真实，它应该是真的可以实现的，是另一个世界里，许多人真实经历的“永不落幕的黄金时代”

  #怎么社会风气感觉好像还挺好的样子？这不会闹很多矛盾吗。一、1936恰好是1914之后的二十二年，这个时候，中非从旧日德国沉重的剥削当中恢复了，原本的统治秩序被代表幻想乡的魅魔给取代了，因此，各地的部族的生存压力降低了。二、幻想乡和德国在客观上促进了一个在中非的巨大市场循环（因为它们相比历史上被统合成了一个巨大的殖民地），因此，能够赚钱和发展的机会更加多了。三、在殖民地总督魅魔的统治下，各个部族的统治阶级比较谨慎，对于用兵动武的事情比较谨慎。四、幻想乡的统治输入了更多宗主国的先进生产技术和思想，提高了当地的生产力，使得人们的生活虽然不是很富裕，但是相比旧日是好了很多。五、各个部族发现，她们当下的发展环境还不至于到勾心斗角的地步（社会发展不好的时候，盗窃抢劫的事情才会泛滥成灾）。社会矛盾被暂时压住了。社会风气的变化不至于很同步（如同西藏地区的藏族同胞越往西越淳朴，地域性、差异性、地区人口组成等等都导致了不同地方的民风不同）

  #COG的大体线路是以‘一个绮罗官员为主视角的引导国家剧烈改变的走向’‘一个以萌螈道士为主视角的见证国家剧烈改变的走向’‘一个以鼠族探险家为主视角的展现部族关系的走向’‘龙娘的学习和了解这片大地的视角’，之后是比较特殊的‘幻想乡派了一个同样不负责的专员——神绮，来监督魅魔，实则变成了两人在中非大闹一番的局面’‘幻想乡派了一个靠谱的专员，可能能把中非引导向印度的模式’

  #魅魔和神绮的线路会和早先那四条线强强关联(虽然那四条线按理来讲，幻想乡是不派官员才有的)，我朋友说:“魅魔发现老熟人——神绮到来了，便热情招待神绮，带她一起进入了梦幻般的荧光森林去欣赏景色。之后，魅魔又带着神绮去见各地的部族，去领略各地风情，在鼠族城镇里，神绮会因为觉得鼠鼠顶着对大耳朵而夸赞可爱，并表示可以在魔界也搓几个‘小老鼠’出来。到达闲置区时，魅魔会问既然神绮来到这里，不如给自己建设一个乐园在这个闲置区，神绮起先很兴奋，但是考虑到闲置区早已很多人住在那里‘赶走那些小家伙什么的，太麻烦啦，我还是呆在你的幻梦殿吧！’魅魔便不再提及闲置区的事情了”
  
  #魅魔和神绮“已经走到这里了吗？呐，神绮，这块地之前我是想建设点什么的，比如一个宏大的建筑展示我的威望，一个巨大的魔法森林来提供一个放松的场景，不过嘛……这种麻烦活可真是挫人，我干脆就放弃了，如果你想搞点什么建设的话，这片土地是再合适不过了”“是这样吗？嘿嘿，我心里有千万种在这里建设的方案！不过呢，把这些人一个个赶走着实令人烦恼呢，我懒了”“那，我们去下一个地方参观吧(笑)”

  #萌螈道士和僵尸到时候是萌螈地区又一个新的背景和机制“僵尸的形成多与怨气与秽气集聚而成，当萌螈生前因为含冤、被害而死，心中升起对某个事物的执念时，虽然大脑已经死亡，但是大脑临终前对某一件事情的执着，错误地引发了相关螈气涵养的酶的活跃，让死去的萌螈呈现‘手脚异常冰凉(其实是螈气温差积累的机制在运转)，体内逐渐累积起飘忽不定且十分令人不安的阴气(其实就是近乎失控的螈气)，当螈气积累到一定程度，螈气就接管了原有的大脑，里面部分储存的记忆会接回来(当看到仇人时，记忆波动产生的刺激更强，所以会优先对仇人有反应)，让僵尸以一种奇特的方式生存下来(天亮时气温升高，静静在一些地方积累阴气，天暗时，效率不高了，开始漫无目的地游走)’”

  #长久以来，僵尸的出现一些是高层修士，以及一些奴隶，平民阶层会少上很多，道士们也不太懂为什么，早期通过了一些数据统计，也不清楚僵尸形成的原因，早期对僵尸的记载便是:“夜半时分，戍卒彩云见一冢自内碎裂，遂有一尸坐起，其目瞑铮铮，彩云吓而走之。次日，众人复查乱冢，只见一冢已空而不知尸何去向。”“……见一尸，流矢攻之，数回其气尽也，修士蝶恋曰:‘吾触其肤，如雪山厚雪之感，吾视其貌，仍鲜活如生(萌螈的自愈能力保持了肌肤不腐败)，吾查其气，飘忽不定，令人坐立难安，然不知何故而成此也’”“……多见于奴婢乱冢，修士之墓地也时常有之，不解其故……”

  #萌螈道士满庭霜会是我们萌螈线的主角，肩负着修士的身份天然就自带压迫的意味(运气丹的炼制需要奴隶，即使满庭霜的运气丹不是自己炼制的，她的修炼间接导致了那些悲剧，因此也是要对死者负责的，在现在的逻辑看来)，直来直去的性格会迫使其在见识增长后，动摇自己对这个修士身份的认同，并致力于为不平和悲惨打抱不平，她收入微薄，做着最危险也是最遭人厌恶的镇邪工作，不仅要和危险和死亡打交道，还要被人数落她们的出现意味着不详。就这样，满庭霜和她的徒弟，为我们展现萌螈地区那些奇幻的故事、各种勾心斗角以及满庭霜自己的倔强。

  #《魔界溪谷七日游》（写于中非地区独立之后）

  #启程前
  #好吧，说句实话，我从很久以前就一直在好奇，那个在全球浩劫之后(指代第二次伟大战争，可以简单理解为二战)从幻想乡统治下独立的、又被各种兽族人统治的国家究竟是什么样的，她们在非洲能建立什么？她们和我们有什么不同？她们内部的建设情况是什么样的？兽族人之间关系究竟是怎么样的，她们对于过往的历史究竟是什么态度？这些，都会在我的轮船停靠在那个叫“万帆港”的地方后得到一一解答。哦，也对，顺带一提，中非旅游局提供的这些插图和介绍里，她们把自己的地名全部按照我们国家的语言去翻译了，而不是“艾恩拉特金阿瑞拉”(iron ratkin area)，据说这些是以前殖民时期遗留的名字，这些兽族人选择了保留这些名字，明明一些独立国家会很干脆把这些象征殖民过往的东西剔除掉的。还有一点，去这个地方之前，这些宣传海报还有旅游的负责人总是和我们一再强调身高的问题，说那边人是偏矮小的，过去可能会一点不适应，说实话，我还挺好奇那边的人小成什么样。对了，出发之前，那个旅游负责人一再要求我们去指定的合作医院去把列表上所有的疫苗打过一遍，天啊，感觉我被扎了十几针。好吧，我今天就写那么多吧。

  #第一天
  #当我们的轮船靠岸时，明明做好准备的心还是被震撼了一下:我们看到，那些码头上、机器里、汽车里的那些人真的就是长着一双大大的耳朵，就真是鼠耳朵，第一次下到地面时，最直观的感受就是好像所有的东西都变小了一些，那些当地兽族人看我们必须得高高仰着她们的头，有点好笑，这些本地人总是聚在一起，很多很多，然后一起走动，像波涛一般起起伏伏的。为了照顾各种人的身高差带来的问题，很多地方都是斜坡式的结构帮助人上下而不是楼梯，这样谁都能走，不过，我觉得不是很适应，因为少了那种一踏一个台阶的感觉。在搭乘汽车去专门为我们这些外地人开办的宾馆时，我感觉我像是中了幻觉:像车模型一样大小的车子、儿童版的自行车开满在了路上，我总感觉如果我不稍微弯点腰，进车里绝对会碰头，还有那些自行车，我感觉真的会合适我女儿来骑。难怪在旅游海报上，她们劝导游客“千万不要长得太高，要矮点才能来这里”。到了宾馆，相比其他建筑，这个宾馆真的大得突兀，毕竟是为了照顾外地人的，然而进去之后，接待我们的还是那些小小的鼠族，还是坐在一个小小的柜台前，然后在我们面前跑着小步领我们去对应的房间，我偶然瞄到了一些清洁人员整理房间的画面:两人共同协力去把那些被子、枕头、毛巾扛过来，然后一起推着这个小推车前进。进了房间之后，一切似乎又变成了老家那样，熟悉的大小，熟悉的感觉，应该是按照我们那里的标准建设的，就是不知道这些小老鼠究竟怎么看待自己每天在那么大的房间里，自己略显渺小是什么感觉。不过，这些房间也有她们自己的一番风味:床头柜上摆上了装着几朵花卉的花瓶，是真的，还挺新鲜的，闻起来有点淡淡的香味。因为我是下午到达的缘故，正好赶上了吃晚饭的时间，于是我决定去尝试一下当地的晚饭，是一杯用花和粮食酿制成的酒，听说酿了两年左右，喝起来酒香和花的甜香搭配得很好，还有叶花糕，吃起来清脆可口的，还有涂抹了当地特制酱料的薄饼夹肉，肉是没吃过的，不知道是什么牲畜。行吧，今天就这样了，早点睡了。

  #第二天
  #醒来后又吃了当地的早餐，早餐居然还是花酒，不过换了一些其他的花调制，然后其他的内容有方糖、巧克力还有薄饼，早上薄饼不夹肉，只夹了一些蔬菜和蘑菇。吃过之后，我就体验了一些项目:比如，像以前的旅商一样走商路，然后她们拉出来了一只巨大的仓鼠，说它叫仓鼠大王，这仓鼠的毛很柔顺很厚重，奇怪的是，它似乎不感觉热，并且也很温顺，我跨坐上去后，那些旅商就牵着仓鼠大王，沿着一条路走进了鼠族城镇。在路上，我看到了好些农田，上面似乎种满了水稻、小麦、甘蔗、油棕、可可、橡胶树等等，还有许许多多的花田铺开在地面上，走了许久，商路拐向了河边，汹涌的魔界河展现在我们眼前，下面就是吓人的河谷，感觉摔下去就是粉身碎骨。行进了差不多一两个钟头。终于从港口走到了一个真正的当地人聚落，远远看去，那些房子就像小孩子搭建的城市一样，小小的，那里也有集市、商店、杂货店、药店还有学校之类的建筑，不过，那些城镇中间是有一些高高的围墙的，走进一看就发现那些围墙大多都倒塌了，旅鼠说自从领主们完蛋了之后，城镇就往外大了那么几圈，把这些旧事物裹在里面了，然后除了基本的维护，它们就只能破破地立在这，就这样了。在进入城镇之前，已经有好些鼠族在对我评头论足了(我觉得)，可能因为我比她们高出一个头多一些的缘故吧。在这些城镇里，最鲜明的特色就是无处不在的花卉栽培，马路上的两旁必须种点，窗上必须挂点，当地人说这些味道特别浓郁、令人兴奋，但是我几乎凑近才能闻到，也许她们真的对味道很敏感。（未完待续……）

  #现实中，非洲似乎只与苦难、被动、过去相随，从来没有自信、自救、未来可言。如果非洲没有被殖民者彻底打碎，如果非洲的原住民有机会自己决定自己的未来，她们会怎么走？