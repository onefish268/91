  COG_ask_MoeLotl_for_help: "向萌螈修士们寻求帮助"
  COG_ask_MoeLotl_for_help_desc: "我们会向萌螈修士们寻求帮助，至于帮助的内容是什么，则取决于我们和她们之间的关系、她们的影响力、以及她们地区开发程度的高低来共同决定的。"
  COG_promise_to_MoeLotl: "向萌螈修士们许诺"
  COG_promise_to_MoeLotl_desc: "我们会向萌螈修士们许诺好处，然后她们会尝试支持我们的政策。在这之后，她们会要求我们给予她们一定的“回报”，也许是工厂的建设、也许是法令的修改……"
  COG_against_MoeLotl: "抨击萌螈修士们"
  COG_against_MoeLotl_desc: "我们会抨击萌螈修士们，让她们的影响力和实力遭到一定的打击，当然，我们的打击必须有据可依，我们需要从她们的政治、经济、文化等各种建设方面找到一个被大伙认可的错误，然后指责她们。当然，我们不能把人家逼得太急了……"

  COG_ask_Ratkin_for_help: "向鼠族领主们寻求帮助"
  COG_ask_Ratkin_for_help_desc: "我们会向鼠族领主们寻求帮助，至于帮助的内容是什么，则取决于我们和她们之间的关系、她们的影响力、以及她们地区开发程度的高低来共同决定的。"
  COG_promise_to_Ratkin: "向鼠族领主们许诺"
  COG_promise_to_Ratkin_desc: "我们会向鼠族领主们许诺好处，然后她们会尝试支持我们的政策。在这之后，她们会要求我们给予她们一定的“回报”，也许是工厂的建设、也许是法令的修改……"
  COG_against_Ratkin: "抨击鼠族领主们"
  COG_against_Ratkin_desc: "我们会抨击鼠族领主们，让她们的影响力和实力遭到一定的打击，当然，我们的打击必须有据可依，我们需要从她们的政治、经济、文化等各种建设方面找到一个被大伙认可的错误，然后指责她们。当然，我们不能把人家逼得太急了……"

  COG_ask_Businessman_for_help: "向旅鼠商人们寻求帮助"
  COG_ask_Businessman_for_help_desc: "我们会向旅鼠商人们寻求帮助，至于帮助的内容是什么，则取决于我们和她们之间的关系、她们的影响力、以及她们地区开发程度的高低来共同决定的。"
  COG_promise_to_Businessman: "向旅鼠商人们许诺"
  COG_promise_to_Businessman_desc: "我们会向旅鼠商人们许诺好处，然后她们会尝试支持我们的政策。在这之后，她们会要求我们给予她们一定的“回报”，也许是工厂的建设、也许是法令的修改……"
  COG_against_Businessman: "抨击旅鼠商人们"
  COG_against_Businessman_desc: "我们会抨击旅鼠商人们，让她们的影响力和实力遭到一定的打击，当然，我们的打击必须有据可依，我们需要从她们的政治、经济、文化等各种建设方面找到一个被大伙认可的错误，然后指责她们。当然，我们不能把人家逼得太急了……"

  COG_ask_Dragonian_for_help: "向龙娘们寻求帮助…？"
  COG_ask_Dragonian_for_help_desc: "我们会向龙娘们寻求帮助，至于帮助的内容是什么，则取决于我们和她们之间的关系、她们的影响力、以及她们地区开发程度的高低来共同决定的。不过，这些家伙真的能帮上什么手吗…"
  COG_promise_to_Dragonian: "向龙娘们许诺"
  COG_promise_to_Dragonian_desc: "我们会向旅鼠商人们许诺好处，比如吃的、用的、住的、玩的，很好满足，然后她们会尝试支持我们的政策。虽然不太清楚能够帮多少就是了…"
  COG_against_Dragonian: "抨击龙娘们"
  COG_against_Dragonian_desc: "我们会抨击这些吃白饭的龙娘们，她们霸占着一块这么大的地盘，却只是在里面过着采摘狩猎的简单日子，也许，我们应该让她们认识到，她们浪费了这么好的资源。"

