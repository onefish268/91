l_simp_chinese:
 5_focus_1: "打倒大亨"
 5_focus_1_desc: "那个自喻为拯救者的奴隶主，对人民而言百害而无一利，她是我们必须打倒的敌人。"
 5_focus_2: "兼并杜马"
 5_focus_2_desc: "西边的杜马们和我们的诉求高度一致，或许可以和平解决问题。"
 5_focus_3: "南非黑市"
 5_focus_3_desc: "南非政府我们指望不上，但南非的黑市她们却管不着，我们可以从那里获取武器和资源。"
 5_focus_4: "加速建设"
 5_focus_4_desc: "我们需要加速建设，才能在这场战争中占据优势。"
 5_focus_5: "渗透"
 5_focus_5_desc: "渗透敌人的内部，获取情报和资源，是我们取胜的关键。"
 5_focus_6: "直接打"
 5_focus_6_desc: "凭我们自己的力量就能让她跪下唱征服。"
 5_focus_7: "深入矿坑"
 5_focus_7_desc: "僵尸也有思想。秘密打入矿坑深处，我们会得到她们的支持。"
 5_focus_8: "获取情报"
 5_focus_8_desc: "获取情报是战争的关键，我们必须了解敌人的动向。"
 5_focus_9: "收买手下"
 5_focus_9_desc: "爵士的手下绝非铁板一块，收买他们，让他们为我们效力。"
 5_focus_10: "突袭"
 5_focus_10_desc: "突袭敌人的据点，打乱她们的计划，让她们措手不及。"
 5_focus_11: "拿下僵尸"
 5_focus_11_desc: "是时候行动了。"
 5_focus_12: "写一封信"
 5_focus_12_desc: "写一封信给她们，告诉她们我们不想打仗，我们只想要和平。"
 5_focus_13: "广播宣传"
 5_focus_13_desc: "广播宣传是我们争取民心的重要手段，让更多的人了解我们的诉求。"
 5_focus_14: "收买议员"
 5_focus_14_desc: "有些人的心是可以被收买的，让她们成为我们的传声筒。"
 5_focus_15: "友善交流"
 5_focus_15_desc: "所以，我们为什么不能坐下来好好谈谈呢？"
 5_focus_16: "传单攻势"
 5_focus_16_desc: "发传单是最简单的宣传方式，只需要花一些钱，就能改变舆论走向。"
 5_focus_17: "和平演变"
 5_focus_17_desc: "以和平解决西部争端无疑是最好的选择。"
 5_focus_18: "购买武器"
 5_focus_18_desc: "购买武器是我们必须要做的事情，只有拥有足够的武器，我们才能保护自己。"
 5_focus_19: "打通贸易网络"
 5_focus_19_desc: "本地黑帮真是太不讲理了，我们必须要有自己的交易渠道。"
 5_focus_20: "一家独大"
 5_focus_20_desc: "没有中间商赚差价！"
 5_focus_21: "全权代表"
 5_focus_21_desc: "我们需要一个全权代表，来处理所有的军工生产事务。"
 5_focus_22: "保障基本需求"
 5_focus_22_desc: "保障基本需求是我们必须做到的。"
 5_focus_23: "内维尔兵工厂"
 5_focus_23_desc: "内维尔女士提出了一个新的统合计划，旨在提高我们的军工生产。"
 5_focus_24: "招募人才"
 5_focus_24_desc: "吸纳更多的有能之人进入我们的政府，这会显著提升我们的国家能力。"
 5_focus_25: "扩大工地"
 5_focus_25_desc: "现有的军工生产基地已经无法满足我们的需求了，我们必须扩大兵工厂基地。"
 5_focus_26: "国家公司"
 5_focus_26_desc: "建立一个国有企业来掌控那些关键的战略物资，以确保我们在战争中不会被自己人卡脖子。"
 5_focus_27: "更进一步"
 5_focus_27_desc: "我们已经取得了很大的进展，但我们不能停下脚步，我们必须继续前进。"
 5_focus_28: "强硬手段"
 5_focus_28_desc: "索尔兹伯里的局势已经到了非采取强硬手段不可的地步，我们必须采取果断的行动。"
 5_focus_29: "赤匪"
 5_focus_29_desc: "共产党是我们最大的敌人，我们必须采取一切手段来打击他们。"
 5_focus_30: "民族主义者"
 5_focus_30_desc: "我们允许民族主义的存在，但我们不允许她们分裂我们的国家。"
 5_focus_31: "流浪儿"
 5_focus_31_desc: "有些地方政权只是为了自保才在内战中宣布独立，我们必须要让他们明白，独立不是解决问题的办法。"
 5_focus_32: "赶走盗匪"
 5_focus_32_desc: "失去了政府的管制，盗匪横行，我们必须采取行动，恢复秩序。"
 5_focus_33: "枪毙兵痞"
 5_focus_33_desc: "造成索尔兹伯里治安混乱的不止是盗匪，还有一些失去管制的士兵，我们必须严惩他们。"
 5_focus_34: "消灭投机者"
 5_focus_34_desc: "投机者是我们国家的毒瘤，他们只会在危机中牟取暴利，我们必须消灭他们。"
 5_focus_35: "肃反"
 5_focus_35_desc: "在接手旧政府军队前，我们要果断采取措施，处理掉那些与土匪无异的人，她们是人民的公敌。"
 5_focus_36: "最后通牒"
 5_focus_36_desc: "我们已经给了她们足够的时间和机会，但她们仍然拒绝我们的要求。现在，我们必须采取最后的手段，给她们一个最后通牒。"
 5_focus_37: "最后通牒"
 5_focus_37_desc: "我们已经给了她们足够的时间和机会，但她们仍然拒绝我们的要求。现在，我们必须采取最后的手段，给她们一个最后通牒。"
 5_focus_38: "谈判"
 5_focus_38_desc: "为了和平统一，我们可以尝试与她们进行谈判，寻求一个双方都能接受的解决方案。"
 5_focus_39: "继承人"
 5_focus_39_desc: "联邦政府毫无疑问是我们国家的合法继承人，继承前政府的权力和责任是我们义不容辞的。"
 5_focus_40: "收复"
 5_focus_40_desc: "我们成功夺回了失去的领土，这标志着我们东部的复兴。"
 5_focus_41: "镇压"
 5_focus_41_desc: "我们和极端民族主义者的斗争还没有结束，我们必须继续镇压他们，确保国家的稳定。"
 5_focus_42: "解放"
 5_focus_42_desc: "我们正在前进！"
 5_focus_43: "光复"
 5_focus_43_desc: "胜利属于我们！"
 5_focus_44: "只是调味汁"
 5_focus_44_desc: "5_focus_44_desc"
