l_simp_chinese:
 1_focus_1: "枪击"
 1_focus_1_desc: "我们可怜的总督，她的心脏让野蛮人给穿了个洞。"
 1_focus_2: "弥留时刻"
 1_focus_2_desc: "幸运的是，皇家医院的医生们成功用魔法吊住了总督的性命。在最后的最后，伊菲尔激起了最后一股力量......"
 1_focus_3: "整顿"
 1_focus_3_desc: "这次刺杀警醒了总督府的所有人：罗德西亚并不稳定。"
 1_focus_three_desc: "这次刺杀警醒了总督府的所有人：罗德西亚并不稳定。"
 1_focus_4: "调查枪击案"
 1_focus_4_desc: "这显然不是一个人的阴谋，我们要调查这一切。"
 1_focus_5: "镇压地方"
 1_focus_5_desc: "地方势力又有了抬头的迹象，镇压她们。"
 1_focus_6: "清洗内阁"
 1_focus_6_desc: "这么大的事故，内阁难辞其咎。把非“上等人”的官员清洗掉。"
 1_focus_7: "派出军官"
 1_focus_7_desc: "我们无法保证的地方治安团忠诚，中央将派出军官接管这些部队。"
 1_focus_8: "弹压各党派"
 1_focus_8_desc: "过去的政策给了各个党派“肆无忌惮”的机会搞小动作，抓捕她们的领袖。"
 1_focus_9: "联系伦敦"
 1_focus_9_desc: "我们和伦敦闹了场不愉快，但这非常时刻我们需要她们。"
 1_focus_10: "宣布紧急状态"
 1_focus_10_desc: "犯人仍然在逃，总督府将紧急签署法令，将整个自治领翻个底朝天也要找到他。"
 1_focus_11: "掷出诱饵"
 1_focus_11_desc: "通过传播假消息，我们将确认哪些部落“不在可靠”。"
 1_focus_12: "继承人"
 1_focus_12_desc: "为了罗德西亚的未来，总督将指定一名继承人......"
 1_focus_13: "三不政策"
 1_focus_13_desc: "“不能有下等人”\n“不能有枪支”\n“不能有意识形态”"
 1_focus_1three_desc: "“不能有下等人”\n“不能有枪支”\n“不能有意识形态”"
 1_focus_14: "查禁"
 1_focus_14_desc: "党派本就不应该存在，人民只需要总督府发出的声音。"
 1_focus_15: "交谈"
 1_focus_15_desc: "经济专员还没有离开罗德西亚，拦住她。"
 1_focus_16: "时日无多......."
 1_focus_16_desc: "§Y总督的生命进入倒计时§！"
