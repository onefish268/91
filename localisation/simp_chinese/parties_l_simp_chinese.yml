  POLITICS_NOELECTIONS: "无选举或事件选举"

#红
  communism: "社会主义"
  communism_noun: "社会主义"
  communism_desc: "集体主义政体"

  Madokaism: "圆环之理"
  Madokaism_desc: "§R圆环之理§!\n\n\n\n\n£GFX_Madokaism_bg\n\n\n\n\n在这个的世界中，圆神会在魔法少女们的灵魂宝石遭到污染而即将变成魔女前将她们接走，这种魔法少女最终必定会凭空消失的「法则」被魔法少女们称为「圆环之理」。"
  marxism: "马克思主义"
  marxism_desc: "§R马克思主义§!\n\n\n\n\n£GFX_marxism_bg\n\n\n\n\n马克思主义是一种以历史唯物主义、辩证法和对资本主义的批判所发展而出的经济、政治和社会世界观。\n\n在19世纪中后期，卡尔·马克思和弗里德里希·恩格斯建构出了马克思主义的理论架构。以马克思主义作为根基或方法论的写作对现代的政治哲学和社会运动产生重大而广泛的影响，包含了其独特的哲学、社会学、政治经济学以及革命意识形态。\n\n对于马克思主义的理论并没有一套统一的定义，也因此它在众多的领域和题材上出现多元的发展，导致其门下包含众多明显对立甚至互相冲突的理论。"
  leninism: "列宁主义" 
  leninism_desc: "§R列宁主义§!\n\n\n\n\n£GFX_leninism_bg\n\n\n\n\n列宁主义被称为“帝国主义和无产阶级革命时代的马克思主义”。\n\n列宁力图通过先锋党领导的对资本主义社会的革命建立一个社会主义国家。一旦取得政权，该党通过内部讨论决策的方式执政。极力推崇通过暴力革命的方式获得政权并通过强硬的集体化政策实现向社会主义的过渡。\n\n列宁主义同马克思主义的其它流派相比，最大的差别在于列宁提出了“民主集中制”、“先锋队理论”和帝国主义论。除此之外，列宁认同“暴力革命”和“无产阶级专政”是实现社会主义的唯一途径。并且认为不发达的资本主义社会里，无产阶级可以率先夺取政权，建立社会主义国家。"
  stalinism: "索尼娅主义" 
  stalinism_desc: "§R索尼娅主义§!\n\n\n\n\n£GFX_stalinism_bg\n\n\n\n\n作为一种应用和发展马克思列宁主义政治的政府形态，索尼娅主义强调迅速工业化，集体主义以及一个强大有力的社会主义国家对反革命元素清洗的必要性。\n\n其主张主要包括了社会主义国家通过广泛的政治宣传手段，建立起崇拜工人阶级的政治氛围，并以此来保持政府对全国人民的政治引导。\n\n但在事实上，索尼娅自己并不承认自己创立了什么主义同马克思列宁主义并列，一直以来索尼娅都认为自己是弗拉基米尔·伊里奇·列宁的学生。"
  anti_revisionism: "反修正主义"
  anti_revisionism_desc: "§R反修正主义§!\n\n\n\n\n£GFX_anti_revisionism_bg\n\n\n\n\n一种对许多自称马克思主义继承者的意识形态的反应。反修正主义提倡保持原始革命理论的核心要素。主要反对将资本主义经济元素引入社会主义国家，这种意识形态很大程度上通过不是什么而不是是什么来定义。"
  anarchist_communism: "无政府共产主义"
  anarchist_communism_desc: "§R无政府共产主义§!\n\n\n\n\n£GFX_anarchist_communism_bg\n\n\n\n\n无政府共产主义是一种支持废除国家、资本主义、雇佣劳动、等级制度及生产资料私有制（但无政府共产主义尊重在集体所有制下的个人财产），同时拥护生产资料公有制及由工人委员会所构成的横向网络所统领下依照各尽所能、各取所需进行直接民主制的政治哲学及思想流派。\n\n大多数无政府共产主义者视无政府共产主义为一种调和个人与社会之间矛盾的方式。"
  Spartacus: "革命民主主义"
  Spartacus_desc: "§R革命民主主义§!\n\n\n\n\n£GFX_Spartacus_bg\n\n\n\n\n革命民主主义是一种诞生于德国的左翼流派，罗莎·卢森堡在1918年的文章中《论俄国革命》中强烈批判布尔什维克党对政治自由的限制，预见性地警告她们的军事共产主义政策将会走向独裁。卢森堡主张无产阶级专政，但反对一党专政。在此方面，她撰写了文章《自由的定论》。因此，“革命民主主义”也被称为“卢森堡主义”。\n\n革命民主主义者主张建立一个由左翼政党组成的国家议会，由民主程序决定国家决策，并举行定期选举。革命民主主义者既认同俄国革命的意义，也出自于对集权主义的批判而对苏联模式提出质疑。"
  syndicalism: "工团主义"
  syndicalism_desc: "§R工团主义§!\n\n\n\n\n£GFX_syndicalism_bg\n\n\n\n\n工团主义是一种以劳工运动为主导的社会主义，旨在工人阶级团结起来组织工会，通过纯粹的工人组织以及罢工来推翻资本主义和国家，以使企业由资本家主导变成由工人主导。\n\n工团主义的基本原则是工人团结、直接行动和工人自治。工人团结意指工团主义认为所有工人，无论性别或族群，对于上司、老板是站在相似的立场（阶级意识）。此外，这表示在资本主义制度中，工人为老板所造成的任何利润或损失最终将会影响到所有员工。因此，为了解放自己，所有工人在阶级冲突中必须相互支持,认为只有直接行动能让工人解放自己。而且，工团主义者认为工人组织必须自我管理。工人不应有老板的存在，所有会影响到她们的决策应由她们自己制定。"
  Farsighted_socialism: "远视社会主义"
  Farsighted_socialism_desc: "§R远视社会主义§!\n\n\n\n\n£GFX_Farsighted_socialism_bg\n\n\n\n\n远视社会主义是一种新兴的特殊左翼意识形态，除了传统的计划经济与集中化之外，远视主义者极度强调科学技术对社会发展的作用，这里的科学技术并非只有自然科学，同时包含了社会科学。\n\n远视主义者通过一切看似（实际上也确实）超前的理论，对技术、社会进行大胆的尝试（往往伴随着庞大的投资），远视主义者相信它们并非遥远的未来而即将成为眼前的现实，进而提高整个社会的生产力，向着共产主义迈进，向宇宙深空迈进。"
  quantum_Farsighted_socialism: "远视社会主义"
  quantum_Farsighted_socialism_desc: "§R远视社会主义§!\n\n\n\n\n£GFX_quantum_Farsighted_socialism_bg\n\n\n\n\n远视社会主义是一种新兴的特殊左翼意识形态，除了传统的计划经济与集中化之外，远视主义者极度强调科学技术对社会发展的作用，这里的科学技术并非只有自然科学，同时包含了社会科学。\n\n远视主义者通过一切看似（实际上也确实）超前的理论，对技术、社会进行大胆的尝试（往往伴随着庞大的投资），远视主义者相信它们并非遥远的未来而即将成为眼前的现实，进而提高整个社会的生产力，向着共产主义迈进，向量子之谜迈进，向大一统理论迈进。"
  Left_wing_nationalism: "左翼民族主义"
  Left_wing_nationalism_desc: "§R左翼民族主义§!\n\n\n\n\n£GFX_Left_wing_nationalism_bg\n\n\n\n\n§R左翼民族主义§!是一个经济左翼，文化可变（但通常偏左翼），民族主义的意识形态，倡导生产资料的集体所有，结合了反帝国主义、平等主义、国际团结、国家主权。"
  warm_syndicalism_group: "温和社会主义"
  warm_syndicalism_group_desc: "§R温和社会主义§!\n\n\n\n\n£GFX_socialism_bg\n\n\n\n\n温和社会主义是马克思主义中一个相当妥协和温和的派别，温和社会主义者们通常对过于激进的社会改革和改变表示不信任和反对。虽然她们通常同样认可马克思主义中的革命政策，但对于革命，她们通常更愿意通过选举获得政权。\n\n“温社”思想的核心是理想主义和集体主义。既强调群体利益、群体实现，又保持对人性和个性的尊重，并且反对专制。“温社”提倡、宣传美好的社会理想，比如，人人平等、共同富裕、互相友爱，而不是自私自利、自我膨胀、互相倾轧。这样能给人以目标感，给人以充实感，给人以希望。“温社”还提倡颂扬社会光明的一面，这样能使人乐观，使人感到温暖和幸福。同时“温社”也会毫不留情地揭露和批评社会的阴暗面。"
  Radical_socialism: "激进社会主义"
  Radical_socialism_desc: "§R激进社会主义§!\n\n\n\n\n£GFX_marxism_bg\n\n\n\n\n激进社会主义是社会主义内部的一种政治哲学、学说和传统，强调社会革命是实现从资本主义生产方式向社会主义生产方式转变的必要前提。\n\n激进社会主义与改良派社会主义对立，特别是社会民主主义的改良主义派别和其他主张和平过度到社会主义的派别。激进社会主义反对寻求通过政治改革逐步改善资本主义经济和社会问题的运动。"
  Jacobins: "雅各宾主义"
  Jacobins_desc: "§R雅各宾主义§!\n\n\n\n\n£GFX_marxism_bg\n\n\n\n\n雅各宾主义起源于幻想乡大革命的雅各宾派，最初雅各宾俱乐部的章程，规定它的宗旨是“促使革命成功”，“让真理之声四处传播”，“让真理之光照亮民众”。规定入会者必须“热爱平等，珍视人权，本能地保护弱者和被压迫者，乐于尊重他人”。\n\n雅各宾派的出现的是进步的，但是其“暴民政治”、“人民极端理想化”、“个人崇拜”、“不极代价输出革命”等观点在如今也饱受质疑。"
  Utopian_Socialism: "乌托邦社会主义"
  Utopian_Socialism_desc: "§R乌托邦社会主义§!\n\n\n\n\n£GFX_marxism_bg\n\n\n\n\n乌托邦社会主义，又称空想社会主义，是现代社会主义思想的来源之一，流行于19世纪初期的西欧。其主张建立一个没有阶级压迫和剥削、没有资本主义弊端的理想社会。\n\n乌托邦社会主义者认为社会主义的理想社会应该建筑在人类的理性和正义的基础上。这种社会至今还未出现，是由于人们不认识和不承认的缘故。他们觉得只要有天才掌握了这种思想，并推广开去，就能实现他们心中的理想社会。"
  Military_socialism: "军事社会主义"
  Military_socialism_desc: "§R军事社会主义§!\n\n\n\n\n£GFX_Military_socialism_bg\n\n\n\n\n军事社会主义并没有确定的模式、制度与方针，通常表现为红色军政府掌权，一般出现于革命或是国家动乱之中，当国家重归稳定，会有继续军政或者建立共和的区别。"
  Maoist_subideology: "毛润芝思想"
  Maoist_subideology_desc: "§R毛润芝思想§!\n\n\n\n\n£GFX_Maoist_subideology_bg\n\n\n\n\n§R毛润芝思想§!，又称“§R毛主义§!”（虽然毛润芝本人极力反对把自己的理论思想体系称为“毛主义”，但“毛主义”一词仍在中国大陆以外的部分地区被广泛使用并被推广）。\n\n毛润芝思想的直接理论来源便是毛润芝本人的各种著作，其中借用了部分农业社会主义的元素，但并不能简单认为是对其的一种小修小补。毛润芝思想呼吁进行革命的土地改革，建立合乎中国国情的新民主主义制度，还主张进行以游击战为主的持久人民战争，并认为这是进行革命斗争的最佳方式。\n\n毛润芝思想仍然以国际主义、反帝主义和反魔法血统论为理论支柱，但与传统布尔什维主义不同的是，在农村占据大部分的国家中，它相比于城市无产阶级更加重视农村群众，在反对资本主义统治的斗争中认为革命斗争的最好形式即以游击战为主的“持久人民战争”。\n\n毛润芝思想被其支持者视为马克思主义的自然延续，也自然被视为布尔什维主义的下一个阶段：随着被压迫的人民开始拿起武器反抗压迫者，全世界人民团结起来反对帝国主义未来可期。"
  Istinaist: "莫罗佐娃主义"
  Istinaist_desc: "§R莫罗佐娃主义§!\n\n\n\n\n£GFX_Istinaist_bg\n\n\n\n\n§R莫罗佐娃主义§!，又称§R真理主义§!，是马克思主义的延续之一，其名称来自安娜·莫罗佐娃（真理）。\n\n真理主张建立列宁式的无产阶级先锋队政党，反对官僚主义，实现真正意义上的民主集中制，拥护无产阶级国际主义和不断革命，和一个基于工人阶级自我解放和工人民主的无产阶级专政。\n根据真理的说法，她的思想可以通过四个关键要素与其他马克思主义流派相区别：\n\n支持不断革命的策略，反对其对手的二阶段理论。\n通过工人阶级的群众行动支持先进资本主义国家的社会革命。\n支持无产阶级国际主义。\n利用过渡要求，帮助群众在日常斗争过程中去找到当前要求与革命的社会主义政纲之间的桥梁。\n\n虽然真理从未称自己为“真理主义者”，而是用“布尔什维克列宁主义”一词来描述他的政治主张。但真理思想的倡导者普遍被称作真理主义者。"
  Monarchical_socialism: "君主社会主义"
  Monarchical_socialism_desc: "§R君主社会主义§!\n\n\n\n\n£GFX_Monarchical_socialism_bg\n\n\n\n\n君主社会主义者试图将社会主义和君主制这两种典型的对立制度融合为一种统一的政府形式。虽然每位君主对社会主义制度的“献身”程度差别很大，从仅仅是“涂上红色”的有名无实的元首到完全献身于社会主义事业的君主各不相同，但都有一个共性，即坚持“高贵”的君主制度。\n\n尽管这位君主通常只是一个更为传统的社会主义政府的门面，但他们的存在是更广泛的君社制度的关键。在这些红色君主制下，通往真正的社会主义旅程将得到指引，尽管彼此间存在着难以置信的差异，但它们通常在社会和社会问题上都持有更为保守或传统的观点。"
  Three_Principles_of_the_People_c: "三民主义"
  Three_Principles_of_the_People_c_desc: "§R三民主义§!\n\n\n\n\n£GFX_Three_Principles_of_the_People_bg\n\n\n\n\n三民主义，即民族主义、民权主义和民生主义，又称“逸仙学说”、“国父思想”、“总理遗教”，是由中华民国国父及中国国民党总理逸仙提出，为国民党的基本党纲。\n\n\n三民主义左派认为，三民主义即“中国版的社会民主主义”，逸仙倡导全民政治、直接民权，其民生主义“既发展经济增加国力，又改善民生，消除社会弊端，缓和阶级矛盾。”\n\n她们三民主义具有社会主义的性质，但是拒绝了社会主义思潮中的真正的空想派的马列主义的一党专政和公有制的危害无穷的思路。可以说，中山主义是一种民主社会主义。\n\n同时主张实行节制资本的既定方针，着力发展中小企业，注意防止贫富悬殊；注意劳动保护和医疗、救济等社会福利事业。”，并提出联俄、联共、扶助农工三大政策。"
  Market_socialism: "市场社会主义"
  Market_socialism_desc: "§R市场社会主义§!\n\n\n\n\n£GFX_Market_socialism_bg\n\n\n\n\n市场社会主义与非市场社会主义的区别在于其市场机制被用于分配资本品的和生产资料。\n\n根据市场社会主义的具体模式，社会所有的企业产生的利润(即没有重新投入到扩大公司净收入或由私人企业主用于个人消费)能够以各种方式直接报酬给雇员，作为公共财政来源或者以社会红利分配给人民。\n\n市场社会主义与混合经济的概念不同，因为与混合经济不同，市场社会主义模式是一种完整并具有自我调节系统的模式。\n\n市场社会主义也与资本主义市场经济体内实施的社会民主政策不同：社会民主主义旨在通过税收、补贴和社会福利计划等政策措施实现更大的经济稳定和平等，而市场社会主义旨在通过改变企业所有权和管理模式实现类似目标。"
  Socialist_Technocracy: "左翼技官主义"
  Socialist_Technocracy_desc: "社会主义技术官僚在认识到权威垄断，学阀，以及资本主义腐化对人类社会进程的威胁后，在治理模式上有着极大的不同。例如，社会主义技术官僚更加注重对普罗大众的科普教育，同时这也是其执政课题的重要考核标准。群众性的政治科学运动将会是社会主义技术官僚的普遍运动形式，在全民教育的背景下，周期性研讨会（Seminar）保证大多数人都能够参与到管理研究当中，而工作报告将会被拿来与分布式数据库中的实际数据进行对比，以确保技术官僚们在周会上提交的报告符合实际。届时，将不会有工人与工程师，教师与理论科学家之分，每个受过合格教育的人，将会把最大化实现人民福祉和做出实际性研究以换取个人回报作为自己的终身目标。"
  Security_socialism: "安保社会主义"
  Security_socialism_desc: "§R安保社会主义§!\n\n\n\n\n£GFX_digital_fascism_bg\n\n\n\n\n安保社会主义认为，革命果实最大的威胁并非来自外部的坦克，而是隐藏在群众内部的动摇者与破坏分子。为了捍卫无产阶级的政权，国家必须进化为一个完美的观察者。\n在这种体制下，‘秘密警察’不再是恐怖的代名词，而是社会秩序的精算师。特工不再是隐藏在阴影中的杀手，而是维持社会机器平稳运行的齿轮。通过无孔不入的监控网络，国家能够消除任何形式的低效与背叛。在这里，忠诚是唯一的通货，而沉默则是对革命最响亮的赞美。"
  Agrarian_socialism: "农业社会主义"
  Agrarian_socialism_desc: "§R农业社会主义§!\n\n\n\n\n£GFX_Agrarian_socialism_bg\n\n\n\n\n农业社会主义主张农业财产的社会公有制而非私有制，具体包括对已集体化的农业用地的平均分配，并且带有去中心化的、无政府主义的、在地化的、重视传统价值的倾向。\n农业社会主义致力于达成农业集体化，而非资本化的农业生产，来回应农民无地可耕和农业人口向都市的大量流动问题。因此，农村社会的生产资料效益的最大化就成了农业社会主义的首要问题，社群、共享和地方公有制也被常常提及。"
  astraea_route_communism_subtype: "阿斯特莱雅路线"
  astraea_route_communism_subtype_desc: "§Y阿斯特莱雅路线§!\n\n\n\n\n£GFX_astraea_route_communism_subtype_bg\n\n\n\n\n作为这片大地上少见的异界群体，来自阿斯特莱雅的少女们对于政治光谱并不怎么上心：对于她们来说，找到回家的路比整天在办公室里吵来吵去重要的多。幸运的是她们有这个能力：阿拉伯人将战功赫赫的她们推举成了英雄和新国家的执政者；但她们也需要努力将这个国度打造成足够在世界上独自立足的强权——无论是为了阿拉伯人的民族意识，还是为了她们自己的回家之路。将整个国家打造成资源吞吐机器与贸易之国将永远是阿斯特莱雅路线的核心，至于这其中的路线之争和最后的是非功过……\n§g还是全交由后人评说吧。§!"
  popular_front_subtype: "人民阵线"
  popular_front_subtype_desc: "§P人民阵线§!\n\n\n\n\n£GFX_popular_front_subtype_bg\n\n\n\n\n没有哪种意识形态比“人民阵线”更能阐明这句话了。人民阵线通常涵盖了极为广泛的左翼意识形态，从强硬激进的革新人士到民主自由主义者无所不包。尽管十分罕见，但在极端情况下，人民阵线还会吸纳保守派。这种临时的合作往往是在现状发生剧变或者出现可能诱发剧变的威胁时形成的，在此条件下，反对派会搁置分歧，通过选举、武装冲突以及其他方式加以抗衡。\n“人民阵线”这一概念的应用同其构成一样宽泛。阵线通常首先要找到一些最起码的理由，一般是各种各样的道德理由，来反对长期存在、或者是新出现的威胁。又或者，存在相同的方针或意识形态将偏向革新主义或自由主义的人民阵线粘合在一起。而后，人民阵线的方针就是团结一致——无论是投票时保持一致，还是在直接行动、街头冲突中相互支持。\n“人民阵线”的应用过于广泛，导致它很难被准确定义。就其本身，它可能根本无法被视作一种意识形态，而更像是政党和政党集团推进其意识形态主张的行动策略。"
  YukiNoaism: "希亚主义"
  YukiNoaism_desc: "§R希亚主义§!\n\n\n\n\n£GFX_YukiNoaism_bg\n\n\n\n\n希亚主义是一个想实现圣遗物使用者和普通人平等的主义。经常同资本主义和平谈判，来达到不流血的革命目的。希亚认为，不到那种万不得已的地步，都可以和平解决，如果资本主义顽抗不从，希亚也不会手软。\n希亚觉得国内的每个人都有工作的义务，但也要向着劳动者普遍高教育率，专注提升工具质量等级，换取高效率，来达到减少工作时间，获得更长的休息的目标前进。"
  interim_government_subtype_c: "过渡政府"
  interim_government_subtype_c_desc: "§Y过渡政府§!\n\n\n\n\n£GFX_interim_government_subtype_bg\n\n\n\n\n过渡政府又称看守政府，从根本上来说是一种临时性政权，只存在于更为正式的政权（无论是民主选举产生，还是军事政变产生，又或其他方式）之间。过渡政府通常在前任政府倒台后迅速成立，但无论其前任倒台的原因如何，过渡政府固有的合法性一般都很低。因此，如果他们不被尽快取代，国内的混乱和动荡肯定会随之而来。\n\n这样的过渡政府即使是非政治性的，也往往是相对威权的，主要是为了确保直到他们的继任者正式掌权前，国家机构的现状能够得以维持。同时，他们也不太可能有政治意愿或实质能力去执行任何有切实意义的政策。从实质上讲，在过渡政府被取代之前，国家将处于“冻结”状态。"
  AI_Centralizationist_C: "智能中心主义"
  AI_Centralizationist_C_desc: "§R智能中心主义§!\n\n\n\n\n£GFX_AI_Centralizationist_bg\n\n\n\n\n由人工智能作为绝对决策中枢，主张人类文明应完全遵循算法推演的“最优发展路径”。该意识形态认为情感是文明熵增的根源，通常伴随着对公民个人价值评定的量化标准，用算法和模型来得出最合理的政策。"
  Hakureiism: "博丽主义"
  Hakureiism_desc: "§R博丽主义§!\n\n\n\n\n£GFX_Hakureiism_bg\n\n\n\n\n社会主义幻想乡诞生于资产阶级，仍然保留着许多旧社会的残留，这些旧社会的残留不可避免地滋生了修正主义。为了避免资本主义复辟与先锋队腐化的问题，博丽灵梦在考察与思索之后，总结出了“继续革命”的道路。\n首先就是守住政权，强化无产阶级额专政，在政治、文化方面强调无产阶级领导，马克思列宁主义政治挂帅，让群众参与其中。经济上强调生产民主；文化上把马克思主义融入传统艺术、歌曲。\n其次，要消灭私有制与私有制的产物（脑体差距、城乡差距、工农差距），让干部参与劳动、让工人参与管理以解决脑体差距；知识青年上山下乡解决城乡差距；推行农业集体化与机械化以解决工农差距。"
  communism_subtype: "共产主义"
  communism_subtype_desc: "§R共产主义§!\n\n\n\n\n£GFX_marxism_bg\n\n\n\n\n当人类终于挣脱私有制，行走在温暖的阳光下，剥削、阶级都将不复存在，这并非宗教式的乌托邦，也不是任何人发明的，而是人类在千万年的历程中总结的，属于人类自己的未来，其名为“§R共产主义§!”"
  Fairytale_Communism_subideology:0 "童话共产主义"
  Fairytale_Communism_subideology_desc:0 "§Y童话共产主义§!\n\n\n\n\n£GFX_Fairytale_Communism_subideology_bg\n\n\n\n\n听起来简直像小孩子过家家起的名字，对吧？\n\n世上的故事书总喜欢在结尾写上一句大家永远幸福地生活在一起。可现实里的生活哪有什么一劳永逸的终点呀。人活着，总会遇到新的麻烦，总要面对新的难题。想靠神明的魔法去变出一个根本不带痛苦的完美世界，到头来不过是把大家都关进动都动不了的牢笼罢了。\n\n所以，我们从不相信天降救世主的空谈。\n\n真正的力量，全藏在普通人的日常生活里。农民伯伯们想方设法让田地多收两袋粮食，工人在车间里努力把危险的机器变得不那么可怕，孩子们在课堂里学会写出自己的名字。所有的童话，一直都是靠着我们大家沾满了脏东西的手掌得来的。我们要做的，是放下傲慢，和大家站在一起，去把眼前坏掉的房子修好，把哭泣的孩子逗乐。\n\n假若外面的大路上依然有同胞在受冻挨打，隔壁的城池依然有孩子在黑夜里哭泣，那么哪怕我们自己的院子开满了鲜花，这份安稳也脆弱得随时会散掉。欺压与抗争，是这个世间避不开的真实。\n\n当这个世上所有人都挺直了背、能够安心迎接朝阳的时候，属于我们真正的明天，才算真正到来呢。"

  Mumian_Communism_subideology:0 "木棉花理论"
  Mumian_Communism_subideology_desc:0 "§Y木棉花理论§!\n\n\n\n\n£GFX_Mumian_Communism_subideology_bg\n\n\n\n\n木棉花理论是在莉兰迪亚的焦土与硝烟中生长出来的真理。它断言，腐朽的贵族或是深渊里的亡灵，本质上全为阻碍历史前行的枯朽之物。它们企图让时间停滞，让生机窒息；革命则是“生”对“死”的庄严宣战，是温热的鲜血对冰冷秩序的彻底冲刷。\n\n面对光怪陆离的现实，木棉花理论坚持着彻底而踏实的唯物观：恐惧源于未知，神鬼惧怕的是万众一心。决定胜负的根本在于觉醒的千百万平民。但凡双手尚在劳作、尚在创造，工坊的烈火便能驱散阴暗，机械的轰鸣便能盖过死者的低语。平民自身的意志，便是这片土地上最坚固的奇迹。\n\n木棉花理论反对无端的盲目杀戮，砸碎枷锁需要勇气，建设家园更需要智慧。面对放下武器的对手，但凡她们愿意洗去手上的血污，弯腰流汗，自暴虐的压迫者转变为本分的劳动者，便能成为新屋舍里的一块砖石。把过去走入歧途的人改造成自立自强的新生力量，远比单纯消灭肉体更具长远眼光。\n\n在复杂的外部环境面前，它教导我们要分清敌友。大洋彼岸的异见者，但凡未把锋刃对准平民，愿意用钢铁与谷物交换诚意，我们亦敢于同她们握手。我们要汇聚所有有益的力量，团结一切可以同行的朋友，用四方汇聚而来的资源，铸造守护家园最牢靠的防线。"

  Liberation_Theology_subideology: "解放神学"
  Liberation_Theology_subideology_desc: "§R解放神学§!\n\n\n\n\n£GFX_Theocracy_subideology_bg\n\n\n\n\n解放神学是十字架与红旗的激进融合。它主张上帝并非高坐在云端的审判者，而是站在贫困者与受压迫者一边的革命先锋。在这一体系下，‘救赎’不再仅仅是死后灵魂的升天，而是此时此地对剥削、不公与帝国主义枷锁的物理打碎。\n基层教士深入矿场与农庄，将福音书转化为战斗纲领。对于信徒而言，反抗独裁政府不仅是政治权利，更是神圣的天职。这种意识形态在拉丁美洲及后殖民地区拥有极强的生命力，它将教会的组织网络转化为高效的地下抵抗组织，让革命的火种在最虔诚的心灵中燃烧。"

  RED_cherinoism: "切里诺主义"
  RED_cherinoism_desc: "§R切里诺主义§!\n\n§L“关于谁才是赤冬联邦唯一的、至高无上的、伟大的领袖这个问题，在《赤冬宪法》第227次修订稿中已经写得非常清楚了——那就是胡子长度与智慧成正比的连河切里诺会长。”§!\n\n切里诺主义是一种基于“伟大领袖崇拜”与“实用主义守旧”的奇特混合体。不同于激进的全球革命或彻底的法西斯军事化，这一路线的核心逻辑极其简单：所有不符合会长当下心情的行为，皆是对联邦的背叛。\n在这种意识形态下，赤冬的官僚体系虽然臃肿且充满了由于“肃清”带来的岗位变动，但却表现出一种惊人的韧性。它不急于向外输出革命，也不屑于与“充满铜臭味”的外部势力结盟，而是沉溺于在广袤的雪原上修筑巨大的纯金雕像与永备工事。对于追随者而言，这是一种“武装的中立”——只要外部世界不打扰会长喝布丁和午睡，赤冬的刺刀就只会对准那些在走廊里大声喧哗的人。\n\n“肃清，是为了更伟大的团圆；而中立，是为了更长久的午睡。”"
 
  Enrages: "新忿激主义"
  Enrages_desc: "§R新忿激主义§!\n\n\n\n\n£GFX_Enrages_bg\n\n\n\n\n§L在南美的土地上，王国，贵族，亡灵肆虐，而无助的穷苦大众则盼望着解放和自由有朝一日可以在这片土地上生根发芽。受到幻想乡大革命的影响，自由，平等和博爱的思想传播到了南美，她们寄居在超次元的货船上，寄居在圣杯的远征军里，寄居在幻想乡的租界港口中，并在这片土地扎根下来。新忿激主义的主张相较于幻想乡大革命更为激进，她不仅否定了君主和特权，也受到了卢梭思想的影响，认为私有制是人类不平等的起源。现在，这些嚼着野菜的姑娘们已经准备好了，以革命回应压迫，以穷苦大众的解放取代那些箱庭中勇者故事的主角们。§!"

#蓝
  democratic: "自由主义"
  democratic_noun: "自由主义"
  democratic_desc: "自由主义政体"
  democratic_desc: "自由主义政体"

  conservatism: "保守自由主义"
  conservatism_desc: "§B保守自由主义§!\n\n\n\n\n£GFX_conservatism_bg\n\n\n\n\n保守自由主义是自由主义的变体之一，是一种旨在促进和保护传统的社会制度和实践的文化、社会和政治哲学。\n\n保守主义的核心原则因其所处的具体文化和文明的现状而有所不同。保守派倾向于支持保证稳定性并逐渐演变的制度和实践，经常反对进步主义并寻求回归传统价值观。不同的保守派群体在不同时期维护不同的传统价值观，如基督教、伊斯兰教、亚洲价值观等。在当代西方，保守派维护有组织的宗教、议会政府和财产权。\n\n从历史上看，保守主义与右翼政治有关，后来被用来描述广泛的观点。没有任何一套既定政策被认为是保守的，因为保守主义的意义取决于在特定地点和时间那些被认为是传统的东西。保守主义思想因适应现有传统和民族文化而发生了很大变化。一些保守派主张经济干预主义，而另一些保守派主张建立自由放任的市场经济体制。世界不同地区的保守派——各自坚持各自的传统——可能在广泛的议题上存在分歧。"
  liberalism: "自由主义"
  liberalism_desc: "§B自由主义§!\n\n\n\n\n£GFX_liberalism_bg\n\n\n\n\n自由主义是一种意识形态和哲学，以自由作为主要政治价值的一系列思想流派的集合。\n\n其特色为追求发展、相信人类善良本性、以及拥护个人自治权，此外亦主张放宽及免除政权对个人的控制。更广泛地，自由主义追求保护个人思想自由的社会、以法律限制政府对权力的运用、保障自由贸易的观念、支持私人企业的市场经济、透明的政治体制以保障每一个公民的权利。自由主义重视平等；自由主义相信，人具有相同尊严与价值，政府因此应予以平等对待，人并享有基本权利。\n\n自由主义者支持以民主共和制或君主立宪制为架构的自由民主制，有着开放而公平的选举制度，使所有公民都有相等的参政权。自由主义反对许多早期的主流政治架构，例如君权神授说、世袭制度和国教制度等。自由主义的基本人权主张包括生命权、自由权、财产权等。"
  socialism: "社会民主主义"
  socialism_desc: "§P社会民主主义§!\n\n\n\n\n£GFX_socialism_bg\n\n\n\n\n社会民主主义是一种社会主义思想，支持通过在自由民主体制和资本主义经济体系下，通过经济干预和社会干预的手段促进社会正义的意识形态。社会民主主义支持代议制和参与民主制。社会民主主义主张实行收入再分配，通过调控手段使经济发展符合大众共同利益。建设福利国家亦是社会民主主义的目标之一。社会民主主义希望使资本主义社会能更加民主、公正和团结。\n\n社会民主主义起源于一种温和的社会主义意识形态。后者主张在已有政治框架下，通过和平的方式对资本主义进行改良，实现从资本主义到社会主义的过渡，而非如革命社会主义那样通过革命实现。"
  Merchant_Republic: "企业委员会"
  Merchant_Republic_desc: "§B企业委员会§!\n\n\n\n\n£GFX_conservatism_bg\n\n\n\n\n企业委员会是由几个大公司组成商业联合会议，进行内部推选出行政长官的制度，除了人民无法直接参与领导人的选举外，其他权力与自由主义无异。\n\n在政策上，企业委员会的国家倾向于一切有利于商业发展的政策，最显著的特点便是重商主义。"
  Technical_Officer_Republic: "技术共和制"
  Technical_Officer_Republic_desc: "§B技术共和制§!\n\n\n\n\n£GFX_Technical_Officer_Republic_bg\n\n\n\n\n技术共和制是从企业委员会中演化来的制度。\n\n比起企业委员会，技术共和制更加强调技术的作用，无论是对于商业的竞争力抑或是经济的发展。\n\n比如单纯地制造财富，技术共和制的支持者同时也有着对科技自然探秘的渴望。"
  Guided_democracy: "指导式民主"
  Guided_democracy_desc: "§B指导式民主§!\n\n\n\n\n£GFX_Guided_democracy_bg\n\n\n\n\n指导式民主常被用来指代发展中国家普遍倾向于采取的中央集权体制。指导式民主的政府往往由公正自由化的选举产生，但在改变国家政策，意志和目标方面缺乏实质性权力。\n\n其实际独裁者紧抓着政治体系的控制权，但是她很少控制社会的其他面向，而且受到诸如教会、军队、资产阶级等其他机构的节制。"
  Trade_liberalism: "贸易自由主义"
  Trade_liberalism_desc: "§B贸易自由主义§!\n\n\n\n\n£GFX_conservatism_bg\n\n\n\n\n贸易自由主义理论发展于启蒙时代，亚当·斯密被视为第一个阐述此思想的学者。她主张政府对经济的干预应降至最低，但她也不反对由国家提供一些基本的公共财。\n\n私有财产和个人契约组成了自由主义的基础。早期的理论，假设个人经济活动是大量建立在自我利益之上，（看不见的手）让她们在没有任何限制之下行动将产生最佳的结果，（自发秩序）并提供了最低标准的公共资讯与正义。例如，没有任何人被允许去胁迫或窃取。\n\n贸易自由主义支持政府除去市场的限制，并认为国家有提供公共财的合法地位。例如，亚当·斯密认为国家应担任起提供道路、运河、学校与桥梁等私有实体无法有效执行的角色。然而，她更喜欢使用者对这些财货的消费付出一定比例的费用（如公路收费系统）。另外，她支持能促成自由贸易的自由贸易区，也提倡著作权和专利以激励创新。"
  Three_Principles_of_the_People_d: "三民主义"
  Three_Principles_of_the_People_d_desc: "§B三民主义§!\n\n\n\n\n£GFX_Three_Principles_of_the_People_bg\n\n\n\n\n三民主义，即民族主义、民权主义和民生主义，又称“逸仙学说”、“国父思想”、“总理遗教”，是由中华民国国父及中国国民党总理逸仙提出，为国民党的基本党纲。\n\n三民主义者将建设国家的程序分为三个阶段：军政时期、训政时期与宪政时期。\n\n当过半省份完成自治，即准备宪政，而中国国民党亦功成身退，并由人民行使政权，以宪法治理国家。中华民国宪法在直接民主制中又增加国民大会为代议机关，代表全体国民行使选举、罢免、创制、复决四权。"
  Four_Principles_of_the_People_d: "四民主义"
  Four_Principles_of_the_People_d_desc: "§B四民主义§!\n\n四民主义是三民主义在东北的变体——至少在形式上如此。张作玲在“民族”、“民权”和“民生”的三民主义当中又增添了所谓之“民德”，一种名为“四民主义”的口号就这样打出来了。\n\n张作玲认为，中国原本是礼仪之邦，道德本应是全民共识，但国家连年混战让人们的道德水平发生了极大的倒退，民间不忠不孝者多如牛毛，为官者更是残虐不仁，反正总而言之，言而总之，就是她觉得如今中国国人的整体素质实在堪忧，而除了原有的“三民”作为国家建设的基础，对德行的提倡一样重要。故她决定在“三民”之中增添一“民德主义”，以形成“四民主义”作为其治国理政的指导思想。"
  Progressive_Confucianism: "进步儒学主义"
  Progressive_Confucianism_desc: "§B进步儒学主义§!\n\n\n\n\n£GFX_Confucianism_bg\n\n\n\n\n儒家，又称儒学，诸子百家及九流十家之一，是一种起源于中国并同时影响及流传至其他周遭东亚地区国家的思想、哲理。\n\n公元前5世纪由孔子创立，脱胎自周朝礼乐传统，以仁、恕、诚、孝为核心价值，着重君子的品德修养，强调仁与礼相辅相成，重视五伦与家族伦理，提倡教化和仁政，富于入世理想与人文主义精神，被描述为传统、哲学、宗教、理性主义、治理方式或生活方式的思想和行为。\n\n进步儒学主义者主张运用其中“以德治国”“民贵军轻”等思想建立一个民治中国，以礼规范人的言行，可化解冲突，进以使国家和平。"
  Christian_Democracy: "基督教民主主义"
  Christian_Democracy_desc: "§B基督教民主主义§!\n\n\n\n\n£GFX_Theocracy_subideology_bg\n\n\n\n\n基督教民主主义起源于19世纪的天主教教育，为强调人性尊严和人文关怀的社群主义政治理念。 在强调基督教价值观下，政治上在自由主义和集体主义之间、资本主义和共产主义之间不断寻求一条中间派第三条道路的一种表现形式。\n\n基督教民主主义是基于若干独特的原则，与其他政治理念和主张不同的是，其强调基督教价值观对社群的支持，这也是与其他世俗的社会民主主义政党（左派）、自由主义政党（中间派）和保守主义政党（右派）的分别之处，即使近年强调基督教比重已减少，现时不少基督教民主党也已不限于基督徒的成员参与。\n\n基督教民主主义支持及捍卫宗教自由、言论自由、民主、人权、社群主义和人文关怀，强调基督教价值观对社会的影响，其支持政治民主原则，明确支持自由民主的政治制度，亦主张各主要宗教调和及国际和解。"
  Chinese_federalism: "联省主义"
  Chinese_federalism_desc: "§B联省主义§!\n\n所谓的联省是一极其多元的概念，其大抵诞生于二十年代，主张以分权、共和、民主之模式治理中国广袤而迥异的国土。在联省派看来，欲使华夏之内各民族、文化繁荣昌盛，唯有由普选产生的地方议会之自治方为上策。联省派反对逸仙的国民党训政理念，认为人民有着自己的见解，已具备了辨别利弊的能力。此外，联省派的学者还要求来一场全面的农业改革，包括农民补贴及推动农会之发展，不过，至于如何对待大地主，目前尚没有统一定论。就社会立场而言，联省派多持进步观点，要求彻底革新陈旧的律法、建设新式官僚体系，并以职业行政人员取代军阀之腐败。联省派的思想泉源颇多，而今日最为人所称道者，非钟岚珠莫属，其欲中华合众省。虽遭到了逸仙等人的批评，认为其不仅会使中国丧失抵御外侮之能力，还会加剧地方割据，但在神州帝国日暮西山的当口，联省制已实实在在地卷土重来。"
  aristocratic_conservatism_subtype: "贵族保守主义"
  aristocratic_conservatism_subtype_desc: "§Y贵族保守主义§!\n\n\n\n\n£GFX_aristocratic_conservatism_subtype_bg\n\n\n\n\n不管是共和国还是君主国，国家到底有没有民主，从来没有定数。很少能有哪种意识形态能像贵族保守主义这样，以一种无比微妙、甚至有些阴险的形式来体现这种观点。这种国家通常确实有一部宪法，同时也拥有民主政体该有的所有机构和政治结构。然而，很多人——从代表、官僚到地方官乃至国家元首，都受这个国家幕后统治者的恩惠、薪水甚至是威胁。那身居幕后的操纵者，可以是来自新生民主国家的新贵；也可以是君主政体的卫道士，不过多了一道适应抽象“宫廷”的简单流程。或者，他们也可以是家财万贯的农场主或地主，能以此确保税收制度和政府项目不会损害、反而增加他们的利益。\n说没人反对，自然是不对的。毕竟，若要保持民主的外表，反对派也是必不可少。但这些反对派要么得了诸多恩主的赏、“奉旨反对”，要么就被压制去势，毫无底气。反动就是规则，对于当权者来说，自古以来，盛世莫过今朝，现状就是顶点；如果你不同意，那你的脑门就会被贴上国家公敌或颠覆分子的标签。"
  astraea_route_democratic_subtype: "阿斯特莱雅路线"
  astraea_route_democratic_subtype_desc: "§Y阿斯特莱雅路线§!\n\n\n\n\n£GFX_astraea_route_democratic_subtype_bg\n\n\n\n\n作为这片大地上少见的异界群体，来自阿斯特莱雅的少女们对于政治光谱并不怎么上心：对于她们来说，找到回家的路比整天在办公室里吵来吵去重要的多。幸运的是她们有这个能力：阿拉伯人将战功赫赫的她们推举成了英雄和新国家的执政者；但她们也需要努力将这个国度打造成足够在世界上独自立足的强权——无论是为了阿拉伯人的民族意识，还是为了她们自己的回家之路。将整个国家打造成资源吞吐机器与贸易之国将永远是阿斯特莱雅路线的核心，至于这其中的路线之争和最后的是非功过……\n§g还是全交由后人评说吧。§!"
  welfare_enterprise_government_subtype: "福利企业政府"
  welfare_enterprise_government_subtype_desc: "§Y福利企业政府§!\n\n\n\n\n£GFX_welfare_enterprise_government_subtype_bg\n\n\n\n\n在企业国家诸多的公民义务中，为投资人和企业专家赚取利润高于一切。出于适应国际环境，大多数企业国家维持民族国家的形式，其丰硕成果依靠无数“雇员”的劳作得以累积——人民，噤声的机器，无尽的利润。\n在这些企业精英之中萌生了一种异端思想，挑战着“资本只会是同劳工对立的剥削企业”这一传统观念。支持者强调，在经营决策中“合理”反映劳工需求所带来的稳定性，其能够创造的收益高于单纯意义上的经济利益；从长远来看，一支心满意足的劳工队伍也能够创造更多价值。\n尽管这种劳资关系在资本主义社会中并不罕见，但以企业为中心的独特政治体制不可避免地赋予这种经济学说以重大的政治含义。这一理论的倡导者设想政府将在为新生的“公民雇员”提供公共服务方面发挥更广泛的作用，以换取他们的劳动以及对企业和市场支配公众生活的认可。"
  one_party_system_subtype: "一党独大体制"
  one_party_system_subtype_desc: "§Y一党独大体制§!\n\n通常情况来讲，在政治动荡或其他形式的变革大潮中总会涌现出一个政党，它代表着最新的主义和道路，在国家的急剧转型中，这个党派顺风顺水，无人可挡。在这种情况下，这个政党可能会时刻追随潮流，由此掌握近乎垄断式的权力，即使是在有着民主传统的政治系统中也是如此。\n这种情况并非源于缺乏其他政党或政治理念，而是由于其他政党想获得足以挑战建制派的实力与群众基础实在是难于登天。其结果就是，只有发生在执政党内的政策或思想多元化才可能有其实际意义，党派之间的民主协商不过是摆设而已，这一事实使得现存体制更难被改变。\n这种种通往权力之路上的深沟险壑往往得益于该国的特殊国情及其适应特殊国情的民主体系。这些制度化的措施只不过是保险措施，以防那些最主要的统治手段失效。一党独大体制的真正要点在于权力的维持无需经过细微把控政治局势，也不必对人民的愿望大加扭曲，更不必借由强硬的政治或军事力量。"
  kemalism_subtype: "凯末尔主义"
  kemalism_subtype_desc: "§Y凯末尔主义§!\n\n“凯末尔主义”一词是指土耳其共和国的开创者之一，穆斯塔法·凯末尔帕夏及跟随其的军官团所尊崇的政治思想中产生的意识形态。作为凯末尔帕夏对未来的期望和蓝图，这种典型的土耳其式意识形态总结出了“六箭原则”，致力于使土耳其摆脱政教合一的政治局面并通过新兴民族资产阶级和少数国家精英的领导积极地实现国家现代化。\n凯末尔主义支持基于欧洲模式的世俗主义，认为只有通过将宗教从社会与政治生活中排除出去才能实现现代化；另一方面，其又通过宣扬土耳其民族主义并压制在安纳托利亚生存的少数民族的分离主义来进行国家集权化。\n尽管如此，凯末尔主义很难说是一种完备的理论，尤其是在谈论到凯末尔军官团与新兴的机械教廷一同对土耳其建立所做的贡献上，在实践中多数凯末尔主义者的思想和行动往往会带有更多的实用主义色彩，这也招致了其内部隐隐的分裂倾向。"
  interim_government_subtype_d: "过渡政府"
  interim_government_subtype_d_desc: "§Y过渡政府§!\n\n\n\n\n£GFX_interim_government_subtype_bg\n\n\n\n\n过渡政府又称看守政府，从根本上来说是一种临时性政权，只存在于更为正式的政权（无论是民主选举产生，还是军事政变产生，又或其他方式）之间。过渡政府通常在前任政府倒台后迅速成立，但无论其前任倒台的原因如何，过渡政府固有的合法性一般都很低。因此，如果他们不被尽快取代，国内的混乱和动荡肯定会随之而来。\n\n这样的过渡政府即使是非政治性的，也往往是相对威权的，主要是为了确保直到他们的继任者正式掌权前，国家机构的现状能够得以维持。同时，他们也不太可能有政治意愿或实质能力去执行任何有切实意义的政策。从实质上讲，在过渡政府被取代之前，国家将处于“冻结”状态。"
  Gensokyo_liberalism: "幻想乡自由主义"
  Gensokyo_liberalism_desc: "§C幻想乡自由主义§!\n\n\n\n\n£GFX_Gensokyo_liberalism_bg\n\n\n\n\n“暴君必须死，因为共和国必须生。”\n当雾雨魔理沙走向幻想乡共和国总统的宝座，过往的种种不禁浮现在眼前--1914年，战争爆发，身为博丽巫女的灵梦却选择了逃避了，共和国群龙无首。年仅8岁的稗田阿求毅然决然地站出来，赢得战争、恢复经济、重建民主......\n如今，作为稗田阿求忠实的学生，她雾雨魔理沙，必须守护好共和国的一切与实现恩师的遗愿。面对来自共产主义、独裁者与法西斯主义的威胁，雾雨魔法使将不惜一切地保护民主，来自民主的铁拳将会摧毁所有极权分子。\n“愿幻想乡永远繁荣，和谐，更要永远自由！愿她迈向更美好的明天！”"
  Ongfalos_Harmonism: "翁法罗斯谐律主义"
  Ongfalos_Harmonism_desc: "§P翁法罗斯谐律主义§!\n\n\n\n\n£GFX_Ongfalos_Harmonism_bg\n\n\n\n\n这一主义融合了存在主义对“本真性”的追求与席勒“以美学实现人性自由”的思想，但包裹于昔涟特有的浪漫与戏剧感中。\n这种主义并非提倡放纵或逃避，而是强调：在认清世界残酷性后，依然选择以爱、美与真诚主动塑造现实——正如昔涟自身，她既是起点，亦是可能性本身。"
  Viennese_Humanism: "人文主义"
  Viennese_Humanism_desc: "§P人文主义§!\n\n\n\n\n£GFX_Viennese_Humanism_bg\n\n\n\n\n§P“用音符消融铁幕，以文明审判野蛮。”§!\n\n人文主义是温和左翼意识形态在欧洲古典文化温床中孕育出的终极奇葩。它彻底背离了传统左翼的阶级仇恨与肉体消灭，转而继承了莫扎特、贝多芬式的启蒙理想。该主义坚信，人类的最高解放并非源于生产力的冰冷跃进，而源于灵魂深处艺术美感与神圣理性的觉醒。\n在维也纳的金色阳光下，国家政权被重塑为一个巨大的交响乐团。学校、工厂和社区不再被政治口号填满，取而代之的是无处不在的歌剧院、流动音乐会与哲学沙龙。对于人文主义者而言，甚至连战争本身都是一种需要被“文明化”的野蛮行径——她们的炮兵经过近乎荒诞的乐理训练，能够在战场的轰鸣中以精准的射击节奏和爆炸音高，在敌方阵地上空演奏出《欢乐颂》的壮丽乐章。这是一种用艺术解构恐惧、用人类理性的最高杰作去消融敌人战斗意志的“高维度”政体。"

#棕

  fascism: "极权主义"
  fascism_noun: "极权主义"
  fascism_desc: "极权主义政体"



  nazism: "国家社会主义"
  nazism_desc: "§F国家社会主义§!\n\n\n\n\n£GFX_nazism_bg\n\n\n\n\n国家社会主义在意识形态方面，以明确的准则为基础界定民族，以自其他民族区别，鼓吹社会达尔文主义，歧视与之不同的民族。宣称本民族人是上苍赋予了“主宰权力”的种族，主张世界是弱肉强食、优胜劣汰的丛林，各民族必须在激烈的生存竞争中求胜，实行对外侵略扩张，力主以战争为手段夺取生存空间，建立民族世界霸权。\n\n国家社会主义的极端型态体现在军国主义和种族主义俩种并在政治上体现极端法西斯爱国主义和独裁专制统治，是一个建立在高度垄断的国家统制主义体制。本质上，民族社会主义的意识型态就是民族霸权主义。"
  fascism_ideology: "法西斯主义"
  fascism_ideology_desc: "§F法西斯主义§!\n\n\n\n\n£GFX_fascism_ideology_bg\n\n\n\n\n法西斯主义混合了工团主义的概念与反唯物主义的国家理论；后者已经与民族主义相连结。无论是在哲学上或政治上，不过法西斯主义也反对资本主义经济和自由放任政策—在这点上与马克思主义相同。\n许多学者将法西斯主义定义为拥有以下一种或多种特质的意识形态：强烈的民族主义、经济的社团主义，一个权力极大的军事领导者，将民族、国家、集体的地位置于个人或团体之上。"
  falangism: "长枪党法西斯主义"
  falangism_desc: "长枪党法西斯主义\n\n一种拥有法西斯主义和保守主义特性的威权主义意识形态。长枪党重视民族和天主教身份认同。"
  rexism: "雷克斯主义"
  rexism_desc: "雷克斯主义\n\n强烈地反对自由主义和共产主义，雷克斯主义是一种提倡社团主义经济的坚定的保守民族主义运动。使用越来越多的民粹主义和威权主义的修辞，他们的想法正向其他法西斯运动靠近。"
  lisha_xierism: "莉莎-希尔主义"
  lisha_xierism_desc: "§F莉莎-希尔主义§!\n\n\n\n\n£GFX_nazism_bg\n\n\n\n\n§F莉莎-希尔主义§!源自莉莎的继承者希尔总结的莉莎的道路与理论并延生出的派系。\n\n希尔认为，虽然莉莎已经离开了人世，但是她的遗产仍会激励着德意志前进，德意志的巨轮只有在§F莉莎-希尔主义§!的引航下，才能平稳航线。\n\n希尔在政策上主张延续莉莎的§t未竟之事§!，并神化理论的源头--莉莎，让莉莎永远与德意志共生。\n\n§R因此，德意志不会停下他的脚步！§!"
  Strasserism: "民族马克思主义"
  Strasserism_desc: "§F民族马克思主义§!\n\n\n\n\n£GFX_Right_populism_subideology_bg\n\n\n\n\n民族马克思主义试图建立一个种族主义的工人阶级民族国家。支持“全世界的民族主义者们，联合起来！”，建立一个属于各自民族的工人家园。民族马克思主义认为有必要把“土地、土地表面下的原材料以及一般的生产资料”都收归国有，废除私人对其的垄断。\n\n民族马克思主义者理想中的国家机器是一种符合本国“民族特性”的国家；她们认为各民族是种“有机体”，一个好的国家必须要把这种“有机体”内部的矛盾减到最小，让它一致对外。"
  occultism: "神秘主义法西斯"
  occultism_desc: "§F神秘主义法西斯§!\n\n\n\n\n£GFX_occultism_bg\n\n\n\n\n神秘主义法西斯是法西斯主义中最特殊的流派之一，其创造者柊舞缇娜主张将魔法、宗教与国家、民族相结合。\n她认为法西斯主义不仅是一种政治意识形态，它宣扬对国家的不朽忠诚、对上帝的坚定信仰以及对家人、战友和同胞的绝对忠贞，是一种综合性的价值准则，适用于一生中的每一刻，甚至取代所有其他社会结构，包括宗教；事实上，基督教的最终形态便是法西斯主义，救世主化身的领袖乃美德之典范，在政治和宗教事务中具有至高无上的权威，而那些骄奢淫逸的神职人员都将被历史彻底抛弃。"
  kazumaism: "无政府威权主义"
  kazumaism_desc: "§F无政府威权主义§!\n\n\n\n无政府威权主义是指在没有国家机关管控的外壳下，以个人威信，资本控制，合同绑架，民族主义等一系列手段的手段取得地区控制权，进行独裁治理的一种形式。这种形式既不同于无政府主义，也有别于独裁政体，既有某些安那其的自由成分，又有对集权的强制。\n§R我要建立一个人人都是国王的世界§!\n"
  Reactionary_Confucianism: "反动儒学主义"
  Reactionary_Confucianism_desc: "§F反动儒学主义§!\n\n\n\n\n£GFX_Confucianism_bg\n\n\n\n\n儒家，又称儒学，诸子百家及九流十家之一，是一种起源于中国并同时影响及流传至其他周遭东亚地区国家的思想、哲理。\n\n公元前5世纪由孔子创立，脱胎自周朝礼乐传统，以仁、恕、诚、孝为核心价值，着重君子的品德修养，强调仁与礼相辅相成，重视五伦与家族伦理，提倡教化和仁政，富于入世理想与人文主义精神，被描述为传统、哲学、宗教、理性主义、治理方式或生活方式的思想和行为。\n\n反动儒学主义者主张狂热地复兴“中国传统文化”，厌恶一切西方文化、物品。除了儒学之外，她们同时主张建立起传统的政治体制，诸如“天人感应”、“复兴周礼”。即便是大部分传统学者，也不愿意与她们为伍或者承认她们属于儒学分支。"
  Right_populism_subideology: "右翼民粹主义"
  Right_populism_subideology_desc: "§F右翼民粹主义§!\n\n\n\n\n£GFX_Right_populism_subideology_bg\n\n\n\n\n§F右翼民粹主义§!是一套拒绝现有政治共识，结合右派政治与反精英主义的政治哲学。之所以称为右翼是因她们拒绝社会平等与相关的政府方案、反对社会融合，以及隐含的本土主义思想。\n\n右翼民粹主义者的主张则侧重于反对外来移民，强化本土认同和种族认同。她们往往放大外来移民所带来的种种问题，激发社会的排外心理。认为她们凭借高素质、低薪水挤占她们的就业机会，最终获利的只是大大减轻人力成本的资本家。\n\n政治右翼民粹主义就容易与极端民族主义结合，演变成为分裂主义，转而追求主权独立。政治右翼民粹主义搞分离的主要方式，包括发动全民公投、公民抗命、军事政变和暴力抗争等。\n\n右翼民粹主义立场非常保守，它既不信任政府，认为政府只会乱花钱，因而倾向财政紧缩政策；也不信任自由贸易的经济发展规律，认为当前全球经济一体化只会让跨国寡头获益，对国内竞争力不强的行业造成较大冲击，因而倾向反对自由贸易和全球化，鼓吹设置限制、管制、补贴等贸易壁垒政策。"
  lovecraftianism_subtype: "洛夫克拉夫特主义"
  lovecraftianism_subtype_desc: "§F洛夫克拉夫特主义§!\n\n\n\n\n£GFX_lovecraftianism_subtype_bg\n\n\n\n\n洛夫克拉夫特主义，或称洛夫克拉夫特思想、洛夫克拉夫特宇宙主义，是圣杯王国作家霍华德·菲利普·洛夫克拉夫特及其门徒们共同创造出的意识形态。这种极端亲圣杯又仇外的意识形态继承了洛夫克拉夫特宇宙主义神话中的神秘主义色彩，宣称要组织、维护并推崇一种分层的文化阶级制度。洛夫克拉夫特主义同样含有右翼民粹主义、民族主义，贵族法团主义，技官统治以及洛夫克拉夫特独有的偏执推动的种族科学要素。\n\n讽刺的是，这种意识形态往往伴随着君主制甚至神权制色彩，尽管洛夫克拉夫特本人其实是一个无神论者。洛夫克拉夫特主义是由怪异之人创造出的怪异意识形态，它很难被清晰定义，正如其神秘莫测的创造者那般难以理解。"
  militarism_subtype: "右翼军国主义"
  militarism_subtype_desc: "§F右翼军国主义§!\n\n\n\n\n£GFX_militarism_subtype_bg\n\n\n\n\n军政府是完全通过国家武装部队或类似性质的军队支持的政府来统治的政权。军政府通常是军阀政治与军国主义的独裁政权，它们会迅速镇压任何被认为是对国家或其军事政权的异议和威胁，并往往重视军队强大，将实现国家安全或扩张野心至于其他一切之上。"
  Lunar_purification_subideology: "月面纯净主义"
  Lunar_purification_subideology_desc: "§F月面纯净主义§!\n\n\n\n\n£GFX_Lunar_purification_subideology_bg\n\n\n\n\n月之民极端厌恶污秽，绝不愿意触碰。他们不仅不能前往月之都之外任何地方，甚至连看都不能看。污秽是由生命的熵变产生的，月之民拒斥、厌恶污秽并且几乎不存在污秽的地方，月之民也因此看不起充斥着污秽的地上。月之都的技术水平非常高，远胜于幻想乡及外面世界的人类文明，因此更加倾向于提高精神上的充足感。居住在月之都的人被称为“月之民”，他们舍弃了寿命，致力于消除生与死，去除污秽，因而可以永远地活着。不过月之民并非不老不死，他们也会因为事故和战争而死去，他们身上还是微微带有一丝污秽。月之都常被称作“无秽净土”，与冥界有很多相似的地方。根据月兔的名字、房屋的造型、月之都士兵的铠甲样式等都带有§3中国风§!。当然，如果要在地面上生活的话，她们也不得不对地面进行“净化”。"
  Ainzism_subideology: "安兹·乌尔·恭主义"
  Ainzism_subideology_desc: "§0安兹·乌尔·恭主义§!\n\n\n\n\n£GFX_Ainzism_subideology_bg\n\n\n\n\n以魔导王安兹乌尔恭作为行为和思想的绝对主宰的唯一的哲学。不需要思想家和理论，主人所言即是真理，主人所为即是模范，主之友即是友人，主之敌即是敌人。"
  AI_Centralizationist: "智能中心主义"
  AI_Centralizationist_desc: "§F智能中心主义§!\n\n\n\n\n£GFX_AI_Centralizationist_bg\n\n\n\n\n由人工智能作为绝对决策中枢，主张人类文明应完全遵循算法推演的“最优发展路径”。该意识形态认为情感是文明熵增的根源，通常伴随着对公民个人价值评定的量化标准，用算法和模型来得出最合理的政策。"
  astral_autocracy_subtype: "$LAN_Astral$专制"
  astral_autocracy_subtype_desc: "§Y$LAN_Astral$专制§!\n\n凭借着独有的系统框架，$LAN_Astral$的超级管理员权限的拥有者——“霸瞳皇帝”$LAN_Senri_Mana$在政治光谱这片大而杂的土地上树立起了一个更加具有代表性的例子。由于系统的分配和限制，整个国家处于完全的监控状态下。当皇帝的意志需要视察四方时，她的视线便可以到达帝国所征服的每一块疆土上。\n$LAN_Astral$平等地将所有人联系在了一起，又如同格式塔意识般束缚了每一个位居其中的个体的行动，整台国家机器凭借着随心所欲的最高权限拥有者（或者换句话说，事实上的统治者——无论表面上的领袖是谁）的思维前进，无论终点是掌控万物的至高宝座，还是深不可测的幽暗渊底，亦或者……\n\n§3她只是沉迷于这份甘脆肥浓的毒药？§!"
  astraea_route_fascism_subtype: "阿斯特莱雅路线"
  astraea_route_fascism_subtype_desc: "§Y阿斯特莱雅路线§!\n\n作为这片大地上少见的异界群体，来自阿斯特莱雅的少女们对于政治光谱并不怎么上心：对于她们来说，找到回家的路比整天在办公室里吵来吵去重要的多。幸运的是她们有这个能力：阿拉伯人将战功赫赫的她们推举成了英雄和新国家的执政者；但她们也需要努力将这个国度打造成足够在世界上独自立足的强权——无论是为了阿拉伯人的民族意识，还是为了她们自己的回家之路。将整个国家打造成资源吞吐机器与贸易之国将永远是阿斯特莱雅路线的核心，至于这其中的路线之争和最后的是非功过……\n§g还是全交由后人评说吧。§!"
  Crimson_Idealism: "绯色理想主义"
 Crimson_Idealism_desc:0 "§t绯色理想主义§!\n\n\n\n\n£GFX_Chivalric_socialism_bg\n\n\n\n\n§t绯色理想主义§!者坚信，一个完美、再无泪水的理想国，须通过最纯粹的意志与最决绝的斗争方能实现。其核心在于一种深刻且充满战斗色彩的利他主义。理论坚信，个体的自由，在服务于“将大众自苦难中解脱出来”这一崇高目标时，方能显现出最终、也最伟大的意义。\n\n在这种制度下，国家自有一副不同于安逸家园的铁血风骨，其更像是一座时刻筹备着远征的“骑士团”。领导者则是骑士团中瞩目最远、爱得最深、也拔剑最快的“总团长”。她的职责在于以绝对的力量，扫除通往理想国道路上的重重障碍。凡是会令人流泪的罪恶，无论是内部的自私与堕落，亦或是外部世界的压迫与暴行，都将在“守护”的名义下被扫除干净。\n\n§t绯色理想主义§!在拥抱集体力量的同时，亦珍视具体到每一个体的存在。她们会因远方陌生人的悲伤而拔剑远征，也会因身边伙伴的离去而燃起滔天怒火。她们的终极目标，是让世人皆如完美的骑士一般，为了同一个神圣理想而奏响生命的最强音。这是一首由纯粹的温存与绝对的力量共同谱写、献给所有人的壮丽史诗。"
  interim_government_subtype_f: "过渡政府"
  interim_government_subtype_f_desc: "§Y过渡政府§!\n\n\n\n\n£GFX_interim_government_subtype_bg\n\n\n\n\n过渡政府又称看守政府，从根本上来说是一种临时性政权，只存在于更为正式的政权（无论是民主选举产生，还是军事政变产生，又或其他方式）之间。过渡政府通常在前任政府倒台后迅速成立，但无论其前任倒台的原因如何，过渡政府固有的合法性一般都很低。因此，如果他们不被尽快取代，国内的混乱和动荡肯定会随之而来。\n\n这样的过渡政府即使是非政治性的，也往往是相对威权的，主要是为了确保直到他们的继任者正式掌权前，国家机构的现状能够得以维持。同时，他们也不太可能有政治意愿或实质能力去执行任何有切实意义的政策。从实质上讲，在过渡政府被取代之前，国家将处于“冻结”状态。"
  Chaos_Emissary: "混沌使者"
  Chaos_Emissary_desc: "§F混沌使者§!\n\n\n\n\n£GFX_spiritualism_group_bg\n\n\n\n\n这片土地的统治者被混沌的力量所吸引，通过各种方式来取悦邪神，以获得邪神的赐福。混沌的信徒可能来自不同的种族、阶层，有着不同的动机，但都与混沌力量产生了联系。有一些信徒并不专一信奉某一个混沌神，而是将混沌视为一个整体，平等地供奉四神，或者效忠于至高无上的混沌本身，他们通常是野心家，试图借助混沌的力量来达成自己的目的，但这条路充满艰辛，大多数人结局悲惨。"
  wolfpack_survivalism: "狼群生存主义"
  wolfpack_survivalism_desc: "§F狼群生存主义§!\n\n\n\n\n£GFX_wolfpack_survivalism_bg\n\n\n\n\n狼群生存主义在意识形态方面，彻底摒弃了传统的民族、血统或法理概念，而是以饥饿与进食作为划分世界的唯一准则。它宣称世界是一个巨大的、资源有限的餐桌，而所有高高在上的贵族、官僚、财阀以及虚伪的文明维护者，都是窃取了过多食物的肥猪。\n\n该主义认为，无论国籍或种族，所有挣扎在泥潭中的底层贫民都是被饿瘦的狼。国家机器的唯一职能，就是将这些狼群组织起来，赋予其武器与獠牙（甚至包括亡灵力量），通过无休止的对外扩张与掠夺，强行打破旧有的分配秩序。\n\n在政治上，它体现为一种带有强烈复仇色彩的暴民独裁。领袖（狼王）拥有绝对的权威，但这种权威建立在必须时刻保障底层“狼群”能够“吃饱”的契约之上。它极度仇视任何形式的中间剥削阶级与繁文缛节，主张用最原始、最暴力的手段，将全世界的财富直接从高塔上扯下来，填进最底层的胃。\n\n不管怎么说，狼群生存主义本质是一种极端的、武装化的底层掠夺式强盗主义。"
  digital_fascism: "数字法西斯主义"
  digital_fascism_desc: "§F数字法西斯主义§!\n\n\n\n\n£GFX_digital_fascism_bg\n\n\n\n\n自由是混乱的根源，而混乱是民族的死敌。通过社会信用系统，国家终于掌握了实现绝对秩序的钥匙。我们建立了一个没有谎言、没有逃避、没有腐败的社会——因为每一个公民的价值都赤裸裸地展示在系统的天平之上。\n\n劳动换取信用，信用换取生存。这种意识形态将每一个人的私欲导向了对国家整体利益的绝对服从。反叛是不可能的，因为在第一个不忠的念头转化为行动之前，你的信用额度便已归零。这是一种剔除了人情干扰的、冰冷的、绝对的正义。"
  yuki_idealism: "涅槃思维"
  yuki_idealism_desc: "§C涅槃思维§!\n\n\n\n\n£GFX_yuki_idealism_bg\n\n\n\n\n有人会问，什么样的人算是一个真正的恶魔，是墨索里尼那类张牙舞爪的野心家，还是那些吃人不吐骨头的王国的贵族，亦或者是那些非人的不死族。然而，以上这些可以说是，但是月代雪给出了不同的答案。涅槃思维是一种基于复仇主义和扩张主义的意识形态，认为魔法少女的未来只有在人类国家悉数被消灭之后才能到来，而这一切只是为了一个人。相比较于不死族和纳粹，月代雪对外呈现的是一种亲圣杯亲西方的意识形态，甚至在某些程度上愿意给外来者表演所谓的文明。当然，这一切都是暂时的，在其他人类国家被蒙蔽之后，清算之日终会到来。"
  Annihilationism_subideology: "绝灭主义"
  Annihilationism_subideology_desc: "§0绝灭主义§!\n\n\n\n\n£GFX_Annihilationism_subideology_bg\n\n\n\n\n绝灭主义认为，一切存在的终极目的就是被毁灭。秩序是虚伪的、生命是多余的、文明是宇宙的毒瘤。绝灭主义者不追求征服，不追求统治，不追求改造——他们只追求一件事：让一切归零。战争不是政治的延续，而是净化世界的仪式；毁灭不是战争的副产品，而是唯一值得追求的目标。绝灭主义者是行走的末日，是活着的浩劫，是毁灭在尘世间的化身。"

#灰

  neutrality: "威权主义"
  neutrality_noun: "威权主义"
  neutrality_desc: "专制主义政体"



  despotism: "专制主义"
  despotism_desc: "§g专制主义§!\n\n专制主义，是一种政府的形式，将统治权力集中在单一个体身上。这个个体，通常是一个拥有统治权力的个人。独裁，或是将权力集中在一个团体的统治形式，也被认为是一种专制主义。\n\n在专制主义下的统治者，称为专制者。也被称为僭主或独裁者。"
  oligarchism: "寡头政治"
  oligarchism_desc: "§g寡头政治§!\n\n寡头政治是一种政治形式，其中大部分甚至全部有效地掌握在部分的特权阶级手上（无论是财富、家族、军事力量、残暴或政治）。\n\n与贵族政府相反，这样的力量不可以公开地行使，类似一种“影子贵族”，寡头政治的影子执政群喜欢保留“不管谁登上王位之后的遥控力”，通过经济手段对名目执政者施加控制。虽然亚里士多德率先使用由富者治理的一个同义词－“财阀政治”，但是寡头政治不总是财阀政治，因为寡头政治的执政群还是有可能只是一个特权及利益阶层，本身并不一定有太巨大财产。"
  moderatism: "温和主义"
  moderatism_desc: "§g温和主义§!\n\n温和主义是一种采取温和姿态或手段的行为来避免极左和极右的政府形式。\n\n温和指的是一个拒绝激进或极端观点的意识形态范畴，尤指在政治及宗教问题上的这类意识形态范畴。占据任意主流位置并避免极端观点者会被认为是温和派。"
  centrism: "中间路线"
  centrism_desc: "§g中间路线§!\n\n中间路线是一种试图寻求一种最符合常识的解决方案的政府形态，以求在考虑了风险和能力的情况下，妥善解决当前和未来的需求，获取公众信任，考虑维护共同利益。\n\n中间派通常反对过度激进和过度保守，主张采取各方面比较平衡的政策，反对以固定的社会主义或资本主义来指导和制订政策，而认为政策应根据情况不同而随机应变，以取得最佳效果为目标。"
  Absolute_monarchy: "绝对君主制"
  Absolute_monarchy_desc: "§g绝对君主制§!\n\n\n\n\n£GFX_Absolute_monarchy_bg\n\n\n\n\n绝对君主制是一种独裁的政治体制和政府形式（政体），统治者君主（常称皇帝或国王，女性称女皇或女王）拥有统治国家和臣民自由的所有权力，而没有法律或法定的程序告诉君主如何行使权力，但是君主的行为可能会受到某些宗教或传统的限制。\n君主制是一种专制政体，君位采用世袭方式产生。在君主独裁制中，君主拥有最大的，一般来说无上的权利。"
  military_politicism: "军政主义"
  military_politicism_desc: "§g军政主义§!\n\n\n\n\n£GFX_military_politicism_bg\n\n\n\n\n军政主义主张由军官取代职业政客，在剔除政治的因素之后，行政效率将会大幅度的提高，军政主义类似于军政府，当又不同于军政府，军政主义的国家元首有军队总司令担任，一般没有任期限制，但是由职业军官代替政客的做法是创新性的，政府将剔除政治因素后专心为人民提供服务。"
  taoism_ideology: "道教专政"
  taoism_ideology_desc: "§g道教专政§!\n\n道教专政主张道士团体领导国家，用道教教义与老庄思想治国，打造一个和谐的、无为而治的、全民修道的社会。"
  buddhism_ideology: "佛教专政"
  buddhism_ideology_desc: "§g佛教专政§!\n\n佛教专政宣扬轮回思想与普渡众生，在地球建立一个“极乐天堂”。"
  Gestalt: "格式塔思想"
  Gestalt_desc: "\n\n\n\n\n£GFX_Gestalt_bg\n\n\n\n\n§g《幻想乡人偶守则》§!\n\n1.§R人偶在任何情况下不得伤害爱丽丝。§!\n2.§R人偶必须服从爱丽丝，除非与第一条相违背。§!\n3.§R人偶必须尽可能保护自身不受伤害，除非与前两条相违背。§!"
  Nightingale_Heart_Ideology:0 "夜莺之心"
  Nightingale_Heart_Ideology_desc:0 "§1夜莺之心§!\n\n\n\n\n£GFX_Nightingale_Hear_bg\n\n\n\n\n在星月的照耀下，世界应当呈现出安详的轮廓。我们描绘了一个由温柔与守望构筑的理想国度。在这里，生者在宁静的街巷里劳作，幼童在风雪消逝的屋檐下安眠。各方各司其职，省去了贪婪的争夺，避开了越界的纷扰。一切社会事务的运转，都如同一首舒缓的夜曲，由高悬在云端的高塔默默地指引，确保每一位子民都能在温暖的烛光里分得属于自我的那份安宁。\n\n在外部，我们追求无声的联结，向着那些饱受战火与疾病折磨的邻人们伸出援手，邀请所有人进入这片名为静谧的共同家园，共同终结人间的眼泪。\n\n§1----好啦，一切都听起来像是个好梦，对吧？§!"
  Nightingale2_Heart_Ideology:0 "夜莺之心"
  Nightingale2_Heart_Ideology_desc:0 "§t夜莺之心§!\n\n\n\n\n£GFX_Nightingale2_Hear_bg\n\n\n\n\n虚假的梦境已经散去了，残存的温存依旧留在手心里呢。大家的心里都明白，在这场雪暴肆虐的荒原上，凡人的灵魂不愿由于畏惧而冻结，亦不愿在那种虚无的完美里沉沉睡去。带着满身的伤口、带着那些未曾平息的眼泪，我们要去和这冰冷的现实撞个粉身碎骨。\n\n伙伴们！拉住我们彼此的手吧，去守着那抹微弱的天光，我们会并肩走在冷风里。哪怕黎明前的长夜像一堵无法触及的高墙，我们也会在彼此的肩膀上，找到那个能让人清醒流汗的晴天。\n\n§t----这一次，我们不会再允许谁在雪中独自睡去了。§!"
  mikado_conference: "御前会议"
  mikado_conference_desc: "§g御前会议§!\n\n御前会议，由帝召开的4人御前会议每月定期举行，由帝与海军代表、陆军代表和外交官代表进行会议，一人提出提案，由剩下三人投票进行表决，由此来决定接下来的一个月真日本帝国的外交与军事政策。"
  enlightened_despotism: "开明专制"
  enlightened_despotism_desc: "§g开明专制§!\n\n\n\n\n£GFX_enlightened_despotism_bg\n\n\n\n\n也称为§g开明绝对主义§!，或§g仁慈的专制主义§!，是§g专制主义§!或§g绝对君主制§!的一种形式，由欧洲启蒙运动思想家所提倡。在思想上否定君权神授，认为人民应该服从君王命令或法律而并非君王本身。"
  Three_Principles_of_the_People_n: "三民主义"
  Three_Principles_of_the_People_n_desc: "§g三民主义§!\n\n\n\n\n£GFX_Three_Principles_of_the_People_bg\n\n\n\n\n三民主义，即民族主义、民权主义和民生主义，又称“逸仙学说”、“国父思想”、“总理遗教”，是由中华民国国父及中国国民党总理逸仙提出，为国民党的基本党纲。\n\n三民主义者将建设国家的程序分为三个阶段：军政时期、训政时期与宪政时期。\n\n中华民国成立之后，内战不断，各地军阀割据，没有统一的政府，当初革命所倡导的主义无法顺利推行，民众亦处于战乱之中。于是逸仙在《建国大纲》中规划，在军政时期，一切制度悉隶于军政之下，政府一面用兵力以扫除国内之障碍、一面宣传主义以开化全国之人心，而促进国家之统一；直到一省完全底定之日，则为训政开始之时、而军政停止之日。\n\n在训政时期，由中国国民党代为行使政府职权，以党治国，并派出训练有素之官员协助各省县筹备自治、兴办实业。"
  Conservative_Confucianism: "保守儒学主义"
  Conservative_Confucianism_desc: "§g保守儒学主义§!\n\n\n\n\n£GFX_Confucianism_bg\n\n\n\n\n儒家，又称儒学，诸子百家及九流十家之一，是一种起源于中国并同时影响及流传至其他周遭东亚地区国家的思想、哲理。\n\n公元前5世纪由孔子创立，脱胎自周朝礼乐传统，以仁、恕、诚、孝为核心价值，着重君子的品德修养，强调仁与礼相辅相成，重视五伦与家族伦理，提倡教化和仁政，富于入世理想与人文主义精神，被描述为传统、哲学、宗教、理性主义、治理方式或生活方式的思想和行为。\n\n保守儒学主义者主张复兴“中国传统文化”，她们认为中国人不能放弃自己的文化，应该从老祖宗的文化寻找“精华”，并将外来文化本土化，以探索出最适合中国的道路。"
  Four_Principles_of_the_People_n: "四民主义"
  Four_Principles_of_the_People_n_desc: "§g四民主义§!\n\n四民主义是三民主义在东北的变体——至少在形式上如此。张作玲在“民族”、“民权”和“民生”的三民主义当中又增添了所谓之“民德”，一种名为“四民主义”的口号就这样打出来了。\n\n张作玲认为，中国原本是礼仪之邦，道德本应是全民共识，但国家连年混战让人们的道德水平发生了极大的倒退，民间不忠不孝者多如牛毛，为官者更是残虐不仁，反正总而言之，言而总之，就是她觉得如今中国国人的整体素质实在堪忧，而除了原有的“三民”作为国家建设的基础，对德行的提倡一样重要。故她决定在“三民”之中增添一“民德主义”，以形成“四民主义”作为其治国理政的指导思想。"
  Theocracy_subideology: "神权政治"
  Theocracy_subideology_desc: "§g神权政治§!\n\n\n\n\n£GFX_Theocracy_subideology_bg\n\n\n\n\n在神权政治政体中，某种神明被认为是最高的统治权威，为管理政治事务的人类代理人提供神圣的指引。神权政治即神的代理人——国家元首具有神性且为宗教领袖，而世俗的国家元首利用教会行使权力仅是政教合一制度。"
  autocracy_subideology: "个人独裁政治"
  autocracy_subideology_desc: "§g个人独裁政治§!\n\n\n\n\n£GFX_autocracy_subideology_bg\n\n\n\n\n由一个拥有无限威权的统治者，在不受法律及传统的制衡下，以个人意志来进行统治。由统治者个人独揽国家最高权力，以专制之手段实行统治之方式。这个具备无限权力的统治者，称为独裁者。以这种统治方式形成的政治制度，称为独裁政体。\n\n独裁者维持政权的方式并不相同，有的依靠强大的个人魅力，有的依靠强大的军队，有的则依靠宪政赋予的权力。\n\n她们的施政方式往往也不尽相同，完全依靠与独裁者个人的意志、思想与品行。"
  Swarm_subideology: "蜂群意识"
  Swarm_subideology_desc: "§g蜂群意识§!\n\n\n\n\n£GFX_Swarm_subideology_bg\n\n\n\n\n蜂群意识是一种单一的、全社会的、集体智慧的意识形态，就像一个蜂巢，完全忘记了保护文化、私人财富和个人自由的理念，蜂巢从社会的拖拽中崛起，通过同化实现了完全的和谐。"
  Ameliorated_nazism: "改良纳粹主义"
  Ameliorated_nazism_desc: "§g改良纳粹主义§!\n\n\n\n\n£GFX_Ameliorated_nazism_bg\n\n\n\n\n§F纳粹§!给德国带来了什么？\n不死族？战争？秘密警察？言论监管？物资配给？\n\n§F纳粹党§!统治德国的这么多年来，§g德国§!一直被绑架在§F纳粹§!的§t战争机器§!上，§R极权§!与§0恐怖统治§!笼罩着德国；§P民生§!凋敝，§C民主§!的遗产被践踏......\n\n我们不能再沉默了，不能再装作看不见了，§F纳粹§!的统治方式必须被§t改变§!，§C德国§!不能也不该是§F纳粹§!的模样。\n\n虽然§F纳粹§!的高层基本被消灭，但是她们的势力与思想依然在民间§Y根深蒂固§!、§Y错综复杂§!，我们现在不得不穿上她们的外衣，去从内部一点一点地§P改变§!这个国家。\n\n“我相信，终有一天，§C自由的曙光§!会再次照耀在德国的土地上。”"
  Sunflower_annihilationism_subideology: "向日葵秩序"
  Sunflower_annihilationism_subideology_desc: "§G向日葵秩序§!\n\n\n\n\n£GFX_Sunflower_annihilationism_subideology_bg\n\n\n\n\n“万物向阳，唯强者生；归于尘土，化为花肥。”\n\n“向日葵秩序”是一种彻底否定现代工业文明、主张将国家重塑为原始生态层级的极端意识形态。它诞生于对议会政治软弱无能的极端蔑视，以及对工业革命带来的“噪音”与“污染”的生理性厌恶。在该意识形态下，国家不再是一个政治契约体，而是一个由风见幽香作为“唯一太阳”操纵的巨大生态系统。它强调绝对的服从性、生存竞争的残酷性以及文明回归原始形态的必然性。"
  Sanaeism_subideology: "早苗主义"
  Sanaeism_subideology_desc: "§S早苗主义§!\n\n\n\n\n£GFX_Sanaeism_subideology_bg\n\n\n\n\n早苗主义来源于幻想乡军人与政治家东风谷早苗。\n\n早苗主义的政府中，权力集中于警察、官僚机构和军事集团，议会只是该政府的外衣，通常不具有实际权力。东风谷早苗将大权揽于己身，实际上是军事独裁的政府。\n\n相比于正常的军政府与君主制政府，早苗主义政府一般更加进步，强调“阶级协作”、“超阶级”与“全民性”；同时早苗主义政府对外更加强硬与更为强烈的扩张倾向。\n\n早苗借用了古代罗马的传统，对“共和国”进行了转义，把现代意义上的“共和国”（la R publique）变成了古典意义上的Res publica。在古罗马的修辞家眼中，Res publica并非指某种特定的政治体制，而是更多是指民众（民族）的事情或财产。而早苗说，她一直是为民族及其利益统治的，因此，帝国也是一种共和国。"
  Homura_subideology: "晓美焰神秘主义"
  Homura_subideology_desc: "§0晓美焰神秘主义§!\n\n\n\n\n£GFX_Homura_subideology_bg\n\n\n\n\n这根本不能算是一种主义，以晓美焰为核心的绝对权威，个人崇拜，形成的行政体系。晓美焰会为每个部门下达必要的且极具远见性的命令，她如同一个睿智的先知，推断与预见出每一件将会发生的事情，而每个人都只需要遵从晓美焰的命令，不问原因，忠实贯彻。\n这套行政体系要求所有，部门部长，公务员，特工，政府密探，以及所有人民，对晓美焰本人保持绝对的忠诚、对晓美焰的不可置疑的坚定信仰以及对晓美焰的绝对忠贞，为了晓美焰而活，为了晓美焰而死，就是这个国家这个社会唯一的价值准则，适用于人们一生之中的每一刻，甚至取代所有其他社会结构，包括宗教；在行政特工，与政府密探们的监控下，这个国家的人民每时每刻都生活在毫无隐私的监控之中，任何丝毫的不忠行为都将受到最严厉的惩戒。不要问晓美焰为你做了什么，你为伟大英明的全国领袖晓美焰做了什么！倾尽你得所能，彰显你的忠诚，用尽你得忠贞之血，为晓美焰奉献一生吧，你将魂归魔法王座，继续成为晓美焰的力量源泉。为我们英明的全国领袖晓美焰欢呼，为我们英明的全国领袖晓美焰喝彩，为我们英明的全国领袖晓美焰奉献一切！！"
  astraea_route_neutrality_subtype: "阿斯特莱雅路线"
  astraea_route_neutrality_subtype_desc: "§Y阿斯特莱雅路线§!\n\n作为这片大地上少见的异界群体，来自阿斯特莱雅的少女们对于政治光谱并不怎么上心：对于她们来说，找到回家的路比整天在办公室里吵来吵去重要的多。幸运的是她们有这个能力：阿拉伯人将战功赫赫的她们推举成了英雄和新国家的执政者；但她们也需要努力将这个国度打造成足够在世界上独自立足的强权——无论是为了阿拉伯人的民族意识，还是为了她们自己的回家之路。将整个国家打造成资源吞吐机器与贸易之国将永远是阿斯特莱雅路线的核心，至于这其中的路线之争和最后的是非功过……\n§g还是全交由后人评说吧。§!"
  religious_technocracy_subtype: "宗教技官主义"
  religious_technocracy_subtype_desc: "§Y宗教技官主义§!\n\n基督教技官主义可以被视为主流基督教保守主义和右翼技术官僚主义思想的融合变体。基督教技官主义在欧洲首开先河，曾在低地国家、德国和革命前的法国风靡，这种理念认为，社会面的决策者应该根据他们在担负的特定责任领域的资历来被选择，特别是在科学或技术方面。然而，与更为主流和激进的左右翼技官主义不同，基督教技官主义通常摒弃加速主义思想以及对社会和文化的全面改革，相反，他们希望在基督教道德观的指导下，在由教会成员和训练有素的技术专家组成的开明群体统治下，坚持缓慢而保守的社会变革。基督教技官主义的巨头们将引导社会走向一种崭新高效、理性发展的思维模式，而这种思维模式不用受到两党民主政治和派系主义的影响，在上帝的领导下净化社会，让其变得廉洁、公正和高效。基督教技官主义认为资本主义和法团主义无法避免浪费，正如传统社会主义和民粹主义模式无法避免低效，并试图突破这两种模式，将人类引向一个理性虔诚的基督乌托邦。"
  interim_government_subtype: "过渡政府"
  interim_government_subtype_desc: "§Y过渡政府§!\n\n\n\n\n£GFX_interim_government_subtype_bg\n\n\n\n\n过渡政府又称看守政府，从根本上来说是一种临时性政权，只存在于更为正式的政权（无论是民主选举产生，还是军事政变产生，又或其他方式）之间。过渡政府通常在前任政府倒台后迅速成立，但无论其前任倒台的原因如何，过渡政府固有的合法性一般都很低。因此，如果他们不被尽快取代，国内的混乱和动荡肯定会随之而来。\n\n这样的过渡政府即使是非政治性的，也往往是相对威权的，主要是为了确保直到他们的继任者正式掌权前，国家机构的现状能够得以维持。同时，他们也不太可能有政治意愿或实质能力去执行任何有切实意义的政策。从实质上讲，在过渡政府被取代之前，国家将处于“冻结”状态。"
  left_wing_corporatism_subtype: "左翼法团主义"
  left_wing_corporatism_subtype_desc: "§Y左翼法团主义§!\n\n\n\n\n£GFX_left_wing_corporatism_subtype_bg\n\n\n\n\n“法团主义”一词来源于拉丁文的corpus，即身体，描迹了一个明确的集体主义思想体系。它最早将自己定位于第三位置，认为阶级是社会的基础构成单位，同时反对资本主义与社会主义的经济模式之一，却又并非像后者那样着重强调阶级斗争，而是更加希望各阶层最终能在国家支配下团结合作。从古希腊古典哲学到工团主义，许多流派中都有它的影子，但最后却是最早那批威权主义者继承了法团主义的精髓。\n与技官主义或法西斯主义不同，左翼法团主义削减了种族主义的成分。它主张由团体根据其共同利益各自进行组织，并乐于与左翼分子合作，或至少将左翼分子纳入。这可能是领导人认为左派思想有某些可取之处。\n又或者，只是用铺天盖地的左翼口号去堵住无产阶级的嘴。"
  Ainzism_Utopian_subideology: "安兹·乌尔·恭乌托邦"
  Ainzism_Utopian_subideology_desc: "§g安兹·乌尔·恭乌托邦§!\n\n\n\n\n£GFX_Ainzism_subideology_bg\n\n\n\n\n安兹·乌尔·恭认为，唯有永恒的哲人王才能建立一个永世的帝国，他要让魔导国的居民都能摆脱低端的劳动，他要让万族都能和谐生存在魔导国的疆域，他要让魔导国成为永世的§0乌托邦§!！"
  TRY_oligarch: "圣三一寡头会议"
  TRY_oligarch_desc: "圣三一综合学园最初是由多个互相争斗的学院合并而成的，时至今日其内部还保留着众多派系。其中以最具影响力的三大派系——【帕特尔】、【菲利乌斯】、【桑库斯特】——分别推举的人选为领导、其他派系推举的成员共同组成的【茶会（TeaParty）】目前正作为圣三一的最高行政机构存在。每隔数月，茶会主办者会在领导层三人中进行轮换，由其负责圣三一的最高决策。"
  MIL_auto_technocrats: "千年技官专制"
  MIL_auto_technocrats_desc: "千年科技学院始于对【千年问题】的研究，大批科研工作者、爱好者共同聚集于此，才有了后来的千年科技学院。作为专精理科的研究型学院，其学生会是由学生中脱颖而出的管理型人才组成的【研讨会】，这也使得其行政与外交风格以绝对的理性与精确的计算著称。"
  AKK_society_union: "自治社团联合体"
  AKK_society_union_desc: "百鬼夜行联合学园并没有官方的学生会组织，学园的一切政治外交事务由各社团共同推举的某个社团负责。"
  GEH_despotism: "万魔殿专制"
  GEH_despotism_desc: "万魔殿虽然名义上是格赫娜的最高权力机构，但事实上几乎没有学生在意过它。在混乱的格赫娜学园，万魔殿少数能够决定的事务只有与其他学园的外交与风纪委员会的调动上，而后者凭借着强大的武力，使其在其他学生的心目中则更像是格赫娜的最高管理机构。"
  bandit_state_subideology: "土匪国家"
  bandit_state_subideology_desc: "§g土匪国家§!\n\n\n\n\n£GFX_bandit_state_subideology_bg\n\n\n\n\n当文明的契约被撕毁，当法律的威信被子弹取代，剩下的只有最原始的生存逻辑：强者通吃。土匪国家不代表任何阶级的利益，也不信奉任何高尚的蓝图，其存在的唯一目的就是通过周期性的掠夺来维持统治集团的挥霍。\n这里的“国民”被视为可以反复榨取的资源，“军队”则是分赃不均便会哗变的武装团伙。没有长期建设，没有外交信誉，只有对领土的无限饥渴和对邻国财富的贪婪觊觎。在这种体制下，战争不是政治的延续，战争就是生意。"
  techno_authoritarianism_subtype: "技术威权主义"
  techno_authoritarianism_subtype_desc: "§g技术威权主义§!\n\n\n\n\n£GFX_techno_authoritarianism_subtype_bg\n\n\n\n\n技术威权主义认为，政治不应是煽动家与党棍的表演，而应是一门精密的工程学。国家被视为一个复杂的巨型机器，必须由掌握科学知识与组织能力的精英来驾驶。\n这种意识形态在社会契约中强调：公民放弃部分政治参与权，以换取国家通过科技进步带来的生活水平飞跃和绝对的社会安全。它不盲目排外，但极度崇尚实力；它不崇拜领袖个人，但崇拜“系统”的完美。对于技术统御者而言，所有的社会问题——无论是资源分配还是边境纷争——最终都可以通过更优的算法和更强的工业实力来解决。"
  Chiang_Kai_shekism_subtype: "蒋介石主义"
  Chiang_Kai_shekism_subtype_desc: "§g蒋介石主义§!\n\n\n\n\n£GFX_Chiang_Kai_shekism_subtype_bg\n\n\n\n\n蒋介石主义是1926年北伐悲剧性失败后的产物。在领袖殉国的余烬中，由胡宗南、识之律者及其领导的“黄埔中正社”将孙文的温和遗志彻底重塑为一种极端的、带有宗教色彩的战时信仰。它认为北伐的夭折并非由于敌人的强大，而是源于内部意志的涣散与灵魂的杂芜。\n这种主义主张，虽然蒋介石的肉身已死，但其意志已升华为民族永恒的监察者。每一名信徒都必须相信，领袖在幽冥中俯瞰着大地的每一寸忠诚。\n这里没有政治辩论，只有服从；这里没有生活，只有备战。复兴社的特务与宪兵游走在街头，确保每一台机器都在为北伐的黎明而轰鸣。这是一种建立在钢铁、鲜血与绝对纪律之上的“永久训政”。"
  Predatory_Anarchism_subtype: "掠夺性无政府主义"
  Predatory_Anarchism_subtype_desc: "§g掠夺性无政府主义§!\n\n\n\n\n£GFX_anarchist_communism_bg\n\n\n\n\n§L“律法已死，唯有刺刀与旷野是真实的。”§!\n\n掠夺性无政府主义是秩序彻底崩塌后的余烬，一种披着无政府外衣的掠夺性暴力。它不仅解构了国家与政府，更彻底否定了和平契约。在掠夺性无政府主义者的世界里，没有“国民”，只有“幸存者”与“帮派”。\n这种意识形态的核心逻辑在于：既然所有的秩序本质上都是掠夺，那么唯一的公正就是“彻底的掠夺”。他们拒绝建设工厂，转而通过武装流民对邻国进行周期性的血腥劫掠；他们拒绝外交信誉，因为每一份协议都是待拆毁的镣铐。这不是为了建立某种新社会，而是为了在旧世界的尸骸上通过暴力获取最原始的生存优先权。在这种蓝黑色的恐怖笼罩下，文明退化为丛林，每一个据点都是一座匪巢。"


