l_simp_chinese:
 4_focus_1: "离乡甚远"
 4_focus_1_desc: "斯坦利伯爵踏上罗德西亚的土地时，从未想过自己会在此终老。伊菲尔总督的遇刺斩断了卢萨卡与圣杯王国的脐带，伦敦的回音在跨洋电报中逐渐微弱。故乡已是地图上的一枚旧印，而脚下的红土却日益真实。回不去了。那便留下——以圣杯联邦之名，向这片陌生的土地索要一方立足之地。"
 4_focus_2: "旧班底，新航路"
 4_focus_2_desc: "斯坦利伯爵手中既无大军也无金库，她唯一的财产便是那些前殖民地文官与一部尚未生锈的行政机器。与其等待不知何日到来的本土援军，不如即刻启用这批旧班底，重启通向海岸的商路与电报线——让卢萨卡的政令再次流动起来，为这片孤立的内陆领地凿开一条生路。"
 4_focus_3: "残旗续治"
 4_focus_3_desc: "罗德西亚的土地已开始以自身的逻辑生长。残旗之下，续治之路并非忠于故国，而是忠于这片土地上的生灵。伯爵下令取下旗杆上磨损的旧线，以卢萨卡作坊里纺出的棉线重新缝合旗面边缘。针脚粗粝，却更结实。"
 4_focus_4: "吸取教训"
 4_focus_4_desc: "伊菲尔的教训提醒了我们，在发言之前，我们自身要把骨头长结实。"
 4_focus_5: "重审外交政策"
 4_focus_5_desc: "卢萨卡的行政机器开始重新运转，但斯坦利伯爵清楚：联邦的存亡不取决于一纸文书，而取决于它能否在这个被敌意包围的世界中找到自己的位置。罗德西亚的废墟上站起的不止一家政权，每一面旗帜背后都有一道目光正盯着卢萨卡。是拉拢、是威胁、还是观望——在作出任何实质性措施之前，我们首先需要一张完整的外交地图，将每一支势力的底牌摊在桌面上。"
 4_focus_6: "起视四境"
 4_focus_6_desc: "伯爵在总督府会议室里铺开地图时，看到的是一个被四面围堵的孤岛。北方有公司和法西斯的阴影，东部的共产党正忙于推行集体化，西边的杜马在高谈阔论中暗中扩军，而南方的旧总督府仍在观望风向。每一个方向都有一支不欢迎卢萨卡的力量。外交使节的回报与情报员的口述拼凑出一幅并不乐观的全景图——起视四境，敌手环伺。"
 4_focus_9999: "只是调位置"
 4_focus_9999_desc: "4_focus_9999_desc"
 4_focus_7: "拜访加丹加"
 4_focus_7_desc: "加丹加矿区的烟囱从未熄灭，那是一座流动的金库，也是一座武装的孤岛。皇家矿业公司在中立声明背后藏着的是一个简单而残酷的事实——谁拥有矿石，谁就拥有活下来的资格。斯坦利伯爵必须亲自走一趟伊丽莎白维尔。那里驻扎着一群只认利益不认旗帜的旧式殖民商人，他们不会因为一纸委任状就开门相迎，却会对一份体面的分成协议脱下帽子。带上卢萨卡的诚意，或许还能换回一条维持引擎运转的矿石动脉。"
 4_focus_8: "联系总督府"
 4_focus_8_desc: "总督座椅尚且温热，但坐在上面的人已经不在了。罗德西亚总督府的大楼仍在市中心矗立，只是走廊里不再有传令官的脚步声，档案柜里堆满了未被批复的公文，总督印章被锁在一间无人看守的办公室里。谁先握住那枚印章，谁就在法理上拥有了对这片土地的发言权。然而仅仅占据一栋空楼毫无意义——真正的权力来自那些仍愿承认总督府权威的人。伯爵必须赶在其他人之前，将残存的行政脉络重新缝合在这栋建筑之下。"
 4_focus_9: "试探南非"
 4_focus_9_desc: "南非在帝国联邦的旗帜下蛰伏已久，其工业实力与军事储备远非卢萨卡可比。伊菲尔总督在世时曾以圣杯王国的威慑力牵制布尔人的野心，如今这种威慑已经随老总督一同入土。伯爵不清楚比勒陀利亚究竟如何看待罗德西亚的乱局——是趁火打劫的猎物，是尚可交易的邻居，还是不值得浪费子弹的废墟。在南非人主动表态之前，我们必须先伸出触角，试探那片土地的风向。"
 4_focus_10: "紧握旗帜"
 4_focus_10_desc: "比勒陀利亚的答复冷得像冬日的铁轨，总督府的使节空手而归，加丹加人锁上了矿区的铁门，谁都不愿正眼看向卢萨卡。没有同盟，没有贸易协定，没有哪怕一封体面的回信。斯坦利伯爵的档案室里堆满了寄出的外交文书，回执栏里填满了沉默。既然无人愿与联邦握手，那便让世人看清这对空拳里攥着什么。总督的印章已经收入抽屉，旧日的文官也陆续回到办公桌，但这些都不足以替代一个政权自身的灵魂。若一面旗帜只能靠他人的认可才能飘扬，那它终究是挂在他人的衣架上。"
 4_focus_11: "恢复秩序"
 4_focus_11_desc: "现在的卢萨卡就是混乱的代名词。禁令形同虚设，帮派在仓库区的阴影中划定地盘，逃兵在废弃的官邸里过夜，市场上的商贩需要贿赂三伙不同的人才能摆稳自己的摊位。恢复秩序从卢萨卡开始，从每一条街巷开始。"
 4_focus_12: "让工厂运作起来"
 4_focus_12_desc: "伯爵站在旧殖民工厂的铁门前，听见里面传来的是风声而非机器轰鸣。伊菲尔总督去世前，这些车间就已有大半停工——不是因为缺乏原料，而是因为缺乏秩序、缺乏人手、缺乏一个让工人敢来上班的理由。焊机上的灰尘不能铸成子弹，闲置的流水线产不出一块军粮。让这些工厂重新运作起来，我们才有未来可言。"
 4_focus_13: "俯下身段"
 4_focus_13_desc: "伯爵在总督府的窗前往外看时，看到的是另一种沉默。那些在街边兜售木雕的老人、在矿区边缘搭建窝棚的部族劳工、在殖民官员的档案里从未被记下名字的村落头人——他们才是这片土地真正的主人，而联邦在他们眼中或许只是又一个需要忍受的白人政权。殖民时代的那套傲慢已经随着伊菲尔总督的棺材一同入土，斯坦利伯爵比任何人都清楚：没有他们的默许，卢萨卡的政府不过是建在流沙上的堡垒。"
 4_focus_14: "新的议会"
 4_focus_14_desc: "一场真正持久的秩序，需要的不是一个人的决断，而是一群人坐在一起的吵嚷与共识。新的议会不会是圣杯王国议会的翻版，也不会是罗德西亚旧殖民议会的延续——它必须容纳白人殖民官员的行政经验、部落头人的民间权威、以及那些从未拥有过发言权的普通移民。伯爵亲手推开的那扇议事厅大门，比任何一场军事胜利都更能定义圣杯联邦的未来。"
 4_focus_15: "从废墟中崛起"
 4_focus_15_desc: "罗德西亚的废墟上，卢萨卡像一块被重新拼合的瓷片，虽仍有裂痕，但已能盛水。"
 4_focus_16: "寻找旧军队"
 4_focus_16_desc: "罗德西亚并非没有过军队——伊菲尔总督麾下曾有一支由殖民地正规军与当地征召兵混编的武装力量，在两次圣杯战争期间也曾远赴北非作战。但老总督遇刺后，这支部队便如同盐溶于水：一部分溃散为地方武装，一部分被各派势力收编，还有一部分缩在边境哨所里等待一个不知道还会不会到来的命令。斯坦利伯爵需要派人走进丛林、走进大山、走进那些连地图上都不标注的哨站，把这些散落的士兵找回来。"
 4_focus_17: "废除等级制"
 4_focus_17_desc: "旧军队回来了。他们带着磨损的步枪和褪色的勋章回到了卢萨卡，但他们带回的还有旧时代的灵魂——那种白人军官骑马走在前面、兽人士兵扛枪跟在后面的灵魂。斯坦利伯爵在原野上望着这支拼凑起来的部队举行操演时，看见一个兽人上士对一个白人下士行礼，因为肤色而非军衔决定了一个人该向谁低头。他告诉身旁的幕僚：如果联邦的军队延续殖民时代的等级制度，那么联邦就仍然是殖民地的变种——只是换了旗帜，没有换灵魂。废除旧等级制并非要将官阶一扫而空，而是让军衔不再与肤色挂钩、让功勋不再因出身贬值、让每一名士兵都能相信：在这面旗帜下，他可以选择站在他前面的任何人。"
 4_focus_18: "新的队伍"
 4_focus_18_desc: "过去的军队的忠诚性始终存疑，建立一些全新的部队，才能保证联邦的安全。"
 4_focus_19: "以退为进"
 4_focus_19_desc: "联邦新军的旗帜升起来的那天，旧军官们站在操场的阴影里，双手抱在胸前。她们看见原住民士兵穿着和他们一样的制服，看见年轻的兽人少尉在队列前发号施令，看见那些曾经为她们扛枪擦靴的人如今站在同一排接受检阅。“斯坦利伯爵怕是忘了谁才是真正打过仗的人。”公开的抗议被压制后，不满沉入了水面之下，化为敷衍的训练、迟到的报告和暗中观望的态度。伯爵主动后退了一步——将部分训练权交还给资深旧军官，允许他们在新军编制中保留旧番号，甚至邀请其中几位担任新兵的战术顾问。只要她们默认了新军存在，问题便迎刃而解。"
 4_focus_20: "跨越鸿沟"
 4_focus_20_desc: "尽管小摩擦不断，但军队已然趋于稳定，她们将成为联邦的利剑。"
 4_focus_21: "新的目标"
 4_focus_21_desc: "     "
