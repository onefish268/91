l_simp_chinese:
 2_focus_1: "我们的地盘！"
 2_focus_1_desc: "那个”铁手“死了，多年的隐忍终于走到了头。"
 2_focus_2: "巩固地盘"
 2_focus_2_desc: "地盘我们才刚拿到手，我们要着手巩固它。"
 2_focus_3: "找些帮手"
 2_focus_3_desc: "duce当然不是铁人，我们法西斯党人好比种子，人民好比土地，我们要及时从人民中找出帮手。"
 2_focus_three_desc: "duce当然不是铁人，我们法西斯党人好比种子，人民好比土地，我们要及时从人民中找出帮手。"
 2_focus_4: "检视工厂"
 2_focus_4_desc: "工厂可是我们的私有财产，去看看它们。"
 2_focus_5: "号召民众"
 2_focus_5_desc: "真正的铜墙铁壁是什么？是群众，是千百万真心实意地拥护革命的群众。"
 2_focus_6: "政治建军"
 2_focus_6_desc: "兵民是胜利之本。"
 2_focus_7: "制定计划"
 2_focus_7_desc: "就像苏联的五年计划一样，我们也要为我们的工业规划一个短期的“五年计划”。"
 2_focus_8: "利用企业"
 2_focus_8_desc: "城内的企业家们惶恐不已，我们可以答应她们为法西斯党的合作者，但她们也要展现出应有的诚意。"
 2_focus_9: "国有化"
 2_focus_9_desc: "把我们的工厂收回来，那是人民的东西！"
 2_focus_10: "创立经济委员会"
 2_focus_10_desc: "创立直属于法西斯党的国家经济委员会，以监督工人生产并下达指标。"
 2_focus_11: "重组政府"
 2_focus_11_desc: "一切新的东西都是从零到有的。"
 2_focus_12: "敲定方针"
 2_focus_12_desc: "我们不但要提出任务，而且要解决完成任务的方法问题。我们的任务是过河，但是没有桥或没有船就不能过。"
 2_focus_13: "齐头并进"
 2_focus_13_desc: "我们成功团结了企业家们，让我们携手共进！"
 2_focus_1three_desc: "我们成功团结了企业家们，让我们携手共进！"
 2_focus_14: "法团主义"
 2_focus_14_desc: "在收回了资产后，我们将施行duce的设想——法团主义。法团主义是一种协调国家、资本、劳工三方利益的政治经济治理模式，核心逻辑：把社会按行业、职业划分为垄断性行业团体（法团），由国家认可、授权，三方代表协商工资、工时、产业政策，替代自由市场无序博弈与阶级对抗，弱化阶级冲突。这将会把我们团结起来。"
 2_focus_15: "广泛宣传"
 2_focus_15_desc: "我们应当相信群众，我们应当相信党，这是两条根本的原理。"
 2_focus_16: "我们的党！"
 2_focus_16_desc: "法西斯党的路线，就是国家和人民的路线！"
 2_focus_17: "充足准备"
 2_focus_17_desc: "事实证明我们已经完全准备好了，duce，下命令吧！"
 2_focus_18: "民族英雄"
 2_focus_18_desc: "我们需要一个引路人，她毫无疑问是duce。领袖安丘比菲将唤醒民族与生俱来的野性，向全体国民昭示：活一日为雄狮，远胜百年沦为羔羊。在领袖的引领下，整个国家将燃起征服的斗志，以雄狮之姿重塑罗德西亚。"
 2_focus_19: "老伙计们"
 2_focus_19_desc: "把duce的老搭档们统统叫回来，我们这需要她们。"
 2_focus_20: "组建国民冲锋队"
 2_focus_20_desc: "万事开头难，干革命就不要怕困难。"
 2_focus_21: "成立总司令部"
 2_focus_21_desc: "武器是战争的重要的因素，但不是决定的因素，决定的因素是人不是物。"
 2_focus_22: "领袖的褐衫军"
 2_focus_22_desc: "枪杆子里面出政权。"
 2_focus_23: "旧库存"
 2_focus_23_desc: "过去总督府在城里的仓库留下了一批装备，把它们利用起来。"
 2_focus_2three_desc: "过去总督府在城里的仓库留下了一批装备，把它们利用起来。"
 2_focus_24: "我们准备好了！"
 2_focus_24_desc: "任务是艰难的，过程是艰巨的，但我们无所畏惧！"
 2_focus_25: "北上"
 2_focus_25_desc: "    "
 2_focus_26: "南下"
 2_focus_26_desc: "     "
 2_focus_27: "邪教徒们"
 2_focus_27_desc: "这些个邪教徒明显超出了人类的范畴，解决他们。"
 2_focus_28: "宽大政策"
 2_focus_28_desc: "或许她们还有救？"
 2_focus_29: "清洗政策"
 2_focus_29_desc: "这些人看着就恶心，我们不需要他们。"
 2_focus_30: "派出官员"
 2_focus_30_desc: "派出我们的党员干部，彻底掌控这片地区。"
 2_focus_31: "自治区"
 2_focus_31_desc: "只要给她们施加一点小小的“恩惠”，她们就会对我们感恩戴德。"
 2_focus_32: "近在咫尺"
 2_focus_32_desc: "隔壁的老家伙赖在职位上不走，我们来帮她“退休”。"
 2_focus_33: "清理遗产"
 2_focus_33_desc: "老东西是个实践派，把她的“遗产”充公。"
 2_focus_3three_desc: "老东西是个实践派，把她的“遗产”充公。"
 2_focus_34: "替换官员"
 2_focus_34_desc: "把这座城市的人变成我们“自己人”。"
 2_focus_35: "整合"
 2_focus_35_desc: "这是我们新的地盘了。"
 2_focus_36: "胜利"
 2_focus_36_desc: "事实证明，我们正在冉冉升起！"
 2_focus_37: "那个红色巨物"
 2_focus_37_desc: "东方有一个数倍于我的红色巨兽，这让领袖寝食难安，我们要为她去除这块心病。"
 2_focus_38: "分化瓦解"
 2_focus_38_desc: "这么大的东部未必是铁板一块，让我们找找破绽。"
 2_focus_39: "特殊手段"
 2_focus_39_desc: "对于那些反动派，我们的枪有话要说。"
 2_focus_40: "尽入囊中"
 2_focus_40_desc: "这是个好地方，现在，它归我们了！"
 2_focus_41: "打响统一战争"
 2_focus_41_desc: "砸烂旧世界！"
 2_focus_42: "制裁公司"
 2_focus_42_desc: "我们的新家园没有垄断资本家的位置！"
 2_focus_43: "打倒侵略者"
 2_focus_43_desc: "我们的新家园没有侵略者的位置！"
 2_focus_4three_desc: "我们的新家园没有侵略者的位置！"
 2_focus_44: "消灭民主"
 2_focus_44_desc: "我们的新家园没有软弱者的位置！"
 2_focus_45: "回收废品"
 2_focus_45_desc: "我们的新家园没有旧时代的位置！"
 2_focus_46: "光复！"
 2_focus_46_desc: "事实证明，一切反动派都是纸老虎！"
