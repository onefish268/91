 GER_afica.1.t: "德国人的要求"
 GER_afica.1.desc: "德国人在罗德西亚的默许下成立了一个流亡政府，并在索尔兹伯里站稳了脚跟。现在她们要求我们“归还德意志人的固有财产”，我们该怎么办？"
 GER_afica.1.a: "向圣杯那边请示一下。"
 GER_afica.2.t: "来自南非的请求"
 GER_afica.2.desc: "德国人在罗德西亚的默许下成立了一个流亡政府，并在索尔兹伯里站稳了脚跟。现在她们要求我们“归还德意志人的固有财产”，我们该怎么办？"
 GER_afica.2.a: "给她吧，德国仍然具有统战价值。"
 GER_afica.3.t: "结果"
 GER_afica.3.desc: "在前日，我们的军队借道罗德西亚，气势磅礴地进入了三角洲地带，并且没有遭到任何抵抗，显然对于约翰内斯堡来说，索契凯斯比这里重要得多。"
 GER_afica.3.a: "好样的，小伙子们！"