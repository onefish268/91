l_simp_chinese:
 7_focus_1: "一无所有"
 7_focus_1_desc: "曾经的黑色巨鹰，如今蜷缩在非洲高原的角落里。没有首都，没有工厂，没有舰队，没有外交承认——甚至连一面像样的旗帜都只能在旧货箱底翻出。这就是我们现在拥有的一切。但至少，我们还活着。"
 7_focus_2: "德意志，隐忍..."
 7_focus_2_desc: "在这片陌生的土地上，我们依然称自己为德意志人。不是地理意义上的，而是血脉与记忆意义上的。有人哭了，有人沉默，有人朝着北方——那片再也回不去的故土——长久地凝望。我们失去了祖国的土地，但我们没有失去祖国的名字。"
 7_focus_3: "接受援助"
 7_focus_3_desc: "第一批来自卢旺达的物资运抵索尔兹伯里时，卸车的卫兵掀开帆布，看见成袋的玉米粉、成箱的罐头和几摞旧毛毯。领袖的附信只有一句话：“先用着，不够再开口。”"
 7_focus_4: "全权代表戈林"
 7_focus_4_desc: "戈林说服了内阁。“元首现在无法理政，但德意志不能没有舵手。”这位曾经的帝国元帅将在这片异乡的土地上，代理一个没有国土的国家的最高职权。"
 7_focus_5: "全权代表戈培尔"
 7_focus_5_desc: "戈培尔自荐代理元首。她迅速搭建了一个流亡版的宣传部门，用一台手摇式印刷机和一批从本土带出的铅字模，每天印制一份四页的《德意志报》，向仍寄居在非洲各地的德国侨民传递索尔兹伯里的声音。"
 7_focus_6: "副元首希尔主政"
 7_focus_6_desc: "希尔毫无争议地继承了流亡政府的日常管理权。她熟悉党务系统的每一根毛细血管，能在戈林和戈培尔之间保持微妙的平衡，像一台精密运转的节拍器。她每周两次向封闭的莉莎房间报送书面政务简报——从未收到过回复，但她从不间断。"
 7_focus_7: "与当地代表谈判"
 7_focus_7_desc: "我们以自己的技术骨干为筹码，与索尔兹伯里的当地居民社区就临时安置和物资交换达成了初步协议。这是流亡者在异乡换取基本生存条件的务实之举。"
 7_focus_8: "找回自我"
 7_focus_8_desc: "戈培尔博士发现了一个令人振奋的“真相”：经过长期的民族志调查与语言学研究，这片土地上的居民在万年以前曾经属于一个古老的日耳曼分支——他们的语言习俗、民间传说与血脉之中，仍然流淌着与德意志民族同源的远古记忆。政府将发起一场‘寻根运动’，重塑当地人的历史认知，唤醒他们沉睡的灵魂，让索尔兹伯里的居民重新认识自己真正的身份——德意志的远亲，失散万年的兄弟姐妹。"
 7_focus_9: "黑色恐怖"
 7_focus_9_desc: "政府将在管辖区域内建立一套严密的监视与惩戒体系，针对拒绝认同流亡政权管辖、散布反对言论或煽动抗拒行动的当地居民实施公开镇压。我们要让索尔兹伯里街头巷尾的每一个角落都清楚：德意志的秩序不容挑战，任何形式的反抗都将付出不可承受的代价。"
 7_focus_10: "许诺好处"
 7_focus_10_desc: "我们对索尔兹伯里的居民做出郑重承诺：德国的工程技术和产业知识将无偿用于改善当地的基础设施与公共服务，作为交换，流亡政府将获得在这片土地上长期居留的合法身份。德意志人不求土地，只求一个容身之地；而这片土地上的居民，将获得一座由钢铁与精密仪器重建起来的城市。"
 7_focus_11: "精神德意志人"
 7_focus_11_desc: "无论肤色、无论语言、无论血脉——只要认同德意志的价值、忠诚于德意志的旗帜，他便是德意志的一分子。我们将向索尔兹伯里及周边地区的全体居民敞开身份认同的大门，通过语言教育、历史宣讲和价值观浸润，使每一个愿意接受德意志精神的个体都能获得‘精神德意志人’的身份认证。"
 7_focus_12: "没有抵抗者"
 7_focus_12_desc: "没有声音，便是最好的秩序；没有面孔，便是最稳固的统治。敌人无声了，德意志在此地才能安眠。"
 7_focus_13: "旧库存"
 7_focus_13_desc: ""
 7_focus_14: "全盘接手"
 7_focus_14_desc: ""
 7_focus_15: "故土之民"
 7_focus_15_desc: ""
 7_focus_16: "全盘接受"
 7_focus_16_desc: ""
 7_focus_17: "工业遗产"
 7_focus_17_desc: ""
 7_focus_18: "全盘接收"
 7_focus_18_desc: ""
 7_focus_19: "战争准备"
 7_focus_19_desc: "为了让国家充分准备迎接即将到来的战争，我们不仅要确保在国防军内部进行准备，还要在工业和基础设施方面做好准备。"
 7_focus_20: "煽动“苏台德”人"
 7_focus_20_desc: "在历史所导致的种种不公中，索契凯斯“德意志人”的命运可谓最为多舛。不论南非会如何反对，我们都必须将他们置于我们的保护之下。"
 7_focus_21: "索取索斯凯契"
 7_focus_21_desc: "结束不公正时机的时刻到了。卡尔尼奥拉和施蒂利亚——即现在的索契凯斯自治区，必须回归祖国。"
 7_focus_22: "军事成果展示"
 7_focus_22_desc: "我们的历史充满了伟大的军事成就。通过承认我们的部队目前取得的成就将是这些伟大的军事成就中的另一项，我们可以提高士气，进一步增加他们对我们的忠诚。"
 7_focus_23: "重申东方领土主张"
 7_focus_23_desc: "我们将向圣杯王国正式提出租借马达加斯加岛的请求。德意志在海上需要一处临时锚点，，王国应将这座岛屿以租借形式交由德意志管辖四年，用于安置流亡侨民及重建海上补给线，以确保德国能继续对魔导国的战争。"
 7_focus_24: "第一次开普敦仲裁"
 7_focus_24_desc: ""
 7_focus_25: "不可战胜的德意志军队"
 7_focus_25_desc: "我们的军队在战场上取得了众多成就和胜利，经由此我们向世界证明，不管敌人的煽动者怎么说，德意志军队确实是无敌的！"
 7_focus_26: "胜利的意志"
 7_focus_26_desc: "我们终于可以摆脱战败的阴影了。德国的新时代即将到来！"
 7_focus_27: "三角洲的命运"
 7_focus_27_desc: "是时候把“德意志人”的旧土划分给那些能够真正管理好这片土地的人们了。"
 7_focus_28: "利益换取达伽马"
 7_focus_28_desc: "南非人妨碍了我们生存空间计划的实施，不过现在改变我们的长期目标并且寻求他们的友谊还为时不晚。唯一可行的办法就是：以相对应大的利益换取达伽马。"
 7_focus_29: "达伽马或战争"
 7_focus_29_desc: "达伽马曾经是德意志的一部分，达伽马现在是德意志的一部分，达伽马在将来也永远会是德意志的一部分！如果南非不愿交出这块领土，那么我们就必须让德国准备好面对在所难免的战争。达伽马及其周边地区必将重回德意志的手中！"
 7_focus_30: "对圣杯示好"
 7_focus_30_desc: "德意志人和圣杯人都是勤劳而值得敬佩的民族。虽然我们不幸地与其在领土上有一定的纠纷，但现在放弃现有战略并改善两国关系还为时不晚。"
 7_focus_31: "促进民族认同"
 7_focus_31_desc: "我们成功地重新征服了德意志故土，现在可以开始将其重新整合进伟大祖国。当地民众必须被允许为祖国履行他们的爱国义务。"
 7_focus_32: "挑战南美"
 7_focus_32_desc: "我们将永不停息，直到新世界在上帝认为适当的时候，倾尽它全部的力量，踏上支配并羞辱旧世界的征途。"
 7_focus_33: "重新与中国建交"
 7_focus_33_desc: "事实证明，中国已经无法适应欧洲的新秩序。是时候向他们提供只有德国才能给予的保护了。"
 7_focus_34: "加强军队政治化建设"
 7_focus_34_desc: "过去几年里，军队中的失败主义思想变得非常明显。无论如何，必须确保这些思想不再抬头。"
 7_focus_35: "扩大党卫军招募"
 7_focus_35_desc: "加入党卫军的要求非常严格，这个过程被形容为通过针眼。虽然要求必须保持高标准以确保优质部队，但可以通过其他方式扩招，同时不降低我们的标准。"
 7_focus_36: "经济恢复优先"
 7_focus_36_desc: "二次失败几乎毁了我们的经济。我们必须制造拖拉机而不是坦克，分发铲子而不是步枪，优先发展经济而不是扩大军工产业！"
 7_focus_37: "小四年计划"
 7_focus_37_desc: "为助力国家重整军备并最终实现自给自足，我们亟需一个在未来几年内实现的宏伟计划。"
 7_focus_38: "帝国马克改革"
 7_focus_38_desc: "经济复苏的第一步是推行全面的货币改革。"
 7_focus_39: "豁免部分税务"
 7_focus_39_desc: "对我们民众的税收负担逐渐变得越来越沉重，以支付重新武装计划的费用。通过减轻这一负担，我们可能会在短期内失去国家收入，但人们将能够花费更多辛苦赚来的钱。"
 7_focus_40: "住房开发计划"
 7_focus_40_desc: "我们可以通过启动住房开发计划来振兴经济，旨在翻新和创建现代住宅，并设立新的生活标准。"
 7_focus_41: "有限物价管制"
 7_focus_41_desc: "为了支持重新武装实施的价格控制措施正在扼杀经济。适当限制这些措施可能会减少国家资金，但将使人们能够创办新企业并盘活经济。"
 7_focus_42: "工业扩张"
 7_focus_42_desc: "拥有能在国际上竞争并引领新技术的强大工业对我们的持续增长至关重要。"
 7_focus_43: "有限工人权力"
 7_focus_43_desc: "过去几年里，工会发生了根本性的变化，已与过去截然不同。通过改革，我们可以团结工人并从中获益。"
 7_focus_44: "增进贸易"
 7_focus_44_desc: "如果德国人民要繁荣昌盛，我们必须引进我们在自己边界内无法提取或制造的东西。我们必须向外看，与其他国家签订新的贸易协议——当然是有利于我们的协议。"
 7_focus_45: "拉取罗德西亚投资"
 7_focus_45_desc: "罗德西亚是我们最大、最重要的投资商之一。吸引她们投入资源肯定会提高生产力，并改变德国工业。"
 7_focus_46: "农业现代化"
 7_focus_46_desc: "我们的农业部门大多由小规模、家庭经营的农场组成，他们从事大量的体力劳动。我们可以通过引入现代设备并提高每个农场的生产产出来改革整个农业部门。我们的整个国家都将从中受益！"
 7_focus_47: "索尔兹伯里城市化"
 7_focus_47_desc: "农业中现代机械的引入已经释放了许多人力，这些人现在涌向城市寻找新的就业机会。这些人可以在我们的工厂中发挥作用，继续使我们的经济成为世界上最强大的经济之一。"
 7_focus_48: "再造奇迹"
 7_focus_48_desc: "我们所有振兴经济的计划和举措终于取得了成效！世界各地的人们对我们的金融和工业复苏感到敬畏，称之为“经济奇迹”。"
 7_focus_49: "计划生产"
 7_focus_49_desc: "随着我们最近在工业进步方面取得的成就，我们已经学到了很多关于生产方式的知识。我们应该将所有这些新发现的知识和理解应用于精简我们的装配线，并以前所未有的规模生产材料。"
 7_focus_50: "建设国防工业"
 7_focus_50_desc: "在终于能够稳定甚至大幅增强我们的经济之后，我们现在可以将注意力转向保障我们国家的主权并建立一个适当的国防工业，保障德国人民的勤奋精神和对进步及卓越的追求。"
 7_focus_51: "战时特别规划"
 7_focus_51_desc: "战争再次将我们卷入其中，但我们不会屈服，我们不会倒下！我们将动员我们的工业力量，去打到任何敢于认为他们可以压垮德国人民坚不可摧的意志的敌人！"
 7_focus_52: "自给自足的努力"
 7_focus_52_desc: "德国要想真正强大，它必须自给自足。我们必须更好地利用我们的资源，提高我们的建设效率。"
 7_focus_53: "实施价格管制"
 7_focus_53_desc: "我们必须实施各种措施来加强对财政的控制，以支撑我们实现自给自足的雄心壮志。我们必须能够调节进口品、基本商品和工人工资的价格，以抑制通货膨胀并确保经济稳定。"
 7_focus_54: "建立复兴工厂"
 7_focus_54_desc: "我们必须摆脱私人资本家反复无常带来的影响，为此要组建一个由我们控制的工业集团，以监管采掘业和钢铁业的增长。这将成为我国军事工业的支柱。"
 7_focus_55: "资源进口"
 7_focus_55_desc: "我们新盟友的农业产业发达，已经不再需要大力补贴本国农业。廉价进口资源可为我们省钱，也能刺激盟友经济。"
 7_focus_56: "兼并本地工业"
 7_focus_56_desc: "通过将本地工业整合到我们的经济中，我们确保了支持我们战争努力和生产的重要资源。"
 7_focus_57: "资助本钦公司"
 7_focus_57_desc: "曾经有句话说，军队靠胃部行军，但现代军队依赖燃料。为了维持我们的军事能力，我们必须加大合成燃料的生产力度。"
 7_focus_58: "成立布钠工厂"
 7_focus_58_desc: "由于我们没有橡胶资源，而大规模的机械化和航空需要大量橡胶。为了减少对外贸的依赖，我们必须建立工厂生产合成橡胶。"
 7_focus_59: "彻底摆脱困境"
 7_focus_59_desc: "我们终于实现了成为完全自给自足的雄心勃勃的目标！我们的国家已经充满了丰富的资源，这将进一步增强我们的实力——使我们无坚不摧！"
 7_focus_60: "加速军备重整计划"
 7_focus_60_desc: "我们必须打破枷锁，让工业的铁砧锻造祖国的辉煌命运。每一辆生产的坦克，每一架组装的飞机，都将成为德国人民不屈意志的见证。"
 7_focus_61: "集中军备计划"
 7_focus_61_desc: "我们的工业必须支持我们重新武装国家的军事需求。必须启动一项全面的军备重整计划，迅速现代化和扩展我们的武装力量！"
 7_focus_62: "设立生产指标"
 7_focus_62_desc: "在发动任何军事行动之前，我们必须首先让我们的武装力量现代化并配备装备。为了提高产量，我们必须实行限额，并设立雄心勃勃的生产指标。"
 7_focus_63: "成立中央计划局"
 7_focus_63_desc: "战争暴露了我们军备建设的不足，这是我们必须解决的问题！通过成立一个由政府、工业和军方成员组成的中央规划局，我们可以协调经济政策，并有效地重新分配资源，以增强我们的武器生产，支持我们的国家目标和军事霸权。"
 7_focus_64: "武器标准化生产"
 7_focus_64_desc: "我们的生产线几乎跟不上我们武装部队的需求。我们必须实施武器合理化措施，提高我们的工业战争机器的效率和效果。"
 7_focus_65: "创立武装部队供给部"
 7_focus_65_desc: "我们简化武器制造的努力已经取得了成功，但还需要进一步改进！创建一个武装部队供给部将使我们能够制定策略来分配资源和优先考虑项目，以增加我们的武器生产。"
 7_focus_66: "总体战"
 7_focus_66_desc: "为了取得全面胜利，我们必须动员全社会，把全面战争带到敌人家门口。德意志民族是时候起来了，让风暴爆发吧！"
 7_focus_67: "建设帝国高速公路"
 7_focus_67_desc: "自项目始建以来，计划已经取得了巨大的成功。建筑工程极大地减少了失业，而宽敞的公路也成为了纪念帝国经济复苏的丰碑。但即便如此，我们也还有许多工作要做。"
 7_focus_68: "力量来自欢乐汽车"
 7_focus_68_desc: "随着新的德意志建成，我们必须让它装满汽车。为了成为一个真正繁荣和现代化的经济体，我们需要建设工厂来生产这些汽车，同时创造就业机会。"
 7_focus_69: "基础设施再扩建"
 7_focus_69_desc: "将高速公路网络扩展将展示我们国家再次奋斗的决心。这也将使我们在需要时能够更快、更猛烈地发动攻击。"
 7_focus_70: "优化国家劳役"
 7_focus_70_desc: "国家劳役团在保持人口就业方面起到了重要作用，但我们认为它可以发挥更多作用。我们可以善用国家劳役团，以确保在劳动、宣传和战争准备的各个方面最大限度地发挥他们的作用。"
 7_focus_71: "发展贺利氏研究设施"
 7_focus_71_desc: "投资新设施可以确保获得现代军事需求日益增长的贵金属。这些专业材料对于电子设备和高质量武器装备至关重要。"
 7_focus_72: "建设本都港"
 7_focus_72_desc: "我们缺乏一个对外交流的超级港口。修建本都大海港不仅仅是一项工程壮举——它是对未来的投资。这不仅将促进地区的经济发展，还将助力我们的工业努力和生产产出。"
 7_focus_73: "团结实业家"
 7_focus_73_desc: "工业家在我们国家拥有重要的权力。争取他们的支持需要时间投资，但过去已经向我们保证，这笔投资是值得的。"
 7_focus_74: "行动代号：归乡"
 7_focus_74_desc: "我们的目光已经锁定了那片魂牵梦萦的故土。‘归乡’是一项多阶段、跨海陆的复国计划——从索尔兹伯里出发，横跨非洲大陆与地中海，最终在德意志故土的海岸线上重新升起黑鹰旗帜。政府将调动一切可用的资源，评估每一段航线的风险，筹集足够的物资与军火，为有朝一日的反攻做好准备。归乡之路不会平坦，但德意志人从未畏惧过漫长与艰险。"
 7_focus_75: "重建轴心国"
 7_focus_75_desc: "我们将证明轴心国的理念并未随着维也纳的陷落而消亡——它只是等待着一个新的地理坐标上的复苏。"
 7_focus_76: "唤起斗志"
 7_focus_76_desc: "通过集会和宣传，我们试图向每一位流亡者传递一个信念——失去领土只是一时之耻，放弃希望才是真正的灭亡。我们重新讲述德意志的历史荣耀，重振那些曾经支撑帝国崛起的意志力量。同胞们被号召打破对现状的麻木，在精神上重新武装自己。只有当每一个德意志人都重拾斗志，复国的火焰才能从灰烬中燃起。"
 7_focus_77: "所有德意志人，团结起来！"
 7_focus_77_desc: "无论身处何方，无论身份如何，所有拥有德意志血脉或德意志精神的人都应当凝聚在同一面旗帜之下。我们呼吁世界各处的德国侨民、工程师、商人、牧师与农民向索尔兹伯里靠拢，将散落各地的力量汇入复国的共同事业。在这片异乡的土地上，我们不再分彼此！"
 7_focus_78: "关键时刻"
 7_focus_78_desc: "复国大业走到了十字路口。每一座仓库的存粮、每一批抵达的物资、每一条情报线路的稳定，都在影响我们重返故土的时间表。现在不是犹豫的时刻，也不是观望的时刻。流亡政府决定将全部资源向『归乡』计划倾斜，启动跨海运输的筹备工作。成败在此一举，德意志的命运将在未来数月之内被重新书写。"
 7_focus_79: "我们，回家！"
 7_focus_79_desc: "登陆艇的船头刺破海浪，黑鹰旗帜在非洲的晨风中最后一次展开——此后它将迎着欧洲的风重新飘扬。横跨大洋的航程已经结束，德意志流亡者的靴子再次踏上了故国的海岸。故土在脚下沉默，但我们将以枪托与蓝图重新敲响她的脉搏。德意志人，回家了。"
 7_focus_80: "重组最高统帅部"
 7_focus_80_desc: "为了能够执行元首的宏伟计划，必须在内部进行大规模的重组。当前许多领导人将时间花在发表无关痛痒和毫无根据的担忧上，而不是执行元首的命令。只有清除这些人，我们的目标才能实现！"
 7_focus_81: "国防军再重建"
 7_focus_81_desc: "我们必须认识到现代战争的演变性质，并开发一种新的战术，强调步兵与新技术的整合，以最大限度地提高我们在战场上的军事效能。"
 7_focus_82: "大战的历史教训"
 7_focus_82_desc: "我们在大战中的失败提供了对未来冲突至关重要的宝贵见解。我们已经非常详细地研究了过去，现在我们必须落实历史教给我们的教训。"
 7_focus_83: "为英勇者授勋"
 7_focus_83_desc: "我们重新启用了德意志的军事荣誉体系，为那些在战败后的混乱中仍坚守职责、护送流亡政府安全撤离至非洲的军官与士兵授予铁十字勋章和战功奖章。这不仅仅是对过去功绩的追认，更是向所有流亡者传递一个明确的信息：德意志的勇者不会因国土的沦丧而失去荣耀，国家的记忆由他们的名字来延续。授勋，亦是在废墟之中为民族尊严重新奠基。"
 7_focus_84: "德意志特色闪电战"
 7_focus_84_desc: "对于快速突击再重视也不为过。投资摩托车部队将提供关键的机动车辆，协助做出战略决策，提高作战效率。"
 7_focus_85: "祖国空军再重建"
 7_focus_85_desc: "控制不了天空就不可能赢得现代战争。我们必须竭尽全力来发展我国空军！"
 7_focus_86: "航空研究所"
 7_focus_86_desc: "自从大战以来，空战的重要性和复杂性不断增长，我们必须建立航空研究所，开发创新的机身、引擎和武器，以确保空中优势。"
 7_focus_87: "莱茵兰航空队"
 7_focus_87_desc: "我们应该组建一支专门的战斗机部队，以确保制空权。结合严格的训练、先进的战术和尖端的科技，我们将主宰天空，让我们的地面部队如雷霆般碾过战场。"
 7_focus_88: "解决后勤瓶颈"
 7_focus_88_desc: "空军重组完成后，我们可以将注意力转向效率低下的后勤系统和供应链。简化这些问题将解放更多人进行其他活动，并将加快我们飞机的修理速度。"
 7_focus_89: "超级飞机"
 7_focus_89_desc: "我们必须全力以赴，实现掌控天空的雄心壮志，并创造一种远程飞机，能够通过打击敌方领土深处的目标或穿越大西洋，向所有人表明，在我们的打击范围内没有人是安全的。"
 7_focus_90: "公海舰队再重建"
 7_focus_90_desc: "我们必须加倍努力建造一支能够与敌人抗衡的海军。通过部署最先进的造船技术并建造尖端战舰，我们一定能从敌人手中夺回制海权。"
 7_focus_91: "成立海军战争指挥部"
 7_focus_91_desc: "重建海军战争指挥部将使海军命令和直接部署的规划和实施变得高效。"
 7_focus_92: "海上霸权"
 7_focus_92_desc: "我们正顺利成为无可争议的海洋霸主，实现我们的海上霸权愿景。现在德意志帝国统治着波涛！"
