  YSS.1600.t: "来自索维耶特联盟的加盟邀请"
  YSS.1600.d: "索维耶特联盟近日来信，看在我国的社会秩序逐渐恢复，革命思想深入人心，她们认为，现在是一起组建一个强大的联盟的绝佳时机，让非洲的民主国家拧成一股绳，之后的非洲人民便能所向披靡，给予帝国主义最为沉重的打击。"
  YSS.1600.a: "我们联合！"
  YSS.1600.b: "我国仍旧需要一定的时间去适应新秩序……"

  YSS.1601.t: "[FROM.GetName]谢绝了我们的加盟邀请"
  YSS.1601.d: "[FROM.GetName]的同志们委婉推辞了我们的加盟邀请，并用详实的数据与资料证实了本国确实存在一些社会问题需要去解决和适应，因此，她们出于两国共同利益的考虑，选择了暂缓加盟程序。"
  YSS.1601.a: "那我们继续支持你们"

  YSS_AFRICA_UNION: "索维耶特社会主义共和国联盟"

  faction_template_Africa_union: "非洲阵线"

  YSS_officer_support_revoluntion: "来自索维耶特联盟的军官团支持"
  YSS_officer_support_revoluntion_desc: "索维耶特联盟的军官被报告在革命者的队伍当中出现，这些专业军官的存在将大大提高革命者的战斗力。"
  YSS_volunteer_to_other_country: "索维耶特联盟志愿军"
  YSS_volunteer_to_other_country_desc: "为了将让全体非洲人民拥有真正的自由与民主，作为这片大地上红色前哨的我们，应当积极地去输出革命去支持那些仍旧生活在重压下的非洲兄妹们，让可憎的寄生虫和腐朽的蛆虫被清除掉，让鲜艳的赤色染遍非洲的每一寸山河。"
  YSS_the_cooperation_benefit: "合作共赢"
  YSS_the_cooperation_benefit_desc: "索维耶特联盟积极和其他国家开展深度合作、并建设合作伙伴关系，从而促进两国开展更加深刻有效的文化交流、实现更加有效且长远的发展。"