l_simp_chinese: 
  YSS_12: "我们从土地交易中获得的黄金"
  YSS.76.t: "[FROM.GetName]寻求和我们就地区归属权问题进行谈判"
  YSS.76.d: "就在昨日，[FROM.GetName]代表希望我们同她们就[?var:YSS_the_land_we_buy.GetName]地区归属权展开公平谈判，她们认为，这块地在她们历史上是有法理依据可言的，如果可以，她们愿意通过黄金赎回这些祖地。"
  YSS.76.a: "我们在[?var:YSS_the_land_we_buy.GetName]地区确实没有什么太重要的利益。"
  YSS.76.b: "这些人是脑子进水了吗？"

  YSS.77.t: "[FROM.GetName]同意了我们的购置土地谈判！"
  YSS.77.d: "经过了很长一段时间的谈判协商，[FROM.GetName]出于当下本国国情、我国建设情况还有国际形势等多角度评估，认为[?var:YSS_the_land_we_buy.GetName]地区的归属权应当属于我国，就这样，这些土地成功归入联盟的大家庭。"
  YSS.77.a: "这是好消息啊！"

  YSS.78.t: "[FROM.GetName]拒绝了我们的购置土地谈判！"
  YSS.78.d: "经过了很长一段时间的谈判协商，[FROM.GetName]断然否决了我们合理的领土诉求，认为[?var:YSS_the_land_we_buy.GetName]地区当下的归属权是毫无争议的，并表示完全没有兴趣进行接下来的谈判了，我们和[FROM.GetName]的谈判就这么告吹了。"
  YSS.78.a: "有些事情不是能靠嘴皮子获得的……"

  YSS_focus_172: "对于本大洲革命事业的努力"
  YSS_focus_172_desc: "联盟绝不能只是帝国主义汪洋大海中一座孤零零的红色孤岛。作为本大洲唯一的社会主义政权，我们肩负着不可推卸的历史使命。联盟必须主动出击。这不仅是为了保卫我们自身的革命果实，更是为了在整个大洲点燃燎原的星火。"

  YSS_map_support_0: "如果该国家不是§R共产主义§!，且和我们§R不在§!同一阵营，点击显示解放该国家的选项，反之，则显示互助选项。"
  YSS_map_support_1: "点击非洲地图清空刚理刚刚选择的国家。"

  YSS_map_button_text: "[all_button_text_loc]"
  YSS_map_button_text_0: "消耗50£pol_power去给§Y[?var:YSS_chosen_array^0.GetName]§!提供一个每日增长 §Y0.1§! 共产党支持率buff，持续§Y365§!天。"
  YSS_map_button_text_1: "当§Y[?var:YSS_chosen_array^0.GetName]§!爆发内战时，为革命势力提供装备保障。触发事件选择装备的种类和数目。" #
  YSS_map_button_text_2: "派遣军事教官前去§Y[?var:YSS_chosen_array^0.GetName]§!支援，为她们上军事buff。（注意！这个是从我们的将军里随机挑选人来派遣的，可能会把好将领派出去。）"
  YSS_map_button_text_3: "当该国家进入战争时，消耗50£pol_power 获得增加志愿军一个上限的buff。（一个国家一次）"
  YSS_map_button_text_4: "在该国的起义爆发时，为§Y[?var:YSS_chosen_array^0.GetName]§!的起义部队提供§Y2个§!§G军用工厂§!，这些提供的工厂会在开战时从我国扣除，打完§Y胜仗§!后，再返还给我们。(在未开战前，我们可以右键点击按钮减少2个承诺的§G军用工厂§!。 )"
  YSS_map_button_text_5: "消耗100£pol_power 选择一个大洲，然后我们会号召这块大洲上的§R社会主义国家§!为§Y[?var:YSS_chosen_array^0.GetName]§!的起义提供支持。"


  YSS_map_button_text_6: "花费100£pol_power 和 §Y[?var:YSS_chosen_array^0.GetName]§!进行科技交流，跳出事件来选择科研加成卡。（取决于该国家的科研有多发达）"
  YSS_map_button_text_7: "和§Y[?var:YSS_chosen_array^0.GetName]§!展开联合军演，花费100£pol_power 兑换50£army_experience。"
  YSS_map_button_text_8: "消耗150£pol_power 帮助§Y[?var:YSS_chosen_array^0.GetName]§!开展建设或者开矿的工作。会触发事件让我们选择建设类型。"
  YSS_map_button_text_9: "让我们的一些军工机构去§Y[?var:YSS_chosen_array^0.GetName]§!，这会移除我国§Y2个§!§G军用工厂§!给该国家，但是会触发事件让我们的军工机构得到升级的机会。"
  YSS_map_button_text_10: "消耗120£pol_power 来和§Y[?var:YSS_chosen_array^0.GetName]§!签署贸易协定。会为双方提供建设buff。"
  YSS_map_button_text_11: "消耗50£pol_power 邀请§Y[?var:YSS_chosen_array^0.GetName]§!加入我们的联盟。（如果我们§Y之前给她们的援助§!、她们本国的§R共产党支持率§!、§Y社会稳定度§!足够高，她们加入我们的概率也更高。）"

  the_influence_of_YSS: "来自索维耶特联盟的影响"

  a_bit_affection_to_YSS: "对联盟获得§G10单位§!§Y好感§!"
  a_few_affection_to_YSS: "对联盟获得§G20单位§!§Y好感§!"
  a_lot_affection_to_YSS: "对联盟获得§G30单位§!§Y好感§!"

  YSS.1001.t: "来自[FROM.GetName]的信件"
  YSS.1001.d: "[FROM.GetName]的革命同志向我们汇报道，现在，[FROM.GetName]国内的社会主义思想已经有了一定的广泛基础，当地同志们希望联合我们我们国家在现在就发动革命，摆脱殖民者的残暴统治。"
  YSS.1001.a: "万事俱备，只欠东风！"
  YSS.1001.b: "时机未到，继续蛰伏！（继续准备30天）"

