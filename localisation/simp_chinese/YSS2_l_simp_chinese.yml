  YSS.1200.t: "选择向哪块大洲的同志发送电报？"
  YSS.1200.d: "不久前，我们的同志在[FROM.GetName]准备了一场革命，为了不给反动势力反扑的机会，我们现在最好寻找更多的同志来支持我们的事业。"
  YSS.1200.a: "亚洲"
  YSS.1200.b: "欧洲"
  YSS.1200.c: "非洲"
  YSS.1200.e: "北美洲"
  YSS.1200.f: "南美洲"
  YSS.1200.g: "大洋洲"
  YSS.1200.h: "算了……"
  YSS.1202.t: "来自[FROM.GetName]的求助信"
  YSS.1202.d: "不久前，[FROM.GetName]国内的革命势力奋起反抗国内的反动势力，当地的革命代表通过电报向我们寻求帮助，这是我们支援革命的一次绝佳的机会。"
  YSS.1202.a: "我们要为她们提供力所能及的帮助！"
  YSS.1202.b: "算了,我们没有兴趣。"

  YSS.1300.t: "选择我们合作的科研项目"
  YSS.1300.d: "不久前，我们和[FROM.GetName]的同志们准备共同开展一次科研合作。现在，让我们确定我们的科研方向。"
