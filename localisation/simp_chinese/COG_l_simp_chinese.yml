  COG_situation_of_country_title: "魔界溪谷内部情况"
  COG_mine_expansion_of_ratkin_0: "吱吱大矿山的进一步投资"
  COG_mine_expansion_of_ratkin_0_desc: "吱吱大矿山的建设由来已久，这是魔界溪谷为数不多的现有矿场。如果对其进行进一步的扩建，这其中增产的钢铁，将能很大程度上够满足魔界溪谷的前期工业发展的需要。"
  COG_mine_expansion_of_ratkin_1: "在万穗王庭旧区的钨矿开发"
  COG_mine_expansion_of_ratkin_1_desc: "在萌螈们的批准下，同铁路一同进入万穗王庭的还有一些勘探队，她们通过仪器测试和经验推理，判断此处定然埋藏了一处关于钨矿的大矿脉，只要能够开采，就会有成吨成吨的钨矿从这里的矿场运出。只不过，在这里开发，难的不仅仅是天气和地形，还有萌螈们的疑虑，只有打消她们的疑虑才有助于我们顺利地推进矿产开发。"
  COG_mine_expansion_of_ratkin_2: "龙憩之地东南方向的锰矿"
  COG_mine_expansion_of_ratkin_2_desc: "不可思议！那群荧光森林深处埋藏着一处充满锰矿的宝藏，只要稍作开发，就会有取之不尽用之不竭的锰矿装上货箱，运往世界各地销售了，唯一比较麻烦的点是…这个荧光森林早些年就被魅魔大人禁止涉足了，贸然进去开发，也许会招惹意想不到的灾难。也许，可以试着说服总督大人？"
  COG_mine_expansion_of_ratkin_3: "龙憩之地沿海的石油"
  COG_mine_expansion_of_ratkin_3_desc: "根据勘测的结果，丰富的石油储藏大致沿着龙憩之地狭长的海岸线分布，只要进行适当的开发，想必就会有源源不断的石油从地里喷涌而出，带来可观的收益并提高魔界溪谷发展的潜力。龙娘们不住海边，应该不会打扰到她们。"
  COG_mine_expansion_of_ratkin_4: "零零散散的铬矿"
  COG_mine_expansion_of_ratkin_4_desc: "南非的铬矿几乎垄断了世界的铬矿市场，因此，没有太多人有意愿来魔界溪谷开发当地的品质较差的伴生铬矿——它们分布在万穗王庭南区与幻梦界的交界处、还有万穗王庭旧区、以及其他地方，太过分散了。如果是追求极致的发展，那我们大概率是用不上的，但是，谁知道我们明天会不会还从南方的邻居们那里进口铬矿呢？"



