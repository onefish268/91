  COG_Mima: "魅魔"
  COG_Mima_desc: "若是百年前认识魅魔的人，断然认不出如今这个窝在总督府里打哈欠的家伙，就是当年那个为了追寻强者、不惜颠覆国度的“恶灵”。魅魔在“伟大战争”期间应魔理沙之邀前往中非，名义上就任殖民总督。在指挥部队击败了德国殖民武装后，她做的第一件事，就是把荧光森林划为“禁入区”——理由是“魔法研究需要安静”——然后才漫不经心地在旁边画了个圈，算是“殖民地”的建设圈。初来乍到时，魅魔倒也对这片陌生的土地有几分好奇，偶尔会走一走、看一看，听听部族领袖们汇报些什么，甚至饶有兴致地逛逛几回鼠族的市集、见识见识绮罗的手工、了解萌螈的螈气。但新鲜感褪去得比想象中更快——重复的文书、繁重的政事、以及这片土地上根本没有值得她出手的强者，很快就让她彻底失去了兴趣。她开始从这些充满官僚风气的事务中脱离，时不时去研究魔法，或者是找些乐子，来填补内心的空虚和烦躁。\n在“伟大战争”结束后的岁月里，魅魔在殖民地的建设上几乎停滞了，不是她醉心于贪污敛财，也不是想要奢侈享受，而是殖民的工作实在是让她提不起半点兴致，于是她干脆把这些无聊的事务丢到一边，转而研究那些真正吸引她的东西——荧光森林里的魔法脉动、源翠石的神秘波动，或者干脆溜出去吓唬鼠族姑娘、把看不顺眼的官员变成青蛙。“这些才算惬意。”她这样对自己自嘲道。"

  #开朗有人情味：虽是恶灵（并不自认是恶灵）却让人恨不起来，个性开朗，有人情味。自信甚至自负：对自己的战斗能力非常有信心。比人类更像人类：官方设定反复强调“其性格比起人类还像人类”，处事态度轻松愉快。善于演戏：被评价为旧作时期数一数二的“演员”。性格难以捉摸：ZUN曾吐槽“这个角色的性格还真是有些让人搞不懂啊”（大雾）。
  #作祟神：曾经是给人带来灾祸的可怕存在，后来被供奉起来，变成一种“你不敬我就降灾，你若敬我就保佑”的神。
  #恶灵：怀着强烈怨恨等负面情绪死去、死后仍留在世间作祟的亡灵。

