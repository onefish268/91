  COG_categories: "协调起魔界溪谷的大家"
  COG_race_of_country_title: "魔界溪谷各部族的情况简述"
  COG_race_of_country_introduction: "鼠族领主们：这些鼠鼠小领主们是破碎的铁鼠王国下真正的统治阶层，她们大多贪得无厌，还对权力爱不释手，只要利益分配到位，也许拉拢她们不是什么坏事。\n\n鼠族旅商们：这些不受领主们控制的旅鼠们在魔界溪谷的各处都建立了她们的旅邦，她们将各地的资源流动起来，并给自己赚多多的钱，她们会抓住各种发财的机会。\n\n萌螈修士们：那些居住在雨林深处的萌螈修士总是介意其他外族人打扰她们的生活，因此和她们打交道并不是一件特别简单的事情，又因为她们历史遗留问题，她们在魔法和外族的问题上比较敏感。\n\n绮罗们：这些小家伙们特别擅长学习她人，即便是曾经作为殖民者伤害她们的敌人，她们希望将魔界溪谷落后的面貌一扫而空，因此，她们会对于发展的建议表示赞同。\n\n龙娘们：她们今天要吃什么呢…"

