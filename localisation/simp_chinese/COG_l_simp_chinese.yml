  Glowforest: "荧光森林"
  Glowforest_desc: "在源翠石影响下，真菌群落和树木生长变得巨大化，奇异化，它们依靠源翠石赋予的魔力肆意生长。后来高耸入云的巨型树木与蘑菇形成密不透风的天篷，将光线永远挡在外面。这片森林并非黑暗的荒漠：真菌群落散发出的幽幽荧光，与潮湿的空气中晕染开来的迷雾，把整片森林变成一座亦真亦幻的天地。这片土地既美丽得令人屏息，又奇幻得令人不敢深入"
  
