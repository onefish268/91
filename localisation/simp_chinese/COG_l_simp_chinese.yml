  COG_Kuangyeya: "旷野牙"
  COG_Kuangyeya_desc: "旷野牙作为鼠族里少有的牧师，她的职责就是站在讲台前，手持鼠族圣经，用她灵巧的口才，将圣经里那些哲理和故事讲给人们听，她总是能将一只只陷入迷茫之中的可怜鼠鼠拉入正轨，她还会积极号召大家募捐来帮助穷苦民众，因此，她在鼠族当中备受尊敬，即使在别的部族当中也享有一定的赞誉。魅魔有一次去听讲旷野牙的演讲时，对她细细的嗓音很有印象，虽然叽里呱啦听不懂讲什么，她在任命宣传部长的时候，还是写下了“旷野牙”的字样。"
  COG_Kuangyeya_basic: "称职的牧师"

  COG_Youziyin: "游子吟"
  COG_Youziyin_desc: "游子吟是一个走遍天下的萌螈行商，总是喜欢跟随各种商队去往各种不同地方，去见识异域风情与文化、写一些笔记，顺便做一些贸易。相比于憨态可掬的鼠族和健谈的绮罗，游子吟更倾向于向人家展现自己的压迫感和力量，在她头上戴着的赤色角箍就是她为自己增加勇气的头饰，她还能随时让自己洁白的皮肤变得红艳艳的（其实是红温了），进而“威慑”其他部族（至少她自己这么认为的），打消她们坑蒙拐骗、讨价还价的欲望。当然，如果她修行过螈力的话，她其实就没必要通过这种方式去威慑其他人，因此她只能一天天憋个潮红的脸去和人家交流生意，虽然在别人看来这其实是一种妖媚的表现……魅魔在接见这些行商时，没能看见矮小的旅鼠，没有把目光放在那些大眼睛的绮罗身上，而是被她那立得高高的角箍吸引了注意力，因此，魅魔任命她为商务部长，毕竟她就是干商贾的事情嘛。"
  COG_Youziyin_basic: "周游各地的旅商"

  #红温螈可爱捏

  COG_Dragon_girl: "聪明龙娘"
  COG_Dragon_girl_desc: "她是龙娘里最聪明的家伙，比起其他龙娘空荡荡的脑袋，她居然能够理解两位数以内的加减法！也许这样的“成就”在其他人眼里十分地搞笑，但是对于龙娘部族来说，这是意义重大的。\n这是魅魔有一次在龙娘聚集地闲逛时经历的：魅魔在视察这些龙娘日常生活时，她发现了一个龙娘正蹲在地上对着一堆石头沉思着，发现她似乎在有目的地挪动这些小石头，似乎是在记录自己今天吃了多少肉和多少草，自己刚刚好像吃了三口草？放上三个石头，吃了一口肉？在另一边放上一块石头。就这样，她通过观察石头，大概知道了自己一天要捕获多少猎物，要采摘多少野草，而不是像其他龙娘一样肚子饿了就出去觅食，一天出去转两三圈。\n“小家伙，你要出去看看外面的世界吗？”魅魔漂浮在她面前，向她邀请道。\n“世界？”\n龙娘其实不太能理解这个事物，不过，眼前的人邀请自己了，要不就答应吧？于是，她便和魅魔一起走了。魅魔问她叫什么名字，她没有回应，魅魔只好干脆地称其为“聪明龙娘”，并给她委任了教育部长一职，当然，不是让她去教育别人，是让她在外面接受教育，去学习聚集区外的各种事物。"
  COG_Dragon_girl_basic: "涉世未深的孩童"

  COG_Kangnaixin: "康乃馨"
  COG_Kangnaixin_desc: "康乃馨从小对未知事物抱有极大的热情，她是那个时代少见的接受良好教育、又了解过欧洲文明下的社会是如何运行的原住民。她的家庭并没有随着信使的警告而撤走——她们住得太远了，就在几内亚湾，逃跑是来不及的。然而，殖民者并没有为难她们，作为比其他种族聪明伶俐又不在这些地方上占多数的绮罗，她们是殖民者制造部族矛盾、转移矛盾的最佳人选，她们一家得以被殖民者“善待”，并成为了殖民地的官员，在一次偶然机会下，作为在官员家庭里长大的康乃馨被幸运地派遣到欧洲地区，去学习和接受宗主国对她的“教化”，然而善良的她反而被那些更加“危险”的思想——自由民主打动了，在回到镇上之后，她开始号召人们去接触和学习那些殖民者的科技与思想，遭到逮捕。魅魔管理殖民地后，康乃馨便返回了遥远的隐居乡——某种意义上离她而去的故乡，在那里，她成为了一名镇长，还投身于科技研发的道路，积极引入和学习欧洲先进科技，甚至仿制出具有本族特色的设备。魅魔对于这个绮罗有些印象，因为她总是三番五次拜访上门，希望魅魔能够帮她从宗主国那里采购各种各样的器械设备，魅魔也是一一允诺了。现在，魅魔想要找一个外交部长，她对康乃馨的友好态度有印象，于是选了她作为“外交部长”。"
  COG_Kangnaixin_basic: "善谈的镇长"

  #蕾米莉亚究竟卧薪尝胆了多深？希腊奶（）干脆不提了

  COG_Nailaojiao: "奶酪窖"
  COG_Nailaojiao_desc: "奶酪窖出生在一个井下劳工家庭，七八岁时被附近教会学校的牧师注意到，因为能说一点英语，便免学费让她旁听。读了不到三年，家人在矿井事故中受伤瘫痪，她被迫辍学，顶替家人的位置下井。兽族劳工的工资微薄，鼠族的身份更让她拿到的只有其他种族的一半。但她从未因此低头——下井时吃苦耐劳，升井后乐于助人，从不避讳替工友出头，逐渐在矿工群体中积累了信任。她多次组织示威游行，向矿场主和工会提出改善待遇的要求，也因此在矿场档案中被标记为“不稳定分子”，被调往最深、最潮湿、事故率最高的矿层。矿井深处的工作没有让她沉默，反而让她在黑暗中看清了更多。当矿场因大萧条大规模裁员、减薪、停工时，她站了出来，带领工友占领了矿场办公室，打开了军火库，点燃了罗德西亚矿区的第一把火。"
  COG_Nailaojiao_basic: "革命领袖"

