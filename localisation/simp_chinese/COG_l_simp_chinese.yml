  COG_start_game_text: "§P中非大冒险§!"

  COG_route_guide_desc: "§P魔界溪谷§!领地目前线路单一、简陋，只有§G魅魔§!带领§P中非§!各族人民奋力反抗§t黑暗超凡智能§!的线路。（PS：想要最大程度体验§P中非§!地区的剧情可以前往宗主国§C法国§!接受来自§P中非§!的事件，了解§G魅魔§!对宗主国的态度，去往§Y罗德西亚§!地区了解§t黑暗超凡智能§!这些虚空力量的来历。虽然那里的内容也不多……）"

  COG_his_page_01_title: "§P生生不息的大地§!"

  COG_Country_History_Page_01: "在§Y撒哈拉沙漠§!的南缘、§Y东非大裂谷§!的西侧与§Y大西洋几内亚湾§!之间，§Y刚果盆地§!（§G魅魔§!改名为§P魔界溪谷§!）及其周围的高原、山地、雨林与沼泽构成了一个巨大而封闭的名为§R中部非洲§!的地理核心，这片被雨林、河流与高原围合的土地，是§Y非洲大陆§!上最潮湿、最封闭也最具原始生命力的地理心脏。在很长的一段时间里，人类文明对于§Y撒哈拉以南的非洲§!，包括§R中非地区§!在内，开发是极其缓慢的。相比于世界上其他地区，这里炎热的天气与充足的阳光提供了丰富的热量，也给予了植物充足的养分，它们相比于温带植物兄弟姐妹们往往更不乐意结出丰硕的果实，因为这里的植物没有靠种子避寒的必要，因而当地的植物缺乏自然选择的压力去向结果的方向演化，从而导致缺少可供人类驯服的作物去发展农业，草原和雨林的野兽更加多样、狂野、危险，驯化它们简直难如登天，潮湿的环境也滋生出更多的蚊虫病害，从而使得疾病和虫害在此更加致命、无孔不入，以上种种因素夹杂在一起，共同把§R中部非洲§!变成了一个令人望而却步的生态地狱。\n当然，生命自会寻找出路，一部分人类在长年累月的演化中，逐渐结合上了其他动物的特征，从而更好地适应当地的环境和生活，这些携带野兽特征外貌的人类，通常被非洲之外的人们称为§S兽族§!，在漫长的时间长河里，这些在非洲世世代代繁衍的兽族不断往四周迁徙、适应和生活，最终在古典时代成为了§Y撒哈拉以南非洲§!大地的主人。"

  COG_his_page_02_title: "§O殖民前的岁月§!"

  COG_Country_History_Page_02: "第一个在§R中部非洲§!大显身手的部族是§S鼠族§!，这些鼠族先是在§Y埃塞俄比亚高原§!发迹，并在千百年来持续着她们征服§R中部非洲§!的伟大进程。想要在险恶的§R中非§!大地上生存不是一件易事，放荡不羁的野兽和难以驯服的植物总是阻碍着当地的农业发展，扼杀了数不尽的文明摇篮在这片沉默的大地上。而鼠族们则不断尝试着开山伐林、驯养野兽与作物，鼠族巨大的毅力，不断推进着她们征服了一片又一片荒野，建设起一个又一个小部落，在生存环境的影响下，鼠族逐渐成为了极其擅长农作、开凿、建设的勤劳民族，改天换地的壮举在她们的历史上反复出现着，同时，因为各种工程都需要很多人手的缘故，鼠族往往倾向于多生、早生，这样的观念和生物特性使得她们的人口无论在什么时代都是远超其他兽族的，因此她们的人口在这片大地上呈现了断崖式的领先。当然，鼠族广布在§R中非§!大地上也让鼠族在不同的环境下演化出了不同的亚种，其中包括：原始鼠族、旅鼠族、雪鼠族等等亚种，这些亚种也反映了鼠族顽强的环境适应力与基因的多样性和可塑性。\n随之崛起的§S萌螈§!是在§Y乞力马扎罗山§!地区的各种高原气候地区诞生的，这里湿润、温和的气候使得人类向着结合蝾螈特征的方向进化，新形成的部族——萌螈获得了一个强大的优势，她们极度适应潮湿的特性允许她们在不开垦丛林的情况下，便可深入雨林腹地探索和居住，极其强大的自愈能力也确保了她们不会轻易因为一个伤口、一处动物的叮咬轻易发炎化脓、以至于染病身亡。迁入雨林的萌螈族很快适应了雨林虽然炎热但是恒定的气温，终日湿润的条件和多雨的气候阻挡了其他部族的扩张脚步，却成为萌螈得以“霸占”雨林的巨大优势。这些早早迁入的萌螈也同样发现了雨林深处的奇观——§P荧光森林§!，原本繁茂的丛林在§Y源翠石§!影响下，变得更加壮观、宏大，这些树木在大地上搭建起了黑暗的天穹，被源翠石同样影响的真菌群落贪婪地汲取魔力的养分，变成了一个又一个闪烁的“挂灯”，它们满满当当地排列在树干上、树枝上、土地上，让这片黑暗的穹顶也照耀出了自己的星空景观。同时，她们还在这些森林的边陲地带发现了能够进行光合作用的§P叶羊§!，魔法的干扰使得植物的叶绿体产生了变异，叶羊以摄入植物为生，而其中变异的叶绿体和相关的基因被叶羊完整地保留了下来，并在漫长的岁月里整合入了叶羊自己的DNA，它们在空旷的地方向烈日展开它们布满叶绿体的皮壳接收阳光，然后再通过光合作用供给自身成长，有时还能结出美味的叶羊凝胶。萌螈族们被这些魔力吸引了，便对其中蕴含的能量展开了漫长的研究。在长期的研究下，这些萌螈开发出了建立在魔力上的科技树，并演化出了许多自己独特的文化，然而，过于注重魔法的投资也让她们在世俗的研究上落下许多，并滋长了萌螈恃强的社会风气，那些没有天赋或是资产平平的萌螈，往往没有机会修炼§P螈气§!，而不少萌螈往往在王朝与王庭内因为战乱或者灾害沦为奴隶。\n憨厚可爱的§S绮罗一族§!，在鼠族与萌螈入主之后也来到了这片大地，绮罗们通常进驻到那一片片被鼠族开发殆尽后遗弃的土地上，因为很少与她族竞争和战争，绮罗往往着眼于改良和改善当下能够掌控的资源，用她们的聪明才智为自己的生存探索出路，她们运用她们古老的办法尝试将土壤的肥力提高，让贫瘠的土地上总是能结出她们带来的各种种子，同时，绮罗一族在手工上的造诣远远胜过其他部族，她们能用最简陋的资源改造成顶用的工具，用自己丰富的艺术细胞创造出振奋人心的作品。在适应热带生活方面，她们还通过猫薄荷种植制造各种香水驱蚊和草药治病，在绮罗对外方面，她们通常表现得温顺和善，不会尝试去主动进攻其他部族，总是会尝试通过构建贸易关系和其他合作关系来共同发展与生存，当然，如果敌人向她们亮出獠牙，绮罗一族也会进行顽强斗争，特别是在各种特殊环境里，她们往往能凭借她们灵敏的感觉和聪明才智占尽先机，打得敌人措手不及。绮罗内部也具有十分强大的凝聚力，从古至今，都有那么一个职位——§P信使§!支撑起各个村落之间的通讯，共同协调着绮罗群体的重大行动，当有巨大的灾难和威胁降临，她们会共同搬迁、撤离，当有外交关系改变，信使也会尽快地在各个村落之间快速传递这些信息。而在地方上，乡长和镇长作为地方的决策领导去发展和指挥乡镇，并通过信使网络来统一绮罗一族的步伐。\n§S龙族§!的诞生则显得扑朔迷离，因为她们从始至终都没有自己的文明和村落，更没有多少文字去记录她们自己的历史，她们的过往往往只能通过其他部族的史书来反映，从而推断她们大致是哪个时间段和哪个地方出现的。龙娘的外貌十分特别，她们长着健壮的龙角，身体被结实的鳞片覆盖，宽大的尾巴拖在其后。有人记载：长期以来，龙娘都是过着漂泊不定，逐水草和野兽而居的生活。当她们在大地上遇到兽群时，她们会使用超乎寻常的力量将这些凶狠的野兽打得落荒而逃，然后享受起空旷的草原以及上面丰盛的野草，即使她们在与猛兽的战斗中受了伤，她们坚硬的鳞片与皮毛也能极大地减弱受伤的冲击，并凭借强大的恢复能力快速回复自己的状态。其他部族最初看到这些“野人”时，会被她们漂亮的外貌所吸引，当她们想接触这些美丽的生物时，却发现这些家伙连最基本的沟通都无法做到，只会用她们湛蓝的眼睛，并用最天真的神情盯着其他人。很快，有些人便对这些龙娘图谋不轨，开始尝试猎杀、捕获她们，并掠夺她们的一切，当然，在古典时期，其他部族所具备的武器和力量往往不能轻易致这些龙娘于死地，通常数十人对龙娘的围猎最后会演变成龙娘疯狂地反击和报复。"

  COG_his_page_03_title: "§R中非的大变天§!"

  COG_Country_History_Page_03: "随着欧洲的“§Y地理大发现§!”拉开序幕，§R中部非洲§!的故事不再局限于本地人的书写，以§C葡萄牙§!为首的殖民者开始先后造访这片神奇又带点所谓“落后与愚昧”的土地。刚开始，这些殖民者会与当地部族进行交易活动，一些小商站开始建立在海边，但在这之后，随着殖民者的野心越来越大，她们不再满足于单纯的平等贸易的蝇头小利，她们开始积极干涉当地部族的事务，不断地把当地搅和得鸡飞狗跳，然后从混乱中趁机攫取大量殖民利益。数量众多的§S鼠族§!内部有各种大大小小的国家零零散散地分布在这片宽阔的土地上，而且这些国家内部也普遍存在派系林立的现象，更不要说鼠族这一大群体还有数目不少的亚种区分，§C葡萄牙§!便开始利用这些国家内部与外部矛盾，积极地教唆这些国家征伐、内乱，从而削弱当地部族的国家势力，然后趁机出来敲诈和捞取利益。\n在十七世纪时，已经有一些§P中非§!沿海地区被殖民者占领并筑起据点和要塞。\n在十九世纪中后期，殖民者们开展了对非洲系统性的占领，曾经作为天堑的雨林、布满在刚果河（§G魅魔§!改名为§P魔界河§!）上的那些湍急的瀑布和令人闻风丧胆的瘴气与蚊虫鸟兽，在殖民者通过绕路、奎宁和火枪的使用下，终于化解，越来越多的探险家充当殖民帝国的急先锋，通过“§Y地理勘测§!”“§Y探索§!”“§Y收买部落§!”“§Y签署条约§!”等手段，将这片广阔的土地纳入到殖民国家的统治秩序之下。随着§O红魔馆§!雇佣的探险家——§Y亨利·莫顿·斯坦莉§!在1877年完成了从刚果河上游到出海口的全程航行，刚果河流过的广大土地——§Y刚果盆地§!被纳入§O红魔馆§!的殖民范围，并且这一片土地随着§Y柏林会议§!的决定，其归属被进一步确认是属于§O红魔馆§!的。\n虽然这块殖民地在名义上是属于§O红魔馆§!的，但是§O红魔馆§!作为§g德国§!的傀儡国，其在殖民地的相关部署或多或少地被§g德国§!影响，比如采纳§g德国§!的管理办法，殖民地的资源优先服务于§g德国§!。在“§t伟大战争§!”之前，§R中部非洲§!的治理呈现了“科学化管理与极端暴力”并存的双重样貌，对于勤劳的§S鼠族§!，其被视作理想的劳动力而被全力压榨，对于掌握着神秘“§P螈力§!”、不利于统治的§S萌螈§!一族，殖民者则展开了系统性的大屠杀和禁令限制，对于§S龙族§!，她们则囚禁了这些晃荡在荒野的美丽生物，并用残酷的集中营专心培养这些哪哪都是宝的“动物”，而大部分的§S绮罗一族§!都随着殖民者的扩张而退入了深山老林之中。待到“§t伟大战争§!”爆发时，§O红魔馆§!宣布反抗§g德国§!的暴政，殖民地中忠诚于§O红魔馆§!的实力很快响应，并接受了§C幻想乡§!派遣的领导——§G魅魔§!的统领，§G魅魔§!一来到殖民地，便很快与当地的忠诚势力与起义武装消灭了§g德国§!的殖民势力，并马上着手她在殖民地的建设工作。"

