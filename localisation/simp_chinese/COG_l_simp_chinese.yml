  thunderclap_spirit_vein: "雷霆灵脉"
  thunderclap_spirit_vein_desc: "萌螈族借助独特秘籍，将雷霆灵力引导入脉络，举手投足间隐隐有雷鸣之声。雷霆之气贯通全身，攻势刚猛迅捷。\n由于体内螈气已与雷霆同化，无法再修习其他灵脉之法。"
  primal_source_spirit_vein: "源流灵脉"
  primal_source_spirit_vein_desc: "萌螈族借助独特秘籍，追溯灵力之源头，将源流之气引入脉络。此气绵绵不绝，底蕴深厚，为万法之根基。\n由于体内螈气已与源流同化，无法再修习其他灵脉之法。"
  hundred_flowers_spirit_vein: "百花灵脉"
  hundred_flowers_spirit_vein_desc: "萌螈族借助独特秘籍，将百花灵力滋养于脉络之中。灵力如百花绽放，生生不息，招式间暗藏草木生机。\n由于体内螈气已与百花同化，无法再修习其他灵脉之法。"
  scorching_blaze_spirit_vein: "灼炎灵脉"
  scorching_blaze_spirit_vein_desc: "萌螈族借助独特秘籍，将灼炎灵力熔炼入脉络。灵力炽烈如火，一经催动便如烈焰焚天，霸道无匹。\n由于体内螈气已与灼炎同化，无法再修习其他灵脉之法。"
  bedrock_spirit_vein: "磐岩灵脉"
  bedrock_spirit_vein_desc: "萌螈族借助独特秘籍，将磐岩灵力沉淀于脉络之中。灵力沉稳厚重，坚不可摧，守御之时稳如泰山。\n由于体内螈气已与磐岩同化，无法再修习其他灵脉之法。"

