  COG_focus_tree: "国策名字"

  COG_Mima_has_awared: "§G魅魔§!不打算像以前那样怠政了！"

  COG_Prepare_new_year: "新的一年"
  COG_Prepare_new_year_desc: "魅魔又开始思考着自己今年还能整点什么事情出来，不过，在那之前，先给远在千里的徒弟——魔理沙写一封信过去。她想了想，从桌上随手拿起一张皱巴巴的纸——可能是之前某个殖民官员交上来的无聊报告。她翻到背面，用笔草草划了几个字，便轻轻一口气一吹，小纸化作一只纸鹤飞入漆黑的夜空中。"
  COG_Prepare_new_year_tip: "该国策将会给魔理沙寄出一封信件"

  COG_Inspect_local_areas: "视察地方"
  COG_Inspect_local_areas_desc: "作为总督的魅魔自然是有必要了解清楚殖民地的状况，不过比起派遣手下去收集并向她汇报情况，她更希望自己亲自出去转转。去了解各个部族的现状，从而为相关的经济建设和政策制定做好准备。当然，视察也只是借口，魅魔只是想找个理由离开那间让她打哈欠的办公室。"
  COG_Inspect_local_areas_tip: "该国策会触发一系列魅魔视察各个部族的事件"

  COG_Check_forest: "检查荧光森林"
  COG_Check_forest_desc: "魅魔的视察地方工作圆满完成了，她打算在返回魔灵殿的路上，顺路去检查一下那片神秘的土地——荧光森林吧，那里面产生的魔法波动，总是令她着迷，她希望未来的一天能够研究透这片土地的秘密。"

  COG_Small_change: "世界的小变化"
  COG_Small_change_desc: "魅魔感受到了一丝微小的波动从办公室外的传来，看起来，有官员要给她看看最近发生了什么“大事情”，不过，魅魔八成会把它们当成小变化而不足挂齿的，垃圾桶里那层层堆叠的报告就是最好的诠释。"

  COG_Resolve_pressure: "应对宗主国的压力"
  COG_Resolve_pressure_desc: "面对宗主国吸血殖民地的紧急措施，魅魔通过各种方法和措施拖沓推诿着，不过殖民地被剥削的命运是不可避免的，但是相比于北非的那些同行们，魅魔对于条约的执行使得紧急措施对于殖民地的打击来讲轻了许多。"

  COG_Buy_product: "买入宗主国的囤积货物"
  COG_Buy_product_desc: "幻想乡的工业品、农产品在大萧条之后陷入了滞销，为了解决商品堆积的问题，我们必须硬着头皮为宗主国消化其中的一部分，虽然大部分滞销的商品我们殖民地不是很需要甚至我们也盛产，但其中还是有不少的工业品对于我们落后的殖民地大有裨益，也许……绮罗一族会很中意这些工业设备。"

  COG_Allow_labor: "允许劳工转移"
  COG_Allow_labor_desc: "许多幻想乡的倒霉蛋在大萧条之后失去了她们的工作，不过，我们殖民地当然有足够的资源和空间来容纳这些失落的灵魂，让她们跨越大海，来到这片素未相识的土地重拾对生活的希望。"

  COG_More_tax: "上缴更多的财政收入"
  COG_More_tax_desc: "宗主国遇到了一些急需流动资金的项目工程，完成这些项目，宗主国找上了我们殖民地，希望我们不但同意削减部分的对殖民地拨款，还要求我们上缴更多的财政收入给她们，看在这些项目被说得这么天花乱坠的份上，就给出点钱吧。"

  COG_Suggesting_is_intervening: "建议也是干预"
  COG_Suggesting_is_intervening_desc: "殖民地的人们产生了一点小骚动，看起来，作为总督的魅魔需要向她们提一点建议，让她们自己化解这场冲击了，魅魔并不希望自己亲自出手摆平全部的事，最重要的是部族自己。"

  COG_MoeLotl_books: "萌螈秘籍"
  COG_MoeLotl_books_desc: "萌螈族自古以来就著书无数，让她们发掘其中的宝藏是不错的选择，刚好，绮罗那边的造纸技术越来越先进了，不如同绮罗那边商讨书籍印刷的事宜。"

  COG_Kiiro_production: "绮罗生产"
  COG_Kiiro_production_desc: "绮罗一族的生产技术算是我们领地里最强的存在了，她们小到农具、瓷器，大到机床设备，都是可以生产的，虽然她们对于其中转动的齿轮和什么各种传动不甚了解，但是总好过没有。"

  COG_Another_method: "另辟蹊径的修行方式"
  COG_Another_method_desc: "许多部族过去听到萌螈族的修行都会联想到炼制人尸，不过现如今，萌螈王庭更多地是从内和外采购各种更加实惠、安全的牲口来进行修行。"

  COG_Kiiro_and_ratkin: "猫和老鼠"
  COG_Kiiro_and_ratkin_desc: "绮罗和鼠族有没有长久和平的可能呢？肯定是有的，以彼此的长处相互结合和弥补，相信她们能够创造更多的“双赢”。"

  COG_Delicious_cake: "美味叶花糕"
  COG_Delicious_cake_desc: "虽然萌螈们有些抽象的食物——仰望萌螈派，但是……不要紧呀！她们还有叶花糕这种让人欲罢不能的佳肴，足以让各种贪吃者充满幸福！"

  COG_Groups_united: "各族融合"
  COG_Groups_united_desc: "很快，本来就充满活力的魔界溪谷从大萧条的短暂冲击中缓了过来，快速发展的经济也进一步促使了各个部族之间的融合，整个社会呈现一股积极向上的风气和和谐的社会秩序。"

  COG_The_future_of_us: "魔界溪谷的未来"
  COG_The_future_of_us_desc: "殖民地的日子一天天过去，魅魔发现自己的办公桌上积攒的文件越来越多，虽然她一封都没拆开过，但那些纸上的墨迹似乎隐隐约约在说同一件事：“这片土地需要决定自己的方向。”她靠在椅背上，看着窗外渐渐暗下来的天空，想着自己究竟还能这样“悬空”多久。这个问题，她自己也没有答案。但她也知道，如果她不做点什么，别人也会替她做，那她大可以继续漂浮着。"

  COG_Political_reform: "谋求政治变革"
  COG_Political_reform_desc: "魅魔对那些部族领袖之间的明争暗斗没有兴趣，但她偶尔也会听到一些风声——比如绮罗们在讨论如何让她们的影响力继续扩大到其他部族当中，如何将魔界溪谷各族的命运更加紧密相连，实现更好的发展。鼠族的领主们还在忙于和其他领主勾心斗角，商人们更多地在信里要求改革关税，改变当下鼠族邦国林立的现状，广大农民们开始对一成不变的头朝红土背朝天的日子感到厌烦。萌螈王庭里的修士阶层牢牢把持着国家的权柄与命脉，许多平民阶层开始尝试触动旧日构建的秩序，希望王庭能够迎来新的变革，广大奴隶渴求改变自身的悲惨境地……这些声音都很小，但它们确实存在。也许，这片土地要从十几年前的沉默中再次复苏了。"

  COG_Aloof_peace: "冷和平"
  COG_Aloof_peace_desc: "如果从天上俯瞰魔界溪谷，就会发现即使和平在部族们之间持续了十几年，但她们仍旧从内心里坚持着异族的警惕和远离，各个部族如同马赛克一般分布在地图上，除了流动性极强的旅鼠旅邦和被各种部族先后涌入的“闲置区”，许多地区都是以一个单一的部族为绝对主体，其他部族零星构成的——也许那些少数人只是恰好来跑商或者出差的，部族们在魅魔的统治下仍旧维持着一种尴尬的和平。"

  COG_Splintered_realm: "分裂的城邦与国度"
  COG_Splintered_realm_desc: "铁鼠王国并不是一个国家——它是一张由城邦、贵族领地、商业共和国和部落联盟拼凑成的地图。每个鼠族城邦都有自己的法律、自己的领主、自己的军队，它们通常都是对彼此抱有一定敌意的——如果不是魅魔看着，大概率早就打起来了，只有在“面对外敌”时，这些零碎的邦国们才会偶尔表现出团结。而旅鼠商人们则在这些裂缝之间来回穿梭，既利用了这些领主之前的矛盾大赚一笔，又苦于各邦国之间设立的层层关税壁垒，这些商人在大体的方向上是渴望改变当下分裂的环境的。"

  COG_Overreaching_lords: "松垮的政权"
  COG_Overreaching_lords_desc: "在鼠族的城邦里，领主们名义上效忠于某个国王，但实际上她们只关心自己领地里的收成和矿山的产出。即使国王的法令源源不断地从宫殿里发出，而领主们常常会因为“没收到”的理由扣下那些她们不喜欢的命令。有一个鼠族领主甚至用自己的画像替换了国王的画像——她说“反正国王也看不见”。"

  COG_Lordly_rivalries: "明争暗斗的领主们"
  COG_Lordly_rivalries_desc: "现在的鼠族领主们之间没有战争，可是她们在曾经往往都是相互有过大打出手的经历和结下血海深仇的情结的，虽然现在大家明面上不再干戈相向，但她们从来没有停止过对其他领主的羞辱和排挤，而且她们有的是办法让对方难受——比如在丰收的日子故意抬高过路费、在对方领地的水源上游修建水闸、在其他领主联姻时故意送出几匹患病的驮兽。这些争斗从不流血，却从未停止。绮罗的使者路过这些领地时，常常会在驿站里听到鼠鼠们一整夜的抱怨和八卦，很大概率都是有关哪个领主倒霉了，哪个领主干什么去恶心其他领主了。"

  COG_Greedy_misers: "贪婪的领主"
  COG_Greedy_misers_desc: "不是所有的鼠族领主都关心领地建设和民生。她们当中的大部分都只关心两件事：囤积和挥霍。她们把粮食锁在谷仓里，把金银埋在地窖里，把矿石堆在矿山口——不是因为她们需要，而是因为她们“不想让别人得到”，她们还会在各种无关紧要的方面铺张浪费，将那些广大百姓挣的钱，拿来摆绵延千里的酒席、办豪掷千金的典礼、盖巨大无比的雕像，让这些钱在几天内便消耗殆尽了。旅鼠商人遇到这种领主是哭笑不得的，因为和她们做生意像是从石头里榨水，但是哪天她们突然来兴致要搞点盛大的仪式，她们获得的订单又会如天文数字般大得不可思议。"

  COG_Slave_court_oppression: "奴役的国度"
  COG_Slave_court_oppression_desc: "萌螈王庭的运转建立在一种古老的秩序之上——许多的战俘和因为各种天灾人祸沦落到破产境地的萌螈沦为奴隶，被视作“不需要被考虑的”存在。她们种地、采矿、养牲口、修道路，甚至会因为她人需要修炼而被献祭掉——因为人的身上蕴含着一种驱动螈气的真气，是修士们开发经脉的必须品。王庭的法律写明了对她们的随意处置，因为统治者们和修士们认为这是“自然的秩序”，是千百年来一直遵守的规则，而那些被困在秩序底端的萌螈们，只能日复一日地生活在这个为她们打造的囚笼中，在无尽的黑暗里看不到一丝希望。"

  COG_Rigid_tyranny: "残酷的压迫"
  COG_Rigid_tyranny_desc: "在王庭深处的那些修炼场所里，奴隶的命运远比“种地”和“养牲口”更沉重——她们被杀死，并会被用作“试炼”的材料，用来提炼真气以激发那些修士的螈气。修士们不把这些事看作“残忍”，而看作“必要的消耗”。但也有些年轻以及新晋的修士觉得不对劲，便寄希望于古老的典籍当中，她们在深夜里阅读那些被遗忘的旧书，试图找到另一种解释。"

  COG_Frozen_hierarchy: "僵化的秩序"
  COG_Frozen_hierarchy_desc: "萌螈王庭的等级像一层层叠起来的石板，修士们位于顶端，普通的平民百姓位居中间，而奴隶们位于底层——这种等级秩序除了在德国统治时期被短暂破坏过以外，千百年来都像巨石一般巍然不动，几乎没有底层人能上升，也没有高层人会下降。这套秩序已经运行了数百年，从未有人撼动过。"

  COG_Extreme_xenophobia: "极端的排外思想"
  COG_Extreme_xenophobia_desc: "在萌螈的雨林深处，有一种声音越来越大——“不是我们的人，就不该踏进我们的土地。”这种情绪不是突然出现的，而是殖民时期留下的创伤被反复翻搅后浮上来的淤泥。一些修士认为，只有彻底封闭王庭，才能保护她们的灵能和传统。王庭边缘的修士们被要求严格审视那些入境的一切事物，从而保障她们免遭第二次外来入侵的浩劫、保护她们的一方天地永葆安定。"

  COG_Lonely_dragonian: "孤独的龙娘"
  COG_Lonely_dragonian_desc: "虽然龙娘的处境在魅魔的帮助下提升了不少，但是这并不能从根本上扭转龙娘发展差、人口少、文化空的现状，很多时候，她们不能改变什么，当然，也不抱有希望改变得了什么。"

  COG_Alive_and_eat: "活着，吃点好的"
  COG_Alive_and_eat_desc: "龙娘有两大欲望——食欲和睡眠欲，当她们从野外的狩猎和觅食中获得足够的食物，便会倒头就睡，一睡就是几近一整天。她们不奢望什么，只要日子过得去就行。"

  COG_Remain_moral: "保持底线的家伙们"
  COG_Remain_moral_desc: "绮罗们很少主动挑事，能双赢就双赢，不能的话就尽量避开她人的锋芒。虽然这样的性格让她们在古典时代的生活当中往往无法成就一番大事业，但是平平淡淡地活着倒不是什么困难事，毕竟，其他部族也知晓这些绮罗们的性格——不惹事，所以也不会太为难这些家伙们。她们在部族交往当中更倾向于忍让。"

  COG_Steadfast_tribes: "维持底线的交往"
  COG_Steadfast_tribes_desc: "殖民者的到来迫使绮罗们开始更多更频繁地尝试与其他部族们合作——因为团结就是力量，当然，她们并不是没有任何原则的“老好人”，如果对方抱着算计与可耻的心思来和绮罗合作，绮罗会很委婉地拒绝这些糟糕的要求。"

  COG_Terrible_transport: "糟糕的交通"
  COG_Terrible_transport_desc: "绮罗隐居乡，光看名字也会觉得这些地方是相当遥远的。不错，绮罗的隐居乡在魔界溪谷的各部族中确实是最偏僻的——当初是为了躲避殖民者的殖民入侵而撤入深山老林的。现在，她们开始从这些僻远的地方尝试出来，进一步发展殖民地的经济，只是这糟糕的交通环境似乎还会迟滞很久很久。"

  COG_Decentralized_governance: "政治去中心化"
  COG_Decentralized_governance_desc: "绮罗没有绝对的领袖，只有分散在天南地北的隐居乡、以及它们所组成的微弱城乡网络还要在这些网格上持之以恒地传递信息的信使。这些信使统一了绮罗各地的思想。一方面，这会帮助绮罗们统一步伐，相互呼应，而另一方面，这些信使通常需要很久来传递完这些信息，然后村长、镇长们才能做出决定。"

  COG_Build_and_grow: "大兴基建"
  COG_Build_and_grow_desc: "殖民者留下的道路大多是殖民时期，为了服务宗主国利益而建的——通往矿山、通往港口、通往那些需要被掏空的地方。现如今，统治魔界溪谷的魅魔并不在意，但旅鼠商人和绮罗们在意。她们开始讨论：“如果我们自己修一条路，不是为了运走东西，而是为了连接彼此，那会怎样？”"
  COG_Build_and_grow_tip: "完成该国策，会在决议处解锁有关于各部族们的§Y建设魔界溪谷§!的界面，只有通过那些决议才能帮助我们实现更好的发展。"

  COG_Mine_expansion: "矿场扩建"
  COG_Mine_expansion_desc: "那些隐藏在丘陵与河岸边的矿场，向地下延伸出许多的巷道，小巧的鼠鼠们扛着镐子在其中穿梭、挖掘、运输，将一车车矿物从地下运出，最后登上港口的船，然后开到宗主国那里去。德国殖民者败退而慵懒的魅魔到来之后，矿井没有被填埋，而是继续被开采——只是现在开采出来的矿石，不再只流向港口的方向，矿石可以在当地建立的冶铁厂熔炼，最后再运向绮罗那里加工成工具，或是进一步加工成其他的工业用的钢制品。现在，绮罗和矿业主们希望进行谈判，说服她们进一步扩大钢产量——这样，就可以进一步扩大她们的工业发展了。"

  COG_Trade_route_renovation: "商路翻新"
  COG_Trade_route_renovation_desc: "旅鼠商队使用了数百年的土路，如今已难以满足日益增长的贸易需求。雨季泥泞、旱季扬尘，路面状况推高了运输成本，也延长了通商周期。部分商人、绮罗工匠甚至地方领主正在就商路翻新事宜进行协商。计划内容包括铺设碎石层、疏浚排水沟、修建小型桥梁等工程。资金来源、施工分工以及路权分配，仍是各方讨论的焦点。若能达成一致，将有效改善区域内商品流通效率，降低贸易成本。"

  COG_City_country_expansion: "城乡扩建"
  COG_City_country_expansion_desc: "随着鼠族人口又上一个档次，那些早已人满为患的城乡需要向更远方来扩张了，不然领地里的人都要溜走了，而且领主们也养不起和不敢养这些无业游民。"

  COG_Labor_tariff_redo: "劳动力协议与关税协议重订"
  COG_Labor_tariff_redo_desc: "人口激增带来的人口流动已然成为不可否认的事实——许多少地的城邦失去了管理农民流动的能力，设立关税带来的弊端愈发地显著——拦住人远远比拦住货物还困难，走私贩卖的现象大大损害了税收的效益，不如各个领主们在一起协商，将劳工流动的各项事宜与关税设定的建议统一，以此适应当下愈发失控的人流限制的问题以及关税问题。"

  COG_United_bank_founding: "联合银行建立"
  COG_United_bank_founding_desc: "魅魔的到来，让曾经被殖民者完全把控的金融和贸易都被原住民分走了，在这其中，擅长远旅的旅鼠族逐渐成为了这些行业的支配者，许多钱庄也逐渐在旅邦里开办起来，越来越多的旅鼠成为了富甲一方的大富豪。现在，绮罗们希望能与这些富可敌国的商人们合作创办一所联合银行，从而为绮罗们的工程项目拉到更多的资金。"

  COG_Jadeglow_grove: "广种翠玉竹"
  COG_Jadeglow_grove_desc: "翠玉竹林是萌螈王庭的特色，不可不欣赏。现在，萌螈们希望在旺盛的雨林里、在烟雨缭绕的石板街道边，在充满生机的河岸旁都齐刷刷地仲满翠玉竹，这样子，只要萌螈们举目四望，就可以看到她们喜欢的翠玉竹层层抱在周围。"

  COG_Sky_lantern_festival: "庆祝天灯节"
  COG_Sky_lantern_festival_desc: "在古时候，鼠族王国会通过放飞天灯这一方式去传递情报与信息，旧日的时光里，高高挂在天空的灯光是刀剑相向的前兆，是两军即将展开厮杀表演的开场白…而现在，不打仗的日子，这些能够装饰天空的灯光成为了领主们消遣娱乐、传达国泰民安的寄托。节日当晚，只要人们仰望星空，就可以发现这些闪烁的橙光在天上汇聚成了一条灿烂的星河，并随风漂浮，好像真的像一条充满活力的河流在流动着。"

  COG_Catmint_plantation: "广泛种植猫薄荷"
  COG_Catmint_plantation_desc: "猫薄荷被绮罗们带到了魔界溪谷，并让她们广泛地生长在乡镇的每一处角落，绮罗们很喜爱这些猫薄荷散发的淡淡清香，也很中意它对当地驱蚊效果，扩大她们的种植有助于提高她们的生活幸福度和舒适度，而且也是卖给其他部族的不错商品——毕竟其他部族也很烦那些该死的蚊虫。"

  COG_Engineering_corps_formation: "绮罗工程队"
  COG_Engineering_corps_formation_desc: "随着人口的增加，越来越多的鼠鼠们背井离乡，成为了游离四方的打工人，她们替代了往日领主们的徭役大军，开始逐渐成为各个邦国建设的主力军，现在，绮罗希望将其中的一些鼠鼠们招募，并变成她们专属的工人——也就是工程队，并对她们进行统一的培训和编组，从而进一步加快建设速率。"

  COG_Agri_investment_boost: "扩大农业发展"
  COG_Agri_investment_boost_desc: "殖民地人口的迅速发展势头仍旧保持着，为了防止出现粮食不足的危机，各个部族们普遍认为扩大粮食生产是必要的、长期的策略。但是，在鼠族地区，这里的人地矛盾已经初见端倪了——她们的人口相比十几年前翻了几番，各个领主的领地已经愈发趋近饱和的状态，即将兜不住这狂暴增长的人口，更令她们害怕的是：这些缺乏食物的平民最终会变成动摇她们统治的起义军，扩张？谁知道魅魔会不会容忍这些行为呢，所以，她们决定开会商讨对策，甚至是去请教其他的部族帮忙解决这些问题。"

  COG_Kiiro_industry_growth: "绮罗工业的扩张"
  COG_Kiiro_industry_growth_desc: "早在很早以前，绮罗凭借她们发达的手工业又率先发展起了对于殖民地来讲十分新颖的工业，引入工业设备和制度后，她们得以更加大规模地生产各种各样的廉价工业品，并靠着薄利多销，赚了不少钱也赢得了不少口碑，现如今，她们尝试进一步扩大现有的工厂，打算以此获得更多的利润。当然，是否有用足够的市场与利润去冒险还是值得商榷的。"

  COG_Greater_statue: "更大的雕像"
  COG_Greater_statue_desc: "鼠族的某个城邦里，领主决定在广场上竖一座新的雕像——不是国王的，也不是神的，而是她自己的。消息传开后，隔壁城邦的领主也开始筹划更大的雕像。旅鼠商人见状，开始在两地之间兜售“更贵的石材”，绮罗则提出可以作为一个“优秀的雕刻师”来帮忙，一些绮罗工程师路过时，悄悄对同伴说：“她们要是把买石头的钱用来修路，路早就通到海边了吧。”"

  COG_Grander_palace: "更华丽的宫殿"
  COG_Grander_palace_desc: "一些领主们认为自己的宫殿不够气派，不够彰显自己的威望，便下定决心对自己的宫殿来一次大扩建，它会多出更高的城楼、更宽的水池、更美的装饰……总之，就是让自己的宫殿在所有方面都再上一个档次！虽然，十万个自己也塞不满新扩建出来的城楼、运来邦国一年的渔获也填不满拓宽的水池、矮小的自己看不清也看不见那些高挂的富有装饰，但是，能让别人第一反应是富有、威望就是好！"

  COG_Gold_for_tomorrow: "把金子埋给未来"
  COG_Gold_for_tomorrow_desc: "不知道哪里形成了一种诡异的风气，领主们不再把那些金银珠宝拿来交易，而是囤积起来，有时候，干脆直接埋在某个奇奇怪怪的角落，然后说：“这是给未来的孩子们准备的。”，她们攀比着谁能留给孩子更多，谁就是有实力的，这些金子就这么埋在了地里，从市场上消失了。"

  COG_A_magic_sky_road: "一条神奇的铁路"
  COG_A_magic_sky_road_desc: "绮罗们在《猫腻说法》上刊登了修建铁路一事，虽然描绘得很绘声绘彩，但领主们对于这些粗暴干涉自己领土的工程项目似乎有些抗拒、萌螈们则对外族以及殖民者科技感到疑虑，但旅鼠们不同，她们和绮罗一样畅想着这样一条神奇的铁路，让她们联系起各个地区、大赚特赚。"

  COG_Negotiating_with_lords: "与领主们的谈判"
  COG_Negotiating_with_lords_desc: "修路需要经过鼠族领主的土地。绮罗的使者们挨家挨户地拜访那些住在城堡里的领主们，试图说服她们“让出”一小块土地。少数领主很爽快：“修吧，反正那地我也用不上。”但大部分领主则需要更多的耐心——以及更多的“通行费”。"

  COG_Fundraising: "筹备资金"
  COG_Fundraising_desc: "修路的钱不是天上掉下来的。绮罗们拿出自己的积蓄，这些积蓄早在她们之前大萧条时大规模采购国外廉价工业产品和设备时花得差不多了。于是她们找上了财富最殷实同时也是和她们关系最要好的朋友们——旅鼠开始了谈判。"

  COG_Compromising_with_Moelotls: "与萌螈们谈判"
  COG_Compromising_with_Moelotls_desc: "绮罗们在经过萌螈扩种的翠玉竹林时发现：这些竹子似乎足够结实、防潮、防腐，这些在雨林里生长的家伙着实给绮罗们不小的震撼。如果这样的材料拿来搭建铁路的枕木似乎是一个不错的选择，既然如此，不如去问问那些萌螈们，问问可不可以以一笔不错的价钱卖给她们。"

  COG_Our_connecting_railway: "联系你我的铁路"
  COG_Our_connecting_railway_desc: "这是一条殖民地下原住民自发建设的铁路，她不通往海边的港口、不通向那些贪婪的资本家、压迫者嘴里，它是一条符合原住民实际发展需要的铁路，虽然只有寥寥几节车厢在火车头的牵引下开动着，但是它将会为这个殖民地带来翻天覆地的变化。"

  COG_Technical_training_courses: "开办技校"
  COG_Technical_training_courses_desc: "铁路修完了，但会开火车的人还不够多。绮罗们原本打算招募本部族的人，但是绮罗人少的特点很快就否决了这一想法，她们必须向其他部族——特别是以劳动力众多而出名的鼠族寻求帮助，如果与领主们能够协商成功，我们有望快速解决铁路因为技术人手不够的问题，当然，这都是建立在我们不会触犯当地利益的情况下——绮罗培养技术工人对于领主们来说是一种十分侵犯利益的行为……"

  COG_Compulsory_education: "义务教育普及"
  COG_Compulsory_education_desc: "鼠族拥有充沛的人类与资源，并且这些鼠族勤劳的性格比绮罗捎带慵懒的个性还适合专研，如果能够在广大鼠族中开办义务教育，就能为殖民地培养大量的受教育人群，那么，魔界溪谷未来的建设一定会获得更伟大的成就，并彻底改善我们国家的各种糟糕状况。当然，我们需要评估来自地方领主的阻挠可能，因为这些教育，在那些老东西眼里可能是致命而又危险的。"

  COG_Westward_industry: "工业西迁"
  COG_Westward_industry_desc: "当初内迁有多安全，现在外出就有多困难，经历了各种森林、高原、山地组成的屏障后，才能远远看见那些小小的村落坐落在盆地内。虽然只是一些轻工业，但绮罗们还是感到这内陆太不合适工业的发展了——昂贵的运费和贫瘠的配套设施让工业的潜力大打折扣，她们迫切地希望从内陆反向迁徙，返回到她们原本逃离的海滨一线。现如今，铁路已经修成，路途上的商人城邦愿意为她们提供住宿，领主们也同意为她们准备，毕竟绮罗们给的钱实在是太多了，她们的西迁任务应该不会出什么乱子。"

  COG_Railside_development: "开发沿线的荒地"
  COG_Railside_development_desc: "铁路建成之时，人们突然意识到这个光秃秃的车站上，蕴藏着无穷的商机：商人的往来提供了住宿、伙食的需求，再在到达一定规模后，还会从小镇变成城镇，再继续拉动更多的人口、需求和发展，就会成长为独霸一方的大城市……这些此前从未开发的土地上，就这么放着撩人的机会，所有人都希望从这条铁路上发财。"
  #铁路的建成将许多原本被领主们抛弃的废地重新变成了宝贝。起初，这些铁路旁只有一个简陋车站，一些人开设的饭馆、旅店、杂货铺，还有少数定居于此的商人。但之后，一些特别繁忙的站点附近出现了更多功能性建筑——钱庄、邮局、托运部，周边地区的乡镇也开始源源不断地来这里出售她们的农产品、手工品以及矿石，并形成了与火车运行时间高度吻合的集市节点。之前，人们会在其他地方开集市，现在，这些车站成为了她们新的集市地点，并帮助她们将产品卖向更远方。

  COG_Railway_radiance_expansion: "站台网络扩张"
  COG_Railway_radiance_expansion_desc: "这些站台在一定程度上把领地多余的人口、流动的金钱、人们的注意深深吸引了过去，许多领主们的命运被这些看似平凡的铁路给深刻改变了。现在，越来越多领主们愿意赞助或是请求铁路多修一段到她们那，多建些站台在这些地方，多停些时间在这些点。这对于许多人来讲都是一笔不错的投资，但是有些领主并不希望仇人借此得到发展。"

  COG_Defense_reform: "重组国防"
  COG_Defense_reform_desc: "魔界溪谷有自己的“军队”——魅魔那早已废弛管理许久的仪仗队，剩下的就是各族自己的武装、民兵和巡逻队。从鼠族的突击队、萨赫勒骑兵、敢死队，到绮罗的民兵队、特战师以及萌螈的修士灵团，这些地方武装共同组成了现如今的魔界溪谷军事的全部，如果现在还不将这些部队加以整理，很难说在殖民地危急时刻，魅魔能不能带着她的地方武装打退敌人的进攻。"

  COG_Prepare_glasses: "配发眼镜"
  COG_Prepare_glasses_desc: "现代战场上，发现往往也就意味着击杀，这让视力极差的鼠鼠们在现代战争中可谓吃尽苦头，她们只能顶着一片模糊的视野，惊悚地穿过枪林弹雨，被从头上、大耳朵旁飞过的子弹吓得胆战心惊，然后才能摇摇晃晃地冲到敌人面前，然后被体力充沛、甚至更加高大的敌人制服……而当眼镜这种东西被配发给这些小老鼠们时，她们终于可以像其他部族的士兵一样躲得远远的，然后拿起步枪“精准射击”——其实更多的是在乱射，虽然效果还是不咋地，但总比没有好，不是吗？"

  COG_Uniform_regulations: "制服规范"
  COG_Uniform_regulations_desc: "鼠族的耳朵、绮罗的猫耳、萌螈的外鳃、龙娘的角——每一种头型都需要不同的头盔设计、鼠族的身高与其他各族的巨大差异、各个部族的穿着风格和习俗文化造成的差异等等问题让殖民地的军服制作十分混乱。统一的制服在这个世界里是一件奢侈品。绮罗的裁缝们最终放弃了“统一”，转而采用“模块化设计”的思路：每个士兵根据自己的体型领取相应的部件模块，然后自己组装。往往一个中心化部件厂生产了所有的通用部件，最后交给分布式组装中心，改造成适合各个部族的样式。"

  COG_Endless_power_of_Mima: "§G魅魔§!，统帅一切！"
  COG_Endless_power_of_Mima_desc: "魅魔终于决定从她那永无止境的懈怠中打起精神来了！不过，这也意味着，魔界溪谷正面临着前所未有的严峻危机，以至于这位始终与强者战斗的家伙都认真了起来，相信魅魔会像二十年前那样，带领魔界溪谷从一个胜利走向下一个胜利！"

  COG_War_zone_demarcation: "划分合适的战区"
  COG_War_zone_demarcation_desc: "魔界溪谷地大物博，各地的差异可谓是千差万别，因此，我们不应该笼统地将这么庞大的国土画成一个战区或是随意地将各种部族乱部署在各地上，而应该因地制宜，用合适的地方武装在适宜的环境下战斗，从而有效提高我们军队的战斗力。当然，我们也要注意军队驻扎在一个地方太久产生的勾结地方的问题，军队的灵活调度有助于我们防止这种军人越权的问题，但此举也可能让那些富含“乡土情结”的军团表示不满。"

  COG_Officer_unification: "统一军官体系"
  COG_Officer_unification_desc: "在魔界溪谷，各个部族有五花八门的军官职位，这些冲锋长、将军、组长、军事部长、卫长、都尉、长老的职位被摆在一起，完全分不清谁比谁大，贸然地合并现如今混乱的军官体系必然导致各部族间激烈的冲突和不满，因此我们需要重新明确一套符合各族标准的军官制度。当然，这样的整合势必会导致那些不同部族的军官们在待遇和权力这方面的大争吵甚至反对。"

  COG_Officer_quotas: "规定将官名额"
  COG_Officer_quotas_desc: "统合过后的地方武装出现了许多数目虚报、一个军官指挥几个人的现象，我们必须按照各个部族的实际情况，划分好这些部族们应该保持多少的将官名额，从而使得军费分配更加高效。然而，这样的划分，很有可能导致那些尸位素餐的家伙们急得跳出来阻挠我们，我们必须评估好遭到的阻力。"

  COG_Local_force_integration: "整编地方武装"
  COG_Local_force_integration_desc: "魔界溪谷的各支武装力量，长期以来都是各自为政的。鼠族的士兵们主要面对的是边境盗贼和较为频繁的内部摩擦；绮罗的民兵们则更习惯处理山林间的巡逻任务；萌螈修士们几乎不参与常规的军事行动，而是将她们的螈气视作一种权力和地位的象征。当世界的局势开始风云变幻时，有人提议：不如把这几股力量整合起来。然而，真正开始操作时，人们才发现最大的问题不是武器，而是隔阂——各族对“防御”这个词的理解差异巨大、而且她们对于军费的导向异常地敏感，认为这些资金落到其他部族甚至同族的敌人手里都是巨大的威胁。因此，我们需要将这些散落在地方的各种武装尝试纳入魔界溪谷这个大大的旗帜之下。"

  COG_Army_reduction: "裁撤冗余军队"
  COG_Army_reduction_desc: "一些收编上来的地方武装并不适合承担国防的职能：其中有许多军队都仅仅具备仪仗的作用，有一些在历史洪流的发展下早已落入下风，还有一些军队在其他地方的使用限制极大，这些军队对于我们国家来说都是冗余的、不必要的，因此，我们需要裁撤这些家伙们。虽然，这些节省出来的军费可能到不了某个家伙的腰包里了。"

  COG_Tech_empowerment: "科技赋能"
  COG_Tech_empowerment_desc: "绮罗们见识了太多殖民者创造的奇迹，也经历了殖民者残酷的压迫，因此，她们在与殖民者的长期接触中逐渐形成了积极学习西方，并拿这些先进知识和技术改造本国的思想，她们在魔界溪谷这种科研氛围极其匮乏的地方毅然举起了“学习殖民者”的旗帜，并建设起了许多的工业，希望实业兴国。虽然绮罗们有太多太多天马行空的设想与计划，但是盘缠在魔界溪谷方方面面的部族社会、部族之间的隔阂、科研思想的落后总是一次次打击她们的理想。绮罗们希望，这一次，她们的计划能够顺利进行。"

  COG_Military_theory_upgrade: "军事理论改进"
  COG_Military_theory_upgrade_desc: "鼠族的那些小家伙还沉浸在骑马与砍杀的世界里，萌螈的那些大袍子们满脑子里都是修仙修仙，那帮天真的龙娘只会玩泥巴，除了绮罗能够从西方诸国当中稍微学习点先进的知识，整个魔界溪谷的军事理论发展简直一幅快完蛋的画面，如果不加以纠正，这些士兵在战场上只能排成一排排可笑的靶子，最后挨人家一枪，结束可笑的表演，再强大的修士也敌不过人家有组织有纪律的军团。如果能够扫清这些旧思想的余孽，我们的改革会很顺利的。"

  COG_kiiro_rations: "绮罗特供食品"
  COG_kiiro_rations_desc: "绮罗一族早在很久以前就尝试各种各样的烹饪方式来处理不同的食材，从而让她们更好地在这片土地幸存下来。长期的烹煮经验积累，让她们在厨艺上拥有惊人的造诣，让人对她们的美食赞不绝口。因此，引入绮罗们从事军粮的生产，应该有助于提高我们军队的士气，增强我军的战斗力。"

  COG_Study_from_our_lord: "向宗主国学习"
  COG_Study_from_our_lord_desc: "虽然宗主国——幻想乡在名义上是压迫魔界溪谷的势力，但是在魅魔的懒政作用下，这些压迫很大程度上被控制在了一个合理的、不易察觉的范围内，而且，魅魔的存在成为了原住民们特别是绮罗们从宗主国那里学习先进知识与文化的好帮手，只要和魅魔打声招呼，魅魔基本上不太会驳斥甚至为难原住民的请求。因此，只要不触及魅魔最挂念的——魔法和强大，原住民的这一次向魅魔寻求帮助也不会有问题，对吧？"

  COG_Sky_soaring_Kiiro: "翱翔天际的绮罗"
  COG_Sky_soaring_Kiiro_desc: "鼠族身体过于娇小，萌螈反对殖民者科技，龙娘几乎没有什么智慧，而绮罗，这一个部族不仅在科技上肯用心学习，而且在身体机能方面天生就适合成为一名航空兵——她们惊人的反应能力、强大的夜视能力以及敏锐的动作，都在说明绮罗简直是这方面的天才。只要对这些绮罗们进行相应的飞行员训练，相信魔界溪谷在之后的不久，就会拉起一支强大的空军来保卫它自己的蓝天了。"

  COG_: ""
  COG__desc: ""

  COG_Magical_pursuit: "魔法追求"
  COG_Magical_pursuit_desc: "萌螈修士认为千百年来流传的螈气和修炼的传统，是不可动摇且前途无量的，她们鄙夷那些殖民者带来的枪炮与机械，并认为之前王庭失利的问题不是出在魔法，而是自身的一次偶然的失误与骄傲导致的灾祸，因此，她们认为，只要萌螈一族得以重拾她们优秀的传统并发扬光大，她们就能从弱小中迅速崛起，将殖民地落后的面貌一扫而空，甚至超越那些殖民者手中的“歪门邪道”，让她们知道真正的魔法应该是高不可攀的。"


#国家精神
  ############################################################################################################
  ############################################################################################################

  COG_Autonomous_dependency_name: "超然的独立"
  COG_Autonomous_dependency_name_desc: "经历了许多年的总督任命，魅魔对待殖民地相关事物越来越不上心，因为新鲜感缺失的缘故。她对于千里之外的宗主国下的命令也基本是敷衍了事，鉴于魅魔治理下的殖民地没有爆发过一次抵抗和游行示威，该产出的资源，该履行的义务没有落下，宗主国也默许了魅魔这种几乎是“神游”的状态。"

  COG_Absent_rule_0_name: "缺席的统治"
  COG_Absent_rule_0_name_desc: "自从伟大战争以来，魅魔对于殖民地事物的部署和干预断崖式减少。现在，魅魔已经在事实上对殖民地进行了“自由放任”式的管理，除了收税，她几乎不会掺和到各种建设活动中。"
  COG_Absent_rule_1_name: "缺席的统治"
  COG_Absent_rule_1_name_desc: "自从伟大战争以来，魅魔对于殖民地事物的部署和干预断崖式减少。现在，魅魔已经在事实上对殖民地进行了“自由放任”式的管理，除了收税，她几乎不会掺和到各种建设活动中。"
  COG_Absent_rule_2_name: "缺席的统治"
  COG_Absent_rule_2_name_desc: "自从伟大战争以来，魅魔对于殖民地事物的部署和干预断崖式减少。现在，魅魔已经在事实上对殖民地进行了“自由放任”式的管理，除了收税，她几乎不会掺和到各种建设活动中。"

  COG_Lower_exploitation_name: "有限的剥削"
  COG_Lower_exploitation_name_desc: "宗主国希望我们帮助他们度过难关，不错，我们会为宗主国提供除了帮助以外的其他帮助，除非被宗主国盘问到万不得已，否则，我们对于远方的政令都可以大可不必理会。"

  COG_Tolerate_exploitation_name: "承受剥削"
  COG_Tolerate_exploitation_name_desc: "宗主国希望我们帮助他们度过难关，我们唯有献上血和泪浇灌的财富，除此之外，别无他法。"

  COG_MoeLotl_race_name: "崇尚灵能的萌螈"
  COG_MoeLotl_race_name_desc: "萌螈族在魔法的研究上十分深入，在魔法相关方面也卓有建树，但是，她们曾经被殖民者残酷迫害造成的伤痕迟迟没有愈合,这导致了她们对于那些被殖民者一同带来的科技产生了应激反应，她们对于外界的各种先进技术都报以最强烈的排斥和厌恶。好巧不巧，这些萌螈又都是殖民地开展研究的骨干力量，由她们牵头的科研不可避免地形成了鄙视了世俗技术、忽视科技力量、转而崇尚起灵能的科研氛围。\n萌螈族虽然以技艺高超的修士和她的灵团闻名，那些修士掌握的力量往往在战场上给予敌人最为猛烈的打击，但是整个萌螈王庭其实还维持着奴隶制的运行，许多人完全没有资格去学习和进一步的修炼，而是过着悲惨的奴隶生活，这导致了萌螈族的军队建设工作总是停滞不前，军队的规模长久以来也得不到扩编。"

  COG_Ratkin_race_name: "勤勤恳恳的鼠族"
  COG_Ratkin_race_name_desc: "鼠族在殖民地的建设上可谓是立下了汗马功劳，她们人口众多的优势，为我们殖民地提供了几乎取之不尽用之不竭的劳动力资源，矿场驶出的一车车矿物、农场丰收的一捆捆作物、地图上拔起的一座座建筑，都是离不开她们的功劳。\n但鼠族普遍的近视疾病导致了作为殖民地武装主力军的她们往往没法察觉数百米外的军事动向，并且战斗水平十分低下，这些小老鼠除了一颗向前冲锋的决心，别无他物。娇小的身材也让她们往往在肉搏上占不到什么优势，硕大的耳朵又经常导致她们在战斗中负伤，因此，往往都是靠人多力量大来压倒对手。"

  COG_Kiiro_race_name: "分身乏术的绮罗"
  COG_Kiiro_race_name_desc: "绮罗在许多岗位上的表现都优异于其他部族，作为生产线的专家，她们能更好地增加生产，作为工艺制作的匠人，她们能制成更加优秀的“作品”，作为从政的官员，她们能够更好地协调上下方……但是绮罗族较为稀少的人口往往不足以支撑发展带来的职业缺口，而在科研方面，绮罗作为少数几个愿意引进和学习先进技术的部族，在一定程度上缓和了殖民地糟糕的科研氛围。\n在军事上，动作迅捷、视力优良的绮罗更是抢手，她们往往能在那些鼠族无法胜任的侦察兵里大放光彩，她们的夜视能力也让她们具备了一定的实力，除此之外，鼠族和萌螈根本无法使用的飞机也只有绮罗能够开，但殖民地还是得面对这么个问题——绮罗人并不多。"

  COG_Dragon_girl_race_name: "微不足道的龙娘"
  COG_Dragon_girl_race_name_desc: "龙娘在殖民地建设当中几乎没有什么举足轻重的贡献，人数上也形成不了什么影响力，基本上就是在自己的聚集地生活。"

  COG_Lack_technology_name: "落后的科技建设"
  COG_Lack_technology_name_desc: "除了魅魔关心的魔法领域，殖民地在其他方面的科研成果几乎毫无建树，当然，这是因为萌螈的排斥，鼠族的忽视的原因，只有绮罗在缓慢地推进这方面的发展，但对于科研的大方向没有什么决定性的作用，毕竟这片土地缺乏科研的土壤。"

#国家事件
  ############################################################################################################
  ############################################################################################################

  SA_COG_event.00000.t: "对萌螈部族聚集地的视察"
  SA_COG_event.00000.d: "萌螈一族早期和她们的远亲——墨西哥美西螈一样惧怕酷热，她们最初仅仅生活在乞力马扎罗山附近的山地雨林和山地沼泽，当地得天独厚的凉爽潮湿气候令她们迅速在此繁衍并壮大，并以此作为据点开始向着四周辐射她们的影响。她们体内流动着一种被称为“螈气”的力量，通过修炼这种力量，她们得以增强自身的实力。随着螈力的修炼和科学技术日渐发达，她们进一步适应了雨林炎热的气候，并在此得到一定的发展。螈气在前任殖民总督的政策里是完全禁止修炼的，因为这是有害统治秩序的，魅魔初来乍到时，对萌螈蕴含的灵能感到好奇，便解除了关于螈气禁令，使得萌螈的灵能得以重新发展。\n萌螈的建筑傍水而建，许多建筑和遥远的东方建筑有异曲同工之妙，它们往往靠丰富的水网连接彼此，令其他种族望而却步的潮湿天气，是她们中意的好天气，雨露附在皮肤上，如同轻吻一般令人心旷神怡。萌螈钟爱的植物——翠玉竹种满了石砖铺设的街道旁，一阵清风拂过林子，引得金灿灿的竹林随风摇曳着，发出沙沙声响。"
  SA_COG_event.00000.a: "萌螈一族在灵能和魔法上有比较深刻的理解"

  SA_COG_event.00001.t: "在狭窄的鼠鼠王国里参观"
  SA_COG_event.00001.d: "鼠族部族在身高这点倒是很像她们的远亲，惊人的环境适应力和繁衍能力使得她们在非洲广泛分布着，并分化出了诸如雪鼠、旅鼠、低地鼠等不同的变种。她们干活勤快，手脚麻利，总是一副充满干劲的姿态，不过她们的眼睛像老鼠一样近视，使她们无法敏锐地发现远处的敌人。数量众多的鼠族如同取之不尽的人力资源，她们是殖民地大兴基建、动员和生产的主力军。随着魅魔逐渐脱离殖民地开发，鼠族参与到这种充满“血与泪”的政策的频率越来越少，从那以后，她们几乎脱离了殖民地的繁重徭役，而是更多投入到她们自己的生活中，绘制她们自己的梦想。\n她们建造的城镇，如同《小人国》里蹦出来一样。人类稍微在城门外的小山丘上踮起脚尖，就可以将这些城市尽收眼底：街道横平竖直地交错着，五颜六色房屋排山倒海地铺开来，朵朵炊烟飘上天空，有时还能隐隐约约看见她们灵动的大耳朵在其中穿梭。除了勤劳的鼠族在家园里辛勤地建设着，还有不少鼠族成为了商人，发挥着如同殖民地红细胞的作用，她们通过贸易联系起各个地区，她们牵引着驯化的仓鼠大王，在各地兜售她们收集到的商品。"
  SA_COG_event.00001.a: "这些勤奋的小老鼠日日夜夜建设着家园"

  SA_COG_event.00002.t: "抵达遥远的绮罗隐居乡"
  SA_COG_event.00002.d: "绮罗部族拥有许多猫的特征，她们总是以和为贵，在凶残的殖民者到来之前，她们就曾广泛地分布在这片土地上，并因为她们和善的性格而出名。随着殖民者的到来，她们不得不往偏僻荒凉的地方转移，忙碌的绮罗信使奔走于乡镇之间，警告她们赶快撤离，不出几日，这些绮罗几乎失踪了。直到魅魔改变了殖民策略，向各个部族释放了合作和善意的信号，在确认安全后，绮罗们才开始重新陆续出现在殖民地各地。她们友善而健谈，因而有大量绮罗在政府内任职，成为了中央和地方良好衔接的桥梁。\n绮罗勤勤恳恳地生活在她们的土地上，市集、房屋、田野、牧场组成了绮罗农村典型的画面，文人笔下的“田园牧歌”去形容她们的乡镇是最合适不过的了。她们用特别的办法改良雨林和草原贫瘠的土地，使得她们的作物能够结出最饱满最高产的作物，她们放开友善的歌声，放牧着一群又一群绵延至天边的兽群,在靠近河畔的平原上，一些工厂坐落于此，其中大部分都是和轻工业有关的，这些可爱的猫猫们会用她们最灵巧的双手将纸张变成最栩栩如生的鸟儿，将各种小东西加工成令人爱不释手的手工品，最后远销各处。"
  SA_COG_event.00002.a: "绮罗部族克服了旧日的恐惧，拥抱了新的生活"

  SA_COG_event.00003.t: "进入龙娘聚居地"
  SA_COG_event.00003.d: "龙娘部族曾经零星分布在这片大地上，她们几乎没有什么文明，科技水平原始，虽然她们拥有其他种族望尘莫及的力量，却没法抹平科技的巨大代差，自殖民者踏上新土地的以来，龙娘的数量便以惊人的速率断崖式下跌，她们珍贵的皮毛，珍贵的龙珠以及她们美丽的外表，都为她们招来了数不胜数的杀身之祸。魅魔到来的那一天，龙娘已经濒临灭绝。龙娘的外表令魅魔印象深刻，她随便找了块地把龙娘聚集到了一块，想着看看她们会不会有什么奇妙的魔法，并出台相关政策，严厉打击了各种针对龙娘的走私和杀戮行径，得到保护的龙娘，部族数量逐渐开始回升。\n聚居地里的木屋们如同一个淘气的小孩摆的玩具一样歪歪扭扭地立在四周，龙娘们几乎是从零开始学习文明的建设，这些简陋的房屋就是她们的尝试，屋子里普遍家徒四壁，因为龙娘早已习惯了“天当被子地当床”的方式，田地里种出的秧苗歪歪扭扭，“它们最后会往上长的！”龙娘向魅魔报告道。"
  SA_COG_event.00003.a: "龙娘从伤痛的历史中走出来了，但未来还有很长的路要走"

  SA_COG_event.00004.t: "与各个部族领袖的简单交流"
  SA_COG_event.00004.d: "在这片失去殖民者管理秩序的土地上，各种部族领袖成为了这片大地真正的掌控者和实权所在，魅魔除了过问税收和资源产出的相关事宜，就基本不会过问部族领袖们的治理策略和方案，于是，各种各样形式的国家与形式存在于此，其中有鼠族形成的王国和旅鼠商帮建成的商业城邦、萌螈族建立的奴隶制王国、绮罗一族由信使网络连接的乡镇、城市联盟，还有像龙族这样的原始部落结构。在访问各地的同时，各地的部族领袖都纷纷主动欢迎了总督大人的带领，向她汇报地方的情况，虽然领袖们往往三言两语就概括完了，不过魅魔不在意，她本来就没有什么心思去听长篇大论。"
  SA_COG_event.00004.a: "“今年的视察就先这样吧”"

  SA_COG_event.00005.t: "1"
  SA_COG_event.00005.d: "2"
  SA_COG_event.00005.a: "3"

  SA_COG_event.00100.t: "漫步在“星穹”下"
  SA_COG_event.00100.d: "当魅魔第一次踏上这片陌生的土地时，她就发现了这里土地里流动的魔法十分强大，在魔力的滋润下生长出了一片片茂盛的荧光森林。那一夜她徘徊于林间，记住了每个角落，每个树木和菌子，树枝间的真菌发出柔和的光线，打在树木围成的天蓬上，将天蓬变成了好像遥不可及又如同星河般神秘的“星空”，真菌“呼吸”着，“星空”也随之在穹顶上转动着并闪烁着。每逢无聊之际，魅魔都会在这片闪耀着荧光的森林四处转转，想要了解这些植物体内蕴含的魔法究竟有什么秘密。\n看看昨天的那位真菌先生，今天怎么样了，那天倒伏的老树木，上面又会生出怎样的蘑菇绘图。"
  SA_COG_event.00100.a: "震撼无法说尽我的情感……"
  SA_COG_event.00100.a_tip: "空"

  SA_COG_event.00200.t: "微不足道的新闻"
  SA_COG_event.00200.d: "当魅魔坐在办公室里，对着各部门部长的名单发呆时，一只绮罗族官员局促不安地推开大门，向魅魔呈递了一份旅鼠捎来的报纸，上面写着“伦敦股市崩盘”。魅魔听说过一点金融，它能凭借社会的关注把一文不值的东西变得价值连城，宣称诱人的利益来呼唤无数人的财富为之倾倒，也见识过很多那些投机取巧的金融把戏，还听过一些专业人士用各种各样的现象和名词去描绘金融背后的原理，比起这些吹泡沫的金融……哼，真要玩，还不如把钱投给底下那些小家伙，让她们开工厂、办学校。当然，她自己不会投——她只是觉得那比玩泡沫有意义。因此，她只是折好报纸丢入垃圾桶，并吩咐那位官员："
  SA_COG_event.00200.a: "“等我把今年的计划准备好吧”"

  SA_COG_event.00300.t: "殖民地的状况"
  SA_COG_event.00300.d: "魅魔的心态毫无波澜，也没有马上采取什么措施，于是大伙最开始也像她们的领导人一样——生活照常过。然而不出几天，作为殖民地的商人团体——旅鼠城邦率先感受到了来自财政的巨大压力，作为商人的她们对于价格很敏感，当各国陆续树立起的关税堡垒时，她们的贸易被打击了，许多商品没法卖出殖民地，开始有货物堆积在了港口无人管理。祸不单行的是，宗主国方面的压迫也接踵而至，魅魔即使再怎么赖皮，作为殖民地的她们也要被迫分担宗主国的危机，需要承接的订单和需求接二连三地涌入政府日程，政府的财政收入不再永恒地维持在“0”，而是开始出现罕见的赤字。不安的情绪开始在殖民地上下蔓延。不过，一天早上，当人们从睡梦中醒来，并走上大街时，她们发现各种政府机构的告示栏上张贴出了政府的新政策公告，似乎上面写有魅魔对殖民地未来的安排。"
  SA_COG_event.00300.a: "“总督大人会在上面写什么呢？”"

  #004 ~ ~ 系列恐将成为最大的事件堆积处了，所有的建设和改变都塞在这里了（究极屎山代码（难视））

  SA_COG_event.00400.t: "“好像也没什么变化”"
  SA_COG_event.00400.d: "人们发现，公告上仅仅只是列出了魅魔拖延了差不多一个季度才整出来的各部门部长名单，至于她对于现如今的困境做出的安排……没有增减税，没有调配物价，没有裁撤官员，没有政府公共工程建设，只有简单地一句话总结道“计划照常进行”。落款处，有魅魔总督的签名——字迹潦草得几乎认不出来。"
  SA_COG_event.00400.a: "“也许出面给建议在总督大人眼里是“干预”吧……”"

  SA_COG_event.00401.t: "各族相融合的景象"
  SA_COG_event.00401.d: "在魅魔的建议下，鼠族农民在绮罗隐居乡里频频出现，各种建筑设施遍地开花，道路连接起一座又一座城镇，让这些城镇也一同参与进了殖民地的大循环当中。绮罗生产的各种精致可靠的手工品销往各地，萌螈族的各种功法秘籍，千百年来总结的各种研学经典也不断从绮罗的造纸作坊不断送出，供人们阅读。旅鼠和仓鼠大王组成的商队星罗棋布地分布在纵横交错的道路上，将一处的资源运送到遥远的另一处。最初的几年，龙娘只敢在聚居地附近活动。直到确认那些曾经猎杀她们的殖民者真的消失了，她们才怯生生地迈出第一步，不再局限在她们狭小的聚集地里。从那以后，越来越多的龙娘不在局限在她们的小天地，学习房屋怎么建成的，工具怎么制备的，一个文明究竟是怎样创建的，学习她们碰到的一切。她们不再以胆战心惊的姿态出现在各族面前，各族也被这些美丽、天真的种族深深吸引，她们在各个城镇出现的身影四周总是充满目光，一切都是那么宁静安定。"
  SA_COG_event.00401.a: "让她们自己携手创造一个和谐的环境"

  SA_COG_event.00402.t: "一些猫猫鼠鼠的日常"
  SA_COG_event.00402.d: "在一处通往绮罗隐居乡的路上，可怜的小短腿鼠鼠从来没有感觉这个世界上还有这么难走的路，她这一趟下来遭的老罪都没有她以前干的工程那么“酸爽”，敏捷的绮罗不时回过头来，耐心地等着鼠鼠跟上。\n“我说啊，你们村为什么建在这么鬼远的地方？”鼠鼠很干脆地坐在地上，气喘吁吁地抱怨道。\n“是因为战乱的原因，曾经村长为了整个村子的未来，下令我们的村子往这些更加穷山恶水的地方里搭建，于是就变成这样了。”绮罗愉快地回答道，看起来她还很精力旺盛。\n“外面都已经变了那么久，没想过出来看看吗。”\n“不想动了呗，反正这里也不差，嘿嘿~”绮罗的耳朵一跳一跳的。\n“修你们这里的一条路真是倒霉，光是勘探就这么累死累活的了。”\n“行啦行啦，休息差不多就该动起来了，到时候到我家，我给你煮些好吃的！你一定会喜欢！”\n听说有美食招待自己，鼠鼠马上就跳起来了“好啊，好啊，我可喜欢你们绮罗做的美食了，你们的食物里好像放了魔法一样，令人着迷！”\n很快两人继续她们的勘探作业，并遐想着今天晚上吃什么了。\n\n而在森林的另一端，一只鼠鼠农民正用她那细细的嗓音同这些慵懒的绮罗们讲话，她原本是跟随商队贸易到此住宿几天的，绮罗们对人友善，很少见到的商队，她们便拿出了很多东西招待并同她们聊了许多，绮罗们发现商队里的她对农业似乎有独到的见解，便请教她怎么更高效地种植，怎么更好地给种子催芽、怎么育秧效果更好……于是鼠鼠便留了下来，在这片陌生的城镇孜孜不倦地教导绮罗们种植的知识。在明媚的阳光下，在房屋倾斜的阴影里，在这片田野的田埂上，鼠鼠和绮罗就这么排排坐地生活着。"
  SA_COG_event.00402.a: "学习大满足+5"

  SA_COG_event.00403.t: "灵巧的绮罗工艺"
  SA_COG_event.00403.d: "在绮罗隐居乡里，有许多工坊正如火如荼地加工着各种农具、家具以及衣物，绮罗出色的手工天分好像赋予了她们一双奇迹的手，将各种各样小材料，拼成优良甚至被人们称赞为传奇作品的工艺品，很多过往的商队乐意购买她们的手工品，而在其他地区的城镇，人们也喜欢在商店里转悠，去寻找那些带着绮罗一族手工制作留下“标记”的工艺品，这些精细的接缝，打磨光滑的表面，用色讲究的涂料，每一处小细节，都深深灌注了绮罗手工人的匠心精神。当然她们还喜欢在这些艺术品上留下一些俏皮的话语，来彰显她们对这份作品的满意和热爱。\n前来参加绮罗风筝节的游客，收到了一只友好绮罗赠送的小折纸，上面写下了：“在这件手工品上表现了木匠暹罗正一脸满足地完成她的小折纸的工作。小折纸上有被纹章装饰着的标题：《古老回声》。背景中的形体被压缩得更扁平，以让主体显得更突出。作品像是在借图像表达某种难以言明的观念。图像中所引述的故事是发生在1936年翠象6日的木匠暹罗制作小折纸的时光。”"
  SA_COG_event.00403.a: "这件价值连城的作品的诞生将很快为全世界所知晓"

  #泰南语6级（确信）
  #轻工业发展先

  SA_COG_event.00404.t: "萌螈的神秘宝典"
  SA_COG_event.00404.d: "繁忙的绮罗们在造纸工坊里生产所需的纸张，隔壁的印刷厂也在马不停蹄地工作着，机械印刷机“叮铃铃铃叮铃铃铃”地响彻耳边，工人将排版好的文章和精致的插图固定并制作成模板，通过在印刷版上涂抹味道刺鼻的油墨，然后放入纸张，沾染上油墨的模板在纸张上压制成清晰的文字和图画，再在之后进行修边和胶装，一本凝聚作者心血的书籍便可以畅销殖民地各处了。\n这时，一只绮罗推开工坊大门，从远方捎来信息，萌螈们希望通过使用我们的印刷技术和设备，从而大批量地去印刷她们的各种神秘宝典，这些神秘宝典的模板在她们的使用下总是频繁磨损、变形，形变在日积月累逐渐放大，一些插图的要领和细节逐渐丢失，而这些东西恰恰是这些宝典的灵魂所在，因此，绮罗们欣然接受了她们的请求，并按照严格按照原本一一雕刻出插画的一笔一划，当最后的成品展现在萌螈面前时，她们都赞不绝口，一方面是赞美她们栩栩如生的雕刻技巧，另一方面则是这些机械设备惊人的效率。萌螈们不停地翻动着书籍，脸上晕开层层霞红，眼神迷离，像是沉浸到书里描述的世界去了，对这些书爱不释手。绮罗们读不懂里面的字，觉得书里一定充满了十分令人心潮澎湃的故事，才让她们露出如此沉醉的表情。"
  SA_COG_event.00404.a: "小蝾螈爱读书"

  #小妹妹,我看你骨骼惊奇,必是练武奇才,将来维护宇宙正义与和平的重任就交给你了!我这有本《****》,原价138银,算你100银一本！他日若打通任督二脉，必成大器！（）

  SA_COG_event.00405.t: "另一种方式维持修行"
  SA_COG_event.00405.d: "很久以前，萌螈一族想要激发体内的螈力，就必须打通自身的脉络，激活自己身体的潜能以达到掌握螈力的程度。而在很长一段时间里，那汇聚了萌螈一族对力量渴望的药丸——运气丹，炼制之法向来见不得光。在古老的萌螈一族秘法中记载：以返魂炉焚炼妖兽或其他尸身，提取其中的真气；再导入通天鼎，与鼎中五行灵粉相激。死气化生，阴阳逆转，丹药方成。萌螈一族因此行走于正邪之间，为其他部族诟病，却无人敢轻慢，因为服用此丹者，可打通周身经脉，获得驾驭螈力的资质，继而掌握五行之一，更有雄浑灵蕴内藏于身，修行再无瓶颈。不过，在魅魔来到的日子之后，这些萌螈发现，鼠族和绮罗圈养着大量的牲畜，它们的数量足以供应她们庞大的修行所需，因此，现在的萌螈王庭更多是通过售卖特色产品来换取牲口来修炼，而不是抓奴隶来修炼，这些奴隶因此更多地转移到了生产的方向上。"
  SA_COG_event.00405.a: "我们有更好的修炼选择"


  SA_COG_event.00406.t: "清新可口的叶花糕"
  SA_COG_event.00406.d: "萌螈一族在很久以前就驯服了这些可爱的叶羊，它们不仅能驮运、易养殖还能产出美味至极的叶羊凝胶，很久以来，这种美食在古籍里的介绍都是“不分贵贱，皆以为美”。这种美食在更加贪吃的鼠族中间可谓是脍炙人口，老少皆宜，让人越吃越有劲。有时候，一些旅鼠商人来进货时，会因为嘴馋而吃掉其中的小部分，然后将货送到客户手里时，便撒谎道：“这个叶花糕和叶羊凝胶的单价嘛，就是有点高，毕竟人家卖那么贵嘛。”客户疑惑了：“我见其他人的报价不是这样的啊。”“这个嘛……”商人后来自己也觉得亏心，下次进货时偷偷多塞两块糕点给客户，算是“良心税”。"
  SA_COG_event.00406.a: "woc，叶！！！"

  SA_COG_event.00407.t: "科研大辩论"
  SA_COG_event.00407.d: "“学习那些殖民者的邪恶技术是错误的，它们会将我们塑造成如同曾经殖民者一般可怕的存在，腐蚀我们千万年来建立的辉煌成就。”\n“我们不是要放弃魔法。”绮罗代表的声音缓了下来，“我们从没说过放弃。魔法是我们从这片土地里长出来的东西，谁也拿不走。但是，我们也需要通过更好的技术去守护我们，技术从来不是只有毁灭的一面，千百只驮兽托运的货物，不及一节节火车一天的托运量，它们先进的制造机床让我们快速制造各种物品。”\n萌螈们还想着辩论些什么，于是她们找上了总督大人。想必重视魔法的总督大人一定也会支持她们魔法主导科研的地位的。然而，魅魔对于这种“两小儿辩日”般的争吵不屑一顾，她没有对任何一方发表什么只言片语，仅仅只是悄悄提高了在科研上的开支。"
  SA_COG_event.00407.a: "“她们自己会摸索出科研真正的方向的”"

  SA_COG_event.00408.t: "对各个部族领袖的小敲打"
  SA_COG_event.00408.d: "魅魔究竟想过什么办法去填补财政缺口呢？其实就是向各个部族领袖举债，这些平日里滋润生活在王国里王庭里的王公贵族老有钱了，她们活跃在魅魔统治秩序的真空下，并借此敛财无数，然而，这位昔日里总是不见人影的总督大人竟然上门拜访她们了，内容也很简单：“政府没钱，要点钱先垫付给宗主国，给不了的话，那没办法了，只能让宗主国自己来收了。”这下把部族领袖吓得不轻，她们可不希望平时“护”着她们的魅魔离开，便不假思索地把各种钱掏出来借给魅魔了。"
  SA_COG_event.00408.a: "“这样一笔保护费也不是很亏，对吧？”"

  SA_COG_event.00409.t: "魔界溪谷的铁路困境"
  SA_COG_event.00409.d: "火车与铁路这些东西，魔界溪谷领地里并不是从来没有过，在幻想乡和圣杯王国的合作下，曾经有些许铁路确实是进入了魔界溪谷境内，比如有一条从尼日尔方向跨过萨纳加河（魅魔改名为铁鼠河）进入铁鼠王国的都城的铁路，这条在德国人废弃的铁道基础上进行了修理，另外有一条联通南非与开罗，顺便路过涌泉旅邦，还有一条在德国殖民时期经过千帆港然后修筑到灵魔殿的铁路。那条经过涌泉旅邦铁路是以服务圣杯王国为主的，可以说对魔界溪谷的交通运输几乎没有任何帮助，而另一条跨过铁鼠河的铁路，虽然能用，但是这条铁路最初是为了象牙与橡胶而服务的，并不是为了殖民地的发展而建设的，宗主国的许多资源都依赖这条线路，从而也就将本地的商人们排挤了出去——宗主国的火车要运自己的东西，这也难怪为什么原住民们对于这些建在乡镇之外远远的火车站几乎一无所知，除了去那里上班的工人。而德国遗留的那条铁路，随着魅魔的懒政也几近沦落到废弃的地步，但旅鼠们组成的商队还是会走上这些铺开在大地上的大道——因为这些道路是先人用她们的尸骨从恶劣的环境、险恶的地形、致命的疾病等条件摧残下铺设的，这些来之不易的平陆路，弯弯绕绕，带领她们走过最凶险的魔界河和那最磅礴的高山。"
  SA_COG_event.00409.a: "那就修一条能够真正服务我们自己的。"

  SA_COG_event.00410.t: "《猫腻说法》的宏图大计"
  SA_COG_event.00410.d: "《猫腻说法》近日刊登了一篇绮罗作者撰写的长文，文章以极大的热情描绘了修建一条横贯魔界溪谷铁路的宏伟蓝图。作者用生动的笔触写下铁路通车后，深山的矿产、雨林的珍产、草原的皮毛将如何快速流向港口，换回机器、布匹和药品，还能让各族的特色产品高效地在殖民地里流淌起来，字里行间洋溢着用一条铁轨撬动整个殖民地命运的乐观预期。然而，这份热情并未在读者中引起预期的反响。鼠鼠们在传阅报纸后普遍持观望态度，她们对铁路的经济价值并无异议，但文章中对工期和成本的轻描淡写令她们疑虑重重。在她们看来，开山、筑基、铺轨所需的浩大工程，最终都将落在鼠族劳工的肩上，而“利润”却是遥不可及的远景。对于只求安稳挣口饭吃的普通鼠族而言，巨型建筑也带给她们一种不安的恐惧感，还要远离故乡去修筑那么一条铁路，这更像是一场前途未卜的冒险。萌螈王庭的态度则更为冷淡。在许多萌螈的记忆里，铁轨与火车是殖民时代暴力与掠夺的象征。尽管文章反复强调这条铁路将服务于各族自己的贸易，而非殖民者的资源输出，但“火车”这个事物本身的存在，便足以唤起她们的不安与抵触。至于绮罗一族自身，虽然她们拥有充足的技术热情和理想，却缺乏支持这项大工程的财力。开办工厂和购置设备耗尽了她们积累的财富，如今即使有再美好的计划，也难以凑出第一笔启动这个项目的资金。文章刊登后，虽在各地餐馆和集市引发了一时的讨论，但很快便湮没在日常的琐碎事务中。铁轨终究还只是停留在报纸上的一串文字。"
  SA_COG_event.00410.a: "也许现在不是时候……"

  #人类体型1.0（等效1.7m）、绮罗和萌螈以及龙娘0.9（等效1.53m）、鼠族0.8（等效1.36m）

  SA_COG_event.00411.t: "胎死腹中的幻想？"
  SA_COG_event.00411.d: "绮罗们坐在编辑部的阁楼里，桌上摆着算盘，身边堆着草稿纸，反复算了几遍后发现，即使省到不能再省，初期购置铁轨、火车、工具和人工的钱仍是不小的数目，而这些光靠她们绮罗的原始积累是根本做不到的——绮罗有很多的资金早已花在了开办工厂、购置工业设备、开展科研等方面。她们又一次地自然想到了向各个部族求助，但上次的无人响应依然历历在目，恐怕再刊登一次报纸，吹得天花乱坠铁路有多好，也难有不同结果。这一次，绮罗们不甘再停留于报纸上的号召，而是直接四处出击，向人们号召和宣传铁路的好处，同时她们也决定一步步来，寻找最合适的突破口率先切入，向人们展示铁路的力量。"
  SA_COG_event.00411.a: "这一次，我们不能失败！"

  SA_COG_event.00412.t: "先铺我们这段"
  SA_COG_event.00412.d: "绮罗信使在走廊尽头来回踱步，手里那份意向书已经被她揉搓得边角起毛。她深吸一口气，在脑海里反复演练着待会儿要说的话——这条路线的收益预期、沿线村落的资源禀赋、运量对比驮兽的数据优势。\n她推开会议室的门，矿场主和旅鼠商人们围坐在长桌两侧，每个人都瞪着大大的眼睛看着信使。信使毕恭毕敬地递上意向书，声音比预想中更紧。\n“这条铁路一旦贯通，矿石出山的运费能降到现在的三分之一，商队的周转时间也能缩短一半以上……”\n她完全不记得自己干了什么，只知道自己把那些背了一路的数字一口气倒了出来，然后退到会议室外，等待着里面的人做出判决。会议室的门重新关上，里面传来断断续续的争论声。信使僵着尾巴靠在墙边，指甲掐进掌心里。过了许久，门开了。秘书探出身来，朝她点了点头。她几乎是冲进去的。当她再次踏入会议室时，旅鼠商人代表率先开口。\n“我们算了账，这条线能走。北面的矿石和南面的货物，用火车拉确实比驮兽划算。”\n矿场主们也对其中的条款表示认同，桌上那份意向书已经被人用钢笔圈出了几行——条件被接受了，并向信使保证，她们会尽最大的努力，去发动那些地方老爷们为这项工程大开绿灯。信使愣了一瞬，然后拼命点头，声音里带着压不住的欣喜。"
  SA_COG_event.00412.a: "“谢谢各位！我们这边一定全力配合！”"

  SA_COG_event.00413.t: "王座空悬的会议厅"
  SA_COG_event.00413.d: "国王的肖像高高挂在会议厅最醒目的位置，但是那被珠宝与黄金打造出来的王座却空缺出来了，反而是王国各地的省督、伯爵与执掌官们将会议室挤满了，这些地方统治者才是这个王国真正的主人，她们肢解了中央的权力，分割了王国的领土，将这个王国变成了千疮百孔的破布。而现在，她们要开会商讨来自绮罗的铁路建设建议书，对于其中的土地占用、劳工调遣、后勤保障、利益分配等等议题展开激烈讨论，不过，早在这之前，矿场主和旅鼠商人们便向这些领主老爷们请示了，声称这是进一步充盈她们宝库的好机会，只需要老爷们肯贷款给她们，之后的利润与分红都不会少的，这些矿场主与商人们开出了老爷们无法拒绝的丰厚条件，所以铁路开工是板上钉钉的事了——到眼前的利益，谁不想要呢。至于，怎么修，怎么分配工作之类的事情，就要好好商讨了，谁也不希望自己成为最吃亏的家伙……\n“凭什么我们这里住那么多的人，铁路却不划过来！”\n“我们这里人手比较多，修近一点，效率也快一点……”\n“我们要负责这么一大块区域……”"
  SA_COG_event.00413.a: "这些人们从早争吵到晚，一条经过无数妥协的路线就这么出现在了地图上"

  SA_COG_event.00414.t: "铁路十八弯"
  SA_COG_event.00414.d: "路线确定后，地图被送到绮罗工程师手里。她看了一眼，愣住了。\n“这条线……为什么在这里拐了个弯？”\n“因为有个伯爵说，如果不从她的领地上过，她就不出劳工。”\n“那这一段怎么绕到山脚下了？”\n“因为有个执掌官说，她的地比其他人的平，应该走她那边。”\n绮罗沉默了一会儿。\n“但至少她们同意了。”绮罗拿起笔，在地图上描了一遍那条歪歪扭扭的线。“那就这么修吧,弯路也是路。”"
  SA_COG_event.00414.a: "“至少我们可以有机会动工了。”"

  SA_COG_event.00413.t: "家边的铁路"
  SA_COG_event.00413.d: "一大早，城市里的广场就被这些小小的鼠鼠们挤得水泄不通了，原来，是一只绮罗准备在这里发表演讲，号召鼠鼠们加入到建设铁路的队列当中。说实话，大部分的鼠鼠们对于修建铁路这么个庞然大物是比较害怕的，这些采取了闪耀世界文明标准（原住民称呼欧洲为闪耀世界）的建筑在规模上比起她们建造的道路与房屋还可怕，曾经德国为了修筑千帆港-灵魔殿一带的铁路，就有数不胜数的鼠鼠葬身于枕木之下，现如今，绮罗们就要顶着这番历史负担和财政压力，去打动这些鼠鼠们的心。\n“朋友们！我向你们保证！这条铁路的修筑条件和待遇绝对会比以往的那些好上千万倍！我们绮罗一族抵御疟疾等疾病的猫薄荷会定期供应给大家、趁手可靠的工具也会由我们提供、工资也会如我们宣传的那样按时按量地分发，当然，这条铁路并不是在那些山沟沟里修建的，而是在平原上，就在你们的城市外面的那一片空地。”\n绮罗凭借她那善谈的性格，持续地打消着鼠鼠们心中的顾虑，越讲到后面，人群就越躁动，大家开始七嘴八舌地同同伴一起交谈，开始商量着要不就这样加入了。\n“我！我想要试试！”一只小手率先在攒动的人群中立起，很快，也有许多小手也升了起来，不过，也有好些人对此犹豫不决，决定观望这次项目。"
  SA_COG_event.00413.a: "至少我们做好了开头，万事开头难嘛"

  SA_COG_event.00414.t: "神奇的翠玉竹"
  SA_COG_event.00414.d: "绮罗认为，那翠玉竹是她们在殖民地里建设铁路时当成枕木的最佳材料。古文曾记载道。\n“林中有竹，其名‘翠玉’，质坚如铁，轻于常木，浸水不腐，置地不蛀，夜发冷光，流萤绕之。”\n现如今，这些旺盛生长在密林当中的翠玉竹几乎广布于萌螈王庭的天南地北之处，没有哪个萌螈不爱那摇曳的翠玉竹装饰她们身边的风景。不过今天，溪边的竹林旁，一只绮罗和一只萌螈看着眼前的竹林，这些翠玉竹即将被砍倒并运往他处，做成名为“竹枕”的东西。要想让萌螈一族让出这翠玉竹可花了她不少功夫。\n“你的意思是……你要把我们热爱的翠玉竹拿去建设火车？给那些殖民者乘坐的交通工具？”\n“确实是建设火车不错，但这主要是造福我们各个部族的，你想，这些火车燃烧时释放的蓬勃力量可以驱动很重很重的货物跑到很远的地方，这是有利于我们各部族之间的贸易往来的，百利而无一害，和之前那些殖民者的肮脏行径没有半分钱关系！而且……”\n绮罗又凑近了那萌螈行商说道。\n“我们还可以提供许多农家肥，保证你们种出来的翠玉竹又大、又亮、枝条又密。”\n眼前的萌螈思考良久，才从嘴里挤出一个字。\n“行……”\n"
  SA_COG_event.00414.a: "“合作愉快！”"

  #论在不违背环世界萌螈设定并迎合钢铁萌心世界观下的翠玉竹能够在铁路工程建设方面优化原有的枕木使用的可行性
  #为了论证翠玉竹被人们调用来制作竹枕从而替代枕木在魔界溪谷建设的合理性，我考察和创作的依据在于文本描述而非游戏体验，虽然翠玉竹片的耐久度和老化速度在游戏表现上差于原木，但是进行更多的对比时，我们会发现环世界将会充满泰南特有的幽默可燃铁和超轻铁（铁的重量0.5kg而原木为0.4kg）之类令人啼笑皆非的笑话，比起随心所欲填充的数值，文本描述一般不会偏离物质本身的真正模样太多，因此结合“翠玉竹坚硬、喜欢湿润环境”再结合萌螈一般生活在潮湿的地方等等情况，又有翠玉竹片的利用途径应该不至于玉琼粉和镶金纤维，因此，我们可以适当套用现实当中竹子的体验和表现，再在文本的描述基础上进行一波适配……所以，就有了竹枕（迫真）魔法的事情你少管（）

  SA_COG_event.00415.t: "施工现场"
  SA_COG_event.00415.d: "采矿业开山开矿采出的石头被打碎成碎石，成吨成吨运到施工现场，从萌螈王庭成捆成捆运来的翠玉竹放在一旁，一些熟练的木工将其削平顶面并弄出适当的平面，尽量不破坏原有的竹子结构，从而更好地安置铁轨并钉上道钉。年轻的鼠鼠在扛完一大捆竹子后，便累倒在了一旁草地上，眯着眼睛，感受太阳照在自己身上的温度，本来只是想休息一会，谁知当她起来时，日头早已偏西，碎石堆矮了一截，枕木又往前铺了一小段，她本来以为自己会被很多蚊虫叮咬出很多红疙瘩，但是她的皮肤仍然好端端的，看起来那些绮罗分发的猫薄荷真的驱赶走了那些讨厌的蚊虫。收工的哨声从工棚方向传来，鼠鼠们陆续放下手里的活，有人沿着路基往回走，有人还在敲最后一颗道钉，她悄悄爬起来，拍掉沾在衣服上的草屑和种子，混入了收工的人群里。明天天亮，工程还要继续。"
  SA_COG_event.00415.a: "“白天睡那么死，这下晚上睡不着觉了……”"

  SA_COG_event.00416.t: "铁路在此合拢"
  SA_COG_event.00416.d: "这一天又是一个炎热的日子，太阳光透过草帽，将令人头晕、恶心的阵阵热感传递给这些工人，鼠鼠们早已在早上就变成了湿哒哒的家伙，而到了正午时分，这样高温的情况就更恶劣了，鼠鼠们热晕了脑袋，只是一味地扛东西、削东西、钉东西。\n“喂！我看到那段（旧）铁路了！”\n此言一出，沉默的劳工队伍便爆发了巨大的欢呼声，这意味着她们搭建铁路接入旧铁路系统的任务即将圆满完成，果然，眺望铁路未闭合的方向，遥远的天边，有两条绵延千里的铁轨沉默地躺在那，不过鼠鼠们没有太多时间去兴奋，她们很快又恢复了劳作的姿态，最后，在那两道铁路终于汇合在一起成为了Y形结构，鼠鼠们再一次爆发了兴奋的呼喊，她们喊着、叫着，打算在领到工资之后畅饮一番，痛快地享受来之不易的财富。"
  SA_COG_event.00416.a: "这套铁路系统正在慢慢复活"

  SA_COG_event.00417.t: "庞然大物"
  SA_COG_event.00417.d: "从不曾见过火车的鼠鼠们现如今挤在海港外，观看海港上耸立的岸吊将一那事先被技术人员们用厚重的特制钢缆从机车底盘下穿过，并与岸吊的钢钩紧密连接的火车头从货舱中稳稳吊起，经验丰富的操作手专心致志地观察着货物的状态，让这个庞然大物缓缓地下落，最后平稳地落到了早已建成的铁轨上，早在一旁等待的机械工们，开始“唤醒”这个庞然大物——她们向其中加入煤和水，并全方面地检查火车的情况，待到一切就绪后，这台飘洋过海的钢铁巨兽鸣响了汽笛，用轮子驱动着自己驶向了殖民地的腹地。"
  SA_COG_event.00417.a: "“方圆几里都听到了它的轰鸣声”"

  SA_COG_event.00418.t: "强劲的“大家伙”"
  SA_COG_event.00418.d: "如果说曾经的那些商路是魔界溪谷的毛细血管，现在开辟的铁鼠铁路简直就是流量惊人的大动脉，原本靠仓鼠大王、马儿或者手推车运输的货物，现在全都被打包进了这些宽敞的货箱里，待铁路工人将车厢全部连通在一起后，火车头的机械工开始马不停蹄地向煤炉里加入煤，炉火渐渐烧得旺盛，沸腾的炉水化作蒸汽，推动着活塞做起往复运动，进而牵一发、动全身，让这头静静躺在车站里的大家伙开始在铁路上缓缓开动。汽笛声“呜呜——”地鸣叫了几回，列车即将驶出火车站，在6个小时内，它会从吱吱大矿山出发，并到烈阳村办事处——那里是距离绮罗隐居乡最近的旅鼠城邦了，火车将会在那里卸下生铁，最后那段里程还是得靠旅鼠们托运过去——因为绮罗们住得地方不是很好修路，不过在下一期铁路工程计划，绮罗和鼠族的联系纽带将会彻底完成。而且现在这样一条铁路带来的效益已经初见端倪了：鼠族们发现，肥料、农具、隔壁村的美食甚至绮罗们制作的佳肴更多地被带到她们身边，商店里的东西变得更加琳琅满目。当然，更重要的是，曾经遥远的他乡变成了在车站板子上一条简单的数字和价格，只要一两顿饭钱，她们就可以快速地旅游到那里。踏入巨大的车厢里，好多好多鼠鼠挤在一个座位上，然后惊喜地看到当火车开动，车厢轰隆隆地震动时，窗外的风景在眼前快速地向后退，毒辣的阳光被车厢挡住了，呼啸的风儿迎面打来，凉凉的。可还没等她们看够沿途炊烟袅袅的乡镇、攒动的兽群、辽阔的草原、稀疏的树林，她们就被告知："
  SA_COG_event.00418.a: "“到站啦！”"

  SA_COG_event.00419.t: "技术工人的培养"
  SA_COG_event.00419.d: "“你…你说什么？我被解雇了……”秘银盾难以置信地听到了老板将她开除的话语，她在商队里总是勤勤恳恳地工作着，她从来没有超出过发货期限，也没有弄丢、给不够人家指定的货物，而现如今，她却面临了被解雇的局面。老板见她的耳朵逐渐耷拉下来、神情愈发地颓丧，便干咳了几声。\n“实际上，绮罗她们还给我们提供了一些合作项目，说是为了那些因为运输业发展而失业的人着想的。”老板拎出一沓纸，有一份文件上赫然写着“关于培训铁路工人事务的合作事宜”，秘银盾感觉奇怪，便接过老板递来的文件，大概翻看了几眼。\n“额，老板…我应该不太适合这“铁路职工”，没见过……”\n“哈哈，这职工就是操作、维护火车的，之前确实在我们这里火车没见过多少，更别说铁路职工了。不过，这个工作绝对不会比你在那崎岖的商路累太多的，而且人家还给你培训，我相信你行的。”\n“好吧…我尽量……”\n"
  SA_COG_event.00419.a: "秘银盾继续盯着那张纸，虽然她根本没看懂上面的几串法文"

  SA_COG_event.00420.t: "推进在鼠族的学校教育"
  SA_COG_event.00420.d: "绮罗一族的人口始终是她们发展产业、经济的最大阻碍，没有足够多的人，就没有丰富的资源，没有足够多的人，那些劳动力密集型产业就没有办法开工，没有足够多的人，就没有更大的市场去拉动消费和经济增长……于是，绮罗便打算在铁鼠王国境内开设学校等教育机构，希望能够以此提高劳动力的教育水平，从而使得她们能够招揽到更多技术工。"
  SA_COG_event.00420.a: "此举有助于解决我们国识字率问题"

  SA_COG_event.00421.t: "学校教育的曲折"
  SA_COG_event.00421.d: "然而，这样的计划在落地前发生了一点小意外：原本，绮罗是打算在铁鼠王国都城——光辉宫殿，这座人口最稠密、经济最好的地方开办学校，结果，许多领主了解到后纷纷向绮罗投诉并阻挠，她们的理由如下：学习这些知识的鼠鼠们可能更容易闹事、被殖民者再次煽动，从而有害于社会秩序。一些则是私底下说某某领主可能借此发展一波自己的势力，建议不要在那里安置学校。甚至有一些直接就是威胁绮罗不要试图用这样的方式来渗透、危害我们。"
  SA_COG_event.00421.a: "“怎么比上次合作还麻烦那么多……”"

  SA_COG_event.00422.t: "学校教育的小插曲"
  SA_COG_event.00422.d: "虽然执行过程遭到了一点小插曲，但是总体上学校教育还是在铁鼠王国境内平稳地落地了：首先，绮罗在铁鼠王国都城——光辉宫殿，这座人口最稠密、经济最好的地方开办学校，然后再选择那些其他大城市，这样不仅能更快地培养出大量拥有一定知识基础的工人，还能保证她们的资源最大利用化，不过，在这个过程里，有些领主对绮罗的措施仍然有所猜忌，但是在经过了绮罗们的宣传后，也勉强认同了这些学校教育，但提出对其中的部分内容进行适当地修改。"
  SA_COG_event.00422.a: "“总体上来看，是蛮顺利的”"

  SA_COG_event.00423.t: "学校教育的顺利推行"
  SA_COG_event.00423.d: "学校教育在铁鼠王国境内几乎没有任何阻碍便落地了——因为原先那些分裂、落后的领主们要么早已被裁撤、替换，剩下的都是对先进制度支持或者睁一只眼闭一只眼的态度了：首先，绮罗在铁鼠王国都城——光辉宫殿，这座人口最稠密、经济最好的地方开办学校，然后再选择那些其他大城市，这样不仅能更快地培养出大量拥有一定知识基础的工人，还能保证她们的资源最大利用化。领主们调配了最充分的资源与最合适的配置去支持绮罗政策的落地，也让那些失业的鼠鼠提供奖金支持她们进去就读，因此，相信不久，就会有大批大批合格的工人从学校里出来，然后投身于我们国家的工业发展了。"
  SA_COG_event.00423.a: "“这次的合作特别顺利！”"

  SA_COG_event.00418.t: "横穿魔界溪谷东西方向的大铁路"
  SA_COG_event.00418.d: "铁路合拢的那一刻，魔界溪谷的东西两端终于被铁轨连在了一起。这不是殖民者规划的那条向外输送资源的路。那条路——通往港口、通往宗主国、通往永远填不满的贪婪。这条新路是鼠族为促进货物贸易开始铺的，虽然萌螈族起初对于新技术的应用略显抗拒。从各种旅鼠城邦出发，穿过雨林，翻过丘陵，一路向东，直到雨林深处的萌螈王庭。铁轨铺得不快——鼠族的小短腿在泥泞里踩了无数个来回，枕木一根一根地扛，道钉一颗一颗地敲，好在这些枕木都是由。火车喘着粗气，拖着长长的车厢，在雨林深处缓缓穿行。车头上堆满了源翠石——那些在暗处发光的矿石，从荧光森林中挖掘出来，被一车一车地送往萌螈的王庭。虽然萌螈对于这些仿佛象征着“殖民”的火车头略感反感，但是她们又需要它们。这些源翠石，是用来研究的，魅魔对它们的魔法波动很感兴趣，萌螈修士也想知道，这些石头里到底藏着什么。而在往回开的火车上，装的是美食。萌螈的厨艺虽然不能算是炉火纯青，但她们食材的丰富多彩性从来不会让人失望——新鲜的菌子、可口的叶羊凝胶、还有鲜嫩多汁的萌螈尾巴（兴许是某个倒霉蛋被割下的尾巴），咬一口满嘴都是雨林的味道。"
  SA_COG_event.00418.a: "“呜呜——轰隆隆隆————”（火车开出站台）"

  SA_COG_event.00419.t: "挤上火车"
  SA_COG_event.00419.d: "在国家西北方向那些较为干燥的热带草原地区上，便是鼠族各种城乡星罗棋布的天地，如果是以前，这里是鼠族祖先游牧时奔驰而过的一角，现如今，鼠族凭借着他们积累的农业经验，在这残酷的草原气候下成功扎根生活下来，飘忽不定的雨被鼠族们锁死在堆砌的水库里，变成了温柔呵护田地的仆人，糟糕的土地环境经过世世代代的改良，辛苦栽培的植物也终于是结出了丰盈的果实，现在，从绮罗隐居乡方向开来的列车驶入了鼠族车站，列车的汽笛声响彻天空，人头攒动的人群挤在站台上，热烈“欢迎”列车的到来，不等列车停稳，上面堆放的农具与肥料被迫不及待的鼠族们抢购一空，很快火车便空了出来，过了一会，许多鼠族涌入了空荡的车厢，还有一些没买着座位票的竟然攀上了火车外围或是坐在了车顶上——这在当地眼里并不奇怪，鼠族虽小，可是人却很多，除了附在火车上就没有更好的办法解决这档子事了，他们很多是准备外出工作的还有一些做生意的，小小的背包里装满了她们的衣食住行的一切和她们对未来的希望，其中，一只鼠鼠与其他乘客背靠着背睡着了，她做了一场梦……"
  SA_COG_event.00419.a: "她在一张大床上惬意翻滚"

  SA_COG_event.00500.t: "边境的不速之客"
  SA_COG_event.00500.d: "某日早晨，处于万穗王庭——一个萌螈建立的王庭境内，当地边区的地方武装向政府报告了一群慌不择路的革命者闯入了殖民地。某天夜里，巡逻队在黑暗的雨林深处发现了摇曳的灯火，于是她们便戒备了起来，她们潜伏在灌木之后远远地监视着，屏息凝视这些灯火的动向，零落的灯火绘制出了大概的长蛇队形，这条长蛇缓慢地横穿雨林，机械的轰鸣声隐隐约约传入耳中，这条长蛇最终盘旋在境内的一个偏僻角落休整下来了。边境巡逻队拿不定注意，便层层上报请求指示，直到传到了王庭公主那里，公主思索片刻，便决定向魅魔总督请示。"
  SA_COG_event.00500.a: "“这些事情我们自己不太好办理”"

  SA_COG_event.00501.t: "闲着也是闲着"
  SA_COG_event.00501.d: "虽然对罗德西亚的事情早有耳闻，但魅魔没有抽出哪怕一点心思去在意过自己小天地之外的殖民地，“用手捂住火吗？有意思。”她便丢掉了那些写着有关于罗德西亚的报告。一天早上，办公桌上的部长报告终于不是空白的了，因为魅魔在上面挑了几个好听的名字就填了上去，原本应该在年初敲定的各部门部长，名单到了第二季度才被魅魔敷衍好。既然部长的安排搞定了，她决定奖励自己……好吧，其实是放空自己，看着单调的天花板，继续打哈欠一整天。这时，熟悉的官员推开了门，向她报告了一件特别的事情：有一支革命军来到了我们殖民地境内，目前正在一处地方休整呢。"
  SA_COG_event.00501.a: "“外来的革命者？正好我也闲着没事，去看看什么个情况吧”"

  SA_COG_event.00502.t: "行将崩溃的溃军"
  SA_COG_event.00502.d: "从重重包围中突围的革命者，惊喜地发现殖民地的武装从尾巴后消失了，一个队员告诉领袖，应该是她们走入了别国的殖民地的缘故，也就是魔界溪谷境内，才导致了罗德西亚军队的追击消失了。但是，这也意味着她们要面对新的不稳定因素——新殖民地主人的考虑了，出于对殖民地的安全考虑，她们身为革命者这种仓促越境的行为是相当危险的，她们判断，她们的附近很快就会被新殖民地武装围得水泄不通。因此，革命者领袖——奶酪窖即刻下令简单休整的革命者军队重新绕回罗德西亚，打算在两国穷山恶水、泥泞不堪的边境线艰难转进，望着身后因为油料枯竭趴窝的钻地机——这些没有燃油又没有技术工人维护的笨家伙根本就是累赘，奶酪窖下令：放弃这些“铁棺材”，撤走里面所有的物资，用她们的双脚，在雨林里行军。革命者们沉默着，无奈地继续她们那望不到希望的征程，她们心像无根的浮萍在暴雨中沉浮、淹没。"
  SA_COG_event.00502.a: "“我们要流窜到何处？”"

  SA_COG_event.00503.t: "雨"
  SA_COG_event.00503.d: "雨林的雨没日没夜地倾倒下来，原本计划行军的计划被迫暂停，革命者们被迫龟缩在钻地机或者高大枝叶下，雨水打在铁板上发出令人鸡皮疙瘩的噪音，她们看着泥巴路浸泡着水变得更加浑浊、泥泞，坑坑洼洼的水坑连成更宽大的水坑，潮湿的环境深深打击了每个人的士气。奶酪窖没日没夜地盯着那些沾满水渍的手绘地图，希望在这些线条里找出最合适的路径，让她们脱离这片绿色地狱。突然，奶酪窖内心深处涌上一股暴躁的冲动，但她还是凭着她的责任心，压制住了这股怒火，她实在是太疲惫了，她推开钻地机的舱门，想在外面走走。外面还在下雨。"
  SA_COG_event.00503.a: "我不能再待在里面了……我得散散心……"

  SA_COG_event.00504.t: "猝不及防的相遇"
  SA_COG_event.00504.d: "当奶酪窖走出钻地机时，外面的世界被湿漉漉的雨水填满了，呼吸带着浓烈的土味，潮湿的空气让鼻子难受极了，啪啪声从脚底下传来，奶酪窖在路上留下了一个又一个脚印，又很快被雨水抹平了痕迹。她精神恍惚，不断在四周徘徊，突然，她朦胧的视线里突然出现一个好像也站在雨中人影，“还有人和我一样出来透透气吗……”，奶酪窖认为那应该是一个被痛苦打击的可怜人儿，需要好好开导开导，于是便向她缓慢走去：“同志，你看起来快被压垮了，有什么我能帮你分担的苦心事吗？”，然而，当她走得更近时，近视的双眼开始捕捉完全部的视觉信息，模糊的人影终于清晰了许多，奶酪窖僵住了，一个着装怪异，长着一双乌黑翅膀，悬空的身影望着灰蒙蒙的天空，她转过头来，绿色的眼眸打量了她的全身。"
  SA_COG_event.00504.a: "“你……什么人！”"

  SA_COG_event.00505.t: "奇怪的对峙"
  SA_COG_event.00505.d: "手枪瞬间从腰间抽出，奶酪窖的双手颤抖地瞄准着这名“不速之客”，这场无声的对峙让她的神经绷到了顶点，“同志们！有异常情况！同志们！”，声音被雨水打碎，零零散散的声音根本没有呼唤来任何的伙伴，而魅魔仍旧悬浮在原地，静静地观察着小老鼠的一举一动，见同伴不来，眼前的人沉默，奶酪窖感到空前的压力，一边后退，一边壮着胆子喊道“你，是这片土地的居民吧！我们无意打扰你们的生活，只是暂时经过这里！”，居民？说实话，奶酪窖说出这个词的时候完全没有底气，但她还是希望她真的是一个“居民”，仅此而已。不断后退的她背后突然撞到了舱门，于是快速打开舱门躲了进去，关好门后她从窗口往外张望，“不速之客”原本待着的地方只剩下了一群灌木和水坑，雨点击打的树叶在空中摇晃，水坑跳起一个又一个水花。\n她焦急地走到地图前面，想要赶紧规划一条路线离开这里，然而，当她走到地图前，她被更离奇的事情震惊了，眼前的地图，完全没了水渍，地图上亮起了微弱的荧光，这些荧光组成了一个弯曲的箭头，从她们的所在之处开始，绕过群山和雨林，走在道路上，直到它指到了一个被大荧光圈抱住的区域。"
  SA_COG_event.00505.a: "“这究竟是怎么回事……”"

  SA_COG_event.00506.t: "紧急会议"
  SA_COG_event.00506.d: "奶酪窖将所有的高层唤醒并紧急开了一场会议，人们对于这张闪着荧光的地图深表惊讶，可以肯定的是，这地图的反常绝对是那位“不速之客”的手笔，高层对于是否跟着这条箭头的指示展开了讨论，有人认为这可能是新殖民地的把戏，为的是将她们全歼，而大多数则认为殖民者完全没有必要整这一出直至自己内地的箭头，这些箭头不是穿过高山和雨林，而是在道路上，这不可思议的。奶酪窖的脑海里不断回想着那位“不速之客”的身影，于是大伙一起投票，在投票表决的时刻，奶酪窖念出了她和许多人选择的……"
  SA_COG_event.00506.a: "“绝大多数人，同意按照地图的指示去走。”"

  SA_COG_event.00507.t: "宽敞的大道上"
  SA_COG_event.00507.d: "她们从来没有在这么平坦的道路上行走过，即使在罗德西亚，她们往往也是被迫在地底下钻洞，在远离文明的蛮荒之地行进。这条长蛇不再缓慢地在大地上蠕动着，她们开始用数倍于之前的速度，在道路上快速的穿梭。路上能够隔三岔五看到一些商店，虽然没有钱，但通过友好的交涉和她们曾经洗劫矿区拿走的矿产，还是能让革命者以物易物的方式换来极其宝贵的物资，比如燃油、衣服、食物之类的，偶尔她们会在路上碰上一些商队和村镇，她们邋遢破损的着装有时候会被当地人笑话一番，但过后还是会拿出多余的食物和衣物招待她们，或者干脆让她们在家里稍作休整，有些孩子会兴奋地爬上她们的钻地机——这些家伙奶酪窖最后还是没有放弃，老人则围着这些铁堡垒打量，而年轻人……她们正生气地向这些外人指责这该死的大块头把她们修的道路压坏了，从那以后，钻地机都尽量不在道路上行驶了，虽然如此，革命者们的士气高昂到了前所未有的高度。"
  SA_COG_event.00507.a: "革命者今天睡得死死的，平日拽在身边的武器都收好来了。"

  SA_COG_event.00508.t: "新家园"
  SA_COG_event.00508.d: "“闲置区”，这片被魅魔划给革命者的土地在官方的名称，魅魔曾经想过在这里建设点什么，后面便不管不问了，随着殖民地人口增长，这里开始陆续迁入各种部族，直到革命者到来之前，这里凭借靠近海港、地形平坦的优势逐渐建设起各种各样的新村、新镇。当革命者们来到这里时，她们发现这里不像其他区域比较部族分明，这片“闲置区”里的人杂居和开放的程度远远胜过其他地方，因此，当地人对于她们的到来表示欢迎，并贴心地指出还有哪些地方还可以建设起聚居区，哪些地方靠近马路、靠近集市，于是，革命者开始凭借自己的特长和优势，开始她们在新的天地的新生活了。"
  SA_COG_event.00508.a: "“这地方要改名字吗，算了还是叫‘闲置区’吧”"

  SA_COG_event.00509.t: "新生活"
  SA_COG_event.00509.d: "“你们是干矿工的，是吧？听盐风旅邦那里正在招募矿工，正好离这里不远。”\n“嗯……不错，我们之前确实是干下矿的活，”\n"
  SA_COG_event.00509.a: ""

  SA_COG_event.00600.t: "奇怪的骚动"
  SA_COG_event.00600.d: "虽然来自罗德西亚的叛乱新闻天天都刊登在《猫腻说法》上，但是上面刊登的内容往往不是哪个种植园或者矿场发生罢工、就是哪些村镇不满统治爆发游行示威甚至起义、或是哪里的原住民被殖民者残酷地镇压下去了，魔界溪谷的人们早已对邻国动荡的政治环境习以为常，对于罗德西亚发生的一切变得越来越不敏感。又是一个对于魔界溪谷人们来说平凡的清晨，一只鼠娃儿，摇摇晃晃地站在街边，她的好朋友做起了送报纸的兼职，今天恰好就是她兼职的日子，她便特地早早站在路边，伸长了脖子眺望天边的小黑点，希望那就是她的朋友，小黑点。过了一会，她的朋友真的从那模糊的点点变成了近在咫尺的人儿，正气喘吁吁地跑向她呢。\n“喂，风信子，你不是说你每天鸡鸣的时候就能够起床，然后把报纸什么的在太阳高过那座山时送完吗？”\n“嘿嘿，这可不是我睡懒觉呢，是绮罗她们打印这些报纸犹犹豫豫的，拖了好一会的时间呢。”说罢，便将一叠报纸抽出、并精准地丢在她的好朋友手里。“这报纸免费给我呗~”\n“那你把我剩下的这一沓报纸送完。”\n“不行，我懒~”\n朋友间的闲谈很快就结束了，于是鼠娃儿便回到家中去了。当鼠娃儿像往常一样把报纸递给家人时，她们如往常一样慢慢阅读起了报纸，当然大伙基本都是为了看报纸左侧那一大块“边缘世界笑话”，而关于时政方面之类的新闻则是草草翻阅便可，只不过，这一次，她们在大大的标题上读到了一句话“一支罗德西亚政府军昨日覆灭于xxx地区”。"
  SA_COG_event.00600.a: "“也许是报纸印错了……？”"

  SA_COG_event.00601.t: ""
  SA_COG_event.00601.d: "“”"
  SA_COG_event.00601.a: ""

  #“明明铁鼠王国距离前线很远，但是，越来越多奇怪的报告，诸如人员消失、异常的噩梦、超凡的能力出现在了魅魔的办公室前，如果是以往她完全不会管太多——倒是超凡的能力会去看一下。然而，当下正好是和一种超凡力量战斗的时刻，这些一份份的报告很难不和正在发生的灾害扯上关系，魅魔建设的军队被强硬要求前往指定地区展开调查……不出数日，军队就紧急报道了击毙一只血肉兽的事件，当地的领主还刻意阻挠了我们的调查和追责……领主的军队被魅魔军队和其他领主的支援部队击败，领主本人也遭到控制，但是她突然发生血肉畸变，失去意识，最终化作一个怪兽并被打死……军队在堆积如山的金库一角发现了一处暗道，下面通往了一处废弃设施，里面有许多早已腐烂的尸体，空气中弥漫一股恶臭，有许多发黄发霉的文件和老旧设备被发现，据一名守卫叙述：这里曾经不是金库，而是一个奇怪的房间，有很多官兵进出，说是运送必要的物资对抗殖民者，后面才变成了“生人勿入”的金库，除了金银财宝出入以外就没有什么事情发生了……废弃设施的入口曾经被封死，入口处有许多明显的划痕和打击痕迹，也许是这些死者尝试在向外逃跑，其中一些人的装备是领地护卫的款式，盔甲上的布料和涂料早已腐蚀殆尽、只有生锈的外壳仍然抱住主人，而其中很多已经变成裸尸，也许衣服早已随时间腐化了……对发黄发霉的文件进行艰难的复原失败了，时间跨度太长了……领主的房间角落内发现一处保险箱，撬开后确认，该秘密空间系早年间与德国殖民者共同搭建的兽族基因研究中心，大量珍贵资料、数据、设备构造在其中完好地保存着！”
  
  #“那些文件被保存得太好了。不像是‘忘记销毁’，更像是‘留作备用’。也许领主早就知道，总有一天，这些东西会成为她的护身符——用骇人的秘密，换自己的命。但她没等到那天。或者说——她等到了，但不是以她想要的方式。”

  ####1~ ~ ~ ~系列事件 幻想乡专员介入 有没有一种可能，用数字区分，这样写有点神经病了？写成英语更省事易懂……算了项目经验+1
  #幻想乡还有谁会比较适合当这个专员？神绮？会更闹腾的吧，魔理沙？这确定不是把人家流放了吗，等等……那能说人家魅魔就是挨流放了吗（）

  #不要双线作战，死得很惨的说

  #SA_COG_event.10000.t: "宗主国专员的到来"
  #SA_COG_event.10000.d: "经过数日的飘洋过海，一艘从幻想乡出发的小邮轮缓慢驶入千帆港港口，甲板上，专员在甲板上迎着朝阳和海风的沐浴，眺望着逐渐显现在眼前的千帆港，比起祖国繁荣的大港口，这样的小港口确实稍有逊色。这个地方就是她之后要服务的地方，她在心里想着，在正式就职专员之前，她已经进行了相当多的准备工作，包括但不限于：查找殖民署机构里各种各样有关魔界溪谷的文件，比如相关档案和魅魔的个人简历以及报告，档案上对魅魔的评价是：“治理能力……存疑。但殖民地稳定，无反抗记录。”她还接触了各种同殖民地打交道的商人与企业，还有那些曾经去过魔界溪谷生活的官员。自然，专员也没有落下那篇意义重大的秘密报告。可以说，在她踏上这片土地之前，她已经对于治理这片殖民地的困难和复杂有七八成的了解了，但是，她自己心中也早有一套与之相对应的解决方案。\n她是胸有成竹地来到这片土地的。"
  #SA_COG_event.10000.a: "“我将履行作为幻想乡专员的职责”"

  #SA_COG_event.10001.t: "简单的交接仪式"
  #SA_COG_event.10001.d: "专员乘坐马车，经过漫长的辗转，之后到达了幻魔殿，魅魔早已在此等候多时了——当然，她只是像往常一样坐在那打发时间，当她进入总督府时，这宏大而又奇妙的建筑令她感到意外，虽然早有耳闻，但是她头一次见到用荧光真菌打扮的方式，呈现出来的荧光闪闪的视觉效果是何等震撼的奇观，走廊并不长，但是周围漆黑的墙壁好像容纳下了整个宇宙，数不尽的星光点点在墙上闪烁，一种奇妙的感觉萦绕在身旁，当她轻轻敲门，然后在得到魅魔的允许后打开门时，魅魔正用手支着头看天空，她正目不转睛地盯着天花板，没有起立问好和寒暄，就这样把专员迎进来了。\n“尊敬的魅魔总督，我到此是作为幻想乡委派的殖民地专员特来协助你办理殖民地事务的，我希望我们之后能够合作愉快。”言毕，专员便轻轻向魅魔鞠躬。\n“嗯。”魅魔还在盯着一个地方，那里只有虚无。\n“为了更高效地治理殖民地，未来，我会制定一系列的政策和措施来……”\n“我不在乎那些，你做你的，我不管”魅魔难得地说出那么多的话，“只要你，别影响我研究魔法。”\n“这样的话……”专员轻声笑道：“那我就先告辞了，之后我的布局绝对不会影响到总督大人的雅兴的。”"
  #SA_COG_event.10001.a: "魅魔默许了专员的治理"

  #SA_COG_event.10100.t: "新税法引起的不满"
  #SA_COG_event.10100.d: "上位的殖民地专员很快就展开了她的部署和计划。首当其冲的就是出台各种各样巧立名目、更加繁重的税法，这些税法上的署名还是有魅魔的名字，并在角落多出来了一个群众们不认识的名字。当然这些缴纳数目相比以往不是很夸张，但是也能够让人感到一丝丝不舒服。这些税法的落实很自然而然地落到了各地广泛就职的绮罗官员手里，这些绮罗官员可以说是进退两难，不推行这些政策可能会导致她们丢掉工作，专员早就从幻想乡带来了几位“顾问”，并接纳了一些幻想乡失业人员，随时可以接替不配合的绮罗官员，而咬牙执行这些政策，又会招致群众的讨厌和反感：毕竟你们这些官员的俸禄不就是来自政府的吗？你们是和政府是一伙的。\n在税法推行的头几周里，在各地的政府机构门前，总是聚有相当的群众和对峙的绮罗官员，绮罗们即使费尽三寸不烂之舌也无法说服这些群众们政策的合理性和正当性。群众们的声音充斥着:“以前都是收咱们一成的，怎么现在多出一半来了？”“你们这些坏猫种不能通融通融吗……”绮罗们面对群众的逼问也无从下手，因为上面下达的指标就是这样，她们不推行好，挨开除的就是她们。就这样，大伙在一天天的争吵当中不欢而散。\n在群众的认知里，魅魔已经很久没有推行过什么政策了，这些日子逐渐推出的政策，指不定就是绮罗们自己拍脑袋想的，想让自己在大家都困难的时候，过得更滋润！"
  #SA_COG_event.100100.a: "“绮罗们是想干什么！”"

  #SA_COG_event.10101.t: "商户和农工失业造成的问题"
  #SA_COG_event.10101.d: "在大萧条来临时，因为价格波动而亏损甚至破产的事情，让商户和农工们成为了殖民地最绝望最不稳定的群体，她们被迫转行，或者干脆强夺起同行生意，原本较为和谐的生活秩序被她们搞得一团糟。通常这些失业游民的安置不是由殖民地政府，而是地方部族做决定的，因为是这些部族领袖手握地方权力和财富。领袖们当然不希望这些家伙扰乱自己原本的社会秩序，对于失业的外族人，她们选择了驱逐回原籍，而对于本族人，则尽可能委派各种工作去容纳她们。她们还绞尽脑汁地处理这些囤积的货物，想尽办法把这些货物贱卖出去或者到外地，但是这又会引起其他部族的不满——卖得太便宜导致价格战了，于是其他部族在政府的协助下竖起了入口税，来阻挡这些货物。"
  #SA_COG_event.10101.a: "生活还在变糟糕"

  #SA_COG_event.10102.t: "部族领袖的态度"
  #SA_COG_event.10102.d: "比起让自己的皇室成员做出节俭的表率，大部分部族领袖认为她们荣华富贵岁月不变才是最为根本的。这些部族领袖收到殖民政府新税法的第一反应往往不是反对，而是眼睛一亮——这不正是捞钱的好机会吗？她们可以打着“缴税”的旗号向底层加征更多，自己截留一大笔。反抗？那太麻烦了，还要冒风险。反正最后出钱的不是她们。她们心里当然会对魅魔总督做出这样的部署感到奇怪，而且根据情报，魅魔也没有什么武装能够阻止她们掀桌子——但问题是，为什么要掀呢？饭桌上的菜还能吃，碗也没碎，掀了桌子自己也得饿着。与其冒险去猜别人会不会一起反抗，不如稳稳当当地从底层人身上把这个窟窿填上，顺便再刮一层油。\n当然，也有一些自认为天高皇帝远的部族则声称拒绝执行这些新税法，她们倚仗着军队妨碍政策的实施，并开始联合一些部族领袖。"
  #SA_COG_event.10102.a: "“我们的生活不能改变”"

  #SA_COG_event.10103.t: "可怕的绞杀"
  #SA_COG_event.10103.d: "那些幻想着独霸一处以及联合的部族，完全没有意识到政府已经不再是单纯的魅魔政府了，政府外皮之下还隐藏着一个政客，她在记录这些不安定的家伙，并在之后用各种手段清理她们。一天，以“魅魔”为署名的信件被送往许多部族领袖手中，她说，\n“近日，XX王国存在许多排斥异族、倒买倒卖的邪恶勾当，并试图通过联合一些同样有非分之想的部族形成可怕的联盟，来摧毁包括你们在内的各种其他部族。”\n收取到这些信息的部族自然是有点不安。但是，专员也抓住了她们想要保持自身生活的渴望，对她们诱惑道，\n“只要将你们流浪的失业人武装起来，去先发制人，你们就会安全，到时候，你们还能掠夺她们的财富，奴役她们的部族。”\n这些内容对于那些妥协过的部族是个巨大的诱惑，失业问题和资金问题都能解决，而且还有“魅魔”背书，这下她们可是“奉旨镇压”了。很快，少数的反抗就在周围众多的贪婪中被淹没，她们的财富被抢走、土地被政府收回、这里曾经的权力就这么一下子血腥交接了。"
  #SA_COG_event.10103.a: "“这种招式真好使”"

  #SA_COG_event.10104.t: "代价"
  #SA_COG_event.10104.d: "然而，掠夺完后的部族遇到了一个大问题，原本这些军队是失业人组成的，当初拉起来就是为了解决失业，但是一但战争停止，她们的开销又刺激道了部族自己身上。好巧不巧，“魅魔”又再一次来信，说道：“可以解散掉大部分的军队来节流，而这些失业人可以交由政府安排。”面对这样的提议，部族领袖没有多想就照做了，毕竟省出来的军费她们也乐意，只不过，这些人是被送去了那些被政府管理的土地，政府用掠夺来的财富，和空余出来的土地以及资源，重新安置他们，变成“殖民政府直属工兵营”，负责基础设施建设和资源开采”，发展着政府自己的忠实力量。"
  #SA_COG_event.10104.a: "“她们不会知道我们的小算盘的”"

  #SA_COG_event.10105.t: "一些有识之士的担忧"
  #SA_COG_event.10105.d: "“我们的殖民地自那场大战以来，就没有那么疯狂过！我们需要总督大人做出合理的解释！”许多的绮罗和一些其他部族在一起交流她们的生活时，渐渐发觉不妥，比起当初魅魔的建设，现行的各种政策基本没有什么建设性可言，她们一致认为要和总督大人讨论一番，这究竟是怎么回事。于是，很多人开始拿起纸和笔，将她们目前的生活状况、迷茫和对未来的猜测都凝聚在了这张小小的白纸，细心将信封折好，然后由旅鼠或者绮罗信使层层转运到了幻魔殿。"
  #SA_COG_event.10105.a: "“我们必须得问个究竟！”"

  #魅魔大人，你为什么只是在看着！ OMO

  #SA_COG_event.10106.t: "信封"
  #SA_COG_event.10106.d: "专员一如既往地在总督府里工作着，官员向她报告的诸如：一些部族拒绝政策、试图联合的表现都算到了，她只是在观察谁愿意合作、谁不愿好好讲话，就在这时，另一个官员拿着一大叠信封，匆匆走向总督的办公室。\n“这是怎么回事？”专员心里纳闷了。\n她也走到办公室门前，但是没有进去，当那位官员出来时，早已等候多时的专员一把叫住了她，并问道。\n“那些信封不像是官方文件，怎么那么多？”“这些嘛，是各地群众写的信，内容我不太清楚。”\n刹那间，专员意识到不对劲，她不清楚这些信封上面究竟写了什么，更好奇那些内容会不会影响到魅魔对自己工作的态度。一种不安的感觉攀上脑门，她在外面打转了几圈，想了想还是走了进去。然而，当她走进去时，她发现了魅魔的桌面上正放着那些刚刚带进来的信封，还没有一点拆封，而魅魔依旧在发呆。\n“怎么了？”\n“我可以帮你处理这些信封，顺便研究这里面的内容。”\n专员知道自己的行为很冒犯，因为这些信是人写给魅魔的，但是魅魔只是轻飘飘地说了一句。\n“随便。”便继续发呆了。\n专员麻利地带走了信封，她悬着的心落地了，她对那位送信的官员说到：“以后不用劳烦魅魔总督处理这些政务了，可以放心交给我。”"
  #SA_COG_event.10106.a: "“不好的内容不需要被她看见……”"

