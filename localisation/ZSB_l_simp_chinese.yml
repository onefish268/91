l_simp_chinese:
 #事件对话
 ZSB.1.t: "深夜的市长府邸"
 ZSB.1.desc: "深夜的卢萨卡一片死寂。市长府邸像一头蛰伏的巨兽，浑身浸没在墨色里，唯有顶层办公室那扇高窗透出一小团暖黄的光——那是提灯的火苗在玻璃后摇曳，微弱得像随时会被风吹灭.\n谢劳德从临时公寓扑了个空后，顺着街道摸到府邸外围。他仰头看见那点光亮，心里有了底。铁门虚掩，门廊空荡，没人拦他。他一路踩着吱呀作响的木楼梯上去，走到办公室门前，轻轻叩了两下。\n“进来。”里面传出的声音有些哑。\n推开门，斯坦利伯爵正伏在宽大的办公桌后，面前摊开着一摞一摞的文件，纸张边角卷起，墨迹凌乱。提灯搁在桌角，光晕只够照亮她手边那一小片区域，墙上的地图和书架都隐在昏暗中。她的领口松开了第一颗扣子，袖口沾了墨渍，眼神里满是疲惫。\n“你怎么找到这儿来的？”斯坦利抬眼，略带意外。\n谢劳德耸耸肩：“公寓里灯是灭的，被子没动过。我问了守卫，说你没回。你除了那里，能去的地方就这一栋楼。”\n斯坦利怔了一下，随即苦笑：“也是。”\n她把面前一份文件往旁边推了推，腾出一点空处，示意谢劳德坐下。后者拉过一把椅子，坐到桌侧，目光扫过那些纸张——经济评估报告、矿区产量统计、各派武装的动向情报，还有几封语调恭敬却暗藏试探的外交函件。\n“第一天他们把我推上来，我还以为只是临时主持局面。”斯坦利的声音低而平，像在自言自语，“结果这两天送来的东西越摞越高。津巴布韦尔那边已经开始征粮了，丰饶神教派了信使来‘问候’，口气热络得让人发毛。皇家矿业公司说保持中立，但他们的护卫队已经往南推进了二十公里——说是‘巡逻’。”\n她顿了顿，手指按住一份标注“罗德西亚自治领地”的地图：“伊菲尔总督那个老不死在的时候，这些势力至少还给个面子。她一走……整个罗德西亚就像被抽掉了脊梁骨，谁都想上来啃一口。”\n“可你现在是临时政府的领袖了。”谢劳德说。\n伯爵伸手拨了拨提灯的灯芯，火苗跳了跳，映得她侧脸明暗不定。“有时候我想，如果那天新年演讲伊菲尔总督没被那一枪打中，或者圣杯王国那边能腾出手来管一管……我大概还在核算进出口表格。”\n谢劳德没有接话，只是安静地坐着。窗外的风吹得玻璃轻微颤动，远处隐约传来一两声犬吠。\n“走吧。”斯坦利忽然直起身，把面前的文件归拢成一叠，用镇纸压住，“今天看多少遍还是那几串数字，再看也不会变出奇迹来。”\n她提起提灯，将火调小，只留一点豆大的光。两人一前一后走下楼梯，府邸外夜色更浓，星光稀薄。谢劳德走在她身旁，步伐不紧不慢。“明早那份矿区调停方案，我陪你一起看。”\n谢劳德忽然说。\n斯坦利没有转头，但脚步微微慢了一拍。"
 ZSB.1.a: "“嗯。”"
 ZSB.2.t: "僵尸大亨"
 ZSB.2.desc: "使者名叫哈蒙德，是卢萨卡市政厅里一名文职出身的年轻官员。他出发前在斯坦利伯爵面前接过委任状时，手微微发颤，但眼神还算坚定——他以为矿区的谈判无非是讨价还价，总不至于比处理前总督留下的账目更棘手。\n午后的阳光毒辣地砸在红土矿坑上，空气里弥漫着铁锈和尘土的腥气。坑壁层层叠叠，像一道大地被撕裂开的伤口，底部人影憧憧，在刺目的光线下几乎只剩黑点。哈蒙德被一名手持步枪的护卫引到坑边，等待爵士接见的指令，就站在那里，俯瞰着矿坑深处。那些工人们正以令人不适的速度挖掘着露天的矿脉。他们穿着破烂的工装，皮肤上覆盖着灰红的矿石粉末，使他们的面孔像泥塑一般毫无血色。每个人都在重复同一个动作——挥镐、弯腰、搬运——节奏僵硬而一致，恍若被一根无形的线牵引着。没有人说话，没有人抬头，甚至没有人擦拭额头的汗水。哈蒙德看着一个矿工脚下的石块松动，整个人跌滑了两米，膝盖磕在尖岩上。那人没有叫喊，只是机械地爬起来，一瘸一拐地走回原来的位置，继续挥镐。\n“他们……不需要休息吗？”哈蒙德低声问身边的护卫。\n护卫没有看他，只是平淡地说：“爵士规定每个人每天要交足标准量。交不够的，没有饭吃。”\n哈蒙德想再问什么，但护卫已经转过身，示意他跟上。他被带进一栋混凝士结构的二层楼房，走廊里铺着褪色的红地毯，墙上挂着几幅矿产分布图。推开尽头的铁门，他看到了奥本海默爵士。对方是个年轻女人，看上去不到三十岁，一头齐耳的银灰色短发，穿着剪裁干练的猎装外套，正坐在办公桌后翻看一叠报表。她听到脚步声，抬眼淡淡扫了哈蒙德一下，没有起身，也没有示意他坐。\n“爵士。”\n哈蒙德按照礼仪微微欠身，\n“我代表圣杯联邦，就贵矿区向卢萨卡方面供应矿石的长期协议前来与您商讨。”\n奥本海默把手中的报表放下，指尖相抵，靠在椅背上看他。\n“协议？”\n“是的。”哈蒙德从公文包中取出一份草案，“联邦政府希望恢复战前自治领时期与矿业公司之间的贸易框架，我方愿以卢萨卡市场的优先采购权和税收减免作为……”\n“你知道这块矿区现在的年产量是多少吗？”奥本海默打断了他。\n哈蒙德愣了愣：“呃……具体数字，我方尚需……”\n“这是我的。”奥本海默抬起一只手，轻轻点了点桌面，“这一整片，地下五百米，全部是矿石。从挖掘、冶炼到运输，所有环节我说了算。我的人——你在外面看到了——他们吃什么、睡多久、什么时候生病、什么时候死，都是我定的。”她的语气不紧不慢，像在陈述天气预报。“圣杯联邦？”她咀嚼着这四个字，嘴角微微弯了一下，“卢萨卡城里挤在一间破旧市长府邸里的那群人，自称联邦？”\n哈蒙德的脸颊有些发烫。“爵士，斯坦利伯爵是经当地官员一致推举的合法领袖，她继承了原自治领的法统……”\n“法统？”奥本海默忽然笑出了声，那笑声很轻，却带着一种尖锐的嘲弄，“伊菲尔总督死了，圣杯王国隔着一个大洋自身难保，你们拿着几年前的旧账本和一份没有一兵一卒的委任状，就想跑来跟我谈法统？”\n哈蒙德攥紧了手中的公文包，努力保持语气的平稳：“那么爵士的意思是，协议的事……”\n“我没有什么'意思'。”奥本海默拉开右侧的抽屉，里面塞着厚厚一叠文件。她随手翻了几页，从中抽出一张，看也不看就扔到桌面上，纸张滑到哈蒙德面前。她把报表合上，对门口扬了扬下巴。“送客。”\n哈蒙德站在原地，他想再争辩几句，但护卫已经走到他身后，铁靴踏在地板上的声音沉重而清晰。他最终将那页纸折好，放进了公文包的最底层。没有再看奥本海默一眼，转身走了出去。"
 ZSB.2.a: "她不在乎我们，她只是沉醉在自己的世界里。"
 ZSB.3.t: "无政府"
 ZSB.3.desc: "哈德森中士从卢萨卡出发时，心里还揣着几分火气。他本是斯坦利伯爵卫队里的一名老兵，打过仗、押过运、挨过冷枪，偏偏这次被派去南边取回前总督府的印章。出发前伯爵把任务交到他手里时，语气很轻，像是在托付一件极普通的事情。“印章留在总督府里，自治领那边群龙无首，你悄悄去，悄悄回。”哈德森当时没说什么，但骑上马往南走了大半日，心里越想越不是滋味。他是士兵，不是信差；他握枪的手不该用来翻找文书柜。他以为到了那座城市，至少会有个当地向导在城门口等着接应——斯坦利伯爵虽然说得轻巧，但总不至于让他在一座陌生的、可能已经彻底乱了套的城市里像没头苍蝇一样乱撞吧？可他到了城郊才发现，没有人等他。\n城外的大路上横着几辆烧毁的马车，铁皮车架扭曲发黑，车轮还残留着暗褐色的痕迹。他勒马停下，环顾四周，道路两旁的农田早就荒了，杂草疯长，田埂上连个人影都没有。远处的城市轮廓静悄悄地伏在午后的昏黄光线里，没有炊烟，没有钟声，甚至连鸟叫都听不见。他翻身下马，把马拴在一棵枯树旁，拍了拍马颈说了句“等着”，便徒步朝城门走去。\n进城之后，哈德森才真正意识到什么是“无政府状态”。主街两旁店铺的门板大多被拆了，碎玻璃洒了一地，在太阳下闪着细碎的光。偶尔有野狗从废墟里钻出来，嘴里叼着不知道什么东西，见了他便弓背低吼。墙壁上涂满了潦草的标语，有的写着“粮食归饥饿的人”，有的画着潦倒的镰刀和锤子，还有几处被人用油漆胡乱抹掉了，只留下大片污迹。他沿着墙根走，尽可能避开开阔地带。远远地看见一队人扛着农具和撬棍从街角拐出来，为首的人斜背着一把猎枪，吆五喝六地挨家挨户踹门。哈德森闪进半塌的拱门后面，屏住呼吸等那队人走过去。领头那个边走边吐了一口唾沫：“总督府那边早被翻过三遍了，有个屁剩的！去码头看看，那些商人跑路时肯定没带完。”等脚步声远去，哈德森从拱门里出来，抹了一把额角的汗。他本想去总督府那条路，但前面被一辆侧翻的运粮车堵住了，车斗里的谷粒散了一地，踩上去沙沙作响。他绕了两条巷子，撞见三个蹲在台阶上分一袋干粮的男人，对方抬头看了他一眼，目光落在他腰间那把收在鞘里的军刀上，又默默低下了头。\n总督府是一座灰白色的旧式石楼，正面大门洞开，门板歪斜地挂着一扇，另一扇不知去向。院子里杂草丛生，旗杆上空荡荡的没有旗帜，台阶上有几处干涸的暗色斑点。哈德森没有从正门进——那是靶子——他贴着外墙绕到侧面，找到一扇被撬开过的窗，翻窗而入。府内一片狼藉。长廊的地毯被扯得卷边歪扭，墙上的画框要么被摘走、要么被砸碎在地上，玻璃渣在脚底下咔嚓作响。他握紧铁棍，竖起耳朵听着每一扇门后的动静。二楼有几间办公室门开着，里面的文件撒得到处都是，风从破窗灌进来，吹得纸页哗哗翻动。他记得伯爵说过，印章应该放在总督办公桌左侧抽屉的一个铁匣子里。可当他找到那间办公室时，桌子被推翻了，抽屉全部被抽出来扔在地上，里面空空荡荡。哈德森蹲下来翻了半天，又趴在桌子底下看了遍，心里一沉。但他没有急着走，而是把目光投向墙角一个半开的柜子——柜门背后，压在一堆散落档案底下的，是一个黑色铁皮匣，上面的漆皮已经磨掉大半，但锁扣还完好。他撬开匣子，里面垫着一层旧绒布，中央躺着一枚印泥尚干的铜制印章，柄端刻着前总督府的纹章。哈德森拿起印章，在袖口上擦掉沾染的灰，掂了掂——分量十足。他把印章裹进随身带的油布里，塞进内袋，然后原路退回侧窗。翻出去的时候，院墙外正有一队人吵吵嚷嚷地往正门方向走，他猫腰藏在半人高的荒草丛中，等那队人进了正门，才快步翻过墙，顺着来时摸清的巷子朝城门方向撤离。出城时天色已近黄昏，远远地，他看见拴在枯树旁的那匹马还在原地等，耷拉着脑袋甩尾巴。哈德森走过去，解开缰绳翻身上马，摸了摸内袋里那方硬邦邦的轮廓，长长呼出一口气。\n来的时候他抱怨过这趟差事，回去的路上反倒一句话也没有了。"
 ZSB.3.a: "她们指着废墟，却说这是文明。"
 ZSB.4.t: "仇人"
 ZSB.4.desc: "使者名叫卡特，是卢萨卡市政厅里少有的几个既懂文书又通晓外交辞令的人。斯坦利伯爵派他去南非首府比勒陀利亚时，特意叮嘱了几句：“南非是南部非洲最大的势力，他们的态度决定我们能不能站稳脚跟。你去，不代表联邦求援，只代表我们愿意把话说清楚。”\n卡特出发时心里还有些底。他带了一封措辞得体的公函，一枚圣杯联邦临时铸造的印章印记，以及足够在路上花的旅费。他穿过荒芜的边境地带，跨过林波波河，越往南走人烟越稠密，道路也从红土变成碎石再变成柏油。南非联邦的行政大楼气势恢宏，灰石外墙在阳光下泛着冷冽的白光，门前卫兵持枪而立，步态整齐。卡特递上公函和身份证明，被礼貌地请进一间等候室，然后就是漫长的等待。半小时、一小时、两小时——他在椅子上坐得腰背僵硬，一杯水也没人给倒。期间一个穿制服的秘书进来过一次，拿起他的公函翻了翻，说“部长今天行程满了”，便再没下文。卡特第二天又来了，这回连等候室都没让进。卫兵说“没有预约不能入内”，语气客气而冰冷。他这才意识到，卢萨卡那个小小的“圣杯联邦”在南非人眼里连个正式名号都算不上。他在城里找了一家便宜的旅馆住下，开始托人打听门路。旅馆老板收了他一枚银币，告诉他有个退休的殖民地事务处文书常在傍晚去街角的酒馆喝酒；酒馆里的酒保收了他两枚银币，告诉他那位文书现在给议会的一个议员当私人助理；那助理收了他三枚银币，才松口说“议员后天下午会在橡树街的咖啡馆坐一会儿。”\n卡特如约到了那家咖啡馆。店面不大，铁艺桌椅摆在室外，头顶的遮阳棚被风吹得轻轻抖动。他点了一杯最便宜的咖啡坐在角落，等了半个钟头，才看见一个穿灰色西装的中年男人踱步而来，外套搭在手臂上，步伐从容。议员在靠窗的位置坐下，招手叫了杯茶，然后看了卡特一眼，微微一笑：“你是卢萨卡来的那位？坐吧。”卡特坐过去，把公函双手递上。议员没有接，只是用指尖点了点桌面：“你说说看。”卡特简要介绍了圣杯联邦的现状——斯坦利伯爵被推举为临时领袖，正试图整合罗德西亚的各方势力，需要外交上的承认和联系渠道，尤其是希望借助南非的通信网络与圣杯王国本土重新建立联络。议员静静听他说完，低头抿了一口茶，再抬头时脸上的笑容带着一种温和的、几乎让人感到不适的怜悯。\n“朋友，”他说，“你从北边一路过来，路上看到了什么？”卡特顿了顿：“看到了……你们这边很安稳。”“安稳？”议员轻轻摇头，“不是安稳，是有秩序。我们有政府、有法律、有税收、有军队，而你们那边，”他放下茶杯，指尖在杯沿上缓缓摩挲，“伊菲尔死了，圣杯王国自顾不暇，卢萨卡城里几个文官拥立一个管经济账目的年轻人，自称'联邦'……你觉得这算政府吗？”\n卡特沉默了。\n议员往后靠了靠，语气又恢复了那种温和的调子：“别误会，我们不是没有同情心。南非联邦会派出一队红十字会的医疗人员北上，为你们那些难民提供最基本的救治。这是人道主义援助，不带政治条件。”“那……”卡特深吸一口气，“南非能否协助我们与母国圣杯王国取得联系？哪怕只是一封电报转交也行。只要本土知道这里还有忠于圣杯的政府在……”“罗德西亚已经没有政府了。”议员的声音依然温和，却像一扇铁门轻轻合上，“这是比勒陀利亚的官方判断。”卡特盯着他看了几秒，然后把那份始终没有被接过去的公函收回到公文包里，站起身。“感谢您的茶，议员先生。”他转身朝门口走去。遮阳棚的布檐在他头顶投下一道倾斜的阴影。他一只手已经推开了咖啡馆的玻璃门，身后忽然传来议员的声音——“对了，有件事可以告诉你——南非联邦议会最近在讨论一项北部边境的治安议案。如果罗德西亚的混乱持续蔓延，我们可能会考虑采取行动，北上解放那些受苦的人民。”\n卡特停住了脚步。他背对着议员，没有回头。片刻后，他发出一声极轻的嗤笑，那笑声里没有半分敬意。\n“解放？”他侧过头，只露出半边下巴的轮廓，“说得好听。罗德西亚和南非之间那些梁子，议员先生不会忘了吧？上一回你们北上，走的时候粮食和牲口都少了一半。这回也一样——入侵就是入侵，换个词骗不了人。”\n他推开玻璃门走了出去。午后的阳光白晃晃地打在街面上，照得柏油路面微微发烫。他走了一段路才停下，从口袋里摸出一块干硬的面包咬了一口，在路边站了很久，看着南非首府整洁的街道和井然有序的行人，然后转身朝旅馆的方向走去。回去以后，他要写一封长电报发回卢萨卡。"
 ZSB.4.a: "如果还能找到发报机的话。"
 ZSB.5.t: "沟通"
 ZSB.5.desc: "卢萨卡的贫民窟藏在火车站北面一片低洼的洼地里，地势下陷，雨季时积水成沼，旱季时尘土飞扬。铁皮屋顶和粗布棚子挤挤挨挨地摞在一起，中间只有几条仅容一人通过的窄巷，污水在沟渠里缓缓流淌，散发出淤泥和腐菜叶混合的气味。斯坦利伯爵脱掉了那件剪裁得体的深灰外套，换了一身半旧的棉布衬衫和深色长裤，头发用一顶软帽压住大半，从巷口绕了三个弯才摸到那扇后门。门是一块锈迹斑斑的铁皮，嵌在土坯墙里，不仔细看几乎察觉不到。她抬手在门板上叩了三下，停了两秒，又叩了两下。里面静了片刻，一个闷哑的声音从门缝里传出来：“谁？”“卢萨卡来的，”斯坦利压低声音，“找卡洛。”门内沉默了很久，久到她以为对方不会开了。然后铁门嘎地一声被拉开一条缝，一只骨节粗大的黑手拽住她的胳膊一把扯了进去。\n门后的空间是一间逼仄的土房，没有窗，一盏油灯搁在木箱上，火苗细弱，只照亮一小圈范围。屋角坐着三个人，手里都握着东西——一把猎刀、一根铁管、还有一支老旧的步枪。中间站着的那个男人体格壮实，方脸膛，皮肤在昏暗中几乎融进阴影里，只有眼白和微微反光的额角显现出轮廓。他手里没有拿武器，但那双粗厚的手掌攥成拳，指关节凸起，像随时能砸碎什么。“你是谁？”他开口，声音粗粝，带着明显的警惕和敌意。“斯坦利。卢萨卡现在的负责人。”“斯坦利？”他重复了一遍这个名字，嘴角向下压了压，然后猛然变了脸色，“你就是那个'伯爵'？”他往前迈了一步，手臂一伸，直接把斯坦利推到墙边，后背撞在土墙上，震落几粒干泥。他低下身子，那张黝黑的脸凑得很近，油灯光从侧面打过来，在他脸上勾出刚硬的轮廓。“你胆子不小，”他的声音压得极低，像野兽喉咙里滚动的低吼，“一个人跑来这儿？信不信我现在就把你做了，扔到沟里，明天一早就没人记得你。”\n斯坦利靠在墙上，后脑勺贴着粗糙的土壁，呼吸稍稍急促了一瞬，但眼睛没有躲开。她说，“但我是来谈正事的。”\n“谈？”卡洛冷笑一声，扭头朝屋角那三个人做了个手势，其中一人把步枪的枪口抬了抬，对准她。卡洛转回头，目光像刀子一样刮在她脸上，“你那些白人官员把我们的地占了，把我们的矿抢了，把我们的人赶到这片烂泥地里等死——你现在站在这儿跟我谈？你是不是脑子有病？”\n他从后腰抽出一把手枪，枪管抵在斯坦利的额头上。冰凉的金属触感压着她的皮肤，能闻到一股淡淡的枪油气味。屋里的空气像凝固了，油灯的火苗微微晃动，照得几道影子在地面上拉长又缩回。\n斯坦利没有闭眼。她看着卡洛的眼睛，目光没有闪躲，也没有愤怒。她只是看着他。\n卡洛的指尖扣在扳机护圈外面，指腹贴着冰冷的金属。他的呼吸粗重，胸口起伏了几次。三秒。五秒。十秒。他猛地收了枪，转身走到木箱边，把枪往箱面上一摔，发出一声沉闷的响。他背对着她，肩膀绷得很紧，没有说话。\n“政府打算赦免你们，”斯坦利的声音从身后传来，平而稳，“前总督时期签发的那些限制令和通缉令全部作废。卢萨卡议会的席位会重新分配，原住民代表占四个席位，有投票权。不设财产限制，不设教育门槛。你们推选谁，那个人就坐进议会厅。”卡洛的身体微微震了一下。他没有转身，但头侧了侧，像是在确认自己有没有听错。\n“赦免？”他哑着嗓子问，“议会？”“对。”他忽然转过身来，盯着她看了很久。油灯光映在他脸上，那双眼睛里翻涌着复杂的情绪——怀疑、愤怒、困惑，还有一丝极力压制的动摇。“你知道我们在外面埋了多少炸管？我们的人已经摸清了市政厅附近三条路的所有巡逻路线，只要我一声令下……”\n“我知道。”斯坦利说。\n“那你还……”他张了张嘴，又闭上了，喉结上下滚了一下。他使劲搓了一把脸，粗糙的掌心磨过脸颊，发出沙沙的声响。\n“你走吧，”他低声说，“趁我还没改主意。赶紧走。”“议会七天后开始运转，”斯坦利没有动，站在原地认真地看着他，“席位已经留出来了，我会让人把邀请函送到这扇门后面。你记得来。”\n卡洛没有回答。他只是背过身去，面朝墙壁，一只手按在木箱的边缘上，手指攥得很紧。斯坦利没有再说什么。她转身推开铁皮后门，侧身挤了出去，重新站进了贫民窟那条窄巷里。午后的光线刺目得让她眯了一下眼，她抬手压低帽檐，低头快步往外走。走出去十几步的时候，她听见身后那扇铁门里传出一个低沉的声音，像是自言自语，又像是在跟屋角那三个人说话：“……疯了。那女人绝对疯了。”"
 ZSB.5.a: "我可没疯。"
 ZSB.6.t: "议会"
 ZSB.6.desc: "卢萨卡议会厅是一栋殖民时期留下的灰砖建筑，穹顶不高，窗户狭长，采光全靠头顶那盏笨重的黄铜吊灯。灯罩上积了灰，光线散下来时泛着温吞的旧黄色，把一排排长条木椅和正前方的法官席笼罩在一层朦胧的光晕里。议会原定上午九时开庭。八点刚过，白人议员们就陆陆续续坐进了席位。他们大多穿着深色西装，领带打得一丝不苟，有些人还在面前摊开了笔记本和钢笔，互相低声交谈着，语气从容，偶尔有人发出几声克制的笑。前排靠右的几个年长议员翻看着手中的议程草案，时不时抬头瞥一眼墙壁上的挂钟。原住民席位在左侧后排，一排六张椅子，此刻空空荡荡。\n八点半，法官哈尔福德走进来，他在法官席落座，整理了一下桌上的文书，然后抬眼看向旁听席和议员席，目光在那个空荡荡的角落短暂停留了一瞬，又若无其事地移开了。旁听席上稀稀落落地坐着十几个人，有市政厅的文员、几家报社的记者、几个穿便服的市民。斯坦利坐在旁听席靠后的位置，穿着一件深灰色的外套，头发整整齐齐地别在耳后，双手交叠放在膝盖上。她的目光也落在那六张空椅子上，面上看不出什么表情，只是手指不自觉地轻轻扣着手背。八点四十五分。八点五十分。八点五十五分。那六张椅子依然空着。前排有个白人议员回头看了一眼，侧过头和邻座的人低声说了句什么，那人微微耸肩，嘴角撇了一下。法官哈尔福德端起桌上的水杯喝了一口，然后放下，目光再次扫向挂钟——指针正缓缓移向九点整。他把手放在桌上的小木锤上，指尖轻轻摩挲着锤柄。\n斯坦利的手指停止了扣动。她靠向椅背，目光低垂了一瞬，像是在确认什么。然后她重新抬起头，望向那排空椅子，嘴唇微微抿紧。\n“时间到了。”法官清了清嗓子，拿起木锤，锤底悬在底座上方半寸，准备落下。\n就在这时，议会厅那扇厚重的橡木大门被人从外面推开了。“吱——呀——”门轴发出一声冗长的、被岁月磨得沙哑的响声。所有人的目光同时转了过去。阳光从门外的走廊斜射进来，逆光中站着几个人影，影影绰绰，像刚走完长路、还没来得及拍掉身上尘土的人。卡洛走在最前面。他穿着一件深蓝色的旧西装，面料已经磨得发亮，袖口和下摆有几处明显的褶皱痕迹，像是从箱底翻出来、又用湿布拍打过但没来得及熨平的。衬衫领口泛着微微的黄渍，领带歪了一点，被他进来时随手正了正。他身后跟着五个兽人原住民，穿着同样半新不旧的正装，有人裤腿短了一截，露出一截黑袜；有人外套的扣子缺了一颗，用别针别住了开口。他们的鞋子都沾着泥——来时的路显然不好走。几个人站定在门口，被满厅的目光齐齐注视着。卡洛的目光先是扫过那些白人议员惊讶的面孔，然后越过他们的头顶，落在左侧后排那六张空着的椅子上。他抬头看了一眼墙上的挂钟——指针刚好走到九点整。\n他迈开步子，皮鞋踩在木地板上发出沉闷的脚步声，带着身后五个人穿过议会厅中间的过道。两侧的白人议员们不约而同地收住了交谈声，有人身体微微后仰，像是要给这群忽然闯入的人让出更多空间；有人低下头假装翻阅文件，但目光却从纸页上方悄悄抬起。前排一个上了年纪的议员嘴唇翕动了一下，没说出话来。\n卡洛走到那排椅子前，顿了顿，低头看了一眼椅面上薄薄的灰，随手拍了两下，然后坐下来。五个同伴跟着他落座，椅子被拖动时发出几阵短促的摩擦声。其中一人坐下后使劲拽了拽过短的裤脚，没拽下来，只好把双手规规矩矩地放在膝盖上。整个议会厅安静了几秒钟。那股安静里裹着一种说不清道不明的错愕，像是一盆水忽然泼进了静止的池塘，涟漪还没完全荡开。\n法官哈尔福德手里的木锤悬在半空，他看着时钟，又看了看那排刚落座的人，放下锤子，重新清了清嗓子，声音比刚才提高了几分：“……卢萨卡议会，第一次全体会议，现在开庭。”木锤落下，发出一声清脆的“啪”。\n旁听席后排，斯坦利靠回椅背。她的嘴角先是微微一压，像是要把什么情绪按下去，然后终于没能按住，一点点地翘了起来。她垂下眼，把那只一直扣着手背的手松开，指尖在膝盖上轻轻弹了一下，像在敲一个无声的拍子。"
 ZSB.6.a: "没有人是你的敌人。"
