 BUL_faction_panel_banner_desc: "统一之后的§Y联邦§!迫切需要一个强有力的领导人来成为这艘崭新的§C航船§!的§Y掌舵人§!，而军政府时期的老资历§Y斯坦利伯爵§!带领的§C大罗德西亚党§!以及本土原住民代言人§Y卡洛§!带领的§R国民大会党§!成为最有希望赢得选举的§Y政党§!。如果我们想要让这两个§Y党派§!中的其中一个脱颖而出，那我们就要在选票结算前为其准备好充足的§G政治资源§!以及§G民间声望§!。"
