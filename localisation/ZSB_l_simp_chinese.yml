 ZSB_faction_fayuan_banner_desc: "§C联邦最高法院（Supreme Court of the United States）§!是依据《合众国宪法》第三条设立的联邦§Y最高司法机构§!，由1名首席大法官和8名大法官组成，任期终身，经总统提名并由参议院批准后任命。§Y最高法院§!是联邦终审上诉法院，以及联邦宪法的§R最终阐释者§!。在各类诉讼审理体系中，§Y最高法院§!划定州政府与联邦政府、各州之间、政府与公民之间的权力界限。其§Y主要职能§!包括审理联邦与州法律合宪性案件、协调州际法律冲突及行使宪法规定的§G初审管辖权§!，拥有§G司法审查权§!以裁定法律违宪§R无效§!。"