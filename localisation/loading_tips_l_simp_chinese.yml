l_simp_chinese:
  LOADING_TIP_0: "一件事务的发展是充满曲折的。"
  LOADING_TIP_1: "我们不是铁打的，但我们扛起的，是整个非洲的黎明。"
  LOADING_TIP_2: "我知道，我死后有人会把一大堆垃圾扔到我的坟上，但历史的风会毫不留情地把这堆垃圾刮走。"
  LOADING_TIP_3: "我不想成为一个伟大的人，我只想成为一个有用的人。"
  LOADING_TIP_4: "我们也许不得不承认这样一个事实：有时理想与现实之间一定会存在着连续的巨大的沟壑。"
  LOADING_TIP_5: "但也要知道，这样的沟壑是可以被跨越的。"
  LOADING_TIP_6: "后代人将举起自己先辈的旗帜，他们将按照自己过去的榜样来建设自己的未来。"
  LOADING_TIP_7: "不要因为当下的泥泞，就对远方的星辰失去信心。"
  LOADING_TIP_8: "革命不是请客吃饭。"
  LOADING_TIP_9: "红色袖章遮不住金色的怀表，就像革命的口号遮不住封建的根基。"
  LOADING_TIP_10: "我为不死而死。我将再活一次。但为了重生，我必须死去。"
  LOADING_TIP_11: "反抗不灵，但反抗不止。这就是非洲的全部真相。"
  LOADING_TIP_12: "联盟不是终点。联盟是一场永不结束的斗争的起点。而斗争本身，就是自由的全部意义。"
  LOADING_TIP_13: "如果有一天联盟倒下了，那一定不是因为圣杯王国的舰队，而是因为我们在亚的斯亚贝巴的办公室里，先把自己变成了新的老爷。"
  LOADING_TIP_14: "咖啡的苦涩与回甘，就是革命的味道。喝下它，然后继续干活。"
  LOADING_TIP_15: "我们试图用二十年的时间，跨越别人用几个世纪才走完的路。这怎么可能不流血、不摔跤？"
  LOADING_TIP_16: "历史不常记住那些沉默的人。但如果没有他们，历史连被记住的资格都没有。"
  LOADING_TIP_17: "我们不能选择自己的起点，但我们可以选择自己的终点。如果终点是自由，那么无论多远，我们都会走下去。"
  LOADING_TIP_18: "暴力是每一个孕育着新社会的旧社会的助产婆。"
  LOADING_TIP_19: "我承担起全人类的自由，不是因为我是救世主，而是因为没有人能替我承担我的自由。"
  LOADING_TIP_20: "我们必须进行政治教育……没有它，革命就无法进行。而在非洲，最先被消灭的往往正是那些受过教育的人。"
  LOADING_TIP_21: "我们没有别的出路，只有斗争。在这片大陆上，妥协换来的从来不是和平，而是更加沉重的锁链。"
  LOADING_TIP_22: "让我们面对现实，让我们忠于理想。即使非洲的现实是泥泞和深渊，我们也必须在深渊上架起通往理想的桥。"
  LOADING_TIP_23: "直到最后，我们仍坚信，凭借着他的力量，我们终将获得胜利。正义永远不会缺席，哪怕它姗姗来迟。"
  LOADING_TIP_24: "国家的主权属于人民，而不是属于那个戴着皇冠的幽灵。而在那个夜晚，我们把幽灵送进了坟墓。"
  LOADING_TIP_25: "你以为躲进丛林里，殖民者的皮鞭就抽不到你了吗？不，只有站起来反抗，皮鞭才会落到它该落的地方。"
  LOADING_TIP_26: "我们走后，他们会给你们修学校和医院，会提高你们的工资。这不是因为他们良心发现，也不是因为他们变成了好人，而是因为我们来过。"
  LOADING_TIP_27: "革命者必须有两样东西：一把枪和一本书。枪用来对付圣杯王国的军队，书用来对付自己脑子里的封建幽灵。"
  LOADING_TIP_28: "在这片大陆上，自然法则比社会法则更残酷。旱灾和疾病杀死的反抗者，比子弹还要多。但我们依然要反抗，因为不反抗，连死亡的资格都没有。"