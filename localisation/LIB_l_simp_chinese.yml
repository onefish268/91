 LIB_xiji: "投资袭击部队"
 LIB_xiji_desc: "这些资源会用于投资建设海军陆战队与联络当地武装，用于夺取关键港口。这个决议最多执行4次，执行次数越多，后续我们可用的袭击部队就越精良"
