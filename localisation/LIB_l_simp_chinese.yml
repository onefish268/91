#科研项目
 LIB_mywr: "认知危害式加密"
 LIB_mywr_desc: "本质是按照特殊方式排列的字符。常人看来只是用于加密的乱字，但当其不经剔除地出现在加密文件中时，可以一定程度借由心理暗示，概念强调，特定联想，或单纯构成光线和图案刺激，引发有节律的脑区神经活动，导致阅读者根据体质出现疲劳，失眠，躁狂样症状，注意力失调和轻微神经损伤等症状。在极端条件下可能诱发癫痫。"




事件：人间之里郊外
“请跟我交朋友吧。”
“不行。”
“为什么？”
“偷袭我，把我捆成这样，你说呢？还有，别像个捕食者一样看我啊。你找别人吧。”
“要是我就想和你交朋友呢？”
“别烦我，我本来就不喜欢猫科动物。”
“但我喜欢鼠科动物啊！”
“哪门子喜欢啊？......灵梦小姐，救我啊！”
“嗯？妖怪老鼠和猫？这不是纳兹琳和橙吗？好奇怪的组合。橙，你不是和紫一起去三途河对岸了吗？”
“嗯......蓝大人说，交朋友也是修行，于是用紫大人的隙间把我送过来了。”
“不过，你把纳兹琳捆成这样是什么意思啊？”
“嗯，巫女小姐，这个是我的零用钱。”
“哦？谢谢啊，我正好要去人间之里买些东西。妖猫的钱也是钱，那我就当作没看到了。”
“不是？灵梦小姐别走啊！”
“巫女小姐，我不是这个意思。”
“嗯？那是什么意思？”
“蓝大人说，花钱好办事嘛。巫女小姐的朋友很多，我想请教一下怎么交朋友。”
“这个嘛......我的朋友都是打架打出来的。只要打一架，后面就成为朋友了。”
“那就是说，我把纳兹琳酱打一顿就能和她交朋友了？”
“绝对不是这个样子！你打我一顿，我也不会和你做朋友的。”
“啊！我生气了！在你同意成为我的朋友之前，我是绝对不会走的！”
“喂！你别擅自贴过来啊！灵梦小姐，你为什么只是看着？维护幻想乡的和平不是你的职责吗？”
“再怎么说，这是妖怪之间的纷争，和我没关系吧。而且我不是刚刚收了橙的钱嘛？”
选项：什么黑心巫女啊！

事件：某姐妹的家中
“我想养这只猫。”
“养猫？好啊，紫苑姐姐......你这家伙在干什么啊？”
“你这家伙？女苑妹妹，你对姐姐就是这样说话的吗？”
“不不不......那不是八云紫家的妖怪猫吗？怎么能把她擅自抓来？这不是在向贤者挑衅吗？”
“唔......这孩子一直说想要和我交朋友，我就同意了。人们不是说黑猫会带来好运吗？说不定这孩子的运气能分我一点，解决我的贫困问题呢！”
”难道不是反过来，你的贫乏气毁了这小猫的道行吗？再说了，就算我们两个是神明，也没法和贤者对抗啊！总之还是先放了她。“
”那个......紫苑小姐，我感觉你有点太热情了，可以让我先和蓝大人商量一下再和你交朋友吗？“
”哎呀，我们都是朋友了，朋友之间就要互相帮助对不对？你只要在这里住下一段时间就可以了，你什么都不需要多做，只要......啊！“
”哇啊啊啊，蓝大人！“
”哎呀......这事闹的......这不是八云家的妖狐吗？怎么突然上这里来了？“
”闭嘴！女苑，你们要是再打橙的主意，八云家的手段你是知道的。好了好了，没事了，橙......“
选项：不是，关我什么事啊？

事件：白玉楼长阶上
“唉......小姐为什么要说我的园艺无聊啊......说我剪的花草太普通......想不通。”
“庭师小姐，你好啊！”
“这不是八云家的妖猫吗？真是神出鬼没啊。为什么又到冥界来了？打扰这里的清净可饶不了你。”
“上次我说，我想和庭师小姐交朋友。可是庭师小姐却总是说，自己的同族太少，很孤单。”
“是啊，怎么了？”
“所以这次我做好了准备。”
“准备？准备什么......噗哈哈哈哈（跺脚声），真有意思。在尾巴上绑着白色的气球，这乍一看还真像半灵啊！”
“庭师小姐喜欢吗？还有这个！哈！”
“连我的双剑都模仿了吗？哈哈哈哈......虽然仔细一看是木头做的......（捶打地面的声音）不过这气势，还是好好笑啊！”
“庭师小姐笑得真开心啊！”
“不过，在我面前举剑，就是对我的挑战，即使是木棍装作的剑。看剑！”
“啊！喵啊啊啊啊啊！！！呜呜......呜呜呜呜......”
“白楼剑会斩断你的迷惘......不是，别哭啊！只是开个玩笑而已。”
“呜呜......这木剑......是我施了好久的妖术......才定型的。”
“呃呃......真对不起，可现在它们都断了......小姐午餐后还剩些点心，我本来打算放到晚餐里的。这样，你都拿去，就当我赔罪了。大不了我马上再去做一些。”
“庭师小姐太好了！一言为定！”
“变脸怎么变的这么快？你这妖猫！”
“那庭师小姐，我们现在是朋友了吗？”
“好吧好吧，那我就认你这个朋友了。”
“那朋友要互相分忧吧。庭师小姐刚刚为什么会坐在台阶上叹气呢？”
“不过是些琐事，无需在意。”
“即使是琐事，也是烦心事吧？”
“唉，真没办法。那我也问问你的意见。你看到白玉楼的庭院了吗？修建庭院花草的规矩，从庭师还是我爷爷的时候就确立了，可最近小姐却总是说那些花草无聊。我去问小姐的意见，她却不说希望我怎么修改。你看看，那里的花草真的修剪得很普通吗？”
“一点也不，我觉得很华丽啊！”
“就是啊！真的很难理解小姐的想法呢。我后来还给这些花草换了些造型，可小姐看了看，还是之前的表情。小姐看上去还是不太满意呢。”
“我觉得，问题可能不在这里。庭师小姐，要不把庭院的花草改造成迷宫试试？”
“迷宫？”
“我想，要是改成迷宫，让西行寺小姐在里面迷路，这下她就不会再说庭师小姐的花草无聊了。”
“小姐可是亡灵啊！她可以直接从迷宫里穿出来，你要怎么让小姐迷路呢？”
“所以，接下来，奇门遁甲会很有用。庭师小姐你来看看，我在台阶上用石子摆给你看。只要构成休，生，伤，杜，再结合上障眼法，就算西行寺小姐想要穿出去，也辨不清方向。这可是我在迷途之家的看家本领！”
“哦？这样！哈哈哈！有趣，有趣！再多摆点！”
选项：“妖梦？晚饭什么时候做啊？诶......？你为什么坐在台阶上傻笑？”
