LIB_start_game_text: "§0贤者§!§C治下§!的§Y和谐§!" 
 LIB_his_page_01_title: "新人间之里" 
 LIB_Country_History_Page_01:"新人间之里位于三途河南岸，南临广袤大漠。此地原为后户民与土著兽人的土地，而随着幻想乡人口日益增长，大量妖精、人类、天狗等各族移民在此定居，统称为开拓民；此外，绀珠事件（即月之都迁都事件）后，因设置秘密基地而长期驻留此地、并逐渐形成自身社区的月民与月兔，也成为当地居民的一部分。当地族群构成日益复杂，各族社区冲突与异变多生。出于稳定需要，幻想乡委任德高望重的妖怪贤者八云紫统治该地。\n\n当然，所谓“稳定需要”不仅指维持新人间之里的秩序，也有将与幻想乡领导者不和的八云紫放逐至边境之意。这在幻想乡早已是心照不宣的秘密，只是八云紫似乎对此并无不满。" 
 LIB_his_page_02_title: "绀珠事件" 
 LIB_Country_History_Page_02:"又称“月之都迁都事件”。\n\n纯狐携地狱联军入侵月球后，月之都计划迁都至幻想乡，在此之前，月之都计划清理地面上的“污秽”，即消灭地面所有的生命的“地面净化计划”。然而，随着事态发展，人们原本以为，月之都迁都计划只是迫使幻想乡出手击退纯狐的计谋，但当危机结束之后，月之都却没有结束地面净化计划。大量的月民和月兔没有得到返回月之都的命令，便依托在新人间之里秘密修筑的军事设施，逐渐形成了相对封闭的社区。\n\n有人认为，地面净化计划只是月之都流放在纯狐入侵期间沾染污秽的月民的借口，也有人认为，地面净化计划始终没有结束，但无论如何，月都移民已经成为了新人间之里人口一大重要组成部分。" 
 LIB_his_page_03_title: "后户民与兽人" 
 LIB_Country_History_Page_03:"摩多罗喜爱能在垂危之时仍然爆发出强大求生欲的生命，被选中的生命则会通过后户之国被安置到三途河南岸不为人所知的土地。久而久之，被摩多罗安置的人们共享了对摩多罗神的信仰和跨越了种族，身份和历史的“后户民”身份认同。\n\n由于对摩多罗神的信仰要依赖一套独特的祭祀仪式和场所，后户民们便抛弃了过往的居所，在新人间之里这片土地上建立了自己的社区。\n\n后户民在漫长岁月里，与这片土地上真正的原住民——兽人们，形成了相对稳定的地理与政治分野，后户民以和谐的互相交流，贸易和消极同化政策与兽人和平共处。这一思想也部分被后来的幻想乡开拓民与新人间之里殖民政府所采用，但时至今日，兽人的经济地位仍然低下，大多数兽人依然在沙漠边缘维持着传统经济，少部分兽人则向北进发到绿洲区参与建设种植园，真正进入到城市中生活的兽人少之又少。有人批评这种现象是对兽人的歧视，但新人间之里当局宣称，当局从来无意干预兽人群体的经济地位，目前现状只是兽人在尝试与现代社会和平融入。" 
 LIB_route_guide_desc: "§Y新人间之里§!路线指南\n设法让@DVL§0魔导国§!的白骨大军击败幻想乡，即可体验全部内容。\n如果你选择了给@DVL§0魔导国§!满加强，你将体验一次难忘的征程。\n\n如果实在无法对抗白骨大军，可以选择入侵中立国家以获取工业，资源和人口。\n相信特种部队。"
