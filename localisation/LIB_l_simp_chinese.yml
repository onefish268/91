  LIB_BBA_end_title: "至此，§F[LIB.Getname]§!的征途告一段落"
  LIB_BBA_end_tip: "§Y八云紫与其领导的贤者议会§!在幻想乡陷落之后，再度光复了§Y幻想乡§!。出人意料的是，当绝大多数人都认为贤者们会继续维持专制时，贤者议会却选择了重建幻想乡的民主制度。§Y贤者议会§!的带领下，现在§Y幻想乡§!已经摆脱了往日的停滞不前，正在迎来崭新的、光明的新世界。\n每一个公民的言行、消费记录、甚至是心跳频率，都通过遍布街巷的“§R红眼传感器§!”实时传输至永远亭的超级终端。在这里，人性被量化为冰分的数值：高分者享受着帝王般的特权与资源，而低分者则在系统的判定下逐渐失去生存的空间——从限制购买食物到最后在社会契约中被彻底“删除”。在制度的保障下，§Y幻想乡§!成为了一个充斥§O高效§!、§O秩序§!与§O进步§!的社会。§C社会信用§!与§R国家监督§!深入社会的方方面面，这是一场世界史上全新的政治革新。\n从不列颠到君士坦丁堡，§Y幻想乡§!已经是称雄欧陆的世界大国，不再如以往偏安一隅。我们继承了历史上那些伟大征服者的冠冕，创造了属于幻想乡的新秩序。"
  LIB_BBA_end_close_button: "幻想乡仍在，谢天谢地！"
  LIB_BBA_end_close_button_TT: "看着眼熟吗？这一切就像回到了御阿礼之子刚刚踏上轮回之时。"