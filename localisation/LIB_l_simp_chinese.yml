 LIB_flavor.1.t:0 "始动"
 LIB_flavor.1.d:0 "新人间之里城郊，一座不起眼的木屋里。八云蓝正气喘吁吁。她从办公桌下拿出一张符纸，熟练地用尖牙咬破手指，滴上血，画着图案，口中则念念有词。\n“紫大人，快收到我的消息啊！”蓝的额头上沁满汗珠，“您可不要在隙间里睡死了......”\n正在此时，她身旁的电话铃声突然响起。\n“怎么在这个时候来电话？”她望了望电话，又看着手中正在发光的符纸，思索片刻，还是将符纸放下，拿起电话。\n“八云邸。公务请接新人间之里行政办公室。”蓝熟练地说着。\n“哎呀，蓝。是我。意外吗？”电话那边传来熟悉的声音。\n“紫大人......这是？从隙间里打来的？”\n“我把电话线接到隙间里来了。你看，这是不是很方便？你以后联系我也不需要再用法术了......”\n“想不到您会用这种科技。诶不对，紫大人！玩笑话还请等会再说......”\n蓝的话音刚落，在她身后，空间中霎时裂开一道缝隙。蓝回头时，正好与刚刚走出缝隙的妖怪贤者对上视线。\n“事情严峻到连玩笑话都不愿意听我讲完？那看来有什么比那位御阿礼之子去世更严重的事情发生了。把简报给我看看吧。”\n“您还是一如既往地善变呢。”紫的话音刚落，蓝就从袖中掏出了一张满是打印字的纸张，双手递上。\n“这句话我就当夸奖了。”紫接过了纸张，阅读起来。\n蓝将手插进袖子，恭敬地立在一旁。她不禁开始盯着自己的主人的脸，试图在上面找到几丝波澜。可望来望去，紫的神情还是一直未变。\n“看来这确实值得你将我从隙间中唤醒。这次的危机比阿兰陀（注：荷兰）的郁金香事件还要可怕。新人间之里居然会有人挨饿，我都不记得上次幻想乡发生饥荒是什么时候了。”\n“您的意见是？”蓝盯着紫。\n“这次的危机看来需要我出山了。”紫轻巧地打了个哈欠，望着眼中已经开始闪烁光芒的蓝：“不要摆着那副得了救的表情。你还有很多事情要做呢！先从搜集受灾情况开始吧。”"
 LIB_flavor.1.a:0 "是的，紫大人。"
 LIB_flavor.2.t: "日常" 
 LIB_flavor.2.d: "“蓝大人，这太无聊了。”橙把鞋子扔到一旁，踮着脚蹲在椅子上，而整个上半身则趴在办公桌上。\n\n“说要我在这里接电话，可是这几个小时了，这电话都没响过。我担心离开了会漏掉电话，可在这里，我除了听这收音机，什么事也不能做呀！”\n\n“唉，这是最简单的活了。”八云蓝站在办公桌旁训斥着，“只用接几个电话，记一下内容而已。难道你想像我这样忙吗？当初你答应成为我的式神时是怎么承诺的？”\n\n“蓝大人……我确实说过，为了获得力量我会为蓝大人做任何事。但是……只是在这里打电话，接电话，写字，打印纸，撕纸……这真的能获得什么力量吗？”\n\n“做这些事，是紫大人的安排。难道你怀疑紫大人的安排吗？”\n\n说完这话，八云蓝望着仍然嘟着嘴的橙，内心突然有些过意不去，“什么时候紫大人醒来，我们一起去请她解释吧。” \n\n“蓝大人！有新的电报！急电！”办公室外，不知是谁叫喊着。八云蓝听到后，立刻冲了出去。等她回来时，办公室里却空空荡荡。\n\n“橙？你去哪里了？”八云蓝嗅探着橙的气息，蹲下来看办公桌下，可哪里都没有橙的踪迹。就这一会儿，这猫妖居然从眼皮子底下跑了？\n\n“橙，我承认你躲的好，快出来吧。”八云蓝在办公室里到处翻看，突然瞥到了墙脚的一盏台灯，又看了看桌上那几乎一模一样的“台灯”，心里全都明白了。\n\n“SpellCard，式神【橙】！”话音一落，那桌上的“台灯”立刻滚倒，连带着把收音机也撞下桌去。“橙！没事吧？”八云蓝上前，橙脸朝下摔在地上，而那收音机一摔，发出呜呜的怪声。\n\n就在这时，收音机里传来了一个冰冷的女声：“十分钟前，敬爱的执政官稗田阿求在家中去世。治丧委员会正……”\n\n“蓝大人……”橙从地上爬起来，“这是说，寺子屋的那位读书人……还是死了？" 
 LIB_flavor.2.a: "是的，她命运如此，正如我手上的电报所说。"
 
 
 LIB_flavor.3.t:0 "沙漠苦旅1"
 LIB_flavor.3.d:0 "帕萨已经与大部队离散了两天了。身上还有粮食，可水已经喝完了。夕阳西斜，茫茫沙漠连块岩石都没有，他感觉自己像是在原地打转了几个小时。帕萨的耳朵透出明显的血丝，热风吹来，风中的沙子刮得他耳朵生疼。\n\n“我是不是要死了......上次来的时候......绿洲应该在这一块啊......哎呀！”帕萨望着天上巨大的太阳呢喃着，脚下突然被什么东西绊倒。等他再度爬起身才看到，脚下的沙子里露出半只脚，居然是一具干尸！\n\n“哎呦我去！”帕萨坐在地上，拍了拍脸。“这不会是幻觉吧......不管了，得先看看你有些什么。”他把那尸体扒出来，在那尸体的腰间，居然挂着一个皮囊。帕萨挤了挤，那皮囊居然还是满的！\n\n神灵保佑啊！居然有水了。可他还没把皮囊拿起来，一只手就伸过来，抓住了他的手腕。帕萨抬起头，一记重拳就打到了他的面门。\n\n“啊！谁敢打我？”帕萨被打翻在地，他抽出一把磨到开刃的铁勺子，站起来。面前是个壮硕的犬兽人，她正用力地把那皮囊从死人怀里拽出来。\n\n“你这母狗！这是我先发现的！”帕萨举起勺子对着那犬兽人。\n\n“见面就叫人母狗，真没礼貌！小公狐狸，有命就来拿呀！”那犬兽人举着皮囊挑衅他。\n\n“来就来！”"
 LIB_flavor.3.a:0 "帕萨冲上去，用身体撞向那犬兽人。"

 LIB_flavor.4.t:0 "沙漠苦旅2"
 LIB_flavor.4.d:0 "“切，这么小个子还这么倔。”那犬兽人丢掉皮囊，举起双臂阻挡，和帕萨缠抱在一起。帕萨还没反应过来，就立刻挨了一膝顶。\n\n“唔......”帕萨只感到五脏六腑都要裂开了，但经验告诉他，敌人肯定要乘胜追击。他忍着痛迅速侧滚，一记重踏就砸在他身旁。\n\n“好机会！”趁对方攻击失手，帕萨立刻扬起勺子，那犬兽人哀嚎一声向后退去。他看见那犬兽人捂着脸，血从爪缝中流出。\n\n“啊！你居然伤了我的脸！姑奶奶要你的命！”那犬兽人狂叫地冲了上来，一把抱住帕萨的脖子。帕萨立刻用力把勺子刺向那犬兽人的腹部，可那犬兽人毫无反应，一肘打在他的左脸。帕萨的世界一阵闪烁，他摔倒在地，两颗牙伴着血从他嘴中吐出。接着，一记重踢又踢在他腹部，帕萨立刻眼前发黑，趴在了地上。\n\n“好，现在那皮囊......归我了。”那犬兽人腹部还插着勺子，血从伤口处缓缓流出。她捡起地上的皮囊，举过头顶，打开盖子。\n\n可倾斜而下的不是水，而是滚烫的沙子。\n\n“哈.....哈哈，我说这死人......怎么还抱着这么大一袋水......原来是用来骗自己啊！”"
 LIB_flavor.4.a:0 "当沙子流光时，那犬兽人也倒在了地上。"

 LIB_flavor.5.t:0 "沙漠苦旅3"
 LIB_flavor.5.d:0 "“我叫帕萨，是阿图格部落的。你呢？”帕萨躺在沙丘上，问道。\n“阿娜扎，本豪部落......”阿娜扎按着腹部的伤口回答着。\n“很抱歉......你这个伤口......”帕萨尴尬地盯着阿娜扎的腹部伤口，“要不你歇一会，我来帮你按一会。”\n\n“算了......看你这么瘦，你能按多久？”阿娜扎声音微弱。\n“话说，你也是从种植园过来的吗？”帕萨问。\n“是。”\n“你也是和大部队走散了吗？”\n“不然呢？”\n“唉......这条路真不好走。这比在种植园挨饿还难受......吃东西吗？”帕萨从干粮袋里拿出一点麦粒。\n“干的，不吃。”\n“也是。”帕萨躺下，看着天上的星空，“明天一早，等到太阳出来，我们两个就会死吧。”\n“是啊，跟你这家伙死在一块，真是无聊......”阿娜扎伸手去摸插在腹部的勺子，“或许你还能活下来。把我的血喝一些，你还能再走一段路，说不定......”\n“这怎么能行！”帕萨连忙转身，把阿娜扎放到勺子上的手拨开，“这不是杀人吗？你的鬼神会跟我一辈子的！”\n“这算我自杀......”\n“那也不行，这算你因我而死。我就算死在这，也不能这么做。”帕萨斩钉截铁，又犹豫起来，“再说，我丢了方向，就算再走一段，说不定也只是原地打转.延长折磨.....”\n\n“哈哈......好吧。我的血要流干了......那就一起去那边的世界吧。我要睡一会。”\n\n“好吧，看来这就是终点了。晚安，阿娜扎。”\n\n帕萨长出一口气，闭上了眼睛。可朦胧中，他似乎听到了一阵驼铃声。\n那大概是幻觉吧。这里怎么可能有人呢？但是，那驼铃怎么，越来越近了？\n帕萨眼睛睁开了一小条缝，他模糊地看到，真的有骆驼从他们面前走过。\n“秽身探知水雷的反应很强！你们四处看看！”\n“月球人的东西经常误报的，老大你确定吗？”\n“找到了！真的有人！两个伤员！状态很差！”"
 LIB_flavor.5.a:0 "“快点！你去拿水！还有你，把药品和后户徽章也带上！”"
 
 LIB_flavor.6.t:0 "小意外"
 LIB_flavor.6.d:0 "“这里的纸太多了，不要再往这里堆纸张了！”\n当一个小妖精搬着一沓纸张进入办公室，放在办公桌上时，八云紫终于按耐不住了。\n“真是抱歉！真是非常抱歉！贤者大人，我的职责就是往这里送纸。贤者大人请不要生气！”小妖精被吓得不停地鞠躬。\n“没有怪罪你的意思，但是......蓝平日的工作量这么大吗？唉，她去巡查城乡物流之前那么心神不宁，原来是不放心我来代管她的事务啊！”八云紫嘀咕着，转头面向那个小妖精：“把财务部长，人事部长和防卫部长叫到这里来。”\n\n“啊？我？”那小妖精张大嘴巴，“我就是一个送纸的，贤者大人”\n“呵呵，只会送纸，那就只能送纸。你要是能把他们叫过来，那你认为，你还会只是送纸吗？”\n“好吧，贤者大人，我试试。”那小妖精吞了口口水，跑出了办公室。\n\n过了一会，一个人类，一个灰狼天狗和一个凤蝶妖精一起走进了办公室。“抱歉，贤者大人。我们没料到您会让一个小职员来通知我们......”人类赔着笑，张口说。\n“那个小妖精以后就是我的传令员了。现在重要的事情。”八云紫抄起桌上的两张纸：\n“财政部报告这周的财政收入和支出情况，还报告各个项目的执行情况。财政部为什么这么事无巨细？这些事不应该在财政部内部解决吗”\n\n“这......蓝大人在的时候，我们都是这么做的。”人类低着头回答。\n“还有这个，某某职员喜欢上班开小差，某某官员违规飙车，违纪就按照规章制度办就好了，可别让别人把你们当成那个喜欢爆料的鸦天狗。”\n“额......蓝大人叫我们收集的。另外，我们确实按制度处理了他们。”灰狼天狗用袖子擦了擦汗。\n“好，还有这个。自卫队训练程度接近七成，少量人受伤......防卫部长现在遇到了什么困难吗？如果没有困难，报告这些是为了什么？”\n“爱塔妮缇不知道哦，蓝大人确实要求上报这些信息。”风蝶妖精一脸天真。\n“从今往后，上报那些你们解决不了的困难就可以了。”八云紫挥了挥手。\n\n“在下还是劝您不要这么命令为好。”人类鞠着躬，攥着手，“蓝大人回来了，看不到我们的报告，我们没法交代啊！”\n“这样啊，但贤者可不是超级计算机，像蓝这样行政，比巡视博丽大结界还累。”八云紫手指一划开，隙间凭空出现。\n\n“SpellCard，式神【八云蓝】！”八云紫一声令下，符文的光芒在空中出现。\n\n然而什么都没发生。\n\n“拒绝了？”八云紫皱眉，“你们先退下吧。”\n等到众部长都离开后，八云紫把手伸进隙间猛拽。隙间里传来一阵嘈杂的喊叫声。八云紫只感觉手感很怪，八云蓝似乎在抵抗，又像是卡在什么地方了。\n“蓝！你是不是遇到什么危险了？”八云紫又再努力用了用力，从隙间里拽出了一只狐狸耳朵。她再用力一拽，八云蓝从隙间中现身摔在地上。\n“蓝！出什么事了？为什么不回应召唤？”“紫大人......我没事，但是......”八云蓝挣扎着，从地上爬起来。\n“没事就好，回答一下你是怎么锻炼这些官员的，蓝。”\n“紫大人，请您先等一下......”\n“行政就像放牧，把羊赶到草场就行了，了解每只羊吃了多少草是牧羊犬的工作。你为什么要收集这么多的报告呢？”\n“紫大人，请您......”\n“像溺爱孩子一样对待这些部长可不行。时间长了，他们会变得毫无主见的。”\n“紫大人......”\n紫终于停下，眯着眼看了看蓝，似乎感到有些不对：“唉，什么事让你这么着急？蓝，现在给你机会，你要说什么？”\n“紫大人......我刚刚在开车！橙还在车上呢！”"
 LIB_flavor.6.a:0 "啊？"
 
 LIB_flavor.7.t:0 "落席"
 LIB_flavor.7.d:0 "“终于来了啊，大贤者！”\n\n当八云紫走进会议室时，摩多罗隐岐奈与稀神探女已经在等待她了。\n\n“秘神大人对这场会议这么积极，那想必我们的谈判会非常简单吧。”八云紫轻笑，“月都的朋友看来也很热情，两位居然比预定时间早到了二十分钟，这真是令人欣喜。”\n\n“我可不忙，我的事务大都是舞和里乃完成的，我来去自由。”摩多罗看向对面的探女，“倒是这位月都的大官，最近可是忙的团团转啊！大贤者应该知道围攻月民社区的骚乱吧？”\n\n稀神探女看了看摩多罗，又看了看紫，轻轻点了点头。\n\n“恕我直言了，如果这场会议只是讨论钱和垄断，还有那什么‘发展与投资委员会’的事务，那我认为，我们可以直接进到签字环节了。”摩多罗向椅背一靠，“但是这场会议并没有这么简单吧？”\n\n“不愧是秘神啊，我相信幻想乡的贤者之间是颇具默契的。”八云紫看了看探女，“只是这位月都的朋友，不知你是否有着与我们一致的默契呢？”\n\n“默契啊......你们知道，事态顺利发展的时候，我不会多说。”探女低着头，仍然托着下巴。\n\n“好吧，那我就要发难了。月民仅仅依靠着不到百分之五的人口数量，用股权间接控制了新人间之里近两成的资产......这看起来可并不太寻常。”\n\n“这听起来像是夸奖。过去，月之民只需要有限地分享一些科技，就能够做到这个程度......”探女抬起头，盯着八云紫。\n\n“简单地查询账目就可以发现，月民的资产收入全部用于在新人间之里的再投资，一分钱也没有外流。所有的企业资金流动，您是最后的主轴，探女大人。月都似乎在回避与普通的月民直接接触关系呀？”\n\n“月之都无需全盘透露自己的安排。”\n\n“恐怕没有这么简单。这位摩多罗秘神，可是掌握着生命力量的神明。”八云紫淡淡一笑，“换句话说，那就是彻底的‘污秽’。再放眼望去，新人间之里这块土地，与其说是由各族开拓民和兽人共同建设的家乡，不如说，是各式各样的‘被排斥者’的归属。开拓民们为了躲避竞争而来到这里，兽人们则是被世界抛下的弃儿，更无论那名号里就明确的后户‘被差别民’了。”\n\n“说我是‘污秽之神’可真是不礼貌啊！紫，你也是被排斥到这里的。”摩多罗侧靠着椅子，撑着脸颊。\n\n“是的，这些都是可以信手拈来的现实。新人间之里的生命比幻想乡的生命更需要着斗争，这片土地便因此凝聚了更多的污秽。”八云紫用折扇指向探女，“这样一来，月民被滞留在如此污秽的土地上，却看起来一点也不着急，这看起来并不像是‘事态顺利发展’呀？”\n\n探女看着眼前的八云紫，长叹一口气：“这是地面净化的一部分。多余的内容，我不会多说。”\n\n“并不是这样。”摩多罗打断，“让月民们号称‘净化地面’，却又在污秽的地面一事无成，这样一来，人们会怀疑，所谓的地面净化到底是不是地面的月民虚与委蛇的借口。月都的朋友，您应该知道月之都迁都事件的时候，地狱的生命力让月之都不少居民受到了严重的侵蚀。”\n\n“秘神大人，您或许有些急躁了。”紫的折扇打开，微微掩住笑容，“既然这些反常仍然是地面净化的一部分，至少我们能确认一件事，月都目前还需要地面的月之民，而我们确认，基于月民在新人间之里的影响，我们需要这位月都的朋友。”\n\n“就像幻想乡需要新人间之里那样？那真是有趣啊。紫，我需要提醒你，从这个角度讲，幻想乡在做和月都相同的事情，都在把‘沾上污秽’的人塞到这里。”摩多罗点点头。\n\n“您这样理解，我并不会干涉。”探女点点头，“贤者大人，感谢您的承诺。但我也提醒您，地上的月之民并不是被差别民，月之民有自己的骄傲。这份骄傲......不会被褫夺。”\n\n“那么，为了我们永远骄傲的月都朋友，也为了我们这沾染污秽的新人间之里，”紫招了招手。"
 LIB_flavor.7.a:0 "“蓝，把文件发给两位大人吧。”"
 LIB_flavor.7.a_tt:0 "§R自天探女口中说出时，命运就已经开始发生逆转，或者说正因命运注定发生逆转，天探女才愿说出。§!"
 
 
 LIB_flavor.8.t:0 "于梦境中的月球基地"
 LIB_flavor.8.d:0 "“那么，贤者阁下，”哆来咪漫步在月球表面上，而八云紫跟在她的身后。\n\n“希望您满意月球观测站的建设情况。稀神探女大人为了争取月之都的同意和建材支援付出了很多。”\n\n“不错。我原先以为，月球观测站距离地球这么远，还受到月相的影响，效果并不会太好。”八云紫轻笑着，“现在一看，月之都可真是慷慨啊。”\n\n“如果这些气象数据能够帮助贤者阁下的话，那么我的工作也就有价值了。”哆来咪转过身来，指向远方，“前面就是第四槐安通道了。”\n\n“这就是那能够通过梦境来往月球和地面的通道吗？这还是第一次见到呢，真是壮观啊。”八云紫抬起头，眼前的空中浮现出一道奇异的通道：红色与蓝色的光线于空中环绕，围出了一眼望不到边界的方框通道。一团团深红色的光线在通道内穿梭，不知是灵是鬼。\n\n“贤者说笑了，您通过境界之力，通过水中之月到达月球的奇迹才是最壮观的。不过，既然贤者阁下想要亲身体验第四槐安通道的奇妙，那么在下就于此驻足了。”哆来咪顿了顿，“作为例行公事，在下需要提醒您，既然妖怪也会做梦，那么您也有可能会在通道里看到一些古怪的情景。”\n\n“这是指，一些藏在我的梦境深处的诡异情景会浮现在我的面前吗？”\n\n“是的，”哆来咪点点头，“但不只是。第四槐安通道是共用的梦境通道，总的来说，被越多的人共享的梦境，就越有可能在通道内被具现。如果您向前踏入了通道，请您做好准备。但这些具现的梦境总归是没有实体的无害物......阁下应该不会轻易......”\n\n“嘿！汉斯，我没看错吧？那里有人啊！”正在这时，一个粗犷的男声插入了对话。八云紫循声望去，在月面的远方，一小队穿着黑色制服的士兵踏着齐步走来，领头的高大士兵举着一面鲜艳的红色旗帜。而那名士兵身旁，一名军官挺胸抬头，神气赳赳。\n\n“人类吗？”八云紫微微惊讶。她抬头看了看那红色的旗帜，“原来是这样啊......”\n\n“两位姑娘......我这是在做梦吗？居然能在新施瓦本第二基地附近见到人！”领头的军官一路跑了过来。八云紫看着这位军官跑到她的面前，拍打着脸颊，又深呼吸了数次，才继续开口：“真的，你们是人类吗？能到这里来的，一定不是一般人类吧......”\n\n“啊......当然不是。”八云紫微微一笑。\n\n“是吗？果然......我就认为人类不会来到这里，尤其是一个东方装束的姑娘......”那军官低着头，“那么......你们是来自地球的吗？”\n\n八云紫看了看那军官碧蓝的眼睛，微微地点了点头。\n\n只此一刹那，小队里就爆发出一阵欢呼。那军官回头大声吆喝，小队这才慢慢安静下来。\n\n“那么，姑娘，你知道......”那军官低着头，有些犹豫。但最后，他还是深吸了一口气，“我们的元首......现在怎么样了？”\n\n“你们的元首？”八云紫将折扇打开，轻轻掩盖住笑容，“你们的元首，已经死了很久了哦......”\n\n“啊！？”小队里顿时又爆发出一阵惊呼和议论，军官难掩自己的惊讶，“不可能！元首昨天才和我们通话过！”\n\n“唉，就算以如今的科技，地面与月球通信也很困难吧，你们的那位元首，到底是怎么跟你们通信的？”\n\n“这你别管，德意志的科技天下第一，区区宇宙通信而已......”\n\n“在月球上设立基地，看起来更加不可能呢！这也能用科技领先来解释吗？”八云紫举起折扇，指向那个军官：“不如说，在没有空气的月球还能正常活动和发声，你们是人类吗？”\n\n“你懂什么？”那军官气急败坏，从腰间抽出鲁格手枪，指向了八云紫：“雅利安人本来就是外星的优等民族，别说在月球建立基地，就连......”\n\n还没等军官说完，八云紫轻轻挥动折扇，那军官和士兵们立刻化为了一团光芒。这光芒一开始还聚在一起，但很快又如星点般，在月面四散开来。\n\n“说的什么胡话？这就是那个被很多人共享的梦境吗？”望着逐渐开始暗淡的星点，八云紫用右手托着下巴。\n\n“如果它出现在这里，那么......应该是吧。”哆来咪站在八云紫身旁，点了点头。\n\n“唉，我想，我知道为什么灵梦说，第四槐安通道的体验并不太好了，看来我也差点深陷其中了啊。”八云紫转过身来，她轻轻捏着折扇，指向了哆来咪，“那么，你会不会也不是真实的？你到底确实是那个哆来咪，还是只是我幻想的？”\n\n“贤者阁下，您应该有答案了吧。之所以通道的入口会出现具现的梦境，是因为，这里根本不是通道的入......口......”八云紫轻轻挥动折扇，哆来咪的声音立刻变得粗犷低沉起来。很快，哆来咪周身开始变得刺眼，变成了一大团光芒。光芒越来越大，越来越亮，逐渐开始吞没她周身的月面，扩展开来。最终，光芒充满了八云紫身边的每一个角落，将八云紫也整个包裹了进去。八云紫轻轻闭上双眼，再度睁开时，眼前的世界已经变成了熟悉的一片黑暗。在黑暗中，红色与蓝色的光线于空中环绕，将八云紫围在了一眼望不到边界的方框通道之中。\n\n“看样子，或许我要继续沿着通道走下去了。”八云紫向着通道的一侧望去，红蓝光线围绕出的通道一路延伸，而在通道的末端，那硕大的蓝色星球明亮而闪烁。“下次还是利用隙间好了。”"
 LIB_flavor.8.a:0 "不过，人们为什么会共享这么奇怪的梦境呀？"
 LIB_flavor.8.b:0 "这种奇怪的信仰，还是不要被神隐到幻想乡为好。"
 
 LIB_flavor.9.t:0 "回响"
 LIB_flavor.9.d:0 "“明白了，紫大人。企业救济和抑制人道灾难的任务，我会很快按照您的要求去办。”桌对面的八云蓝捏着文件，微微点头。\n“很好。蓝，救济的具体细节，你自己敲定吧。”办公桌后的八云紫转动旋转椅，望向窗外。新人间之里灼热的阳光穿过玻璃照在她的额头上，泛起了点点汗星。她不由得从腰间掏出了折扇扇风，“今年的夏天似乎来得更早些。要是目前的经济危机继续下去，盛夏会让很多人很难熬吧。”\n“不如说，新人间之里向来如此炙热。紫大人，要不我来替您来扇风？”望着背向自己的八云紫，八云蓝不由得向前微微倾身。\n“哎呀，蓝，这份好意我就心领了，你还是考虑一下如何完成任务吧。”八云紫用右手托住脸颊，“这令人疲乏的午后啊......在我午睡之前，有什么就说什么吧。”\n“嗯，紫大人。还有些比较棘手的事件，希望您能够指导。”八云蓝翻动着手上的纸张，“大结界对面的白骨大王最近好像正在扩大军队，他们吞并了几个小邦，幻想乡当局正在抗议。我们该采取什么态度？”\n“那和我们有什么关系？”八云紫打断，“我们观望着，闭口不言就行。”\n“好的，紫大人。下一条，经济危机爆发后，红魔馆宣布不再服从博丽巫女的秩序，雾之湖的妖精好像在和她们争夺红魔馆周边的控制权......”\n“那也是幻想乡的事情吧......”八云紫打断。\n“确实......摩多罗大人抗议任命爱塔妮缇小姐为防卫部长的决定，她说让一个妖精担此大任实在不妥。”\n“唉，我听说摩多罗把那个凤蝶妖精当作那个强大的常夜神了，秘神和一个妖精过不去，真是奇怪啊。”八云紫摆摆手，“不过，新人间之里恐怕没有比爱塔妮缇更有经验又一心尽责的人选了，你回复就说，如果她不满意，就提名一个能力更强的人选。”\n“嗯，这确实是个好主意。下一个，沙漠里似乎崛起了一支叫‘兽人共斗同盟’的组织。他们主张用暴力手段给兽人们带去平等权利。需要盯紧吗？”\n“这个组织还没有明确的领导核心，也缺乏能够维持长期行动的干部。现在担心他们还不如担心月民们闹事。”八云紫挥了挥手，“只有这些内容吗？”\n“额......紫大人，您怎么对这个组织了解得这么多......还有一件事。”八云蓝有些犹豫，“是橙的事，并不算什么大事。但......我觉得有必要说。”\n“不妨说。”八云紫打了个哈欠，“说不定比刚才的事情有意思。”\n“您曾经说过，案牍的修行也能提升能力。这段时间，我确实学到了不少知识，也见识了许多人的生活。可我想把这些经验教给橙时，她却总提不起兴趣……我在想，她是不是并不适合行政这条路......”\n八云蓝话音落下，八云紫却完全没有动作。\n“嗯......紫大人？”\n“你还记得橙学习奇门遁甲的时候吗？”八云紫突然开口。\n“奇门遁甲啊，那是很久之前的事情了。”八云蓝沉思着，“那次，橙好像学得很主动，很有兴致。我当时还感到奇怪，奇门遁甲明明并不是什么寻常技艺。”\n“我记得可清楚了。”八云紫微笑着，又转到面向八云蓝，“那次，橙在迷途之家被欺负了。你去为她打抱不平，却挨了那博丽巫女的打。”\n“是的，我记得您后来为我出头，也被退治了。”八云蓝点头。\n“蓝，记那么清楚干什么？”八云紫故作嗔怪，“不过，事后一想，橙这孩子，或许就是被那好胜心所驱动，才会老老实实地跟你学奇门遁甲吧。”\n“这样啊......”八云蓝点了点头。\n“我想，橙离开迷途之家，跟随我们来到新人间之里，也有一段时间了。”八云紫说完，又举起折扇开始扇风，把椅子转到背对八云蓝：“你觉得这小猫，会不会有些寂寞，想要交更多的朋友呢？”\n“交朋友？”八云蓝抬头，“可交朋友，与行政修行又有什么关系？紫大人，我不太明白。”\n“哎呀，”八云紫微笑着，“博丽的巫女，雾雨的魔法使，吸血鬼的忠仆，冥界的管理人，月球的大官，还有那位摩多罗神，都是我的朋友，你觉得呢？”"
 LIB_flavor.9.a:0 "让橙交更多的朋友，未来有更多余地，这确实正是力量的增强。"
 LIB_flavor.9.b:0 "但这话从喜欢强加麻烦于他人的紫大人口中说出，意味就有些怪了"
