#国策
LIB_new_focus_0: "新人间之里最平常一日"
 LIB_new_focus_0_desc: "执政官稗田阿求，此代御阿礼之子，已再度踏上轮回转生。\n\n讣告将循例发布，追悼从简。对三途河南岸的开拓民而言，这不过是远方又一次人事更替。新人间之里第三期拓殖建设进入收官验收，行政日程不因人事更替而中断。"
 LIB_new_focus_1: "继续新人间之里三期建设"
 LIB_new_focus_1_desc: "新人间之里的三期工程已接近尾声，前期城区拓展与深水港建设已经完成，而产业园区的厂房与管网已经完成，目前只待工业设备入驻，调试，与贤者的投产许可。"
 LIB_new_focus_2: "建设中止"
 LIB_new_focus_2_desc: "经济危机骤至，新人间之里三期工程资金链断裂。域外投资方撤资，产业园区投产计划落空，园区仅余凋敝厂房与待安置工人。月都系资本与后户系势力均陷严重亏损，所控工厂矿业濒临瓦解，资产面临转卖。城内商户大批倒闭，局部已出现黑市与以物易物。本地兽人亦大规模失业，存在滑向赤贫与饥荒的风险。此等局势已非八云蓝所能裁断，必须奏请八云紫大人结束休眠，主持大局。"
 LIB_new_focus_3: "财政紧缩"
 LIB_new_focus_3_desc: "新人间之里缺乏货币自主，为重启经济循环，只能实施严格财政紧缩。除核减一切可以削减的开支，还须暂缓或终止部分建设计划，以腾出重启经济所需资金。"
 LIB_new_focus_3_tt: "§Y这将在短时间内加剧经济危机，但提高社会韧性§!"
 LIB_new_focus_4: "扩大贤者权力"
 LIB_new_focus_4_desc: "再不快点开始行动，银行挤兑潮就会带动大量企业破产，将新人间之里拖入万劫不复。然而，拓殖地的法律与重大政策仍须经幻想乡批准，这极大限制了救济措施的实施速度。为此，贤者必须获得“先斩后奏”的权力，以便及时应对危机。\n\n这或许会让幻想乡领导者们想起臭名昭著的《解救人民与帝国苦难法》，不过，幻想乡的领导者应当不会在这个关键时刻触怒紫大人。"
 LIB_new_focus_4_tt: "§Y提高行政开支，用货币购买行政点数以迅速完成危机处理国策§!\n\n§Y幻想乡拒绝八云紫扩大权力的路线将会在未来制作§!"
 LIB_new_focus_5: "寻求磷矿出口"
 LIB_new_focus_5_desc: "随着市场上化肥需求锐减，新人间之里引以为傲的磷灰石价格大跌，矿场经营低迷。因税基依赖磷灰石出口，价格低迷直接冲击新人间之里的财政收入，进一步加剧了经济危机。将磷灰石转向军事用途或为破局之道。包括幻想乡在内，一些谋求军备重整的国家可能成为潜在买家。"
 LIB_new_focus_5_tt: "§Y在幻想乡的默许下，磷矿将被出口向正在军备重整的国家§!"
 LIB_new_focus_6: "资金必须流动"
 LIB_new_focus_6_desc: "依赖少数企业家口头承诺的融资渠道已不可持续。当前须将贤者权威转化为融资信用，以贤者的境界权能来担保资金安全与投资信心。为此，新人间之里将在贤者授意下设立对外投资合作机构，统筹招商、担保与通商交涉。"
 LIB_new_focus_6_tt: "§Y国家动荡将减轻§!"
 LIB_new_focus_7: "注入本地活力"
 LIB_new_focus_7_desc: "新人间之里民间资本仍有潜力，但当前缺乏安全、稳定且值得信赖的投资渠道。应由八云蓝署理发行本地公债，以税基与贤者信用为担保，引导民间资金定向投入危机应对、税基修复与新人间之里三期建设工程善后。"
 LIB_new_focus_8: "解救银行"
 LIB_new_focus_8_desc: "以新人间之里保留财政，港务收入，以及贤者的妖力作为担保，政府将向各大银行紧急收购一批不良资产，以此向银行注入流动性，压制正在蔓延的挤兑潮，使银行恢复正常兑付与放贷能力"
 LIB_new_focus_9: "发展与投资委员会"
 LIB_new_focus_9_desc: "新人间之里此前经济无序扩张，导致今日结构芜杂、投机横行，实业投资受到挤压。为此，须建立中央管理的投资审核，批准与定向投资组织。贤者授意月都、后户两大财团共同参与组建发展与投资委员会。"
 LIB_new_focus_10: "大规模审计"
 LIB_new_focus_10_desc: "铺张浪费在景气时期或可容忍，在危机时期则直接侵蚀发展根基。为此，审计机构将并入发展与投资委员会，统一管辖新人间之里各类建设项目。既有面子工程、低效投资与不当采购不予追溯；但任何拟重启或续建者，须向委员会提交审计报告并接受审核。"
 LIB_new_focus_11: "完成新人间之里建设"
 LIB_new_focus_11_desc: "历经危机、停工与方案数度调整，新人间之里三期建设计划终告完成。扩建的城区、完善的深水港与建成的工业园区，将作为幻想乡和谐与繁荣的象征矗立于此。"
 LIB_new_focus_12: "八云蓝的救济一揽子计划"
 LIB_new_focus_12_desc: "八云蓝已为危机中的大小企业与本地居民拟定成套救济方案。随着贤者权限扩大，实施救济的条件已经具备，是时候让她去实施改革了。"
 LIB_new_focus_12_tt: "§Y完成这个国策后，八云蓝将花费约一年两个月的时间完成下列国策以解决国家动荡，你也可以在此期间通过完成下列国策来加速这个过程。当你进行国策时，八云蓝会跳过你目前执行的国策去进行下一个国策。§! "
 LIB_new_focus_13: "大企业定向纾困"
 LIB_new_focus_13_desc: "历史表明，大水漫灌的经济救济往往助长了大企业的逆势扩张，最终会危及整体经济韧性。因此，此次针对大企业的定向帮扶不再以企业整体经营状况作为主要救助标准。大企业必须以充分、可信的经营数据证明自己的工厂，矿山和农庄还能够盈利，才能获得挽救产业的贷款。"
 LIB_new_focus_14: "收购处理不良资产"
 LIB_new_focus_14_desc: "作为择优纾困的配套安排，政府将有选择地收购大企业低效或亏损资产。经前期核查，存在部分产业仅因管理不善亏损，亦有矿藏已近枯竭、继续开采无利可图的矿井。上述资产将会分类处置：或重整经营，或拆分出售，或拆除并变卖可移动设备，将土地转作他用。"
 LIB_new_focus_15: "压低劳工待遇"
 LIB_new_focus_15_desc: "过去，为维持幻想乡的内部和谐，法定劳工待遇标准较为优厚。然而经济危机之下，吸纳大量劳动力的中小企业利润更加微薄。若继续维持旧待遇标准，中小企业将难以为继，无力招工，而失业劳工亦就业无门。为渡过危机，法定劳工待遇须作临时下调。"
 LIB_new_focus_15_tt: "§R这些选择都不完美，需要承担一定代价。§! "
 LIB_new_focus_16: "解决生存危机"
 LIB_new_focus_16_desc: "面向企业机构与曾有赈济经验、此时仍愿承接赈济事务的神社、寺庙及教堂法人，定向拨付款项，用于扩大收容所与粥厂，以缓解饥馑之危。此事涉及信仰流向，须由八云紫大人事先与博丽巫女沟通协调。"
 LIB_new_focus_17: "累进税改革"
 LIB_new_focus_17_desc: "新累进税法将提高高收入者与大型企业税率，降低低收入者与中小企业税率，并提高起征点。改革短期内或削弱经济活力，但可缓解危机中中小企业的压力。"
 LIB_new_focus_18: "投资家庭作坊与行会"
 LIB_new_focus_18_desc: "居于南方沙漠的兽人素来经济地位低下，此次危机中受创最深。其赤贫、失业与流亡已危及当地社会稳定。政府将通过行会组织投资纺织、毛皮、酿酒与副食品等家庭作坊，可部分缓解地方农牧产品积压与新人间之里原材料短缺，提高兽人收入，缓和当地动荡。"
 LIB_new_focus_19: "以购代赈"
 LIB_new_focus_19_desc: "部分中小企业已恢复运转，但域外与本乡市场尚未复苏，旧有商路仍未畅通。其积压商品恰可低价购作赈济物资，发放给失业市民与本地兽人。政府以分包采购方式向中小企业购入赈济物资，可同时缓解企业积压与失业人口的生活困境。"
 LIB_new_focus_20: "发行基建债券"
 LIB_new_focus_20_desc: "新人间之里将发行基建债券，定向引导大企业认购，所筹资金用于各产业区与港口之间的交通联络。此举既可为各产业区降低物流成本，又可部分解决大企业投资渠道匮乏问题。"
 LIB_new_focus_21: "城乡物产流通"
 LIB_new_focus_21_desc: "随着前期产业扶持与刺激政策落地，城市局势渐趋缓和，失业潮开始消退。然而居民仍困于危机余悸，消费意愿低迷。政府将定向补贴南北物流与兽人农户，减免经销商税负，并以沙虫、骆驼奶酒、发菜等南方特产为钥匙，使居民储蓄重新进入商品流通，兼顾兽人族群稳定。"
 LIB_new_focus_22: "危机消弭"
 LIB_new_focus_22_desc: "再一次，贤者忠诚的式神解决了危机。虽然余波仍在，但城市与兽人居住地已经逐步稳定。新人间之里终于重新踏上繁荣之路。"
 LIB_new_focus_22_tt: "§Y经济危机问题基本解决§! "
 LIB_new_focus_23: "灾难的启示"
 LIB_new_focus_23_desc: "新人间之里在有限依赖本乡援助的条件下渡过危机，署理当局功不可没。但危机亦暴露出新人间之里外贸渠道单一、资源依赖严重、产业结构失衡等结构性问题。为建立有序、坚韧的经济体系，八云蓝将提请审议，将此前承诺的临时改革制度化。"
 LIB_new_focus_23_tt: "§Y八云紫的紧急权力结束了，但是仍然可以推动建设和改革。§!"
 LIB_new_focus_24: "保留对外投资合作局"
 LIB_new_focus_24_desc: "危机应对期间，对外投资合作局承担对外接触与招商职能，积累了交涉经验。域外投资者亦借此机构获知新人间之里的经济潜力。因此，对外投资合作局应转为常设机构。"
 LIB_new_focus_25: "建立发展与投资局"
 LIB_new_focus_25_desc: "贤者无意永久扩大自己的紧急权力。然而危机期间，贤者主导的发展与投资委员会既回应本地集团诉求，清理无序与重复投资，又协助落实政府主导的定向投资刺激，承担了关键职能。因此不如将该委员会转为常设政府机构，建立长期的投资统筹机制。"
 LIB_new_focus_25_tt: "§Y解锁发展与投资局工业企业，并在决议中解锁新的建设项目§!"
 LIB_new_focus_26: "各色鸡蛋的篮子"
 LIB_new_focus_26_desc: "对外投资合作局经数周梳理，将此前积累的对外投资关系与信息分门别类，形成可供贤者按需选择的投资渠道。各渠道涉及各大洲多个国家，彼此独立，不再依赖单一来源。贤者可据此报请幻想乡当局核准，以分散投资风险，拓宽外资来源。"
 LIB_new_focus_27: "统制船运"
 LIB_new_focus_27_desc: "为维护多数人生计与幻想乡秩序，贤者须预防危机外溢。部分国家实行的统制经济仍有可鉴之处，但贤者无权越过幻想乡当局直接管控银行。相比之下，船运业乃新人间之里外贸命脉，适合实施规模有限、却深入关键环节的统制。贤者已授权建立航运管理局，通过控制航运，间接调节新人间之里的出口经济。"
 LIB_new_focus_28: "承接劳动密集型加工"
 LIB_new_focus_28_desc: "丝绸、布匹、清酒与饼干等轻加工产品，在幻想乡市场需求旺盛。新人间之里可利用危机后劳动力充裕的条件，承接本乡轻加工产业转移，填补幻想乡市场空缺，丰富本地市场，并以就业引导兽人族群接受幻想乡生活方式。"
 LIB_new_focus_29: "幻想乡内循环"
 LIB_new_focus_29_desc: "为应对危机，幻想乡亦推行贸易保护，结界内外物资交流大减，这正是推动经济内部循环的机会。贤者将报请本乡核准定向投资，建设若干新产业园区，开发本地自然资源，提升殖民地初级加工能力，以弥补幻想乡资源缺口，兼顾本乡产业升级与殖民地发展。"
 LIB_new_focus_30: "经济理论的“中庸”之道"
 LIB_new_focus_30_desc: "托举繁荣与应对危机，稳定的中间阶层都起着至要作用。在贤者推动下，新人间之里将推动产业升级，扩大既有中间阶层，同时培育兽人中间阶层。此举旨在扩大稳定税基、缓和社会矛盾，并通过就业、财产与纳税关系，推进新人间之里与幻想乡的制度性融合。"
 LIB_new_focus_31: "数学指导投资"
 LIB_new_focus_31_desc: "八云蓝的数理才能应纳入新人间之里的行政体系。贤者授意其研习并推广外界精算学，以强化发展与投资局的风险预测与投资管理能力，并承担政府咨询职能。"
 LIB_new_focus_32: "大难临头"
 LIB_new_focus_32_desc: "人间之里已经陷落。面对白骨大军，幻想乡统一的抵抗业已荡然无存。贤者必须为幻想乡当局的流亡做准备。"
 LIB_new_focus_33: "拒绝幻想乡覆灭论"
 LIB_new_focus_33_desc: "幻想乡输掉一役，人间之里陷落，但幻想乡尚未战败。白骨及其仆从或已赢得一役，俘获了博丽巫女。但新人间之里，以及外界反对白骨暴政的盟友，将继续为我们的生活方式而战。所有尚存斗志的幻想乡子民——到新人间之里来。八云紫贤者将在此重新举起幻想乡的旗帜，引领我们走向胜利。"
 LIB_new_focus_34: "战时内阁总辞职"
 LIB_new_focus_34_desc:"[LIB_new_focus_34_desc_text]"
 LIB_new_focus_34_desc_A: "茨木华扇与博丽灵梦辜负幻想乡托付。其依赖工人组织与怀柔路线未能挽救危局。尽管多名前幻想乡内阁成员已逃至新人间之里，其继续行使权力已无正当性。他们将被勒令集体辞职，为贤者主导战时体制铺路。他们起复与否，由贤者裁定。"
 LIB_new_focus_34_desc_B: "雾雨魔理沙与爱丽丝辜负幻想乡托付。其自由放任思想未能挽救危局。尽管多名前幻想乡内阁成员已逃至新人间之里，其继续行使权力已无正当性。他们将被勒令集体辞职，为贤者主导战时体制铺路。他们起复与否，由贤者裁定。"
 LIB_new_focus_34_desc_C: "上白泽慧音与藤原妹红辜负幻想乡托付。其技术官僚团队未能挽救危局。尽管多名前幻想乡内阁成员已逃至新人间之里，其继续行使权力已无正当性。他们将被勒令集体辞职，为贤者主导战时体制铺路。他们起复与否，由贤者裁定。"
 LIB_new_focus_34_desc_D: "东风谷早苗与守矢神社辜负幻想乡托付。其虽尝试建立早苗个人威权，但最终未能挽救危局。尽管多名前幻想乡内阁成员已逃至新人间之里，其继续行使权力已无正当性。他们将被勒令集体辞职，为贤者主导战时体制铺路。他们起复与否，由贤者裁定。"
 LIB_new_focus_34_desc_E: "铃仙与月战老兵团辜负幻想乡托付。其再军事化主张被证明不堪一击。尽管多名前幻想乡内阁成员已逃至新人间之里，其继续行使权力已无正当性。他们将被勒令集体辞职，为贤者主导战时体制铺路。他们起复与否，由贤者裁定。"
 LIB_new_focus_34_desc_F: "斯卡蕾特王室辜负幻想乡托付。其虽期望第二次红雾异变可以挽救危局，然而最终功亏一篑。尽管王室已流亡至新人间之里，其只被允许继续保留王冠，须向贤者交出权杖，而王室内阁则被勒令集体辞职，为贤者主导战时体制铺路。他们起复与否，由贤者裁定。"
 LIB_new_focus_34_tt: "§R幻想乡怎能让打了败仗的家伙领导？§!"
 LIB_new_focus_35: "召开贤者议会"
 LIB_new_focus_35_desc: "如今，尚具威望与实力的幻想乡贤者，仅余久驻新人间之里的稀神探女与摩多罗隐岐奈。八云紫将提议组建幻想乡流亡政府，整合月都、后户两系力量，以图再挽危局。"
 LIB_new_focus_35_tt: "§Y政局将会重组，并会带来新的动态修正§\n\n"
 LIB_new_focus_36: "与圣杯同行"
 LIB_new_focus_36_desc: "圣杯势力是幻想乡传统盟友，也是目前我们唯一可以一同对抗白骨大军的强大国家。我们应当与他们重新结盟。"
 LIB_new_focus_37: "协防阳光之地"
 LIB_new_focus_37_desc: "不能让白骨大军横行于阳光大陆。为此，贤者议会向圣杯王国提议，建设一批陆地要塞以防止白骨大军侵入非洲。"
 LIB_new_focus_37_tt: "§Y解锁在苏伊士运河建设陆上要塞的决议？§!"
 LIB_new_focus_38: "归乡法案"
 LIB_new_focus_38_desc: "幻想乡的存续危在旦夕，流亡者亦不能永远寄居异乡。为夺回我们的故乡，流亡政府将依法实施战时工业转产与征兵动员，组织一切可用的人力与生产能力投入光复战争。"
 LIB_new_focus_40: "不浪费，不愁缺"
 LIB_new_focus_40_desc: "新人间之里缺乏战争动员经验，战时物资管制又使部分地区出现供应紧张与社会动荡。八云蓝为此整理了一套应急方案，通过回收废旧金属、推广水空调、以烘烤代替油炸食品、开发替代材料等措施，减少民用与工业生产对紧缺物资的依赖，逐步缓解战时经济给民众与工业带来的阵痛。"
 LIB_new_focus_42: "幻想乡光复计划"
 LIB_new_focus_42_desc: "流亡政府的权力真空已告终结，贤者议会已确立对幻想乡抵抗运动的全面领导。敌人强大超乎想象，但流亡政府并非全无对策......"
 LIB_new_focus_42_tt: "§Y现在可以使用反攻相关决议了§"
 LIB_new_focus_43: "隙间战略化"
 LIB_new_focus_43_desc: "过去，隙间稳定全凭八云紫法力维系。如今，新人间之里工程师已能以装置稳定隙间，使人员与车辆短暂穿行两端。若能善用此一通道，便可将滞留幻想乡的要员、武器装备乃至工业设备转移至新人间之里，或将渗透分队投送至幻想乡。"
 LIB_new_focus_43_tt: "§Y解锁神隐幻想乡工业的决议§"
 LIB_new_focus_44: "大规模工厂神隐化"
 LIB_new_focus_44_desc: "特工小队经训练后，可在数小时内完成释放干扰、搬迁核心工业设备、动员与转运工人及清理痕迹等作业。稳定技术突破后，隙间亦可容纳更多人员与设备，足以支撑大型工业设施的快速转移。"
 LIB_new_focus_44_tt: "§Y神隐幻想乡工业的速度加快，上限提高§"
 LIB_new_focus_45: "巩固新人间之里防御"
 LIB_new_focus_45_desc: "据流亡者情报，白骨大军正在三途河对岸建设海军基地与机场，新人间之里或将面临海空打击。贤者议会已决定先期布防，在关键地区建设防空阵地，防空掩体与海岸要塞。"
 LIB_new_focus_45_tt: "§Y工业建设决议现在可以修筑沿海要塞和防空设施。当魔导国占领埃及时会解锁更多要塞建设决议§"
 LIB_new_focus_46: "组建产业军"
 LIB_new_focus_46_desc: "依托流亡者携入的工业管理知识、充裕劳动力与定向补贴机制，新人间之里将组建庞大高效的劳动军。"
 LIB_new_focus_47: "对外投资局军事化"
 LIB_new_focus_47_desc: "核实流亡者情报期间，对外投资局此前积累的对外人脉发挥了关键情报作用。贤者议会据此决定，将其改制为对外情报机构，承担搜集白骨大军情报与指导幻想乡抵抗运动的责任。"
 LIB_new_focus_48: "生产商整合"
 LIB_new_focus_48_desc: "红魔城、守矢索道与河童重工的工程师已撤至新人间之里，他们携有先进生产经验与敌军情报。新人间之里将整合其技术力量，纳入既有生产体系，以提升军工效率。"
 LIB_new_focus_49: "超隙间计划"
 LIB_new_focus_49_desc: "超隙间计划旨在入侵伊比利亚半岛南端。从此地进攻只需应对幻想乡方向的敌军，战线相对较窄，可以削减白骨大军的数量优势。\n由于我们的情报与工业资源有限，我们只能选择一处区域重点进攻。"
 LIB_new_focus_49_tt: "§Y可以在决议中执行超隙间计划§"
 LIB_new_focus_50: "雪橇天狗计划"
 LIB_new_focus_50_desc: "雪橇天狗计划旨在入侵西西里与那不勒斯地区，进而控制整个亚平宁半岛。在此处作战，我方兵员可利用海岸炮击，山地优势和两栖登陆牵制消灭大量白骨军队，有一定选择优势。\n由于我们的情报与工业资源有限，我们只能选择一处区域重点进攻。"
 LIB_new_focus_50_tt: "§Y可以在决议中执行雪橇天狗计划§"
 LIB_new_focus_51: "龙马计划"
 LIB_new_focus_51_desc: "龙马计划旨在从幻想乡南部，即后户之国到天狗里一带登陆。虽然此地山岳纵横，登陆难度较大，但此地距离新人间之里最近，可以投入大量兵力和支援火力，因而有一定优势。\n由于我们的情报与工业资源有限，我们只能选择一处区域重点进攻。"
 LIB_new_focus_51_tt: "§Y可以在决议中执行龙马计划§"
 LIB_new_focus_52: "灵樱计划"
 LIB_new_focus_52_desc: "灵樱计划旨在借助圣杯王国力量登陆白玉楼地区。此地位处半岛，距离圣杯王国较近，可快速投送兵力与火力，有防御优势，但无地利可凭借。这个计划相对冒险，但一旦成功，白骨大军亦无多少地利可以凭借，可以让我方顺势夺取大半幻想乡故土。\n由于我们的情报与工业资源有限，我们只能选择一处区域重点进攻。"
 LIB_new_focus_52_tt: "§Y可以在决议中执行灵樱计划§"
 LIB_new_focus_53: "赤霾计划"
 LIB_new_focus_53_desc: "赤霾计划旨在借助圣杯王国力量登陆红魔馆地区。该地区水网复杂，一旦登陆成功，可凭借复杂水网削弱白骨大军机械化军团战斗能力。然而，复杂水网也会阻碍我方展开进一步作战。\n由于我们的情报与工业资源有限，我们只能选择一处区域重点进攻。"
 LIB_new_focus_53_tt: "§Y可以在决议中执行赤霾计划§"
 LIB_new_focus_54: "利用区位优势"
 LIB_new_focus_54_desc: "三途河南端水文条件稳定，水深适宜，季节性温跃层明显，具备较好的潜艇训练条件。新人间之里日照充足，南部人口密度低、空域开阔，亦具备空军训练条件。贤者据此授意，争取本乡海空军将新人间之里设为常态化训练基地。危机之下，本乡或将同意新人间之里承接部分海空军军工订单，以缓解劳工失业。"
 LIB_new_focus_54_tt: "§Y幻想乡接受与否取决于幻想乡的经济状况§"
 LIB_new_focus_55: "光复......"
 LIB_new_focus_55_desc: "千万生灵逝去，亡者堆满了冥界。但白骨大军已经回到了坟墓里。幻想乡的居民终于可以在废墟上庆祝胜利......"
 LIB_new_focus_56: "美好的战争已经结束了"
 LIB_new_focus_56_desc: "战争结束了，贤者议会也已失去继续存在的必要。很快，流亡者将与在战争中领导抵抗运动的三贤者共同组建国家过渡委员会，负责度过恢复正常政制前的最后一段过渡时期……"
 LIB_new_focus_57: "一切都将恢复原样"
 LIB_new_focus_57_desc: "在幻想乡本土，民众们正在重新组织战前的政党。大众所熟知的人物——博丽的巫女、黑白的魔法师、吞噬历史的智者、掌控波长的月兔、风神眷顾的少女，以及释放红雾的吸血鬼——再一次回到了众人的视野之中。\n\n在国家过渡委员会的主持下，人们又一次选出了自己认可的幻想乡领导人，正如多年之前，那位御阿礼之子又一次踏上轮回的时候那样。"
 LIB_new_focus_58: "贤者的神隐"
 LIB_new_focus_58_desc: "或许有人会问：那位在幻想乡危难之际第一个举起大旗的隙间贤者呢？她为何不与人们一起分享胜利与和平的喜悦？\n\n人们去新人间之里寻找她，却发现那里已经被交给月之民与后户势力管理。人们询问那位贤者的下落，而得到的回答则是：新人间之里已经不再需要一位贤者，它已经能够自行运转；新的行政长官也已在月民、兽人、开拓民与后户民共同的掌声中诞生。这里已经没有贤者了。\n\n不过，即使贤者不在此处，在那位贤者深邃的目光之下，幻想乡依旧会是一个和谐与安定的地方。月之民与后户民们仍很用心地强调这一点。"
 LIB_new_focus_59: "接纳流亡空军"
 LIB_new_focus_59_desc: "流亡而来的幻想乡空中部队已经到达新人间之里。这些精锐飞行员大多拥有与魔导国作战的经验。我们应当将他们编入航空教导队。"
 LIB_new_focus_60: "重整流亡海军"
 LIB_new_focus_60_desc: "幻想乡流亡海军已经抵达新人间之里。他们会在数周之内被安置入我方战斗序列。"
 LIB_new_focus_61: "飞机生产"
 LIB_new_focus_61_desc: "流亡而来的幻想乡技术人员与圣杯的援助使得我方拥有了试生产飞机的能力。"
 LIB_new_focus_62: "大漠试炼"
 LIB_new_focus_62_desc: "在烈日之下飞越大漠，已成为新人间之里空军部队不成文的训练项目。长期实践表明，此类训练能够显著提高飞行员的长时间飞行，连续出动能力与导航能力，并积累应对高温、沙尘等恶劣环境的经验。这种特殊的训练方式值得推广至其他空军部队。"
 LIB_new_focus_63: "潜艇生产"
 LIB_new_focus_63_desc: "幻想乡流亡而来的海军工程人员带来了全套潜艇生产图纸，这使得我们有可能生产一些近海潜艇。"
 LIB_new_focus_64: "冥河螺旋"
 LIB_new_focus_64_desc: "潜艇司令部已经总结出一套针对三途河上敌方船队的“袭扰—脱离—再袭扰”战术，并形象地将其命名为“冥河螺旋”。前线报告表明，多艘潜艇持续实施袭扰，不仅能够反复打击运输船只，甚至可能迫使敌方船队解散或改变航线。这种作战方式值得推广至整个潜艇部队。"
 LIB_new_focus_65: "海军战术研习部"
 LIB_new_focus_65_desc: "海军的首要任务是阻止敌军登陆新人间之里，先前主张以大舰队维持海权存在的战略已经不再适用。海军军官将被组织起来，构思以航路截断为目的的海军战略。"
 LIB_new_focus_66: "全国防空指挥部"
 LIB_new_focus_66_desc: "阻止敌方的战略轰炸是我方空军首要任务。空军的生产，训练和作战都应该围绕着防空展开。"
 LIB_new_focus_67: "扩张新人间之里自卫队"
 LIB_new_focus_67_desc: "自卫队须进驻城乡，维持饥荒与萧条地区的治安，打击并威慑犯罪。然而现有编制与训练水平均不足以满足需求，亟须扩编招募，并增加装备采购、兵饷发放与组织训练的专项拨款。此等开支在平时难以承受，但如今扩编自卫队既可增强地方治安能力，又可吸纳失业人口、缓解失业压力，遂成为一种可行的赈济手段。"
 LIB_new_focus_67_tt: "§Y以役代赈也可以缓解经济问题§!"
 LIB_new_focus_68: "为冲突做好准备"
 LIB_new_focus_68_desc: "为训练新人间之里自卫队参谋作业能力，并为未来冲突预作准备，八云蓝责成自卫队展开针对周边势力的假想入侵演练。"
 LIB_new_focus_69: "建立幻想乡防卫军"
 LIB_new_focus_69_desc: "幻想乡部分武装力量成建制流亡至新人间之里。以这些历战老兵与武器装备为基础，新人间之里自卫队将改组成为光复幻想乡而战的正规武装力量。"
 LIB_new_focus_71: "成立辅助军"
 LIB_new_focus_71_desc: "仅凭防卫军，难以对抗人力近乎无穷的白骨大军。贤者议会已授权动员流亡老兵中的伤、残、病、退者组建辅助军。这些老兵将分赴各地，组建地区民兵、防空卫队与物流部队。"
 LIB_new_focus_72: "陆军军械局"
 LIB_new_focus_72_desc: "此前，新人间之里沿用幻想乡制式轻武器与魔法装备。然而当前战争形势迫使武器装备向轻量化、紧凑化、易生产与高可靠性方向改进。新组建的陆军军械局将汇总前线武器使用报告，就武器的低成本、快速生产与可靠性改进提出指导意见，并负责收集、整理部队对实验武器的使用反馈。"
 LIB_new_focus_73: "建立兽人战斗队"
 LIB_new_focus_73_desc: "南方沙漠兽人军事传统浓厚，族群凝聚力强，耐受力与意志均属上乘。八云蓝向贤者议会提议，依托危机期间建立的互信关系，征募兽人组建特种部队，承担侦察、渗透，敌后袭扰和要地突击任务。"
 LIB_new_focus_74: "弹幕防空术"
 LIB_new_focus_74_desc: "和平时期的符卡规则培养出一批火力纪律严格、精于弹幕规划与阵地转移的战斗员。将上述经验整理为战术规范与训练条令，并推广至防空部队，可显著提升野战防空的火力组织、阵地机动与持续作战效率。"
 LIB_new_focus_75: "月都炮术"
 LIB_new_focus_75_desc: "月之都势力在两次月面战争中积累了丰富的大型弹幕作战经验。其对敌军集结地实施弹幕拦截、运用徐进弹幕、组织拦截与掩护弹幕，以及利用信号弹设置预警陷阱等战术均已相当娴熟，被贤者议会认为具有借鉴价值。上述经验可用于指导炮兵战术条令编写，并为火炮生产标准制定提供参考。"
 LIB_new_focus_76: "不灭意志"
 LIB_new_focus_76_desc: "摩多罗隐岐奈提交后户之力军事化应用的最新成果。工程师已设计出可携带后户之力的小型徽章，佩戴者生命力较常人显著增强，高压环境下判断力亦有所提升。贤者议会已批准该装置进入扩大试验阶段。"
 LIB_new_focus_77: "符卡精神"
 LIB_new_focus_77_desc: "长期以来的符卡规则，塑造了幻想乡独特的战斗韧性。当我们在符卡战斗中落败后，我们不会因为一次失败便认为战斗已经结束，而是再次尝试。不断失败，就不断尝试；不断尝试，尝试，尝试，尝试，尝试，尝试，尝试，尝试……直到将对手的符卡彻底击破。\n\n如今，幻想乡已陷入白骨大军之手，但我们深知，miss并非终局，放弃才是。一次失败不是战争的终点，一场败仗也不能决定幻想乡的命运。我们远未到投降之时。流亡者将团结一致，百折不挠；即使一次次遭受挫败，也将一次次重整力量、总结经验，再度投入战斗，终将把白骨大军逐出幻想乡。"

#海军（下面都是原有国策，预计会废弃）
 LIB_armed_Gensokyo_Navy: "幻想乡海军"
 LIB_armed_Gensokyo_Navy_desc: "每一个大国都应该重视自己的海权，我们不能让敌人在海上扬威耀武。现在海军部通过抗议拿到了一大批经费，希望可以见到一只敢打敢战的幻想乡海军。"
 LIB_armed_Atlantic_Navy: "大西洋海军"
 LIB_armed_Atlantic_Navy_desc: "大西洋是我们和圣杯之间的天然屏障，然而圣杯那强大的海军导致大西洋一直被他们所盘踞，现在，我们要在大西洋发出幻想乡的声音，告诉那些宵小，幻想乡从不畏惧在任何环境和敌人作战！"
 LIB_armed_Emphasis_on_ocean_voyages: "重视远洋航行"
 LIB_armed_Emphasis_on_ocean_voyages_desc: "我们在海军改革当中的目光必须长远，随着幻想乡实力的增强，我们的海军不可能永远在这一片大洋航行，整个世界的海洋都将出现她们的痕迹，从现在开始我们应当重视远洋航行。"
 LIB_armed_Mediterranean_Navy: "地中海海军"
 LIB_armed_Mediterranean_Navy_desc: "地中海关系到我们与殖民地之间的往来，同时，封锁了地中海我们就相当于抓住了南欧国家的命脉。为此，组建一直强大的地中海海军刻不容缓！"
 LIB_armed_Attach_importance_to_offshore_operations: "重视近海作战"
 LIB_armed_Attach_importance_to_offshore_operations_desc: "我们的地中海海军令沿岸国家如鲠在喉，特别是意呆莉，她们不止一次威胁我们撤回地中海海军，但是，敌人所畏惧的，我们必须坚持，加强海军的近海作战能力，说不定某一天，我们可以用上。"
 LIB_armed_Naval_Officer_Academy: "海军军官学院"
 LIB_armed_Naval_Officer_Academy_desc: "在精良的军械也需要精英的人才操控，我们的海军部队已经成型，现在缺少高素质的海军军官来加以指挥。所以很有必要设立独立的海军军官学院来加强海军素质。"
 LIB_armed_New_Tactics_Research: "新式战术研究"
 LIB_armed_New_Tactics_Research_desc: "我们的海军军备已经更新，原本的战术已经不适合现在的海军，我们迫切需要新式战术给海军增加战斗能力"
 LIB_armed_Naval_aviation: "海军航空兵"
 LIB_armed_Naval_aviation_desc: "海军目前仍保留着一部分战争时期航母，虽然它们的船体已经过时了，但航母背后的战术意义我们不能不重视，为了获得战斗力更强的航母舰队，现在我们就得开始相关方面的训练，飞行员们也得从空军独立出来，另设一只海军航空兵。"
 LIB_armed_Aircraft_carrier_research: "航母研究"
 LIB_armed_Aircraft_carrier_research_desc: "航母的存在极大的改变了海战的方式，有人预测未来必定是航母的天下，当然，现在的我们不必在意未来的事情，但根据可靠情报，世界各强国都在进行的航母研究，幻想乡自然不能落后。"
 LIB_armed_Take_advantage_of_maneuverability: "发挥机动优势"
 LIB_armed_Take_advantage_of_maneuverability_desc: "现在的主流船体都是几万吨的大家伙，速度都快不了，但要是我们对船体进行改造，大幅提升其速度，说不定能做到对敌先攻优势。"
 LIB_armed_Light_ship_research: "轻型舰船研究"
 LIB_armed_Light_ship_research_desc: "一场博弈当中，既要在意王，也要在意兵。我们的大型军舰没有其他小型军舰的陪同，那就是一个缓慢的靶子！因此，我们有必要对自己的那些轻型舰艇进行换代升级。"
 LIB_armed_Submarine_clusters: "潜艇集群"
 LIB_armed_Submarine_clusters_desc: "水下恶狼的威力在于能出其不意的给敌人致命一击，如果多艘潜艇集结攻击，那就像狼群一样，没人知道结果如何，但我们可以先试一试。"
 LIB_armed_Submarine_research: "潜艇研究"
 LIB_armed_Submarine_research_desc: "潜艇集群战术大获成功，海军部决定对潜艇研究倾斜资源，她们希望新式潜艇能取得更大的战果！"
 LIB_armed_Heavy_firepower_superiority: "重型火力优势"
 LIB_armed_Heavy_firepower_superiority_desc: "唯有巨炮的轰鸣才能毁灭敌人的进攻，战列舰的时代并没有结束，那巨大的舰炮就是对敌人最大的蔑视，没有任何装甲能挡住战列舰的一炮，让我们的敌人，活在舰炮的恐惧当中吧。"
 LIB_armed_Heavy_Ship_Research: "重型舰船研究"
 LIB_armed_Heavy_Ship_Research_desc: "这就是海军的钢铁巨兽，海军部相信，当我们拥有大量的战列舰，海洋以后都会是我们的天下，为此，让我们集中资源，创造世界上最强的钢铁巨兽吧！"
#空军
 LIB_armed_Gensokyo_Air: "幻想乡空军"
 LIB_armed_Gensokyo_Air_desc: "航空器的进步，让制空权变得越来越重要，如果我们不希望有一天吃着火锅唱着歌，突然被炸弹砸脸上的话，那么就想个办法让我们的空军拥有更强的实力。"
 LIB_armed_Absorb_Tengu_combat_experience: "吸纳天狗作战经验"
 LIB_armed_Absorb_Tengu_combat_experience_desc: "天狗一族凭借那双翅膀在天上和敌人战斗了几百年，毫无疑问，她们的对空作战经验比我们丰富多了，我们只需要付出一点小小的代价，就能她们一直以来所有的空战经验，这是一笔划算的买卖。"
 LIB_armed_Invest_in_Aero_Club: "投资航空俱乐部"
 LIB_armed_Invest_in_Aero_Club_desc: "航空器都是需要有人驾驶的，这和陆地上不一样，它需要更高素质的驾驶员，我们必须先让人民爱上航空，才能从中发现更多的人才，投资航空俱乐部是个不错的主意，毕竟空军部抢下的经费不花白不花。"
 LIB_armed_Invest_in_Air_Force_research: "投资空军研究"
 LIB_armed_Invest_in_Air_Force_research_desc: "武器换代的速度比我们想象中的还要快，这场军备竞赛，一旦慢下来就是死亡。与其让那些将领把军费拿去浪漫，不如直接让军部把经费打给航空器研究所，毕竟，这是为了将来我们的天空上不会有敌人的飞行器。"
 LIB_armed_Air_supremacy_seized: "制空权夺取"
 LIB_armed_Air_supremacy_seized_desc: "夺取制空，是空军建立的目的，如果一支空军连夺取制空都做不到，证明她们是一支无能的军队。国家和人民不需要无能的军队！"
 LIB_armed_Auxiliary_ground_operations: "辅助地面作战"
 LIB_armed_Auxiliary_ground_operations_desc: "空军的看家本领，应当有帮助地面的大头兵前进，地面才是决定一场战役胜负的关键，如果我们根本不能阻挡敌人，就是再大的空中优势，也只能迟缓敌人攻势。就当为了自己，帮陆军兄弟稳住战线吧。"
 LIB_armed_Three_dimensional_combat: "立体作战"
 LIB_armed_Three_dimensional_combat_desc: "如今，良好的兵员素质，让空地一体化作战成为现实，战争就是个兑子游戏，你的筹码越多，赢得希望就越大。一场战斗，有空军支援往往能省很多时间，立体作战的优越性尽显无疑。"
 LIB_armed_Aerial_competition: "空中角逐"
 LIB_armed_Aerial_competition_desc: "我们不要求空军能给地面多大的帮助，我们只希望在敌人飞机在我方阵地上起舞的时候，自己的空军能出现并狠狠的教训他们一顿，最好一天连续不断地出现。"
 LIB_armed_Defend_airspace: "保卫领空"
 LIB_armed_Defend_airspace_desc: "如果连自己的国土的领空都不能保护，那么空军的存在就是一张白纸，一触即破。为了幻想乡的人民不会惧怕蓝天，保卫我们的领空！"
 LIB_armed_Destroy_living_forces: "消灭有生力量"
 LIB_armed_Destroy_living_forces_desc: "飞机可以很快生产出来，但飞行员不能。如果我们能消灭绝大多数飞行员的话，敌人就是拥有一万架飞机，也只能趴窝。只要我们找到他们的空军基地，就能达成这一目的，哪怕会造成我们自己的区域防空能力削弱，但这是必要的牺牲！"
 LIB_armed_Industrial_strike_capabilities: "工业打击能力"
 LIB_armed_Industrial_strike_capabilities_desc: "打仗打的就是后勤，只要我们摧毁了他们的工业生产能力，就能让前线的敌人武器变成烧火棍，我们的目的，就是让敌人的战争机器，卡住齿轮，哪怕一天，也能为我们争取一定的优势。"
 LIB_armed_Massive_bombing: "大规模轰炸"
 LIB_armed_Massive_bombing_desc: "这场战争已经没有平民可言！大规模轰炸或许会误伤一部分平民，但也能让敌人的后勤能力停摆。一切都是为了最终的胜利！"
 LIB_armed_Logistical_sabotage: "后勤破坏"
 LIB_armed_Logistical_sabotage_desc: "空军应该加大轰炸规模、轰炸时间，彻底摧毁敌人的后勤能力，我们要让敌人的部队一个罐头也吃不上！饿着肚子的敌人根本不是我们的对手。"

