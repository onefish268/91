#新闻
 LIB_news.1.t: "幻想乡政府解散"
 LIB_news.1.desc: "随着人间之里陷落，各地兵团失去统一指挥，幻想乡政府最终不得不宣布其面对魔导国入侵的全面失败。然而，幻想乡政府并没有接受魔导国提出的和平条件，而是选择了自行解散。据悉，当幻想乡政府宣布解散后，大量幻想乡士兵选择了投降，但海军和少量陆军选择了撤离至新人间之里继续作战，且部分政府官员已经被证实撤往了新人间之里。由于魔导国海空力量尚不能威胁新人间之里，幻想乡政府很可能在新人间之里重组并继续抵抗。"
 LIB_news.1.a: "继续战斗"
 LIB_news.1.b: "白骨的大军又下一城"
 LIB_news.1.c: "逃去大漠里吃沙子去吧，胆小鬼们。"
 LIB_news.2.t: "斯卡蕾特王室逃离幻想乡"
 LIB_news.2.desc: "随着人间之里陷落，各地兵团失去统一指挥，幻想乡王室政府最终不得不宣布其面对魔导国入侵的全面失败。然而，斯卡蕾特王室并没有接受魔导国提出的和平条件，而是选择抛弃军队，逃离了幻想乡。据悉，当幻想乡政府宣布解散后，大量幻想乡士兵选择了投降，但海军和少量陆军选择了撤离至新人间之里继续作战，且斯卡蕾特王室和部分王室政府官员已经被证实撤往了新人间之里。由于魔导国海空力量尚不能威胁新人间之里，斯卡蕾特王室很可能在新人间之里站稳脚跟并继续抵抗。"
 LIB_news.2.a: "继续战斗"
 LIB_news.2.b: "白骨的大军又下一城"
 LIB_news.2.c: "逃去大漠里吃沙子去吧，胆小鬼们。"
 LIB_news.3.t: "幻想乡归来"
 LIB_news.3.desc: "经历漫长的流亡之后，幻想乡临时政府最终击败了魔导国并返回了故乡。临时政府领袖八云紫出席了于人间之里举行的大型阅兵活动，并宣布国家将进入过渡时期。据一名幻想乡官员称，新的国家过渡委员会正在组建，其主要成员不仅包含贤者议会成员，还将吸纳在战前活跃的各个政党领袖。\n\n这些举动意味着，幻想乡的过渡状态可能以一次正式民主选举而结束。"
 LIB_news.3.a: "漫漫长路终归乡"
 LIB_news.4.t: "新人间之里的丧尸部队？"
 LIB_news.4.desc: "在幻想乡流亡政府与魔导国的冲突前线，一些令人不安的照片和影片被透露出来。这些影像资料由魔导国总结发布，在影片中，一些来自幻想乡流亡政府的士兵在死去后居然出现了集体起立行走的行为，一些照片还展示了疑似被这些死后士兵攻击的魔导国受害士兵。幻想乡流亡政府公开宣称，这些影片不过是魔导国炮制的宣传资料，目的是攻击贤者议会的战时政策。"
 LIB_news.4.a: "丧尸？科幻小说看多了吧？"
 LIB_news.4.b: "前线呈上的这些影片，我看了好几遍。我不觉得前线会集体骗我。"
 LIB_news.4.c: "想不到摩多罗的后户之力，已经能做到这个地步了"
