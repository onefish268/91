 FRA_Matara_Okina_desc:"潜藏于万物背上的秘神。表面上有着地母神、能乐之神、星宿之神、养蚕之神、障碍之神、被差别民之神等等身份。\n\n真实的身份没有人知晓。是正体不可见、不可闻、不可语的，究极的秘神。但是，秘神这个说法并不是说她一直隐介藏形。偶尔也会光明正大地现世，夸示自己的存在。\n\n理论上是新人间之里后户民的共同领袖，但是对后户民的日常生活几乎没有干涉，即使有干涉也主要依赖二童子来行事。"
