  LIB_BBA_end_tip: "”紫大人，摩多罗大人和探女大人都已经离开了。“\n\n八云蓝收拾着桌上的残羹。\n\n”那有什么关系？蓝，接着陪我喝一些吧。“八云紫的手里还紧握着清酒的瓶子。”你已经从繁重的公务中解脱出来了，是该放纵一下。“\n\n九尾的妖狐面露难色，连连摆手：”紫大人，我已经喝的够多了。再怎么说，我也要在橙的面前当个榜样啊！“\n\n”哈哈，有趣。“紫爽朗地笑着。\n\n”不错，不错......如果你有一天成为了贤者，你肯定会先成为一个好人......“八云紫丢下手中的瓷酒瓶。\n\n”然后你就会发现......你会慢慢越来越像我。八云家的宿命就是如此。算了！遥远的事情就不说了。总之，你作为官僚的修行......结束了！你的新修行，会很快开始的。“\n\n”新修行？紫大人已经有安排了吗？“\n\n”当然，第一步，趁着幻想乡万事已休，我们就久违地离开大结界看看吧。去柏林，莫斯科，”\n\n紫眯着眼，脸色通红，手指一扬，“再去北京，上海，京都，北海道......最后去畜生界，月球，地狱......而且，橙可没怎么见过这些地方。我看这小猫之前表现挺好，可以再努力栽培......“\n\n”真有意思啊！我很向往一场长途旅行，相信橙也会的。紫大人，那第二步呢？“\n\n”第二步，”\n\n隙间妖怪给酒碟斟满，“你把这酒喝了，这也是修行。“\n\n话音刚落，紫就趴到了桌上，而九尾的妖狐，面对面前满溢的酒碟，再一次面露难色。" 
  LIB_end_tip_lower:"感谢您在幕后带领幻想乡流亡者重返家乡\n您或许还为落幕而落寞，但或许......您已经收获颇丰。"
