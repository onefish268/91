#反攻
 LIB_fangong.1.t:0 "在魔界溪谷侦测到秘密行动"
 LIB_fangong.1.d:0 "近来发生在魔界溪谷领地的种种迹象，例如秘密越境踪迹，边境村镇暴动，警察局遭到袭击等事件表明，一支来自境外的特工武装正在魔界溪谷煽动共产主义起义。很显然，他们来自索维耶特联盟。我们该对此如何处理？"
 LIB_fangong.1.a:0 "当然是立即镇压。"
 LIB_fangong.1.b:0 "搜集证据，我们正好缺少对这个“联盟”的宣战借口。"
 LIB_fangong.1.b_tt:0 "我们将会§R牺牲§!魔界溪谷的控制权。当索维耶特联盟介入魔界溪谷的内战时，我们会获得对其全面入侵的机会。§R如果我们真的做好在南方大陆的全面战争准备的话。§!"
 LIB_fangong.2.t:0 "八云紫致索维耶特联盟"
 LIB_fangong.2.d:0 "索维耶特联盟人民在内战后艰苦奋斗，吃苦耐劳，已经将国家建设成远离饥寒之苦的美好地方，我谨代表幻想乡向索维耶特联盟致以诚挚问候。然而，近期观察到，一些非法越境者自贵国进入魔界溪谷煽动暴乱，破坏当地生活生产秩序。这些非法入境者大多已经交由司法机构。为此，我谨代表幻想乡向贵国强调，魔界溪谷是兽人世代居住之地，享受着长期的安宁，祥和与有序发展，无论过去还是现在，一直享有着免遭动乱与战争的权利。贵国于内战中恢复，应当理解与认同，和平与发展将是地区的主基调。破坏当地安宁和谐的生活，将不会得到当地民众的支持。请贵国严加管理边境，杜绝激进分子越境，侵入魔界溪谷的领土。双方之间任何分歧，理应能够通过和平谈判的途径解决。————八云紫"
 LIB_fangong.2.a:0 "顽固老太婆的殖民嘴脸暴露无遗！"
 LIB_fangong.2.a_tt:0 "§R魔界溪谷革命小组损失惨重，无法组织革命。§!"
 LIB_fangong.3.t:0 "最后通牒：退出魔界溪谷领地"
 LIB_fangong.3.d:0 "新人间之里发来外交照会，要求立即解散魔界溪谷革命政府与军队，且联盟军队也要退出当地，否则两国将进入战争状态。我们该怎么选择？"
 LIB_fangong.3.a:0 "我们暂时还承担不起全面战争的代价"
 LIB_fangong.3.b:0 "革命就是要全速前进"
 LIB_fangong.3.b_tt:0 "§R这会导致我们与新人间之里与其盟友的全面战争§!"
#新闻
 LIB_news.1.t: "幻想乡政府解散"
 LIB_news.1.d: "随着人间之里陷落，各地兵团失去统一指挥，幻想乡政府最终不得不宣布其面对魔导国入侵的全面失败。然而，幻想乡政府并没有接受魔导国提出的和平条件，而是选择了自行解散。据悉，当幻想乡政府宣布解散后，大量幻想乡士兵选择了投降，但海军和少量陆军选择了撤离至新人间之里继续作战，且部分政府官员已经被证实撤往了新人间之里。由于魔导国海空力量尚不能威胁新人间之里，幻想乡政府很可能在新人间之里重组并继续抵抗。"
 LIB_news.1.a: "继续战斗"
 LIB_news.1.b: "白骨的大军又下一城"
 LIB_news.1.c: "逃去大漠里吃沙子去吧，胆小鬼们。"
 LIB_news.2.t: "斯卡蕾特王室逃离幻想乡"
 LIB_news.2.d: "随着人间之里陷落，各地兵团失去统一指挥，幻想乡王室政府最终不得不宣布其面对魔导国入侵的全面失败。然而，斯卡蕾特王室并没有接受魔导国提出的和平条件，而是选择抛弃军队，逃离了幻想乡。据悉，当幻想乡政府宣布解散后，大量幻想乡士兵选择了投降，但海军和少量陆军选择了撤离至新人间之里继续作战，且斯卡蕾特王室和部分王室政府官员已经被证实撤往了新人间之里。由于魔导国海空力量尚不能威胁新人间之里，斯卡蕾特王室很可能在新人间之里站稳脚跟并继续抵抗。"
 LIB_news.2.a: "继续战斗"
 LIB_news.2.b: "白骨的大军又下一城"
 LIB_news.2.c: "逃去大漠里吃沙子去吧，胆小鬼们。"
 LIB_news.3.t: "幻想乡归来"
 LIB_news.3.d: "经历漫长的流亡之后，幻想乡临时政府最终击败了魔导国并返回了故乡。临时政府领袖八云紫出席了于人间之里举行的大型阅兵活动，并宣布国家将进入过渡时期。据一名幻想乡官员称，新的国家过渡委员会正在组建，其主要成员不仅包含贤者议会成员，还将吸纳在战前活跃的各个政党领袖。\n\n这些举动意味着，幻想乡的过渡状态可能以一次正式民主选举而结束。"
 LIB_news.3.a: "漫漫长路终归乡"
 LIB_news.4.t: "新人间之里的丧尸部队？"
 LIB_news.4.d: "在幻想乡流亡政府与魔导国的冲突前线，一些令人不安的照片和影片被透露出来。这些影像资料由魔导国总结发布，在影片中，一些来自幻想乡流亡政府的士兵在死去后居然出现了集体起立行走的行为，一些照片还展示了疑似被这些死后士兵攻击的魔导国受害士兵。幻想乡流亡政府公开宣称，这些影片不过是魔导国炮制的宣传资料，目的是攻击贤者议会的战时政策。"
 LIB_news.4.a: "丧尸？科幻小说看多了吧？"
 LIB_news.4.b: "前线呈上的这些影片，我看了好几遍。我不觉得前线会集体骗我。"
 LIB_news.4.c: "想不到摩多罗的后户之力，已经能做到这个地步了"
 LIB_news.5.t:0 "大南方战争"
 LIB_news.5.d:0 "当魔界溪谷领地爆发的共产主义起义即将推翻殖民政府之时，魔界溪谷的宗主国——流亡新人间之里的幻想乡政府向外界公布了索维耶特联盟介入的证据，并表明“这是完全违反当地意愿的入侵”。在联盟拒绝了幻想乡政府提出的解散当地政府要求之后，幻想乡政府当即宣布两国进入战争状态，并将“平定叛乱的魔界溪谷领地”。\n\n圣杯王国与苏联暂未对此次冲突发表意见，但可以预见的是，若不能迅速达成和平，这场战争将会把南方大陆拖入血腥深渊。"
 LIB_news.5.a:0 "革命无往不胜！"
 LIB_news.5.b:0 "消灭红色暴君！"
 LIB_news.5.c:0 "在黑暗之心打陆地战吗？"
