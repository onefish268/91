 LIB_xijian_category:0 "隙间世界"
 LIB_xijian_category_desc: "可以源源不断地将幻想乡工厂神隐以剥夺白骨大军的生产能力，无法安置在新人间之里的工厂只能放置在隙间世界。如果幻想乡已无工厂可以神隐，或是隙间世界饱和，则无法继续神隐工厂。可以将隙间世界的工厂转移至现世以腾出空间\n\n隙间世界工厂上限是§Y[?LIB_xijianshangxian]§!\n隙间世界现在保存的工厂数是§Y[?LIB_xijianrongliang]§!\n§R当前保存的军用工厂数是§G[?LIB_xijianrongliang_jg]§!\n§C当前保存的民用工厂数是§G[?LIB_xijianrongliang_mg]§!\n\n§Y我走之后，他们会给你们修工厂和宿舍，会提高你们的工资。这不是因为他们良心发现，也不是因为他们变成了好人，而是因为我把工厂和工人们都神隐了。——八云紫§!"
