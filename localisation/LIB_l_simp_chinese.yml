 LIB_dwmy.1.b: "我们潜在的敌人都不行"
 LIB_dwmy.1.c: "甚至包括那些可能威胁到我们传统盟友的......"
 LIB_dwmy.2.t: "新人间之里希望向我们出口磷灰石"
 LIB_dwmy.2.d: "新人间之里希望出口磷灰石作为军用以减缓经济危机的影响。根据我国工业专家研究，这些矿物可以加强我国生产特种弹药和精密仪器的能力。"
 LIB_dwmy.2.a: "哇多么好的机会啊！"
 LIB_dwmy.2.b: "我们的钱要花在更好的地方"
