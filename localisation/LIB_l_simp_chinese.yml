LIB_end_title_1: "至此，§Y[LIB.Getname]§!的征途告一段落"
LIB_end_tip_1: "§0“收拾好行李了吗？”§!\n\n§C“紫大人，都已经全部准备打包好了。我们要坐船还是坐飞机？”§!\n\n§0“当然是用隙间啦！有这么方便的出行工具为什么不用？还不需要拎行李。”§!\n\n§C“那出行护照怎么办呢？”§!\n\n§0“不需要再考虑那些了，蓝。我们是妖怪，妖怪怎么能被常识困住呢？”§!\n\n§Y“蓝大人，我已经穿戴好了！”§!\n\n§C“真好看，橙。等会要跟紧我。”§!\n\n§Y“是的，蓝大人，我已经准备好去新的地方交新的朋友了。”§!\n\n§C“真棒。那么紫大人，我们第一站去哪里呢？”§!\n\n§0“第一站就去柏林吧。”§!\n\n§C“柏林？去领略废土风光吗？”§!\n\n§0“废土风光也是风光呀！准备好了吗？准备好了就跳进隙间吧。一，二，三，跳！”§!\n\n§C“唔……啊啊啊啊啊！”§!\n\n§Y“呜哇啊啊啊！蓝大人！”§!\n\n§C“橙！抓紧我的尾巴！紫大人，怎么在半空中啊！”§!\n\n§0“半空中的风景不是更好吗？我们直接飞就好了！看，那是什么！”§!\n\n§Y“好大啊，蓝大人！”§!\n\n§C“那是齐柏林飞艇吧！为什么会有飞艇？”§!\n\n§0“没看过吧？柏林到慕尼黑临时航线，废土上才能看到的应急产物。它刚起飞，我就用隙间把它传送过来了。”§!\n\n§C“请您传送回去啊！飞艇上的人会很困扰的！”§!\n\n§0“那有什么？它早晚也要飞得这么高！”§!\n\n§C“您会把橙带坏的！”§!\n\n§0“不如说，我在让橙变得完整呢！毕竟，她总有一天也要像你一样面对我的任性。走吧，我们就这样往东去，飞到莫斯科去！”§!"
