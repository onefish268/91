#事件
 LIB_jjxt.1.t: "黑色星期二波及新人间之里"
 LIB_jjxt.1.d: "“紧急撤资？你们居然连违约金都不管的吗？”八云蓝大喊着，对着听筒另一端发出疑问，但对方显然没有解释的意思，很快便挂断了电话。\n\n显然，对方只是前来通知，而非商议的。\n\n“蓝大人......”橙正搬着一叠几乎盖过她的纸走到蓝的办公桌旁，“从今早开始，电报就一张接着一张......发生什么事了？”\n\n“没事的，橙，我来看看。”蓝顺手从橙抱着的纸堆顶抽了两张阅读起来，可电报里写满了骇人的信息。\n\n新人间之里的多家银行发生了挤兑，储户们甚至在银行门口发生了踩踏事件；数艘已经装载货物的货轮因为订单取消而滞留新人间之里港口，它们一时堵塞了泊位，港务一片混乱；原定进入工业园区工作的劳工又与工头发生冲突，斗殴造成了多人受伤和交通堵塞......\n\n“蓝大人，发生了什么事情？”橙侧着头问。\n\n“不必担心，”蓝摸了摸橙的脑袋，“不要乱跑，我出去处理一下......”\n\n还没等橙有所回应，八云蓝就拖着她硕大的尾巴，跑出了办公室。"
 LIB_jjxt.1.a: "蓝大人，真的不必担心吗？"
 LIB_jjxt.1.a_tt:"§R国家陷入了进一步动荡§!"
 LIB_jjxt.2.t: "银行大规模挤兑"
 LIB_jjxt.2.d: "受到幻想乡经济波动影响，多家银行陷入了大规模挤兑潮。每日早晨，前来兑付的储户都会排起长队，虽然有警察前来维持秩序，但是时有冲突流血事件发生。有报告称，甚至有警察借职务之便先行兑付的现象。\n\n多家银行目前已经暂缓业务，但很明显，这并不能解决问题。一旦他们的流动性告罄，他们很可能不得不被迫低价出售手中的实业债权以维持业务，届时将会对新人间之里的实业资金链造成毁灭性打击。"
 LIB_jjxt.2.a: "但大家的工资还在银行里呢！你们叫大家拿什么买吃的？"
 LIB_jjxt.2.a_tt:"§Y国家部分从动荡中恢复§!"
 LIB_jjxt.3.t: "大规模失业"
 LIB_jjxt.3.d: "大量企业因融资与订单受到影响，不得不缩减劳工规模，大量劳工已经陷入失业。而随着企业的收缩，个体商户同样无力维持原有经营规模，只得裁减雇员，甚至停止营业。\n\n失业正在迅速蔓延，一场更大的社会危机已经迫在眉睫"
 LIB_jjxt.3.a: "一定要在失业者花完存款之前扭转局势！"
 LIB_jjxt.3.b: "等等，之前好像报告他们取不出钱？"
 LIB_jjxt.4.t: "月之民社区骚乱" 
 LIB_jjxt.4.d: "一则荒诞谣言声称，此次经济危机正是月之都策划的”地面净化计划“的一部分。这则毫无逻辑的谣言煽动起一批暴徒于近日袭击了多处月之民社区。\n\n根据现有报告，涉事月民与暴徒均有受伤，尚无死亡报告。各自月之民社区表现出了惊人的组织力，战斗力和克制性，部分社区甚至在警察抵达前便自行组织人员保护居民，并在警察抵达后主动与警方共同指挥。但警察部门也报告称，警力目前已经捉襟见肘，有很多月民社区只能依赖自卫。更有部分暴徒不满警方的“偏袒”，袭击了警察局。" 
 LIB_jjxt.4.a: "警察要是管不住，我就派自卫队来。"
 LIB_jjxt.5.t: "招标丑闻使托拉斯受损"  
 LIB_jjxt.5.d: "一家由跨国投机资本控制的空壳公司利用幻想乡的分包漏洞，侵占了新人间之里建设计划中原预留予本土企业的工程份额。该公司又依托与外国大型工业集团的合作关系，吸引多方资本认购股权，并在萧条爆发后迅速套现撤出。后户系与月都系资本由于大量认购该公司股权而蒙受了巨大损失。\n\n虽然目前没有证据表明这是一场有预谋的行动，但这显著加剧了新人间之里的经济危机。"  
 LIB_jjxt.5.a: "这样玩会被共产党人耻笑的。"
 LIB_jjxt.6.t: "住房期权丑闻"  
 LIB_jjxt.6.d: "承建新人间之里城区部分扩建项目的一家建筑公司最近深陷诉讼泥潭。该公司借助稗田阿求时期的繁荣，以出售住房购买期权的方式筹集资金，但实际未建成任何住房。随着大萧条的到来，期权价格暴跌，该丑闻才迅速曝光。\n\n有传闻称，该建筑公司曾违规将同一期权私下出售给多人以大量集资，并挪用大量资金投资外汇市场。而该公司董事长辩解称，住房建设资金始终存在，只是目前滞留在银行无法使用。\n\n目前，该公司涉事人员已经被警方控制，并等待检察机关介入调查。"  
 LIB_jjxt.6.a: "挺聪明的，就是没算到经济危机。"
 LIB_jjxt.6.b: "昨日一去不复回。"
 LIB_jjxt.7.t: "饥饿行军" 
 LIB_jjxt.7.d: "在南方，因经济危机影响，绿洲地区的种植园经济已经濒临崩溃。由于粮食运输成本大幅提高，种植园开始面临大规模饥荒，大量租种土地的兽人家庭开始出售农具和牲畜，离开种植园。虽然种植园承诺暂缓租金，但仍然无力从北方产粮区调来足够粮食。绝望之下，大量兽人向南方尚有存粮的兽人聚落进发，迅速汇成逃荒大军。\n\n目前的报告称，南下兽人集群内部秩序混乱，暴力频发，粮食匮乏。为抢夺原本用于酿造清酒的精米，斗殴流血屡见不鲜。救济和治安人员无法覆盖每一支队伍，也难以跟随队伍深入沙漠，相关工作几乎无法展开。" 
 LIB_jjxt.7.a: "读这份报告时，或许他们的队伍里就要死人。"
 LIB_jjxt.8.t: "火热夏夜" 
 LIB_jjxt.8.d: "最初，新人间之里城市中不过因为干旱酷热出现了几个起火点，但火灾很快就演变成了一场骚乱。由于火灾破坏了当地电力设施，而电力系统人手不足，无法及时修复，停电进一步影响了消防、供水与通讯系统，消防系统难以迅速处理火灾。\n\n入夜后，由于警方人手被大量抽调处理火灾与维持火灾现场秩序，城区内出现了大量盗窃，抢劫事件，一些暴徒也趁机袭击了月之民社区。更有甚者主动纵火以进一步分散警方力量，甚至直接袭击警察和消防员。一些工业企业也成为了报复对象，遭到了不明身份者投掷燃烧瓶攻击。根据现有报告，截至目前，火灾与纵火事件已造成数个街区被焚毁，抢劫与暴乱所致伤亡及财产损失仍在统计。\n\n紧急介入的自卫队已于次日清晨镇压了暴乱，恢复了城区秩序。"
 LIB_jjxt.8.a: "那天夜里，从行政长官公署向外望去，新人间之里简直如白昼一般。"
 LIB_jjxt.9.t: "经济溃坝" 
 LIB_jjxt.9.d: "多数人都笃信，追求和谐的幻想乡不会轻易下调货币汇率，以储户与中产阶层的财富为代价拯救经济。\n\n然而，就在近日，幻想乡当局毫无预兆地宣布了货币贬值政策，大幅下调本币兑贵金属的固定比价，并按比例扩大货币供给。很快，国际市场上，幻想乡本币价格如闪电般下跌，这出乎了绝大多数人的意料。\n\n不过，当国际多头大军与大额储户为此痛哭流涕时，负债企业和个人正在为负担减轻而欢呼，而新人间之里更获得了急需的流动性，可以扩大负债，进行更大胆的经济刺激政策。"
 LIB_jjxt.9.a: "真是久旱逢甘霖。"
 LIB_jjxt.9.b: "你可以去银行取钱，但那里已经没有多少财富了。"
 LIB_jjxt.9.a_tt:"§Y货币贬值严重影响了国家稳定，但是也带来了机遇§!"
 LIB_jjxt.10.t: "别样产业" 
 LIB_jjxt.10.d: "不甘于忍受物资匮乏的城市居民们自发开展了城市农业项目。市民互相交流经验，以部分口粮为种子，利用屋顶、阳台以盆栽方式种植绿叶菜、西红柿、萝卜、芜菁等蔬菜；或利用住宅养鸡，甚至在床底养猪。\n\n原新人间之里三期工程中废弃的工地也被改造成菜园，失业工人中的进城农民和兽人带头开展农业生产，成效显著。这一成功经验正在吸引更多企业将闲置土地用作农业以安置失业工人。\n\n此外，秸秆，鸡毛和猪鬃还小规模地带动了城市手工业的繁荣。一些服装厂甚至特意向市民发包制作草帽，刷子和掸子等手工产品，而家庭主妇们很乐意从中赚取一天的饭钱。"
 LIB_jjxt.10.a: "办法总比困难多。"
 LIB_jjxt.10.b: "不知道紫大人喜不喜欢吃鸡蛋。"
 LIB_jjxt.11.t: "饥饿行军的终点" 
 LIB_jjxt.11.d: "经过数月干预，因种植园崩溃而出现的兽人南下风波最终平息。政府迅速介入，将大量兽人安置于附近尚能维持粮食生产的农庄，以防其加入南下大军。而在处理已经南下的队伍的问题上，后户势力的经验被证明非常有效。后户系所称‘被差别民’中，本有一批适应沙漠环境的兽人。后户系借此迅速组织兽人救济队，南下追踪各队伍，施以救济，同时扩展信仰网络。\n\n受到启发的救济和治安部门在此之后也采取了就地聘用和训练兽人逃难者进行救济的方式。雇佣兽人提供了各自聚落特有的联络和集合方式，使得救济部门很快就掌握了南下兽人队伍的数量和情况。此举极大减少了南下兽人中的人道主义灾难。\n\n目前报告表示，南下兽人已经基本回到了各自聚落，但仍有少数聚落承载能力有限，需要进一步救济。"
 LIB_jjxt.11.a: "这无疑是一件好事。"
 LIB_jjxt.11.b: "“被差别民”的大幅扩张吗？有趣。"
 LIB_jjxt.12.t: "月民交换日" 
 LIB_jjxt.12.d: "过去相对封闭的月之民社区，在近几个月开始举办”交换日“活动。据称，月之民希望处理绀珠事件以来囤积日久，”沾满污秽“的军用物资，在每月的上弦月，下弦月和待宵夜向市民展开交换活动。参与的市民可以用手工艺品，闲置家具，粮食或机械交换军用罐头，药品和保暖服装。\n\n虽然在前几个”交换日“，市民多半担心月之民的物资”过于纯净“而无法使用，但事实证明，月之民用于交换的积压物资确实在一定程度上缓解了城市内的食品与药品匮乏。\n\n一名受到采访的市民称，月民的罐头非常饱腹，而交换现场的月兔武装也非常帅气，令人印象深刻。"
 LIB_jjxt.12.a: "月之民一直坚持的“净化地面”，到底是真是假？"
 LIB_jjxt.13.t: "如何压低劳工待遇？" 
 LIB_jjxt.13.d: "虽然八云蓝希望计划通过降低劳工法定待遇的方式提高劳动力流动性，但如何执行降低劳工待遇的政策，是个更重要的问题。\n\n很显然，直接降低劳工待遇不仅会造成劳工抗议，还会阻碍生产循环进行，这会使得经济复苏效率打折扣\n\n针对新老员工差别对待也可行，但如此一来，行政成本会更高......\n\n当然，也可以用最简单快捷的方式：直接补贴企业，但这样一来，势必要提高财政支出。"
 LIB_jjxt.13.a: "苦一苦劳工们，反正度过了危机，一切都会恢复的。"
 LIB_jjxt.13.b: "只针对新劳工压低待遇应该不会造成大问题。"
 LIB_jjxt.13.c: "幻想乡以和谐为贵，还是发钱吧。"
 LIB_jjxt.14.t: "社会抗议" 
 LIB_jjxt.14.d: "果不其然，当劳工法定待遇临时下调的消息一经爆出，社会舆论哗然。不少独立媒体宣称此举是”倒退“”法西斯行为“，甚至批评”八云紫身为贤者，带头破坏幻想乡的和谐生活“。\n\n但另一方面，劳工阶级对此的不满实际并没有如媒体一般高涨。"
 LIB_jjxt.14.a: "这是非常时期，我们需要共克时艰。"
 LIB_jjxt.15.t: "”洗池“" 
 LIB_jjxt.15.d: "原本设计下，仅仅压低新劳工待遇，可以保全老劳工的地位，而新劳工为了解决生机，也愿意接受相对更低的工作待遇。然而，近期有新闻报告称，各个企业确实存在一定以彻底辞退为威胁，要求老员工辞职再返聘的行为，这一定程度上绕开了现在的政策。\n\n不过，至少这样一来，还是有相当数量的劳工保留了原待遇，而被差别对待的劳工也不会把不满指向政府。"
 LIB_jjxt.15.a: "我们已经做到最好了。"
 LIB_jjxt.16.t: "补贴诈骗" 
 LIB_jjxt.16.d: "虽然现行政策向仍在扩大劳工雇佣的企业提供经济补贴和税收减免，但由于政策过于粗放，诈骗补贴事件时有发生。\n\n最离谱的是新人间之里的一家建筑企业，其威逼利诱了上千人签订了姓名，信息等完全与本人不符的合同，并借此向政府要求补贴。而签订合同的”劳工“只被发放了少量维生食物，由于公司提供的合同是伪造的，劳工们也无法证明自己与公司确实存在劳动关系。\n\n事件经媒体曝光后，已由警方介入调查。"
 LIB_jjxt.16.a: "惩治过火的，其他的就这样吧，官僚力量已经捉襟见肘了。"
 LIB_jjxt.17.t: "在新人间之里训练海军和空军？" 
 LIB_jjxt.17.d: "新人间之里提出利用当地充沛的人力，建设数座大型空军基地和海军基地，用于训练幻想乡空军和潜艇部队。\n\n作为回报，新人间之里希望能承接部分我国军工产业。"
 LIB_jjxt.17.a: "这是好事啊。"
 LIB_jjxt.17.b: "这并不重要。"
 LIB_jjxt.18.t: "幻想乡同意在新人间之里建设空军与海军训练基地" 
 LIB_jjxt.18.d: "幻想乡已经同意在新人间之里建设空军与海军训练基地，并附带建设一些配套军工设施"
 LIB_jjxt.18.a: "好。"
 LIB_jjxt.19.t: "幻想乡拒绝在新人间之里建设空军与海军训练基地" 
 LIB_jjxt.19.d: "幻想乡拒绝在新人间之里建设空军与海军训练基地，他们认为该提案有价值，但不适合现在执行。"
 LIB_jjxt.19.a: "那你们要等到什么时候？"
 LIB_lw.1.t: "战胜无望"
 LIB_lw.1.d: "人间之里已经陷落。面对白骨大军，幻想乡的武装力量已经无法组织起新的防线了。虽然形式如此危急，但是也不能考虑投降。眼下，只有准备前往新人间之里建立流亡政府。"
 LIB_lw.1.a: "收拾行囊"
 LIB_lw.2.t: "撤离准备完毕"
 LIB_lw.2.d: "在签署解散政府的法令之后，斯卡蕾特王室迅速登上了前往新人间之里的轮船。"
 LIB_lw.2.a: "别了，故乡"
 LIB_lw.3.t: "流亡者到达"
 LIB_lw.3.d: "斯卡蕾特王室已经到达新人间之里。"
 LIB_lw.3.a: "我们会继续战斗"
 LIB_lw.4.t: "战胜无望"
 LIB_lw.4.d: "人间之里已经陷落。面对白骨大军，幻想乡的武装力量已经无法组织起新的防线了。虽然形式如此危急，但是也不能考虑投降。眼下，只有准备前往新人间之里建立流亡政府。"
 LIB_lw.4.a: "收拾行囊"
 LIB_lw.5.t: "撤离准备完毕"
 LIB_lw.5.d: "幻想乡当局在解散政府后，迅速登上了前往新人间之里的轮船。"
 LIB_lw.5.a: "别了，故乡"
 LIB_lw.6.t: "流亡者到达"
 LIB_lw.6.d: "幻想乡当局已经到达新人间之里。"
 LIB_lw.6.a: "我们会继续战斗"
 
 LIB_dwmy.1.t: "新人间之里请求出口政策指导"
 LIB_dwmy.1.d: "新人间之里希望出口磷灰石作为军用以减缓经济危机的影响，但我们当然不能让他们把货卖给我们的潜在敌人......"
 LIB_dwmy.1.a: "只要别卖给魔导国就行"
 LIB_dwmy.1.b: "我们潜在的敌人都不行"
 LIB_dwmy.1.c: "甚至包括那些可能威胁到我们传统盟友的......"
 LIB_dwmy.2.t: "新人间之里希望向我们出口磷灰石"
 LIB_dwmy.2.d: "新人间之里希望出口磷灰石作为军用以减缓经济危机的影响。根据我国工业专家研究，这些矿物可以加强我国生产特种弹药和精密仪器的能力。"
 LIB_dwmy.2.a: "不错的交易"
 LIB_dwmy.2.b: "我们的钱要花在更好的地方"
 LIB_dwmy.3.t: "磷灰石完成出口"
 LIB_dwmy.3.d: "一笔磷灰石出口订单已经谈成"
 LIB_dwmy.3.a: "好事"
 LIB_dwmy.3.a_tt: "§Y国家动荡微幅缓解§!"
 LIB_dwmy.4.t: "新人间之里询问幻想乡进口磷灰石意愿"
 LIB_dwmy.4.d: "幻想乡需要磷灰石矿来加强生产能力吗？"
 LIB_dwmy.4.a: "当然"
 LIB_dwmy.4.b: "我们的钱要花在更好的地方"
 
 LIB_flavor.1.t:0 "始动"
 LIB_flavor.1.d:0 "新人间之里城郊，一座不起眼的木屋里。八云蓝正气喘吁吁。她从办公桌下拿出一张符纸，熟练地用尖牙咬破手指，滴上血，画着图案，口中则念念有词。\n“紫大人，快收到我的消息啊！”蓝的额头上沁满汗珠，“您可不要在隙间里睡死了......”\n正在此时，她身旁的电话铃声突然响起。\n“怎么在这个时候来电话？”她望了望电话，又看着手中正在发光的符纸，思索片刻，还是将符纸放下，拿起电话。\n“八云邸。公务请接新人间之里行政办公室。”蓝熟练地说着。\n“哎呀，蓝。是我。意外吗？”电话那边传来熟悉的声音。\n“紫大人......这是？从隙间里打来的？”\n“我把电话线接到隙间里来了。你看，这是不是很方便？你以后联系我也不需要再用法术了......”\n“想不到您会用这种科技。诶不对，紫大人！玩笑话还请等会再说......”\n蓝的话音刚落，在她身后，空间中霎时裂开一道缝隙。蓝回头时，正好与刚刚走出缝隙的妖怪贤者对上视线。\n“事情严峻到连玩笑话都不愿意听我讲完？那看来有什么比那位御阿礼之子去世更严重的事情发生了。把简报给我看看吧。”\n“您还是一如既往地善变呢。”紫的话音刚落，蓝就从袖中掏出了一张满是打印字的纸张，双手递上。\n“这句话我就当夸奖了。”紫接过了纸张，阅读起来。\n蓝将手插进袖子，恭敬地立在一旁。她不禁开始盯着自己的主人的脸，试图在上面找到几丝波澜。可望来望去，紫的神情还是一直未变。\n“看来这确实值得你将我从隙间中唤醒。这次的危机比阿兰陀（注：荷兰）的郁金香事件还要可怕。新人间之里居然会有人挨饿，我都不记得上次幻想乡发生饥荒是什么时候了。”\n“您的意见是？”蓝盯着紫。\n“这次的危机看来需要我出山了。”紫轻巧地打了个哈欠，望着眼中已经开始闪烁光芒的蓝：“不要摆着那副得了救的表情。你还有很多事情要做呢！先从搜集受灾情况开始吧。”"
 LIB_flavor.1.a:0 "是的，紫大人。"
 LIB_flavor.2.t: "日常" 
 LIB_flavor.2.d: "“蓝大人，这太无聊了。”橙把鞋子扔到一旁，踮着脚蹲在椅子上，而整个上半身则趴在办公桌上。\n\n“说要我在这里接电话，可是这几个小时了，这电话都没响过。我担心离开了会漏掉电话，可在这里，我除了听这收音机，什么事也不能做呀！”\n\n“唉，这是最简单的活了。”八云蓝站在办公桌旁训斥着，“只用接几个电话，记一下内容而已。难道你想像我这样忙吗？当初你答应成为我的式神时是怎么承诺的？”\n\n“蓝大人……我确实说过，为了获得力量我会为蓝大人做任何事。但是……只是在这里打电话，接电话，写字，打印纸，撕纸……这真的能获得什么力量吗？”\n\n“做这些事，是紫大人的安排。难道你怀疑紫大人的安排吗？”\n\n说完这话，八云蓝望着仍然嘟着嘴的橙，内心突然有些过意不去，“什么时候紫大人醒来，我们一起去请她解释吧。” \n\n“蓝大人！有新的电报！急电！”办公室外，不知是谁叫喊着。八云蓝听到后，立刻冲了出去。等她回来时，办公室里却空空荡荡。\n\n“橙？你去哪里了？”八云蓝嗅探着橙的气息，蹲下来看办公桌下，可哪里都没有橙的踪迹。就这一会儿，这猫妖居然从眼皮子底下跑了？\n\n“橙，我承认你躲的好，快出来吧。”八云蓝在办公室里到处翻看，突然瞥到了墙脚的一盏台灯，又看了看桌上那几乎一模一样的“台灯”，心里全都明白了。\n\n“SpellCard，式神【橙】！”话音一落，那桌上的“台灯”立刻滚倒，连带着把收音机也撞下桌去。“橙！没事吧？”八云蓝上前，橙脸朝下摔在地上，而那收音机一摔，发出呜呜的怪声。\n\n就在这时，收音机里传来了一个冰冷的女声：“十分钟前，敬爱的执政官稗田阿求在家中去世。治丧委员会正……”\n\n“蓝大人……”橙从地上爬起来，“这是说，寺子屋的那位读书人……还是死了？" 
 LIB_flavor.2.a: "是的，她命运如此，正如我手上的电报所说。"
 
 
 LIB_flavor.3.t:0 "沙漠苦旅1"
 LIB_flavor.3.d:0 "帕萨已经与大部队离散了两天了。身上还有粮食，可水已经喝完了。夕阳西斜，茫茫沙漠连块岩石都没有，他感觉自己像是在原地打转了几个小时。帕萨的耳朵透出明显的血丝，热风吹来，风中的沙子刮得他耳朵生疼。\n\n“我是不是要死了......上次来的时候......绿洲应该在这一块啊......哎呀！”帕萨望着天上巨大的太阳呢喃着，脚下突然被什么东西绊倒。等他再度爬起身才看到，脚下的沙子里露出半只脚，居然是一具干尸！\n\n“哎呦我去！”帕萨坐在地上，拍了拍脸。“这不会是幻觉吧......不管了，得先看看你有些什么。”他把那尸体扒出来，在那尸体的腰间，居然挂着一个皮囊。帕萨挤了挤，那皮囊居然还是满的！\n\n神灵保佑啊！居然有水了。可他还没把皮囊拿起来，一只手就伸过来，抓住了他的手腕。帕萨抬起头，一记重拳就打到了他的面门。\n\n“啊！谁敢打我？”帕萨被打翻在地，他抽出一把磨到开刃的铁勺子，站起来。面前是个壮硕的犬兽人，她正用力地把那皮囊从死人怀里拽出来。\n\n“你这母狗！这是我先发现的！”帕萨举起勺子对着那犬兽人。\n\n“见面就叫人母狗，真没礼貌！小公狐狸，有命就来拿呀！”那犬兽人举着皮囊挑衅他。\n\n“来就来！”"
 LIB_flavor.3.a:0 "帕萨冲上去，用身体撞向那犬兽人。"

 LIB_flavor.4.t:0 "沙漠苦旅2"
 LIB_flavor.4.d:0 "“切，这么小个子还这么倔。”那犬兽人丢掉皮囊，举起双臂阻挡，和帕萨缠抱在一起。帕萨还没反应过来，就立刻挨了一膝顶。\n\n“唔......”帕萨只感到五脏六腑都要裂开了，但经验告诉他，敌人肯定要乘胜追击。他忍着痛迅速侧滚，一记重踏就砸在他身旁。\n\n“好机会！”趁对方攻击失手，帕萨立刻扬起勺子，那犬兽人哀嚎一声向后退去。他看见那犬兽人捂着脸，血从爪缝中流出。\n\n“啊！你居然伤了我的脸！姑奶奶要你的命！”那犬兽人狂叫地冲了上来，一把抱住帕萨的脖子。帕萨立刻用力把勺子刺向那犬兽人的腹部，可那犬兽人毫无反应，一肘打在他的左脸。帕萨的世界一阵闪烁，他摔倒在地，两颗牙伴着血从他嘴中吐出。接着，一记重踢又踢在他腹部，帕萨立刻眼前发黑，趴在了地上。\n\n“好，现在那皮囊......归我了。”那犬兽人腹部还插着勺子，血从伤口处缓缓流出。她捡起地上的皮囊，举过头顶，打开盖子。\n\n可倾斜而下的不是水，而是滚烫的沙子。\n\n“哈.....哈哈，我说这死人......怎么还抱着这么大一袋水......原来是用来骗自己啊！”"
 LIB_flavor.4.a:0 "当沙子流光时，那犬兽人也倒在了地上。"

 LIB_flavor.5.t:0 "沙漠苦旅3"
 LIB_flavor.5.d:0 "“我叫帕萨，是阿图格部落的。你呢？”帕萨躺在沙丘上，问道。\n“阿娜扎，本豪部落......”阿娜扎按着腹部的伤口回答着。\n“很抱歉......你这个伤口......”帕萨尴尬地盯着阿娜扎的腹部伤口，“要不你歇一会，我来帮你按一会。”\n\n“算了......看你这么瘦，你能按多久？”阿娜扎声音微弱。\n“话说，你也是从种植园过来的吗？”帕萨问。\n“是。”\n“你也是和大部队走散了吗？”\n“不然呢？”\n“唉......这条路真不好走。这比在种植园挨饿还难受......吃东西吗？”帕萨从干粮袋里拿出一点麦粒。\n“干的，不吃。”\n“也是。”帕萨躺下，看着天上的星空，“明天一早，等到太阳出来，我们两个就会死吧。”\n“是啊，跟你这家伙死在一块，真是无聊......”阿娜扎伸手去摸插在腹部的勺子，“或许你还能活下来。把我的血喝一些，你还能再走一段路，说不定......”\n“这怎么能行！”帕萨连忙转身，把阿娜扎放到勺子上的手拨开，“这不是杀人吗？你的鬼神会跟我一辈子的！”\n“这算我自杀......”\n“那也不行，这算你因我而死。我就算死在这，也不能这么做。”帕萨斩钉截铁，又犹豫起来，“再说，我丢了方向，就算再走一段，说不定也只是原地打转.延长折磨.....”\n\n“哈哈......好吧。我的血要流干了......那就一起去那边的世界吧。我要睡一会。”\n\n“好吧，看来这就是终点了。晚安，阿娜扎。”\n\n帕萨长出一口气，闭上了眼睛。可朦胧中，他似乎听到了一阵驼铃声。\n那大概是幻觉吧。这里怎么可能有人呢？但是，那驼铃怎么，越来越近了？\n帕萨眼睛睁开了一小条缝，他模糊地看到，真的有骆驼从他们面前走过。\n“秽身探知水雷的反应很强！你们四处看看！”\n“月球人的东西经常误报的，老大你确定吗？”\n“找到了！真的有人！两个伤员！状态很差！”"
 LIB_flavor.5.a:0 "“快点！你去拿水！还有你，把药品和后户徽章也带上！”"
 
 LIB_flavor.6.t:0 "小意外"
 LIB_flavor.6.d:0 "“这里的纸太多了，不要再往这里堆纸张了！”\n当一个小妖精搬着一沓纸张进入办公室，放在办公桌上时，八云紫终于按耐不住了。\n“真是抱歉！真是非常抱歉！贤者大人，我的职责就是往这里送纸。贤者大人请不要生气！”小妖精被吓得不停地鞠躬。\n“没有怪罪你的意思，但是......蓝平日的工作量这么大吗？唉，她去巡查城乡物流之前那么心神不宁，原来是这样！”八云紫嘀咕着，转头面向那个小妖精：“把财务部长，人事部长和防卫部长叫到这里来。”\n\n“啊？我？”那小妖精张大嘴巴，“我就是一个送纸的，贤者大人”\n“呵呵，只会送纸，那就只能送纸。你要是能把他们叫过来，那你认为，你还会只是送纸吗？”\n“好吧，贤者大人，我试试。”那小妖精吞了口口水，跑出了办公室。\n\n过了一会，一个人类，一个灰狼天狗和一个凤蝶妖精一起走进了办公室。“抱歉，贤者大人。我们没料到您会让一个小职员来通知我们......”人类赔着笑，张口说。\n“那个小妖精以后就是我的传令员了。现在重要的事情。”八云紫抄起桌上的两张纸：\n“财政部报告这周的财政收入和支出情况，还报告各个项目的执行情况。财政部为什么这么事无巨细？这些事不应该在财政部内部解决吗”\n\n“这......蓝大人在的时候，我们都是这么做的。”人类低着头回答。\n“还有这个，某某职员喜欢上班开小差，某某官员违规飙车，违纪就按照规章制度办就好了，可别让别人把你们当成那个喜欢爆料的鸦天狗。”\n“额......蓝大人叫我们收集的。另外，我们确实按制度处理了他们。”灰狼天狗用袖子擦了擦汗。\n“好，还有这个。自卫队训练程度接近七成，少量人受伤......防卫部长现在遇到了什么困难吗？如果没有困难，报告这些是为了什么？”\n“爱塔妮缇不知道哦，蓝大人确实要求上报这些信息。”风蝶妖精一脸天真。\n“从今往后，上报那些你们解决不了的困难就可以了。”八云紫挥了挥手。\n\n“在下还是劝您不要这么命令为好。”人类鞠着躬，攥着手，“蓝大人回来了，看不到我们的报告，我们没法交代啊！”\n“这样啊，但贤者可不是超级计算机，像蓝这样行政，比巡视博丽大结界还累。”八云紫手指一划开，隙间凭空出现。\n\n“SpellCard，式神【八云蓝】！”八云紫一声令下，符文的光芒在空中出现。\n\n然而什么都没发生。\n\n“拒绝了？”八云紫皱眉，“你们先退下吧。”\n等到众部长都离开后，八云紫把手伸进隙间猛拽。隙间里传来一阵嘈杂的喊叫声。八云紫只感觉手感很怪，八云蓝似乎在抵抗，又像是卡在什么地方了。\n“蓝！你是不是遇到什么危险了？”八云紫又再努力用了用力，从隙间里拽出了一只狐狸耳朵。她再用力一拽，八云蓝从隙间中现身摔在地上。\n“蓝！出什么事了？为什么不回应召唤？”“紫大人......我没事，但是......”八云蓝挣扎着，从地上爬起来。\n“没事就好，回答一下你是怎么锻炼这些官员的，蓝。”\n“紫大人，请您先等一下......”\n“行政就像放牧，把羊赶到草场就行了，了解每只羊吃了多少草是牧羊犬的工作。你为什么要收集这么多的报告呢？”\n“紫大人，请您......”\n“像溺爱孩子一样对待这些部长可不行。时间长了，他们会变得毫无主见的。”\n“紫大人......”\n紫终于停下，眯着眼看了看蓝，似乎感到有些不对：“唉，什么事让你这么着急？蓝，现在给你机会，你要说什么？”\n“紫大人......我刚刚在开车！橙还在车上呢！”"
