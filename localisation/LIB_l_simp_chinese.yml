 LIB_junshi_category:"[LIB_HXXFWJ_NAME]"
 LIB_ruqinMOR:"入侵新游汐叶界"
 LIB_ruqinLBA:"入侵利比亚"
 LIB_ruqinYSS:"劝说索维耶特联盟对抗魔导国"
 LIB_ruqinZIM:"劝说罗德西亚地区对抗魔导国"
 LIB_ruqinETH:"劝说埃塞俄比亚对抗魔导国"
 LIB_quanguoqiyi:"全国大起义"
 LIB_quanguoqiyi_desc:"海军步兵精锐特战分队和游击队会通过隙间通道潜入幻想乡策划大规模起义，配合正面反攻。起义的持续情况受袭击部队投资等级影响"
 LIB_bubingzhuangbeigexin:0 "步兵装备革新"
 LIB_bubingzhuangbeigexin_desc:0 "投入陆军经验对步兵装备进行全面革新，通过简化生产流程与统一标准，降低步兵装备的制造成本。"
 LIB_tzbdjdxlyq:0 "特种部队极端训练·一期"
 LIB_tzbdjdxlyq_desc:0 "借助新人间之里的大漠与丘陵训练特种部队。"
 LIB_tzbdjdxleq:0 "特种部队极端训练·二期"
 LIB_tzbdjdxleq_desc:0 "在前期训练基础上，将特种部队投入大漠南方的丛林地区，进一步强化特种部队的作战能力。"
 LIB_tuiguangtzbd:0 "推广特种部队经验"
 LIB_tuiguangtzbd_desc:0 "将特种部队的训练经验推广至常规部队。"
 LIB_dayucaocaorujiyu:0 "大玉嘈嘈如急雨"
 LIB_xiaoyuqieqierusiyu:0 "小玉切切如丝雨"
 LIB_caocaoqieqiecuozafa:0 "嘈嘈切切错杂发"
 LIB_dayuxiaoyuzashagua:0 "大玉小玉砸傻瓜"
 LIB_yueduzhongpao:0 "月都重炮"
 LIB_yueduzhongpao_desc:0 "借鉴月都的大型弹幕发射器技术，降低超重火炮的建造成本。"
 LIB_disihuaiantongdao:0 "利用第四槐安通道"
 LIB_disihuaiantongdao_desc:0 "第四槐安通道可以使得我方直接从月球侦察地面的特殊地理与气象条件。"
 LIB_zzwh:0 "征召因污秽拒服兵役者"
 LIB_zzwh_desc:0 "确实存在一些月民因污秽而拒绝服兵役，但他们应该不会拒绝为首都防空和补给。"
 LIB_hstzxsl:0 "秽身探知型水雷"
 LIB_hstzxsl_desc:0 "推广月都的高效探测仪器。经过一定调校后，该仪器的误报率已经大大降低。配备月民和月兔操作员效果更好"
 LIB_hhzl:0 "在背后开门的能力"
 LIB_hhzl_desc:0 "分发已经成熟的后户徽章。该徽章背面与后户之国连通，可以给予佩戴者更强的生命力，专注力和抗疲劳作用，暂无副作用报告。摩多罗隐歧奈特别声明，§R每名士兵只能至多佩戴一枚§!。"
 LIB_zqlss:0 "再起立战斗剂"
 LIB_zqlss_desc:0 "一种凝聚了大量生命力的注射剂，只能由军级指挥官批准，并由最精锐的士兵携带。当使用时，狂乱的生命力会使得士兵获得短暂的体能大幅提升，甚至从濒死状态复苏，但随后高浓度的生命力的逸散会连带消耗使用者本身的生命力，使得使用者迅速衰竭死去。这种注射剂可以用于死前最后一搏。摩多罗隐歧奈特别声明，§R一切有关该药剂导致士兵复活的传言均未被证实§!。"
 LIB_gzzyfz:0 "绀珠之药（仿制）"
 LIB_gzzyfz_desc:0 "月之都研究机构根据绀珠事件中的资料记录，仿制出了八意永琳的绀珠之药。该药物可以通过对污秽的约束与屏蔽控制使用者体内的污秽含量，使得使用者可以暂时免疫一切沾染污秽的交互。临床上的表现是字面意义上的刀枪不入，但使用者似乎会经历强大的精神压力，包括但不限于闪回，精神分裂，抑郁和人格障碍。月之都声称“该药物一切副作用都只会出现在污秽的地面人身上，月之民完全不会有上述副作用”。"
 LIB_hhzljczd:0 "后户之力集成炸弹"
 LIB_hhzljczd_desc:0 "被特意填充集成生命力的炸弹，该炸弹将在爆炸之后释放可控且定向的狂乱生命力，使得被影响者出现一定的神经损伤。目前的临床实验已经表明，这样的生命力可以使得被影响者在较长的一段时间内经受失语，失眠，暴躁，肌肉强直，被迫害妄想，超敏感和肾上腺素异常激增的症状，这些影响需要接近一个月的时间才能逐步消除。尽管这种魔法并不人道，§R但纵使天崩地裂，幻想乡也必须存续。§!"
 LIB_bszljhhzd:0 "部署战略级后户炸弹"
 LIB_bszljhhzd_desc:0 "数十个填充了过量狂乱生命力的装置将由隙间通道被传送至魔导国境内的各大城市，这些炸弹旨在当地造成长期且不可逆的地区生命力污染。预计将会有上万人直接被过量生命力杀害，而上千万人会饱受生命力折磨。§R但纵使天崩地裂，幻想乡也必须存续。§!"
 LIB_bsss:0 "部署丧尸"
 LIB_bsss_desc:0 "月之都研究机构对于八意永琳的绀珠之药仿制获得了成功，该药物可以大幅净化个体的污秽程度，与后户之力配合使用将造就可以长期约束生命力于个体体内的效果。这意味着可以直接将死尸转化为完全受本能控制，且能在较长时间存在的行尸走肉。在同时部署绀珠之药和后户炸弹的地区，死者将不断被转化为丧尸。摩多罗隐歧奈声明，这些丧尸理论上可以通过后户之力进行操纵。\n\n我们已经铸下大错，造出了世人所不容许的邪恶武器，§R但纵使天崩地裂，幻想乡也必须存续。§!"
 FREE_FRA_Return_from_Hell_category:"宣告幻想乡光复"
#事件
 LIB_jjxt.1.t: "黑色星期二波及新人间之里"
 LIB_jjxt.1.d: "“紧急撤资？你们居然连违约金都不管的吗？”八云蓝大喊着，对着听筒另一端发出疑问，但对方显然没有解释的意思，很快便挂断了电话。\n\n显然，对方只是前来通知，而非商议的。\n\n“蓝大人......”橙正搬着一叠几乎盖过她的纸走到蓝的办公桌旁，“从今早开始，电报就一张接着一张......发生什么事了？”\n\n“没事的，橙，我来看看。”蓝顺手从橙抱着的纸堆顶抽了两张阅读起来，可电报里写满了骇人的信息。\n\n新人间之里的多家银行发生了挤兑，储户们甚至在银行门口发生了踩踏事件；数艘已经装载货物的货轮因为订单取消而滞留新人间之里港口，它们一时堵塞了泊位，港务一片混乱；原定进入工业园区工作的劳工又与工头发生冲突，斗殴造成了多人受伤和交通堵塞......\n\n“蓝大人，发生了什么事情？”橙侧着头问。\n\n“不必担心，”蓝摸了摸橙的脑袋，“不要乱跑，我出去处理一下......”\n\n还没等橙有所回应，八云蓝就拖着她硕大的尾巴，跑出了办公室。"
 LIB_jjxt.1.a: "蓝大人，真的不必担心吗？"
 LIB_jjxt.1.a_tt:"§R国家陷入了进一步动荡§!"
 LIB_jjxt.2.t: "银行大规模挤兑"
 LIB_jjxt.2.d: "受到幻想乡经济波动影响，多家银行陷入了大规模挤兑潮。每日早晨，前来兑付的储户都会排起长队，虽然有警察前来维持秩序，但是时有冲突流血事件发生。有报告称，甚至有警察借职务之便先行兑付的现象。\n\n多家银行目前已经暂缓业务，但很明显，这并不能解决问题。一旦他们的流动性告罄，他们很可能不得不被迫低价出售手中的实业债权以维持业务，届时将会对新人间之里的实业资金链造成毁灭性打击。"
 LIB_jjxt.2.a: "但大家的工资还在银行里呢！你们叫大家拿什么买吃的？"
 LIB_jjxt.2.a_tt:"§Y国家部分从动荡中恢复§!"
 LIB_jjxt.3.t: "大规模失业"
 LIB_jjxt.3.d: "大量企业因融资与订单受到影响，不得不缩减劳工规模，大量劳工已经陷入失业。而随着企业的收缩，个体商户同样无力维持原有经营规模，只得裁减雇员，甚至停止营业。\n\n失业正在迅速蔓延，一场更大的社会危机已经迫在眉睫"
 LIB_jjxt.3.a: "一定要在失业者花完存款之前扭转局势！"
 LIB_jjxt.3.b: "等等，之前好像报告他们取不出钱？"
 LIB_jjxt.4.t: "月之民社区骚乱" 
 LIB_jjxt.4.d: "一则荒诞谣言声称，此次经济危机正是月之都策划的”地面净化计划“的一部分。这则毫无逻辑的谣言煽动起一批暴徒于近日袭击了多处月之民社区。\n\n根据现有报告，涉事月民与暴徒均有受伤，尚无死亡报告。各自月之民社区表现出了惊人的组织力，战斗力和克制性，部分社区甚至在警察抵达前便自行组织人员保护居民，并在警察抵达后主动与警方共同指挥。但警察部门也报告称，警力目前已经捉襟见肘，有很多月民社区只能依赖自卫。更有部分暴徒不满警方的“偏袒”，袭击了警察局。" 
 LIB_jjxt.4.a: "警察要是管不住，我就派自卫队来。"
 LIB_jjxt.5.t: "招标丑闻使托拉斯受损"  
 LIB_jjxt.5.d: "一家由跨国投机资本控制的空壳公司利用幻想乡的分包漏洞，侵占了新人间之里建设计划中原预留予本土企业的工程份额。该公司又依托与外国大型工业集团的合作关系，吸引多方资本认购股权，并在萧条爆发后迅速套现撤出。后户系与月都系资本由于大量认购该公司股权而蒙受了巨大损失。\n\n虽然目前没有证据表明这是一场有预谋的行动，但这显著加剧了新人间之里的经济危机。"  
 LIB_jjxt.5.a: "这样玩会被共产党人耻笑的。"
 LIB_jjxt.6.t: "住房期权丑闻"  
 LIB_jjxt.6.d: "承建新人间之里城区部分扩建项目的一家建筑公司最近深陷诉讼泥潭。该公司借助稗田阿求时期的繁荣，以出售住房购买期权的方式筹集资金，但实际未建成任何住房。随着大萧条的到来，期权价格暴跌，该丑闻才迅速曝光。\n\n有传闻称，该建筑公司曾违规将同一期权私下出售给多人以大量集资，并挪用大量资金投资外汇市场。而该公司董事长辩解称，住房建设资金始终存在，只是目前滞留在银行无法使用。\n\n目前，该公司涉事人员已经被警方控制，并等待检察机关介入调查。"  
 LIB_jjxt.6.a: "挺聪明的，就是没算到经济危机。"
 LIB_jjxt.6.b: "昨日一去不复回。"
 LIB_jjxt.7.t: "饥饿行军" 
 LIB_jjxt.7.d: "在南方，因经济危机影响，绿洲地区的种植园经济已经濒临崩溃。由于粮食运输成本大幅提高，种植园开始面临大规模饥荒，大量租种土地的兽人家庭开始出售农具和牲畜，离开种植园。虽然种植园承诺暂缓租金，但仍然无力从北方产粮区调来足够粮食。绝望之下，大量兽人向南方尚有存粮的兽人聚落进发，迅速汇成逃荒大军。\n\n目前的报告称，南下兽人集群内部秩序混乱，暴力频发，粮食匮乏。为抢夺原本用于酿造清酒的精米，斗殴流血屡见不鲜。救济和治安人员无法覆盖每一支队伍，也难以跟随队伍深入沙漠，相关工作几乎无法展开。" 
 LIB_jjxt.7.a: "读这份报告时，或许他们的队伍里就要死人。"
 LIB_jjxt.8.t: "火热夏夜" 
 LIB_jjxt.8.d: "最初，新人间之里城市中不过因为干旱酷热出现了几个起火点，但火灾很快就演变成了一场骚乱。由于火灾破坏了当地电力设施，而电力系统人手不足，无法及时修复，停电进一步影响了消防、供水与通讯系统，消防系统难以迅速处理火灾。\n\n入夜后，由于警方人手被大量抽调处理火灾与维持火灾现场秩序，城区内出现了大量盗窃，抢劫事件，一些暴徒也趁机袭击了月之民社区。更有甚者主动纵火以进一步分散警方力量，甚至直接袭击警察和消防员。一些工业企业也成为了报复对象，遭到了不明身份者投掷燃烧瓶攻击。根据现有报告，截至目前，火灾与纵火事件已造成数个街区被焚毁，抢劫与暴乱所致伤亡及财产损失仍在统计。\n\n紧急介入的自卫队已于次日清晨镇压了暴乱，恢复了城区秩序。"
 LIB_jjxt.8.a: "那天夜里，从行政长官公署向外望去，新人间之里简直如白昼一般。"
 LIB_jjxt.9.t: "经济溃坝" 
 LIB_jjxt.9.d: "多数人都笃信，追求和谐的幻想乡不会轻易下调货币汇率，以储户与中产阶层的财富为代价拯救经济。\n\n然而，就在近日，幻想乡当局毫无预兆地宣布了货币贬值政策，大幅下调本币兑贵金属的固定比价，并按比例扩大货币供给。很快，国际市场上，幻想乡本币价格如闪电般下跌，这出乎了绝大多数人的意料。\n\n不过，当国际多头大军与大额储户为此痛哭流涕时，负债企业和个人正在为负担减轻而欢呼，而新人间之里更获得了急需的流动性，可以扩大负债，进行更大胆的经济刺激政策。"
 LIB_jjxt.9.a: "真是久旱逢甘霖。"
 LIB_jjxt.9.b: "你可以去银行取钱，但那里已经没有多少财富了。"
 LIB_jjxt.9.a_tt:"§Y货币贬值严重影响了国家稳定，但是也带来了机遇§!"
 LIB_jjxt.10.t: "别样产业" 
 LIB_jjxt.10.d: "不甘于忍受物资匮乏的城市居民们自发开展了城市农业项目。市民互相交流经验，以部分口粮为种子，利用屋顶、阳台以盆栽方式种植绿叶菜、西红柿、萝卜、芜菁等蔬菜；或利用住宅养鸡，甚至在床底养猪。\n\n原新人间之里三期工程中废弃的工地也被改造成菜园，失业工人中的进城农民和兽人带头开展农业生产，成效显著。这一成功经验正在吸引更多企业将闲置土地用作农业以安置失业工人。\n\n此外，秸秆，鸡毛和猪鬃还小规模地带动了城市手工业的繁荣。一些服装厂甚至特意向市民发包制作草帽，刷子和掸子等手工产品，而家庭主妇们很乐意从中赚取一天的饭钱。"
 LIB_jjxt.10.a: "办法总比困难多。"
 LIB_jjxt.10.b: "不知道紫大人喜不喜欢吃鸡蛋。"
 LIB_jjxt.11.t: "饥饿行军的终点" 
 LIB_jjxt.11.d: "经过数月干预，因种植园崩溃而出现的兽人南下风波最终平息。政府迅速介入，将大量兽人安置于附近尚能维持粮食生产的农庄，以防其加入南下大军。而在处理已经南下的队伍的问题上，后户势力的经验被证明非常有效。后户系所称‘被差别民’中，本有一批适应沙漠环境的兽人。后户系借此迅速组织兽人救济队，南下追踪各队伍，施以救济，同时扩展信仰网络。\n\n受到启发的救济和治安部门在此之后也采取了就地聘用和训练兽人逃难者进行救济的方式。雇佣兽人提供了各自聚落特有的联络和集合方式，使得救济部门很快就掌握了南下兽人队伍的数量和情况。此举极大减少了南下兽人中的人道主义灾难。\n\n目前报告表示，南下兽人已经基本回到了各自聚落，但仍有少数聚落承载能力有限，需要进一步救济。"
 LIB_jjxt.11.a: "这无疑是一件好事。"
 LIB_jjxt.11.b: "“被差别民”的大幅扩张吗？有趣。"
 LIB_jjxt.12.t: "月民交换日" 
 LIB_jjxt.12.d: "过去相对封闭的月之民社区，在近几个月开始举办”交换日“活动。据称，月之民希望处理绀珠事件以来囤积日久，”沾满污秽“的军用物资，在每月的上弦月，下弦月和待宵夜向市民展开交换活动。参与的市民可以用手工艺品，闲置家具，粮食或机械交换军用罐头，药品和保暖服装。\n\n虽然在前几个”交换日“，市民多半担心月之民的物资”过于纯净“而无法使用，但事实证明，月之民用于交换的积压物资确实在一定程度上缓解了城市内的食品与药品匮乏。\n\n一名受到采访的市民称，月民的罐头非常饱腹，而交换现场的月兔武装也非常帅气，令人印象深刻。"
 LIB_jjxt.12.a: "月之民一直坚持的“净化地面”，到底是真是假？"
 LIB_jjxt.13.t: "如何压低劳工待遇？" 
 LIB_jjxt.13.d: "虽然八云蓝希望计划通过降低劳工法定待遇的方式提高劳动力流动性，但如何执行降低劳工待遇的政策，是个更重要的问题。\n\n很显然，直接降低劳工待遇不仅会造成劳工抗议，还会阻碍生产循环进行，这会使得经济复苏效率打折扣\n\n针对新老员工差别对待也可行，但如此一来，行政成本会更高......\n\n当然，也可以用最简单快捷的方式：直接补贴企业，但这样一来，势必要提高财政支出。"
 LIB_jjxt.13.a: "苦一苦劳工们，反正度过了危机，一切都会恢复的。"
 LIB_jjxt.13.b: "只针对新劳工压低待遇应该不会造成大问题。"
 LIB_jjxt.13.c: "幻想乡以和谐为贵，还是发钱吧。"
 LIB_jjxt.14.t: "社会抗议" 
 LIB_jjxt.14.d: "果不其然，当劳工法定待遇临时下调的消息一经爆出，社会舆论哗然。不少独立媒体宣称此举是”倒退“”法西斯行为“，甚至批评”八云紫身为贤者，带头破坏幻想乡的和谐生活“。\n\n但另一方面，劳工阶级对此的不满实际并没有如媒体一般高涨。"
 LIB_jjxt.14.a: "这是非常时期，我们需要共克时艰。"
 LIB_jjxt.15.t: "”洗池“" 
 LIB_jjxt.15.d: "原本设计下，仅仅压低新劳工待遇，可以保全老劳工的地位，而新劳工为了解决生机，也愿意接受相对更低的工作待遇。然而，近期有新闻报告称，各个企业确实存在一定以彻底辞退为威胁，要求老员工辞职再返聘的行为，这一定程度上绕开了现在的政策。\n\n不过，至少这样一来，还是有相当数量的劳工保留了原待遇，而被差别对待的劳工也不会把不满指向政府。"
 LIB_jjxt.15.a: "我们已经做到最好了。"
 LIB_jjxt.16.t: "补贴诈骗" 
 LIB_jjxt.16.d: "虽然现行政策向仍在扩大劳工雇佣的企业提供经济补贴和税收减免，但由于政策过于粗放，诈骗补贴事件时有发生。\n\n最离谱的是新人间之里的一家建筑企业，其威逼利诱了上千人签订了姓名，信息等完全与本人不符的合同，并借此向政府要求补贴。而签订合同的”劳工“只被发放了少量维生食物，由于公司提供的合同是伪造的，劳工们也无法证明自己与公司确实存在劳动关系。\n\n事件经媒体曝光后，已由警方介入调查。"
 LIB_jjxt.16.a: "惩治过火的，其他的就这样吧，官僚力量已经捉襟见肘了。"
 LIB_jjxt.17.t: "在新人间之里训练海军和空军？" 
 LIB_jjxt.17.d: "新人间之里提出利用当地充沛的人力，建设数座大型空军基地和海军基地，用于训练幻想乡空军和潜艇部队。\n\n作为回报，新人间之里希望能承接部分我国军工产业。"
 LIB_jjxt.17.a: "这是好事啊。"
 LIB_jjxt.17.b: "这并不重要。"
 LIB_jjxt.18.t: "幻想乡同意在新人间之里建设空军与海军训练基地" 
 LIB_jjxt.18.d: "幻想乡已经同意在新人间之里建设空军与海军训练基地，并附带建设一些配套军工设施"
 LIB_jjxt.18.a: "好。"
 LIB_jjxt.19.t: "幻想乡拒绝在新人间之里建设空军与海军训练基地" 
 LIB_jjxt.19.d: "幻想乡拒绝在新人间之里建设空军与海军训练基地，他们认为该提案有价值，但不适合现在执行。"
 LIB_jjxt.19.a: "那你们要等到什么时候？"
 
 LIB_lw.1.t: "战胜无望"
 LIB_lw.1.d: "人间之里已经陷落。面对白骨大军，幻想乡的武装力量已经无法组织起新的防线了。虽然形式如此危急，但是也不能考虑投降。眼下，只有准备前往新人间之里建立流亡政府。"
 LIB_lw.1.a: "收拾行囊"
 LIB_lw.2.t: "撤离准备完毕"
 LIB_lw.2.d: "在签署解散政府的法令之后，斯卡蕾特王室迅速登上了前往新人间之里的轮船。"
 LIB_lw.2.a: "别了，故乡"
 LIB_lw.3.t: "流亡者到达"
 LIB_lw.3.d: "斯卡蕾特王室已经到达新人间之里。"
 LIB_lw.3.a: "我们会继续战斗"
 LIB_lw.4.t: "战胜无望"
 LIB_lw.4.d: "人间之里已经陷落。面对白骨大军，幻想乡的武装力量已经无法组织起新的防线了。虽然形式如此危急，但是也不能考虑投降。眼下，只有准备前往新人间之里建立流亡政府。"
 LIB_lw.4.a: "收拾行囊"
 LIB_lw.5.t: "撤离准备完毕"
 LIB_lw.5.d: "幻想乡当局在解散政府后，迅速登上了前往新人间之里的轮船。"
 LIB_lw.5.a: "别了，故乡"
 LIB_lw.6.t: "流亡者到达"
 LIB_lw.6.d: "幻想乡当局已经到达新人间之里。"
 LIB_lw.6.a: "我们会继续战斗"
 LIB_lw.7.t:0 "最后通牒"
 LIB_lw.7.d:0 "新人间之里的使者递交了一份文件，要求我们无条件接受其保护。拒绝意味着战争，接受则意味着失去独立。"
 LIB_lw.7.a:0 "我们绝不屈服！"
 LIB_lw.7.b:0 "……我们接受。"
 LIB_lw.8.t:0 "最后通牒"
 LIB_lw.8.d:0 "新人间之里的使者递交了一份文件，要求我们无条件交出新游汐叶界。"
 LIB_lw.8.a:0 "我们绝不屈服！"
 LIB_lw.8.b:0 "……我们接受。"
 LIB_lw.9.t:0 "新人间之里希望在苏伊士修筑堡垒"
 LIB_lw.9.d:0 "新人间之里的使者递交了一份文件，希望于苏伊士修筑一批陆上要塞。"
 LIB_lw.9.a:0 "好事"
 LIB_lw.9.b:0 "还不是时候"
 LIB_lw.10.t:0 "埃及同意了"
 LIB_lw.10.d:0 "埃及同意我方在苏伊士修筑堡垒"
 LIB_lw.10.a:0 "好事"
 LIB_lw.11.t:0 "埃及拒绝了"
 LIB_lw.11.d:0 "埃及拒绝我方在苏伊士修筑堡垒"
 LIB_lw.11.a:0 "愚蠢"
 LIB_lw.12.t:0 "于昏暗地下"
 LIB_lw.12.d:0 "八云紫漫步在潮湿恶臭的下水管道中。在她的前面，一名矮小的士兵举着火把。火把在昏暗的管道中只能勉强照亮前路。\n\n“贤者大人，您可要注意您自己的裙摆。”茨木华扇在紫的身后说，“这里虽然脏，但也是我们抵抗者的家园。您等会见到那些战士们，也别嫌弃他们肮脏污秽。”\n\n“不如说，若是我还一尘不染，倒是显得有些格格不入了。”八云紫轻笑着迈步。\n\n“您可是从新人间之里那安宁祥和之地来的，就算再怎么脏也比我们这些人要好吧。”茨木华扇满不在乎。\n\n“说的也是。你们藏在这么深的地方，连情报局都花了很久才找到你们，白骨大军就更无法追到你们的踪迹了。”八云紫的目光看向了面前的士兵，“这位面善又负责的孩子身上还带着血迹，你们在持续袭击白骨大军吗？”\n\n“那当然了。拯救幻想乡于水火之中就是践行天道。”\n\n“我听说，白骨大军尝试在一些地方采取自治，也就是让旧日的地方领袖再度统治......”\n\n“贤者大人，我都收到过他们的邀请两次。”\n\n“这可是个很诱人的条件，我听说，他们允许自治的地区恢复幻想乡旧日的生活呢。”\n\n“邪道终究是邪道。”茨木华扇把十指交叉，背到脑后，“让他们霸占着幻想乡，去侵略世界的其他地方？这绝对不为天道所容。”\n\n“在新人间之里的军队到达之前，这多少也能保全幻想乡的生命，而且......”八云紫停下，侧身望着茨木华扇，“你相信你们这些人，能把整个白骨大军都驱逐吗？”\n\n“八云紫，请你注意你的话。”茨木华扇越过八云紫，拍了拍领路士兵的肩膀。那士兵立刻停下，“这孩子的亲人，同伴和恋人的生命都被白骨大军剥夺了，如果我与那些亡灵合作，千千万万与这孩子一样的人们也会拿起武器抵抗。你能阻止每个人吗？”\n\n“我保留我的意见，但我也认为，比起无视他们，不如把他们组织起来。”\n\n“我已经在做了。”\n\n“那或许你可以做的更多。”八云紫轻轻一笑，“在新人间之里，同样有着千千万万个孩子，他们都与这个孩子一样。你也可以把他们组织起来吗？”\n\n茨木华扇盯着八云紫，过了好一会，才低着头回话说：“不行。这里的战士们需要我，我不能抛弃他们。”\n\n“为什么不能两全齐美呢？华扇，你忘了我是怎么来到这里的吗？既然情报局和隙间能把我带到这里，他们也能把你，把更多的人员和武器带来，不是吗？情报局和抵抗战士们同样也需要你的领导。”\n\n茨木华扇抬起头，再次盯着八云紫：“真的吗？这样伟大的责任，就如此简单地落在了我身上？”\n\n“当然了。”八云紫笑着点点头。"
 LIB_lw.12.a:0 "华扇，你一直都是幻想乡的贤者。"
