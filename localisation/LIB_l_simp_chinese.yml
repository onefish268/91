 LIB_dwmy.4.a: "当然"
 LIB_dwmy.4.b: "我们的钱要花在更好的地方"
 
 LIB_flavor.1.t:0 "始动"
 LIB_flavor.1.d:0 "新人间之里城郊，一座不起眼的木屋里。八云蓝正气喘吁吁。她从办公桌下拿出一张符纸，熟练地用尖牙咬破手指，滴上血，画着图案，口中则念念有词。\n“紫大人，快收到我的消息啊！”蓝的额头上沁满汗珠，“您可不要在隙间里睡死了......”\n正在此时，她身旁的电话铃声突然响起。\n“怎么在这个时候来电话？”她望了望电话，又看着手中正在发光的符纸，思索片刻，还是将符纸放下，拿起电话。\n“八云邸。公务请接新人间之里行政办公室。”蓝熟练地说着。\n“哎呀，蓝。是我。意外吗？”电话那边传来熟悉的声音。\n“紫大人......这是？从隙间里打来的？”\n“我把电话线接到隙间里来了。你看，这是不是很方便？你以后联系我也不需要再用法术了......”\n“想不到您会用这种科技。诶不对，紫大人！玩笑话还请等会再说......”\n蓝的话音刚落，在她身后，空间中霎时裂开一道缝隙。蓝回头时，正好与刚刚走出缝隙的妖怪贤者对上视线。\n“事情严峻到连玩笑话都不愿意听我讲完？那看来有什么比那位御阿礼之子去世更严重的事情发生了。把简报给我看看吧。”\n“您还是一如既往地善变呢。”紫的话音刚落，蓝就从袖中掏出了一张满是打印字的纸张，双手递上。\n“这句话我就当夸奖了。”紫接过了纸张，阅读起来。\n蓝将手插进袖子，恭敬地立在一旁。她不禁开始盯着自己的主人的脸，试图在上面找到几丝波澜。可望来望去，紫的神情还是一直未变。\n“看来这确实值得你将我从隙间中唤醒。这次的危机比阿兰陀（注：荷兰）的郁金香事件还要可怕。新人间之里居然会有人挨饿，我都不记得上次幻想乡发生饥荒是什么时候了。”\n“您的意见是？”蓝盯着紫。\n“这次的危机看来需要我出山了。”紫轻巧地打了个哈欠，望着眼中已经开始闪烁光芒的蓝：“不要摆着那副得了救的表情。你还有很多事情要做呢！先从搜集受灾情况开始吧。”"
 LIB_flavor.1.a:0 "是的，紫大人。"
 
 LIB_flavor.2.t: "日常" 
 LIB_flavor.2.d: "“蓝大人，这太无聊了。”橙把鞋子扔到一旁，踮着脚蹲在椅子上，而整个上半身则趴在办公桌上。\n\n“说要我在这里接电话，可是这几个小时了，这电话都没响过。我担心离开了会漏掉电话，可在这里，我除了听这收音机，什么事也不能做呀！”\n\n“唉，这是最简单的活了。”八云蓝站在办公桌旁训斥着，“只用接几个电话，记一下内容而已。难道你想像我这样忙吗？当初你答应成为我的式神时是怎么承诺的？”\n\n“蓝大人……我确实说过，为了获得力量我会为蓝大人做任何事。但是……只是在这里打电话，接电话，写字，打印纸，撕纸……这真的能获得什么力量吗？”\n\n“做这些事，是紫大人的安排。难道你怀疑紫大人的安排吗？”\n\n说完这话，八云蓝望着仍然嘟着嘴的橙，内心突然有些过意不去，“什么时候紫大人醒来，我们一起去请她解释吧。” \n\n“蓝大人！有新的电报！急电！”办公室外，不知是谁叫喊着。八云蓝听到后，立刻冲了出去。等她回来时，办公室里却空空荡荡。\n\n“橙？你去哪里了？”八云蓝嗅探着橙的气息，蹲下来看办公桌下，可哪里都没有橙的踪迹。就这一会儿，这猫妖居然从眼皮子底下跑了？\n\n“橙，我承认你躲的好，快出来吧。”八云蓝在办公室里到处翻看，突然瞥到了墙脚的一盏台灯，又看了看桌上那几乎一模一样的“台灯”，心里全都明白了。\n\n“SpellCard，式神【橙】！”话音一落，那桌上的“台灯”立刻滚倒，连带着把收音机也撞下桌去。“橙！没事吧？”八云蓝上前，橙脸朝下摔在地上，而那收音机一摔，发出呜呜的怪声。\n\n就在这时，收音机里传来了一个冰冷的女声：“十分钟前，敬爱的执政官稗田阿求在家中去世。治丧委员会正……”\n\n“蓝大人……”橙从地上爬起来，“这是说，寺子屋的那位读书人……还是死了？" 
 LIB_flavor.2.a: "是的，她命运如此，正如我手上的电报所说。"
 
 LIB_flavor.3.t:0 "沙漠苦旅1"
 LIB_flavor.3.d:0 "帕萨已经与大部队离散了两天了。身上还有粮食，可水已经喝完了。夕阳西斜，茫茫沙漠连块岩石都没有，他感觉自己像是在原地打转了几个小时。帕萨的耳朵透出明显的血丝，热风吹来，风中的沙子刮得他耳朵生疼。\n\n“我是不是要死了......上次来的时候......绿洲应该在这一块啊......哎呀！”帕萨望着天上巨大的太阳呢喃着，脚下突然被什么东西绊倒。等他再度爬起身才看到，脚下的沙子里露出半只脚，居然是一具干尸！\n\n“哎呦我去！”帕萨坐在地上，拍了拍脸。“这不会是幻觉吧......不管了，得先看看你有些什么。”他把那尸体扒出来，在那尸体的腰间，居然挂着一个皮囊。帕萨挤了挤，那皮囊居然还是满的！\n\n神灵保佑啊！居然有水了。可他还没把皮囊拿起来，一只手就伸过来，抓住了他的手腕。帕萨抬起头，一记重拳就打到了他的面门。\n\n“啊！谁敢打我？”帕萨被打翻在地，他抽出一把磨到开刃的铁勺子，站起来。面前是个壮硕的犬兽人，她正用力地把那皮囊从死人怀里拽出来。\n\n“你这母狗！这是我先发现的！”帕萨举起勺子对着那犬兽人。\n\n“见面就叫人母狗，真没礼貌！小公狐狸，有命就来拿呀！”那犬兽人举着皮囊挑衅他。\n\n“来就来！”"
 LIB_flavor.3.a:0 "帕萨冲上去，用身体撞向那犬兽人。"

 LIB_flavor.4.t:0 "沙漠苦旅2"
 LIB_flavor.4.d:0 "“切，这么小个子还这么倔。”那犬兽人丢掉皮囊，举起双臂阻挡，和帕萨缠抱在一起。帕萨还没反应过来，就立刻挨了一膝顶。\n\n“唔......”帕萨只感到五脏六腑都要裂开了，但经验告诉他，敌人肯定要乘胜追击。他忍着痛迅速侧滚，一记重踏就砸在他身旁。\n\n“好机会！”趁对方攻击失手，帕萨立刻扬起勺子，那犬兽人哀嚎一声向后退去。他看见那犬兽人捂着脸，血从爪缝中流出。\n\n“啊！你居然伤了我的脸！姑奶奶要你的命！”那犬兽人狂叫地冲了上来，一把抱住帕萨的脖子。帕萨立刻用力把勺子刺向那犬兽人的腹部，可那犬兽人毫无反应，一肘打在他的左脸。帕萨的世界一阵闪烁，他摔倒在地，两颗牙伴着血从他嘴中吐出。接着，一记重踢又踢在他腹部，帕萨立刻眼前发黑，趴在了地上。\n\n“好，现在那皮囊......归我了。”那犬兽人腹部还插着勺子，血从伤口处缓缓流出。她捡起地上的皮囊，举过头顶，打开盖子。\n\n可倾斜而下的不是水，而是滚烫的沙子。\n\n“哈.....哈哈，我说这死人......怎么还抱着这么大一袋水......原来是用来骗自己啊！”"
 LIB_flavor.4.a:0 "当沙子流光时，那犬兽人也倒在了地上。"

 LIB_flavor.5.t:0 "沙漠苦旅3"
 LIB_flavor.5.d:0 "“我叫帕萨，是阿图格部落的。你呢？”帕萨躺在沙丘上，问道。\n“阿娜扎，本豪部落......”阿娜扎按着腹部的伤口回答着。\n“很抱歉......你这个伤口......”帕萨尴尬地盯着阿娜扎的腹部伤口，“要不你歇一会，我来帮你按一会。”\n\n“算了......看你这么瘦，你能按多久？”阿娜扎声音微弱。\n“话说，你也是从种植园过来的吗？”帕萨问。\n“是。”\n“你也是和大部队走散了吗？”\n“不然呢？”\n“唉......这条路真不好走。这比在种植园挨饿还难受......吃东西吗？”帕萨从干粮袋里拿出一点麦粒。\n“干的，不吃。”\n“也是。”帕萨躺下，看着天上的星空，“明天一早，等到太阳出来，我们两个就会死吧。”\n“是啊，跟你这家伙死在一块，真是无聊......”阿娜扎伸手去摸插在腹部的勺子，“或许你还能活下来。把我的血喝一些，你还能再走一段路，说不定......”\n“这怎么能行！”帕萨连忙转身，把阿娜扎放到勺子上的手拨开，“这不是杀人吗？你的鬼神会跟我一辈子的！”\n“这算我自杀......”\n“那也不行，这算你因我而死。我就算死在这，也不能这么做。”帕萨斩钉截铁，又犹豫起来，“再说，我丢了方向，就算再走一段，说不定也只是延长折磨.....”\n\n“哈哈......好吧。我的血要流干了......那就一起去那边的世界吧。我要睡一会。”\n\n“好吧，看来这就是终点了。”\n\n帕萨长出一口气，闭上了眼睛。可朦胧中，他似乎听到了一阵驼铃声。\n那大概是幻觉吧。这里怎么可能有人呢？但是，那驼铃怎么，越来越近了？\n帕萨眼睛睁开了一小条缝，他模糊地看到，真的有骆驼从他们面前走过。\n“秽身探知水雷的反应很强！你们四处看看！”\n“月球人的东西经常误报的，老大你确定吗？”\n“找到了！真的有人！两个伤员！状态很差！”"
 LIB_flavor.5.a:0 "“快点！你去拿水！还有你，把药品和后户徽章也带上！”"
 
 LIB_flavor.6.t:0 "小意外"
 LIB_flavor.6.d:0 "“这里的纸太多了，不要再往这里堆纸张了！”\n当一个小妖精搬着一沓纸张进入办公室，放在办公桌上时，八云紫终于按耐不住了。\n“真是抱歉！真是非常抱歉！贤者大人，我的职责就是往这里送纸。贤者大人请不要生气！”小妖精被吓得不停地鞠躬。\n“没有怪罪你的意思，但是......蓝平日的工作量这么大吗？唉，她去巡查城乡物流之前那么心神不宁，原来是不放心我来代管她的事务啊！”八云紫嘀咕着，转头面向那个小妖精：“把财务部长，人事部长和防卫部长叫到这里来。”\n\n“啊？我？”那小妖精张大嘴巴，“我就是一个送纸的，贤者大人”\n“呵呵，只会送纸，那就只能送纸。你要是能把他们叫过来，那你认为，你还会只是送纸吗？”\n“好吧，贤者大人，我试试。”那小妖精吞了口口水，跑出了办公室。\n\n过了一会，一个人类，一个灰狼天狗和一个凤蝶妖精一起走进了办公室。“抱歉，贤者大人。我们没料到您会让一个小职员来通知我们......”人类赔着笑，张口说。\n“那个小妖精以后就是我的传令员了。现在有重要的事情。”八云紫抄起桌上的两张纸：\n“财政部报告这周的财政收入和支出情况，还报告各个项目的执行情况。财政部为什么这么事无巨细？这些事不应该在财政部内部解决吗”\n\n“这......蓝大人在的时候，我们都是这么做的。”人类低着头回答。\n“还有这个，某某职员喜欢上班开小差，某某官员违规飙车，违纪就按照规章制度办就好了。你们是人事部，不是情报部，可别让别人把你们当成那个喜欢爆料的鸦天狗。”\n“额......蓝大人叫我们收集的。另外，我们确实按制度处理了他们。”灰狼天狗用袖子擦了擦汗。\n“好，还有这个。自卫队训练计划完成接近七成，少量人受伤......防卫部长现在遇到了什么困难吗？如果没有困难，报告这些是为了什么？”\n“爱塔妮缇不知道哦，蓝大人确实要求上报这些信息。”风蝶妖精一脸天真。\n“从今往后，上报那些你们解决不了的困难就可以了。”八云紫挥了挥手。\n\n“在下还是劝您不要这么命令为好。”人类鞠着躬，攥着手，“蓝大人回来了，看不到我们的报告，我们没法交代啊！”\n“这样啊，但贤者可不是超级计算机，像蓝这样行政，比巡视博丽大结界还累。”八云紫手指一划开，隙间凭空出现。\n\n“SpellCard，式神【八云蓝】！”八云紫一声令下，符文的光芒在空中出现。\n\n然而什么都没发生。\n\n“拒绝了？”八云紫皱眉，“你们先退下吧。”\n等到众部长都离开后，八云紫把手伸进隙间猛拽。隙间里传来一阵嘈杂的喊叫声。八云紫只感觉手感很怪，八云蓝似乎在抵抗，又像是卡在什么地方了。\n“蓝！你是不是遇到什么危险了？”八云紫又再努力用了用力，从隙间里拽出了一只狐狸耳朵。她再用力一拽，八云蓝从隙间中现身摔在地上。\n“蓝！出什么事了？为什么不回应召唤？”“紫大人......我没事，但是......”八云蓝挣扎着，从地上爬起来。\n“没事就好，回答一下你是怎么锻炼这些官员的，蓝。”\n“紫大人，请您先等一下......”\n“行政就像放牧，把羊赶到草场就行了，了解每只羊吃了多少草是牧羊犬的工作。你为什么要收集这么多的报告呢？”\n“紫大人，请您......”\n“像溺爱孩子一样对待这些部长可不行。时间长了，他们会变得毫无主见的。”\n“紫大人......”\n紫终于停下，眯着眼看了看蓝，似乎感到有些不对：“唉，什么事让你这么着急？蓝，现在给你机会，你要说什么？”\n“紫大人......我刚刚在开车！橙还在车上呢！”"
 LIB_flavor.6.a:0 "啊？"
 
 LIB_flavor.7.t:0 "落席"
 LIB_flavor.7.d:0 "“终于来了啊，大贤者！”\n\n当八云紫走进会议室时，摩多罗隐岐奈与稀神探女已经在等待她了。\n\n“秘神大人对这场会议这么积极，那想必我们的谈判会非常简单吧。”八云紫轻笑，“月都的朋友看来也很热情，两位居然比预定时间早到了二十分钟，这真是令人欣喜。”\n\n“我可不忙，我的事务大都是舞和里乃完成的，我来去自由。”摩多罗看向对面的探女，“倒是这位月都的大官，最近可是忙的团团转啊！大贤者应该知道围攻月民社区的骚乱吧？”\n\n稀神探女看了看摩多罗，又看了看紫，轻轻点了点头。\n\n“恕我直言了，如果这场会议只是讨论钱和垄断，还有那什么‘发展与投资委员会’的事务，那我认为，我们可以直接进到签字环节了。”摩多罗向椅背一靠，“但是这场会议并没有这么简单吧？”\n\n“不愧是秘神啊，我相信幻想乡的贤者之间是颇具默契的。”八云紫看了看探女，“只是这位月都的朋友，不知你是否有着与我们一致的默契呢？”\n\n“默契啊......你们知道，事态顺利发展的时候，我不会多说。”探女低着头，仍然托着下巴。\n\n“好吧，那我就要发难了。月民仅仅依靠着不到百分之五的人口数量，用股权间接控制了新人间之里近两成的资产......这看起来可并不太寻常。”\n\n“这听起来像是夸奖。过去，月之民只需要有限地分享一些科技，就能够做到这个程度......”探女抬起头，盯着八云紫。\n\n“简单地查询账目就可以发现，月民的资产收入全部用于在新人间之里的再投资，一分钱也没有外流。所有的企业资金流动，您是最后的主轴，探女大人。月都似乎在回避与普通的月民直接接触关系呀？”\n\n“月之都无需全盘透露自己的安排。”\n\n“恐怕没有这么简单。这位摩多罗秘神，可是掌握着生命力量的神明。”八云紫淡淡一笑，“换句话说，那就是彻底的‘污秽’。再放眼望去，新人间之里这块土地，与其说是由各族开拓民和兽人共同建设的家乡，不如说，是各式各样的‘被排斥者’的归属。开拓民们为了躲避竞争而来到这里，兽人们则是被世界抛下的弃儿，更无论那名号里就明确的后户‘被差别民’了。”\n\n“说我是‘污秽之神’可真是不礼貌啊！紫，你也是被排斥到这里的。”摩多罗侧靠着椅子，撑着脸颊。\n\n“是的，这些都是可以信手拈来的现实。新人间之里的生命比幻想乡的生命更需要着斗争，这片土地便因此凝聚了更多的污秽。”八云紫用折扇指向探女，“这样一来，月民被滞留在如此污秽的土地上，却看起来一点也不着急，这看起来并不像是‘事态顺利发展’呀？”\n\n探女看着眼前的八云紫，长叹一口气：“这是地面净化的一部分。多余的内容，我不会多说。”\n\n“并不是这样。”摩多罗打断，“让月民们号称‘净化地面’，却又在污秽的地面一事无成，这样一来，人们会怀疑，所谓的地面净化到底是不是地面的月民虚与委蛇的借口。月都的朋友，您应该知道月之都迁都事件的时候，地狱的生命力让月之都不少居民受到了严重的侵蚀。”\n\n“秘神大人，您或许有些急躁了。”紫的折扇打开，微微掩住笑容，“既然这些反常仍然是地面净化的一部分，至少我们能确认一件事，月都目前还需要地面的月之民，而我们确认，基于月民在新人间之里的影响，我们需要这位月都的朋友。”\n\n“就像幻想乡需要新人间之里那样？那真是有趣啊。紫，我需要提醒你，从这个角度讲，幻想乡在做和月都相同的事情，都在把‘沾上污秽’的人塞到这里。”摩多罗点点头。\n\n“您这样理解，我并不会干涉。”探女点点头，“贤者大人，感谢您的承诺。但我也提醒您，地上的月之民并不是被差别民，月之民有自己的骄傲。这份骄傲......不会被褫夺。”\n\n“那么，为了我们永远骄傲的月都朋友，也为了我们这沾染污秽的新人间之里，”紫招了招手。"
 LIB_flavor.7.a:0 "“蓝，把文件发给两位大人吧。”"
 LIB_flavor.7.a_tt:0 "§R自天探女口中说出时，命运就已经开始发生逆转，或者说正因命运注定发生逆转，天探女才愿说出。§!"
 
 
 LIB_flavor.8.t:0 "于梦境中的月球基地"
 LIB_flavor.8.d:0 "“那么，贤者阁下，”哆来咪漫步在月球表面上，而八云紫跟在她的身后。\n\n“希望您满意月球观测站的建设情况。稀神探女大人为了争取月之都的同意和建材支援付出了很多。”\n\n“不错。我原先以为，月球观测站距离地球这么远，还受到月相的影响，效果并不会太好。”八云紫轻笑着，“现在一看，月之都可真是慷慨啊。”\n\n“如果这些气象数据能够帮助贤者阁下的话，那么我的工作也就有价值了。”哆来咪转过身来，指向远方，“前面就是第四槐安通道了。”\n\n“这就是那能够通过梦境来往月球和地面的通道吗？这还是第一次见到呢，真是壮观啊。”八云紫抬起头，眼前的空中浮现出一道奇异的通道：红色与蓝色的光线于空中环绕，围出了一眼望不到边界的方框通道。一团团深红色的光线在通道内穿梭，不知是灵是鬼。\n\n“贤者说笑了，您通过境界之力，通过水中之月到达月球的奇迹才是最壮观的。不过，既然贤者阁下想要亲身体验第四槐安通道的奇妙，那么在下就于此驻足了。”哆来咪顿了顿，“作为例行公事，在下需要提醒您，既然妖怪也会做梦，那么您也有可能会在通道里看到一些古怪的情景。”\n\n“这是指，一些藏在我的梦境深处的诡异情景会浮现在我的面前吗？”\n\n“是的，”哆来咪点点头，“但不只是。第四槐安通道是共用的梦境通道，总的来说，被越多的人共享的梦境，就越有可能在通道内被具现。如果您向前踏入了通道，请您做好准备。但这些具现的梦境总归是没有实体的无害物......阁下应该不会轻易......”\n\n“嘿！汉斯，我没看错吧？那里有人啊！”正在这时，一个粗犷的男声插入了对话。八云紫循声望去，在月面的远方，一小队穿着黑色制服的士兵踏着齐步走来，领头的高大士兵举着一面鲜艳的红色旗帜。而那名士兵身旁，一名军官挺胸抬头，神气赳赳。\n\n“人类吗？”八云紫微微惊讶。她抬头看了看那红色的旗帜，“原来是这样啊......”\n\n“两位姑娘......我这是在做梦吗？居然能在新施瓦本第二基地附近见到人！”领头的军官一路跑了过来。八云紫看着这位军官跑到她的面前，拍打着脸颊，又深呼吸了数次，才继续开口：“真的，你们是人类吗？能到这里来的，一定不是一般人类吧......”\n\n“啊......当然不是。”八云紫微微一笑。\n\n“是吗？果然......我就认为人类不会来到这里，尤其是一个东方装束的姑娘......”那军官低着头，“那么......你们是来自地球的吗？”\n\n八云紫看了看那军官碧蓝的眼睛，微微地点了点头。\n\n只此一刹那，小队里就爆发出一阵欢呼。那军官回头大声吆喝，小队这才慢慢安静下来。\n\n“那么，姑娘，你知道......”那军官低着头，有些犹豫。但最后，他还是深吸了一口气，“我们的元首......现在怎么样了？”\n\n“你们的元首？”八云紫将折扇打开，轻轻掩盖住笑容，“你们的元首，已经死了很久了哦......”\n\n“啊！？”小队里顿时又爆发出一阵惊呼和议论，军官难掩自己的惊讶，“不可能！元首昨天才和我们通话过！”\n\n“唉，就算以如今的科技，地面与月球通信也很困难吧，你们的那位元首，到底是怎么跟你们通信的？”\n\n“这你别管，德意志的科技天下第一，区区宇宙通信而已......”\n\n“在月球上设立基地，看起来更加不可能呢！这也能用科技领先来解释吗？”八云紫举起折扇，指向那个军官：“不如说，在没有空气的月球还能正常活动和发声，你们是人类吗？”\n\n“你懂什么？”那军官气急败坏，从腰间抽出鲁格手枪，指向了八云紫：“雅利安人本来就是外星的优等民族，别说在月球建立基地，就连......”\n\n还没等军官说完，八云紫轻轻挥动折扇，那军官和士兵们立刻化为了一团光芒。这光芒一开始还聚在一起，但很快又如星点般，在月面四散开来。\n\n“说的什么胡话？这就是那个被很多人共享的梦境吗？”望着逐渐开始暗淡的星点，八云紫用右手托着下巴。\n\n“如果它出现在这里，那么......应该是吧。”哆来咪站在八云紫身旁，点了点头。\n\n“唉，我想，我知道为什么灵梦说，第四槐安通道的体验并不太好了，看来我也差点深陷其中了啊。”八云紫转过身来，她轻轻捏着折扇，指向了哆来咪，“那么，你会不会也不是真实的？你到底确实是那个哆来咪，还是只是我幻想的？”\n\n“贤者阁下，您应该有答案了吧。之所以通道的入口会出现具现的梦境，是因为，这里根本不是通道的入......口......”八云紫轻轻挥动折扇，哆来咪的声音立刻变得粗犷低沉起来。很快，哆来咪周身开始变得刺眼，变成了一大团光芒。光芒越来越大，越来越亮，逐渐开始吞没她周身的月面，扩展开来。最终，光芒充满了八云紫身边的每一个角落，将八云紫也整个包裹了进去。八云紫轻轻闭上双眼，再度睁开时，眼前的世界已经变成了熟悉的一片黑暗。在黑暗中，红色与蓝色的光线于空中环绕，将八云紫围在了一眼望不到边界的方框通道之中。\n\n“看样子，或许我要继续沿着通道走下去了。”八云紫向着通道的一侧望去，红蓝光线围绕出的通道一路延伸，而在通道的末端，那硕大的蓝色星球明亮而闪烁。“下次还是利用隙间好了。”"
 LIB_flavor.8.a:0 "不过，人们为什么会共享这么奇怪的梦境呀？"
 LIB_flavor.8.b:0 "这种奇怪的信仰，还是不要被神隐到幻想乡为好。"
 
 LIB_flavor.9.t:0 "回响"
 LIB_flavor.9.d:0 "“明白了，紫大人。企业救济和抑制人道灾难的任务，我会很快按照您的要求去办。”桌对面的八云蓝捏着文件，微微点头。\n“很好。蓝，救济的具体细节，你自己敲定吧。”办公桌后的八云紫转动旋转椅，望向窗外。新人间之里灼热的阳光穿过玻璃照在她的额头上，泛起了点点汗星。她不由得从腰间掏出了折扇扇风，“今年的夏天似乎来得更早些。要是目前的经济危机继续下去，盛夏会让很多人很难熬吧。”\n“不如说，新人间之里向来如此炙热。紫大人，要不我来替您来扇风？”望着背向自己的八云紫，八云蓝不由得向前微微倾身。\n“哎呀，蓝，这份好意我就心领了，你还是考虑一下如何完成任务吧。”八云紫用右手托住脸颊，“这令人疲乏的午后啊......在我午睡之前，有什么就说什么吧。”\n“嗯，紫大人。还有些比较棘手的事件，希望您能够指导。”八云蓝翻动着手上的纸张，“大结界对面的白骨大王最近好像正在扩大军队，他们吞并了几个小邦，幻想乡当局正在抗议。我们该采取什么态度？”\n“那和我们有什么关系？”八云紫打断，“我们观望着，闭口不言就行。”\n“好的，紫大人。下一条，经济危机爆发后，红魔馆宣布不再服从博丽巫女的秩序，雾之湖的妖精好像在和她们争夺红魔馆周边的控制权......”\n“那也是幻想乡的事情吧......”八云紫打断。\n“确实......摩多罗大人抗议任命爱塔妮缇小姐为防卫部长的决定，她说让一个妖精担此大任实在不妥。”\n“唉，我听说摩多罗把那个凤蝶妖精当作那个强大的常夜神了，秘神和一个妖精过不去，真是奇怪啊。”八云紫摆摆手，“不过，新人间之里恐怕没有比爱塔妮缇更有经验又一心尽责的人选了，你回复就说，如果她不满意，就提名一个能力更强的人选。”\n“嗯，这确实是个好主意。下一个，沙漠里似乎崛起了一支叫‘兽人共斗同盟’的组织。他们主张用暴力手段给兽人们带去平等权利。需要盯紧吗？”\n“这个组织还没有明确的领导核心，也缺乏能够维持长期行动的干部。现在担心他们还不如担心月民们闹事。”八云紫挥了挥手，“只有这些内容吗？”\n“额......紫大人，您怎么对这个组织了解得这么多......还有一件事。”八云蓝有些犹豫，“是橙的事，并不算什么大事。但......我觉得有必要说。”\n“不妨说。”八云紫打了个哈欠，“说不定比刚才的事情有意思。”\n“您曾经说过，案牍的修行也能提升能力。这段时间，我确实学到了不少知识，也见识了许多人的生活。可我想把这些经验教给橙时，她却总提不起兴趣……我在想，她是不是并不适合行政这条路......”\n八云蓝话音落下，八云紫却完全没有动作。\n“嗯......紫大人？”\n“你还记得橙学习奇门遁甲的时候吗？”八云紫突然开口。\n“奇门遁甲啊，那是很久之前的事情了。”八云蓝沉思着，“那次，橙好像学得很主动，很有兴致。我当时还感到奇怪，奇门遁甲明明并不是什么寻常技艺。”\n“我记得可清楚了。”八云紫微笑着，又转到面向八云蓝，“那次，橙在迷途之家被欺负了。你去为她打抱不平，却挨了那博丽巫女的打。”\n“是的，我记得您后来为我出头，也被退治了。”八云蓝点头。\n“蓝，记那么清楚干什么？”八云紫故作嗔怪，“不过，事后一想，橙这孩子，或许就是被那好胜心所驱动，才会老老实实地跟你学奇门遁甲吧。”\n“这样啊......”八云蓝点了点头。\n“我想，橙离开迷途之家，跟随我们来到新人间之里，也有一段时间了。”八云紫说完，又举起折扇开始扇风，把椅子转到背对八云蓝：“你觉得这小猫，会不会有些寂寞，想要交更多的朋友呢？”\n“交朋友？”八云蓝抬头，“可交朋友，与行政修行又有什么关系？紫大人，我不太明白。”\n“哎呀，”八云紫微笑着，“博丽的巫女，雾雨的魔法使，吸血鬼的忠仆，冥界的管理人，月球的大官，还有那位摩多罗神，都是我的朋友，你觉得呢？”"
 LIB_flavor.9.a:0 "让橙交更多的朋友，未来有更多余地，这确实正是力量的增强。"
 LIB_flavor.9.b:0 "但这话从喜欢强加麻烦于他人的紫大人口中说出，意味就有些怪了"
 
 LIB_flavor.10.t:0 "静夜"
 LIB_flavor.10.d:0 "深夜，新人间之里的海，或者说三途河边。\n“噗哈！迎着凉爽的海风喝酒，真是快乐啊！特别是本地兽人特制的......这带着高粱味的酒真是巧妙。”八云紫顺手饮尽手中瓶里的啤酒，“蓝，你也陪我喝点嘛。”\n“紫大人，我还是喝茶好了，这里的薄荷甜茶很对我的胃口。”八云蓝走在八云紫的身旁，手里还捧着一个小巧的瓷茶盅，“等会我回去还有公务要办。”\n“公务吗？哎呀，牧羊的工作就交给牧羊犬好了。”八云紫微微一笑，“我可是给你制造了不少趁手的工具。”\n“是啊，托紫大人的福，现在我的工作确实比几年前要少了不少。”八云蓝点点头，“不过，还有很多事需要我来小修小补。兽人的生活状况，新人间之里的经济运转，周围安全和地下结社问题......您应该理解这些琐事有多么麻烦。”\n“是啊，这听起来就像是我之前在幻想乡的工作呢。不过在到这里之后，我过去的工作都交给别人了。”\n“连大结界的维护工作也交出去了吗？”\n“啊......偶尔还是会去巡视一下的啦。”八云紫笑笑，“不过本乡能正常运转，实在是令我骄傲啊。”\n“令您骄傲？”\n“就像亲手栽下的树长大那样喜悦呢。冥界不是有棵著名的樱花树，据说它的种植者死去了四百年，它还在生长吗？”\n“是指那棵著名的西行妖吗？”\n“正是。有时我也会思考，如果种下那棵树时，就能知道它会在自己消失无踪之后还能长存，会是什么感觉？”八云紫说完，微微低头，手托着下巴，随后侧身说：“蓝，你说，假如我现在消失了，你会怎么办？”\n八云蓝一怔，随后也低下了头：“紫大人消失吗？我有点难以想象那种境况。或许我会尽全力处理您消失的余波吧。”\n“好正经的回答！蓝，你难道没想过取代我，成为幻想乡的贤者吗？”\n“取代您吗？”八云蓝抬头，“您的权能和智慧非常强大，恐怕我做不到。”\n“那可不一定。”八云紫用折扇拍了拍手，“我不也犯过一时鲁莽，害的橙受伤的错误吗？就算是贤者，也会犯错，也要吸取教训。智慧就像是错误堆叠成的意大利千层酥呢！”\n“即使如此，我也需要时间来追赶您呀！”\n“或许，在新人间之里的居民眼中，你已经是做着小修小补工作的贤者了。既然你能够在危机中使人们远离饥馑赤贫之苦，他们或许会相信你能够带领他们走出下一个危机。”八云紫望向远方漆黑的海平面。此时，在水平线上，泛起了微微光芒。\n“是吗？我想，要获得与您等同的威望与人脉，要‘小修小补’很久吧。”顺着八云紫的指向，八云蓝向远方开始泛白的天际望去。\n“没想到太阳都要出来了。是时候休息一下了，这次可要把之前欠缺的觉都补上。”八云紫微微打了个哈欠，“蓝，新人间之里就又交给你了。”\n“您又要去履行‘隙间的默观’了吗？”八云蓝问道。\n可是八云紫没有回应。当八云蓝转头望去时，八云紫已经不见人影，只有一个空空的玻璃酒瓶竖立在地上。\n“或许，我也应该稍稍休息一下，为了更好地为新人间之里服务。”八云蓝捡起地上的玻璃瓶，喃喃道。"
 LIB_flavor.10.a:0 "“也为了锻炼那些新官僚们。”"
 LIB_flavor.10.a_tt:0 "日落，日出，新人间之里的日常会就这么继续下去，大概吧。"
 
 LIB_flavor.11.t:0 "新人间之里石脑油厂"
 LIB_flavor.11.d:0 "“好久不见啊。看着气派吗，蓝？”\n“这是新人间之里的第一座炼油厂，怎么能不气派呢？还是多感谢你的帮忙啊，饕餮尤魔。不过，真想不到，畜生界的一方恶霸，会愿意为贤者们服务。”\n“你不如好好感谢摩多罗大人。刚欲同盟可是收了不少好处，才愿意在新人间之里附近制造井喷的。噗噗......能修在油井上的石油化工厂可不多见呢。”\n“如果只是如此，那也不见怪。可是全套的化工生产工艺，这样的知识，你居然会愿意去掌握，这和你的气质实在不和啊。”\n“嘻嘻，这个时代，若不是有些学问，连作恶都做不好。不过，我为新人间之里服务，单纯是因为摩多罗大人的好处而已。反倒是你，蓝......或者说八云蓝，你究竟是为了什么才离开畜生界，去为幻想乡的支配者服务呢？”\n“紫大人吗？......畜生的意识形态就是不断制造混乱，我厌恶这种思想，所以离开了畜生界。但如果要问我，为什么会为紫大人服务的话......或许是因为我向往着秩序的生活吧。”\n“噗噗，喜欢秩序这种无聊的东西，你和那位贤者真是一丘之貉。正所谓物以类聚......”\n“不要把狐狸和貉这种动物并列。”\n“啊，对不起，习惯了。”\n“那么，可以让我也问你一个问题吗？”\n“知无不言。”\n“行。我想知道，你会为了什么样的好处，才去为摩多罗大人服务呢？”\n“噗！......蓝,谜底写在谜面上。刚欲同盟是控制混乱的那一方，摩多罗大人许诺给我们的还能是什么呢？当然是制造更大混乱的机会了。”\n“更大混乱的机会吗？什么样的混乱呢？我想那个魔导国的白骨大王，应该能入得了你的眼吧？他已经制造了足够多的混乱。”\n“嘻嘻，那个名为什么安兹乌尔恭的亡灵只不过是推动混乱的工具罢了，刚欲同盟的计划要远比推动一个魔王上位要更复杂。”\n“你的意思是，你的计划比白骨大王还要可怕吗？这其中的秘密恐怕不适合泄露给我。”\n“早在之前，我们就已经和摩多罗大人达成了约定。我们让渡部分幻想乡的石油管理权，取而代之，摩多罗大人会给予我们更多作乱的机会。我们的计划可是有贤者背书的阳谋。蓝，人类称呼石油为‘工业的血液’，你知道为什么吗？”\n“那当然是因为，它是驱动工业的关键材料吧。”\n“哈哈！蓝，你看上去的感觉，好像一个人类。畜生的回答理应比这个更大胆，更加狂妄才对。”\n“什么意思？”\n“石油是工业的血液？不不不，它其实就是血液。当人们死去后，身体中的血液沉到地狱的血池里，就会慢慢地变成石油。新人间之里的地下累积了浓厚的血污，这才能开采出优质的重油出来呢。”\n“有意思。如果你把社会比作一个人，那么，石油确实就是驱动工业这个器官的血液。但新人间之里的油品不过是海相沉积的结果，你只是在牵强附会罢了。”\n“有逻辑，合理，这就是人类，或者是策士妖狐的回答，但不是畜生的。当地下的血液化作石油喷发而出时，必定渴求世人的鲜血来填充以维持平衡了。在摩多罗大人指导下，我们这些渴求鲜血的地狱生灵，会在那些愿意付出鲜血的地方喷出石油，如此一来，混乱就会接踵而至了。”\n“为了‘工业的血液’，人必须要付出自己的血液，是这个意思吗？”\n“查科，欧加登，内志，加拉加斯......记住这些地方吧，你可以于未来，在这些地方瞥见我们计划的一角。”"
 LIB_flavor.11.a:0 "人们当然可以享用地下的血液，但必须以自己的血液来交换。"
 
 LIB_flavor.12.t:0 "焚月之夜"
 LIB_flavor.12.d:0 "“回来啦？！”檀律把手中的书放在书桌上，望向宿舍门口。炉幔踢着门槛，正骂骂咧咧地走进来。\n“月人和高级月兔都被动员起来了，门口现在封得死死的。看来情况挺不妙的。”炉幔一把摔上门，跳到了自己的床铺上。\n“都说了不要随便外出了，探女大人的话不会害人的......”\n“切......”炉幔漫不经心地把脚上的靴子踢到地上，月人就是喜欢使唤吓唬我们月兔。说什么出社区就会沾染污秽，我都进进出出好几次了，还没有被发现呢。”\n“真的吗？”檀律走到炉幔的跟前，“但是以后不要再随便出去了，要是沾染了污秽，会被月之都开除的！”\n“我一点也不怕，听到开除我还高兴呢。要是被开除了，我就找铃瑚去。早点离开这个无聊的地方。”炉幔从床底拿出一盒玉米团子，躺在床上大嚼起来，“檀律，要不要吃？”\n“这个是......”接过团子，闻了闻，檀律的耳朵立刻竖直起来，“好香啊！”\n“香吗？”炉幔看着檀律把团子吃了下去，开始坏笑起来，“这可是铃瑚的团子。”\n听到这句话，檀律立刻停下了咀嚼。打量了炉幔一会，她拿起地上装团子的盒子盖就打过去。\n“诶，别打了别打了......”炉幔拿枕头护住脑袋。\n“那可是叛徒的东西，你居然敢拿给我吃！”檀律完全没有停手。\n“哎呀，哎呀，骗你的，别打了。这只是本地的团子而已，原料都跟我们做团子用的原料一样......我哪有能力跑到幻想乡去弄到铃瑚的团子......”\n“这还差不多。”檀律鼓着腮帮子，抱着胸。她转过身去，又狠蹬了一脚炉幔的床板。\n“我们都在地上留了多久了，污秽多多少少会沾染些，别那么在意。”炉幔把团子收回床下，“那你说，要是铃瑚拿我们做团子的材料给你做团子，你吃还是不吃？”\n檀律坐回到书桌旁，完全没有回头。\n“傻瓜......嘻嘻。”炉幔把腮帮子里的团子返回来，又嚼了嚼，咽下去。正当她躺在床上打算闭眼时，门又被推开了。炉幔一看来者，立刻从床上弹起来。\n“队长......”炉幔望过去，队长坤定浑身是汗，把军服挂在墙上。“炉幔，你是不是又干了什么坏事了？刚才高级月兔告诉我，我们这里有未授权的月兔通信。是不是你干的？”\n“队长，没有啊......”\n“不承认是吧？那我们来讨论一下上个上弦夜你晚归的事情。”\n“好吧，队长，是我干的。我和清兰聊了一下铃瑚的事情。”炉幔低着头，“别和他们说啊！”\n“这段时间就消停下吧。你也知道现在外面不安全，有好几个月民社区都被暴徒袭击了。未授权的月兔通信这件事，平时是可以轻轻放下的。你可别现在出头。”\n“知道了，队长。”\n“那把你前几天买的团子让我尝尝。”\n“啊？队长，你知道啊，好的。”炉幔蹲下身，手望床底探过去。\n就在这时，宿舍外传来一阵嘈杂的声音。坤定立刻站起身来，耳朵微微转动着，“檀律，炉幔，你们两个过来一下。我好像听到了什么。”\n等三只月兔走出宿舍时，黑夜中，几个着了火的东西从社区高大的围墙另一边飞来，摔在内侧的房屋上，瞬间发出清脆的破裂声，随后就爆出了一大团火焰。\n“有人扔燃烧瓶！那群暴徒袭击我们社区来了！”坤定大喊起来，“檀律，炉幔，你们赶紧去军械库那边，我去通知其他的月兔。”\n“好，队长！”檀律和炉幔立刻转身，向军械库奔去。可还没跑出去几步，就听到一声清脆的破裂声。坤定大叫一声，随后便惨烈地喊叫起来。回头一看，坤定正在挣扎着，幽蓝与明黄的火焰缠绕着她，而她的周围地上满是黑乎乎的东西，不知是血还是燃料。\n“队长！”檀律立刻冲上去，把自己的军服脱了下来裹住坤定，抱着她在地上翻滚起来。\n“让一让，我给队长降降温。”檀律还没反应过来，炉幔提着一个大铁桶，把凉水劈头盖脸浇了上来。\n“干什么？这是油火啊”\n“火都被你滚灭了，你还是赶紧看看队长的情况吧。”\n“队长？你还好吗？”檀律不管湿漉漉的身体，伸手去抓坤定的耳朵，“还有脉搏，太好了。”\n“好什么好，赶紧送医务室啊！没看到队长脸都烧黑了？”炉幔急得直跺脚。\n“可是队长吩咐的任务怎么办啊？还有好多月兔没从宿舍里出来呢。”"
 LIB_flavor.12.a:0 "救人要紧啊！你先赶紧把队长送去医务室，剩下的我来！"
 
 LIB_flavor.13.t:0 "食月之夜"
 LIB_flavor.13.d:0 "“炉幔炉幔，你听说了吗？”\n“啊？什么事情？”炉幔躺在床上，刚一睁眼，檀律就在一旁摇晃着她。\n“月民交换日呀！探女大人说试点情况可以，我们这里今晚就要推广呢！”\n“交换日？干什么的？”炉幔缓慢地爬起，靠在枕头上。\n“说是为了暂时和地面人交好，和地面人交换物资的活动。”\n“那和我有什么关系？”炉幔又一次躺下，翻了个身。“和地面人交换物资，这种事情我干的多了。”\n“所以说要你帮忙呀！我听说了，探女大人特地鼓励我们把自己做的东西拿出来交换。你说，什么口味的团子才受地面人欢迎呢？”\n“团子？别团子了。地面人都知道，月兔不是捣药就是做点心。月兔一届一届做过多少次点心了，口味改过没啦？没有！都要看那些月人的意思。他们享受不完，最后不都是强迫我们吃下去吗？本来我觉得，我们做的团子和月饼很可口的，可是那些月人来来回回就是这些个口味。让我们把团子当饭吃，吃到腻，这简直是酷刑啊！”\n炉幔索性坐了起来：“说到底，你能做芥末口味的团子吗？能做辣味的团子吗？我们这没有这样的材料，知道吧？没有材料，怎么做出能满足地面人的团子呢？”\n“那，炉幔，今天晚上，你能帮我一起摆摊位吗？”\n“让队长去帮你。”炉幔闭上了眼睛。\n“不行，队长她被选进保安队了，说是要保证交换日安全进行......”\n“行吧行吧，可怜她纱布都没摘完就要听使唤。”炉幔长叹一口气，“小队成员要互帮互助，我去帮你好了。”\n......\n“我真帮不了你了。”炉幔坐在摆满团子的桌子后，望着来往的地面人和正在推荐自己货物的月兔们，百无聊赖地撑着脑袋，“檀律，我说过了，地面人不可能为了团子看上你的摊位的。他们早就吃过更好的东西了。”\n“真的吗？书上可是说地面人有着各式各样的口味，怎么会没有喜欢我的团子的人呢？”\n“那书上也说了，你的优势区间在哪里，不可替代性在哪里......”炉幔打了个哈欠，“无聊，这里太冷清了。我先回去了，你想留在这里就随便吧。”\n“但是......至少一个团子能够交换出去吧......”炉幔起身离开，檀律也想起身，可思考一番，还是坐了下来，“再等会吧。”\n过了一会，一个穿得厚厚实实的人从人群中走了过来。这人戴着宽檐的大帽子，又戴着口罩和墨镜，还裹着厚厚的大衣，看不出是男是女，也看不出种族。\n他走到了檀律的摊位前：“月兔小姐，你这是打算交换团子吗？”\n“是的，先生。”檀律望着这个奇怪的人，脸上立刻堆满甜甜的笑容，点着头。\n“我是一个美食家，我已经品鉴过这世间的美味了。月兔的食物，一定有我未曾尝试过的吧。可以让我尝一个团子吗？”那人发出厚重沙哑的声音\n“当然可以，先生。”\n那人抓起一个桌上的一个团子串，摘下一个小团子，掀开口罩，把团子塞进口中：“非常的美味啊，可是与我吃过的美味团子还是有所差距。”他从大衣下拿出一个纸盒子，放在檀律的面前。\n“这是我认为最美味的玉米团子。要是你能给我从未尝过的味道，我就用这盒玉米团子来交换。”\n“从未尝过的味道吗？”檀律从桌底拿出一个木盒子放在桌面上，打开一看，是一盒月饼。\n“月饼吗？搞什么，月兔不是做团子就是做月饼吗？就没有真正鲜活的东西吗？”\n“不不不，先生，这是特制的。您尝尝就知道了。”\n“嗯......好辣啊！这是什么啊？芥末？”\n“哪里哪里，这是异硫氰酸烯丙酯哦！先生。这是我从催泪弹里弄出来的，说起来就是提纯芥末呢！”\n“开什么玩笑......”那人丢下啃了一口的月饼，又捡起另一个：“这么甜？甜到我嘴巴要化了！”\n“这是阿斯巴甜结晶当糖霜做成的月饼呢。先生您一定没试过吧。”\n“我真想退出了。那这个......好苦啊......”\n“药用月饼，加了奎宁，吃了不怕疟疾哦！先生，这些是您从来没尝过的味道吧？您还要尝吗......”\n“是是是，小兔子，我愿赌服输。月饼归我，团子归你了。”那人捡起没吃完的月饼，匆忙收进檀律的木盒，留下装团子的纸盒，小跑离开了。\n......\n“炉幔炉幔，我的东西交换出去了！”\n“是吗......是团子吗？”\n“不是，是我做的怪味月饼！有个自称美食家的人过来尝了尝，他看起来还挺满意呢......诶，炉幔，你怎么蜷在床上？不舒服吗？”\n“是的，吃了太辣太甜太苦的东西，胃有点不舒服。”\n“是什么东西那么刺激？”\n“月饼。”"
 LIB_flavor.13.a:0 "啊，月饼？我的月饼不是被那个美食家拿走了吗？你什么时候吃到的？"
 
 LIB_flavor.14.t:0 "星夜沙丘"
 LIB_flavor.14.d:0 "“到了到了！今天晚上我们就在这里过夜了。”健壮的男犬兽人从卡车副驾驶座跳下车，拍了拍铁皮车身。随着卡车后挡放下，兽人们逐个从车斗里跳下来。寒风吹过，众人不禁裹紧了身上的衣服。\n帕萨走在最后面，他背着一个巨大的背囊，小心翼翼地翻下卡车。星夜下，不远处有一个灯火稀疏的小镇，那应该就是多数人会过夜的地方了。\n但是帕萨不会，他掂量了一下荷包里的硬币。这些钱可是父母和自己好不容易省下来，供自己去城里扎根的，可不能浪费在这里。但是如果不去睡那封闭安静的旅店，就只能和以往一样，睡在帐篷里了。\n“哟，年轻人啊，你不去住店吗？”看见帕萨向与人群相反的地方走，那个健壮的犬兽人对帕萨喊道。\n“不去了，我想省点钱。”帕萨回头应和\n“嗯......但是注意安全啊！这个地方离绿洲很近了，你小心晚上有蜥蜴和蛇！”\n“谢谢了，大伯！我之前跟着父母跑过不少次商，会搭帐篷！”\n“明天早上别忘了搭车。我们就睡在车上，天亮后不久就要接着往北走了......”\n“好！”帕萨回应着，而那个犬兽人的声音被风吹散，再也听不见了。\n“就这里了。”帕萨望过去，这是一座小丘。而小丘上还有两个小土包，就像两个驼峰。而他把背囊放在两峰之间的小谷地上，就地用兽皮毡子和木架搭起了一个斜顶，这就是他今晚睡觉的地方了。\n忙活了一阵，帕萨又在附近捡了些干草，堆在一起点了火。做完这一切，帕萨裹着一条毛毡，躺在自己简陋的帐篷里。\n“趁火灭之前睡着吧，今晚过去，很快就要到妖精绿洲了。听说在那里可以住在城里，工钱也多。父母年纪也大了，自己之前从种植园逃回来，让他们又心疼又发愁。这回可要让他们安心。”\n“唉，不过这样一来，自己又是孤身一人了。”帕萨这样想着，眯着眼准备进入梦乡。可他翻个身，耳朵一贴地面，就听到地面传来沙粒被踩实的闷响。那声音很厚重，不像是小动物行走的声音，倒像是个大东西......\n不会是什么大个野兽吧！\n帕萨立刻从帐篷里滚出来，他一抬头，就看到了一个熟悉的面孔，正是脚步声的主人。\n“阿娜扎？”\n“认不认识我，小公狐狸？你上次还拿个勺子捅伤过我。”\n“我这是出了幻觉吗？怎么会在这里见到你？”帕萨拍了拍自己的脸。\n“你猜猜谁给你们开的车？”\n“啊？！”帕萨一时间脑袋空空，“一个女孩子家，开长途卡车？不是，白天时候那个戴着墨镜，穿着厚夹克，看得像飞行员一样的人是你啊！”\n“是啊！上次回家之后，我求了我爸好久，他才愿意教我开卡车呢。他就是坐在副驾驶那个。”阿娜扎利落地坐在火堆旁，“出发的时候我就瞥见你了，可惜现在才确认是你。”\n“那个人是你的父亲啊......他允许你一个人出来吗？”\n“当然不允许了。我是趁他睡下之后从车上偷跑出来的。”阿娜扎伸手向腰间摸索着，“前几天我也想来你的帐篷里看看，可是白天太累了，我一躺下，睡得比我爸还熟。”\n“虽然你这么壮实，但开长途卡车，还是不容易啊。”\n“为了生活嘛，你不也一样，要跑到离家这么远的地方来做工？”阿娜扎从腰间摸出一个白色软包，拍了拍，一支香烟从软包一端滑出。阿娜扎夹着香烟，抬头看着帕萨，微微一笑。"
 LIB_flavor.14.a:0 "介意我抽一根提神烟吗？"
 
 LIB_flavor.15.t:0 "薄荷甜茶"
 LIB_flavor.15.d:0 "“咳......咳咳。”\n“你怎么了，阿娜扎？呛到了吗？”\n“咳咳......呛到是常有的事情。”阿娜扎的眼泪和鼻涕一起流了出来，“毕竟我抽烟也没抽过多少。”\n“那还抽？”\n“为了提神嘛。谁能一边睡觉一边开车呢？咳咳！”阿娜扎俯下身子，猛地咳嗽。每当她咳一声，一旁的干草火堆就闪烁一下。\n“我这里有些好东西。”帕萨伸手摸向自己的帐篷，掏出一个小木头盒子。\n“茶叶，据说是很远的东方出产的，不过也不是很贵。”帕萨打开盒子，里面是晒干到发酥的茶叶，看上去一碰就会碎。帕萨捻了一点塞到嘴里嚼了起来，“试试？”\n“茶叶是这样用的吗？不是用来泡水的吗？”\n“你看这里哪有水啊，水用来喝就不错了，还用来泡茶？多奢侈！”帕萨嚼了两口，把茶叶又吐了出来，顺手把茶叶盒子递过去，“我不需要提神，你想要的话就拿走吧。”\n“卡车上备着很多水呢。说不定我能拿一些过来煮茶喝。”\n“啊？这种事情怎么不早说？”\n“那是老爹打算等你们口渴时敲诈你们用的，现在拿来泡茶正好。”阿娜扎立刻起身，消失在星夜之下。过了一会，她拿着一个铁罐子跑了回来。帕萨能听到那罐子里晃荡的水声。\n“来吧，直接把这铁罐子架起来烧，把你的茶叶放进去。”\n“这不是罐头盒吗？水就这么点啊，等到时候茶煮好了，水也烧干了。”帕萨皱着眉。\n“你看这里哪里还有水啊，偷多了老爹会发现的，你煮不煮吧。”\n“那行吧。给你尝尝我们部落传统的薄荷甜茶。”帕萨抓了一把茶叶扔进铁罐，又找来几个石头，把铁罐子架起来烧。\n“这能行吗？我看你干草都快烧完了。别到时候火灭了都开不了锅。”阿娜扎在一旁盯着火堆，嘟囔着。\n“煮这么一小杯应该还是够的，正好水也不多。”帕萨专心拿着一根树枝拨着火，“要是像以前的商队那样，我们现在还能去拣点粪来烧。但你这卡车哪里有粪啊。”\n“倒是有汽油，但肯定不能用来煮茶。明天卡车还要跑呢。”\n“来，闻闻，闻到香气了吗？”\n“唔.....”阿娜扎顺着上升的水汽猛吸了一口，“很香啊，现在能喝了吗？”\n“急什么？现在水才刚刚开始滚呢，我要放薄荷和糖了。”帕萨向帐篷里摸去，摸出一个小布包，捻了一小撮里面的干叶放进铁罐子。\n“薄荷啊！”阿娜扎趴在铁罐上猛嗅，尾巴一同在猛摇。\n“薄荷甜茶，能没有薄荷吗？还有糖呢，诶？”帕萨伸进帐篷里的手停了。\n“干什么？别耽搁了，水已经不滚了。”\n“哎呀，糖没剩多少了。我看明天就到目的地了，我把糖当晚饭吃了。这下只能请你喝薄荷茶了。”\n“无所谓，赶紧把茶端上来吧！”\n帕萨站起来，轻轻用脚把铁罐蹭开，踩灭了火堆。他蹲下摸了摸铁罐，“差不多了，现在还有些烫，喝的时候慢点”\n话音还没落，阿娜扎就捧起铁罐猛饮了一口，又立刻大叫起来：“好烫！”\n“谁叫你那么着急？”帕萨笑笑，“好喝吗？”\n“真香。要不你明天也给我泡一杯吧！”阿娜扎又猛喝一口，耳朵一同颤动着。\n“明天？明天我就到妖精绿洲去做工了。”帕萨低头皱眉，“到时候你的卡车也要返程吧。”\n“没关系，我早晚会开车到你做工的地方来的。”说完，阿娜扎又一头扎进铁罐子，发出尖锐的吸溜声。"
 LIB_flavor.15.a:0 "停停停，阿娜扎，给我留点！"


 LIB_flavor.16.t:0 "在冥界"
 LIB_flavor.16.d:0 "“上次见到这么艳丽的花朵，是什么时候呢？”\n“紫，听到你说这样的话，真是意外啊！你应该看惯了这种异变才对。”\n“怎么能看惯呢？如果真的看惯了，那就不是妖怪，而是神明了吧。幽幽子，这种场景，你看过的比我多。你或许已经司空见惯了吧。”\n“因为我是亡灵吗？”\n“因为你是冥界的管理人。”\n“这样啊......但这次是不一样的。”\n“像这样亡灵大量涌入冥界，让所有季节花卉同时绽放的异变，是每六十年一次的常态。我从没听说过你有谈起，哪一次是不一样的。”\n“紫，你可以试试，去摘一朵花，戴在头上。”\n“是吗......好吧，我或许能明白你的意思了。”\n“下不去手吗？”\n“那些亡灵不少是因我而死的，一想起这个，我确实有些下不去手。”\n“那就让那些活人把花摘下来，给你编成花环，戴在头上如何？”\n“那我更不会接受。”\n“那你就无法成为神明了。”\n“那我还是不要成为神明为好。我依然需要为还活着的人负责。”\n“可是我已经死了呀！你需要为我负责吗？”\n“白玉楼这么冷清的地方，白骨大军从来没有踏足过，我听说他们在战时让白玉楼始终保持自治，一直维持到战败。”\n“可是我让妖梦去往了新人间之里呀！”\n“好吧好吧，真是难为你，在战争期间独自一人停留在这里了。我为你在战时的牺牲负责。”\n“耶！贤者还是要向我低头吧？”\n“本来也如此，我过来，还希望你能帮个忙。”\n“没关系，有什么要求就提吧。”\n“从月球带回来的酒，还在你那里吧，我有用处。你方便给我吗？”"
 LIB_flavor.16.a:0 "当然可以，贤者大人，为了还活着的人，你就拿去用吧。"


 
