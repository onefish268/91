l_simp_chinese:
#事件注释
  ZYX.3.t: "一则消息"
  ZYX.3.desc: "我们收到了一个有趣的消息，被称为圣幻后花园的非洲竟然出现了一个法西斯主义国家。作为世界法西斯运动的老大哥，或许我们应该和这个极权小兄弟打个招呼。"
  ZYX.3.a: "看来非洲将成为我们撬动世界的一个支点。"
  ZYX.4.t: "事发突然"
  ZYX.4.desc: "今天我们伟大的领袖突然收到了一封电报，电报里的信息表明这是来自德意志的元首莉莎的一封信，信中莉莎以老大哥的名义对我们摆脱了“铁手”的束缚实现独立的现状表示祝贺，并期待我们能拥有更伟大的成就。"
  ZYX.4.a: "哼，这是当然的！"
  ZYX.4.b: "想从我这里捞好处？没门！"
  ZYX.6.t: "来自欧洲的一条消息"
  ZYX.6.desc: "曾在内战中帮助我们的德国在一个星期前已经发起了复兴之战，尽管我们的朋友勇气可嘉，但领袖开始为她的老朋友担忧。"
  ZYX.6.a: "有什么事能让她老人家担心的？"
  ZYX.9.t: "争执"
  ZYX.9.desc: "领袖闲来无事，在往来电报中附注了自己对于法西斯党如何夺取全国政权的见解，出乎意料的是，在德国的元首莉莎居然拍了一封电报来驳斥领袖的理论。莉莎指出以政党为组织基础才能凝聚所有同志的力量，而不是“和肮脏的犹太资本家一起共享劳动成果”，领袖则反驳莉莎“完全忽略了现实因素”，认为元首偷换了概念，她所指的资本家并不是犹太人，而且资本家对于奋斗事业的贡献是肯定的，“你不能饿着肚子讨论理想，除非你乐意睡桥洞”。莉莎则对此嗤之以鼻。但双方谁也不能辩倒对方，于是两人决定："
  ZYX.9.a: "每过40天，和那个愚蠢的矮个子谈谈话。"
  ZYX.9.b: "每过40天，和那个狡猾的猴子谈谈话。"
  ZYX.10.t: "核心理念之争"
  ZYX.10.desc: "终于到了这个时候了，领袖迫不及待的和远在奥地利的元首通上了信。在长达2个小时的争论后，鉴于双方谁也奈何不了谁，两人决定换个方向。领袖认为法西斯主义的核心理念是“阶级调和”，法西斯党要做的就是充当工人阶级和资产阶级之间的润滑剂，最终实现大同社会；莉莎则认为法西斯主义的核心理念是“祖国第一”，一切阶级矛盾都要为祖国的利益让步，只有国家实现复兴，才有资格提及个人矛盾。"
  ZYX.10.a: "这家伙又偷换概念。"
  ZYX.10.b: "哼，我要开除她的右藉！"
  ZYX.11.t: "两个duce？"
  ZYX.11.desc: "今天，元首没有再和领袖辩论，而是提出了一个困扰了她许久的问题。\n\n“你和意大利的安丘比是什么关系？”\n领袖张了张嘴，一句话也没有说出来。半响，她屏退了所有人，和莉莎通起了电话。"
  ZYX.11.a: "其实我是个穿越者。"
  ZYX.11.b: "“穿越者”？这家伙在胡说八道什么呢。"
  ZYX.12.t: "炫耀"
  ZYX.12.desc: "“看见新闻了吗？”\n\n“？”\n\n看着莉莎的来信，安丘比菲疑惑着回了电报。为了防止私密事情被他人看见，安丘比菲专门为此学习了怎么拍电报，莉莎也是如此。\n\n“新闻头条啊，我不是让人在给你的物资里捎上了一份报纸吗？”\n\n“还有这回事，我去问问。”\n\n安丘比菲离开了卧室，去找齐亚诺了。而莉莎则还在拍电报中滔滔不绝的讲述自己的多瑙河工业奇迹。"
  ZYX.12.a: "“报纸？我以为是给士兵看的，就发下去了。”"
  ZYX.12.b: "“这家伙怎么不回消息？”"
  ZYX.13.t: "丘选"
  ZYX.13.desc: "“我写了一本书。”\n\n莉莎看着信纸，思考了一会，\n\n“写了什么？小说？”\n\n“当然不是！”\n\n安丘比菲回道，\n\n“是本duce对于法西斯主义建设的一些见解，名字我都取好了，就叫‘安丘比菲选集’。”“就你？”\n\n莉莎嗤笑道，\n\n“只是对我写的‘我的奋斗’的拙劣模仿罢了。”"
  ZYX.13.a: "“我的奋斗”是啥书？（皱眉）"
  ZYX.13.b: "来人，把那本书带过来让我“品鉴”一下。"
  ZYX.14.t: "莉莎的裙子"
  ZYX.14.desc: "安丘比菲收到一个来自维也纳的包裹，拆开一看，居然是一条做工精良的黑色连衣裙，附着一张字条：\n\n'听说你那边的裁缝手艺不怎么样，这条送你。别总穿那身灰扑扑的猎装了，像个下乡收租的管事婆。'\n\nduce拎起裙子在自己身上比了比，发现尺寸居然分毫不差，脸一下子涨得通红——莉莎那家伙，什么时候偷偷量过她的身段？她抓起电报机的输入键就想回骂，指尖悬在按键上却迟迟没按下去，最后只是盯着那条裙子看了半天，低声骂了句'多管闲事'，然后把裙子工工整整地叠好，放进了衣柜最上层。\n\n隔天开会时，她的副官注意到领袖的猎装领口比平时多别了一枚银质蔷薇胸针——那玩意儿从前可从未出现过。"
  ZYX.14.a: "……真烦人。"
  ZYX.14.b: "莉莎盯着电报机等了半天，什么也没等到。"
  ZYX.15.t: "领袖的英姿"
  ZYX.15.desc: "为了向维也纳那位展示自己在一心会的绝对权威，领袖特意命人拍了一张自己在卢旺达市政厅广场演讲时的照片——她站在临时搭起的讲台上，右臂高抬，指尖直指天际，背景是一面迎风招展的一心会黑旗，光线恰好从侧面打来，在脸上勾出刚毅的轮廓。\n\n她精挑细选了一张最满意的洗出来，在背面签上'致莉莎——敬我们的友谊与共同理想'，又端详了半天，觉得这句太正式，划掉重写了'看看什么叫真正的领袖风范'，然后寄了出去。一个星期后，维也纳的回信到了，安丘比菲拆开信封，满怀期待地展开信纸，却发现整封信只有一句话——她把信纸翻来覆去看了三遍，确认没有更多内容后，脸一点点沉了下去。"
  ZYX.15.a: "“帽子带歪了。”"
  ZYX.15.b: "“帽子带歪了。”"
  ZYX.16.t: "论极端"
  ZYX.16.desc: "午后的卢旺达闷热难耐，安丘比菲盘腿坐在办公室的藤椅上，手里捏着电报。\n\n莉莎在信中罕见地长篇大论，谈起了她对“极端思想”的界定——她认为法西斯主义的伟大正在于它的“绝对性”，不妥协、不调和、不向任何旧秩序低头，唯有如此才能砸碎腐朽的世界。\n\n领袖看完信，把电报往桌上一扔，笑了一下，开始回信。她在信里写道：\n\n“你说的极端，是在维也纳办公室里喝着红酒构想出来的极端。我这里没有那么多哲学可谈，极端就是饥饿的人民在街头游荡，就是每一发子弹都必须命中目标，就是如果我今晚不解决粮食问题，明天一早城里就会挂满尸体。”"
  ZYX.16.a: "理论一定要贴合现实。"
  ZYX.16.b: "我尊重她的想法，但我并不认同。"
  ZYX.17.t: "冷落"
  ZYX.17.desc: "维也纳总理府的办公桌上，一封来自卢旺达的电报已经搁了整整四天。莉莎每天从堆积如山的文件里抬头时都会看见它，然后对自己说'等会儿回'——然后复兴战线的军需调配、国社来的党务报告、多瑙河工业区的产能统计便又淹了上来。等第四天傍晚她终于摊开信纸时，才发现安丘比菲已经连着发了十多张电报。\n\n莉莎愣了一下，赶紧回了一封长信解释缘由，措辞诚恳，语气温和，甚至主动称赞了安丘比菲上次演讲的“气势”。三天后回信到了，只有一句话：'哦。'又过两天，第二封回信到了，更短：'忙着，勿念。'莉莎对着这两个字看了半天，后颈一阵发凉——\n\n完蛋了。"
  ZYX.17.a: "已阅。"
  ZYX.17.b: "这咋办呀......"
  ZYX.18.t: "交个朋友？"
  ZYX.18.desc: "安丘比菲领袖最近失眠了。自从阿道夫从维也纳寄来了她与副元首的合照后，领袖就彻夜难眠。那头靓丽的白发，红色的点缀，姣好的容颜，以及那高冷的表情，无一不戳中了安丘比菲的颜值观。她开始频繁向莉莎询问“女神”的相关情况，而莉莎则敏锐的洞察到了这一点，并刻意避开了这些话题。"
  ZYX.18.a: "亚平宁小伙多情种"
  ZYX.18.b: "日耳曼小伙爱吃醋"
  ZYX.19.t: "看电影"
  ZYX.19.desc: "维也纳UFA电影制片厂新上映了一部战争大片《西线的旗帜》，莉莎兴奋地给安丘比菲拍了电报：\n\n“这电影你一定要看。”\n\n安丘比菲回电：\n\n“卢旺达没有电影院。”\n\n莉莎闻言，立即让宣传部的人复制了一份胶片，用外交邮袋经南非转寄到卢旺达，又专门协调了卢旺达市政厅里那台闲置的放映机。\n\n一个星期六的晚上，维也纳总理府的小型放映厅里，莉莎坐在第一排中央，面前是幕布；八千公里外的卢旺达市政厅会议室里，安丘比菲盘腿坐在一把嘎吱作响的木椅上，面前是一面临时挂起的白床单。两台电话听筒被搁在各自的扶手边，线路接通的那一刻，莉莎听见了那头传来的电流杂音和一声含混的“开始吧”。\n\n幕布亮起，德军士兵在屏幕上冲锋陷阵，两个女声隔着八千公里的电话线，同时安静了下来。电影放到男主角在战壕里对战友发表慷慨激昂的演说时，领袖忽然对着听筒说了句：\n\n“这家伙说话太慢了，战场上啰嗦这么多早就被狙击手爆头了。”\n\n莉莎愣了一秒，反驳道：\n\n“这叫戏剧张力！”\n\n安丘比菲嗤了一声：\n\n“张力？我看是拖时长省胶片。”\n\n电影放到后半段主角阵亡的悲情场景时，电话那边传来了细微的吸鼻子声，安丘比菲沉默了，什么也没说。"
  ZYX.19.a: "她也是个性情中人。"
  ZYX.19.b: "伟大的日耳曼军人......（抹眼泪）"
  ZYX.20.t: "元首的微操"
  ZYX.20.desc: "前线战事胶着。褐衫军'警卫旗队'师在穆塔雷郊外与津巴布韦尔社会主义共和国的民兵武装陷入拉锯，三天内阵地反复易手五次。\n\n安丘比菲在指挥部里对着地图头疼时，一封来自维也纳的电报到了：“我已仔细研究过你发来的战报。现有部署存在严重漏洞，西侧机枪阵地的射界至少偏差了五米。我不才，愿亲自指挥'警卫旗队'，保证三天内突破敌军左翼。”安丘比菲盯着电报看了半天，犹豫片刻后还是把指挥权拍了过去——毕竟维也纳那边确实物资充足，得罪不起。\n\n三天后，前线传来最新战报：'警卫旗队'师的前沿阵地全线后撤，右侧防线丢了两道战壕，整体退却了约四十米。维也纳那边随即发来一连串电报，总长达三百字，细致分析每一道战术指令的'精妙之处'。\n\n领袖耐着性子看完前一百字，把电报往桌上一摔，对着听筒喊了一句：“你他妈到底在打谁的仗？！”"
  ZYX.20.a: "再信她的话我就是狗！"
  ZYX.20.b: "没道理呀......（思索）"
  ZYX.21.t: "差距"
  ZYX.21.desc: "维也纳的阅兵刚结束，莉莎就迫不及待地把阅兵式的纪录片胶片装进了外交邮袋。半个月后，安丘比菲在卢旺达的破旧会议室里，对着那台老掉牙的放映机，看完了整整四十分钟的德意志装甲部队列队通过维也纳街头的画面——三号坦克锃亮的车体在阳光下反射出冷冽的金属光泽，履带碾过柏油路面发出整齐的轰鸣，队列一眼望不到头。放映机咔嗒一声停止，幕布归于空白。\n\n当天夜里，她给莉莎发了一封电报，只有三个字：'拍挺好。'莉莎的回复来得飞快，洋洋洒洒的几百字，从三号坦克的装甲厚度讲到发动机的散热设计，末了还加了一句：“要不要送你几辆？回头我让人把操作手册寄过去。”\n\n安丘比菲盯着最后那行字看了半天，提笔回电："
  ZYX.21.a: "“开不起。油钱都够发一个月的军饷了。”"
  ZYX.21.b: "“开不起。油钱都够发一个月的军饷了。”"
  ZYX.22.t: "种族歧视"
  ZYX.22.desc: "维也纳下发了一份关于‘种族卫生与日耳曼民族复兴’的纲领性文件，莉莎签字后照例抄送了一份给卢旺达，附言：‘建议认真研读，这对建立稳固的国家基础至关重要。’半个月后，领袖的回信到了——\n\n“我的卫队长是恩德贝莱人，我的厨娘是绍纳人，我前线最能打的连队长是混血。你寄来的那些理论，需要我把他们调离岗位吗？”\n\n莉莎的回复来得很快：\n“民族的优劣不以个体论，而在于整体。你的卫队长再忠诚，也改变不了他的民族注定无法缔造高级文明的事实。你是在用人情取代科学。”\n\n安丘比菲这次隔了一整天才回电：\n\n“我的卫队长杀过三个一心会的叛徒，我的厨娘在一场暗杀里替我挡过一刀，我的连队长领着三百个‘劣等’士兵守住了穆塔雷西翼，而你的‘高级民族’理论，除了让我的人心寒，至今没给我带来任何好处。你管这叫科学？我管这叫挑事。”"
  ZYX.22.a: "这家伙啥也不懂。"
  ZYX.22.b: "这家伙啥也不懂。"
  ZYX.23.t: "湿透的元首"
  ZYX.23.desc: "维也纳的雨来得毫无征兆。莉莎在德意志青年大厅发表完关于‘青年与民族复兴’的长篇演说后，走出大门才发现天空已经拧成了一片铅灰色，雨帘密密匝匝地浇下来，台阶下的广场积水映着路灯的昏光。\n\n她的副官撑着一把伞站在台阶下——撑开了，但伞面只罩住了副官自己的头顶。莉莎愣了一秒，雨已经兜头浇了下来，精心打理的发型瞬间塌成湿漉漉的几缕贴在额前，深灰色的制服外套从肩头到后背迅速洇成一片深色。她站在雨中盯着副官看了整整三秒钟，副官才后知后觉地‘啊’了一声，试图把伞挪过来，但为时已晚。当晚她湿淋淋地回到下榻的宾馆，连衣服都没换就抓起电话打到卢旺达。领袖接起电话时听见那头传来一声被压抑的喷嚏，然后是一连串语速极快的抱怨：\n\n“……毫无日耳曼民族特有的严谨性！全无！伞只撑自己头顶？这叫什么副官？白长了一副日耳曼面孔！”\n\n安丘比菲听完，沉默了两秒，然后笑出了声。"
  ZYX.23.a: "“你在台上讲了两个钟头的‘日耳曼人的纪律性’——怎么就没给自己留一条备用的干毛巾？”"
  ZYX.23.b: "“元首，这把新伞是？”“非洲援军。”"
  ZYX.24.t: "谈及魔导国"
  ZYX.24.desc: "总理府的地图上，奥地利西部边界被一道醒目的红色标记线框住——那是安兹·乌尔·恭的魔导国疆域。\n\n莉莎几乎每天都会站在那幅地图前，盯着那个从柏林废墟上生长出来的骸骨帝国，指节攥得发白。这次她给安丘比菲的电报措辞罕见地激烈：\n\n“窃据德意志土地的跳梁小丑，一个依靠亡灵浪潮和恐惧统治的怪物。我们必须尽早把它碾碎，趁它的根基还未深入土壤。”\n\n领袖的回电来得迟缓。她写道：\n\n“我知道你恨它。我也恨我这边那些趁乱割据的废物。但你想想——能把柏林夷为平地、能把整个德意志民族阵线打得七零八落、能让莫莫这样的反抗军领袖低头投降，这能是'小丑'干得出来的事？异族能在旧德国站稳脚跟，手里没两把刷子是不可能的。我建议你，把仇恨先放一放，把情报铺开、补给线算清、各邦残余势力摸透，再谈'碾碎'不迟。”"
  ZYX.24.a: "没有调查就没有发言权。"
  ZYX.24.b: "我的耐心是有限的。"
  ZYX.25.t: "下象棋"
  ZYX.25.desc: "安丘比菲百无聊赖地翻着旧货箱，找到一盘不知哪个中国劳工留下的象棋，棋子是木头雕的，红黑两色，漆面已经磨得斑驳。她玩了两天，觉得有意思，便给莉莎寄了一套新的过去，附言写着：\n\n“听说你爱指挥战线，来试试这个。没有坦克没有火炮，纯粹靠脑子。敢吗？”\n\n莉莎收到包裹后拆开看了一眼，把棋盘搁在茶几上，回电只有两个字：“没空。”安丘比菲立刻补了一句：“哦，怕输？”三天后，维也纳的副官来电：“元首问，规则在哪。”领袖对着听筒笑了一声，开始口述规则让副官记录转传。于是两人通过电报代传棋步的方式，开始在八千公里的距离上对弈。\n\n第一局，莉莎在第十步就丢了一车，第二十步被将死。那边传回的棋步电报从最初的每分钟一封渐渐变成每十分钟一封，最后彻底沉默。半小时后副官来电：“元首说这盘不算，她还不熟规则。”安丘比菲提笔回电：“行，新棋手让三，开局让你三步。重来。”第二局，莉莎坚持了二十四步。第三局，二十八步。安丘比菲趴在桌子上打哈欠的时间越来越长，莉莎的电报却越来越频繁，到后来几乎是每三步就附一句“等等，我再想想”。副官在两头的电话线路里被夹得两头跑，嗓子都哑了。\n\n希尔当天傍晚巡查回来时，发现不知谁在棋盘旁边放了一罐喝了一半的德国啤酒，罐身印着‘慕尼黑酿造’。她拎起罐子看了看，冲门外喊了一声：“谁放这儿的？”没人应，但她也没扔掉，就那么搁在棋盘边上，过了好一会才被勤务兵收拾走。"
  ZYX.25.a: "虐你如呼吸。"
  ZYX.25.b: "奇耻大辱......"
  ZYX.26.t: "游泳健将"
  ZYX.26.desc: "卢旺达的暑气蒸得人发昏。\n\n安丘比菲在某天下午突然扔下文件，带着两个卫兵驱车直奔维多利亚湖。她在湖边脱了靴子，把外套搭在岸边的灌木丛上，一头扎进了泛着细碎白光的湖水。两个卫兵在岸上站了一个多小时，看着领袖在水里扑腾着从西岸游向东岸的轮廓，又从东岸折返回来，中途停了三回，仰面躺在水面上喘气。傍晚回到卢旺达时她浑身湿透，头发上挂着水草，进门第一件事就是抓起电话给莉莎拍了一封电报：\n\n“今日横渡维多利亚湖，西岸到东岸，又折返回来。全程两个半小时，中途没有上岸。水冷，但有毅力。”\n\n四个小时后，维也纳的回电到了，只有一句话：\n\n“维多利亚湖东西宽度约八十公里。你游了两个半小时，时速超过三十公里——比卡车还快。安丘比菲同志，你看我像傻瓜吗？”"
  ZYX.26.a: "我去，不早说。"
  ZYX.26.b: "轻松绷住。"
  ZYX.27.t: "一个梦"
  ZYX.27.desc: "凌晨三点十七分，总理府的卧室里，莉莎猛地睁开眼睛，后背的睡衣被冷汗浸透，紧紧贴着脊椎。她盯着天花板，呼吸急促而浅，梦里的混凝土墙壁还在眼前晃动——那间潮湿的、没有窗户的地堡，桌上的手枪，以及镜子里自己那双忽然变得陌生的眼睛。\n\n她翻身抓起床头柜上的电话听筒，手指颤抖着拨了一长串号码。第一次，第二次，第三次，直到第n次——她数不清是第四次还是第六次了——听筒那头终于传来一阵含混的声响，然后是安丘比菲困得变调的声音：\n\n“……喂？你知道现在几点吗……”\n\n莉莎没有寒暄，劈头盖脸地开始讲述那个梦：地堡的走廊、渗水的天花板、蜷缩在隔壁房间看不清面容的副官、桌面上那把枪的金属光泽……她越说越快，嗓音里带着白天不会出现的、不设防的微颤。领袖在那头“嗯”了几声，“哦”了几次，明显处在半梦半醒的边界。最后一段描述还没讲完，电话那头忽然传来一声极轻的鼾声，然后是听筒滑落到枕头边的闷响——领袖睡着了。\n\n莉莎攥着听筒愣住，沉默了好几秒，对着那片空荡荡的信号杂音低声说了句：\n\n“……你还真睡得着。”"
  ZYX.27.a: "阿道夫……你又胡思乱想了。"
  ZYX.27.b: "不，不会这样的。"
  ZYX.28.t: "副元首的非洲之行"
  ZYX.28.desc: "欧洲来的专机降落在卢旺达郊外那条勉强平整的土跑道上时，卷起的红土尘埃遮蔽了半边天空。\n\n副元首希尔走下舷梯，一身深灰色的制服笔挺如铁，皮靴踏在非洲土地上的每一步都带着刻意彰显的庄重。安丘比菲站在接机队伍最前面，穿着那件洗得发白的猎装，领口别着银质蔷薇胸针，身后只跟了副官和两名卫兵。寒暄过后，希尔被领进市政厅的会客室，一杯凉茶还没端上来，她已打开了随身携带的文件包。安丘比菲靠在椅背上，双手交叉搭在腹部，听希尔用德语夹杂着生硬的英语讲了半个钟头，关于犹太人在国际金融体系中的渗透、关于布尔什维克主义背后的犹太阴谋、关于罗德西亚若想建立起稳固的法西斯政权就必须先'清理门户'。最后希尔俯身向前，指关节叩着桌面，压低声音说：\n\n“领袖同志，如果不及时清理掉那些犹太猪，革命果实就会被这些该死的畜生夺走。这是维也纳的定论，也是历史给出的教训。”\n\n领袖听完，沉默了一会儿，然后伸手把凉茶端起来喝了一口，放下。"
  ZYX.28.a: "这离我们很遥远吧。"
  ZYX.28.b: "我希望她明白这个道理。"
  ZYX.29.t: "倒挂金钩"
  ZYX.29.desc: "安丘比菲从床上猛地坐起来，浑身发抖，额前的碎发被冷汗黏在皮肤上，喉咙里堵着一团说不清的东西。\n\n她刚才梦见自己被一根绳索倒吊在某个广场的铁架上，脚踝勒得生疼，视野倒转，地面在头顶，天空在脚下，四周挤满了模糊不清的面孔，指指点点，窃窃私语，有人朝她身上丢东西——菜叶、碎纸、说不出名字的软烂物什。她伸手摸索着电话听筒，指节发白，拨号的手指抖了两次才按准最后一位数字。\n\n维也纳那边响了两声就接了，仿佛那边的人根本没睡。莉莎的声音从听筒里传来，平而清醒，像站在冰面上说话：“做梦了？”领袖的声音是哑的，带着鼻音和一丝她自己都没察觉到的哽咽，断断续续地讲述那个倒悬的广场、那些面孔、那种头朝下看见世界颠倒的荒谬恐怖。她说到一半，声音开始发抖——不是那种假装的、带刺的抖，是真正被吓到了的那种。电话那头沉默了两三秒，然后莉莎说：\n\n“你梦见自己倒挂着？被谁挂的？看清脸了吗？挂在哪儿？广场的旗杆还是路灯？”\n\n安丘比菲愣住了，张着嘴，鼻头还挂着一点没擦干净的湿痕。"
  ZYX.29.a: "你……不问问我怎么样？"
  ZYX.29.b: "我得严肃研究这个梦。"
  ZYX.30.t: "宣传的学问"
  ZYX.30.desc: "莉莎在听完了戈培尔两个钟头的汇报后，若有所思地拨通了卢旺达的专线。她跟领袖讲了一刻钟关于宣传的必要性——\n\n“人民需要看得见的领袖”、“形象本身就是权力”、“你不塑造自己，就会被敌人塑造”。\n\n安丘比菲在电话那头难得的没有抬杠，耐心听完了全部内容，最后说：\n\n“有道理。宣传确实得抓起来。”\n\n挂断电话后，她把齐亚诺叫进办公室，简明扼要地交代了一项任务——挑选一群体格端正的年轻人组建一支领袖卫队，配备统一的制服和仪仗装备，在卢旺达的主要街道上定时列队行进，同时制作一批印刷品，在城墙和路灯杆上张贴。齐亚诺拿着笔记本快速记录，点头应下。安丘比菲在最后补了一句：\n\n“哦，对了，印刷品上的标语——加一句'领袖万岁'，字号大一点。剩下的你们自己看着办。”"
  ZYX.30.a: "小齐，你好年轻哦。"
  ZYX.30.b: "希望她听进去了。"
  ZYX.31.t: "老大带领德国访问团参观兽耳娘的生活"
  ZYX.31.desc: "很久以来，大部分欧洲人们对于非洲这片“黑暗大陆”的想象仅仅停留在那些冒险小说的仆从、战士、巫师，或是报纸与官方报告中的那一个个抽象的东西，而现在，老大带着德国的访问团们近距离地走进了这些原住民的村落，让这些人得以看见一幅她们从来没有见过的非洲：这些兽耳娘勤勤恳恳地劳作着，在一望无际的田野上，她们俯下身子，将种子安置入土里，在高耸入云的工厂里，她们埋头苦干，让机器全负荷地工作着，她们的身影似乎与千里之外的欧洲工人们重叠了，都在自己的岗位上保持发光发热。"
  ZYX.31.a: "“这就是祖国劳动的英雄！”"
  ZYX.31.b: "“我曾经对非洲这片遥远的大陆一无所知，直到我亲眼见证了她无限的活力。”"
  ZYX.32.t: "带领德国访问团检阅黑小将"
  ZYX.32.desc: "在索尔兹伯里广场上，平日人来人往的广场被军队提前疏散了人群，在入场之前，和德国代表团便在广场的入口接受了法西斯青年团的敬礼，她们站在M形的巨大站台上，维持着最为标准的姿势，当老大共同登上了高高的观礼台时，早已等候多时的青年团和少年团排成了气势恢宏的方阵走过观礼台，整齐划一的姿势、血气方刚的神情给与会者们都留下了深刻的影响，最后，在团员们的一声声“领袖万岁！”下，今天的阅兵仪式最后落下了帷幕。"
  ZYX.32.a: "“这些都是祖国未来的英雄！”"
  ZYX.32.b: "“这些斗志昂扬的士兵给我们留下了深刻的印象。”"
  ZYX.33.t: "向莉莎邮寄索尔兹伯里的照片"
  ZYX.33.desc: "很久以前，早有耳闻莉莎建设一个崭新德国的想法，具体怎么建设、该展现出什么样的风格缺一直没有定数，于是，老大定让人将罗德西亚美丽的首都——索尔兹伯里拍给她参考。索尔兹伯里虽然坐落于非洲，但是那些宽阔的林荫道、各式各样的欧式风情街和整齐的花园洋房，这便是索尔兹伯里——欧洲文明在非洲土地上生长出的奇特城市，它的街景完全不输欧洲的那些文化古城。老大希望们的都市能够给莉莎提供一些战后的建设灵感，让她自豪的索尔兹伯里也能在其他地区展现它的魅力。"
  ZYX.33.a: "“让我们最为骄傲的城市去打动一下莉莎！”"
  ZYX.33.b: "“这是非洲的城市？不知道还以为哪个欧洲的古城呢。”"
  ZYX.34.t: "和莉莎讨论未来的世界格局"
  ZYX.34.desc: "在一天晚上，和莉莎就“未来的世界格局”这一问题展开了激烈的讨论，她们一致认为，1936年的那场大萧条，是世界大变局的催化剂，战争很快就会到来，届时，两国改变命运的风口也将到来。具体到她们本国的未来策略布局时，因为双方早已达到敞开心扉的程度，她们详细地向对方描述了她们会怎么生产、训练军队、决定蛰伏到什么时候、然后在什么时候介入或是掀起一场改变世界的大漩涡，最后让各自的民族成就一段震撼全世界的传奇。两人到最后的情绪都异常地激动，那一封封电报刚刚打印完便被老大莎迫不及待地取下，然后阅读，再兴冲冲地让电报员把自己内心珍贵的想法传到千里之外的朋友那里。"
  ZYX.34.a: "“这真是个美妙的夜晚！”"
  ZYX.34.b: "“我们共同度过了一个欢乐的时光！”"
  ZYX.35.t: "和莉莎谈论外星人的事情"
  ZYX.35.desc: "在1934年时，一场突如其来的外星人入侵迫使莉莎连同她的纳粹党离开了德意志祖国，转而只能偏安奥地利，每每想到这件往事，便会让莉莎感到满腔怒火和深深的不甘，她们还有很多的壮志雄心与计划未能实施便被邪恶的外星人打断，她们的德意志祖国还没能迎来复兴便被其他异族再次蹂躏在脚下。仔细阅读了莉莎发来的这些电报，并在回信中深刻表达了她对德意志遭受如此磨难的同情和自己坚定支持在德意志的决心。“我对你的祖国遭受的屈辱深感同情，我代表罗德西亚支持你们为德意志民族的自由和幸福的正义之战，并在未来的合作中，竭尽所能地帮助你们。”"
  ZYX.35.a: "“我们要为盟友讨个公道！”"
  ZYX.35.b: "“罗德西亚是我们可靠的朋友！”"
  ZYX.36.t: "领袖向莉莎赠送各种非洲的奇珍异兽"
  ZYX.36.desc: "非洲拥有与欧洲差别极大的地理环境，因而这片土地上诞生了各种欧洲很少见的奇葩物种，像是长颈鹿、河马、猎豹，还有从中非地区流窜出来的奇幻物种——敲击兽、叶羊等等，特别是其中的一对敲击兽伴侣，被罗德西亚方面通过举行隆重的仪式赠予了德意志国，安丘比菲向莉莎表示：“我们向德意志国赠送的是象征力量与友谊的神兽——敲击兽，愿这对威武的敲击兽能够在德意志国的土地上始终矗立着，作为两国坚不可摧关系的生动写照，并保持强大之姿，威慑那些图谋不轨的不速之客。”"
  ZYX.36.a: "“我们赠送的礼物十分合适！”"
  ZYX.36.b: "“这样的礼物太有分量了！”"
  ZYX.37.t: "领袖向莉莎吹嘘自己统一经历"
  ZYX.37.desc: "在一次电报交流里，安丘比菲向莉莎添油加醋地描述了自己如何从一个小小的卢旺达发迹，又是如何领导一心会夺得国家权柄的故事，虽然看不见安丘比菲，但电报上那些狂野的修辞手法和放荡的遣词造句还是能让莉莎感受到这个故事有多么吹牛，虽然故事确实夸大了一些，安丘比菲还是在其中分享了一些自己如何统筹全军、击溃敌军、战后处理的一些见解，并认为这些知识也许对于莉莎的未来是有帮助的，莉莎很感谢安丘比菲向她分享的趣闻，并在一封电报上表示：“也许，我们应该给你一次在喜剧电影上大放光彩的机会。”"
  ZYX.37.a: "“什么嘛！这不是没感受到老大我的伟大！”"
  ZYX.37.b: "“好怪哦，先放着吧。”"
  ZYX.38.t: "领袖同莉莎讨论美食"
  ZYX.38.desc: "当谈及士兵们的兵粮时，原先莉莎只是介绍单兵口粮里包含了什么，能够让士兵们吃上什么样的伙食，在什么样的条件也能吃得好好的，在谈及香肠时，莉莎开始兴致勃勃地介绍起来这个能够激励士气和维系“民族共同体”的美食，从它的历史到现在哪个地方好吃，以及她早年间和希尔在哪里吃过特别好吃的香肠，等到莉莎发表完她的长篇大论之后，安丘比菲也举例了许多美食，这其中包括她们最心心念念的意大利面。"
  ZYX.38.a: "“想吃点好的。”"
  ZYX.38.b: "“想吃点好的。”"
  ZYX.39.t: "领袖向莉莎吐槽国内的建设"
  ZYX.39.desc: "安丘比菲在一封电报中，向莉莎抱怨起了国内干湿分明的气候状况和红土遍布的农业窘境，她吐槽到，有一户种地的农家就得多建一处水库，不然，天上下的雨量不够，地上干的水又太多，那农业的发展瓶颈被定得死死的，这么大的罗德西亚根本种不出太多的粮食，莉莎则表示：她曾听闻遥远的东方有一句古老的谚语（？存疑）“非洲农业不发达，必须要有金坷垃。肥料掺了金坷垃，粮食亩产一千八”，也许那里会有罗德西亚改变当下农业困境的方法。"
  ZYX.39.a: "“这么神奇的东西？”"
  ZYX.39.b: "“总感觉这个金坷垃和元首有一种道不明的联系……”"
