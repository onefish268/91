  ZYX.31.t: "老大带领德国访问团参观兽耳娘的生活"
  ZYX.31.desc: "很久以来，大部分欧洲人们对于非洲这片“黑暗大陆”的想象仅仅停留在那些冒险小说的仆从、战士、巫师，或是报纸与官方报告中的那一个个抽象的东西，而现在，老大带着德国的访问团们近距离地走进了这些原住民的村落，让这些人得以看见一幅她们从来没有见过的非洲：这些兽耳娘勤勤恳恳地劳作着，在一望无际的田野上，她们俯下身子，将种子安置入土里，在高耸入云的工厂里，她们埋头苦干，让机器全负荷地工作着，她们的身影似乎与千里之外的欧洲工人们重叠了，都在自己的岗位上保持发光发热。"
  ZYX.31.a: "“这就是祖国劳动的英雄！”"
  ZYX.31.b: "“我曾经对非洲这片遥远的大陆一无所知，直到我亲眼见证了她无限的活力。”"
  ZYX.32.t: "老大带领德国访问团检阅黑小将"
  ZYX.32.desc: "在索尔兹伯里广场上，平日人来人往的广场被军队提前疏散了人群，在入场之前，老大和德国代表团便在广场的入口接受了法西斯青年团的敬礼，她们站在M形的巨大站台上，维持着最为标准的姿势，当老大她们共同登上了高高的观礼台时，早已等候多时的青年团和少年团排成了气势恢宏的方阵走过观礼台，整齐划一的姿势、血气方刚的神情给与会者们都留下了深刻的影响，最后，在团员们的一声声“领袖万岁！”下，今天的阅兵仪式最后落下了帷幕。"
  ZYX.32.a: "“这些都是祖国未来的英雄！”"
  ZYX.32.b: "“这些斗志昂扬的士兵给我们留下了深刻的印象。”"
  ZYX.33.t: "老大向丽莎邮寄索尔兹伯里的照片"
  ZYX.33.desc: "很久以前，老大早有耳闻丽莎建设一个崭新德国的想法，具体怎么建设、该展现出什么样的风格缺一直没有定数，于是，老大便决定让人将罗德西亚美丽的首都——索尔兹伯里拍给她参考。索尔兹伯里虽然坐落于非洲，但是那些宽阔的林荫道、各式各样的欧式风情街和整齐的花园洋房，这便是索尔兹伯里——欧洲文明在非洲土地上生长出的奇特城市，它的街景完全不输欧洲的那些文化古城。老大希望，她们的都市能够给丽莎提供一些战后的建设灵感，让她自豪的索尔兹伯里也能在其他地区展现它的魅力。"
  ZYX.33.a: "“让我们最为骄傲的城市去打动一下丽莎！”"
  ZYX.33.b: "“这是非洲的城市？不知道还以为哪个欧洲的古城呢。”"
