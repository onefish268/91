l_simp_chinese:
#事件注释
  ZYX.3.t: "一则消息"
  ZYX.3.desc: "我们收到了一个有趣的消息，被称为圣幻后花园的非洲竟然出现了一个法西斯主义国家。作为世界法西斯运动的老大哥，或许我们应该和这个极权小兄弟打个招呼。"
  ZYX.3.a: "看来非洲将成为我们撬动世界的一个支点。"
  ZYX.4.t: "事发突然"
  ZYX.4.desc: "今天我们伟大的领袖突然收到了一封电报，电报里的信息表明这是来自德意志的元首莉莎的一封信，信中莉莎以老大哥的名义对我们摆脱了“铁手”的束缚实现独立的现状表示祝贺，并期待我们能拥有更伟大的成就。"
  ZYX.4.a: "哼，这是当然的！"
  ZYX.4.b: "想从我这里捞好处？没门！"
  ZYX.6.t: "来自欧洲的一条消息"
  ZYX.6.desc: "曾在内战中帮助我们的德国在一个星期前已经发起了复兴之战，尽管我们的朋友勇气可嘉，但领袖开始为她的老朋友担忧。"
  ZYX.6.a: "有什么事能让她老人家担心的？"
  ZYX.9.t: "争执"
  ZYX.9.desc: "领袖闲来无事，在往来电报中附注了自己对于法西斯党如何夺取全国政权的见解，出乎意料的是，在德国的元首莉莎居然拍了一封电报来驳斥领袖的理论。莉莎指出以政党为组织基础才能凝聚所有同志的力量，而不是“和肮脏的犹太资本家一起共享劳动成果”，领袖则反驳莉莎“完全忽略了现实因素”，认为元首偷换了概念，她所指的资本家并不是犹太人，而且资本家对于奋斗事业的贡献是肯定的，“你不能饿着肚子讨论理想，除非你乐意睡桥洞”。莉莎则对此嗤之以鼻。但双方谁也不能辩倒对方，于是两人决定："
  ZYX.9.a: "每过40天，和那个愚蠢的矮个子谈谈话。"
  ZYX.9.b: "每过40天，和那个狡猾的猴子谈谈话。"
  ZYX.10.t: "核心理念之争"
  ZYX.10.desc: "终于到了这个时候了，领袖迫不及待的和远在奥地利的元首通上了信。在长达2个小时的争论后，鉴于双方谁也奈何不了谁，两人决定换个方向。领袖认为法西斯主义的核心理念是“阶级调和”，法西斯党要做的就是充当工人阶级和资产阶级之间的润滑剂，最终实现大同社会；莉莎则认为法西斯主义的核心理念是“祖国第一”，一切阶级矛盾都要为祖国的利益让步，只有国家实现复兴，才有资格提及个人矛盾。"
  ZYX.10.a: "这家伙又偷换概念。"
  ZYX.10.b: "哼，我要开除她的右藉！"
  ZYX.11.t: "两个duce？"
  ZYX.11.desc: "今天，元首没有再和领袖辩论，而是提出了一个困扰了她许久的问题。\n“你和意大利的安丘比是什么关系？”\n领袖张了张嘴，一句话也没有说出来。半响，她屏退了所有人，和莉莎通起了电话。"
  ZYX.11.a: "其实我是个穿越者。"
  ZYX.11.b: "“穿越者”？这家伙在胡说八道什么呢。"
  ZYX.12.t: "炫耀"
  ZYX.12.desc: "“看见新闻了吗？”\n“？”\n看着莉莎的来信，安丘比菲疑惑着回了电报。为了防止私密事情被他人看见，安丘比菲专门为此学习了怎么拍电报，莉莎也是如此。\n“新闻头条啊，我不是让人在给你的物资里捎上了一份报纸吗？”\n“还有这回事，我去问问。”\n安丘比菲离开了卧室，去找齐亚诺了。而莉莎则还在拍电报中滔滔不绝的讲述自己的多瑙河工业奇迹。"
  ZYX.12.a: "“报纸？我以为是给士兵看的，就发下去了。”"
  ZYX.12.b: "“这家伙怎么不回消息？”"
  ZYX.13.t: "丘选"
  ZYX.13.desc: "“我写了一本书。”\n莉莎看着信纸，思考了一会，\n“写了什么？小说？”\n“当然不是！”\n安丘比菲回道，\n“是本duce对于法西斯主义建设的一些见解，名字我都取好了，就叫‘安丘比菲选集’。”“就你？”\n莉莎嗤笑道，\n“只是对我写的‘我的奋斗’的拙劣模仿罢了。”"
  ZYX.13.a: "“我的奋斗”是啥书？（皱眉）"
  ZYX.13.b: "来人，把那本书带过来让我“品鉴”一下。"
  ZYX.14.t: "莉莎的裙子"
  ZYX.14.desc: "安丘比菲收到一个来自柏林的包裹，拆开一看，居然是一条做工精良的黑色连衣裙，附着一张字条：\n'听说你那边的裁缝手艺不怎么样，这条送你。别总穿那身灰扑扑的猎装了，像个下乡收租的管事婆。'\n安丘比菲拎起裙子在自己身上比了比，发现尺寸居然分毫不差，脸一下子涨得通红——莉莎那家伙，什么时候偷偷量过她的身段？她抓起电报机的输入键就想回骂，指尖悬在按键上却迟迟没按下去，最后只是盯着那条裙子看了半天，低声骂了句'多管闲事'，然后把裙子工工整整地叠好，放进了衣柜最上层。\n隔天开会时，她的副官注意到领袖的猎装领口比平时多别了一枚银质蔷薇胸针——那玩意儿从前可从未出现过。"
  ZYX.14.a: "……真烦人。"
  ZYX.14.b: "莉莎盯着电报机等了半天，什么也没等到。"
  ZYX.15.t: "领袖的英姿"
  ZYX.15.desc: "为了向柏林那位展示自己在一心会的绝对权威，安丘比菲特意命人拍了一张自己在卢旺达市政厅广场演讲时的照片——她站在临时搭起的讲台上，右臂高抬，指尖直指天际，背景是一面迎风招展的一心会黑旗，光线恰好从侧面打来，在脸上勾出刚毅的轮廓。\n她精挑细选了一张最满意的洗出来，在背面签上'致莉莎——敬我们的友谊与共同理想'，又端详了半天，觉得这句太正式，划掉重写了'看看什么叫真正的领袖风范'，然后寄了出去。一个星期后，柏林的回信到了，安丘比菲拆开信封，满怀期待地展开信纸，却发现整封信只有一句话——她把信纸翻来覆去看了三遍，确认没有更多内容后，脸一点点沉了下去。"
  ZYX.15.a: "“帽子带歪了。”"
  ZYX.15.b: "“帽子带歪了。”"
  ZYX.16.t: "论极端"
  ZYX.16.desc: "午后的卢旺达闷热难耐，安丘比菲盘腿坐在办公室的藤椅上，手里捏着电报。\n莉莎在信中罕见地长篇大论，谈起了她对“极端思想”的界定——她认为法西斯主义的伟大正在于它的“绝对性”，不妥协、不调和、不向任何旧秩序低头，唯有如此才能砸碎腐朽的世界。\n安丘比菲看完信，把电报往桌上一扔，笑了一下，开始回信。她在信里写道：\n'你说的极端，是在柏林办公室里喝着红酒构想出来的极端。我这里没有那么多哲学可谈，极端就是饥饿的人民在街头游荡，就是每一发子弹都必须命中目标，就是如果我今晚不解决粮食问题，明天一早城里就会挂满尸体。'"
  ZYX.16.a: "理论一定要贴合现实。"
  ZYX.16.b: "我尊重她的想法，但我并不认同。"
  ZYX.17.t: "冷落"
  ZYX.17.desc: "维也纳总理府的办公桌上，一封来自卢旺达的电报已经搁了整整四天。莉莎每天从堆积如山的文件里抬头时都会看见它，然后对自己说'等会儿回'——然后复兴战线的军需调配、国社来的党务报告、多瑙河工业区的产能统计便又淹了上来。等第四天傍晚她终于摊开信纸时，才发现安丘比菲已经连着发了十多张电报。\n莉莎愣了一下，赶紧回了一封长信解释缘由，措辞诚恳，语气温和，甚至主动称赞了安丘比菲上次演讲的“气势”。三天后回信到了，只有一句话：'哦。'又过两天，第二封回信到了，更短：'忙着，勿念。'莉莎对着这两个字看了半天，后颈一阵发凉——\n完蛋了。"
  ZYX.17.a: "已阅。"
  ZYX.17.b: "这咋办呀......"
  ZYX.18.t: "交个朋友？"
  ZYX.18.desc: "安丘比菲领袖最近失眠了。自从阿道夫从维也纳寄来了她与副元首的合照后，领袖就彻夜难眠。那头靓丽的白发，红色的点缀，姣好的容颜，以及那高冷的表情，无一不戳中了安丘比菲的颜值观。她开始频繁向莉莎询问“女神”的相关情况，而莉莎则敏锐的洞察到了这一点，并刻意避开了这些话题。"
  ZYX.18.a: "亚平宁小伙多情种"
  ZYX.18.b: "日耳曼小伙爱吃醋"
  ZYX.19.t: "看电影"
  ZYX.19.desc: "维也纳UFA电影制片厂新上映了一部战争大片《西线的旗帜》，莉莎兴奋地给安丘比菲拍了电报：\n“这电影你一定要看。”\n安丘比菲回电：\n“卢旺达没有电影院。”\n莉莎闻言，立即让宣传部的人复制了一份胶片，用外交邮袋经南非转寄到卢旺达，又专门协调了卢旺达市政厅里那台闲置的放映机。\n一个星期六的晚上，维也纳总理府的小型放映厅里，莉莎坐在第一排中央，面前是幕布；八千公里外的卢旺达市政厅会议室里，安丘比菲盘腿坐在一把嘎吱作响的木椅上，面前是一面临时挂起的白床单。两台电话听筒被搁在各自的扶手边，线路接通的那一刻，莉莎听见了那头传来的电流杂音和一声含混的“开始吧”。\n幕布亮起，德军士兵在屏幕上冲锋陷阵，两个女声隔着八千公里的电话线，同时安静了下来。电影放到男主角在战壕里对战友发表慷慨激昂的演说时，安丘比菲忽然对着听筒说了句：\n“这家伙说话太慢了，战场上啰嗦这么多早就被狙击手爆头了。”\n莉莎愣了一秒，反驳道：\n“这叫戏剧张力！”\n安丘比菲嗤了一声：\n“张力？我看是拖时长省胶片。”\n电影放到后半段主角阵亡的悲情场景时，电话那边传来了细微的吸鼻子声，安丘比菲沉默了，什么也没说。"
  ZYX.19.a: "她也是个性情中人。"
  ZYX.19.b: "伟大的日耳曼军人......（抹眼泪）"
