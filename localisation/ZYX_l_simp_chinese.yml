  select_kards_mouse_tips: "左键点击查看进一步的信息，右键点击加入到卡组当中"
  selected_kard_button_tip: "左键进行移除，右键进行复制（不能超过4张）"
  tip_to_player_0: "在选卡界面里，你可以通过§Y鼠标左键§!点击顶部的各个学院图标来让其下的兵种在显示与屏蔽之间的状态来回切换，通过§Y鼠标右键§!点击学院（卡牌的来源不能超过两个）来确定你要从哪些国家抽取卡牌进入卡组，你可以§Y鼠标左键§!点击左侧的兵种图标来展示或屏蔽效果、步兵、坦克（目前只有这些兵种）。"
  tip_to_player_1: "将大量的坦克塞入此处并声称这是中国的确实有点难绷，但是，我们没能想到更好的办法（）"
  tip_to_player_2: "一些国家的内容比较少，甚至干脆没有效果卡，为此带来的不便还请谅解（）"
  tip_to_player_3: "我们的游戏是基于kards来制作的，但是本人军事储备不足、加之相关游戏的体验甚少，产生的数值崩坏、与史料不符问题还请原谅（）"
  tip_to_player_4: "发现滚轮高得离谱了吗，我没有找到合适的办法让滚轮适配实际卡组的高度，它们总是会被莫名其妙抹去最后一行，成为永远到不了的真实（）"
  tip_to_player_5: "因为人手不足加之经验尚浅，一些图片、处理细节是不尽人意的（）"
  tip_to_player_6: "虽然卡组的读取采用了多级索引的方式来极大地简化了过程、加快了效率，但是众多卡牌加在一起造成的性能负担还是不建议玩家，一边让游戏时间走起来，一边游玩该小游戏。"
  tip_to_player_7: "因为P社引擎的限制缘故，我们没法做到游戏循环效果，需要人为地引入玩家去操纵循环的推进，因此，需要劳烦各位玩家们在行动过后还要狂点鼠标推进游戏程序进行（）"
  tip_to_player_8: "如果出现了任何图片重复、错位、崩坏，可以及时向我们反馈，我们会尽快作出回答并修正（）"
  select_cancel_block_t: "是否决定执行§R取消§!的操作？"
  select_cancel_block_d: "注意！该操作会让你之前选取的卡组全部失效！请你再三考虑是否接受这个后果！"




















