l_simp_chinese:
#事件注释
  ZYX.3.t: "一则消息"
  ZYX.3.desc: "我们收到了一个有趣的消息，被称为圣幻后花园的非洲竟然出现了一个法西斯主义国家。作为世界法西斯运动的老大哥，或许我们应该和这个极权小兄弟打个招呼。"
  ZYX.3.a: "看来非洲将成为我们撬动世界的一个支点。"
  ZYX.4.t: "事发突然"
  ZYX.4.desc: "今天我们伟大的领袖突然收到了一封电报，电报里的信息表明这是来自德意志的元首莉莎的一封信，信中莉莎以老大哥的名义对我们摆脱了“铁手”的束缚实现独立的现状表示祝贺，并期待我们能拥有更伟大的成就。"
  ZYX.4.a: "哼，这是当然的！"
  ZYX.4.b: "想从我这里捞好处？没门！"
  ZYX.6.t: "来自欧洲的一条消息"
  ZYX.6.desc: "曾在内战中帮助我们的德国在一个星期前已经发起了复兴之战，尽管我们的朋友勇气可嘉，但领袖开始为她的老朋友担忧。"
  ZYX.6.a: "有什么事能让她老人家担心的？"
  ZYX.9.t: "争执"
  ZYX.9.desc: "领袖闲来无事，在往来电报中附注了自己对于法西斯党如何夺取全国政权的见解，出乎意料的是，在德国的元首莉莎居然拍了一封电报来驳斥领袖的理论。莉莎指出以政党为组织基础才能凝聚所有同志的力量，而不是“和肮脏的犹太资本家一起共享劳动成果”，领袖则反驳莉莎“完全忽略了现实因素”，认为元首偷换了概念，她所指的资本家并不是犹太人，而且资本家对于奋斗事业的贡献是肯定的，“你不能饿着肚子讨论理想，除非你乐意睡桥洞”。莉莎则对此嗤之以鼻。但双方谁也不能辩倒对方，于是两人决定："
  ZYX.9.a: "每过40天，和那个愚蠢的矮个子谈谈话。"
  ZYX.9.b: "每过40天，和那个狡猾的猴子谈谈话。"
  ZYX.10.t: "核心理念之争"
  ZYX.10.desc: "终于到了这个时候了，领袖迫不及待的和远在奥地利的元首通上了信。在长达2个小时的争论后，鉴于双方谁也奈何不了谁，两人决定换个方向。领袖认为法西斯主义的核心理念是“阶级调和”，法西斯党要做的就是充当工人阶级和资产阶级之间的润滑剂，最终实现大同社会；莉莎则认为法西斯主义的核心理念是“祖国第一”，一切阶级矛盾都要为祖国的利益让步，只有国家实现复兴，才有资格提及个人矛盾。"
  ZYX.10.a: "这家伙又偷换概念。"
  ZYX.10.b: "哼，我要开除她的右藉！"
  ZYX.11.t: "两个duce？"
  ZYX.11.desc: "今天，元首没有再和领袖辩论，而是提出了一个困扰了她许久的问题。\n“你和意大利的安丘比是什么关系？”\n领袖张了张嘴，一句话也没有说出来。半响，她屏退了所有人，和莉莎通起了电话。"
  ZYX.11.a: "其实我是个穿越者。"
  ZYX.11.b: "“穿越者”？这家伙在胡说八道什么呢。"
  ZYX.12.t: "炫耀"
  ZYX.12.desc: "“看见新闻了吗？”\n“？”\n看着莉莎的来信，安丘比菲疑惑着回了电报。为了防止私密事情被他人看见，安丘比菲专门为此学习了怎么拍电报，莉莎也是如此。\n“新闻头条啊，我不是让人在给你的物资里捎上了一份报纸吗？”\n“还有这回事，我去问问。”\n安丘比菲离开了卧室，去找齐亚诺了。而莉莎则还在拍电报中滔滔不绝的讲述自己的多瑙河工业奇迹。"
  ZYX.12.a: "“报纸？我以为是给士兵看的，就发下去了。”"
  ZYX.12.b: "“这家伙怎么不回消息？”"
  ZYX.13.t: ""
  ZYX.13.desc: ""
  ZYX.13.a: ""
  ZYX.13.b: ""
  ZYX.31.t: "带领德国访问团参观兽耳娘的生活"
  ZYX.31.desc: "很久以来，大部分欧洲人们对于非洲这片“黑暗大陆”的想象仅仅停留在那些冒险小说的仆从、战士、巫师，或是报纸与官方报告中的那一个个抽象的东西，而现在，带着德国的访问团们近距离地走进了这些原住民的村落，让这些人得以看见一幅她们从来没有见过的非洲：这些兽耳娘勤勤恳恳地劳作着，在一望无际的田野上，她们俯下身子，将种子安置入土里，在高耸入云的工厂里，她们埋头苦干，让机器全负荷地工作着，她们的身影似乎与千里之外的欧洲工人们重叠了，都在自己的岗位上保持发光发热。"
  ZYX.31.a: "“这就是祖国劳动的英雄！”"
  ZYX.31.b: "“我曾经对非洲这片遥远的大陆一无所知，直到我亲眼见证了她无限的活力。”"
  ZYX.32.t: "带领德国访问团检阅黑小将"
  ZYX.32.desc: "在索尔兹伯里广场上，平日人来人往的广场被军队提前疏散了人群，在入场之前，和德国代表团便在广场的入口接受了法西斯青年团的敬礼，她们站在M形的巨大站台上，维持着最为标准的姿势，当老大共同登上了高高的观礼台时，早已等候多时的青年团和少年团排成了气势恢宏的方阵走过观礼台，整齐划一的姿势、血气方刚的神情给与会者们都留下了深刻的影响，最后，在团员们的一声声“领袖万岁！”下，今天的阅兵仪式最后落下了帷幕。"
  ZYX.32.a: "“这些都是祖国未来的英雄！”"
  ZYX.32.b: "“这些斗志昂扬的士兵给我们留下了深刻的印象。”"
  ZYX.33.t: "向丽莎邮寄索尔兹伯里的照片"
  ZYX.33.desc: "很久以前，早有耳闻丽莎建设一个崭新德国的想法，具体怎么建设、该展现出什么样的风格缺一直没有定数，于是，老大定让人将罗德西亚美丽的首都——索尔兹伯里拍给她参考。索尔兹伯里虽然坐落于非洲，但是那些宽阔的林荫道、各式各样的欧式风情街和整齐的花园洋房，这便是索尔兹伯里——欧洲文明在非洲土地上生长出的奇特城市，它的街景完全不输欧洲的那些文化古城。老大希望们的都市能够给丽莎提供一些战后的建设灵感，让她自豪的索尔兹伯里也能在其他地区展现它的魅力。"
  ZYX.33.a: "“让我们最为骄傲的城市去打动一下丽莎！”"
  ZYX.33.b: "“这是非洲的城市？不知道还以为哪个欧洲的古城呢。”"
  ZYX.34.t: "和丽莎讨论未来的世界格局"
  ZYX.34.desc: "在一天晚上，和丽莎就“未来的世界格局”这一问题展开了激烈的讨论，她们一致认为，1936年的那场大萧条，是世界大变局的催化剂，战争很快就会到来，届时，两国改变命运的风口也将到来。具体到她们本国的未来策略布局时，因为双方早已达到敞开心扉的程度，她们详细地向对方描述了她们会怎么生产、训练军队、决定蛰伏到什么时候、然后在什么时候介入或是掀起一场改变世界的大漩涡，最后让各自的民族成就一段震撼全世界的传奇。两人到最后的情绪都异常地激动，那一封封电报刚刚打印完便被老大莎迫不及待地取下，然后阅读，再兴冲冲地让电报员把自己内心珍贵的想法传到千里之外的朋友那里。"
  ZYX.34.a: "“这真是个美妙的夜晚！”"
  ZYX.34.b: "“我们共同度过了一个欢乐的时光！”"
  ZYX.35.t: "和丽莎谈论外星人的事情"
  ZYX.35.desc: "在1934年时，一场突如其来的外星人入侵迫使丽莎连同她的纳粹党离开了德意志祖国，转而只能偏安奥地利，每每想到这件往事，便会让丽莎感到满腔怒火和深深的不甘，她们还有很多的壮志雄心与计划未能实施便被邪恶的外星人打断，她们的德意志祖国还没能迎来复兴便被其他异族再次蹂躏在脚下。仔细阅读了丽莎发来的这些电报，并在回信中深刻表达了她对德意志遭受如此磨难的同情和自己坚定支持在德意志的决心。“我对你的祖国遭受的屈辱深感同情，我代表罗德西亚支持你们为德意志民族的自由和幸福的正义之战，并在未来的合作中，竭尽所能地帮助你们。”"
  ZYX.35.a: "“我们要为盟友讨个公道！”"
  ZYX.35.b: "“罗德西亚是我们可靠的朋友！”"
  ZYX.36.t: "安丘比菲向丽莎赠送各种非洲的奇珍异兽"
  ZYX.36.desc: "非洲拥有与欧洲差别极大的地理环境，因而这片土地上诞生了各种欧洲很少见的奇葩物种，像是长颈鹿、河马、猎豹，还有从中非地区流窜出来的奇幻物种——敲击兽、叶羊等等，特别是其中的一对敲击兽伴侣，被罗德西亚方面通过举行隆重的仪式赠予了德意志国，安丘比菲向丽莎表示：“我们向德意志国赠送的是象征力量与友谊的神兽——敲击兽，愿这对威武的敲击兽能够在德意志国的土地上始终矗立着，作为两国坚不可摧关系的生动写照，并保持强大之姿，威慑那些图谋不轨的不速之客。”"
  ZYX.36.a: "“我们赠送的礼物十分合适！”"
  ZYX.36.b: "“这样的礼物太有分量了！”"
