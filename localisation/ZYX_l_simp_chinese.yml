l_simp_chinese:
  ZYX.3.t: "一则消息"
  ZYX.3.desc: "我们收到了一个有趣的消息，被称为圣幻后花园的非洲竟然出现了一个法西斯主义国家。作为世界法西斯运动的老大哥，或许我们应该和这个极权小兄弟打个招呼。"
  ZYX.3.a: "看来非洲将成为我们撬动世界的一个支点。"
  ZYX.4.t: "事发突然"
  ZYX.4.desc: "今天我们伟大的领袖突然收到了一封电报，电报里的信息表明这是来自德意志的元首丽莎的一封信，信中丽莎以老大哥的名义对我们摆脱了“铁手”的束缚实现独立的现状表示祝贺，并期待我们能拥有更伟大的成就。"
  ZYX.4.a: "哼，这是当然的！"