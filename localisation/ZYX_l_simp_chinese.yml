#国策文本
  zg_1: "一个朋友？"
  zg_1_desc: ""
  zg_2: "打通贸易网"
  zg_2_desc: "如果我们想为小家伙提供切实的帮助，那就要经过圣杯或幻想乡的地盘。"
  zg_3: "获取资金"
  zg_3_desc: "看得出来，我们的存在对于德国人来说是一个重大的刺激，或许我们只需要略微宣传一下，就能在奥地利募取大量的海外资金。"
  zg_31: "招募秃鹰军团"
  zg_31_desc: "目前元首丽莎对我们的法西斯斗争事业非常感兴趣，我们可以请求她组建一支外籍军团来支援我们的解放事业。"
  zg_21: "希尔外包公司"
  zg_21_desc: "明目张胆的运输军火无疑会让圣杯感到被欺骗，我们可以用副元首希尔的名头来成立一个外包公司来当中间商，以此骗过圣杯的耳目：毕竟，她们只同意了我们进行“人道主义援助”。"
  zg_22: "扩大志愿军规模"
  zg_22_desc: "一心会太弱了，没有伟大祖国的帮助，她和她那可怜的领袖会被敌人撕成碎片。"
  cks_1: "旧友难忘"
