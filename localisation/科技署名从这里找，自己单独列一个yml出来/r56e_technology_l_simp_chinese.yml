 TITLE_EXP_ROCKETS_SUBTITLE:0 "火箭学"
 icbm_missile_equipment_1:0 "核洲际弹道导弹"
 icbm_missile_equipment_1_desc:0 "这些洲际弹道导弹是核科学和火箭技术的巅峰之作，它将导弹的射程深不可测与随时随地发射核弹头的能力结合在一起。这些导弹中的一枚或多或少能保证摧毁目标。"
 nukes_3:0 "小型核武器"
 nukes_3_desc:0 "核武器设计的进一步发展使得微小的线性内爆型武器可以被塞进手提箱里。如此可怕的武器脱胎于我们在生产更有效的裂变材料方面时的更深层理解，同时也反过来提升了我们其他常规核武器的威力。"
