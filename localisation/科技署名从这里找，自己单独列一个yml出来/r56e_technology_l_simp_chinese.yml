 oscillating_turret_tech: "摇摆式炮塔"
 oscillating_turret_tech_desc: "摆动式炮塔利用铰链使整个炮塔随火炮一起升降和转向，由于连接的机械设备会随着火炮一起移动，因此可以将炮安装在更高的位置，从而为安装更大的火炮和瞄准更大的倾斜范围提供了可能。"
 modern_light_tank_chassis: "1944年轻型坦克底盘"
 sniper_rifle:0 "狙击手小队"
 sniper_rifle_desc:0 "在每个排增加一个狙击手单位将有效地提高单位的侦察能力和攻击力。"
 sniper_rifle_2:0 "先进狙击手小队"
 sniper_rifle_2_desc:0 "我们改进了狙击手队伍的步枪和训练，使他们的效力显著提高。"
 sniper_rifle_3:0 "半现代狙击手小队"
 sniper_rifle_3_desc:0 "我们狙击手小队的广泛经验和反馈使我们能够生产出更好的装备。"
 sniper_rifle_4:0 "现代狙击手小队"
 sniper_rifle_4_desc:0 "我们的队伍拥有最好的装备，使用的装备也不亚于最现代化的装备。"
 flamethrower:0 "火焰喷射器"
 flamethrower_desc:0 "发展火焰喷射器将使我们的部队在城市战争和堡垒中更有效。但是背着装满燃料的油箱奔跑，随时准备爆炸，可能会带来灾难性的后果。"
 flamethrower_squad:0 "火焰喷射器小队"
 flamethrower_2:0 "先进火焰喷射器"
 flamethrower_2_desc:0 "装甲和重量减轻方面的进步提高了我们喷火队的安全性和有效性。"
 flamethrower_3:0 "半现代喷火器"
 flamethrower_3_desc:0 "我们的团队经验丰富，对他们需要的设备种类给予了我们广泛的反馈。我们已将这些建议整合到生产线中，从而提高了战斗力。"
 Armor_TITLE_CAMO:0 "涂料"
 painting:0 "纯色"
 painting_desc:0 "出厂时为纯色。"
 painting2:0 "工厂迷彩"
 painting2_desc:0 "我们坦克的新伪装。这种新油漆直接在工厂使用，可以更好地防止伏击和渗透。"
 painting3:0 "战场迷彩"
 painting3_desc:0 "我们坦克的新伪装。允许我军修改工厂迷彩与自己的设计将增加坦克伏击防御和渗透。"
 painting4:0 "半现代迷彩"
 painting4_desc:0 "我们坦克的新伪装。我们使预制涂料更容易在现场应用，并增加了第一层工厂涂料的耐用性。"
 painting5:0 "现代迷彩"
 painting5_desc:0 "我们坦克的新伪装。这些应用程序功能强大，几乎可以抵挡敌人向它投掷的任何东西。"
 INFANTRY_TITLE_CLOTHING:0 "服装"
 camo:0 "基本制服"
 camo_desc:0 "仿照世界大战时期的纯色制服。"
 camo1942:0 "先进迷彩图案"
 camo1942_desc:0 "新的伪装设计使我们的部队在伏击或渗透时不易被发现。"
 camo1948:0 "半现代迷彩图案"
 camo1948_desc:0 "新的迷彩设计更轻便，更加擅长于伏击和渗透。"
 camo1955:0 "现代迷彩图案"
 camo1955_desc:0 "你看见我了？你没看见我。"
 winter_clothes_gw:0 "冬装"
 winter_clothes_gw_desc:0 "羊毛制的冬衣。不是很有效，但总比什么都没有好。"
 winter_clothes_1939:0 "改良冬装"
 winter_clothes_1939_desc:0 "更体面的冬装。用暖和的棉毛棉袄做的。"
 winter_clothes_1941:0 "先进冬装"
 winter_clothes_1941_desc:0 "先进冬装，由天然保暖羊毛和人造毛皮制成，涂有早期疏水材料，并染上白色。"
 winter_clothes_1944:0 "现代冬装"
 winter_clothes_1944_desc:0 "现代双面冬装，由保暖合成纤维制成，并配有可拆卸的防水防风夹克。染上白色、黑色和棕色，以便在战斗中更有效。它将减轻士兵的负担，同时为他们保暖防潮。"
 jngdst_clothes_gw:0 "沙漠 & 丛林服装"
 jngdst_clothes_gw_desc:0 "棉质的沙漠和丛林衣装。不太实用，但聊胜于无。"
 jngdst_clothes_1939:0 "改良沙漠 & 丛林服装"
 jngdst_clothes_1939_desc:0 "做工更好的沙漠和丛林衣装。它们由薄棉布制成。增加了护目镜，以帮助士兵在沙地环境中作战。"
 jngdst_clothes_1941:0 "先进沙漠 & 丛林服装"
 jngdst_clothes_1941_desc:0 "先进的沙漠丛林服由天然薄棉制成，涂有特殊涂层，干燥速度更快，有助于士兵在湿热环境中作战。"
 jngdst_clothes_1944:0 "现代沙漠 & 丛林服装"
 jngdst_clothes_1944_desc:0 "现代沙漠和丛林服装由特殊的轻质织物制成，并涂有隔热夹克。染成棕褐色、黑色和棕色，以提高战斗力。它将减轻士兵的负担，使他们保持干爽。"
 AIR_TITLE_DROPTANK:0 "副油箱"
 droptank40:0 "副油箱 I"
 droptank40_desc:0 "在我们的飞机上加上外置油箱将增加它们的航程。"
 droptank44:0 "副油箱 II"
 droptank44_desc:0 "更大更轻的副油箱。"
 droptank45:0 "副油箱 III"
 droptank45_desc:0 "最新的副油箱。它将改善飞机的航程，但需要喷气式发动机来补偿它的重量。"
 droptank55:0 "副油箱 IV"
 droptank55_desc:0 "我们的副油箱现在更轻了，可以携带更多的燃料。"
