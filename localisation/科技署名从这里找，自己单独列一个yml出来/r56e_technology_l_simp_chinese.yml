 desertinfantry_at:0 "沙漠步兵 I"
 desertinfantry_at_desc:0 "部队在沙漠地区战斗时面临着许多危险，有时甚至无法避免。通过为我们的士兵提供适应这种环境的专门训练，相关风险可以降到最低。\n \n§G此类型部队不计入特种部队上限，且每个营需要5个支援装备§!"
