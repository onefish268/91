 artillery_a:0 "先进火炮升级 II"
 artillery_a_desc:0 "第一炮是给魔鬼的，第二炮给上帝的，只有第三炮是给国王的。"
 artillery_c:0 "半现代火炮升级 I"
 artillery_c_desc:0 "对炮组的每一部分都进行了精细的加工和其他调整，从而提高了炮组的整体功能和可靠性。"
 artillery_d:0 "半现代火炮升级 II"
 artillery_d_desc:0 "我们部队的重量减轻了，提高了战斗力。"
 artillery_e:0 "半现代火炮升级 III"
 artillery_e_desc:0 "具有流线型子弹的火炮，能够达到更高的速度。"
 rocket_artillery_a:0 "先进火箭炮升级"
 rocket_artillery_a_desc:0 "我们可以自信地说，我们将拥有更轻、更坚固的材料，这将降低火箭的成本。"
 rocket_artillery_b:0 "先进火箭炮升级 II"
 rocket_artillery_b_desc:0 "火箭可以造得如此强大，以至于可以把一个人发射出去。所以尽量不要去月球，好吗？"
 rocket_artillery_d:0 "半现代火箭炮升级"
 rocket_artillery_d_desc:0 "增加速度和发射能力的火箭。"
 rocket_artillery_e:0 "半现代火箭炮升级 II"
 rocket_artillery_e_desc:0 "该装置的外壳经过了改进，提高了效率和可靠性。"
 antiair_a:0 "先进防空炮升级"
 antiair_a_desc:0 "为什么军队需要昂贵的新防空炮？这些年来一直在被我们射的飞行员开始抱怨了吗？"
 antiair_b:0 "先进防空炮升级 II"
 antiair_b_desc:0 "在我的左边是步兵火炮的猛烈的爆炸声，在我的右边可以听到从前面传来的零星的炮声，而在我上边，天空晴朗，阳光灿烂。"
 antiair_d:0 "半现代防空炮升级"
 antiair_d_desc:0 "我们在把火炮系统与雷达联系起来方面取得了很大进展。"
 antiair_e:0 "半现代防空炮升级 II"
 antiair_e_desc:0 "雷达技术和联动技术的进一步发展使效率达到了最高。"
 antitank_a:0 "先进反坦克炮升级"
 antitank_a_desc:0 "坦克胜，即战胜。坦克败，即战败。"
 antitank_b:0 "先进反坦克炮升级 II"
 antitank_b_desc:0 "你最重的武器就是你的生存意志。不管发生什么，都要让他们继续前进，祈祷他们的不会更大。"
 antitank_d:0 "半现代反坦克炮升级"
 antitank_d_desc:0 "我们的子弹现在大大增加了穿透力和背后的力量。"
 antitank_e:0 "半现代反坦克炮升级 II"
 antitank_e_desc:0 "现在每一次射击的准确度和可操控性都有了很大的提高。"
 paratroopers_a:0 "伞兵 IV"
 paratroopers_a_desc:0 "上升的东西一定会下降。"
 paratroopers_b:0 "伞兵 V"
 paratroopers_b_desc:0 "上升的东西一定会下降。"
 paratroopers_c:0 "伞兵 VI"
 paratroopers_c_desc:0 "上升的东西一定会下降。"
 marines_a:0 "海军陆战队 IV"
 marines_a_desc:0 "了解我们的人只有两种：海军陆战队和敌人。其他人都只有二手意见。"
 marines_b:0 "海军陆战队 V"
 marines_b_desc:0 "了解我们的人只有两种：海军陆战队和敌人。其他人都只有二手意见。"
 marines_c:0 "海军陆战队 VI"
 marines_c_desc:0 "了解我们的人只有两种：海军陆战队和敌人。其他人都只有二手意见。"
 mountaineers_a:0 "山地步兵 IV"
 mountaineers_a_desc:0 "“再来一座山”？是啊，这就是我们要爬的那座山的名字。"
 mountaineers_b:0 "山地步兵 V"
 mountaineers_b_desc:0 "“再来一座山”？是啊，这就是我们要爬的那座山的名字。"
 mountaineers_c:0 "山地步兵 VI"
 mountaineers_c_desc:0 "“再来一座山”？是啊，这就是我们要爬的那座山的名字。"
 rangers_a: "游骑兵 IV"
 rangers_a_desc: "游骑兵，做先锋！"
 rangers_b: "游骑兵 V"
 rangers_b_desc: "游骑兵，做先锋！"
 rangers_c: "游骑兵 VI"
 rangers_c_desc: "游骑兵，做先锋！"
 night_vision_a:0 "夜视仪 III"
 night_vision_a_desc:0 "在敌人看不见的时候能看到他们是最重要的。这项新技术帮助我们实现这一目标。"
 TITLE_WONDERWAFFLE_SUBTITLE:0 "奇迹武器工程"
 r56_centralized_military_research_and_development:0 "集中化军事研发"
 GER_r56_centralized_military_research_and_development:0 "诸神黄昏"
 GER_r56_centralized_military_research_and_development_short:0 "诸神黄昏"
 GER_r56_centralized_military_research_and_development_desc:0 "通过将我们国家最杰出的人才聚集在一个屋檐下，我们可以更好地指导那些几年前还无法想象的技术项目的开发。"
 r56_centralized_military_research_and_development_short:0 "集中化军事研发"
 r56_centralized_military_research_and_development_desc:0 "通过将我们国家最杰出的人才聚集在一个屋檐下，我们可以更好地指导那些几年前还无法想象的技术项目的开发。"
 future_radar:0 "AN/APS-2雷达"
 future_radar_desc:0 "我们的机载拦截雷达现在相当先进，可以开始在交战中产生明显的变化。"
 future_radar_2:0 "AN/APS-4雷达"
 future_radar_2_desc:0 "在我们的系统的灵敏度和范围上的进一步进步使我们能够开发出更适合我们的飞机安装的装置。"
 future_radar_3:0 "AN/APS-6雷达"
 future_radar_3_desc:0 "我们将继续完善我们的系统，并开发出更好的装置，以配合我们的飞机。"
 future_computing_machine:0 "巨人系列"
 future_computing_machine_desc:0 "它们长得越大，算得就越卖力。"
 future_computing_machine_2:0 "电子计算机"
 future_computing_machine_2_desc:0 "我们集成了更快的读写能力，可以可靠地将程序写入系统。"
 future_computing_machine_3:0 "LEO I商用计算机"
 future_computing_machine_3_desc:0 "现在我们的系统如此强大，以至于我们可以开始自动化某些办公室任务，现在正迎来一个生产力的新时代。"
 future_computing_machine_4:0 "早期晶体管"
 future_computing_machine_4_desc:0 "双极晶体管在各个方面都比真空管好，我们预计它会迅速被采用，并在计算方面取得巨大进步。"
 future_decryption:0 "Mk-1 解密"
 future_decryption_desc:0 "“已经用了五年了。我们为什么要改变它?” （由J·威廉姆斯记录，18:45，RS8）"
 future_encryption:0 "Mk-1 加密"
 future_encryption_desc:0 "到这个时候，我觉得他们已经开始为购物清单加密来戏弄我们了。"
 future_decryption_2:0 "Mk-2 解密"
 future_decryption_2_desc:0 "124.89 12.88 45.45.907"
 future_encryption_2:0 "Mk-2 加密"
 future_encryption_2_desc:0 "假设它是危险的——这是第一条规则。在担心其他规则之前先弄清楚“怎么”和“为什么”。"
 future_decryption_3:0 "Mk-3 解密"
 future_decryption_3_desc:0 "对我们来说，圣杯总是一张宠物名字的清单，也许还有生日。"
 future_encryption_3:0 "Mk-3 加密"
 future_encryption_3_desc:0 "我们的代码复杂到连我们自己的人都无法使用。"
 basic_identification_friend_or_foe:0 "敌我识别系统"
 basic_identification_friend_or_foe_desc:0 "通过运用测向技术，我们能够为我们飞机配备高效的敌我识别系统。"
 ENG_basic_identification_friend_or_foe:0 "微声探测系统"
 rdf0:0 "高频测向"
 rdf0_desc:0 "通过研发更先进的高频方向探测器，我们能够更迅速地捕捉信号，从而定位短时脉冲无线电信号的来源。"
 ENG_rdf0:0 "沃森-瓦特高频测向"
 USA_rdf0:0 "贝里尼-托西高频测向"
 rdf1:0 "无线电测向"
 rdf1_desc:0 "通过拦截游击队的非法传输，我们将加强我们的反叛乱能力。"
 rdf2:0 "改进无线电测向"
 rdf2_desc:0 "通过更精确地拦截游击队的非法传输，我们将加强我们的反叛乱能力。"
 rdf3:0 "先进无线电测向"
 rdf3_desc:0 "通过早期三角测量拦截游击队员的非法传输，我们将加强我们的反叛乱能力。"
 rdf4:0 "现代无线电测向"
 rdf4_desc:0 "通过更精确的三角测量拦截游击队员的非法传输，我们将加强我们的反叛乱能力。"
 rdf5:0 "1949年无线电测向"
 rdf5_desc:0 "通过几乎精确的三角测量拦截游击队的非法传输，我们将加强我们的反叛乱能力。"
 rdf6:0 "1953年无线电测向"
 rdf6_desc:0 "无论他们在哪里，我们都能发现他们。他们没有躲藏，没有逃跑，当然也没有成功的机会。"
 rdf_partisan:0 "游击队无线电测向"
 rdf_partisan_desc:0 "通过运用高频测向技术定位已知的游击队无线电广播，我们能够大致掌握游击队的活动区域。若探测到即将发生的行动或袭击且难以应对时，我们可选择集中力量应对该区域或主动撤离。这两种策略均能有效节省人力，保障驻军的生命安全。"
 semi_modern_radio:0 "半现代无线电"
 semi_modern_radio_desc:0 "小型便携式多频道无线电（对讲机）使下级军官能够更有效地与各火力小组及支援小组沟通，显著增强了协同作战的能力。"
 modern_radio:0 "现代无线电"
 modern_radio_desc:0 "小队级别的无线电通信能够提升与军官之间的沟通效率，并协助指挥层更清晰地洞察战场形势。"
 streamlined_line_a:0 "流线型生产线 II"
 streamlined_line_a_desc:0 "工人的左手在任何时候都要与机器保持六英寸的距离。他们的脚应该在中央杠杆和红色杠杆之间。"
 flexible_line_a:0 "柔性生产线 II"
 flexible_line_a_desc:0 "听到天空的嗡嗡声了吗？意味着我们要从头开始建造一条新的生产线。再一次。"
 streamlined_line_b:0 "流线型生产"
 streamlined_line_b_desc:0 "为了创造一个更好的生产工艺，我们混合了流线型和柔性制造方案。"
 streamlined_line_c:0 "半现代生产"
 streamlined_line_c_desc:0 "工装的进一步发展使得制造业有了更好的技术和能力。"
 streamlined_line_d:0 "现代生产"
 streamlined_line_d_desc:0 "我们的制造能力现在是最先进的，几乎可以大规模生产任何东西。"
 concentrated_industry_a:0 "密集型工业 VI"
 concentrated_industry_a_desc:0 "他们每造一颗子弹，我们就造一千颗。做了这么多子弹，即便我们的士兵每一枪都打偏，敌人还是会被金属淹死。"
 dispersed_industry_a:0 "离散型工业 VI"
 dispersed_industry_a_desc:0 "当你习惯了就没那么糟了。这里唯一的东西就是蝙蝠，一股难闻的气味，还有很多不记得太阳是什么样子的人。"
 concentrated_industry_b:0 "密集型工业 VII"
 concentrated_industry_b_desc:0 "今天的大型工厂几年前就连最先进的设备也让人羞愧。"
 dispersed_industry_b:0 "离散型工业 VII"
 dispersed_industry_b_desc:0 "我们在钻孔能力方面取得了重大进展，现在能够在地下挖掘大量的设施。"
 concentrated_industry_c:0 "密集型工业 VIII"
 concentrated_industry_c_desc:0 "我们生产流程的垂直整合为我们的能力提供了更大的进步。"
 dispersed_industry_c:0 "离散型工业 VIII"
 dispersed_industry_c_desc:0 "即使海面遭到猛烈轰炸，我们仍能在下面继续生产。"
 concentrated_industry_d:0 "密集型工业 IX"
 concentrated_industry_d_desc:0 "我们可以将任何一个行业与另一个行业进行叠加，并从高度集中的利益中获益。"
 dispersed_industry_d:0 "离散型工业 IX"
 dispersed_industry_d_desc:0 "我们的供应链虽然分散，但却非常有效，而我们的工厂已全面加固，能够抵御最严峻的攻击。"
 construction_a:0 "建筑技术 VI"
 construction_a_desc:0 "新的建筑技术为我们利用钢筋混凝土建造更大、更高、更大规模的生产设施提供了独特的机会。预计国家电厂将更加耐用，并能抵御地震活动。"
 excavation_a:0 "挖掘技术 VI"
 excavation_a_desc:0 "地球在流血，你的工作就是确保血液继续流动。"
 construction_b:0 "建筑技术 VII"
 construction_b_desc:0 "如果你想让它建得又快又便宜，我们可以做到。只是不要问太多问题。"
 excavation_b:0 "挖掘技术 VII"
 excavation_b_desc:0 "那些山上还有更多的矿产资源，我们无论如何都要争取到。"
 construction_c:0 "建筑技术 VIII"
 construction_c_desc:0 "我们可以把规模扩大到任何一个正在运行的项目。也许它不会完全坚固，但它仍然可以完成任务。"
 excavation_c:0 "挖掘技术 VIII"
 excavation_c_desc:0 "像这样的机器，十年前就足以把任何人吓得魂不附体。但对我们来说，它们只意味着一件事：更多。"
 construction_d:0 "建筑技术 IX"
 construction_d_desc:0 "现代技术意味着我们可以在任何时间、任何地点建造任何东西。这并不意味着我们要给那些混蛋额外的钱。"
 excavation_d:0 "挖掘技术 IX"
 excavation_d_desc:0 "地球的骨髓是我们的食物，而它血脉里的矿藏正被开采。"
 rubber_plant_a:0 "基础橡胶厂"
 rubber_plant_a_desc:0 "利用我们的合成油生产知识，我们现在可以制造人造橡胶产品。"
 rubber_plant_b:0 "改良橡胶厂"
 rubber_plant_b_desc:0 "我们合成生产工艺的进一步改进使产量更高。"
 rubber_plant_c:0 "先进橡胶厂"
 rubber_plant_c_desc:0 "我们现在可以用我们先进的工厂生产大量的橡胶，而且价格非常便宜。"
 rubber_plant_d:0 "现代橡胶厂"
 rubber_plant_d_desc:0 "我们现在可以用我们先进的工厂生产大量的橡胶，而且价格非常便宜。"
 semi_modern_landing_craft:0 "半现代登陆艇"
 semi_modern_landing_craft_desc:0 "抱着膝盖抱着希望吧。"
 modern_landing_craft:0 "现代登陆艇"
 modern_landing_craft_desc:0 "我们还能有多少人适合这件事？"
 aluminum_production_1:0 "铝生产"
 aluminum_production_1_desc:0 "铣削技术的最新进展现在使我们能够提高铝的产量。"
 aluminum_production_2:0 "铝生产 II"
 aluminum_production_2_desc:0 "铣削技术的进步使我们能够适度提高铝产量。"
 aluminum_production_3:0 "铝生产 III"
 aluminum_production_3_desc:0 "有了我们的新铣削技术，我们可以大大提高铝产量。"
 aluminum_production_4:0 "铝生产 IV"
 aluminum_production_4_desc:0 "有了新的铣削技术，我们可以将铝产量提高到几年前做梦也想不到的水平。"
 aluminum_production_tt:0 "修正§3铝厂§!产出：§G+2 铝§!。£resources_strip|2"
 steel_production_1:0 "钢铁生产"
 steel_production_1_desc:0 "铣削技术的最新进展现在使我们能够提高钢铁产量。"
 steel_production_2:0 "钢铁生产 II"
 steel_production_2_desc:0 "铣削技术的进步使我们能够适度地提高钢铁产量。"
 steel_production_3:0 "钢铁生产 III"
 steel_production_3_desc:0 "我们的铣削技术现在相当可观，如果我们愿意的话，我们可以定期生产大量的金属。"
 steel_production_4:0 "钢铁生产 IV"
 steel_production_4_desc:0 "我们的钢铁生产现在非常先进，几乎可以大量涌入市场，这让其他国家感到宽慰和沮丧。"
 steel_production_tt:0 "修正§3钢铁厂§!产出：§G+2 钢铁§!。£resources_strip|5"
 nuke_naval:0 "舰船动力舱"
 nuke_naval_desc:0 "我们的理论是，我们最大和最强大的船只可以被赋予核反应堆。希望随着时间的推移，我们能找到一种方法来实现这一点。\n§R需要§!§R大于3座§!§L核反应堆§!"
 nukes_2:0 "热核实验"
 nukes_2_desc:0 "一种利用裂变产生更强大的聚变反应的炸弹已经设计好了。有了这一点，我们应该能够大大提高我们的产量。"
 semi_modern_rocket_engines:0 "半现代火箭引擎"
 semi_modern_rocket_engines_desc:0 "这些新火箭融合了从其他国家获得的思想和理论。"
 modern_rocket_engines:0 "早期洲际弹道导弹"
 modern_rocket_engines_desc:0 "我们已经开始测试并为能够进入太空的火箭打下基础，从而实现向地球上任何地点投送载荷。"
 tech_engineers_a:0 "工兵连 V"
 tech_engineers_a_desc:0 "专业化的训练和设备标准化将显著提升工兵连的建设能力，使他们能够在最恶劣的环境中修建防御工事。"
 tech_engineers_b:0 "工兵连 VI"
 tech_engineers_b_desc:0 "随着喷气式飞机和红外技术的发展，工兵们将接受先进伪装技术的培训。"
 tech_engineers_c:0 "工兵连 VII"
 tech_engineers_c_desc:0 "无论未来在哪里，工兵连都会做好战斗准备。"
 tech_recon_a:0 "侦察连 V"
 tech_recon_a_desc:0 "深度侦察行动，混合间谍和突击队训练，将有助于我们的战术和选择，并使我们能够迅速调整我们的决策。"
 tech_recon_b:0 "侦察连 VI"
 tech_recon_b_desc:0 "在敌后构建伪装的补给储藏库可以为侦察部队争取更多时间收集情报，并且让新的侦察小组能够跟进正在进行的深度侦察行动。"
 tech_recon_c:0 "侦察连 VIII"
 tech_recon_c_desc:0 "通过为我们的侦察连提供红外设备并训练他们识别热源信号，我们可以提高敌方情报收集的准确性，使我们能够为部队可能面临的任何情况做出更好的应对措施。"
 tech_military_police_a:0 "宪兵队 V"
 tech_military_police_a_desc:0 "安全地维持被占领土的治安，既是要恢复正常状态，也是要无情地消除反对派。我们的宪兵必须确保这一进程早日开始，以确保士兵和平民的安全。"
 tech_military_police_b:0 "宪兵队 VI"
 tech_military_police_b_desc:0 "有时候，单纯等待麻烦发生是不够的。通过与间谍协调，我们可以在我们想要的地方和时间安排几次受控的暴动，并利用这些暴动来清除那些最麻烦的捣乱分子。"
 tech_military_police_c:0 "宪兵队 VII"
 tech_military_police_c_desc:0 "在长期占领的下，我们的宪兵应得到各类人员的支持，如翻译、社会学家和人类学家。一点点理解可以产生深远影响。"
 tech_maintenance_company_a:0 "维修连 V"
 tech_maintenance_company_a_desc:0 "在大战中设计主动冗余的经验可以更新，以使用更现代化的设备，使维护更容易。"
 tech_maintenance_company_b:0 "维修连 VI"
 tech_maintenance_company_b_desc:0 "通过为一些车辆配备简易的现场手册，我们可以让普通士兵参与到车辆的基本维护中，从而使维修连可以专注于更具体的问题。"
 tech_maintenance_company_c:0 "维修连 VII"
 tech_maintenance_company_c_desc:0 "将我们设备中的关键系统分开，可以减少对主动冗余的依赖，并在设备严重损坏时允许其在一定程度上继续运作。"
 tech_field_hospital_a:0 "野战医院 V"
 tech_field_hospital_a_desc:0 "在工兵连的帮助下，我们可以建造更强大且易于防御的野战医院，从而在康复过程中确保里面士兵的安全。"
 tech_field_hospital_b:0 "野战医院 VI"
 tech_field_hospital_b_desc:0 "通过航空领域的突破——直升机，我们可以更快速地将野战医疗人员送到伤员身边进行分诊。节省的额外时间对他们的生存至关重要。"
 tech_field_hospital_c:0 "野战医院 VII"
 tech_field_hospital_c_desc:0 "尽管野战医学已经取得了许多进步，但许多进展都是临时性的，我们缺乏一个既定的学说。有了更多的经验，我们可以更清楚地解释这些装置的作用，并改进永久固定装置的创新。"
 tech_logistics_company_a:0 "后勤连 V"
 tech_logistics_company_a_desc:0 "为不同的装备类别添加颜色编码是一个简单且有效的方式，可以简化后勤支持。"
 tech_logistics_company_b:0 "后勤连 VI"
 tech_logistics_company_b_desc:0 "为供应品制定标准化分类将最大限度地减少混乱，并使规划更有效率。"
 tech_logistics_company_c:0 "后勤连 VII"
 tech_logistics_company_c_desc:0 "进一步将装备类别细分为多个子类别，将显著改善装备的组织管理。"
 tech_signal_company_a:0 "通信连 V"
 tech_signal_company_a_desc:0 "在我们的信号专家中，有一些人拥有无与伦比的现场使用经验。通过让他们参与新通信技术的研究，我们可以充分利用他们的专业知识。"
 tech_signal_company_b:0 "通信连 VI"
 tech_signal_company_b_desc:0 "随着技术的不断发展，无线电通信的距离大大增加，使得所有军队部门之间的沟通更加顺畅。"
 tech_signal_company_c:0 "通信连 VII"
 tech_signal_company_c_desc:0 "无线电通信的加密对于保持出其不意至关重要。通过在无线电中加入脉冲压缩技术，我们可以阻止任何敌方监听企图。"
 etat_folder:0 "扩大工业 & 设备"
 etat_folder_desc:0 "工业发展 & 装备"
 etax_folder:0 "特殊研究部门"
 etax_folder_desc:0 "特殊研究部门"
 ETAX_TITLE_DOCTRINE_X:0 "特殊研究部门"
 r56_vechicles_folder:0 "机械化步兵"
 r56_vechicles_folder_desc:0 "机械化步兵部队的装备。"
 etax_doctrine:0 "特殊研究部门"
 etax_doctrine_desc:0 "我们必须建立一个部门来集中我们的研究工作，使我们能够集中我们的军事和工业，以有利于国家的方式。"
 etax_army_focus:0 "重视陆军"
 etax_army_focus_desc:0 "我们的陆军是至关重要的，在陆军方面的研究必须最优先。"
 etax_navy_focus:0 "重视海军"
 etax_navy_focus_desc:0 "没有强大的海军，一个国家就会灭亡。这就是为什么我们必须尽全力扩大和加强我们的海军。"
 etax_air_focus:0 "重视空军"
 etax_air_focus_desc:0 "谁掌握了天空谁就掌握着一切。我们必须尽全力打造一个世界上最强大的空军。"
 etax_army_firepower:0 "提升轻武器火力"
 etax_army_firepower_desc:0 "火力既是真理。贯彻这一理念去加强我们的轻武器，这使得我们的士兵与敌人交火使能获得巨大优势。"
 etax_army_firepower_2:0 "提升重武器火力"
 etax_army_firepower_2_desc:0 "口径即是正义！我们将特别对重火力进行研究以提升其杀伤力。"
 etax_army_defense:0 "装甲部队"
 etax_army_defense_desc:0 "彻底发挥装甲部队的潜能，让其能够应付任何冲突。"
 etax_army_defense_2:0 "纵深防御"
 etax_army_defense_2_desc:0 "就算敌人的进攻势头非常猛烈，纵深设防，也能让他们彻底陷入泥潭。"
 etax_navy_firepower:0 "重点打击"
 etax_navy_firepower_desc:0 "对水手进行特别训练，有效提高他们的命中率。无坚不摧的舰炮若能精准打击目标区域，不仅可以对敌目标进行有效打击，对敌人的士气打击也是毁灭性的。"
 etax_navy_firepower_2:0 "协同打击"
 etax_navy_firepower_2_desc:0 "我们的海军知道如何打击和集中火力，即使是最有信心的反对派也能分崩离析。"
 etax_navy_defense:0 "加固装甲"
 etax_navy_defense_desc:0 "加厚装甲以应对敌人越来越大的舰炮口径以及空军的袭击。"
 etax_navy_defense_2:0 "区域防御"
 etax_navy_defense_2_desc:0 "将重点区块加厚防御，能让敌人对我们弱点的攻击所带来的损伤最小化。"
 etax_air_firepower:0 "支配天空"
 etax_air_firepower_desc:0 "没有人能够夺走属于我们的制空权。我们战机的速度远超敌军，他们根本无法追上。"
 etax_air_firepower_2:0 "轰炸机进攻"
 etax_air_firepower_2_desc:0 "轰炸机过境，唯有废墟存留。"
 etax_air_defense:0 "阶梯防御"
 etax_air_defense_desc:0 "将敌人的空中机群层层剥离，最终让敌人最脆弱的一部分进入我们的猎杀区，就如同羊入虎口那样。"
 etax_air_defense_2:0 "重视机动"
 etax_air_defense_2_desc:0 "只要打不中，威力再大也没有任何意义！"
 etax_the_means:0 "宣传手段"
 etax_the_means_desc:0 "永远不要忘记引领我们前进的伟大领袖！——如若我们的士兵能对自己的事业感到认可并且为此而骄傲，那么任何苦难都无法击倒他们。"
 etax_the_ends:0 "剑走偏锋"
 etax_the_ends_desc:0 "我们的优势就是做别人不敢做的事情。放宽眼界，我们会发现一片新的天地。"
 etax_business_interests:0 "商业投资"
 etax_business_interests_desc:0 "允许私人企业发展，将极大提高我们的工业。"
 etax_cost_plus:0 "效率保持"
 etax_cost_plus_desc:0 "只要资金不断流动，我们的企业将继续提供支持。"
 etax_production_in_depth:0 "扩大供应链"
 etax_production_in_depth_desc:0 "我们可以从大量的资源中抽出来建造我们的货物和设备。"
 etax_unity:0 "共同目标"
 etax_unity_desc:0 "若所有人都为了同一个目标而努力奋斗的话，那么部队的坚韧性将会无与伦比的高，并且达成目标的过程将不会再那么困难重重。"
 etax_broad_support:0 "综合性团队"
 etax_broad_support_desc:0 "我们可以从社会的各个角落招募，绝不会让任何人被排除在外。如果你还有一口气，就能参与战斗。"
 etax_inclusive_science:0 "科学团队"
 etax_inclusive_science_desc:0 "我们的科学家来自世界各地，文化的不同、意识形态的冲突——这些都不会阻拦我们的科学家一同合作对科学进行探索。"
 etax_desperation:0 "必要牺牲"
 etax_desperation_desc:0 "为了我们的目标，牺牲是必要的。"
 etax_no_qa:0 "加速生产"
 etax_no_qa_desc:0 "前线的急迫需要我们加快生产速度。通过增加数量，量变终会产生质变。"
 etax_expendable_labor:0 "全力建设"
 etax_expendable_labor_desc:0 "为了胜利我们将付出血与汗。"
 etax_glory:0 "战争荣耀"
 etax_glory_desc:0 "没有什么比战争的暴力美学更加震撼人心了。一个人如若经历过真正的战斗，并且经历了心灵的洗礼，那么他将尊重生命。"
 etax_purity:0 "精英部队"
 etax_purity_desc:0 "那些并不适合成为士兵的人将会退役。我们的军队只留下那些足够强大的人！"
 etax_great_leap:0 "科技协调"
 etax_great_leap_desc:0 "当其他人满足于自己的小努力时，我们并不害怕冒险，押注于未来将塑造我们世界的技术。"
 etax_grand_projects:0 "专业化工程"
 etax_grand_projects_desc:0 "你不能只靠手里的板砖比敌人的大来打胜仗。真正有用的是火炮和空袭。"
 etax_practical_projects:0 "实用工程"
 etax_practical_projects_desc:0 "我们的力量集中在基础上，并且已经想出了在供应链上下促进生产基本要素的方法。"
 etax_moonshot:0 "未来空军"
 etax_moonshot_desc:0 "我们专注于控制空中已经取得了一些真正了不起的进展。有了这一点，我们对天空的掌握绝对无可争议。"
 etax_super_soldiers:0 "超级战士"
 etax_super_soldiers_desc:0 "我们已经研制出一种小药物，它能让我们的士兵比人类正常情况下行动得更远、更快、时间更长。不幸的是，长期使用这些物质的副作用是会产生悲伤情绪。\n\n非民用，不得转售。"
 etax_the_bomb:0 "威慑武器"
 etax_the_bomb_desc:0 "我们的科学家们倾尽全力投入进一个绝对可怕却又绝妙的想法上。最终，它并未产生我们最初期望的成果，但通过它我们在各个研究领域都取得了无法估量的进步。"
 etax_seashot:0 "未来海军"
 etax_seashot_desc:0 "我们的战舰很可怕，除了最顽强的敌军外，都会被轻而易举地摧毁。"
 etax_quality:0 "优质制造"
 etax_quality_desc:0 "我们已经尽了一切努力，确保使用适当的工具和严格的测试以制造经久耐用的野战装备。"
 etax_great_works:0 "伟大工程"
 etax_great_works_desc:0 "大量的资金投入到将我们国家的能力推向极限，甚至超越极限。我们的经济和生产机构的一切都是为了激发人们的敬畏。"
 jaeger:0 "猎兵"
 jaeger_desc:0 "猎兵是专门在寒冷且荒凉的北方森林中生存的力量。通常这些部队均由当地人组成，训练时间较长。\n \n§G此类型部队不计入特种部队上限，且每个营需要5个支援装备§!"
 jungletroop:0 "丛林步兵"
 jungletroop_desc:0 "丛林步兵受过训练，可以承受丛林战争的严酷环境，并在敌人熟悉的环境条件下向其发起挑战。\n \n§G这种单位类型不计入特种部队上限，而是每个营需要 5 件支援装备§!"
 desertinfantry:0 "沙漠步兵"
 desertinfantry_desc:0 "在沙漠战斗时部队将面临诸多无法避免的危险。通过为我们的士兵提供针对该环境的专业训练来最大程度地降低这些风险。\n \n§G此类型部队不计入特种部队上限，且每个营需要5个支援装备§!"
 shocktroop:0 "突击步兵"
 shocktroop_desc:0 "突击部队可以粉碎敌人的防线，实现突围。这是任何纵深战的关键，能极大地扰乱防御方的阵脚。"
 jaegers:0 "猎兵 I"
 jaegers_desc:0 "猎兵是专门在寒冷且荒凉的北方森林中生存的力量。通常这些部队均由当地人组成，训练时间较长。\n \n§G此类型部队不计入特种部队上限，且每个营需要5个支援装备§!"
 jaegers2:0 "猎兵 II"
 jaegers2_desc:0 "只有我觉得外面很冷吗？\n \n§G此类型部队不计入特种部队上限，且每个营需要5个支援装备§!"
 jaegers3:0 "猎兵 III"
 jaegers3_desc:0 "只有我觉得外面很冷吗？\n \n§G此类型部队不计入特种部队上限，且每个营需要5个支援装备§!"
 jaegers4:0 "猎兵 IV"
 jaegers4_desc:0 "只有我觉得外面很冷吗？\n \n§G此类型部队不计入特种部队上限，且每个营需要5个支援装备§!"
 jaegers5:0 "猎兵 V"
 jaegers5_desc:0 "只有我觉得外面很冷吗？\n \n§G此类型部队不计入特种部队上限，且每个营需要5个支援装备§!"
 jaegers6:0 "猎兵 VI"
 jaegers6_desc:0 "只有我觉得外面很冷吗？\n \n§G此类型部队不计入特种部队上限，且每个营需要5个支援装备§!"
 jungletroops:0 "丛林步兵 I"
 jungletroops_desc:0 "丛林步兵受过训练，可以承受丛林战争的严酷环境，并在敌人熟悉的环境条件下向其发起挑战。\n \n§G这种单位类型不计入特种部队上限，而是每个营需要 5 件支援装备§!"
 jungletroops2:0 "丛林步兵 II"
 jungletroops2_desc:0 "丛林步兵接受过特殊训练，以应对丛林战争的恶劣条件与物资的频繁短缺。\n \n§G此类型部队不计入特种部队上限，且每个营需要5个支援装备§!"
 jungletroops3:0 "丛林步兵 III"
 jungletroops3_desc:0 "丛林步兵接受过特殊训练，以应对丛林战争的恶劣条件与物资的频繁短缺。\n \n§G此类型部队不计入特种部队上限，且每个营需要5个支援装备§!"
 jungletroops4:0 "丛林步兵 IV"
 jungletroops4_desc:0 "丛林步兵接受过特殊训练，以应对丛林战争的恶劣条件与物资的频繁短缺。\n \n§G此类型部队不计入特种部队上限，且每个营需要5个支援装备§!"
 jungletroops5:0 "丛林步兵 V"
 jungletroops5_desc:0 "丛林步兵接受过特殊训练，以应对丛林战争的恶劣条件与物资的频繁短缺。\n \n§G此类型部队不计入特种部队上限，且每个营需要5个支援装备§!"
 jungletroops6:0 "丛林步兵 VI"
 jungletroops6_desc:0 "丛林步兵接受过特殊训练，以应对丛林战争的恶劣条件与物资的频繁短缺。\n \n§G此类型部队不计入特种部队上限，且每个营需要5个支援装备§!"
 shocktroops:0 "突击步兵 I"
 shocktroops_desc:0 "突击步兵用于对敌方防线进行强力攻击，以便在特定地点取得突破。与普通步兵相比，这些单位具有更高的突破和对装甲杀伤。然而，突击步兵或冲锋队也有更高的补给消耗和更长的恢复时间。"
 shocktroops2:0 "突击步兵 II"
 shocktroops2_desc:0 "突击步兵用于对敌方防线进行强力攻击，以便在特定地点取得突破。与普通步兵相比，这些单位具有更高的突破和对装甲杀伤。然而，突击步兵或冲锋队也有更高的补给消耗和更长的恢复时间。"
 shocktroops3:0 "突击步兵 III"
 shocktroops3_desc:0 "突击步兵用于对敌方防线进行强力攻击，以便在特定地点取得突破。与普通步兵相比，这些单位具有更高的突破和对装甲杀伤。然而，突击步兵或冲锋队也有更高的补给消耗和更长的恢复时间。"
 shocktroops4:0 "突击步兵 IV"
