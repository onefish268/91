l_simp_chinese:
 znt.1.t: "来自非洲的来讯"
 znt.1.desc: "我们在王爵领地的实验室传来了一则好消息，‘莫比乌斯’计划已经到了距离成功的最后阶段，罗森堡教授请示是否继续完成该计划。"
 znt.1.a: "§R当然！我们将拥有数不尽的好工人。§!"
 znt.1.b: "还是算了吧，实验有太多的未知性。"
 znt.3.t: "来自作者的提醒"
 znt.3.desc: "这是关于末日彩蛋的开启弹窗，你可以选择该彩蛋是否启用。（该彩蛋内容尚未完善，请选择选项一）"
 znt.3.a: "还是算了吧。"
 znt.3.b: "§R我已经厌倦了战争......§!"
 znt.2.t: "本土来讯"
 znt.2.desc: "伦敦对实验有了进一步的指示，她们要求我们进一步投入一些非洲原住民进去，让实验顺利完成。"
 znt.2.a: "§R我们没有选择......§!"
 znt.2.b: "这不是陛下的本意吧？马上关停它们！"
 znt.4.t: "流行性疾病报告"
 znt.4.desc: "最近有大量的国民得了流行性感冒，哪怕是治好了也会二次甚至多次重新患病，这是个很奇怪的现象。"
 znt.4.a: "这些疾病不是早就绝迹了吗？"
 znt.5.t: "治安恶坏报告"
 znt.5.desc: "不知为何，国内的治安状况突然变得奇坏无比，非常多的市民开始漫无目的的破坏当地治安，警方已经接到了无数起寻衅滋事案件的报告。"
 znt.5.a: "这群刁民！"
 znt.6.t: "局势彻底败坏"
 znt.6.desc: "这不是普通的寻衅滋事，感冒也不是普通的感冒，得了病的人开始疯狂啃咬那些没得过病的人，全国上下充满了这些疯子！"
 znt.6.a: "采取紧急措施！"
 ZIM.news.4.t: "$news_event_background$南非自治领爆发大规模动乱"
 ZIM.news.4.d: "自昨日傍晚起，德兰士瓦省多地陆续爆发大规模暴力事件，数座城镇陷入混乱。\n\n事态始于比勒陀利亚郊区的一间诊所——据称数名被送入急诊室的病患突然陷入狂躁状态，攻击在场的医护人员及病人家属。随后类似事件在约翰内斯堡、德班及布隆方丹等地相继出现，骚动迅速蔓延至街区，商店被砸，车辆被推翻，部分区域传出枪声。\n\n南非自治领总理夏洛特·E·叶格在紧急内阁会议后发表简短声明，宣布德兰士瓦省及纳塔尔省部分地区进入紧急状态，并授权军队介入维持秩序，声明中未明确解释事件起因，仅称“正在调查一种疑似传染性病症的暴发”，并呼吁民众“保持冷静，留在室内，切勿轻信谣言”。"
 ZIM.news.4.a: "保卫我们的家园！"
 ZIM.news.4.b: "发生什么了？"