  super_event_7123:0 "审判之战"#PAM
  super_event_7123_QUOTE_LOC:0 "不敢承认软弱的国王啊，\n你赢得了全天下的敬畏，\n却连一次真心的眼泪都不会流下。"
  super_event_7123_QUOTE_SOURCE_LOC:0 "——§Y佚名§!"
  super_event_7123_CLOSED_LOC:0 "所以……连您也会感到害怕吗？"
  
  super_event_7124:0 "在这世界尽头，我们彼此相拥"#PAM
  super_event_7124_QUOTE_LOC:0 "手还冷吗？\n不冷了哦。\n那就抬起头，\n向前走吧。"
  super_event_7124_QUOTE_SOURCE_LOC:0 "——§Y来自莉兰迪亚§!"
  super_event_7124_CLOSED_LOC:0 "我们回家了哦"

