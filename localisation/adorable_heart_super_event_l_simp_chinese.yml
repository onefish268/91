l_simp_chinese:

#伟大战争

  super_event_1: "第二次“伟大战争”"
  super_event_1_QUOTE_LOC: "§R幻想乡必须团结起来对付她的敌人！§!"
  super_event_1_QUOTE_SOURCE_LOC: "——§G东风谷早苗§!"
  super_event_1_CLOSED_LOC: "世界开始燃烧"

  super_event_2: "第二次“伟大战争”"
  super_event_2_QUOTE_LOC: "那么，由我建立彷佛沉浸甜美蜜汁中的世界吧。让所有人都希望永远受我支配。\n让世界知道，只有屈服于我魔导王之下的永久繁荣。"
  super_event_2_QUOTE_SOURCE_LOC: "——§0安兹·乌尔·恭§!"
  super_event_2_CLOSED_LOC: "世界开始燃烧"

#魔导国
  super_event_3: "最终圣战"
  super_event_3_QUOTE_LOC: "（这个星球）闪闪发光，就像宝石箱一样。\n我来到这里，正是为了得到这谁都不曾得到的宝石箱。"
  super_event_3_QUOTE_SOURCE_LOC: "——§0安兹·乌尔·恭§!"
  super_event_3_CLOSED_LOC: "征服世界，或许会很有趣。"

#苏联

  super_event_4: "第二次“伟大战争”"
  super_event_4_QUOTE_LOC: "失去的是不可能再回来的，所以生命才显得那么珍贵，所以活着就是幸福。"
  super_event_4_QUOTE_SOURCE_LOC: "——§R木之本樱§!"
  super_event_4_CLOSED_LOC: "保卫苏维埃，保卫革命"

  super_event_5: "苏联介入大战"
  super_event_5_QUOTE_LOC: "失去的是不可能再回来的，所以生命才显得那么珍贵，所以活着就是幸福。"
  super_event_5_QUOTE_SOURCE_LOC: "——§R木之本樱§!"
  super_event_5_CLOSED_LOC: "保卫苏维埃，保卫革命"

  super_event_6: "苏联介入大战"
  super_event_6_QUOTE_LOC: "请不要松开紧握之手。请留在我的眼睛能看到的地方。只要听到我的声音，请随时都要回应我……我已经不想再失去了。"
  super_event_6_QUOTE_SOURCE_LOC: "——§R安娜斯塔西亚§!"
  super_event_6_CLOSED_LOC: "为了革命！为了女皇！"

  super_event_7: "苏联介入大战"
  super_event_7_QUOTE_LOC: "战斗的那个人我不想她有任何的名字。因为我们每一个人都在战斗，我们所有人都是斗士。\n不要低头跟着斗士走，不要！"
  super_event_7_QUOTE_SOURCE_LOC: "——§R塔露拉§!"
  super_event_7_CLOSED_LOC: "为了革命！"

  super_event_8: "苏联介入大战"
  super_event_8_QUOTE_LOC: "§R一步也不许后退！§!"
  super_event_8_QUOTE_SOURCE_LOC: "——§R（凛冬）索尼娅§!"
  super_event_8_CLOSED_LOC: "为了革命！"

  super_event_9: "苏联解体"
  super_event_9_QUOTE_LOC: "永别了，我们的红旗。你曾经是敌人，也是兄弟。你曾是战壕里的同志，整个欧洲的希冀；但你也是一座红色的铁幕，那后面藏着可怕的劳改集中营。"
  super_event_9_QUOTE_SOURCE_LOC: "——§Y叶夫图申科§!"
  super_event_9_CLOSED_LOC: "红色齿轮停止了转动"

  super_event_10: "团结在红旗下"
  super_event_10_QUOTE_LOC: "全世界无产者，联合起来！"
  super_event_10_QUOTE_SOURCE_LOC: "——§R卡尔·马克思§!"
  super_event_10_CLOSED_LOC: "国际苏维埃共和国万岁！共产主义万岁！"

  super_event_11: "苏维埃联盟挥师东进"
  super_event_11_QUOTE_LOC: "现在是时候让我们的士兵自己决定实现正义的方式了。"
  super_event_11_QUOTE_SOURCE_LOC: "——§R华西列芙酱§!"
  super_event_11_CLOSED_LOC: "她们要在西伯利亚打陆战？"

#罗马尼亚

  super_event_12: "巴尔干统一"
  super_event_12_QUOTE_LOC: "我宁愿活在大巴尔干的地狱里，也不愿活在小罗马尼亚的天堂里。"
  super_event_12_QUOTE_SOURCE_LOC: "——§R奥尔加·伊兹卡§!"
  super_event_12_CLOSED_LOC: "巴尔干之梦得以实现"

#魔联（旧）

  super_event_13: "苏联阴云"
  super_event_13_QUOTE_LOC: "我保证，我一定会救你。\n无论重来多少次，我都一定会守护你！"
  super_event_13_QUOTE_SOURCE_LOC: "——§R晓美焰§!"
  super_event_13_CLOSED_LOC: "巨人间的博弈"

  super_event_14: "伪世的物语"
  super_event_14_QUOTE_LOC: "这才是人类感情的极致。比希望更加炙热，比绝望更加深沉--§R爱§!！"
  super_event_14_QUOTE_SOURCE_LOC: "——§R晓美焰§!"
  super_event_14_CLOSED_LOC: "她是疯了吗？"

  super_event_15: "圆环之理降临"
  super_event_15_QUOTE_LOC: "如果有人说怀有希望是错误，我会无数次反驳“不是这样的”，不管到什么时候。"
  super_event_15_QUOTE_SOURCE_LOC: "——§R鹿目圆香§!"
  super_event_15_CLOSED_LOC: "圆神能拯救魔联吗？"

#日本

  super_event_16: "超日本帝国建立"
  super_event_16_QUOTE_LOC: "那么，不想一起看看吗。那天，与您所约定的那个未来…呐"
  super_event_16_QUOTE_SOURCE_LOC: "——§Y柴神§!"
  super_event_16_CLOSED_LOC: "不知道一些事情，就可以幸福生活下去"

  super_event_17: "樱花帝国北进俄罗斯"
  super_event_17_QUOTE_LOC: "使樱花天赋之类，传遍八纮一宇！"
  super_event_17_QUOTE_SOURCE_LOC: ""
  super_event_17_CLOSED_LOC: "她们要在西伯利亚打陆战？"

#南美

  super_event_18: "南美战争"
  super_event_18_QUOTE_LOC: "我们需要的，不是一块面包！而是一个生存空间！一个民族的生存空间！这生存空间，不是靠乞求和抗议来实现的，而是靠铁和血来实现的！"
  super_event_18_QUOTE_SOURCE_LOC: "——§Y世羽·波拿文都拉§!"
  super_event_18_CLOSED_LOC: "谁又会关心南美？"
  
  super_event_19: "南美统一"
  super_event_19_QUOTE_LOC: "智利万岁！\n人民万岁！\n工人万岁！"
  super_event_19_QUOTE_SOURCE_LOC: "——§R萨尔瓦多·阿连德§!"
  super_event_19_CLOSED_LOC: "团结的人民永不败！"

#德国

  super_event_20: "第二次“伟大战争”"
  super_event_20_QUOTE_LOC: "我们不为奴役而战！我们为自由而战！我们不是机器，不是牛马，我们是人！是从来没有屈服过的日耳曼人！"
  super_event_20_QUOTE_SOURCE_LOC: "——§Y阿道夫·莉莎§!"
  super_event_20_CLOSED_LOC: "流亡者归来"

  super_event_21: "轴心国介入大战"
  super_event_21_QUOTE_LOC: "我们不为奴役而战！我们为自由而战！我们不是机器，不是牛马，我们是人！是从来没有屈服过的日耳曼人！"
  super_event_21_QUOTE_SOURCE_LOC: "——§Y阿道夫·莉莎§!"
  super_event_21_CLOSED_LOC: "流亡者归来"

  super_event_22: "德意志归来"
  super_event_22_QUOTE_LOC: "从马斯到梅梅尔，从埃施到贝尔特，德意志，德意志，高于一切，高于世间所有万物。"
  super_event_22_QUOTE_SOURCE_LOC: "——§Y《德意志之歌》§!"
  super_event_22_CLOSED_LOC: "Es lebe Deutschland!"

  super_event_23: "大德意志统一"
  super_event_23_QUOTE_LOC: "新德国不属于任何阶级、任何团体，而是属于德国全体人民。她将帮助肯与我们和平相处的民族。"
  super_event_23_QUOTE_SOURCE_LOC: "——§Y阿道夫·莉莎§!"
  super_event_23_CLOSED_LOC: "当人民呼唤恶魔，说明天堂已为谎言。"

  super_event_24: "德意志之死"
  super_event_24_QUOTE_LOC: "人类在永恒的斗争中壮大，\n在永恒的和平中毁灭。"
  super_event_24_QUOTE_SOURCE_LOC: "——§Y阿道夫·莉莎§!"
  super_event_24_CLOSED_LOC: "谁来救救德国？"

  super_event_25: "德国革命"
  super_event_25_QUOTE_LOC: "我承认我是反对饥饿与剥削的煽动者；\n我承认我是反对战争的簇拥者；\n我们的口号是：\n联合起来，再联合起来！"
  super_event_25_QUOTE_SOURCE_LOC: "——§R惣流·明日香·兰格雷§!"
  super_event_25_CLOSED_LOC: "太阳从未如此美丽,在德国照耀"

  super_event_26: "欧洲统一"
  super_event_26_QUOTE_LOC: "终有一日，幻想乡、意呆莉、圣杯、俄罗斯、德意志，所有的民族在不丧失她们特性的前提下，结合成超越一切的共同体。"
  super_event_26_QUOTE_SOURCE_LOC: "——§R维克多·雨果§!"
  super_event_26_CLOSED_LOC: "欧罗巴不再有压迫！"

  super_event_27: "黑日计划"
  super_event_27_QUOTE_LOC: "别露出那种绝望的表情呀……\n魔法少女的光辉，只有在被恐惧和愉悦反复蹂躏时，才会绽放出最凄绝的美感。\n来吧，让我看看你们还能坚持多久？"
  super_event_27_QUOTE_SOURCE_LOC: "——§0柊舞缇娜§!"
  super_event_27_CLOSED_LOC: "晚安，各位“正义的伙伴”。"

#瑞典（旧）

  super_event_28: "北欧联盟成立"
  super_event_28_QUOTE_LOC: "你能否明白潜藏于内心的黑暗\n在那空无一物之中，我仍在不断寻找\n....你有梦想吗？\n很遗憾，我没有那种东西。"
  super_event_28_QUOTE_SOURCE_LOC: "——哎？你问我吗？"
  super_event_28_CLOSED_LOC: "我的名字是“不吉波普”"

  super_event_29: "天启之国复辟"
  super_event_29_QUOTE_LOC: "别去奢望什么，别去指望什么\n将今天染上青色的太阳\n将白天和时间停止吧..."
  super_event_29_QUOTE_SOURCE_LOC: "——玛莉·蓓尔·布列格"
  super_event_29_CLOSED_LOC: "命运的齿轮加快了转动"

#圣杯

  super_event_30: "大萧条"
  super_event_30_QUOTE_LOC: "国王拉响汽笛，\n首相敲起钟。\n金融城发出信号，\n圣杯往地狱里冲！"
  super_event_30_QUOTE_SOURCE_LOC: "——伦敦儿歌"
  super_event_30_CLOSED_LOC: "千百万人必须像畜生一样才能活命"

#幻想乡

  super_event_31: "幻想乡统一"
  super_event_31_QUOTE_LOC: "看吧，琪露诺果然是最强的！"
  super_event_31_QUOTE_SOURCE_LOC: "——§R琪露诺§!"
  super_event_31_CLOSED_LOC: "那个笨蛋？"

  super_event_32: "幻想乡统一"
  super_event_32_QUOTE_LOC: "那图案(红雾异变)是从一处延展出的数条纤维，要把幻想乡包住似的，如同天使的翅膀一般。"
  super_event_32_QUOTE_SOURCE_LOC: ""
  super_event_32_CLOSED_LOC: "斯卡蕾特的荣光重照幻想乡"

  super_event_33: "幻想乡统一"
  super_event_33_QUOTE_LOC: "万物都有个叫“目”的东西。在那里啪的捅一下的话就轰隆～的哦。\n所有的东西的“目”都在我的右手上，所以啪地一捏就可以……"
  super_event_33_QUOTE_SOURCE_LOC: "——§Y芙兰朵露·斯卡蕾特§!"
  super_event_33_CLOSED_LOC: "斯卡蕾特的荣光重照幻想乡"

  super_event_34: "幻想乡统一"
  super_event_34_QUOTE_LOC: "科学绝不是一种自私自利的享受。\n有幸能够致力于科学研究的人，首先应该拿自己的学识为人类服务。"
  super_event_34_QUOTE_SOURCE_LOC: "——§R卡尔·马克思§!"
  super_event_34_CLOSED_LOC: "我が河童の科学力は幻想乡一イイイイ！！"

 #早苗加冕
  super_event_35: "东风谷早苗加冕"
  super_event_35_QUOTE_LOC: "在幻想乡被常识束缚可不行！"
  super_event_35_QUOTE_SOURCE_LOC: "——§S东风谷早苗§!"
  super_event_35_CLOSED_LOC: "皇帝万岁！帝国万岁！人民万岁！"

 #灵梦
  super_event_36: "百花月大革命"
  super_event_36_QUOTE_LOC: "万里河山红烂漫，\n百花月革命胜利辉煌，\n工人阶级领导一切，\n七千万人民斗志昂扬。"
  super_event_36_QUOTE_SOURCE_LOC: "——§R《我们走在大路上》§!"
  super_event_36_CLOSED_LOC: "百花月大革命万岁！"

##中国

  super_event_37: "中原王朝危机"
  super_event_37_QUOTE_LOC: "国破山河在，城春草木深。\n感时花溅泪，恨别鸟惊心。"
  super_event_37_QUOTE_SOURCE_LOC: "——§Y杜甫§!"
  super_event_37_CLOSED_LOC: "让雄狮就此长眠"

  super_event_38: "中国统一"
  super_event_38_QUOTE_LOC: "民为贵，社稷次之，君为轻。"
  super_event_38_QUOTE_SOURCE_LOC: "——§Y孟子§!"
  super_event_38_CLOSED_LOC: "古老帝国的前进"

  super_event_39: "中国统一"
  super_event_39_QUOTE_LOC: "秦王扫六合，虎视何雄哉！\n挥剑决浮云，诸侯尽西来。"
  super_event_39_QUOTE_SOURCE_LOC: "——§Y李白§!"
  super_event_39_CLOSED_LOC: "皇帝万岁！"

  super_event_40: "中国统一"
  super_event_40_QUOTE_LOC: "中华雄立宇宙间，廓八埏，华胄来从昆仑巅，江湖浩荡山绵连，共和五族开尧天，亿万年。"
  super_event_40_QUOTE_SOURCE_LOC: "——§Y《中华雄立宇宙间》§!"
  super_event_40_CLOSED_LOC: "大元帅万岁！"

  super_event_41: "中国统一"
  super_event_41_QUOTE_LOC: "只要站在民族的立场上，维护民族的大局，不管抱什么政治观点，包括骂帝国的人，都要大团结。"
  super_event_41_QUOTE_SOURCE_LOC: "——§C黎星刻§!"
  super_event_41_CLOSED_LOC: "和平建国，团结民主。"

  super_event_42: "神州革命君主制"
  super_event_42_QUOTE_LOC: "我深信君主社会主义最终是可行的。凡是实行君主社会主义的政治家都将会崭露头角。"
  super_event_42_QUOTE_SOURCE_LOC: "——§Y奥托·冯·俾斯麦§!"
  super_event_42_CLOSED_LOC: "中国人都疯了？"

  super_event_43: "神州和平革命"
  super_event_43_QUOTE_LOC: "改革是中国的第二次革命。\n这是一件很重要的必须做的事，\n尽管是有风险的事。"
  super_event_43_QUOTE_SOURCE_LOC: "——§P周恩莱§!"
  super_event_43_CLOSED_LOC: "谁主沉浮？人民。"

  super_event_44: "中国统一"
  super_event_44_QUOTE_LOC: "我对国内将来的事充满了理想和希望。我不能不想中国，更不能忘掉中国。我觉得，如果真的忘记祖国，人生该是多么没有趣啊！"
  super_event_44_QUOTE_SOURCE_LOC: "——§Y宋庆龄§!"
  super_event_44_CLOSED_LOC: "中国已如腾飞之龙"

  super_event_45: "中国统一"
  super_event_45_QUOTE_LOC: "各种勃勃生机，万物竞发的境界尤在眼前。"
  super_event_45_QUOTE_SOURCE_LOC: "——§Y蒋介石§!"
  super_event_45_CLOSED_LOC: "迈向新时代！"

  super_event_46: "中国统一"
  super_event_46_QUOTE_LOC: "积大胜而败,不如积小胜而大胜。"
  super_event_46_QUOTE_SOURCE_LOC: "——§Y戴春风§!"
  super_event_46_CLOSED_LOC: "迈向新时代！"

  super_event_47: "中国再次陷入战火"
  super_event_47_QUOTE_LOC: "一寸山河一寸血，十万青年十万兵！"
  super_event_47_QUOTE_SOURCE_LOC: "——§Y蒋介石§!"
  super_event_47_CLOSED_LOC: "中国不再软弱！"

  super_event_48: "中国统一战线"
  super_event_48_QUOTE_LOC: "为祖国生命而战！\n为民族生存而战！\n为国家独立而战！\n为领土完整而战！"
  super_event_48_QUOTE_SOURCE_LOC: "——§Y《告全体同胞书》§!"
  super_event_48_CLOSED_LOC: "宁为战死鬼，不作亡国奴。"

 #大帅
  super_event_49: "中国统一"
  super_event_49_QUOTE_LOC: "忠之本义，忠于一国，非忠于一人也。人人以国为本位，勿以一身一家为本位，乃能屈小己以利大群"
  super_event_49_QUOTE_SOURCE_LOC: "——§Y袁世凯§!"
  super_event_49_CLOSED_LOC: "有恒心，然后有恒业"

 #少帅
  super_event_50: "中国统一"
  super_event_50_QUOTE_LOC: "我们只愿在真理的圣坛之前低头，不愿在一切物质权威之前拜倒。真的猛士，敢于直面惨淡的人生，敢于正视淋漓的鲜血。"
  super_event_50_QUOTE_SOURCE_LOC: "——§Y鲁迅§!"
  super_event_50_CLOSED_LOC: "民主之梦，虽暗犹明"

 #中国解放战争
  super_event_51: "中国解放战争"
  super_event_51_QUOTE_LOC: "中国必须独立，中国必须解放，\n中国的事情必须由中国人民自己作主张，\n自己来处理，不容许任何帝国主义国家再有一丝一毫的干涉。"
  super_event_51_QUOTE_SOURCE_LOC: "——§R毛润芝§!"
  super_event_51_CLOSED_LOC: "宜将剩勇追穷寇，不可沽名学霸王。"

 #毛润芝
  super_event_52: "中国统一"
  super_event_52_QUOTE_LOC: "让那些内外反动派在我们面前发抖罢，让他们去说我们这也不行那也不行罢，中国人民的不屈不挠的努力必将稳步地达到自己的目的。"
  super_event_52_QUOTE_SOURCE_LOC: "——§R毛润芝§!"
  super_event_52_CLOSED_LOC: "虎踞龙盘今胜昔，天翻地覆慨而慷。"

 #陈独秀
  super_event_53: "中国统一"
  super_event_53_QUOTE_LOC: "真的民主政治，绝不是和平方法可以实现的，只有工人贫农、一切劳苦大众以血来推翻整个的榨取阶级，实现立法权力和执行权力合一化的苏维埃政制，才能够表现出来。"
  super_event_53_QUOTE_SOURCE_LOC: "——§R陈独秀§!"
  super_event_53_CLOSED_LOC: "消灭一切压迫与榨取！"

 #布
  super_event_54: "中国统一"
