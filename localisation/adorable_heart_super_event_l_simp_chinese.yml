  super_event_7121_QUOTE_LOC:0 "闭上眼吧，\n我的乖孩子，\n明天的阿德莱希,\n会比以往都要幸福。"
  super_event_7121_QUOTE_SOURCE_LOC:0 "——§1夜莺§!"
  super_event_7121_CLOSED_LOC:0 "睡吧...睡吧......"

  super_event_7122:0 "致以生者的抗争"#PAM
  super_event_7122_QUOTE_LOC:0 "不管你还要跌倒多少次，不管你还要对着那些再也回不来的人哭多久。\n我都会站在你的身边，把那些围过来的黑暗一剑一剑劈开。"
  super_event_7122_QUOTE_SOURCE_LOC:0 "——§9小果子§!和§t露西莉亚§!"
