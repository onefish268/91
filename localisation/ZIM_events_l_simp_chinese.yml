l_simp_chinese:
 ZIM.1.t: "新的一年"
 ZIM.1.desc: "新年的第一缕晨光，刺破高原的清冷薄雾，沉冷地落在索尔兹伯里总督府肃穆的白色廊柱上。整座都城寂静规整，没有半分新年的喧闹，唯有制度化的清冷秩序绵延至远方。伊菲尔准时睁眼，神色淡漠无波。对她而言，从无节日松懈一说，罗德西亚这片南疆富庶领地的稳定、秩序与殖民利益，永远是凌驾于节庆与私情之上的唯一要务。\n总督府庭院早已完成清扫，草坪被修剪得毫厘规整，如同这座自治领贯穿始终的铁律——容不得半点无序与散漫。伊菲尔换上制式森严的总督制服，冷调的肩章在晨光下泛着冰冷的金属光泽，面容沉静凌厉，眼神锐利如刃。她对着镜面抚平褶皱，没有柔软的期许，只有冰冷的笃定：新的一年，必须牢牢攥住这片土地的资源、秩序与控制权，守住白人自治阶层的绝对主导地位，压下一切动荡隐患。\n早餐简洁克制，全程沉默无声，每一样产自本土的农牧产品，都是这片殖民地供给上层自治体系的固有产出，是秩序与管控带来的收益，而非温情的馈赠。用餐间隙，机要秘书俯身低声汇报新年首日要务：北部牧区越冬物资管控、矿区复工的安保督查、内阁年度管控规划会议、以及对英方的外交报备文书。伊菲尔面无表情听罢，逐项敲定优先级，心底从无体恤怀柔，只有一套严苛的治理逻辑：资源稳则国库稳，管控严则疆域安，所有安稳，皆靠铁规高压维系。"
 ZIM.1.a: "“唯有我才能为这片土地带来和平”"
 ZIM.2.t: "总督的新年演讲"
 ZIM.2.desc: "新年正午，索尔兹伯里总督府广场人山人海。晴空万里，高原的日光白得刺眼，将整齐列队的自治军、森严的军警防线、规整的官方观礼台照得纤毫毕现。这是罗德西亚自治领一年一度的新年公开致辞，是殖民权威对整片南疆领地的公示与震慑。\n伊菲尔身着笔挺的深色总督制服，肩章鎏金冷冽，面容苍白冷峻，眼底没有半分温情。她缓步走上演讲台，台下鸦雀无声，唯有风掠过旗杆的低响。她不需要掌声，不需要拥戴。她只需要服从。话筒电流微响，她的声音低沉、平稳、毫无温度，透过扩音设备碾压过整座广场，传遍首府每一条街道。\n“诸位，新年已至。”\n“外界战火不息，列强博弈纷扰，非洲大地遍地动荡。唯有罗德西亚，仍守秩序、稳产出、固疆土。很多人将这份安稳视作理所当然。但我告诉你们，这片土地从无天生的太平，所有富庶、所有安定、所有存续，皆来自铁与秩序的镇压与管束。”\n白人移民因费特无聊的看着台上的少女，总督连演讲稿都不需要，因为这些年来她说的都是同一段话，连一个字都没改。但她又不得不站在这儿，因为宪兵把每家每户的人都强制性拉了过来。\n快点结束吧，我还要回家洗衣服，因费特想到。\n忽然，她看到一个非洲土著民举起了什么东西，她还没来得及看清那是什么，紧接着传来了一声枪响，广场上的人顿时乱成一团。"
 ZIM.2.a: "“发生什么了？”"
 ZIM.3.t: "任期将近"
 ZIM.3.desc: "伊菲尔站在总督府落地窗后，俯瞰着脚下整座规整、死寂、被她亲手驯化的索尔兹伯里城，心底没有不舍，只有一种冰冷的、近乎执拗的不安。\n外人只看见罗德西亚年年安稳、矿产充盈、疆土无乱，看见她坐镇南疆数年，铁腕稳局，从无败绩。但只有她清楚，这片土地的平静从来不是自觉，是她用层层管控、高压规制、铁血镇压硬生生压出来的假象。\n她从不信任所谓的权力平稳过渡，更不信温和治理能稳住罗德西亚。这片土地只认强权，只服铁序，百年自治领的根基，从来都是上层的绝对掌控与底层的绝对服从。下一任继任者未必有她的狠厉、她的稳健、她对殖民秩序极致的坚守。伊菲尔最怕的从不是卸任，而是她耗尽数年筑起的铁塔，会在她离开后轰然崩塌，她守住的富庶疆土、规整体系，会被软弱与妥协彻底摧毁。"
 ZIM.3.a: "“距离总督任期结束，仅剩最后数月。”"
 ZIM.4.t: "本土消息"
 ZIM.4.desc: "远在欧洲的圣杯王国，经济危机已然山雨欲来，濒临爆发临界点。\n作为旧大陆老牌强权、曾经凭借圣杯战争红利与骑士贵族体系稳固霸权的欧洲核心势力，圣杯王国的繁荣早已透支殆尽。连年战事损耗、贵族体系臃肿、财政赤字堆叠、货币信用持续崩塌，曾经辐射欧洲的贸易链条彻底断裂。密报明确标注：产业停滞、物价飞涨、国库空虚，上层贵族派系割裂、底层民生暴动频发，整个王国的经济体系已撑不住残局，一场足以撼动旧大陆格局的系统性危机，数月之内必然全面引爆。\n于罗德西亚而言，这绝非遥远的域外风波。"
 ZIM.4.a: "“还能更糟糕一点吗？”"
 ZIM.5.t: "视察经济"
 ZIM.5.desc: "甩开所有幕僚的劝阻，伊菲尔临时驱车出城视察经济产区。\n新年伊始，罗德西亚的矿区与农垦带本该全速开工、产销两旺，这是她定下的年度开局铁律。可今日亲眼所见，却令她出乎意料。城郊铬矿矿区的开采进度明显放缓，精炼厂的烟囱吞吐着稀薄的白烟，产能较去年同期已经回落一截。工人们低头劳作，眼神里不再是顺从的麻木，而是藏不住的倦怠与怨怼。线报所言非虚，底层人心早已松动，只是靠着军警高压强行压制。更致命的是库房囤积的成品矿产堆积如山，货运车场空空荡荡——对外贸易的通道，已经随着圣杯王国经济崩盘的预演，开始被动锁死。\n驻场官员一路紧随，低声上报海外订单锐减、外资采购撤单、跨境结算延期的现状，言语间满是慌乱。他们寄希望于政府出台怀柔安抚政策、放宽管控、让步维稳。\n伊菲尔一言不发，只是冷眼扫视整片厂区。"
 ZIM.5.a: "“不过是一些下等人罢了。”"
 ZIM.6.t: "视察军队"
 ZIM.6.desc: "伊菲尔驱车直奔城郊野战军驻训基地。经济将衰、暗流四起的乱世前夕，唯有军队，是她最后的底牌，也是罗德西亚殖民秩序最坚硬的獠牙。\n冬日高原的风凛冽刺骨，整片训练场黄沙肃寂。罗德西亚自治军列阵肃立，白人士官挺拔冷峻，本土征募士兵站姿规整，枪械寒光整齐划一。这是总督一手整编、一手规制的部队，纪律、杀伐、服从性，皆是她数年严苛打磨的成果。她从不信赖民心，从不信赖贸易，只信赖这支绝对听命于总督府、凌驾本土族群之上的武装力量。伊菲尔缓步穿行阵列之间，指尖拂过冰冷的步枪枪托，目光逐一扫过士兵的眉眼。士官阶层依旧沉稳坚定，忠于自治体系、忠于殖民秩序，是稳固的核心战力。但底层本土士兵的眼底，已经悄然滋生出涣散与犹疑。他们生于这片土地、长于这片土地，耳闻邻里怨怼，目睹民生困顿，更清楚总督的任期即将结束。忠诚开始松动，服从开始被动，高压维系的军心，同经济、民心一样，悄然出现了裂痕。\n驻防司令官紧随身侧，低声汇报全军战备完好、执勤到位、无违规异动，试图用制式报表掩盖细微的军心浮动。"
 ZIM.6.a: "“我无人可托付，亦无心可托付。”"
 ZIM.7.t: "视察地方"
 ZIM.7.desc: "今早上车之前，伊菲尔刚阅完一份来自本土基层的绝密急报。文字潦草、层层加密，是军警线安插在城郊原住民聚落、矿区劳工社区的眼线传回的最后预警：底层的躁动已经不再是私下的怨怼，而是形成了隐秘的串联。\n城市定居的劳工、被征地的农牧民、被严苛管控压制数年的本土群体，借着任期将尽的窗口期暗自聚拢，她们笃定旧秩序即将落幕，笃定离任前夕的总督必然心力松懈、管控虚化。情报罗列得清晰冰冷：匿名集会、私藏武器的苗头、针对白人自治阶层的仇视宣言，还有一句反复出现的暗语——“等铁手倒下”。幕僚劝她暂缓公开演讲、临时加派城防、低调度过新年，避免激化矛盾。\n她只是抬手驳回了所有建议。\n伊菲尔太了解这片土地的本土族群。她们温顺是假象，隐忍是蛰伏，唯有绝对的高压与持续的威慑才能镇住根基深处的暴乱天性。数年铁腕治理，她压平了无数次暗流，可只要她显露一丝退让、一次规避、一点心虚，所有被压制的怨恨就会瞬间沸腾反扑。任期将近，他们盼着她疲软，盼着她落幕，盼着自治领的铁规随她的离任一同作废。那她偏要在万众瞩目之下，在首府最核心的广场，当着军警、官僚、所有窥伺者的面，重申一次她的秩序。哪怕暗流汹涌，哪怕杀机暗藏。"
 ZIM.7.a: "“既然守不住长久，那便在我尚存权柄的最后时刻，再一次用威严震住军心、压死躁动、钉死秩序。”"
 ZIM.8.t: "专员来访"
 ZIM.8.desc: "副官匆匆赶来，神色紧绷，低声呈报了一桩临时突发的外事通报：圣杯王国驻外经济专员，未经提前报备，已携随员抵达总督府前厅，要求即刻面见总督。\n伊菲尔闻言，眼底寒意更重。\n刚收到圣杯王国全盘经济崩盘的密报，今日专员便仓促登门，时机巧合得刺眼。她太清楚旧大陆强权的行事逻辑——自身危机燎原在即，无暇维系海外领地贸易，便会急于收拢最后利益、转嫁危机、胁迫附庸自治领分担损耗。\n对方神色疲惫焦躁，礼服褶皱凌乱，眼底掩不住国库枯竭、国内动荡的狼狈，早已没了往日欧洲强权使节的傲慢从容。专员开门见山，语气带着急迫的妥协与强硬：圣杯王国国内市场崩溃、货币失信，已无力继续收购罗德西亚矿产与农牧产能；为维系双方“传统盟约”，要求罗德西亚自治领单方面延后结算、无偿储备战略资源，并追加对圣杯王国的无息援助贷款，用以填补其本土财政窟窿。\n“总督阁下，这是王国最后的求援，也是自治领维系宗主庇护的唯一代价。”专员试图以旧日层级施压，语气却藏不住底气匮乏的虚弱。"
 ZIM.8.a: "“我不想听这些。”"
 ZIM.9.t: "陛下的信"
 ZIM.9.desc: "临走前，专员似乎想起了什么，从烫金公文信封中取出一页做工精致、笔迹端庄的亲笔信——那是阿尔托莉雅陛下的新年慰问信。\n纸面油墨留香，措辞温厚优雅，是王室一贯的矜重体面。陛下在信中言及深知南疆驻守苦寒，感念总督数年镇守罗德西亚、稳固海外殖民疆土的辛劳，体恤她任期将满、履职维艰，遥祝她新年安康、履职顺遂，并期许罗德西亚与圣杯王国的百年羁绊恒久不变、邦谊稳固。\n伊菲尔指尖抚过平整的信纸，心底翻涌着近乎讽刺的荒芜。王室心知自身无力再庇护海外自治领，无力维系贸易体系，更无力插手非洲局势，昔日的宗主霸权早已名存实亡。可阿尔托莉雅陛下不愿撕破体面，不愿承认帝国落幕的事实。陛下用一纸温柔御笔，替濒临崩塌的王国留住宗主名分，用轻飘飘的关怀枷锁，将自己和风雨飘摇的罗德西亚死死钉在即将倾覆的殖民体系之上。她不言危机、不告溃败、不议援助，只用温情话术稳住自己，让她在任期最后的绝境里，依旧背负着王国附庸的枷锁，独自扛下所有内忧外患。"
 ZIM.9.a: "“落幕之时，王室不谈责任，只讲恩情。”"
 ZIM.news.1.t: "                                     罗德西亚总督“铁手”伊菲尔新年演说遇刺"
 ZIM.news.1.d: "在圣杯王国全境经济危机全面发酵、海外殖民管控体系濒临解体的关键节点，非洲南部核心自治领——罗德西亚自治领发生顶级政治暗杀事件。深耕南疆多年、以铁腕集权统治稳固区域秩序的总督伊菲尔，于新年官方公开演讲落幕瞬间遭本土激进势力枪击重伤。\n业内地缘分析师指出，伊菲尔的倒下，是旧殖民时代的落幕符号。她是旧体系最坚定的维护者，以铁腕撑起了罗德西亚数十年的稳定，却也依托殖民层级制度制造了长久的对立与不公。当宗主国自顾不暇、无力维稳兜底，当经济萧条渗透基层、民生困境持续加剧，依靠高压维系的秩序必然轰然崩塌。\n目前，罗德西亚全境已进入临时军政戒备状态。随着铁腕总督倒下、旧有管控体系出现断层，叠加圣杯王国持续输出的经济危机、邻居的地缘觊觎，南部非洲局势已然进入高度不确定状态。原本稳固的自治领格局彻底松动，本土独立思潮、列强渗透博弈、内部权力派系争斗同步抬头，这片非洲最稳定的沃土，即将迎来数十年未有之大变局。"
 ZIM.news.1.a: "她早该走了"
 ZIM.news.1.b: "噢，不"
 ZIM.news.1.C: "旧时代的铁序守护者死于自己坚守的秩序裂痕之中"
 ZIM.10.t: "无力挽回"
 ZIM.10.desc: "总督倒下之后，由于过去的25年里她一直亲历亲为，我们甚至连合适的继承人也没有，这导致我们做不了任何事来挽回所有的一切！"
 ZIM.10.a: "不......."
 ZIM.11.t: "崩溃"
 ZIM.11.desc: "伊菲尔总督在世之日，罗德西亚的安稳从来不是源于民心归顺，不是源于体系合理，而是源于一人之铁腕、一人之威压、一人之决断。整片南疆的秩序、层级、军纪、经济管控、边境维稳，全部死死锚定在总督个人的权威之上。\n正因所有平衡全系于她一人，所以她的死亡，不是单一的政治暗杀，而是罗德西亚整个自治体系的瞬间失锚。"
 ZIM.11.a: "§G以老大的名义！§!(推荐游玩该国家)"
 ZIM.11.b: "以自治的名义！"
 ZIM.11.c: "以国家的名义！"
 ZIM.11.d: "以金钱的名义！"
 ZIM.11.e: "§C以陛下的名义！§!(强烈推荐游玩该国家)"
 ZIM.11.f: "以人民的名义！"
 ZIM.11.g: "以神的名义！"
 ZIM.news.2.t: "                                     一心会统一罗德西亚"
 ZIM.news.2.d: "随着前罗德西亚自治领总督伊菲尔遇刺身亡，依托英式殖民高压维系的南疆稳定体系彻底崩塌。短暂的权力真空、阶层对立总爆发、宗主国危机外溢、列强地缘渗透，直接引爆全境大规模内战。历经数周派系混战、疆域割据、武力清场，本土极端民族法西斯派系最终击溃自由派文官、旧殖民军警、本土激进民权武装等所有势力，以铁血手段完成全境统一，正式终结罗德西亚百年自治史，诞生南部非洲首个法西斯集权政权。\n目前，该派系已正式宣告全境统一，废除原罗德西亚自治领所有英式宪政体制与殖民层级规则，取缔一切民间结社与反对派势力，建立高度集权的法西斯独裁政体，实行党国一体、军政合一、资源统制、社会严控的全新治理模式。"
