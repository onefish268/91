 ZIM.13.t: "推迟"
 ZIM.13.desc: "巴黎卡是索尔兹伯里一名杂货铺老板，店铺开在总督府正前方那条街的转角处，位置说不上好也说不上差。\n\n每年1月1日，他都会把店门口那把旧藤椅搬到人行道上，坐在那里，一边晒太阳一边听总督的新年演讲。演讲通常从上午十点开始，持续大约二十分钟。演讲结束之后，人群会沿着街往各个方向散去，有些人会顺路拐进他的铺子里买一包香烟或者一盒火柴。他的1月1日一向是这样过的。已经过了二十三年了。\n\n1月1日那天，他像往常一样坐着，总督府的旗杆上升了旗，但露台上没有人影，也没有扩音器的回声从广场方向传来。巴黎卡在藤椅上坐到了中午，晒得后背发烫，没有等到演讲。下午他去市政厅门口的公告栏看了一眼，没有张贴任何关于演讲延迟的说明。他问了一个在街角巡逻的警察，警察说“不知道，上面没通知”，表情像是真的不知道。\n\n而现在已经过去6天了。"
 ZIM.13.a: "她去哪了？"
 ZIM.14.t: "医院里"
 ZIM.14.desc: "秘书哈罗德在抢救室外面来回踱步。走廊的灯管有一盏在闪，每隔七八秒就“嗡”地暗一下，又亮起来，像某种慢性病的脉搏。他数了——从护士推门进去到现在，那盏灯闪了大概一百四十次。他停下来，用鞋底蹭了蹭地板，然后又开始走。\n\n他其实不知道该用什么表情来站在这里。焦急？他对伊菲尔爵士没有感情。他和她之间从没聊过工作以外的事，她甚至没问过他家里几口人、老家在哪。悲痛？谈不上。她活着或死了，对他的生活来说更像一次职位调整，而不是丧失。但她给的工资确实是他在乎的事——那笔薪水每月按时打进他的账户，他从没担心过延迟，而这值得他为此上心。\n\n抢救室的门忽然打开了。哈罗德猛地在椅子上站起来，膝盖撞到了椅腿，但他没来得及疼。医生从门缝里挤出来，口罩拉到了下巴底下，脸上写着一种无法掩饰的倦怠。白大褂袖口有几滴深褐色的斑点，已经干了。\n\n“爵士怎么样了？”哈罗德问。\n\n医生看了他一会儿，像是在决定措辞。最终他只是摇了摇头：\n\n“一团糟。”\n\n哈罗德等着下文。\n\n医生继续说：“那颗子弹打进了她的左胸，弹头卡在心脏附近的肌肉组织里。我们做了止血，缝合了表层，用魔法维持着她的生命体征——但只能说，勉强。”\n\n“勉强到什么程度？”\n\n“勉强到她还能呼吸，但没法保证她会醒过来。”\n\n医生把口罩完全摘下来，揉成一团塞进口袋，\n\n“她现在的情况，是一种持续的……停滞。心脏在跳，但不是在正常工作。我们也没有办法。”\n\n哈罗德站在原地，两只手垂在身侧。走廊里很安静，只有那盏灯还在闪。他看着医生转身走回抢救室，门在他面前重新合上。\n\n完了。他靠在椅背上，盯着天花板上的灯，脑子里飞速转动。四个月前他还在伦敦的办公室里喝着茶看报纸，申请这个秘书职位的时候，他只是觉得“罗德西亚听起来不错，气候好，当几年镀个金，回来至少能填进履历表里”。自治领嘛，出了名的好殖民地，秩序稳定的地方。在南非和北边刚果之间的一块安静高原，蓝花楹开花的时候还挺好看。\n\n谁知道事情会变成现在这个样子。\n\n他开始回想自己带来多少行李了。两个皮箱，一个公文包，一件换洗的冬季外套。护照还在，没丢。银行账户里的钱应该还够买一张回本土的船票。他闭上眼睛，开始在心里盘算船期表——德班港出发的客轮每个月中旬有一班，经停开普敦，然后一路北上至南安普敦。现在是1月初，距离下一班客轮还有大约两周时间。如果动作够快，他完全可以在事情彻底失去控制之前离开。\n\n他睁开眼睛，看了一眼抢救室的门。门缝底下透出一线光，安静地亮着。"
 ZIM.14.a: "不好意思爵士，我的命最重要。"
 ZIM.15.t: "回光返照"
 ZIM.15.desc: "一天夜里，抢救室里的仪器忽然发出了一声异常的蜂鸣。\n\n值班护士抬起头，看见爵士的手指动了一下。先是食指弯了弯，然后整个手掌缓缓握紧。护士还没来得及叫人，床上的病人已经睁开了眼睛。她醒来的方式，不像是从昏迷中挣扎出来的——更像是醒来之前就已经决定了要睁开眼睛，视线落在天花板上的某一处，没有涣散，没有迷茫，瞳孔聚焦的速度快得像她从没失去过意识。\n\n“叫哈罗德来。”\n\n她说。声音哑得像砂纸，但语气平稳，平稳得像在办公室下达指令。哈罗德被人从梦里拽起来推进房间时，脸上还带着睡意。他站在病床前，看见伊菲尔靠在枕头上，脸色苍白，但眼睛亮得惊人——那种亮，让哈罗德不由自主地往后退了一步。\n\n“先生，”\n\n爵士开口，目光钉在他脸上，\n\n“自治领议会的蛀虫，收拾了没有？”\n\n哈罗德张了张嘴：\n\n“爵士，您现在需要休息……”\n\n“休息？”她发出一声短促的嗤笑，“我在这里躺着的时候，那些人在做什么？在分我的矿区？在翻我的账本？在写辞职信？”她的声音越来越响，胸口起伏着，监护仪上的曲线剧烈跳动起来。护士伸手想按住她，被她一把甩开了。\n\n“我要你们所有人记住，”\n\n她的目光扫过房间里的每一张脸，像在点名，\n\n“罗德西亚是我一手建起来的。你们这帮坐在办公室里喝茶的废物，没有一个人配得上坐我的位置。”\n\n她的声音在病房里回荡，清晰、有力、毫无衰竭的痕迹。哈罗德站在床边，嘴唇翕动了一下，什么也没说出来。他认识这个语气——每一次她以这种语调说话时，接下来总有人会丢掉饭碗。\n\n“去，”\n\n她说，语气忽然放缓，像在交代一件日常事务，\n\n“把那份名单拿出来。那些在私下接触的议员，我早在三个月前就记下来了。通知警察，一个都不能放过。”\n\n她说完这句话，目光依然没有移开哈罗德的脸。房间里沉默了几秒，监护仪的声音在空隙中滴答滴答地跳着。哈罗德站着，两只手垂在身体两侧，发现自己不知道该点头还是该摇头。"
 ZIM.15.a: "她没有发现她说话已经不管用了？"