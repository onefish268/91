 ZIM.news.3.t: "$news_event_background$圣杯联邦统一罗德西亚"
 ZIM.news.3.d: "随着前罗德西亚自治领总督伊菲尔遇刺身亡，依托英式殖民高压维系的南疆稳定体系彻底崩塌。短暂的权力真空、阶层对立总爆发、宗主国危机外溢、列强地缘渗透，直接引爆全境大规模内战。历经数周派系混战、疆域割据、多方势力的反复博弈，主张多元包容、普选宪政的圣杯联邦，联合本土民权武装、开明官僚与部分倒戈的旧军警部队，挫败了法西斯极端派系、保守殖民残余、割据军阀等多方对手，在多方斡旋与全民公投的背书下完成国家重建，正式终结罗德西亚旧殖民自治时代，南部非洲诞生第一个现代多党民主政权。\n\n目前，临时制宪议会已经宣告国家重建完成，彻底废除旧罗德西亚带有殖民色彩的等级法条，剥离宗主国遗留的特权架构，保障各族群平等选举权，开放多党合法参政，落实言论与结社自由，确立分权制衡的宪政框架。新政府着手化解历史阶层矛盾，推进土地再分配改革，重整受危机重创的矿产与农牧经济，尝试在列强博弈的夹缝之中走出一条属于本土的自主发展道路。"
 ZIM.news.3.a: "自由将指引我们前行！"
 ZIM.news.3.b: "这会是这片土地真正的转机吗。"
 ZIM.news.3.C: "重重挑战仍摆在新生共和国的面前。"

