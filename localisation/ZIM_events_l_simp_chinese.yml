 ZIM.2.t: "总督的新年演讲"
 ZIM.2.desc: "新年正午，索尔兹伯里总督府广场人山人海。晴空万里，高原的日光白得刺眼，将整齐列队的自治军、森严的军警防线、规整的官方观礼台照得纤毫毕现。这是罗德西亚自治领一年一度的新年公开致辞，是殖民权威对整片南疆领地的公示与震慑。\n\n伊菲尔身着笔挺的深色总督制服，肩章鎏金冷冽，面容苍白冷峻。她缓步走上演讲台，台下鸦雀无声，唯有风掠过旗杆的低响。话筒电流微响，她的声音低沉、平稳，透过扩音设备碾压过整座广场，传遍首府每一条街道。\n\n“诸位，新年已至。”\n\n“很多人将这份安稳视作理所当然。但我告诉你们，这片土地从无天生的太平，所有富庶、所有安定、所有存续，皆来自铁与秩序。”\n\n白人移民因费特无聊的看着台上的少女，总督连演讲稿都不需要，因为这些年来她说的都是同一段话，连一个字都没改。但她又不得不站在这儿，因为宪兵把她强制性拉了过来。\n\n快点结束吧，我还要回家洗衣服，因费特想到。\n\n忽然，她看到一个非洲土著民举起了什么东西，她还没来得及看清那是什么，紧接着传来了一声枪响，广场上的人顿时乱成一团。"
 ZIM.2.a: "“发生什么了？”"
 ZIM.3.t: "任期"
 ZIM.3.desc: "“为什么不能把这个该死的规矩废掉！”\n\n德拉蒙德把一份文件狠狠地摔在了办公桌上。纸页在桌面上散开，露出其中一行用红笔圈出来的条款：“根据圣杯王国殖民办公室相关规定，殖民地总督的任期为十八年为一个周期。”她站在办公桌后面，双手撑着桌沿，指节泛白。房间里的光线从百叶窗缝隙里漏进来，在她脸上投下一道道平行的暗影，像牢房的栅栏。\n\n秘书站在门口，手里还端着那杯没来得及放下的茶，不知道该进还是该退。\n\n“我为王国做了这么多，”\n\n她的声音从牙缝里挤出来，\n\n“他们就是这么回报我的。”\n\n德拉蒙德转过身，面朝窗户。窗外的索尔兹伯里正在夕阳里铺展开来——蓝花楹的树冠被染成暗紫色，铁路调车场上方的天空泛着昏黄的光。她在这儿待了十八年。准确地说，是十八年零六天。从她十九岁那年以一张求职信和父亲的关系爬上总督之位，到她如今头发里生出银丝、眼角刻出细纹，她把自己整个人生都嵌进了这座殖民地的历史里，像一枚钉死了的铆钉。\n\n“殖民地的规则也能管到自治领的头上了，”\n\n她继续说，声音低了一些，但底下的怒气依然没消，\n\n“看来是议会的老爷们看上这里了，所以要我滚到别的地方去。”\n\n她抬起一只手，用拇指和食指捏了一下眉心。\n\n“我可去你妈的。”\n\n秘书在门口终于轻轻咳了一声。德拉蒙德没有回头，只是用背影对着门口说：\n\n“你出去。”\n\n秘书放下茶，退了出去，带上了门。办公室重新安静下来。\n\n德拉蒙德站在窗前，双手背在身后，看着远处那列正在进站的火车喷出一团灰白色的蒸汽。她的嘴唇紧抿着，下巴绷成一道锋利的弧线。她在想那封随文件一起送达的信——来自殖民办公室的专函，措辞客气而得体，称她为“敬爱的伊菲尔·德拉蒙德阁下”，恭喜她“圆满完成了十八年的杰出服务”，并告知她将在三个月后“享受荣誉卸任”。"
 ZIM.3.a: "距离总督任期结束，仅剩最后数月。"
 ZIM.4.t: "消息"
 ZIM.4.desc: "远在欧洲的圣杯王国，经济危机已然山雨欲来，濒临爆发临界点。\n\n作为旧大陆老牌强权、曾经凭借圣杯战争红利与骑士贵族体系稳固霸权的欧洲核心势力，圣杯王国的繁荣早已透支殆尽。连年战事损耗、贵族体系臃肿、财政赤字堆叠、货币信用持续崩塌，曾经辐射欧洲的贸易链条彻底断裂。密报明确标注：产业停滞、物价飞涨、国库空虚，上层贵族派系割裂、底层民生暴动频发，整个王国的经济体系已撑不住残局，一场足以撼动旧大陆格局的系统性危机，数月之内必然全面引爆。\n\n于罗德西亚而言，这绝非遥远的域外风波。"
 ZIM.4.a: "还能更糟糕一点吗？"
 ZIM.5.t: "视察"
 ZIM.5.desc: "甩开所有幕僚的劝阻，德拉蒙德临时驱车出城视察经济产区。\n\n新年伊始，罗德西亚的矿区与农垦带本该全速开工、产销两旺，这是她定下的年度开局铁律。可今日亲眼所见，却令她出乎意料。城郊铬矿矿区的开采进度明显放缓，精炼厂的烟囱吞吐着稀薄的白烟，产能较去年同期已经回落一截。工人们低头劳作，眼神里不再是顺从的麻木，而是藏不住的倦怠与怨怼。线报所言非虚，底层人心早已松动，只是靠着军警高压强行压制。更致命的是库房囤积的成品矿产堆积如山，货运车场空空荡荡——对外贸易的通道，已经随着圣杯王国经济变化的预演，开始被动锁死。\n\n驻场官员一路紧随，低声上报海外订单锐减、外资采购撤单、跨境结算延期的现状，言语间满是慌乱。他们寄希望于政府出台怀柔安抚政策、放宽管控、让步维稳。\n\n德拉蒙德一言不发，只是冷眼扫视整片厂区。"
 ZIM.5.a: "一切都在掌控中。"
 ZIM.6.t: "视察"
 ZIM.6.desc: "德拉蒙德驱车直奔城郊野战军驻训基地。\n\n冬日高原的风凛冽刺骨，整片训练场黄沙肃寂。罗德西亚自治军列阵肃立，白人士官挺拔冷峻，本土征募士兵站姿规整，枪械寒光整齐划一。这是总督一手整编、一手规制的部队，纪律、杀伐、服从性，皆是她数年严苛打磨的成果。她从不信赖民心，从不信赖贸易，只信赖这支绝对听命于总督府、凌驾本土族群之上的武装力量。德拉蒙德缓步穿行阵列之间，指尖拂过冰冷的步枪枪托，目光逐一扫过士兵的眉眼。士官阶层依旧沉稳坚定，忠于自治体系、忠于殖民秩序，是稳固的核心战力。但底层本土士兵的眼底，已经悄然滋生出涣散与犹疑。他们生于这片土地、长于这片土地，耳闻邻里怨怼，目睹民生困顿，更清楚总督的任期即将结束。忠诚开始松动，服从开始被动，高压维系的军心，同经济、民心一样，悄然出现了裂痕。\n\n驻防司令官紧随身侧，低声汇报全军战备完好、执勤到位、无违规异动，试图用制式报表掩盖细微的军心浮动。"
 ZIM.6.a: "一切都在掌控中？"
 ZIM.7.t: "视察"
 ZIM.7.desc: "今早上车之前，德拉蒙德刚阅完一份来自本土基层的绝密急报。文字潦草、层层加密，是军警线安插在城郊原住民聚落、矿区劳工社区的眼线传回的最后预警：底层的躁动已经不再是私下的怨怼，而是形成了隐秘的串联。\n\n城市定居的劳工、被征地的农牧民、被严苛管控压制数年的本土群体，借着任期将尽的窗口期暗自聚拢，她们笃定旧秩序即将落幕，笃定离任前夕的总督必然心力松懈、管控虚化。情报罗列得清晰冰冷：匿名集会、私藏武器的苗头、针对白人自治阶层的仇视宣言，还有一句反复出现的暗语——“等塔倒下”。幕僚劝她暂缓公开演讲、临时加派城防、低调度过新年，避免激化矛盾。\n\n她只是抬手驳回了所有建议。\n\n“已经推迟了很久了。”\n\n德拉蒙德太了解这片土地的本土族群。她们温顺是假象，隐忍是蛰伏，唯有绝对的高压与持续的威慑才能镇住根基深处的暴乱天性。数年铁腕治理，她压平了无数次暗流，可只要她显露一丝退让、一次规避、一点心虚，所有被压制的怨恨就会瞬间沸腾反扑。任期将近，他们盼着她疲软，盼着她落幕，盼着自治领的铁规随她的离任一同作废。那她偏要在万众瞩目之下，在首府最核心的广场，当着军警、官僚、所有窥伺者的面，重申一次她的秩序。哪怕暗流汹涌，哪怕杀机暗藏。"
 ZIM.7.a: "§R一切都在掌控中。§!"
 ZIM.8.t: "来访"
 ZIM.8.desc: "副官匆匆赶来，神色紧绷，低声呈报了一桩临时突发的外事通报：圣杯王国驻外经济专员，未经提前报备，已携随员抵达总督府前厅，要求即刻面见总督。\n\n伊菲尔闻言，眼底寒意更重。\n\n刚收到圣杯王国全盘经济崩盘的密报，今日专员便仓促登门，时机巧合得刺眼。她太清楚旧大陆强权的行事逻辑——自身危机燎原在即，无暇维系海外领地贸易，便会急于收拢最后利益、转嫁危机、胁迫附庸自治领分担损耗。\n\n对方神色疲惫焦躁，礼服褶皱凌乱，眼底掩不住国库枯竭、国内动荡的狼狈，早已没了往日欧洲强权使节的傲慢从容。专员开门见山，语气带着急迫的妥协与强硬：圣杯王国国内市场崩溃、货币失信，已无力继续收购罗德西亚矿产与农牧产能；为维系双方“传统盟约”，要求罗德西亚自治领单方面延后结算、无偿储备战略资源，并追加对圣杯王国的无息援助贷款，用以填补其本土财政窟窿。\n\n“总督阁下，这是王国最后的求援，也是自治领维系宗主庇护的唯一代价。”专员试图以旧日层级施压，语气却藏不住底气匮乏的虚弱。"
 ZIM.8.a: "我不想听这些。"
 ZIM.9.t: "信"
 ZIM.9.desc: "临走前，专员似乎想起了什么，从烫金公文信封中取出一页做工精致、笔迹端庄的亲笔信——那是阿尔托莉雅陛下的新年慰问信。\n\n纸面油墨留香，措辞温厚优雅，是王室一贯的矜重体面。陛下在信中言及深知南疆驻守苦寒，感念总督数年镇守罗德西亚、稳固海外殖民疆土的辛劳，体恤她任期将满、履职维艰，遥祝她新年安康、履职顺遂，并期许罗德西亚与圣杯王国的羁绊恒久不变、邦谊稳固。\n\n伊菲尔指尖抚过平整的信纸，心底翻涌着近乎讽刺的荒芜。王室心知自身无力再庇护海外自治领，无力维系贸易体系，更无力插手非洲局势，昔日的宗主霸权早已名存实亡。可阿尔托莉雅陛下不愿撕破体面，不愿承认帝国落幕的事实。陛下用一纸温柔御笔，替濒临崩塌的王国留住宗主名分，用轻飘飘的关怀枷锁，将自己和风雨飘摇的罗德西亚死死钉在即将倾覆的殖民体系之上。她不言危机、不告溃败、不议援助，只用温情话术稳住自己，让她在任期最后的绝境里，依旧背负着王国附庸的枷锁，独自扛下所有内忧外患。"
 ZIM.9.a: "王室不谈责任，只讲恩情。"
 ZIM.news.1.t: "$news_event_background$罗德西亚总督“铁手”伊菲尔新年演说遇刺"
 ZIM.news.1.d: "在圣杯王国全境经济危机全面发酵、海外殖民管控体系濒临解体的关键节点，非洲南部核心自治领——罗德西亚自治领发生顶级政治暗杀事件。深耕南疆多年、以铁腕集权统治稳固区域秩序的总督伊菲尔，于新年官方公开演讲落幕瞬间遭本土激进势力枪击重伤。\n\n业内地缘分析师指出，伊菲尔的倒下，是旧殖民时代的落幕符号。她是旧体系最坚定的维护者，以铁腕撑起了罗德西亚数十年的稳定，却也依托殖民层级制度制造了长久的对立与不公。当宗主国自顾不暇、无力维稳兜底，当经济萧条渗透基层、民生困境持续加剧，依靠高压维系的秩序必然轰然崩塌。\n\n目前，罗德西亚全境已进入临时军政戒备状态。随着铁腕总督倒下、旧有管控体系出现断层，叠加圣杯王国持续输出的经济危机、邻居的地缘觊觎，南部非洲局势已然进入高度不确定状态。原本稳固的自治领格局彻底松动，本土独立思潮、列强渗透博弈、内部权力派系争斗同步抬头，这片非洲最稳定的沃土，即将迎来数十年未有之大变局。"
 ZIM.news.1.a: "她早该走了"
 ZIM.news.1.b: "噢，不"
 ZIM.news.1.C: "旧时代的铁序守护者死于自己坚守的秩序裂痕之中"
 ZIM.10.t: "无力挽回"
 ZIM.10.desc: "总督倒下之后，由于过去的25年里她一直亲历亲为，我们甚至连合适的继承人也没有，这导致我们做不了任何事来挽回所有的一切！"
 ZIM.10.a: "不......."
 ZIM.11.t: "崩溃"
 ZIM.11.desc: "伊菲尔总督在世之日，罗德西亚的安稳从来不是源于民心归顺，不是源于体系合理，而是源于一人之铁腕、一人之威压、一人之决断。整片南疆的秩序、层级、军纪、经济管控、边境维稳，全部死死锚定在总督个人的权威之上。\n\n正因所有平衡全系于她一人，所以她的死亡，不是单一的政治暗杀，而是罗德西亚整个自治体系的瞬间失锚。"
 ZIM.11.a: "§G以老大的名义！§!(推荐游玩该国家)"
 ZIM.11.b: "以自治的名义！"
 ZIM.11.c: "以国家的名义！"
 ZIM.11.d: "以金钱的名义！"
 ZIM.11.e: "§C以陛下的名义！§!(强烈推荐游玩该国家)"
 ZIM.11.f: "§R以人民的名义！§！"
 ZIM.11.g: "以神的名义！"
 ZIM.news.2.t: "$news_event_background$一心会统一罗德西亚"
 ZIM.news.2.d: "随着前罗德西亚自治领总督伊菲尔遇刺身亡，依托英式殖民高压维系的南疆稳定体系彻底崩塌。短暂的权力真空、阶层对立总爆发、宗主国危机外溢、列强地缘渗透，直接引爆全境大规模内战。历经数周派系混战、疆域割据、武力清场，本土极端民族法西斯派系最终击溃自由派文官、旧殖民军警、本土激进民权武装等所有势力，以铁血手段完成全境统一，正式终结罗德西亚百年自治史，诞生南部非洲首个法西斯集权政权。\n\n目前，该派系已正式宣告全境统一，废除原罗德西亚自治领所有英式宪政体制与殖民层级规则，取缔一切民间结社与反对派势力，建立高度集权的法西斯独裁政体，实行党国一体、军政合一、资源统制、社会严控的全新治理模式。"
 ZIM.news.2.a: "duce将指引我们向前！"
 ZIM.news.2.b: "看来我们要失去它了。"
 ZIM.news.2.C: "她会带领罗德西亚走向何方？"
 ZIM.12.t: "完全胜利！"
 ZIM.12.desc: "随着最后一个分裂势力被我们击垮，法西斯党事实上完全统一了罗德西亚的所有地区。"
 ZIM.12.a: "胜利属于我们！"
