  FRA_Laboratory_material_desc_01: "§L理论上不存在的物质。由于幽幽子的胃部连接着虚无，能留下的残渣都具备强烈的“抗消解性”，是制造永恒外壳的极佳涂层。§!"
  FRA_Laboratory_material_desc_02: "§L带有恋恋无意识波动的荆棘。它能刺穿精神防御而不被察觉，是炼制“存在感抹消药剂”的核心催化剂。§!"
  FRA_Laboratory_material_desc_03: "§L凝结了死者对生之眷恋的矿物。触感冰凉且带有灵魂的重量，用于稳定通灵类药物的波动。§!"
  FRA_Laboratory_material_desc_04: "§L经过四季鲜花之主魔力灌溉的向日葵。生命力极其狂暴，仅需一片花瓣就能让枯死的植物瞬间爆发生长。§!"
  FRA_Laboratory_material_desc_05: "§L沾染了防盗咒文与魔理沙魔力的羊皮纸。具备“强制解析”属性，能让复杂的炼金公式在瞬间自我重组。§!"
  FRA_Laboratory_material_desc_06: "§L每一根都浸透了佛法与超人魔力。食用后能进入极致的平衡态，是中和烈性毒药副作用的最佳缓冲剂。§!"
  FRA_Laboratory_material_desc_07: "§L蕴含着不可思议的因果律。能微调现实中的概率分布，虽然只有几根，却能让失败的炼金实验发生“奇迹般”的转折。§!"
  FRA_Laboratory_material_desc_08: "§L月之民极致纯净的生物精华。具备“绝对洁净”属性，能瞬间净化任何世俗的污秽，是最高级的万能溶剂。§!"
  FRA_Laboratory_material_desc_09: "§L现人神亲制的神秘酵母。其内部活跃着“奇迹”的生物活性能量，能为死板的药剂注入名为“灵性”的生命力。§!"
  FRA_Laboratory_material_desc_10: "§L处于常时超音速摩擦状态的黑羽。具备“无视空气阻力”的物理特性，是制作瞬移药物时必不可少的动能来源。§!"
  FRA_Laboratory_material_desc_11: "§L封装了夜雀歌声的生物结晶。能引发或治愈精神层面的感知混淆，常用于炼制视听增强剂。§!"
  FRA_Laboratory_material_desc_12: "§L记录了被修正的历史。由于承载了真实的记忆，它具有极强的“逻辑加固”作用，能防止药剂效果被现实反噬。§!"
  FRA_Laboratory_material_desc_13: "§L混合了机油与河童激素的冷却液。具备超高热传导率，是防止高能炼金反应堆过热爆炸的终极冷却材料。§!"
  FRA_Laboratory_material_desc_14: "§L密度极高的重金属感粉末。能够控制物质的“疏”与“密”，是制造微缩空间瓶的关键重力源。§!"
  FRA_Laboratory_material_desc_15: "§L命运之红月的浓缩。蕴含着不老的诅咒与改变宿命的力量，能让药剂的效果跨越时间与空间的限制。§!"
  FRA_Laboratory_material_desc_16: "§L连思维都能冻结的绝对冷气。它的“笨蛋属性”能让复杂的药理反应陷入静止状态，从而达到无限期保存药效的目的。§!"

