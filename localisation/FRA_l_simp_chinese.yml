#国策
 #前置（34-36）
  FRA_Stepping_into_1934: "迈入1934"
  FRA_Stepping_into_1934_desc: "新年的钟声已经敲响，伟大战争的硝烟早已消散，在人民庆贺声中，幻想乡进入了1934年。"
  FRA_Prosperity_never_ends: "繁荣永不落幕"
  FRA_Prosperity_never_ends_desc: "在伟大领袖稗田阿求的带领下，幻想乡依然俯视着那些苟延残喘的敌人们。接着奏乐接着舞！"
  FRA_impact_of_Berlin_crisis: "柏林危机的影响"
  FRA_impact_of_Berlin_crisis_desc: "自称魔导国的不死族以我们难以置信的速度击败了德国并占据了德国全境，在不知对方是敌是友的情况下，我们必须做好准备。"
  FRA_Reinforcement_of_Great_Barrier_of_Bori: "加固博丽大结界"
  FRA_Reinforcement_of_Great_Barrier_of_Bori_desc: "由博丽女巫主持的博丽大结界一直守护着我们与德国的边境线，但在现在的情况下，我们不能保证大结界顶得住不死族的魔法，必须提高结界强度。"
  FRA_Outside_enemys_borders: "御敌国门之外"
  FRA_Outside_enemys_borders_desc: "虽然伟大战争的硝烟已经散去，但我们的人民依然对敌人当初进攻首都的战斗心怀恐惧，所以，无论发生什么情况，都不允许任何战斗在境内爆发！"
  FRA_Restart_of_arms_production: "重启军备生产"
  FRA_Restart_of_arms_production_desc: "魔导国已经成气候了，不得不承认，以前防御德国的战争准备是无法应对不死族的，我们的军工厂必须重新开动，为了幻想乡的和平！"
  FRA_Defend_against_foreign_enemies: "防范外来之敌"
  FRA_Defend_against_foreign_enemies_desc: "我们对魔导国的了解几乎为零，这些不死族从哪来？会不会侵略我们？我们都一无所知，所以，为了以后的局面着想，我们必须做好一切的准备。"
  FRA_Strasbourg_talks: "斯特拉斯堡会谈"
  FRA_Strasbourg_talks_desc: "不敢相信，他们居然主动提出在斯特拉斯堡会谈，魔导国的宰相雅儿贝德亲自到来，但我们也必须去尝试一下，一切为了幻想乡的和平"
  FRA_Diplomatic_relations_with_DVL: "与魔导国建交"
  FRA_Diplomatic_relations_with_DVL_desc: "在宰相雅儿贝德的促成下，我们与魔导国达成了和平条约，并建立外交关系，互派大使，恢复经济往来。当然，还有秘密条款--她们将默许我们占领莱茵兰地区。"
  FRA_Annex_RHI: "出兵莱茵兰"
  FRA_Annex_RHI_desc: "既然德国已经南逃维也纳，她们显然没有能力赔付给我们的赔款。是的，我们占领莱茵兰只是为了获得赔款，当我们获得了足够赔款的工业品，我们的军队自然会离开。"
  FRA_Appeasement_of_Austria: "安抚奥地利"
  FRA_Appeasement_of_Austria_desc: "我们与魔导国建交以及占领莱茵兰的举动激怒了德意志国，她们在国联大会上愤怒地指责我们。虽然她们现在实力十分弱小，但说不定在未来她们可以替我们挡刀，所以让议会拿点钱出来，安慰一下小姑娘吧。"
  FRA_Human_Village_financial_capital: "人间之里，金融之都"
  FRA_Human_Village_financial_capital_desc: "圣杯费拉不堪，真正的金融之都还得看我们人间之里！人人都懂金融，人人都有钱花！"
  FRA_Stocks_skyrocketed: "股票飞涨"
  FRA_Stocks_skyrocketed_desc: "稳啦！这次彻底稳啦！外交危机的解决让市场对我国信心大增，越来越多的资本涌入我国市场，我们的股票疯狂上涨，永远不会下落，永远！"
  FRA_Securities_are_not_interested: "证券不息"
  FRA_Securities_are_not_interested_desc: "即使是最谨慎的经济专家，也不会认为幻想乡的证券市场会停止，外部环境的稳定让它成为一个充满活力和机遇的场所。所有的幻想乡人都会挣大钱！"
  FRA_industry_is_developed: "实业发达"
  FRA_industry_is_developed_desc: "经济的繁荣让我们的实业也得到了良好的发展，证券市场上多得是挥舞着钞票找需要投资的企业的妖怪们。大到军火、航空，小到玻璃、纺织。都有人愿意投资。我们的幻想乡真是更上一层楼！"
  FRA_Innovative_civil_appliances: "创新民用电器"
  FRA_Innovative_civil_appliances_desc: "人有钱了，就想拥有更加舒适的生活环境，正好我们科学研发当中的一些副产品可以运用到民间，将以往的电器改一改，翻新一下，利润可是能翻倍的。就当为科学进步争取经费了。"
  FRA_We_all_have_a_bright_future: "我们都有美好的未来"
  FRA_We_all_have_a_bright_future_desc: "你在证券交易所里挥舞钞票，我在棒球场上挥动球棒，她在歌剧院里一展歌喉，我们都有美好的未来！"
  FRA_Movement_for_rationalization_of_industrial_production: "工业生产合理化运动"
  FRA_Movement_for_rationalization_of_industrial_production_desc: "慢，还是慢，太慢了！我们的工厂生产速度跟不上我们订单的接取速度，不能让这份利润跑了，让我们把工厂的每项作业都分解成最简单的工作，然后测定完成每项工作的时间，从而找出完成工作的最经济办法，这样效率大幅提升！我们赢！市场也赢！生产合理化运动万岁！"
  FRA_freer_market_freer_people: "市场越自由，人民越自由"
  FRA_freer_market_freer_people_desc: "市场自由有利于人民自由。只有让市场机制发挥作用，让劳动力商品等资源自由流动，人民才有更多的选择，更多的机会，更公平的竞争坏境。让那只看不见的手见阎萝王去吧！"
  FRA_Deepen_political_reform: "深化政治改革"
  FRA_Deepen_political_reform_desc: "经济基础决定上层建筑，越来越多的商人向政府反映政府机关在经济活动当中的迟缓和繁琐。我们不能拖慢经济腾飞的步伐，是时候对政府进行改革了，相信新政府在阿求大总统的带领下，能更好的为经济保驾护航"
  FRA_Review_pilot_areas: "检视试点地区"
  FRA_Review_pilot_areas_desc: "罗马不是一天建成的，改革也不是一次就能成功的，为了能给改革汲取经验，我们有必要设立一个试点地区来让官员们看见改革后的成功。阿求总统很重视这件事，她已经确定会去视察试点地区，我们必须拿出成果让她相信改革是成功的！"
  FRA_Initial_results_of_democratization: "民主化初步成果"
  FRA_Initial_results_of_democratization_desc: "一直以来，有很多对阿求总统不满的人污蔑她是个独裁者。只有我们知道阿求总统内心的想法，她一直在推行民主幻想乡的建立，现在，民主化初步成果已经有了，是时候好好的打那些家伙的脸了。"
  FRA_Open_up_activities_of_political_parties: "开放政党活动"
  FRA_Open_up_activities_of_political_parties_desc: "如果一个国家全是一个声音，那么这个国家就会很危险，神州有句古话叫做忠言逆耳利于行。阿求总统已经签署政令，允许更多的党派出现，她相信这些在野党能指出我们行政过程中的过错，然后让我们的行政更深入人心。不过在一些激进的官员看来，这并不是一件好事。"
  FRA_Legislature_of_power: "让权议会"
  FRA_Legislature_of_power_desc: "那些腐朽的圣杯人的议会就是个妓院，除了抱着国王的大腿什么都做不了，而我们先进的幻想乡议会已经全面超过落后的圣杯议会，阿求总统的让权让议会有了用武之地，民主的灯塔就在幻想乡！"
  FRA_Drafting_of_constitutional_amendments: "起草宪法修正案"
  FRA_Drafting_of_constitutional_amendments_desc: "阿求总统的时间不多了，可她比起自己的生命，更在乎自己所维护的民主幻想乡会不会被人破坏，最好的保障就是重修宪法，避免独裁者，窃国者的出现，这是稗田阿求赋予宪法新的使命，现在让阿求总统休息一下吧，让我们来完成这份宪法修正案！"
  FRA_Explain_what_happened: "交代后事"
  FRA_Explain_what_happened_desc: "稗田阿求已经起不来了，她恍惚之间，好像看见了已经死于第一次伟大战争的老友们，他们在呼唤她。阿求笑了，她知道自己该去了，但不能是现在，阿求必须告诉后继者，她应该做什么！"
  FRA_Worthy_of_motherland: "无愧于祖国"
  FRA_Worthy_of_motherland_desc: "终于，可以休息了，稗田阿求看着人间之里的凯旋门在夕阳下反射的光芒。不由想起以前那里埋葬了数不胜数的故人，他们为了一个新的幻想乡前仆后继。而现在，稗田阿求可以骄傲地告诉他们，她没有辜负他们的牺牲，她无愧于祖国！想着想着。稗田阿求缓缓地闭上了双眼"
  FRA_Like_a_dream_its_like_a_fantasy: "人生三十年，如梦亦如幻"
  FRA_Like_a_dream_its_like_a_fantasy_desc: "稗田阿求，再造幻想乡的人类领袖，她把濒临破碎的幻想乡重新聚合起来。在她那有限的生命里，解决了与魔导国的外交危机，稳定了殖民地的分裂，推动了幻想乡经济腾飞，改变了幻想乡政治格局。稗田阿求接手了一个破碎绝望的幻想乡，却留下了一个团结进步的幻想乡共和国！"
 #华扇
  FRA_first_term_of_Ibaraki_Kasen: "茨木华扇第一任期"
  FRA_first_term_of_Ibaraki_Kasen_desc: "茨木华扇从大选中脱颖而出成为了新总统，这位红色领袖承诺将带领幻想乡走出大萧条的阴影并将建设出人民的幻想乡、人民的家园。"
  FRA_Acquisition_of_bankrupt_businesses: "收购破产企业"
  FRA_Acquisition_of_bankrupt_businesses_desc: "私有企业在大萧条的浪潮中一批接一批倒下，虽然她们的资产已经不值一提，但巨量的生产资料和人才必须掌控在国家手中。收购破产企业并将生产置于国家管理之下可以初步遏制经济的崩溃进程。"
  FRA_Nationalization_of_the_bank: "国有化人里银行"
  FRA_Nationalization_of_the_bank_desc: "幻想乡金融经济的重要命脉竟然不处于幻想乡政府的控制之下，如此将经济交于自由市场只会在危机时造成更加严重的后果。现在幻想乡银行正面临挤兑危机，大量贷款和投资已经无法收回，幻想乡政府会将其国有化，作为政府逐步缓解金融压力的有形大手发挥作用。"
  FRA_Rationing_is_introduced: "实行配给制"
  FRA_Rationing_is_introduced_desc: "幻想乡的工农业生产遭到了大萧条的沉重打击，御币大幅贬值，市场上许多商品价格飙升，人间之里一条面包一度要50万御币才能买到，无数的牛奶、小麦堆积在农场里。国家通过低价收购产品在城市实行配给制可以使物价快速恢复到“正常”水平，保证幻想乡的人民不至面临饥饿与寒冷的威胁。"
  FRA_Planning_Production_Committee: "计划生产委员会"
  FRA_Planning_Production_Committee_desc: "世界市场的过度繁荣在幻想乡市场营造了一种幻象，仿佛无论生产多少商品都能被消化，大萧条已经证明了这是巨大的错误，幻想乡今后将实行计划生产制度，通过计划生产委员会控制企业的生产规模，既避免商品过多也避免商品不足。"
  FRA_Expansion_of_public_works_works: "扩大公共工程建设"
  FRA_Expansion_of_public_works_works_desc: "企业倒闭、生产过剩，许多幻想乡人民因大萧条失去了工作，她们的生活陷入了困苦的境地，但是我们既不能变出大量现成工作岗位也不能变出不要钱的面包和热汤，只能让年轻劳动者在街头流浪。不过幻想乡的基础设施还有很大的提升空间，我们将增加公共建设项目，优先征召失业人群去修建水坝、铁路、公路并提供面包和热汤作为报酬，以此来暂时容纳社会的失业人口。"
  FRA_Authorized_trade_unions: "授权工会"
  FRA_Authorized_trade_unions_desc: "当前幻想乡政府还不能全面地保障劳动者的利益并响应她们的诉求，各个地区的工会将承接这一任务，幻想乡政府会授权合法合规地建立起的工会，由工会代表劳动者去争取应得的权益。"
  FRA_Drafting_of_amendments_to_Labour_Code: "草拟《劳动法》修正案"
  FRA_Drafting_of_amendments_to_Labour_Code_desc: "数十数百年来幻想乡的劳动者们从来没有一部真正属于她们的法律来保障工作的安全、休息的充足以及报酬的合理，茨木华扇已经要求政府草拟一份《劳动法》修正案以期为广大幻想乡劳动者维护自己的权益提供法律的依据和国家强有力的保障。"
  FRA_Push_for_legislation: "推动立法"
  FRA_Push_for_legislation_desc: "《劳动法》修正案已经正式提上幻想乡政府议程，可以预见反对派和企业主将极力反对这一法案，但一定会有更多的幻想乡劳动者和我们站在一起。"
  FRA_Lobbying_activities: "游说活动"
  FRA_Lobbying_activities_desc: "幻想乡社民党虽然在大选中取得了绝对多数席位，但还不足以保证法案顺利通过，我们必须游说民主党和国民联盟中的左派议员，争取他们的支持，这与我们能否稳定自己的执政地位密切相关，必须全力以赴。"
  FRA_Parliamentary_debate: "议会激辩"
  FRA_Parliamentary_debate_desc: "修正劳动法的工作得到了其他政党的支持，但法案的细节内容受到了其他红色政党激进派议员的反对，他们认为对劳动法的修改幅度太低，应该直接引用苏维埃联盟或者瓦尔哈拉社的劳动法条文，这并不符合幻想乡的社会现状，一场激辩在所难免。"

  FRA_Establish_maximum_working_hours: "规定最长工时"
  FRA_Establish_maximum_working_hours_desc: "自从圣杯王国发起工业革命以来，无论老幼南女，大部分欧洲工人长年保持着10小时至14小时的每日工作时间，我们不知道有多少可怜的工人因为劳累而早早去世，但从今往后幻想乡的工人再也不用担心这一问题了，我们将限定每天的最高工时，幻想乡的工人在结束了一天劳累后终于可以睡个好觉了。"
  FRA_Establish_minimum_wage: "规定最低工资"
  FRA_Establish_minimum_wage_desc: "“工人的劳动价格如同商品一样，随需求而上下摇摆”，幻想乡的劳动者苦于飘忽不定的工资收入，如今她们将得到保障，幻想乡的各个地区必须设立最低工资标准并监督企业执行，幻想乡的工人不用再为如何缩减支出而忧心了。"
  FRA_Formal_legislation: "正式立法"
  FRA_Formal_legislation_desc: "终于，大部分障碍都已经扫清，人民阵线已经准备好在议会中表决法案了，而这个时机将由茨木华扇决定，我们相信她能把握住最好的时机，为幻想乡的劳动者带去最美好的前途"
  FRA_Expand_socialist_propaganda: "扩大社会主义宣传"
  FRA_Expand_socialist_propaganda_desc: "人民阵线虽已取得执政地位，但大选的成果只是一时的，必须让幻想乡人民自发地支持拥护社会主义才能保证茨木华扇的目标得到实现，通过报纸和广播演讲，我们把社会主义的种子播撒到全幻想乡。"
  FRA_Suffrage_expanded: "选举权扩大"
  FRA_Suffrage_expanded_desc: "历任前幻想乡民主政府都将“民主”宣扬为自己的特色与功绩，但是选举权却总是被限定在部分人群中，为什么纺织厂里年轻的女工们不能投票？为什么在森林湖畔的妖精们不能投票？让所有幻想乡的成年公民拥有投票权，这才算的上民主。"
  FRA_Citizen_welfare_formulation: "公民福利制定"
  FRA_Citizen_welfare_formulation_desc: "虽然大萧条消退近半，但大萧条中底层幻想乡人民的境遇已经成为我们不可磨灭的记忆，为了保护幻想乡人民免受经济危机带来的死亡威胁，我们将指定公民福利制度保障她们最基本的生活需要。"
  FRA_Invest_in_mass_media: "投资大众媒体"
  FRA_Invest_in_mass_media_desc: "幻想乡的媒体并不发达，导致政府的主张和思想无法顺利传达到幻想乡人民那里，而我们只需要投入一定的资源，就可以影响整个幻想乡政治势力变化。"
  FRA_Organize_evening_classes_for_workers: "组织工人夜校"
  FRA_Organize_evening_classes_for_workers_desc: "工人群体是幻想乡红色政权的核心力量，她们充满革命热情缺因为缺乏教育机会而难以发挥更大力量，现在政府可以利用工人更多的空闲时间开办夜校提高她们的知识水平，有朝一日她们一定可以成为自己和国家的主人。"
  FRA_People_Homeland: "人民家园"
  FRA_People_Homeland_desc: "在茨木华扇的领导下，人民阵线改变了幻想乡的社会面貌，现在幻想乡已经接近大选时承诺的“人民家园”的模样，这是幻想乡人民的伟大胜利，是民主社会主义在幻想乡的伟大胜利。现在我们需要着手面对即将到来的更大危机，只有幻想乡存在于世，才有机会思考未来。"
  FRA_Increase_government_regulation_and_control: "加大政府调控"
  FRA_Increase_government_regulation_and_control_desc: "幻想乡政府已经介入控制了社会经济，但这还不足以解决大萧条，我们需要更加强力更加高效的手段，必须尽快提高政府在经济调控中的地位和作用。"
  FRA_Antitrust_Law: "反垄断法"
  FRA_Antitrust_Law_desc: "幻想乡的一些大资本家大企业几乎垄断了个别行业的生产，她们肆无忌惮地挤占市场空间，剥削工人并用大量廉价商品参与竞争，间接加重了大萧条的产能过剩危机，政府必须通过法律限制这样的垄断发生。"
  FRA_Banks_cut_interest_rates: "银行降息"
  FRA_Banks_cut_interest_rates_desc: "现在幻想乡的金融业银行业已经回到政府把握之下，经历了长时间剧烈的信贷紧缩和金融动荡，是时候进行一轮降息重新激活幻想乡的经济发展了。"
  FRA_End_rationing: "结束配给制"
  FRA_End_rationing_desc: "市场上的积压商品已经大大消耗，幻想乡人民的生活也趋于稳定，是时候结束配给制并将政府资金用到其他地方去了"
  FRA_Inject_capital_into_market: "向市场注资"
  FRA_Inject_capital_into_market_desc: "幻想乡的经济终于逐渐复苏过来，政府的压力也有所缓解，接下来虽然会影响人民阵线的支持率，我们仍然要向市场进行投资，让政府手中的御币流进市场加热经济。"
  FRA_Financial_regulation: "金融监管"
  FRA_Financial_regulation_desc: "金融市场的崩溃是大萧条爆炸的引信，正是圣杯王国对金融的放任才使得泡沫成倍增长最终跌入地狱，幻想乡政府会对金融行业进行严格的监管，以求避免这些虚假的经济影响社会的正常发展。"
  FRA_second_term_of_Ibaraki_Kasen: "茨木华扇第二任期"
  FRA_second_term_of_Ibaraki_Kasen_desc: "茨木华扇的第一任任期已经证明了她的承诺并不是空中楼阁，人民切实地享受到了幻想乡发展的果实，因此，茨木华扇理所应当地连任成功。"
  FRA_Supervise_the_capitalists: "监督资本家"
  FRA_Supervise_the_capitalists_desc: "没有一个资本家能忍住利益的诱惑，只要有足够的利益，他们甚至可以出卖绞死自己的绳索。茨木总统已经要求情报局拿出一部分精力，好好看看那些资本家又干了什么好事。"
  FRA_Install_political_commissar: "安插政委"
  FRA_Install_political_commissar_desc: "尽管共产主义思想已经逐渐被人民接受，但军队仍存在旧式军队作风，换句话来说，我国最大的暴力机关与政府离心离德，这是个不好的现象。因此，趁现在那些老将没有动作，先派遣一些思想端正的同志进入军队吧。"
  FRA_Political_education_in_army: "军队政治教育"
  FRA_Political_education_in_army_desc: "大事已成，军队现在接受了共产主义思想，基层士兵已经彻底倒向我们，但仍有一部分异见者在军队中活跃，是时候开启军队教育工作了，虽然会有阻碍，但这是为了我们共同的目标！"
  FRA_Strengthen_building_of_party_discip: "强化党纪建设"
  FRA_Strengthen_building_of_party_discip_desc: "有一部分同志觉得我们已经成为幻想乡的统治者了，就开始为非作歹，肆意妄为。茨木主席对此进行严重的批评，她要求立刻进行党内清查，将这群害群之马踢出队伍。"
  FRA_Meeting_with_leaders_of_various_factions: "会见各派领袖"
  FRA_Meeting_with_leaders_of_various_factions_desc: "我们能在大选中获胜，是因为与其他左翼党派联合竞选成功的，现在，在茨木总统第二任任期的关键时刻，我们不希望有同志拖后腿，所以，我们应该与其他左派领袖见一面，讨论一下。"
  FRA_Reshuffle_Popular_Front: "改组人民阵线"
  FRA_Reshuffle_Popular_Front_desc: "现在的人民阵线过于臃肿，导致一些突发情况我们不能及时反应过来，这种情况无疑会让我们的人民怀疑执政能力，为此，改组人民阵线，精简人员，才能让我们在第二任任期交出完美的答卷。"
  FRA_Expand_trade_with_Soviet: "扩大对苏贸易"
  FRA_Expand_trade_with_Soviet_desc: "苏联作为和我们意识形态相同的国家，外交关系一直保持着亲密态度。出于一些因素考虑，我们打算扩大与苏联之间的贸易往来，加强俩国之间的联系。"
  FRA_Secret_meeting_of_Third_International: "密会第三国际"
  FRA_Secret_meeting_of_Third_International_desc: "在这个混乱的世界唯有抱团取暖才有可能笑道最后。苏联带头成立的第三国际拥有大多数左翼国家成员，他们都是经过考验的同志，与第三国际保持良好关系，说不定能起到关键作用。当然，这一切必须瞒着反对党，不然他们又要造谣茨木总统通苏了"
  FRA_Imported_Soviet_films: "进口苏联电影"
  FRA_Imported_Soviet_films_desc: "苏联人民并非未开化的野蛮人，他们有自己独特的艺术理解，而幻想乡一直以来都重视艺术的发展，我们可以进口苏联的电影，让人民感受苏联的美学，提高自身审美能力，顺便让他们更加支持我们的事业。"
  FRA_Towards_socialism: "迈向社会主义"
  FRA_Towards_socialism_desc: "这一天终于到来，茨木总统及其团队，正式向议会递交《所有制改革法案》初稿，虽然议会绝大多数议席是我们的同志，但总有意外的出现。这一天，将决定幻想乡的未来！"
  FRA_Join_Third_International: "加入第三国际"
  FRA_Join_Third_International_desc: "现在的幻想乡，是一个名正言顺的社会主义国家，苏维埃联盟已经正式向我们提出邀请，希望我们成为第三国际的一员，当然，这也是我们乐见其成的。"
  FRA_Atlantic_Fortress: "大西洋堡垒"
  FRA_Atlantic_Fortress_desc: "我们加入了第三国际以后，苏联同志希望我们能发挥自己的地缘优势，建设一道防线，对此也愿意帮我们提高建设效率。既然如此，我们答应了这一请求。"
  FRA_Increase_spending_on_armaments: "增加军备支出"
  FRA_Increase_spending_on_armaments_desc: "欧洲大陆上的麻烦已经解决了，但还有其他敌人正虎视眈眈地看着我们，作为这场意识形态斗争的前线，高傲的幻想乡人绝不允许让苏联人站在我们的前面。开足马力，让我们的军工动起来吧！"
  FRA_Across_the_strait: "跨过海峡"
  FRA_Across_the_strait_desc: "是时候了，所有的盟友都已经在海岸边集结完毕，同志们，圣杯王国仍在压榨可伶的无产阶级，她或许以为会永远高枕无忧，但我们无产者说不！来自五湖四海的同志，这一次，与我们一起，解放圣杯！"
  FRA_Deterrence_ENG: "威慑圣杯"
  FRA_Deterrence_ENG_desc: "海的那边是敌人，圣杯仍不死心，妄图继续维持他的大陆均衡政策。既然如此，让我们用我们的军备告诉那群圣杯死灵，这次的欧洲，由我们说了算！"
  FRA_Parliamentary_reform: "议会改革"
  FRA_Parliamentary_reform_desc: "议会是民主制度在国家最后的遗留，我们不会否认议会这些年的贡献，但在社会主义国家当中，我们需要一个忠诚的议会，只要小小的改变一些制度就好了。"
  FRA_Political_censorship_by_parliamentarians: "议员政治审查"
  FRA_Political_censorship_by_parliamentarians_desc: "如果我们不希望被敌人捅了老窝，那么就必须确保身边都是自己人，对议员的政治审查是时候提上日程了"
  FRA_Trade_union_representation: "工会代议制"
  FRA_Trade_union_representation_desc: "随着政治生态的恢复，一些在社会主义刚确立的时候保留的敏感制度是时候终结它的历史使命了，我们已经不需要议会的存在了，工会可以更好的履行议会的职责。"
  FRA_Democratic_socialism: "民主的社会主义"
  FRA_Democratic_socialism_desc: "在[ROOT.Getleader]主席的领导下，我们庄严地向世界宣布，幻想乡已经建成民主的社会主义制度，我们没有苏联那样的大清洗！政治异见者都得到了应有的尊重，这就是我们创造的制度！"
  FRA_Great_Transformation_of_Socialism: "社会主义大改造"
  FRA_Great_Transformation_of_Socialism_desc: "是时候把目光聚焦在经济上面了，政治制度的转变必然会引起不适和冲突，但这些都是时代的阵痛罢了，在全幻想乡进行社会主义大改造，是对阿求先总统构建民主幻想乡的发扬，也是人民赋予我们的庄严使命！"
  FRA_Acquisition_of_capital: "收购资本"
  FRA_Acquisition_of_capital_desc: "资本家来到这个世界的一刻起浑身充满着邪恶。我们要建设一个没有剥削，没有阶级的社会，那些民主制度时期的资本家不应该在社会主义幻想乡中存在，如果他们识趣，收购他们，给一笔分手费对我们彼此都好。"
  FRA_Workers_autonomy: "工人自治"
  FRA_Workers_autonomy_desc: "时机已经成熟了，工人的素质已经大幅提高了，根据[ROOT.Getleader]主席的指示，各地充分发挥工人阶级主观性，鼓励工人自治。为建设共产主义幻想乡打下良好的基础。"
  FRA_land_reform: "土地改革"
  FRA_land_reform_desc: "土地的重要性关乎一个国家的生死，以前的土地大多数掌握在官僚阶级和资产阶级手里。无产阶级的人民受尽了苦头，现在，在[ROOT.Getleader]主席的带领下，我们重新划分土地，让无产阶级的财产回到自己手中。"
  FRA_Establishment_of_People_Commune: "成立人民公社"
  FRA_Establishment_of_People_Commune_desc: "对于如何建设社会主义幻想乡，党内有过争执，最后经过多次讨论，由[ROOT.Getleader]主席拍板，我们要走自己的社会主义道路，不能跟着苏联学，人民公社就是在这种情况下提出的试验性制度。[ROOT.Getleader]主席对此寄予厚望，她相信，人民公社制度会让幻想乡更进一步实现共产主义！"
 #魔理沙
  FRA_first_term_of_Marisa: "雾雨魔理沙第一任期"
  FRA_first_term_of_Marisa_desc: "凭借我们在议会上取得的优势地位，执政联盟日前已高票当选，目前权力已经平安过渡至我们的手里。"
  FRA_PFD_Emergency_intervention: "紧急干预"
  FRA_PFD_Emergency_intervention_desc: "局势已经迫在眉睫，如果我们还想稳定议会内的反对声音，那么就必须尽快结束国内的混乱局势"
  FRA_PFD_Mass_unemployment_benefits: "大规模失业救济"
  FRA_PFD_Mass_unemployment_benefits_desc: "失业潮正在席卷全国，大量的失业民众无疑会急剧壮大左翼激进分子的声势。对失业者的救济工作应当被予以重视。"
  FRA_PFD_Cash_for_work: "以工代赈" 
  FRA_PFD_Cash_for_work_desc: "授人以鱼不如授人以渔，议会已经批准了一系列建设项目的实施，大量的临时岗位将会暂时缓解失业潮对首都地区造成的恶劣影响。当然这只是暂时的"
  FRA_PFD_Abolition_of_agricultural_taxes: "取消农业税"
  FRA_PFD_Abolition_of_agricultural_taxes_desc: "幸运的是，我们在南方的传统农业区目前尚未像我们的朋友一样濒临崩溃，在这种关键时刻，我们必须保证南方能够继续保持农业生产，在危机消弭之前，我们可以以对粮食的收购代替对农业的征税行动。"
  FRA_PFD_Invest_in_countryside: "投资乡村"
  FRA_PFD_Invest_in_countryside_desc: "北方的社会主义者致使整个人间之里地区仍然出于罢工的浪潮之中，在骚乱过去之前我们仍无能为力，但这并不代表我们必须在凡尔赛宫坐以待毙——我们当大力扶持南方的庄园种植业保持稳定。"
  FRA_PFD_Expand_state_powers: "扩大州权"
  FRA_PFD_Expand_state_powers_desc: "经济崩溃与大选的分裂局面使得人里在地方的掌控权出现了严重的倒退，目前强行向地方发布政令已经不太明智，我们更应该将应对危机的权力交付给熟悉当地局势的地方政府部门。"
  FRA_PFD_Appease_the_company: "安抚公司"
  FRA_PFD_Appease_the_company_desc: "企业家们正在就是否转移自己的资产这一问题上犹豫不决，我们可没办法将他们的资金留在幻想乡，但若是坐视不管，资本的大量外流对于我国的经济秩序将是致命的，我们总得做些什么。"
  FRA_PFD_Monopoly_Law: "反垄断法"
  FRA_PFD_Monopoly_Law_desc: "数个颇具影响力的大型产业在上届政府一直致力于在行业内实现垄断地位，而这一次经济危机将可能极大地加速这一进程，我们无法承担起在多个领域都出现垄断企业的政治代价，有必要及时确立法规以保护正处于危难之中的受灾企业。"
  FRA_PFD_Stimulates_positivity: "刺激积极性"
  FRA_PFD_Stimulates_positivity_desc: "一潭死水的金融市场无益于重振国民经济，我们须以政府的名义向企业投放补贴，这将给市场带来一个相对积极的信号——能提一点是一点罢。"
  FRA_PFD_Marisa_three_arrows: "魔理沙的三箭矢"
  FRA_PFD_Marisa_three_arrows_desc: "经济危机业已消褪，但是政治极端主义带来的影响仍然在深刻的影响着幻想乡社会的方方面面。"
  FRA_PFD_Against_the_left: "反对左翼"
  FRA_PFD_Against_the_left_desc: "共产主义者所建立的政治阵线正在竭力破坏我们在社会稳定上取得的成果，必须尽速解决由他们造成的社会骚乱，不然任何重建工业体系的计划都将无从谈起。"
  FRA_PFD_Loosen_ties_for_mild: "为温和者松绑"
  FRA_PFD_Loosen_ties_for_mild_desc: "左翼人士并不都是我们的敌人，出于反极端民族主义者的需要，政见温和的社民党人加入了左翼分子的联盟，但如今他们的立场已经相当微妙，我们与他们之间并无根本分歧，只需一席话语和一个保证，我们便可瓦解面前这个庞大的政治阵线。"
  FRA_PFD_Improving_status_of_trade_unions: "提高工会地位"
  FRA_PFD_Improving_status_of_trade_unions_desc: "前任政府长久以来对工会团体的漠视让幻想乡的大多数工会组织都站在了共产主义者一边，但是他们与共产党人的政见存在着根本性的差异，如果我们能够给予他们有限的组织集会的权力，也许我们就能引导他们与激进派分道扬镳。"
  FRA_PFD_Expulsion_of_instigators: "驱逐煽动者"
  FRA_PFD_Expulsion_of_instigators_desc: "对于正在煽动内乱的革命分子，我们不可擅动刀兵。但我们仍可以其他罪名将他们予以监禁，对于现在紧张的政治局势而言，流放出境显然是一个可靠的折中方案。"
  FRA_PFD_Repel_the_tide_of_revolution: "击退革命浪潮"
  FRA_PFD_Repel_the_tide_of_revolution_desc: "失去执政希望的人民阵线正力图激化工人、小市民与政府的矛盾，不能让国家陷入内战，这是我们的底线，为了捍卫这个底线，任何措施都是必要选项。"
  FRA_PFD_National_justice: "国家公义"
  FRA_PFD_National_justice_desc: "幻想乡正处在一个前所未有的多事之秋中，社会主义者遑论要打碎我们的国家机器，但唯有后者才可捍卫幻想乡公民的自由权利，捍卫共和国的统一与自由乃幻想乡最为重要的公义所在"
  FRA_PFD_Against_tyrants: "反对暴君"
  FRA_PFD_Against_tyrants_desc: "国民联盟与幻想乡保皇派的威胁并不显著，但是他们的激进程度相比于左翼分子更加有过之而无不及。除非釜底抽薪，否则我们难以根除极权主义者在地方的影响力。"
  FRA_PFD_Defend_legacy_of_Mother_Nation: "保卫国母遗产"
  FRA_PFD_Defend_legacy_of_Mother_Nation_desc: "国母生前最为期望的便是幻想乡实现完全而长久的民主化，但国民联盟与全国共和派却提出了与国母背道而驰的主张，在幻想乡人民开始对一个独裁者的未来产生不切实际的幻想之前，我们必须坚决遏止他们的宣传。"
  FRA_PFD_Ensure_fair_elections: "确保选举公平"
  FRA_PFD_Ensure_fair_elections_desc: "1936年大选只能用一场闹剧来形容，国母生前构想的普遍选举最终沦为了各路政见者尔虞我诈的夺权工具，我们必须对此保持高度的警惕。我们需要让所有的在野党派都明白这么一点：选举颠覆不了这个伟大的共和国度。"
  FRA_PFD_Defend_spirit_of_Great_Revolution: "捍卫大革命精神"
  FRA_PFD_Defend_spirit_of_Great_Revolution_desc: "“自由、平等、博爱”这是大革命长久以来所坚持的至高准则，我们的政治传统在1936年面临着前所未有的挑战。风暴业已过去，但我们必须再一次重申这一关乎共和国国本的准则，这将是幻想乡反对政治极端主义的最有力武器。"
  FRA_PFD_Loosen_bonds_for_capital: "为资本松绑"
  FRA_PFD_Loosen_bonds_for_capital_desc: "前任政府为了稳定各方情绪，一直对国内的民间企业保持严格限制。现在情况有变，我们需要民间企业的经济支持。否则我们长久以来的疲于奔命都将毫无意义。"
  FRA_PFD_Return_to_true_freedom: "回归真正的自由"
  FRA_PFD_Return_to_true_freedom_desc: "我们要为国民解决的问题大抵可以归为两个：制造财富的问题与分配财富的问题。这两个问题必须合在一起来解决，以公正的配给确保个人的幸福、以合理的分工创造公众的权力。唯有如此我们才能创造社会的繁荣——自由的公民、伟大的国度！"
  FRA_PFD_Against_the_right: "反对右翼"
  FRA_PFD_Against_the_right_desc: "极端民族主义者信心满满的利用36年大选为自己争取到了莫大的支持，对于他们的做大，如果我们不及时采取反制措施，他们的支持者会以极快的速度将冲突激进化，我们必须做好应对。"
  FRA_PFD_Accept_more_foreign_investment: "接纳更多外资"
  FRA_PFD_Accept_more_foreign_investment_desc: "我们不能因为一时的灾难就将目光收回国内，尚有因为大萧条的灾难而流出本国的各路外国资本能为我所用，一个宽松的投资环境将能够比任何时候更加能够吸引海外资本流入我国市场。"
  FRA_PFD_Establishment_of_Constitutional_Security_Bureau: "设立宪法保卫局"
  FRA_PFD_Establishment_of_Constitutional_Security_Bureau_desc: "面对明显有着海外支持的各路反对派系，幻想乡迫切需要一支能够在内务与情报战线保卫共和国的特勤队伍，我们应当要求议会拨款建立一个忠诚于共和国的情报与内务部门——就算这与逝者的意愿相左。"
  FRA_PFD_Invest_in_areas_lagging_behind: "投资落后地区"
  FRA_PFD_Invest_in_areas_lagging_behind_desc: "贫穷是独裁与极权生长的土壤，我们应当致力于弥合南北的地域经济差异，对部分经济落后地区施以有条件的投资与经济援建。"
  FRA_PFD_Model_Free_State: "模范自由州"
  FRA_PFD_Model_Free_State_desc: "光扯旗呼喊自由的口号是远远不够的，当局必须让地方看见我们进行政治改革的魄力，同时又不至于做出失措之举。这些改革可以先在一个州或数个州内予以实施，再权衡收益的同时为其他地方做出一个榜样——这便是“自由州”存在的要义"
  FRA_PFD_To_be_free_to_be_peaceful: "要自由，要和平"
  FRA_PFD_To_be_free_to_be_peaceful_desc: "我们为什么反对共产主义者？因为我们拒绝一个异想天开的极权机器；为什么反对法西斯？因为大革命的初衷便是消灭暴君。我们有信心消灭有产者对无产者的丑恶剥削，更有信心将披着民粹主义外衣的战争贩子驱逐出去。我们会证明自由与博爱并不是一句空话。"
  FRA_second_term_of_Marisa: "雾雨魔理沙第二任期"
  FRA_second_term_of_Marisa_desc: "自由党政府战胜了一系列内外威胁，现在局势大好，幻想乡正在进入一个难得的黄金时期。"
  FRA_PFD_Pan_Democratic_Alliance: "泛民主联盟"
  FRA_PFD_Pan_Democratic_Alliance_desc: "经过多年耕耘，我们成功将几乎所有忠诚于民主制度的政治派系团结在了一座屋檐之下，失去民心的左翼乱党黯然退场，极端民族主义者大多也已偃旗息鼓。我们成功争取到了不同党派的一致共识，议会的权威从来没有如此稳固过。"
  FRA_PFD_Remembering_Hieda_no_Akyuu: "铭记稗田阿求"
  FRA_PFD_Remembering_Hieda_no_Akyuu_desc: "人类，稗田阿求的躯体\n就像一本旧书的封面，没有了内容\n字迹斑驳，镀金脱落，躺在这里，成为尘埃的食物\n但是她的工作成果不会丢失：\n就像她所期待，所相信的那样，再次出现\n以新的更完美的版本，更正和修订\n由作者"
  FRA_PFD_Happiness_and_not_exploitation: "幸福而非剥削"
  FRA_PFD_Happiness_and_not_exploitation_desc: "圣杯王国创造了前所未有的财富，但他们的傲慢与高贵招致了危机的爆发，两个问题只能合在一起解决，唯有合理的分配制度能够造就个人幸福，唯有公正的分工体系能够塑造公众意志。"
  FRA_PFD_Freedom_not_law: "自由而非律法"
  FRA_PFD_Freedom_not_law_desc: "对于暴君来说，苛法是压迫人民的武器，而对于革命者来说，自由便是革命者的公义，任何律法都不能干涉公民的自由权利，这是幻想乡用枪炮与鲜血确立的至高准则。"
  FRA_PFD_Gilded_Age: "镀金时代"
  FRA_PFD_Gilded_Age_desc: "自由党政府准确预见到了干涉主义在未来可能会面临的弊处，重新被予以放开的市场经济为幻想乡带来了一场迟来的繁荣时期，如今国泰民安，幻想乡民族的自信力也进入了一段久盛不衰的时期。"
  FRA_PFD_Deregulation: "放宽管制"
  FRA_PFD_Deregulation_desc: "出于对经济危机的恐惧，在新政伊始仍有巨大的政治压力要求我们对市场进行一定程度的遥控与限制，但现在已经没有什么好担心的了，我们应当进一步顺应经济发展的热情，放松政府的不必要管制"
  FRA_PFD_Invest_in_education: "投资教育"
  FRA_PFD_Invest_in_education_desc: "幻想乡开始在各个领域出现了人才缺口，这与我们快速增长的国民经济离不开关系。但话虽如此，幻想乡仍需要足够的技术产业与经济管理人才，我们得加强国内的人才培养能力。"
  FRA_PFD_War_on_poverty: "对贫穷开战"
  FRA_PFD_War_on_poverty_desc: "即使是现在，幻想乡国内的失业率与贫困率仍然让人头疼，但现在已不比战前，我们有足够的资本与能力彻底结束36年失业潮给共和国带来的不利影响，最终我们将一劳永逸的提高国民的生活水平。"
  FRA_PFD_Fair_Labor_Act: "公平劳动法案"
  FRA_PFD_Fair_Labor_Act_desc: "劳动者的权益必须得到确保，光靠宣传与规劝是无法消灭不合理剥削的，我们得在薪资、劳动工时、劳动者福利等问题上进行明确立法，这当然不是一纸法案便可解决的问题，但至少要让国民看到我们使每个公民都成为有产者的决心。"
  FRA_PFD_Limit_wealth_limit: "限制财富上限"
  FRA_PFD_Limit_wealth_limit_desc: "如果幻想乡里存在着一个极度富有的硕鼠，那么我们关于自由与公正的说辞都将变的毫无意义，修订累进税法案势在必行，在从根本上消灭垄断阶级之前，我们需要通过国家机制平衡阶层间的经济差距。"
  FRA_PFD_Freedom_equality_fraternity: "自由、平等、博爱"
  FRA_PFD_Freedom_equality_fraternity_desc: "我们无愧于在大革命中付出了生命的无数革命先辈，政治极端主义已经消亡，取而代之的是公众对古典的自由哲学所秉持的新共识，当我们的目光放在整个世界，在我们向世界输出来自幻想乡的自由理念时，我们不会缩头回避，我们会昂首挺胸。誓要将我们的革命传播至五湖四海。"
  FRA_PFD_This_is_our_time: "这是我们的时代"
  FRA_PFD_This_is_our_time_desc: "我们达成了国母所希冀的目标，革命者皆以本国为楷模，“自由、平等、博爱”将成为全人类的共识，这是我们的时代。"
  FRA_PFD_This_is_the_era_of_Gensokyo: "这是幻想乡的时代"
  FRA_PFD_This_is_the_era_of_Gensokyo_desc: "幻想乡对内平息骚乱，重现繁荣；对外讨伐暴君，重建均势。放眼欧罗巴，已再无轻视幻想乡之权威者，这是幻想乡的时代"
  FRA_PFD_This_is_beginning_of_better_future: "这是美好未来的开端"
  FRA_PFD_This_is_beginning_of_better_future_desc: "我们正站在一个新的十字路口上，我们的繁荣是否虚伪还尚需时日验证，诸多强权依然在对着欧罗巴虎视眈眈。我们是否能继承这个革命的王冠并进一步实现阿求的梦想——抑或是糟践它？"
 #慧音
  FRA_first_term_of_Kamishirasawa_Keine: "上白泽慧音第一任期"
  FRA_first_term_of_Kamishirasawa_Keine_desc: "慧音总统迎接到了她的第一任期"
  FRA_social_responsibility_of_capitalists: "资本家的社会责任"
  FRA_social_responsibility_of_capitalists_desc: "他们在我们的国家有着大量资产，笼络也好要求也罢，我们必须让他们参与国民经济的维持工作。若为必要，幻想乡不会坐视他们的财富离开祖国。"
  FRA_Encourage_capital_investment: "鼓励资金投入"
  FRA_Encourage_capital_investment_desc: "如果说我们想要让市场重新恢复流转，必要的资金投入是不可缺的，我们应当鼓励现有的资产者重新将资金流投入市场，以期恢复经济活力。"
  FRA_Shrink_government_budgets: "缩减政府预算"
  FRA_Shrink_government_budgets_desc: "值此危机岁月，我们必须裁撤部分冗余官员，取缔非必要的政府部门，将预算节省出来以应对危机。"
  FRA_Government_enterprise_dialogue: "政企对话"
  FRA_Government_enterprise_dialogue_desc: "我们的资金储备即将告罄，如果我们不想在这种极端危急的时候向民众宣布破产，那么就有必要请求民间企业的支持了，相信他们也不会坐视政府被迫停止应对危机局势。"
  FRA_Limited_expansion_of_trade_union_powers: "有限扩大工会权力"
  FRA_Limited_expansion_of_trade_union_powers_desc: "尽管我们在台前战胜了社会主义者，但左翼运动仍然广泛存在于幻想乡地方的工会团体中，幻想乡仍无法承担起镇压工人团体或任其激进化的代价。不妨让我们坐在一起，为了共克时艰，我们总能在某些关键问题上达成共识......"
  FRA_Basic_social_security: "基础社会保障"
  FRA_Basic_social_security_desc: "工人也是人，是人就会在乎自己的安全问题，人没有安全感能做出什么来是不可预料的，我们可以给他们一些基础保障，让他们有部分保障自己的能力。"
  FRA_Invisible_big_hands: "无形的大手"
  FRA_Invisible_big_hands_desc: "我们坚信着这样一个理念：即便所有人都在为一个自私的理由积累资产，资本的成长与进取也必然会为人民带来更加丰硕的财富。我们将战胜贫穷与专制，我们的政府将会是这个自由体系的捍卫者，届时，这个伟大的文明社会将会一劳永逸的解决这个永恒的难题——如何分配我们的财富。"
  FRA_Enhance_your_investment: "增强投资"
  FRA_Enhance_your_investment_desc: "大萧条对国家经济带来的负面影响是深远的，经济部门必须时刻关注国民经济稳定，当务之急乃是重振国民的消费与投资信心。"
  FRA_Kamishirasawa_Banks_cut_interest_rates: "银行降息"
  FRA_Kamishirasawa_Banks_cut_interest_rates_desc: "经济危机既已消弭，诚应要求国内资金流恢复运转，一项激进的利率下调政策将开始重新刺激银行资金的流出，我们在国内市场的投资也将更加方便。"
  FRA_economy_is_picking_up: "经济回暖"
  FRA_economy_is_picking_up_desc: "随着消费量回升、金融活动逐渐恢复活力，我们有信心一举扭转经济下行的不利局势，这将有利于我们重新提振国民经济。"
  FRA_Cut_government_interference: "削减政府干涉"
  FRA_Cut_government_interference_desc: "我们没法让一个被固定在担架上的病人自己起身下地。政府的资金应当被布置在更加——”关键“的地方，以”鼓励“代替”扶持“，这是修复市场创伤的必行之策。"
  FRA_The_miracle_of_the_market: "市场的奇迹"
  FRA_The_miracle_of_the_market_desc: "我们相信市场本身的力量，尽管为了渡过这多事之秋我们付出了巨大的代价，但时间终究证明，自由的意志仍然庇佑着幻想乡的国度，我们能够创造又一个奇迹，现在我们所需要的唯有时间......"
  FRA_Free_market_free_people: "自由的市场，自由的人民"
  FRA_Free_market_free_people_desc: "坚持自由主义的信条让我们渡过了幻想乡最为危急的一段时间，至少现在已经无人再对新政府抱有疑虑，幻想乡仍是民主世界中最为耀眼的灯塔，而我们将会彻底确保这一点。"
  FRA_Restart_government_functions: "重启政府职能"
  FRA_Restart_government_functions_desc: "随着政治局势趋于稳定，我们应当让自由党政府在国内问题上发挥更加主动的作用，以避免更多人倒向政治极端主义。"
  FRA_Increasing_education_subsidies: "提高教育补贴"
  FRA_Increasing_education_subsidies_desc: "经济危机使得幻想乡尚且孱弱的公共教育部门遭到了毁灭性打击，我们承受不了儿童大量流入工厂将会带来的政治压力。目前必须人为重建幻想乡的教育体系。"
  FRA_Anti_communist_propaganda: "反共宣传"
  FRA_Anti_communist_propaganda_desc: "那群社会主义者遑论自己是幻想乡的救世主，但谁又不知他们正是国家昏乱的始作俑者！若不能让国民看清那群赤匪的真面目，我们又怎能在这个国家真正站稳脚跟？"
  FRA_Tickets_to_the_world: "通向世界的机票"
  FRA_Tickets_to_the_world_desc: "我们对本国企业独特的扶持政策吸引到不少海外资本的关注，毕竟困于危机的民间企业并不只限于幻想乡一国，全世界的热钱都在寻求一个稳定的投资环境，当然，幻想乡具备这个环境。"
  FRA_Expand_foreign_trade: "扩大外贸"
  FRA_Expand_foreign_trade_desc: "危机时日我们曾经大幅铺设对外国的关贸壁垒，但现在维持对外关税的高压态势对幻想乡已无益处，我们应当重启海外诸国的正常贸易，第一个领头扭转国家之间的关贸壁垒。"
  FRA_All_roads_lead_to_Paris: "条条大路通人里"
  FRA_All_roads_lead_to_Paris_desc: "我们在危机时投入的公共设施建设已经取得了短期成果，我们新建了数条从各地链接人间之里的主干道，这将有利于国内贸易与人口的自然流转。也利于工业部门进行进一步的工业规划。"
  FRA_Decentralized_companies: "放权公司"
  FRA_Decentralized_companies_desc: "为了抑止金融崩溃，我们曾以行政手段控制了几所在国内具有垄断地位的经济企业。现在政治局势已经趋于稳定，我们可以适当放开对企业的管控——当然，我们必须为此付出代价。"
  FRA_Expand_collaborative_projects: "扩大合作项目"
  FRA_Expand_collaborative_projects_desc: "我们有机会和几家颇具财力的企业商讨经济合作项目，委托他们负责一些经济方面的关键项目。我们将提供丰厚的利润，相对的，这些企业或多或少的要与我们的利益进行绑定。"
  FRA_Collect_political_contributions: "收取政治献金"
  FRA_Collect_political_contributions_desc: "这些企业能够收取政府订单，在税务上享受莫大福利。这些优惠无疑将造就数一数二的富豪，自然的，对于这些和我们一条船上的巨贾，他们也必须承担起支持我们的经济义务。"
  FRA_Special_preferential_treatment_policy: "特别优待政策"
  FRA_Special_preferential_treatment_policy_desc: "我们无法在明面上与民争利，但有着一批忠诚于我们的地方企业为我们铺设帷幕，我们可以将这些企业放在一个特别的经济地位上，利用他们去为幻想乡的府帑冲锋陷阵。"
  FRA_Repeal_the_Antitrust_Law: "废除反垄断法"
  FRA_Repeal_the_Antitrust_Law_desc: "反对垄断曾经是全幻想乡政治势力一致认可的国策，可是现在情况有变，我们委任的经济代理人在扩张势力上显然有着更加庞大的野心，考虑到如此一来我们亦能遥控国民经济的方方面面，也许我们不该再考虑过时的原则。"
  FRA_The_country_of_business: "企业之国"
  FRA_The_country_of_business_desc: "民营企业是幻想乡的支柱，他们将我国从大萧条的泥潭中拉了出来，没有这些企业，没有自由贸易，天知道会发生怎样的灾难。幻想乡将在市场的保佑下，得到真正的自由，成为一个企有、国治、民享的天堂！"
  FRA_second_term_of_Kamishirasawa_Keine: "上白泽慧音第二任期"
  FRA_second_term_of_Kamishirasawa_Keine_desc: "独立民盟的统治平安进入了第二任期，而幻想乡此时也在面临新的威胁与机遇。"
  FRA_Elite_mercenaries: "精锐雇佣军"
  FRA_Elite_mercenaries_desc: "在常规的国家机器上，我们可以从各地征集一批精锐的佣兵部队，来应对可能发生的局部战争与内部动乱。"
  FRA_President_direct_Einsatzgruppen: "总统直属特别行动队"
  FRA_President_direct_Einsatzgruppen_desc: "内阁需要一支只听命于总统阁下的直属特勤部队，他们将能够独立于议会之外为国家执行军事任务，这将赋予我们在小型冲突里争得先机的能力。"
  FRA_Restraining_oligarchs: "提防寡头"
  FRA_Restraining_oligarchs_desc: "我们对部分大型企业的优待态度正在激起他们的政治野心，他们似乎意图用金钱攻势颠覆我们在议会的影响力并伺机控制其他的政治势力，不过说到底，古往今来造反的都是工人，从没听说过商人能反了天。他们不是什么政治家，我们也不需要用政治手段处理他们......"
  FRA_Increase_funding_for_education: "增加教育经费"
  FRA_Increase_funding_for_education_desc: "教育永远是宣传工作的前沿阵地，相比于街头不遗余力的扯旗呐喊，在课堂上将我们的理念潜移默化的植入孩童与青年的思想可能会显得更加廉价而有效。我们应当在推进教育这一事项上不遗余力。"
  FRA_Strengthen_history_education: "强化历史教育"
  FRA_Strengthen_history_education_desc: "历史是一个国家宝贵的精神财富，我们辉煌的过去理应让每个年轻的幻想乡学生都知晓。加强对历史教育的投入，传播幻想乡核心价值观，我们的国民将更加昂扬向上。前进，幻想乡的人民！"
  FRA_lessons_learned: "吸取教训"
  FRA_lessons_learned_desc: "学习历史不是为了复现过去的错误，相反，我们应从之前的教训中获得成长，学会如何避免重蹈覆辙。犯错并不可怕，可怕的是没有勇气承认错误，没有理智分析错误，没有行动改正错误。"
  FRA_education_of_Fujiwara_no_Mokou: "藤原妹红的教育"
  FRA_education_of_Fujiwara_no_Mokou_desc: "政坛舞台的中央不能老是被老人们霸占着，是时候为我们的事业引入新鲜血液了。经过讨论，一颗即将冉冉升起的新星，藤原妹红，进入了高层的视线，不过她尚且年轻，缺少些许历练，也许我们应该先对她进行一番培养。"
  FRA_wet_behind_ears: "初出茅庐"
  FRA_wet_behind_ears_desc: "经过一段时间的学习，藤原妹红已经初步掌握了一些处理事务的诀窍。我们将给初出茅庐的她安排一个职位，允许她独自处理一些事务，让我们期待她的表现吧，希望她能交出一份令人满意的答卷。"
  FRA_Leaders_Credentials: "领袖之资"
  FRA_Leaders_Credentials_desc: "藤原妹红的首秀非常精彩。据观察，她在处理事务的过程中，表现出了卓越的决策能力，优秀的沟通技巧和团队管理能力，更重要的是，她展现了一股独属于本人的领导魅力。也许她会成为我们新一代的领军人物？"
  FRA_Fully_capitalized: "完全资本化"
  FRA_Fully_capitalized_desc: "我们成功粉碎了社会主义者与保守主义政党动摇共和国的企图，支持我们的大型企业不遗余力的在地方巩固自民党的政治影响力，在我们的构想下，我们也许能够真正的进行一场资本主义式的政治实验？"
  FRA_Military_industrial_complex: "军工复合体"
  FRA_Military_industrial_complex_desc: "我们与地方企业的联系紧密，这允许我们在军工制造业上与几个实力雄厚的军事生产商商讨更加深入的合作，这将显著增进幻想乡军事装备的研发能力。"
  FRA_military_horn_struck_gold_come: "军号一敲，黄金万两"
  FRA_military_horn_struck_gold_come_desc: "如果没有足够烈度的军事冲突，我们的战争机器所制造的每一件武器都将毫无价值，战争显然已经成为幻想乡经济驱动的必要要素，正因如此，共和国必须自己维持这个要素所在，哪怕我们要成为大战的发动者。"
  FRA_The_Recolonization_Movement: "再殖民运动"
  FRA_The_Recolonization_Movement_desc: "昔日，大革命令幻想乡失去了其几乎所有的海外领土，法兰西王逆的西逃使得其能在大洋彼岸与共和国对峙整整百年。重新将美洲领地纳入幻想乡控制的计划应当在合适的时候提上日程。我们将会粉碎美洲的反殖民主义势力！是该结束这场革命了，一了百了。"
  FRA_Keines_whimsy: "慧音的奇思妙想"
  FRA_Keines_whimsy_desc: "我们的领袖上白泽慧音是中华的神兽白泽，那么我们大统领当然有统治整个中华领土的权力与义务！"
  FRA_Entertain_to_death: "娱乐至死"
  FRA_Entertain_to_death_desc: "在幻想乡这个灯红酒绿的奢靡之都，电影事业的发展开始催生出一批当红的影视明星，而国民偶像的出现亦牵动着幻想乡国民的心绪，我们没有理由对此坐视不理。通过规范明星制度、经纪公司合法化等一系列举措，我们有望在娱乐产业上实现飞跃式的发展。"
  FRA_Money_rolls_in: "金钱滚滚来"
  FRA_Money_rolls_in_desc: "钱钱钱钱钱我就爱钱，不演了不演了，国家也好，世界也罢，不让我们赚钱的统统都灭啦，我们就是金融本身，我们是世界经济的操纵者！谁敢不让我们赚钱，我们就杀杀杀杀杀。其他事情都无所谓，我们有钱！"
 #早苗
  FRA_revolution_ended_there: "革命到此为止"
  FRA_revolution_ended_there_desc: "数年以来，社民党人和她们所谓的人民阵线弄得美丽的幻想乡乌烟瘴气，伟大的早苗元帅代表着人民真正的心声：\n“够了，这已经够了！”"
  FRA_Pro_Western_diplomacy: "亲西方外交"
  FRA_Pro_Western_diplomacy_desc: "过去，我们疏远圣杯，亲近东方国家以保持中立的政策在今天已经被证明是彻头彻尾的失败，那些被拉拢的对象无一在我们最为难的时候帮助我们。现在，是时候重回自由世界的怀抱，让我们的历史友邦来为我们的崛起提供最强有力的外部助力。"
  FRA_Back_to_the_free_market: "重回自由市场"
  FRA_Back_to_the_free_market_desc: "自由党人的观点毫无疑问是正确的：政府干涉对于拯救经济毫无作用，这是左派份子侵害祖国的另一根毒刺。而我们将用铁腕将它拔出，并带给经济真正的自由。"
  FRA_Manhunt_for_left_wing: "搜捕左翼"
  FRA_Manhunt_for_left_wing_desc: "虽然国家议会和政府已经被我们牢牢掌握，但肉眼可见的大量社民派组织和地下活动仍然活跃于整个国家。现在，取缔这些非法组织的命令已经下达，天下静谧之时即将到来。"
  FRA_The_Golden_Age: "黄金年代"
  FRA_The_Golden_Age_desc: "现在，异见人士束缚在我们伟大祖国上的枷锁已经被我们全部击碎，是时候由我们踩下油门，向着新的伟大时代冲刺了！"
  FRA_Assault_refurbishment_of_the_Tengu: "突击式翻新天狗里"
  FRA_Assault_refurbishment_of_the_Tengu_desc: "想要得到足够的投资，就需要大量的面子工程。通过利用塞钱来创造人民也立刻看得见，摸得着的景观，是最重要的。而给投资者以信心的永远是一条干净而腐败的街道，或者夜晚糜烂的灯光。"
  FRA_Shrine_Loan_Program: "神社贷款计划"
  FRA_Shrine_Loan_Program_desc: "通过发放大量未经审查的贷款，可以短暂刺激经济。等待生意成熟而小企业主们尝试贿赂官员而进一步扩张的时候，她们要么被早苗的庞大计划所控制，要么倾家荡产。"
  FRA_Restructuring_of_standing_positions: "改建常平仓"
  FRA_Restructuring_of_standing_positions_desc: "在远古的幻想乡时期，设立了许多常平仓，用于在谷物低下时购买谷物，高价时卖出谷物。而现在这些仓库暂时空置。我们可以永远地借用它们，把它们变成富商巨贾们倒腾货物的储仓，可以得到大量的现金流。"
  FRA_Made_in_Kappa: "“河童制造”"
  FRA_Made_in_Kappa_desc: "通过一个简简单单的商标，我们可以用补贴国有大企业和外资小企业的模式让她们先来幻想乡落户。其次，再把这些产品赋予给公众“河童制造”的印象。消费者会爱上，并依赖它。"
  FRA_Pension_reinvestment: "养老金再投资"
  FRA_Pension_reinvestment_desc: "早苗之前的幻想乡真的有人懂经济吗？这个本质上不完善的养老金制度如果还想继续存续下去，那么作为商业模式的探索者，那些本来就不会死的妖怪们的养老金被强制再投资到一个指定指标，以促进经济繁荣。"
  FRA_Direct_material_assistance: "直接性物质援助"
  FRA_Direct_material_assistance_desc: "切断利用助学贷款，助农贷款等资金链来补贴财政溃口，随后直接发放东风谷财团名下无法出口的多余产品——无疑是为了更伟大的目标一起努力而做的微小贡献。至少你得承认，天狗与河童们的工艺还是值得信任的，不是么？"
  FRA_The_loveliest_laborer: "最可爱的劳动者"
  FRA_The_loveliest_laborer_desc: "可爱的妖精们有能力胜任任何车间的精密工作。通过革新工作保障和制度，一些小小的奖励就可以激发她们巨大的工作热情。"
  FRA_The_gift_of_Yokai_Mountain: "妖怪之山的馈赠"
  FRA_The_gift_of_Yokai_Mountain_desc: "既然早苗已经成功当选，那么妖怪之山的馈赠应当被彻底发掘出来。有了这些钨矿，我们可以确保战时的资源供应。"
  FRA_Large_arms_contracts: "大额武装合同"
  FRA_Large_arms_contracts_desc: "幻想乡人类所属的军队通常装备落后，士气低落。而我们的军火工厂也因为没有订单而困扰。那么，一个完美的解决办法就诞生了；无论如何，流水线必须开动！"
  FRA_Now_man_and_God_have_property: "现人神有财产"
  FRA_Now_man_and_God_have_property_desc: "国有财产？公有财产？私有财产？宗教财产？好像都不是。一批纯粹依靠热情而低成本的工业如同雨后春笋般涌现出来，奠定了这一新的所有权模式。"
  FRA_Miracle_Affordable_Housing: "奇迹保障性住房"
  FRA_Miracle_Affordable_Housing_desc: "如果你欠神社百八十块，那么神社是你的负责人；如果你欠神社成千上万块，那么你是神社的人。但是成为神社的人，至少确保了这些可怜人的保障性住房政策，好让她们继续为幻想乡服务。"
  FRA_Replan_the_voting_zoning: "重新规划投票分区"
  FRA_Replan_the_voting_zoning_desc: "在来之不易的胜利过后，通过重新规划守矢神社的投票分区，我们可以确保在下次选举的时候这些地区都会被以一个相对稳固的优势让早苗再次胜利。"
  FRA_Burn_the_debt_file: "烧毁债务档案"
  FRA_Burn_the_debt_file_desc: "没有人想会知道多少人抽了多少油水，也没有人将会知道。直接将债务档案用奇迹烧毁，可以确保那些贪污商人不会因为被清算的恐惧而离开幻想乡，更能稳定乱局。那些经常挪用公款的大妖怪们也会少一些牢骚了。"
  FRA_Take_advantage_of_greed: "利用贪婪"
  FRA_Take_advantage_of_greed_desc: "贪腐好办事。通过利用人性的缺陷，奇迹就可以达到任何地方，德意志国的招标计划里，超次元的外包合同章下，甚至……邻国元首的桌子上……"
  FRA_Sanae_University: "早苗大学"
  FRA_Sanae_University_desc: "在守矢神社下先富起来的第一批人，现在想要为了她们的企业培养更多的人手，而同时也为了回赠早苗所赋予她们的一切全能——一个私办而有庞大的大学，在天狗里被建立了起来。"
  FRA_Streamlining_bureaucracy: "精简官僚系统"
  FRA_Streamlining_bureaucracy_desc: "通过雇佣外国富有经验的买办阶层，我们就可以获得她们的效忠，更快与外国企业接头的渠道，以及打压本国的大妖怪阶层。她们的专业技能为我们所需要。"
  FRA_Elimination_system: "抹零制度"
  FRA_Elimination_system_desc: "由于货币的不统一，收谷物税或者矿业税的时候总是会被官吏小小的“抹零”，还经常造成基层与民众之间的冲突。不如干脆以神社的名义正式化这些繁杂的步骤，一举赢得基层官吏的欢心。"
  FRA_Shrine_Maiden_Execution_Team: "巫女执行队"
  FRA_Shrine_Maiden_Execution_Team_desc: "汲取了上次伟大战争阿克西斯教团尝试渗透守矢神社的例子来看，让平常不参与劳动的青少年女性加入巫女执行队无疑是一个好选择。将道德检查这一权力交给巫女们的好处，就是我们将收获一批忠诚的青年军，时刻为了早苗的意志而战斗。"
  FRA_Factory_Expansion_Act: "工厂膨胀法案"
  FRA_Factory_Expansion_Act_desc: "失业者是诞生极端思想的最佳土壤。经过了与一些外企与本地龙头企业的对接，每个扩编的工厂都可以获得一些廉价的劳动力和政府采购上的优惠。"
  FRA_Kidnapping_of_public_opinion: "民意绑架"
  FRA_Kidnapping_of_public_opinion_desc: "通过之前的贿赂，我们可以一个一个把那些成事不足败事有余的官员拖下水。文文新闻一报道，号外一喊，巫女执行队就将站在这些官员的门外，带去必然面对的命运。"
  FRA_Organize_science_notes: "整理理科笔记"
  FRA_Organize_science_notes_desc: "东风谷早苗的记忆可谓是一个大宝库。只要把其中有用的知识时不时的做一些整理，相信我们可以提前预知战争未来的发展方向。"
  FRA_Thought_control: "思想控制"
  FRA_Thought_control_desc: "大家跟着我念：“我们永远敬爱早苗！”\n对，很好，再念一遍\n嗨，那边的，对，就是你\n怎么，你不敬爱伟大的早苗么？\n我记得你的家人都在人间之里，对么？"
  FRA_Twice_saved_the_Motherland_hero: "两次拯救祖国的英雄"
  FRA_Twice_saved_the_Motherland_hero_desc: "伟大的东风谷早苗证明了她无愧幻想乡救世主的称号！两次伟大战争中，是早苗元帅带领我们拿下了胜利，接下来的世界，无人可以挑战幻想乡的荣光！"
  FRA_cant_follow_common_sense_Gensokyo: "在这个幻想乡可不能按常理行事"
  FRA_cant_follow_common_sense_Gensokyo_desc: "妖怪和人类第一次团结在一位巫女的手下，经历过以前的分裂的老人都高呼不符合常理，但她是早苗，已经有人提出，凡是早苗元帅的命令，就一定是正确的！凡是早苗元帅的敌人，就一定得毁灭！"
  FRA_I_am_a_miracle: "我即奇迹"
  FRA_I_am_a_miracle_desc: "早苗元帅在战场上那出神入化的指挥艺术让每一位军官都为之倾倒，目前指挥部希望早苗元帅能抽时间对这些军官们进行教学以提高指挥能力，当然早苗元帅也很乐意帮助自己的追随者们更加优秀。"
  FRA_Immortal_Empire: "不朽帝国"
  FRA_Immortal_Empire_desc: "现在的幻想乡，放眼望去毫无敌手，欧洲大陆由我们说了算，如果说目前的幻想乡还缺少什么的话，那就是缺一个带着皇冠的主人！"
  FRA_Citizens_are_patriotic: "公民皆爱国"
  FRA_Citizens_are_patriotic_desc: "长时间的爱国教育已经让我们的公民为祖国的成就而自豪，并乐意将自己的余生奉献在祖国强盛的道路上。这无疑能够让陛下的统治更加牢固，没有什么比公民热爱祖国更能证明一个政权的先进性的。"
  FRA_New_Continental_Army: "新大陆军"
  FRA_New_Continental_Army_desc: "巫女执行队已经在战争中证明自己的实力，早苗陛下对此大加赞赏，并提出以巫女执行队为核心组建一支全新的忠于皇帝的军队，早苗陛下亲自命名为新大陆军！"
  FRA_Glorious_elitist_rule: "光荣的精英化统治"
  FRA_Glorious_elitist_rule_desc: "早苗陛下带来的胜利让幻想乡精英阶级主动向我们靠拢，那些接受过良好教育的人才都愿意为早苗陛下献上忠诚，早苗陛下也大发慈悲让精英阶级一些忠诚人士获得更好的奖励，以此激发这些家伙的热情。"
  FRA_Imperial_Guard: "帝国近卫军"
  FRA_Imperial_Guard_desc: "随着陛下加冕的落幕，一支受陛下直接指挥的近卫军组建计划被提上了日程。我们要做到，近卫军将成为早苗陛下意志的延申！陛下指到哪里，近卫军就要以最快速度到达哪里。"
  FRA_Kochiya_Code: "东风谷法典"
  FRA_Kochiya_Code_desc: "为了维护皇帝的统治，早苗陛下组织学者亲自撰写了一部法典，为皇帝的统治赋予了合法性。这部法典也被命名为东风谷法典。"
  FRA_Emperor_we_love_you: "皇帝，我们敬爱你呀！"
  FRA_Emperor_we_love_you_desc: "东风谷早苗，我们的巫女，我们的元帅，我们的皇帝！整个幻想乡都在高呼，皇帝万岁！"
  FRA_Continental_system: "大陆体系"
  FRA_Continental_system_desc: "是时候了，愚蠢的圣杯王国已经不配成为幻想乡的盟友了，欧洲大陆应该是幻想乡说了算！我们将会与忠诚于皇帝陛下的外国友人们，组建一个幻想乡的势力圈，将来，早苗陛下的意志就是欧洲的意志！"
  FRA_Coronation_of_King_of_Iberia: "加冕伊比利亚国王"
  FRA_Coronation_of_King_of_Iberia_desc: "自古以来，伊比利亚就是幻想乡不可分割的一部分，正好早苗陛下的皇冠上的明珠有点少了，那么是时候让伊比利亚重回幻想乡的怀抱了。"
  FRA_Rebuild_Duchy_of_Warsaw: "重建华沙公国"
  FRA_Rebuild_Duchy_of_Warsaw_desc: "一直以来，执念之国就是欧洲的门户，她们承担着守护欧洲大门的重任，如今，整个欧洲都在幻想乡的管辖下，那么这座门户，就应该属于幻想乡！建立华沙公国，让她们成为幻想乡的守门者。"
  FRA_Sanae_Bank_expands: "早苗银行扩张"
  FRA_Sanae_Bank_expands_desc: "火车银行自以为能永远保持中立，但现在整个欧洲都在贯彻早苗陛下的意志，火车银行竟敢反对陛下，军队已经动员完毕，火车银行的存在必须消失！"
  FRA_Lost_shrine_fiefdom: "守矢神社封地"
  FRA_Lost_shrine_fiefdom_desc: "守矢神社培养了早苗陛下，陛下也对这片土地充满感情，军部有个提议，给那些意大利佬一个教训，让守矢神社变大一点，想必可以获得陛下的欢心。"
  FRA_Destroy_encirclement: "摧毁包围网！"
  FRA_Destroy_encirclement_desc: "我们的敌人畏惧幻想乡的威势，居然联合起来，试图玷污早苗陛下的荣光，这是我们不可忍受的，军队已经集结完毕，我们相信，此战以后，幻想乡再无对手，守卫幻想乡荣光，吾辈义不容辞！"
  FRA_Take_Louisiana_home: "带路易斯安那回家"
  FRA_Take_Louisiana_home_desc: "是时候让我们的北美殖民地回归了，她们离开我们太久了，邪恶的精灵在我们的土地上压榨我们的子民，不可忍受，舰队已经集结，随时可以开始登陆作战！"
 #铃仙
  FRA_GFN_Reisen_Udongein_Inaba_Elected: "铃仙·优昙华院·因幡当选"
  FRA_GFN_Reisen_Udongein_Inaba_Elected_desc: "国民联盟在铃仙的强势领导下席卷幻想乡多片选区，成功当选为幻想乡总统的月兔老兵立下誓言，要让祖国走向永远强大永远繁荣的未来。"
  FRA_GFN_Confiscation_of_foreign_businesses: "没收外国企业"
  FRA_GFN_Confiscation_of_foreign_businesses_desc: "外国资本剥削幻想乡工人的好日子到头了，这些肮脏的财富将成为我们战后应得经济补偿的抵押。"
  FRA_GFN_Expand_trade_with_Axis: "扩大与轴心国贸易"
  FRA_GFN_Expand_trade_with_Axis_desc: "德意志和意呆莉虽然依靠自己的独立、团结规避了大萧条的冲击，但她们的国家正因生产不足而饱受困扰，这正是幻想乡资本急需的海外市场，就让洪水越过阿尔卑斯去灌溉邻国吧。"
  FRA_GFN_Limited_planned_economy: "有限计划经济"
  FRA_GFN_Limited_planned_economy_desc: "国家给予社会过多的自由，野蛮发展的经济最终导致了反噬，我们不会重蹈覆辙，第一步就从管束产业和资本的发展开始。"
  FRA_GFN_Supporting_national_industries: "扶持民族工业"
  FRA_GFN_Supporting_national_industries_desc: "民族工业的萧条持续影响着幻想乡国民，无论是精于工业制造的河童还是劳力永不枯竭的妖精，此时此刻仍在苦苦寻找着能够糊口的工作，铃仙总统坚信幻想乡内部的团结一致远胜过圣杯佬言而无信的条约合同，国家必须把有限的资源投入到幻想乡民族工业的发展中。"
  FRA_GFN_Propaganda_of_national_glory: "民族荣耀宣传"
  FRA_GFN_Propaganda_of_national_glory_desc: "幻想乡民族，不分人与妖，都在过去千年的历史中创造了辉煌的成就，幻想乡各族的光辉曾远照俄罗斯与巴尔干，圣杯人也曾屈居幻想乡铁蹄之下，我们坚信，铃仙总统将带领国家重现往日荣光。"
  FRA_GFN_Divide_into_hierarchies: "划分等级"
  FRA_GFN_Divide_into_hierarchies_desc: "幻想乡数十年来的虚弱与困顿，皆因律法不清、等级不明，唯有充满秩序的国家才能凝聚力量，为了使社会不再陷入无意义的内耗，我们将根据种族、血统、智慧、体格等等划分出多个等级，以便让国民和外来者明白自己应尽的义务和应得的权利。"
  FRA_GFN_Exclusive_Moon_Man: "独尊幻想乡"
  FRA_GFN_Exclusive_Moon_Man_desc: "铃仙总统是幻想乡历史上最伟大的统帅！幻想乡是世界上最伟大的国家！铃仙总统一定能带领我们摆脱困境！幻想乡一定能胜过其他民族！"
  FRA_GFN_Install_Luna_officers: "重用月兔军官"
  FRA_GFN_Install_Luna_officers_desc: "月兔们是优秀的指挥者、执行者，月兔志愿军在伟大战争中展现了自己的能力，她们历经战火的淬炼，比那些顽固不化又作风不正的旧军官优秀数倍，军队的未来应该让月兔军官掌握。"
  FRA_GFN_Reisen_Youth_League: "铃仙青年团"
  FRA_GFN_Reisen_Youth_League_desc: "我们伟大的领袖-富有远见、意志坚定、致力于幻想乡全体国民过上幸福生活的铃仙·优昙华院·因幡，因她在伟大战争中的卓越贡献与功勋，幻想乡军队向其效忠；因她在国家建设中的铁腕手段与成效，幻想乡各族为其献礼。无数青年志愿加入国民联盟，不过现在她们还只能加入新设立的铃仙冲锋队，有这些充满活力的国民，幻想乡会永远年轻！"
  FRA_GFN_Earth_Spirit_Rabbit: "地上的妖怪兔"
  FRA_GFN_Earth_Spirit_Rabbit_desc: "月兔并非幻想乡的传统居民，而是来自月之都的移民，具有较高的平均素质，但在数量上明显不足，好在幻想乡作为多民族国家，也有妖怪兔的存在，他们的平均社会地位并不高，但具有显著的数量优势，通过将妖怪兔也一并纳入执政的基本盘，可以很好的缓解人手不足的问题，我们只需要和地上兔子们的首领因幡帝好好商量此事。"
  FRA_GFN_Tale_of_Princess_Kaguya: "辉夜姬物语"
  FRA_GFN_Tale_of_Princess_Kaguya_desc: "愚蠢的法国王室背离了这个国家，爬到了殖民地苟延残喘，不配再当国家的统治者，但面对幻想乡多民族的现状，我们也确实需要一面团结众人的旗帜，王室是一个老派但不失优点的选择。\n来自月之都的公主蓬莱山辉夜已定居幻想乡数百年，血脉尊贵的她很受民间尊重，我们或许可以利用这点，同时她手中收藏的那些秘宝可能为我们带来好处。"
  FRA_GFN_Raid_the_Council: "突袭议会"
  FRA_GFN_Raid_the_Council_desc: "所有准备工作都已经做好，可以掷下骰子了！让我们埋葬腐朽不堪的议会，将国家带向新的未来吧！"
  FRA_GFN_Raid_the_Council_tt: "§Y时机以至，革命的成败在此一举......§!"
  FRA_GFN_The_land_of_moon_people: "民族之国"
  FRA_GFN_The_land_of_moon_people_desc: "共和国是只属于幻想乡各族的共和国，唯有幻想乡认可的民族才能获得国民身份，一切外族都应该让位于幻想乡国民，在彻底清除内部腐败无能的虫豸们后，我们绝不允许幻想乡民族再被欺骗、被攻击、被剥削，为了民族的荣耀，向光荣的未来，前进！"
  FRA_GFN_Political_reform: "政治改革"
  FRA_GFN_Political_reform_desc: "很明显，正是由于所谓的自由民主，让幻想乡在失去伟大领袖之后变得四分五裂，为了争夺所谓的选票、选区而不择手段，甚至不惜摧毁政治上的稳定。为此，铃仙阁下已经正式决定，彻底改变上任阿求阁下制定的制度，幻想乡的稳定必须集于她一身，保障没有人再敢扰乱政治稳定。"
  FRA_Healing_Religious_Schisms: "弥合宗教矛盾"
  FRA_Healing_Religious_Schisms_desc: "一直以来，很多人类拒绝承认我们的原因，便是她们对基督教的信仰，她们拒绝所谓上帝之外的一切神明，哪怕我们近在眼前。但我们确实可以成为她们的新神，只要适当对他们的信仰有所承认，并拉拢一些高层修会成员，我们便能最大程度减弱她们的敌意，减轻社会管理的压力。"
  FRA_HKP_Activating_Faith_Based_Cells: "动员基层宗教组织"
  FRA_HKP_Activating_Faith_Based_Cells_desc: "幻想乡很大，在各个地方也都有着大大小小的神社，但很多政客都不喜欢这些基层的神社和教堂，认为她们太过原始不懂与时俱进，但我们却知道，她们才是更能将我们的话语带到地方的关键力量。我们需要动员起各个基层的宗教组织势力，作为我们的新力量源头。"
  FRA_GFN_Kaguya_legitimacy_propaganda: "辉夜正统性宣传"
  FRA_GFN_Kaguya_legitimacy_propaganda_desc: "尽管法国王室已经逃离国土百年之久，但很多死心眼的法国人都号称自己是所谓保王派而反对我们，并且声称像圣杯那样合格的君主制更能带领国家发展。既然她们想要一个国王，我们不如就创造一个国王。正好，月之都公主蓬莱山辉夜正是贵胄之身，且腹有诗书，气质高洁，那些保王派既然能接纳一个德意志人为王后，为何不能接纳我们为她们的女王呢？"
  FRA_GFN_Gensokyos_Neo_Elite: "幻想乡新权贵"
  FRA_GFN_Gensokyos_Neo_Elite_desc: "既然我们要进行尊王宣传，那辅助王为政的贵族也应当提上日程。与辉夜陛下同根的月人自不多说，为幻想乡冲锋陷阵的将官，突袭议会的功臣，还有一些忠心之人等等，新幻想乡需要有一批真正的贵族。"
  FRA_GFN_moon_man_enters_government: "精英政治"
  FRA_GFN_moon_man_enters_government_desc: "自铃仙阁下继任总统以来她就发现了一件事，之前的幻想乡号称是自由民主，但实际管事的还不是关键的一批精英人士，普通的人和妖精除了坏事什么本事都没有，甚至会因为谣言而鼓噪闹事，很多议会里的党派也经常利用这种舆论要挟政府。既然这样那就让她们闭嘴，幻想乡只需要优中选优，由精英们来治理就好了，其他人要学会接受我们交给她们的一切就好了。"
  FRA_GFN_Establishing_Social_Credit_System: "构建社会信用制度"
  FRA_GFN_Establishing_Social_Credit_System_desc: "为了保证社会的高效运行，我们应该增强对社会的控制力，传统的警察机关对经济的拖累太大，并且严重浪费人力，八云紫的式神技术给我们提供了不错的思路——运用式神对整个社会进行监控，将人的信用数字化可控化，保证国家的完全稳定和高效运转，一切邪恶势力终将无所遁形。"
  change_to_digital_fascism_tt: "意识形态转化为§F数字法西斯主义§!"
  FRA_GFN_Continue_the_regency: "继续摄政"
  FRA_GFN_Continue_the_regency_desc: "虽然铃仙大人非常尊重辉夜大人，但考虑到辉夜实在是无心政治，与其麻烦这位公主陛下为那无休止的政治烦心，不如她继续干下去，辉夜公主只需要做好她善解人心的工作就行了，一切照旧。"
  FRA_GFN_Reestablish_the_monarchy: "重建君主制"
  FRA_GFN_Reestablish_the_monarchy_desc: "我们的工作做的如此之好，以至于在如今的幻想乡好像起了反作用，从民间到高层，幻想乡到处都有舆论希望我们能恢复辉夜陛下的正统性地位，恢复旧王国的体制，考虑到这样还能拉拢到大量所谓保王党人类的支持，而且辉夜的能力也堪胜任，那何乐而不为呢？"
  FRA_Restore_Crown_Territory: "恢复王冠领地"
  FRA_Restore_Crown_Territory_desc: "既然幻想乡的稳定已经得到保障，我们首先要做的便是恢复我们在世界上的地位。自历史上革命之后，法兰西王室逃亡北美，与当地的原住民混迹一处，而根据情报来看，土地物产丰盈，面积巨大的北美之地，地域狭长却位置重要的中美之地，还有员在东方的中南，那里的人民在脱离了君主的统治之后反而一代过的不如一代，生活困苦不堪，时刻寻不到出路。事实已经证明了没有君主她们是活不好的。我们会把君主的荣光重新带回给那些迷途之人，她们不需要成为幻想乡人，只需要重新学会向她们的君主臣服就够了"
  FRA_Rebuild_continental_hegemony: "重建大陆霸权"
  FRA_Rebuild_continental_hegemony_desc: "在很早很早之前，欧洲并不是分裂的，那时有着强大的罗马帝国一统数州疆域，而在罗马之后，欧洲再无长期和平和统一，分裂的时代，黑暗的中世纪，横行的异教让这片大陆从无和平的可能，而我们要构建的新秩序下不需要再有那么多的混乱，我们必须以霸权为名，将这片大陆上所有可能威胁到我们的国家都彻底摧毁，才能保障幻想乡在未来的世界里都永恒不倒。"
  FRA_Judging_the_Gallic_Legacy: "审判法兰西"
  FRA_Judging_the_Gallic_Legacy_desc: "失败者终究还是失败者，哪怕流亡百年，控制了那么多的土地，那些法国人还是被我们给打败了，哪怕她们里面也有喊着要更加极端，像我们一样渴求强权和秩序的人，她们也最终没有成功。我们需要一场大审判，在这场审判中，我们将彻底宣告法兰西的彻底终结，以及幻想乡的永恒胜利。"
  FRA_Integrating_Client_State_Resources: "仆从国资源整合"
  FRA_Integrating_Client_State_Resources_desc: "我们已经掌握了世界上大量的土地，这也意味着，我们需要构建一个统治世界的行政体系，虽然我们有着世界绝无仅有的掌控能力，但我们还需要将其用于更大规模的战争和经营中，旧时代的殖民系统无法承担各个仆从国资源的统筹，我们需要将其进行重构，让更多的仆从国资源为我所用。"
  FRA_Integrating_Client_State_Resources_tt: "解锁决议§Y整合附庸国资源§!"
  FRA_The_Gensokyo_Crusaders: "幻想乡十字军"
  FRA_The_Gensokyo_Crusaders_desc: "旧的幻想乡共和已逝，新的幻想乡王国屹立在旧时代的废墟之上，它所存在的意义便是让共同的幻想乡纽带能够超脱万物，将世界再次置于统一的秩序下。放眼世界，我们是孤独的，所有人都恐惧我们，试图远离我们，但我们不会放任她们威胁到我们，既然没有和平的选择，我们便选择战争，新时代的十字军将会将辉夜陛下的威名传遍四海，让所有人都臣服在这永恒的秩序之下。"
  FRA_Neo_monarchy: "新君主制"
  FRA_Neo_monarchy_desc: "铃仙大人所构建的以式神为纽带的社会信用制度固然是如今社会稳定的一大重要工具，但在执行上确实很冷冰冰，不近人情，对于亲近子民的辉夜陛下来说难以适应，她希望能够适当放松一定的管制，并予以对人的关怀，让幻想乡的万民能够在井然有序之时，仍能活得轻松自在。"
  FRA_Appoint_Prime_Minister: "任命首相"
  FRA_Appoint_Prime_Minister_desc: "虽然辉夜大人有超人之能，但如果万事万物都需要她来观察，她来决断，那着实是对陛下的不敬。还好铃仙阁下在之前通过她的人脉找寻到了几位愿为幻想乡事业尽责的能人，辉夜陛下也和她们比较熟悉，从她们几位中择优选为首相，是上上之策。"
  FRA_Healing_Ethnic_Fissures: "弥合民族矛盾"
  FRA_Healing_Ethnic_Fissures_desc: "自近代民族主义兴起以来，很多德国文化的追捧者就无时不刻强调不同种族、民族之间的区别，好像只有分开，纯洁的不同种族才能团结，即使软弱不堪、矛盾不断也必须维持所谓自由。这正是她们的可恨可怜之处，我们反其道行之，无论是人类还是妖精还是不同的民族，她们只需要知道自己是辉夜陛下的臣民，通过努力和服从可以晋升为贵族，获得陛下的奖赏，反而让幻想乡更加稳定，更加强大，没有人能够挑拨我们之间的联系。"
  FRA_HKP_Continuing_the_Chronicles_of_Gensokyo: "续写《幻想乡缘起》"
  FRA_HKP_Continuing_the_Chronicles_of_Gensokyo_desc: "自幻想乡概念形成以来，一直有贤者希望能够完整记录幻想乡的上下历史，即《幻想乡缘起》，但在政治自由化后，一直有人试图将她们的政治观点代入此书之中，导致这本书的修撰困难重重，有了好的开始却中途中断。如今幻想乡的秩序已定，而且作为君主的辉夜陛下可观测万事万物，论资格没有人比她更能胜任主编一事，我们将正式推进《幻想乡缘起》的续写工作，正式完成我们共同的史诗"
  FRA_The_Subordinate_Council: "王下议会"
  FRA_The_Subordinate_Council_desc: "虽然法兰西是失败者，但我们不能重蹈法兰西的覆辙，让自己成为第二个失败者，正是贤者议会对子民和臣下的视若罔闻才使得王室激起众怒，让当年的国王人头落地。因此，经过讨论，辉夜陛下虽是贵胄，也有依照既有法度，通过治下议会规程办事，平常可以不来，这既能保障我们秩序下的稳定，也能保持陛下亲民的形象。"
  FRA_HKP_Dual_Sovereignty: "两顶王冠"
  FRA_HKP_Dual_Sovereignty_desc: "在历史上，法兰西王室是有西班牙王室的联通尊号的，法兰西是我们的手下败将，她们所拥有的东西自然应被我等所继承。而且自经济危机以后，很多人类对于异界人的统治并不顺从，她们也希望能够被一位更伟大的国王统治，我们正好可借这尊号一用，将南方的土地一并拿下。"
  FRA_Liberty_equality_fraternity_and_king: "自由、平等、博爱与国王！"
  FRA_Liberty_equality_fraternity_and_king_desc: "自幻想乡大革命之后，自由、平等、博爱已传承百年，成为了我国的一个文化符号，虽然有些激进的贵族和高层认为这三个口号破坏了绝对君主制之下的血缘和等级秩序，希望我们将其废除，但我们其实有更好的选择，将其重新阐释：在国王陛下主导下，每个人都可以在遵守秩序的同时保持自己拥有的权力，每个人都可以平等的通过自己的才能和对国家服务获得晋升，而每个幻想乡人都是共同的兄弟姐妹，我们是同一个国家的共同子民，没有人能够切断我们之间的联系。"
  FRA_GFN_Ensuring_Guild_Loyalty: "确保行会忠诚"
  FRA_GFN_Ensuring_Guild_Loyalty_desc: "以河童工业行会与神社商业行会为代表的大集团在国民经济中的地位越发重要，但她们可不要以为自己有机会凌驾于国家意志之上，一切行会都要效忠于幻视之主，为幻想乡民族利益服务。"
  FRA_GFN_Increasing_Military_Budgets: "提高军事预算"
  FRA_GFN_Increasing_Military_Budgets_desc: "伟大战争胜利带来了20年的和平，但我们知道这不过是暂时的休战，圣杯佬对幻想乡处处掣肘，魔导国在大结界外虎视眈眈，裨田阿求和她的“民主派”自诩胜利者而使幻想乡军备废弛、军纪涣散。现在幻想乡国防急需资金支持，战争迫在眉睫，要有大炮才能保卫月光团子！"
  FRA_Gensokyo_style_fascism: "幻想乡式法西斯"
  FRA_Gensokyo_style_fascism_desc: "和轴心国那野蛮低效的体制不同，幻想乡真正统合了各族各阶层的资源，我们的法西斯体制是基于充足的真实数据和严密的管理运行的，所有幻想乡人都坚定地相信，幻视之主必然带领我们消灭一切幻想乡之敌，缔造幻想乡的世界霸权。"
  FRA_GFN_Universal_Surveillance_System: "普及监督制度"
  FRA_GFN_Universal_Surveillance_System_desc: "社会中仍然存在妄图破坏国家体制的不法分子，对幻想乡民族利益的不绝对忠诚就是绝对不忠诚。我们的伟大领袖铃仙要把精力放在为幻想乡谋划光明未来上，必须让可能的叛逆者得到切实监督，无论何时何地，幻视之主的眼线都会盯着每个幻想乡人。"
  FRA_GFN_One_Nation_One_People: "没有谎言的社会"
  FRA_GFN_One_Nation_One_People_desc: "最狡诈的商人森近霖之助也要在税务单上将所有收入全部列出；最狡猾的魔法使雾雨魔理沙也要在图书馆将所有藏书一一归还；最贪婪的巫女博丽灵梦也要在神社门口将所有服务明码标价。并非是她们良心发现真诚悔改，只因潜行于阴影中的赤瞳精灵会将一切秘密发掘，而妄图对幻视之主隐匿秘密之人必被捆缚于街头示众。"
  FRA_GFN_The_Liarless_Social_Order: "一个国家，一个民族"
  FRA_GFN_The_Liarless_Social_Order_desc: "幻想乡各民族共同生活、友好相处了千余年，人妖固然有别，但如今幻想乡人语言相同、身份相同、信仰相同，都坚定地支持铃仙元首为我们指引的道路。幻想乡各族已然融为一体，从今往后，幻想乡内再无民族分。"
  FRA_moonlight_purifies_world: "月华净世"
  FRA_moonlight_purifies_world_desc: "世界上仍有未被清理干净的杂质，幻想乡已经准备就绪，幻视之主的怜悯会平等地播撒到月光照亮的土地，赐予幻想乡人纯净丰饶的新世界。"
  FRA_GFN_Economic_reforms: "经济改革"
  FRA_GFN_Economic_reforms_desc: "大萧条的余波尚未完全消散，阻碍幻想乡前进的腐败文官已被清除，现在我们可以更加大胆地重塑幻想乡经济了。"
  FRA_GFN_Corporate_Economy: "法团经济"
  FRA_GFN_Corporate_Economy_desc: "“法团意味着受监管的经济，因此也意味着受控制的经济，因为没有控制就没有监管。”"
  FRA_GFN_Establish_WSDO: "波长同步防御条约组织"
  FRA_GFN_Establish_WSDO_desc: "为了所畅想的未来，我们必然要统合起我们的国土，控制区以及未来诸多加盟国的力量，如果交给凡人，她们必然要进行众多的分工，以牺牲效率来保障运作效率，但我们的力量超乎常人，我们能够通过意识上的同步让所有人的意识共享归一，达到最大程度的同步，获得比起常人更强的效率。"
  FRA_GFN_Establish_WSDO_tt: "解锁决议邀请盟友加入£GFX_WSDO_text_icon §F波长同步防御条约组织§!§L（需要是阵营领袖）§!"
  FRA_GFN_Iron_Shield_of_Production: "注重国防工业"
  FRA_GFN_Iron_Shield_of_Production_desc: "起视四境，魔导国、德意志和圣杯都在进行新一轮的扩军，大战的阴霾笼罩欧洲，为了保证国家安全，我们也要建立属于自己的强大军队，建立军队的第一步就是拥有自己的军事工业，幻想乡现有的工业还不足以满足要求。"
  FRA_GFN_Enslavement_of_foreigners: "奴役外族"
  FRA_GFN_Enslavement_of_foreigners_desc: "我们在第一次伟大战争中流了太多血，至今也没有恢复元气，或许我们可以接纳一部分殖民地的精英人才与劳动力，让他们为国奉公，以此补充我国的人口缺口。"
  FRA_GFN_Lunar_Brain: "月之头脑"
  FRA_GFN_Lunar_Brain_desc: "高皇神生子八意思兼，为月之都栋梁，具有智囊的才干，圆满解决了天岩户之隐、天孙让国等等问题，由于蓬莱山辉夜被放逐来到幻想乡，作为师傅的八意思兼也追随公主大人一同来此，并且在此期间教导了铃仙。我们在遇到困难的时候，可以向这位贤者问计。"
  FRA_GFN_Yagokoro_Eirin_Laboratory: "八意永琳实验室"
  FRA_GFN_Yagokoro_Eirin_Laboratory_desc: "八意永琳是月之都，乃至全世界医术最高超的存在之一，我们应当支持她的医学研究，这可以给我国带来巨大收益"
  FRA_GFN_Travel_Across_Gensokyo: "走遍幻想乡"
  FRA_GFN_Travel_Across_Gensokyo_desc: "虽然永琳大人喜欢用行走的方式游遍幻想乡进行考察，她本人据说也喜欢在途中观察各地的风土人情，但是时代已经变了，随着时代的发展，现在我们有更方便的交通方式。让铃仙大人和永琳大人好好沟通一下，适当的接受一下新式的交通工具，就能更好地取得更多的材料，加速我们的研究进程。"
  FRA_GFN_Promote_drugs: "推广药物"
  FRA_GFN_Promote_drugs_desc: "一直以来，人间的凡人们都饱受生老病死之困，很多人欲求长生而不得，而永琳的实验室中有着众多神奇的药物，拿出一颗都会让她们瞠目结舌，而且永琳也需要一些人来帮忙测验一些药物的实际药效和副作用。给那些医疗财团开个口子，适当放出一些药物进行推广，不仅能够收获她们的支持，也能更好的实验药物的实际效用"
  FRA_GFN_Soldier_Refactoring: "士兵改造"
  FRA_GFN_Soldier_Refactoring_desc: "让所有人都不老不死无异于痴人说梦，但通过逆向研究和八意永琳的指点，我们的科学家还是能够端出来劣化量产版的蓬莱药，不能让人不老不死，但能显著增强我们士兵在战场上的生存能力和战斗力"
  FRA_GFN_White_Rabbit_on_the_Ground: "地上的大白兔"
  FRA_GFN_White_Rabbit_on_the_Ground_desc: "因幡帝保佑大国主大神获得姻缘，并在兄弟八十神中脱颖而出，具有难以置信的强运，现在通过和因幡帝的合作，这种强运也能为我们所用。当然，偶尔也会有运气不那么好的时候……"
  FRA_GFN_White_Rabbit_on_the_Ground_tt: "解锁特殊机制§Y“抽幻存神签”§!"
  FRA_GFN_Hare_Guerrilla_Warfare: "野兔游击战"
  FRA_GFN_Hare_Guerrilla_Warfare_desc: "和迩为神话中的猛兽，似鳄似鲨，因幡帝以计谋骗取了和迩的帮助，并且以灵巧踏和迩之背渡海而来，我们的军队可以学习妖怪兔的灵巧和机敏"
  FRA_GFN_Wheel_of_Fortune: "“幸运转盘”"
  FRA_GFN_Wheel_of_Fortune_desc: "因幡的强运虽然能够为我们带来好运，当好运降临的时候，我们可谓是无往不利，但也有很多时候，我们抽到的都是噩运，在这些时候我们束手束脚，困难重重。时间很长，事情很多，我们不能总在等待好运。通过秘法，我们造了一个幸运转盘，今后我们将不再使用太过随机性的抽签，而是用这个转盘来使用强运，特别是有噩运发生的时候，我们只要稍微多动那么一下，就能化噩运为好运。"
  FRA_GFN_The_Solitary_Guardian: "孤高的守护者"
  FRA_GFN_The_Solitary_Guardian_desc: "虽然这么做可能会得罪辉夜，但铃仙还是希望能找到幻想乡那位沉默的守护者：藤原妹红。一直以来，妹红都在幻想乡到处游荡，惩奸除恶，扶助弱小，虽然她看似冷漠，厌恶辉夜等永生之人，但她能够让我们触及到底层那些我们可能帮扶不到的人和妖怪，并保卫我们能够不为外敌所渗透打击。至于辉夜那边吗，铃仙只能尽可能的去劝说她不要愤怒了。"
  FRA_GFN_The_Solitary_Guardian_tt: "解锁特殊机制§Y“不死鸟之焰”§!"
  FRA_GFN_The_March_Defying_Death: "无视死亡的进军"
  FRA_GFN_The_March_Defying_Death_desc: "妹红是不死之身，她哪怕经受再多的损伤，也能很快恢复如初，这样神奇的能力经过我们分析和研究，虽然还是没有巨大突破，但也有了一定成果，如今的我们已经可以将这项能力部分释放在我们的部队上，让我们的每个人都能拥有更加激昂的斗志，即使遇到强敌，她们也能以一敌百，绝不退缩。"
  FRA_GFN_The_March_Defying_Death_tt: "解锁§Y“不死鸟之焰”§!的修正中的£cn_attacker_speed_texticon §Y陆军师速度§!与£breakthrough_texticon §Y突破§!"
  FRA_GFN_The_Eternal_Crimson_Lotus_Flame: "不灭的红莲之火"
  FRA_GFN_The_Eternal_Crimson_Lotus_Flame_desc: "因为多年的存活经验，妹红的能力也像不死鸟一样炽烈，她的弹幕如火山爆发一般，总会不断破灭和重生，就像她的不死之身一样。为表诚意，在加入我们之后，她也愿意将这项能力适当加护到我们的军队上，让我们也能像不死鸟一样，越打越强。"
  FRA_GFN_The_Eternal_Crimson_Lotus_Flame_tt: "解锁§Y“不死鸟之焰”§!的修正中的£attack_texticon §Y陆军师攻击§!与£defence_texticon §Y陆军师防御§!"

 #外交
  FRA_Recovered_KMK: "收复红魔馆"
  FRA_Recovered_KMK_desc: "是时候了，我们的武器已经上膛，将士们已经就绪，现在，对红魔馆最后的通牒下达：回归还是灭亡！"
  FRA_Intervene_in_NPT_civil_war: "干涉超次元内战"
  FRA_Intervene_in_NPT_civil_war_desc: "超次元的内战已经爆发，为了幻想乡南部安稳的外部环境，我们必须立刻派遣志愿军，让新的统治者对我们充满善意。"
  FRA_Follow_our_friends: "追随我们的朋友"
  FRA_Follow_our_friends_desc: "圣杯王国对我们释放了善意，他们认为那些不死族迟早一天会发起征服世界的战争，在这种情况下，我们应该考虑一下是否与他们结盟"
  FRA_Expand_collaboration_with_ENG: "扩大与圣杯的合作"
  FRA_Expand_collaboration_with_ENG_desc: "我们选择与圣杯站在一起，但是，谁也不知道这份盟约会不会遭到背弃，维护关系最好的办法就是有利益往来，扩大与圣杯的交流合作，无疑为这份盟约添了一份保障。"
  FRA_unimpressed_route: "独立自主的道路"
  FRA_unimpressed_route_desc: "稗田阿求总统留给我们最宝贵的财富就是，幻想乡不需要向任何势力低头，尽管不死族的危险依然存在，但我们也不需要向圣杯低头。我们有自己的道路可以走！"
  FRA_Expand_Gensokyo_sphere_of_influence: "扩张幻想乡势力圈"
  FRA_Expand_Gensokyo_sphere_of_influence_desc: "一群人的力量比一个人的力量大得多，不可否认的是，我们目前的科技水平仍然与不死族差距过大，所以，建立一个势力圈召集更多的盟友来帮助我们一起对抗敌人成了我们近期的目标。"
  FRA_Expand_Gensokyo_sphere_of_influence_tt: "解锁决议§Y邀请其它国家加入我们的阵营§!"
  FRA_Pursue_natural_boundaries: "追求自然边界"
  FRA_Pursue_natural_boundaries_desc: "我们拿下红魔馆后，与魔导国的边境线更长了，原有的博丽大结界已无法彻底笼罩边境线，为了能在未来的战争中获得优势，得想办法拿下那俩块地区。"
  FRA_strike_first: "先下手为强"
  FRA_strike_first_desc: "不能再犹豫了，既然我们未来和魔导国必有一战，那我们就不能傻乎乎地等不死族上门，部队已经在边境集结完毕，让不死族尝尝地球人的战术吧！"
  FRA_Focus_on_defense: "注重防御"
  FRA_Focus_on_defense_desc: "魔导国越来越咄咄逼人了，他们又在边境上增加了新的部队，幻想乡热爱和平，但绝对不会坐以待毙，让我们的边境充满要塞吧！"
  FRA_European_New_Order: "欧洲新秩序"
  FRA_European_New_Order_desc: "不死族彻底被赶跑了，现在的幻想乡，坐拥德国全境，庞大的领土带给我们的是绝对的影响力，以后的欧洲，由我们说了算！"
  FRA_Take_advantage_of_victory_and_pursue: "乘胜追击"
  FRA_Take_advantage_of_victory_and_pursue_desc: "幻想乡那欧洲的皇冠仍有一抹黯淡，愚蠢的德国人居然妄想光复他们的领土，未来的欧洲秩序，不需要第二种声音，让我们带着击败不死族的余威，乘胜追击，彻底解决他们！"
  FRA_Bermuda_talks: "百慕大会谈"
  FRA_Bermuda_talks_desc: "现在的幻想乡，是整个欧洲的主人。但我们仍然记得，还有一群流亡者，在美洲对我们宣泄敌意。但这些已经过去了，幻想乡的强大已成事实，拥有欧洲的我们一个小动作就会让美洲的他们喘不过气来。但美洲的强大也让我们存在估计。毫无疑问，双方的有识之士都知道，幻想乡与法兰西是时候和解了。"
  FRA_Europe_for_Europeans: "欧洲人的欧洲"
  FRA_Europe_for_Europeans_desc: "一直以来，存在多个强国的欧洲战火连绵不断，生活在这片土地的人民，都认为自己属于国家不属于欧洲。如今，欧洲只存在幻想乡和她的盟友们，我们有足够的把握让所有人明白，欧洲是欧洲人的欧洲！"
  FRA_European_Coal_and_Steel_Community: "欧洲煤钢共同体"
  FRA_European_Coal_and_Steel_Community_desc: "只有那些不起眼的一小步，才能造就影响世界的一大步。常年的战火让我们对彼此充满顾虑，我们只能从最小的一步做起，首先，让我们的煤矿钢厂联合。"
  FRA_European_Economic_Community: "欧洲经济共同体"
  FRA_European_Economic_Community_desc: "煤钢共同体的成功打消了一部分人的顾虑，第二次伟大战争的结束留下一个百业待兴的欧洲，可不少国家根本无力重建，借此机会，我们可以再进一步，让整个欧洲的经济，联合起来。"
  FRA_EURATOM: "欧洲原子能共同体"
  FRA_EURATOM_desc: "我们的科学家早就发现，原子能蕴含着可以毁灭一切的力量。在首席科学家河城荷取的提议下，我们开始集中整个欧洲的科学力量，对此进行研究，当然，会有一个专业的机关负责行政工作，顺便确保成果共享。"
  FRA_Paris_talks: "人间之里会谈"
  FRA_Paris_talks_desc: "是时候了，接二连三的成功让我们把欧洲的人心都聚在了一起，已经不会有人认为欧洲联盟是异想天开的事情了，现在，让我们邀请各国元首，来到人间之里商谈一下后续的计划。"
  FRA_Start_integration_process: "开启一体化进程"
  FRA_Start_integration_process_desc: "会议经过了漫长的争论，最后还是在硬实力面前选择了妥协，欧洲一体化将会以幻想乡为主体进行。尽管会议上人们争得面红耳赤的，但在结束后，不约而同地鼓掌，所有人都明白，一个统一的欧洲代表着什么。"
  FRA_Cold_War_front: "冷战前线"
  FRA_Cold_War_front_desc: "我们打败了不死族，但时间不等人，新的威胁已经出现，苏维埃联盟，这个在不死族大举入侵的时候以一己之力，拖住整个魔导国东线军团，为最后的胜利定下了基础，现在，红色的巨人恢复了力气，他的目光看向了欧洲，幻想乡在接手那些领土后，实际上已经成为了这场看不见硝烟的战争前线。"
  FRA_Aid_to_construction_of_Germany: "援助德意志建设"
  FRA_Aid_to_construction_of_Germany_desc: "德意志人在这场战争中损失惨重，但新的战场需要德国人站出来，我们必须将她们从地狱的沼泽中拉出来，她们的毁灭对我们来说不是一件好事。议会已经批准，无数的钞票开始涌向德国帮助她重燃生机。"
  FRA_Ideological_Security_Act: "意识形态安全法案"
  FRA_Ideological_Security_Act_desc: "苏联人最可怕的不是那钢铁洪流，而是那谈之色变的意识形态，许多国家就是这样被苏联蒙蔽，最后成为傀儡。为了幻想乡不会重蹈覆辙，我们必须得重视意识形态的改变，议会已经决定，将意识形态安全起草法案。"
  FRA_Peaceful_evolution: "和平演变"
  FRA_Peaceful_evolution_desc: "现在越来越多的反对党开始拖这场冷战的后腿了，他们居然为那些苏联蛮子说话。这更加引起了我们对意识形态换色的担忧。为此，哪怕付出一些代价，我们也必须将他们镇压，现在的幻想乡，不需要这些逆言！"
  FRA_Cold_War_was_hot: "冷战热斗"
  FRA_Cold_War_was_hot_desc: "长时间的冷战终于让人的神经绷不住了。一些相信自由的斗士开始对苏联的走狗进行攻击。我们也有意通过这样的方法试探一下红色巨人目前的状态。毕竟，死的又不是我们的人，不是吗？"
  FRA_Kremlin_red_flag_landed: "克林姆林宫，红旗落地"
  FRA_Kremlin_red_flag_landed_desc: "苏联就是一栋破房子，只需要轻轻地一脚就会让她四分五裂。苏联机密情报的泄露更是让我们对胜利的到来多了一份信心。现在，是时候告诉这个红色巨人，时代变了！"
  FRA_Peace_under_deterrence: "威慑下的和平"
  FRA_Peace_under_deterrence_desc: "在我们与苏联的共同压制下，整个世界都不敢爆发大规模战争，俩个巨人的一举一动都会让周围的矮人大惊小怪。世界居然形成一种不可思议的和平局面。或许，战争不适合俩超多强的世界格局吧。"
  FRA_All_out_competition: "全面竞赛"
  FRA_All_out_competition_desc: "既然战争无法终结红色巨人的影响力，那我们就和她们耍耍。我们有最先进的工业设施、最庞大的科研团队、最精英的商业人士，经济文化科研体育，这些都是我们的竞争，让全世界人民都看一看，谁才是这个世界的未来！全面竞赛正式开始！幻想乡万岁！"

  FRA_Unifying_Gensokyo: "统一幻想乡"
  FRA_Unifying_Gensokyo_desc: "我始终相信着，幻想乡一定会成为全欧洲，乃至全世界的主宰。在以前，总有着一些喋喋不休的蠢蛋喊着和平来否定我的理想，而她们呢，喊着自由公正，喊着正义民主，却一再让这个国家陷入分裂，让所有人失望。\n\n现在她们都闭嘴了，臣服了，向我俯首，称颂我名，幻想乡也结束了那被她们创造出来的四分五裂的情况，浴火重生，如今的幻想乡不再靠毫无意义的中道稳定，而是用强大所铸造起来的秩序之斧，人民摆脱了自由谎言下的争吵分裂，学会了在秩序下的团结奋进。那集中、服从的众生秩序和统一之下所爆发的力量将孕育欧洲的新秩序，而我将让它永存于世\n\n首先，就先拿那个趁我们陷入危机之后背叛的吸血鬼开刀吧！。"
  FRA_establish_Gensokyo_as_king: "自立为王"
  FRA_establish_Gensokyo_as_king_desc: "一直以来，自由主义和社会主义都试图侵蚀幻想乡，当然，她们现在失败了。但还有更强大的敌人围绕在幻想乡周围——那天外所来的魔导之王，那流亡东南却诓骗人心的德意志元首，她们都在幻想乡四周徘徊着，伺机发动攻击，将我们变成她们的奴仆。\n\n没有人能够奴役幻想乡的子民，除了我，我们必将幻想乡带向一个它真正应该的时代——一个凌驾于万民之上，拥有绝对统治力和影响力的时代。这个时代，乃至未来都将属于幻想乡。这条道路将会充满荆棘，布满鲜血，会以王的旗号，护佑每个幻想乡的民众闯过无尽黑暗，直至每个人都因我们得到启蒙，成为人上之人。"
  FRA_guard_against_DVL: "防备魔导国"
  FRA_guard_against_DVL_desc: "统一一群活生生的人，哪怕是统治一群活蹦乱跳的妖精，总比统治一群臭烘烘的死人和骨头渣子强，而我们的东面就是这样一群亡灵，它们把自己伪装出各种人形，喊着和我们一样的口号还不知足，还试图将奴役我们。实在可笑，考虑到这些家伙在搞乱德意志的时候还算有些本事，我要在边防上多下些功夫，把这些垃圾挡在幻想乡之外。"
  FRA_Sword_Pointed_at_Berlin: "剑指柏林"
  FRA_Sword_Pointed_at_Berlin_desc: "很明显，那个所谓的魔导王一直有着侵略幻想乡，统一全世界的所谓野心，它虽然把自己伪装的很好，但那些都骗不了我，而那些伪善的德意志人也愿意配合他们的主人的谎言。哈，真是愚蠢，我们不会让幻想乡处于危险的，不敢它有什么阴谋，我要立刻攻击她们，摧毁她们，将她们的首都柏林再一次摧毁，将那个骨头渣子赶出地球，让那些虚伪的德意志人去死吧！"
  FRA_Conqueror_Alliance: "征服者联合"
  FRA_Conqueror_Alliance_desc: "与其多一个敌人，不如多一个朋友。我们正处在一道分水岭之间，一旦我们试图摧毁、征服以圣杯为首的旧秩序，圣杯必然对我们进行围剿和攻击，想要成为这个世界当之无愧的主宰，就不能摇摆不定，必须找准前行的道路。正巧，东方那位魔导王也有着同样的想法，我想和他好好谈谈，如果能谈拢，我们就将彻底联合起欧陆最强的力量，颠覆整个欧洲。"
  FRA_Delineate_spheres_of_influence: "划定势力范围"
  FRA_Delineate_spheres_of_influence_desc: "万事万物都有其美，秩序也是如此，那位王想要控制更大的土地，我们也想，如果我们不经商量，那我们之间就会打的不可开交，虽然我并不怕，但那只会让圣杯英灵们得到喘息之机。所以最好与那位王商量一下，划定出一条占领线，我们与魔导各取所需，当然，幻想乡的利益不能被忽视，我们的胃口也自然会大些。"
  FRA_Delineate_spheres_of_influence_tt: "[FRA.GetFlag][FRA.GetAdjective]将会宣称：\n[NPT.GetFlag][NPT.GetAdjective]\n[ENG.GetFlag][ENG.GetAdjective]\n[NOR.GetFlag][NOR.GetAdjective]\n[TRB.GetFlag][TRB.GetAdjective]\n[ALS.GetFlag][ALS.GetAdjective]\n[GRE.GetFlag][GRE.GetAdjective]\n\n[DVL.GetFlag][DVL.GetAdjective]将会宣称：\n[ITA.GetFlag][ITA.GetAdjective]\n[SWE.GetFlag][SWE.GetAdjective]\n[DEN.GetFlag][DEN.GetAdjective]\n[POL.GetFlag][POL.GetAdjective]\n[HUN.GetFlag][HUN.GetAdjective]\n[BAL.GetFlag][BAL.GetAdjective]\n[KVO.GetFlag][KVO.GetAdjective]\n[ROM.GetFlag][ROM.GetAdjective]\n[BUL.GetFlag][BUL.GetAdjective]"
  FRA_Stabilize_southern_border: "稳定南方边界"
  FRA_Stabilize_southern_border_desc: "我们南方的超次元联邦自陷入内战之后，已经有大量的异界之人逃亡我国国内，这些难民对我国的稳定造成了持续性的冲击。虽然她们中的一部分人愿意与我们为友，服从我们，但大多数人仍然对我们保有仇恨。与其让她们有机会威胁到我们，不如率先出击，利用我们强大的力量摧毁她们可能的抵抗，让我们的南方边境彻底安分下来。"
  FRA_Join_in_Axis: "加入轴心国"
  FRA_Join_in_Axis_desc: "那个德意志的元首，她喋喋不休，自以为是，总认为她们那些失败的所谓日耳曼人才是高贵民族，其他人只是卑贱的，要被消灭的下等人。但真正交流起来，她所要构建的也不过是本民族优先下的秩序社会。在这一点上我们没什么不同，她现在流亡东南，渴望着返回故乡，我们当然可以帮她一点小忙——当然，适当的报酬是要给的。"
  FRA_Protect_Hakurei_Barrier: "保障博丽大结界"
  FRA_Protect_Hakurei_Barrier_desc: "虽然妖精们已经不会再对我们产生什么麻烦，她们所构建的博丽大结界也确实称得上是优良，有了它，敌人是难以轻松逾越我们的边防的。但德意志朋友提醒了一点，这道结界的南方，火车联邦没有被结界所笼罩，一旦敌人开始对此发动进攻，我们也难以即刻再完成结界的延长和巩固，而且我们也没那么多钱再搞一道山脉结界，不如提前把这里控制起来，然后利用高耸的山脉建造起天然、也更强大的屏障"
  FRA_Require_for_Rhineland: "要求莱茵兰地区"
  FRA_Require_for_Rhineland_desc: "是时候收回我们应得的报酬了：莱茵兰。这是阿求阁下在伟大战争后胜利的成果，也是幻想乡能够更完美的保卫边防的重要屏障，有了它，德意志人便不能像伟大战争里一样再次威胁幻想乡本土，而且那里的德国人之前便乘人之危背离了她们的救主，结果落得被奴役的下场，如今我们只是来收回幻想乡应得的利益而已，德国人，你明白了吗？"
  FRA_Lord_of_Europe: "欧洲之主"
  FRA_Lord_of_Europe_desc: "又一场血腥的大战结束了，二十年的休战之后，幻想乡没有如二十年前一样惊慌失措，没有等敌人自己崩解，而是在我双手的延申下取得了伟大的胜利，将广大的敌国领土踩在我们的脚下。现在，我们将成为欧洲大陆的新征服者，新秩序的通途已经现身，命令与征服正是幻想乡命运之所系，未来已近在眼前！"
  FRA_Take_Louisiana_home2: "带路易斯安那回家"
  FRA_Take_Louisiana_home2_desc: "是时候让我们的北美殖民地回归了，她们离开我们太久了，邪恶的精灵在我们的土地上压榨我们的子民，不可忍受，舰队已经集结，随时可以开始登陆作战！"
  FRA_Twilight_of_Gods: "诸神黄昏"
  FRA_Twilight_of_Gods_desc: "对我们来说，北欧人都是一帮神神叨叨的疯子，她们用着一堆会自己跑起来的机器，对着所谓的神拜来拜去来获得所谓神力，打来打去，十分无赖，甚至比我们过去还要混乱。与其让她们这样无休止的战斗下去，不如让我们成为她们的新神明，新主宰，让她们拜倒于我们之下，成为我们征服的前锋军。"
  FRA_Strike_bear: "痛击毛熊"
  FRA_Strike_bear_desc: "远在东方的苏维埃社会主义共和国联盟，虽然我们与其真正的接触不多，但它是我们必须摧毁的敌人。正是它让之前空有其名的社会主义、共产主义落地成真，让这些歪理邪说蛊惑了很多正义的幻想乡人成为动乱的凶手，也正是它在世界各地不断掀起所谓革命之名的变乱，它就是万恶之源，我们的秩序不容这样的恶势力继续挑战，是时候发起一场正义的东征了。"
  FRA_Protect_Mediterranean: "保护地中海"
  FRA_Protect_Mediterranean_desc: "我们是欧洲之主，欧洲南方的地中海也自然应该为我们所有，我们与海外领土之间的影响也需要通过地中海来运营，但南方的意大利人可不这么想，无论是人还是所谓神，她们都号称地中海是她们的。不管她们是真心还是假意，她们既然这么说了便要为自己的妄言付出代价：臣服我们，或者去死。"
  FRA_Challenge_order: "挑战秩序"
  FRA_Challenge_order_desc: "上一次伟大战争的胜利来自于我们与圣杯王国共同的牺牲，但在之后，她们便背叛了我们，建立起统御四海的所谓日不落帝国，而当幻想乡真正团结一致，开始建设伟大的全知之秩序的时候，她们却开始恐惧我们会破坏她们对世界的统治地位，笑话，没了我们她们什么都不是，幻想乡人，拿起武器，给这些骄傲自大的圣杯人一点颜色看看！"
  FRA_Rule_over_world: "君临天下"
  FRA_Rule_over_world_desc: "有些事物随着历史的变迁而逝去，而有的东西总是可以永葆生机。幻想乡自旧秩序的废墟中走出，迈向新秩序的未来，它经受住了一系列的考验，一系列的动荡，最终横扫天下，成就伟业。无论未来，如何这都将是一个秩序统御下的世界。在这将延续千年的新秩序下，每个人都将学会一件事：向幻想乡永远低头。"

 #陆军
  FRA_Integrate_local_militias: "整合地方民兵"
  FRA_Integrate_local_militias_desc: "地方民兵虽然训练不足，但她们再怎么说也是受过训练的士兵，让他们上战场好过让平民上战场，我们只需要将他们重组训练，就能得到一批素质优秀的兵员。"
  FRA_Kappa_Heavy_Industries_Institute_of_Armaments: "河童重工-军备研究所"
  FRA_Kappa_Heavy_Industries_Institute_of_Armaments_desc: "以河城荷取为首的河童重工一直是军方的代表企业。如今，我们需要河童重工承受更大的责任，军方已经和他们接洽，新的军备研究所已经设立完毕。"
  FRA_Atomic_energy_research: "原子能研究"
  FRA_Atomic_energy_research_desc: "科学家研究发现，原子能蕴含的能量足以毁灭一切。我们必须趁敌人还没发现，率先开启原子能研究。"
  FRA_Atomic_energy_research_tt: "启用§Y原子能§!研究"
  FRA_Rocket_research: "火箭研究"
  FRA_Rocket_research_desc: "火箭的发明，给予了科学家更多的灵感，一种可以越过敌人防空火力的武器被提出来。不管怎样，让她们先试一试吧。"
  FRA_Rocket_research_tt: "启用§Y火箭§!研究"
  FRA_New_Airborne_Forces: "新式空降部队"
  FRA_New_Airborne_Forces_desc: "以往的空降只能让步兵上，现在，在新式科技的加持下，坦克这一重型载具也可以加入空投部队。没有什么，比自己头上冒出一个几十吨的铁霸王更令人害怕的了。"
  FRA_New_Airborne_Forces_tt: "允许编制§Y空降坦克营§!"
  FRA_Automechanical_research: "自动机械研究"
  FRA_Automechanical_research_desc: "人工的效率永远比不上机械的效率。如果我们让机械自己动起来，不管是民用还是军用，都代表着生产效率大幅上升。因此，这个方向值得一试，只需亿点点经费就可以了。"
  FRA_Automechanical_research_tt: "启用§Y自动机械§!研究"
  FRA_Research_on_new_types_of_aircraft: "新式飞行器研究"
  FRA_Research_on_new_types_of_aircraft_desc: "战斗飞机的出现代表飞艇的落幕，如今，战斗飞机已经跟不上军队的需要了，我们需要研究所建造一个新式飞行器以满足军队新的需求，这就是花大钱成立研究所的意义。"
  FRA_Research_on_new_types_of_aircraft_tt: "启用§Y武装直升机§!研究"
  FRA_Armor_tactics_refined: "装甲战术精进"
  FRA_Armor_tactics_refined_desc: "我们的军事观察团通过研究这几年一直不断的战争，为我国装甲战术的更进一步注入新的理论研究，现在的我们，可以自称装甲大师了。"
  FRA_Research_new_tanks: "研究新式坦克"
  FRA_Research_new_tanks_desc: "我们相信，新式的坦克会全面超过老旧的坦克。战争的方式一直在改变，我们的军备必须跟上这速度，否则代价就是灭亡！"
  FRA_Increase_degree_of_mechanization: "提高机械化程度"
  FRA_Increase_degree_of_mechanization_desc: "机械化的优势在平原地形尽情释放，考虑到欧洲那大面积的平原，提高机械化程度，会让我们在未来的战争中获得不小的收益。"
  FRA_Take_advantage_of_magic: "发挥灵装优势"
  FRA_Take_advantage_of_magic_desc: "灵装，一种唯心的科技成果，但灵装的优越性是所有人都看得见的，虽然那昂贵的生产成本让我们不能大规模列装，但给精锐列装也是可以接受的。只要灵装部队发起进攻，一切都会好起来的。"
  FRA_State_owned_Institute_of_Magic: "国有魔法研究所"
  FRA_State_owned_Institute_of_Magic_desc: "魔法在我国是一种稀疏平常的现象，因为妖怪种族的存在，魔法对于我们并不陌生。但是，很多魔法掌握者并不知道魔法真正的用法，成立国有魔法研究所，能够帮助我们进一步了解魔法并最终彻底掌握它。"
  FRA_increase_size_of_special_forces: "特种部队规模扩大"
  FRA_increase_size_of_special_forces_desc: "特种作战有时候会起到出乎意料的效果，为了应对越来越复杂的战争形势，我们可以将现有的特种部队规模扩大。毕竟军费不用难道拿去当赔款嘛。"
  FRA_Traditional_tactics_are_refined: "传统战术精进"
  FRA_Traditional_tactics_are_refined_desc: "传统的战术并不是过时了，而是它们没有找到自己在新式战争里面的定位。我们只需稍微改良一番，就能让传统战术焕发新的生命力。"
  FRA_Artillery_fired_in_unison: "火炮齐鸣"
  FRA_Artillery_fired_in_unison_desc: "一位军事达人说过，火炮是战争之神。胜利女神只会青睐火炮多的一方。我们不仅要火炮的质量，还要火炮的数量。迟早有一天，整个博丽大结界都会响彻火炮的轰鸣。"
  FRA_New_infantry_equipment: "新式步兵装备"
  FRA_New_infantry_equipment_desc: "我们那些充满朝气的士兵手上不应该存在一战的老古董们。新式装备必须立刻研发，并尽快列装到每一个士兵手里！"
  FRA_New_tactics_new_atmosphere: "新战术，新气象"
  FRA_New_tactics_new_atmosphere_desc: "现在我们的参谋部的平均年龄大幅下降，他们提供的战术终于不是那该死的排队枪毙了。一战的老东西们爆完金币就可以安安心心的退场了，现在是年轻人的回合！"
  FRA_Special_operations_are_normalized: "特种作战常态化"
  FRA_Special_operations_are_normalized_desc: "特种作战在对敌小规模攻势下成效显著。既然如此，我们虽然不要求一直使用特种作战，但特种作战应该列入我国常用战术当中。"
  FRA_Special_theoretical_breakthroughs: "特种理论突破"
  FRA_Special_theoretical_breakthroughs_desc: "特种作战的大规模运用让我们的部队积累的许多这方面的经验，这些经验又帮助参谋部将特种理论进行突破，突破的特种理论又能更好的指导作战。形成一个良好的循坏。"
  FRA_Strengthen_special_training: "加强特种训练"
  FRA_Strengthen_special_training_desc: "特种作战带来的胜利让参谋部更坚定了在全军推行特种训练的想法，他们要求，哪怕是个炊事班的兵，也得会标准的特种作战姿势。"
  FRA_Elite_Division: "精英之师"
  FRA_Elite_Division_desc: "充足的训练加上足够的补给可以构建一个训练有素的师级部队，但只有经过实战检验的才能算是精英之师。而我们的目标，就是让我们的部队蜕变成这样的师级部队。"
  FRA_Gensokyo_features_military_system: "幻想乡特色军事体系"
  FRA_Gensokyo_features_military_system_desc: "幻想乡一直是人妖混居的国家，上次大战的经验告诉我们妖怪的存在让军事体系多了一层变数，毕竟谁不希望自己的部队有一些超人的存在。通过精英选拔，人妖混合师更能撑起幻想乡的领土。这是只属于幻想乡的军事体系。"
  FRA_The_tengu_work_together: "天狗协同作战"
  FRA_The_tengu_work_together_desc: "天狗那良好的机动性能够帮助部队完成一些人类做不到的事，让天狗加入作战，既是政治团结需要，更是军事实际需要。她们的存在，让幻想乡多了一只高速机动兵团。"
  FRA_Monster_Vanguard_Unit: "妖怪先锋部队"
  FRA_Monster_Vanguard_Unit_desc: "妖怪一族拥有千奇百怪的天赋，他们分散开就是一个个小超人，如果将他们集中起来不知道会爆发怎样的力量。参谋部已经开始试行妖怪先锋部队了，相信未来我们可以看见一道独特的风景线。"
  FRA_Tradition_given_new_lease_of_life: "传统焕发新生"
  FRA_Tradition_given_new_lease_of_life_desc: "传统战术并非一文不值，在新军事体系里面势必有它们的一席之地。参谋部惊奇地发现那些已经过时的战术随着军事体系改革又焕发了新生，毕竟，好用的战术为什么不用呢。"
  FRA_New_production_lines: "新式生产线"
  FRA_New_production_lines_desc: "老旧的生产线已经无法满足我们的生产需要，我们需要更快的生产线。正好，河城荷取小姐拿出一种新式的生产线，帮我们解决了这一问题。"
  FRA_Mechanized_warfare: "机械化作战"
  FRA_Mechanized_warfare_desc: "机械化部队的机动性能让我们迅速通过敌人防线并打其一个措手不及。我国良好的机械化程度让参谋部相信机械化作战更适合幻想乡的军队。"
  FRA_Focus_on_collaborative_operations: "专注协同作战"
  FRA_Focus_on_collaborative_operations_desc: "没有什么安全感能超过战场的大家伙都是自己人的安全感了，协同作战能有效减少我军的伤亡，后勤部门再也不想给另一位五个孩子的母亲发五封牺牲通知书了。"
  FRA_Concentrated_breakthroughs: "集中突破"
  FRA_Concentrated_breakthroughs_desc: "如果把军队比作一个手指，那只有将它捏成拳头才能造成更大的伤害，集中一点攻破能够让我们稳打稳扎，不费吹灰之力拿下胜利。"
  FRA_Disperse_then_attack: "分散进攻"
  FRA_Disperse_then_attack_desc: "老头子的思想已经彻底落后了，现在战争就拼一个速度，谁先拿下阵地谁就有更大的优势。我们分开行动，让敌人的援军疲于奔命，最后突然一击，可以彻底击垮敌人攻势。这才是我们应该坚持的战术思想。"
  FRA_Speed_advantage: "速度优势"
  FRA_Speed_advantage_desc: "只要我们的速度够快，敌人的火力支援就够不到我们，这是部分军官对装甲部队的态度，他们认为，只有发挥速度优势，才能更快的击垮敌人。"
  FRA_Armor_advantage: "装甲优势"
  FRA_Armor_advantage_desc: "谁愿意拿着自己的生命开着那辆纸壳子战斗。厚重的装甲能让敌人无法摧毁我们的重火力，这样才能最大限度的发挥装甲部队的力量。这是另一部分军官对装甲部队的态度，他们认为装甲的厚重可以最大限度保留我方经验丰富的作战人员，并引发质变，让部队更加优秀。"
  FRA_open_new_type_of_military_school: "开办新式军校"
  FRA_open_new_type_of_military_school_desc: "各种军事思想的碰撞让我们的军事理论取得重大突破，我们有必要设立一所新式军校来教导学生们这种理论的优越性，这关系到以后的作战指挥人员的能力，不容忽视。"
  FRA_Military_engineering_construction: "军事工程建设"
  FRA_Military_engineering_construction_desc: "混凝土要塞、地雷区、反坦克拒马等等，这些军事工程的建设能让我们的军队获得更大的优势。务必在开战前构建一道坚不可摧的防线。"
  FRA_Extend_Great_Barrier: "延长博丽大结界"
  FRA_Extend_Great_Barrier_desc: "博丽大结界还是太短了，安全感不足的人民向政府发出请愿要求延长结界。最后博丽女巫答应了这一请求。"
  FRA_Extend_Great_Barrier_tt: "在§Y我们与红魔馆边境§!修筑一条§Y3级堡垒§!。"
  FRA_Build_multi_layered_enchantments: "建设多层结界"
  FRA_Build_multi_layered_enchantments_desc: "还是不够安全，一层防御结界还是不够，正好博丽女巫正在延长大结界，不如邀请她来商讨多层结界构建的可能性。"
  FRA_Build_multi_layered_enchantments_tt: "在§Y博丽大结界之后§!修筑一条§Y3级堡垒§!"
  FRA_Coastal_fortifications: "海岸防御工事"
  FRA_Coastal_fortifications_desc: "我们那漫长的海岸线也是个问题，总不能被敌人抢滩登陆绕过结界吧，因此，海岸防御工事也不能落下，我们需要一个绝对安全的防御！"
  FRA_Coastal_fortifications_tt: "在大西洋沿岸数个§Y重要港口§!修筑§Y5级海岸堡垒§!。"
  FRA_Construction_of_anti_aircraft_fortifications: "建设防空工事"
  FRA_Construction_of_anti_aircraft_fortifications_desc: "海陆都考虑到了，不能忘记空中路线，为了避免敌人的空降作战，我们要构建一个防空网，一只鸟也别想在网上盘旋！"
  FRA_KMK_build_Fortification: "红魔馆工事修筑"
  FRA_KMK_build_Fortification_desc: "红魔馆地区那对魔导国彻底不设防为未来的战争埋下隐患，我们必须立即修筑工事，不要求能及时接入大结界，起码能阻拦敌人半个月吧。"
  FRA_KMK_build_Fortification_tt: "在§Y红魔馆与魔导国边境§!修筑一条§Y2级堡垒§!"
 #海军
  FRA_Gensokyo_Navy: "幻想乡海军"
  FRA_Gensokyo_Navy_desc: "每一个大国都应该重视自己的海权，我们不能让敌人在海上扬威耀武。现在海军部通过抗议拿到了一大批经费，希望可以见到一只敢打敢战的幻想乡海军。"
  FRA_Atlantic_Navy: "大西洋海军"
  FRA_Atlantic_Navy_desc: "大西洋是我们和圣杯之间的天然屏障，然而圣杯那强大的海军导致大西洋一直被他们所盘踞，现在，我们要在大西洋发出幻想乡的声音，告诉那些宵小，幻想乡从不畏惧在任何环境和敌人作战！"
  FRA_Emphasis_on_ocean_voyages: "重视远洋航行"
  FRA_Emphasis_on_ocean_voyages_desc: "我们在海军改革当中的目光必须长远，随着幻想乡实力的增强，我们的海军不可能永远在这一片大洋航行，整个世界的海洋都将出现她们的痕迹，从现在开始我们应当重视远洋航行。"
  FRA_Mediterranean_Navy: "地中海海军"
  FRA_Mediterranean_Navy_desc: "地中海关系到我们与殖民地之间的往来，同时，封锁了地中海我们就相当于抓住了南欧国家的命脉。为此，组建一直强大的地中海海军刻不容缓！"
  FRA_Attach_importance_to_offshore_operations: "重视近海作战"
  FRA_Attach_importance_to_offshore_operations_desc: "我们的地中海海军令沿岸国家如鲠在喉，特别是意呆莉，她们不止一次威胁我们撤回地中海海军，但是，敌人所畏惧的，我们必须坚持，加强海军的近海作战能力，说不定某一天，我们可以用上。"
  FRA_Naval_Officer_Academy: "海军军官学院"
  FRA_Naval_Officer_Academy_desc: "在精良的军械也需要精英的人才操控，我们的海军部队已经成型，现在缺少高素质的海军军官来加以指挥。所以很有必要设立独立的海军军官学院来加强海军素质。"
  FRA_New_Tactics_Research: "新式战术研究"
  FRA_New_Tactics_Research_desc: "我们的海军军备已经更新，原本的战术已经不适合现在的海军，我们迫切需要新式战术给海军增加战斗能力"
  FRA_Naval_aviation: "海军航空兵"
  FRA_Naval_aviation_desc: "海军目前仍保留着一部分战争时期航母，虽然它们的船体已经过时了，但航母背后的战术意义我们不能不重视，为了获得战斗力更强的航母舰队，现在我们就得开始相关方面的训练，飞行员们也得从空军独立出来，另设一只海军航空兵。"
  FRA_Aircraft_carrier_research: "航母研究"
  FRA_Aircraft_carrier_research_desc: "航母的存在极大的改变了海战的方式，有人预测未来必定是航母的天下，当然，现在的我们不必在意未来的事情，但根据可靠情报，世界各强国都在进行的航母研究，幻想乡自然不能落后。"
  FRA_Take_advantage_of_maneuverability: "发挥机动优势"
  FRA_Take_advantage_of_maneuverability_desc: "现在的主流船体都是几万吨的大家伙，速度都快不了，但要是我们对船体进行改造，大幅提升其速度，说不定能做到对敌先攻优势。"
  FRA_Light_ship_research: "轻型舰船研究"
  FRA_Light_ship_research_desc: "一场博弈当中，既要在意王，也要在意兵。我们的大型军舰没有其他小型军舰的陪同，那就是一个缓慢的靶子！因此，我们有必要对自己的那些轻型舰艇进行换代升级。"
  FRA_Submarine_clusters: "潜艇集群"
  FRA_Submarine_clusters_desc: "水下恶狼的威力在于能出其不意的给敌人致命一击，如果多艘潜艇集结攻击，那就像狼群一样，没人知道结果如何，但我们可以先试一试。"
  FRA_Submarine_research: "潜艇研究"
  FRA_Submarine_research_desc: "潜艇集群战术大获成功，海军部决定对潜艇研究倾斜资源，她们希望新式潜艇能取得更大的战果！"
  FRA_Heavy_firepower_superiority: "重型火力优势"
  FRA_Heavy_firepower_superiority_desc: "唯有巨炮的轰鸣才能毁灭敌人的进攻，战列舰的时代并没有结束，那巨大的舰炮就是对敌人最大的蔑视，没有任何装甲能挡住战列舰的一炮，让我们的敌人，活在舰炮的恐惧当中吧。"
  FRA_Heavy_Ship_Research: "重型舰船研究"
  FRA_Heavy_Ship_Research_desc: "这就是海军的钢铁巨兽，海军部相信，当我们拥有大量的战列舰，海洋以后都会是我们的天下，为此，让我们集中资源，创造世界上最强的钢铁巨兽吧！"
 #空军
  FRA_Gensokyo_Air: "幻想乡空军"
  FRA_Gensokyo_Air_desc: "航空器的进步，让制空权变得越来越重要，如果我们不希望有一天吃着火锅唱着歌，突然被炸弹砸脸上的话，那么就想个办法让我们的空军拥有更强的实力。"
  FRA_Absorb_Tengu_combat_experience: "吸纳天狗作战经验"
  FRA_Absorb_Tengu_combat_experience_desc: "天狗一族凭借那双翅膀在天上和敌人战斗了几百年，毫无疑问，她们的对空作战经验比我们丰富多了，我们只需要付出一点小小的代价，就能她们一直以来所有的空战经验，这是一笔划算的买卖。"
  FRA_Invest_in_Aero_Club: "投资航空俱乐部"
  FRA_Invest_in_Aero_Club_desc: "航空器都是需要有人驾驶的，这和陆地上不一样，它需要更高素质的驾驶员，我们必须先让人民爱上航空，才能从中发现更多的人才，投资航空俱乐部是个不错的主意，毕竟空军部抢下的经费不花白不花。"
  FRA_Invest_in_Air_Force_research: "投资空军研究"
  FRA_Invest_in_Air_Force_research_desc: "武器换代的速度比我们想象中的还要快，这场军备竞赛，一旦慢下来就是死亡。与其让那些将领把军费拿去浪漫，不如直接让军部把经费打给航空器研究所，毕竟，这是为了将来我们的天空上不会有敌人的飞行器。"
  FRA_Air_supremacy_seized: "制空权夺取"
  FRA_Air_supremacy_seized_desc: "夺取制空，是空军建立的目的，如果一支空军连夺取制空都做不到，证明她们是一支无能的军队。国家和人民不需要无能的军队！"
  FRA_Auxiliary_ground_operations: "辅助地面作战"
  FRA_Auxiliary_ground_operations_desc: "空军的看家本领，应当有帮助地面的大头兵前进，地面才是决定一场战役胜负的关键，如果我们根本不能阻挡敌人，就是再大的空中优势，也只能迟缓敌人攻势。就当为了自己，帮陆军兄弟稳住战线吧。"
  FRA_Three_dimensional_combat: "立体作战"
  FRA_Three_dimensional_combat_desc: "如今，良好的兵员素质，让空地一体化作战成为现实，战争就是个兑子游戏，你的筹码越多，赢得希望就越大。一场战斗，有空军支援往往能省很多时间，立体作战的优越性尽显无疑。"
  FRA_Aerial_competition: "空中角逐"
  FRA_Aerial_competition_desc: "我们不要求空军能给地面多大的帮助，我们只希望在敌人飞机在我方阵地上起舞的时候，自己的空军能出现并狠狠的教训他们一顿，最好一天连续不断地出现。"
  FRA_Defend_airspace: "保卫领空"
  FRA_Defend_airspace_desc: "如果连自己的国土的领空都不能保护，那么空军的存在就是一张白纸，一触即破。为了幻想乡的人民不会惧怕蓝天，保卫我们的领空！"
  FRA_Destroy_living_forces: "消灭有生力量"
  FRA_Destroy_living_forces_desc: "飞机可以很快生产出来，但飞行员不能。如果我们能消灭绝大多数飞行员的话，敌人就是拥有一万架飞机，也只能趴窝。只要我们找到他们的空军基地，就能达成这一目的，哪怕会造成我们自己的区域防空能力削弱，但这是必要的牺牲！"
  FRA_Industrial_strike_capabilities: "工业打击能力"
  FRA_Industrial_strike_capabilities_desc: "打仗打的就是后勤，只要我们摧毁了他们的工业生产能力，就能让前线的敌人武器变成烧火棍，我们的目的，就是让敌人的战争机器，卡住齿轮，哪怕一天，也能为我们争取一定的优势。"
  FRA_Massive_bombing: "大规模轰炸"
  FRA_Massive_bombing_desc: "这场战争已经没有平民可言！大规模轰炸或许会误伤一部分平民，但也能让敌人的后勤能力停摆。一切都是为了最终的胜利！"
  FRA_Logistical_sabotage: "后勤破坏"
  FRA_Logistical_sabotage_desc: "空军应该加大轰炸规模、轰炸时间，彻底摧毁敌人的后勤能力，我们要让敌人的部队一个罐头也吃不上！饿着肚子的敌人根本不是我们的对手。"
 #殖民地
  FRA_Directorate_General_of_African_Affairs: "非洲事务总局"
  FRA_Directorate_General_of_African_Affairs_desc: "现在的我们可以缓一口气，把目光投向我们的殖民地了。非洲事务总局已经成立，如何应对殖民地，这将是总局长时间的工作。"
  FRA_Glorious_liberators: "光荣的解放者"
  FRA_Glorious_liberators_desc: "幻想乡不再需要压榨殖民地来让人民过上好日子，是时候解放我们的殖民地了，此举不仅能得到殖民地的好感，更有助于我们的国际声誉提升！"
  FRA_Aid_to_Africa_construction: "援助非洲建设"
  FRA_Aid_to_Africa_construction_desc: "让非洲人民也富起来，这是我们应该做的，目前的北非依然很贫穷，基础设施落后。我们可以在她们那里设立工厂，帮助她们脱离贫困。"
  FRA_A_common_destiny: "共同命运"
  FRA_A_common_destiny_desc: "幻想乡和北非的命运早已连在一起，我们之间那不可分离的羁绊能让市场对彼此充满信心，很快，双方都将获得经济上的腾飞。"
  FRA_neocolonialism: "新殖民主义"
  FRA_neocolonialism_desc: "殖民地独立情绪高涨，我们不能一味的打压，这样只会导致殖民地与我们离心离德，我们应当掌握她们的经济，只要有经济命脉在手，独不独立有区别嘛？"
  FRA_Guiding_North_African_independence: "指导北非独立"
  FRA_Guiding_North_African_independence_desc: "这一天终于到了，经过议会表决，允许北非独立。但考虑到北非人民的素质不高，为了避免他们被利用，我们应该发挥大国风范，帮助他们独立。顺便保护一下我们的财产。"
  FRA_Expand_economic_control: "扩大经济控制"
  FRA_Expand_economic_control_desc: "目前的北非，我国的统治不过是从明面转到暗面罢了，但这样依然不保险，我们要让独立的北非人民一切生活都离不开我们，是时候扩大我们对北非的经济控制了。"
  FRA_Maintain_status_quo: "维持现状"
  FRA_Maintain_status_quo_desc: "人们从北非的首都名叫新人间之里就应该知道，幻想乡永远不会让北非脱离幻想乡的。这不是商量，这是要求！自古以来，北非就是幻想乡不可分离的一部分！"
  FRA_Increase_investment_in_North_Africa: "加大北非投资"
  FRA_Increase_investment_in_North_Africa_desc: "为了避免北非彻底失去控制，我们应该加大对北非的投资，减少北非人民对我们的不满，以方便以后的合并工作。"
  FRA_Pacify_grievances: "安抚不满情绪"
  FRA_Pacify_grievances_desc: "总有地上的蝼蚁敢于直面幻想乡的怒火，是时候教育一下她们，让这些刁民知道，幻想乡的强大！我们已经加大了对北非的军火援助了，代价就是一小部分人永远闭上他们的嘴巴！"
  FRA_Gensokyo_Alliance: "幻想乡联盟"
  FRA_Gensokyo_Alliance_desc: "是时候了，我们的殖民帝国终于来到了命运的十字路口，或许有一部分会毫不犹豫的脱离出去，但也有一些忠诚的臣民，会彻底加入幻想乡，就让这一切，交给天意吧！"
 #大战
  FRA_The_inevitable_battle: "不可避免之战"
  FRA_The_inevitable_battle_desc: "东部边境的威胁与日俱增，魔导国的一系列扩军备战和兼并行动已经揭示了这群不死族侵占地球的野心，欧洲大陆将又一次被战火席卷，现在我们必须准备好应对又一次大军压境的情况，幻想乡不惧任何敌人，幻想乡必将胜利！"
  FRA_Arise_warriors: "起来，战士们！"
  FRA_Arise_warriors_desc: "幻想乡的军力尚且薄弱，幻想乡的工力尚未富足，我们应当开启动员法令征召进入军队的姑娘们，发动各地建设城乡的工厂，为战争早做准备。"
  FRA_For_sake_of_Motherland_buy_bonds: "为了祖国，购买债券！"
  FRA_For_sake_of_Motherland_buy_bonds_desc: "为了保卫我们的幻想乡，请购买战争债券！现在幻想乡人购买的每一分债券都会成为射向敌人的子弹和砸向敌人的炮弹，为幻想乡的胜利，花出手中的御币吧！"
  FRA_Valiant_girls_go_to_war: "英勇的姑娘们，走上战场！"
  FRA_Valiant_girls_go_to_war_desc: "幻想乡的女儿们，祖国呼唤你们！母亲需要你们的保护，加入幻想乡军队，走上战场，抗击敌人！"
  FRA_Hard_work_is_best_support: "努力生产就是最好的支援！"
  FRA_Hard_work_is_best_support_desc: "在祖国生死存亡的关键时刻，工厂齿轮的每一次转动，生产出来的每一个部件，都将成为入侵者的最大阻力。人需要休息，但是工厂不需要！我们不能让前线的儿女们没有对抗敌人的资本，即便青壮年大部分都已经奔向前线，我们也要保证后勤的基本生产"
  FRA_Only_whole_people_united_we_lead_to_victory: "全民团结才能走向胜利！"
  FRA_Only_whole_people_united_we_lead_to_victory_desc: "战端一开，地无分南北，人无分老幼，人人皆有守土抗敌之责，敌人不会对我们施与怜悯，幻想乡的每个人都应当时刻准备好对抗敌人入侵的铁蹄！用铁与血来守护我们的家园"
  FRA_Water_fertile_fields_with_enemy_filthy_blood: "用敌人肮脏的血液来浇灌我们的沃野！"
  FRA_Water_fertile_fields_with_enemy_filthy_blood_desc: "我们的土地，他们的血，他们的暴行，我们必将百倍奉还，城市毁灭了，用他们的尸骨重新”建立我们的家园，田地干涸了，就用他们的鲜血灌溉我们的庄稼。幻想乡永不投降，我们将与他们不死不休！"
  FRA_Fantasy_Township_never_surrenders: "幻想乡永不投降"
  FRA_Fantasy_Township_never_surrenders_desc: "尽管我们做了一切能做的准备，但敌人依旧攻破了我们的防线，但我们绝不投降，我们将在山脉战斗，在海洋战斗，在街道战斗，在田野战斗，我们将保护我们的故土，不惜一切代价，即使这个国家绝大部分沦陷，即使我们孤军奋战，我们也将一勇无前，反抗到底。龙神的荣耀与吾等同在。"
  FRA_Mobilization_of_partisans: "动员游击队"
  FRA_Mobilization_of_partisans_desc: "大战失利，防线崩灭，大结界遭到毁灭一击，国土沦陷，但我们的反抗没有停止，也不能停止，圣神的龙神将我们团结一致，她的力量将带来胜利。游击队，亮出你们我獠牙，对我们的敌人以致命一击。"
  FRA_Bastion_Plan: "堡垒计划"
  FRA_Bastion_Plan_desc: "尽管敌人已经深入我们的领土，但现在开始构建防御还为时不晚。我们将收集一切可以收集的资源来重新建设防线，争取让敌人每前进一步都要付出数倍于之前的代价。"
  FRA_Agitating_the_rebels: "鼓动反抗者"
  FRA_Agitating_the_rebels_desc: "敌人或许能征服我们的土地，但绝对无法征服我们的意志，我们必须为一切反抗这提供力所能及的帮助，激发爱国情怀，宣传反抗意识，反抗者就是我们在敌后的英雄，让我们与地下抵抗者同在。"
  FRA_Build_a_large_rear: "建设大后方"
  FRA_Build_a_large_rear_desc: "我们的工业重地相继沦陷，幻想乡已经危如累卵，但我们不能放弃反抗的希望，我们得快速做出反应，军工没了就重建，后勤没了就再修，我们还没有到山穷水尽的地步。"
  FRA_Long_road_home: "长路归乡"
  FRA_Long_road_home_desc: "在过去的时间里，我们经历了牺牲、失败、国土沦丧。但，幻想乡并没有被击败，我们用勇气和毅力克服重重困难，抵御住了侵略者的疯狂进攻。今天，我们将迎来反攻的时刻，我们将用自己的血肉之躯捍卫我们祖国和民族的尊严。"
  FRA_Dragon_God_Raid: "龙神突袭"
  FRA_Dragon_God_Raid_desc: "正义的力量终于发挥了作用，反攻的火焰熊熊燃起。士兵们鼓舞着士气，浴血奋战。从头上被甩出的子弹，到脚下被抛起的土块，每一个动作都是为了国家，为了民族的尊严。士兵们用血肉之躯铸就不屈不挠的意志，狠狠打击敌人。最初的不和谐在这一刻得到了彻底的消解，大家为了一个共同的目标而团结一致，在炮声和鸣笛声中，寒冷而坚定的胜利笑容重新闪耀起来。龙神的荣耀将率先发起进攻，各位，跟上龙神的脚步，前进。"
  FRA_Moon_Battle_Unit: "月战部队"
  FRA_Moon_Battle_Unit_desc: "在月面战争时期，双方曾经使用过一些极其残忍的装备，尽管战争结束后这些装备就以不人道为名封存起来，但使用过这些装备的部队们仍在时刻保持待命。\n但既然战争形势已经危急到了这种地步，那么就没理由去考虑什么人道不人道了，是时候征召她们，将装备重新分发到她们手上了。"
  FRA_Strengthen_the_line_of_defense: "稳固防线"
  FRA_Strengthen_the_line_of_defense_desc: "虽敌强如斯，但我们不会放弃，稳住我们的防线，如果堡垒被击穿了，那就用我们战士的血肉之躯组建起我们的钢铁堡垒，将可恶的入侵者阻拦在我们防线之外。"
  FRA_Regain_lost_ground: "收复失地"
  FRA_Regain_lost_ground_desc: "壮志凌云，英姿勃发，将军带领着军队，奋勇冲锋。炮声隆隆，弹雨纷飞，她们顽强地攻打敌方的据点。强敌疯狂，没能让任何一支军队退缩，毅然决然的迎难而上。士兵将攻破敌方防线，收复故土，赢回幻想乡的荣耀。她们拥有着强大的士气，在她们凯旋而归，获得了胜利的喜悦的那一刻，她们将骄傲地宣布：“为祖国而战，为家园而生！”"

