 #结语
  FRA_end_tip_2: "感谢您对幻想乡内容的喜欢与支持！\n幻想乡的制作还是略显仓促，还有诸多没能完善的细节与不妥之处，还望多多包涵。"

  FRA_Sanae_end_title: "至此，§S幻想乡帝国§!的征途告一段落"
  FRA_Sanae_end_tip: "守矢的雄狮--§S东风谷早苗§!，从左翼暴徒手中挽救了祖国，拨乱反正，带领祖国回到了正确的道路，把幻想乡从大萧条的灾难中拯救出来，把幻想乡重新建设为一个§Y强大§!、§O光荣§!的国家。\n\n在面对§R强大的外敌§!时--无论是德意志、魔导国抑或是苏联与圣杯，早苗元帅都挺身而出，§Y扶大厦之将倾§!，§Y挽狂澜于既倒§!，东风谷绝不负“§S皇帝§!”之名。\n\n在一次次的征途中，§Y皇帝与祖国的威名§!以及“§R革命§!”的精神传遍世界。\n\n§S“即使地面陷落、天空崩坏，幻想乡也将永不动摇！”§!"
  FRA_Sanae_end_close_button: "幻想乡万岁！皇帝万岁！人民万岁！"
  FRA_Sanae_end_close_button_TT: "§S东风谷的荣光§!遍及欧陆乃至新大陆，相信不久的将来，§G革命皇帝§!的威名将会传颂于世界的五湖四海，在大本钟的钟声中、在塞纳河的船歌中、在红场的夜晚中......"

  FRA_PSG_end_title: "至此，§P[FRA.Getname]§!的征途告一段落"
  FRA_PSG_end_tip: "无数的§R革命§!发生于幻想乡这片大地，而每一次革命，冲在最前线的永远是§Y无产阶级§!同志，但结果往往被资产阶级窃取。\n但是，这一切都将改变！茨木华扇与博丽灵梦领导的“§P温和革命§!”取得了完全的胜利。幻想乡的工人战胜了邪恶的侵略者，和平地从资本家手中交接了权力。我们相信，§O幻想乡的明天§!将会无比光明！"
  FRA_PSG_end_close_button: "那一天何时到来，同志？"
  FRA_PSG_end_close_button_TT: ""

  FRA_PFG_end_title: "至此，§C[FRA.Getname]§!的征途告一段落"
  FRA_PFG_end_tip: "在这群狼环伺，极端意识形态大行其道的世界上，仍有一处自由的最后堡垒傲然屹立——那便是她领导的§C幻想乡共和国§!。是她保卫国家免于§R第五纵队§!与§0破坏分子§!染指；是她让那戕害无数无辜百姓，名为不公不义的可怖巨兽失血而死；依旧是她终结了那唤作§S极端贫困§!的幽灵。\n她就是，§O雾雨魔理沙§!。\n在她，爱丽丝与自由党的狂野征程中，她从不畏惧，毫不留情，绝不停手。只为§Y还国家四海升平§!，§Y还百姓安居乐业§!。\n§O雾雨魔理沙§!，你的名字将永远铭刻在§C幻想乡共和国§!的史册之上，你的功绩将永远被人民传颂！"
  FRA_PFG_end_close_button: "自由，平等，博爱！"
  FRA_PFG_end_close_button_TT: "§O雾雨魔理沙§!终有卸任之时，但幻想乡的§C民主之光§!非但不会消亡，反而会继续闪耀下去，照亮一代又一代人前进的道路。\n你知道的，有些鸟儿注定不会被关在牢笼里，它们的每一片羽毛都闪耀着§2自由的光辉§!。而人类与妖怪，又何尝不是如此呢？"

  FRA_IDU_end_title: "至此，§Y[FRA.Getname]§!的征途告一段落"
  FRA_IDU_end_tip: "从路易斯安那到魁北克，从阿尔及尔到印度支那，共和国第一次将她的目光放眼至整个世界，巨兽的轰鸣取代了革命的号角，经历了来自圣杯与德意志的风暴，立于上白泽慧音之治的军事-工业复合体已准备好将幻想乡的触角伸向四海。\n魔导国政权伏诛已久，新大陆业已无人阻止来自欧罗巴彼端的二次入侵，不同与以往任何一个旧日帝国，幻想乡的野心更加庞大：在扑灭逾距火苗之后，共和国要在这个世界建立一个崭新的金融体系。一个绝对而又不绝对的单边秩序。\n就目前来说，人们似乎已将希望寄托于又一次周期律的结束，即使在烈日当空之时期待落日是一件痛苦的事情。\n时间会告诉我们最后的答案。"
  FRA_IDU_end_close_button: "the world is yours!"
  FRA_IDU_end_close_button_TT: "我们向着巅峰突进。\n在刀锋边缘上游走，稍有不慎即终结于他人之手。\n我们已在无归之路上放手狂奔，眼前已是绝崖之景\nSo，How to keep it？\n\n我们撞烂了道德的大门，闯入禁地\n我们将油门踩死，势不可挡\n已经无人能够摧毁这狰狞的怪物\nSo，Push it！ Push it！\nWelcome to the limit！"

  FRA_GFN_end_title: "至此，§F[FRA.Getname]§!的征途告一段落"
  FRA_GFN_end_tip: "§Y铃仙·优昙华院·因幡§!重新统合了§Y幻想乡§!。在§F幻视之主§!的带领下，现在§Y幻想乡§!已经摆脱了往日的停滞不前，正在迎来崭新的、光明的新世界。\n每一个公民的言行、消费记录、甚至是心跳频率，都通过遍布街巷的“§R红眼传感器§!”实时传输至永远亭的超级终端。在这里，人性被量化为冰分的数值：高分者享受着帝王般的特权与资源，而低分者则在系统的判定下逐渐失去生存的空间——从限制购买食物到最后在社会契约中被彻底“删除”。在制度的保障下，§Y幻想乡§!成为了一个充斥§O高效§!、§O秩序§!与§O进步§!的社会。§C社会信用§!与§R国家监督§!深入社会的方方面面，这是一场世界史上全新的政治革新。\n从不列颠到君士坦丁堡，§Y幻想乡§!已经是称雄欧陆的世界大国，不再如以往偏安一隅。我们继承了历史上那些伟大征服者的冠冕，创造了属于幻想乡的新秩序。"
  FRA_GFN_end_close_button: "幻视之主万岁！幻想乡万岁！"
  FRA_GFN_end_close_button_TT: "在数字的审判面前，没有秘密可言。你的价值，由系统定义。"

  FRA_HKP_end_title: "至此，§Y[FRA.Getname]§!的征途告一段落"
  FRA_HKP_end_tip: "当§Y蓬莱山辉夜§!在人间之里的万民簇拥下接过那顶镶嵌着蓬莱玉枝的王冠时，幻想乡历史上最诡谲也最壮丽的政治实验宣告完成。这一幕彻底颠覆了传统的认知：在飘扬的三色旗与月之旗前，曾经势不两立的“§C共和理想§!”与“§g君主神权§!”在这一刻达成了血泪交织的和解。\n§g月夜议会§!成功向世界证明，§C自由§!并不一定意味着议会的无序，§Y平等§!也可以在女王神圣的庇护下实现。辉夜女王不再是深宫中不可直视的旧神，而是共和国“第一公民”与“民族母亲”的结合体。她在宪法上签字，承诺保障每一位劳动者的尊严，却也保留了在危机时刻审判叛国者的至高裁决权。\n没人预想到幻想乡会返回君主制，正如没人预想到当年的幻想乡会爆发大革命，但这是个情理之中的结果，事实证明君主制在欧洲仍旧有土壤存在，作为一面团结国家的旗帜，活生生的国王比空泛的理论更有感染力。我们实现了国家的§O天命§!，建立了历史上屈指可数的§Y伟大帝国§!，皇威加于四海，浩荡无涯。"
  FRA_HKP_end_close_button: "辉夜姬万岁！幻想乡万岁！"
  FRA_HKP_end_close_button_TT: "在“自由、平等、博爱与国王”的口号声中，幻想乡跨入了它最辉煌、也最令人生畏的纪元。"

