  IDU_TITLE1: "§W独立民主联盟（[?support_of_IDU|0]）§!"
  GFN_TITLE1: "§W国民阵线（[?support_of_GFN|0]）§!"
  MNR_TITLE1: "§W全国共和运动（[?support_of_MNR|0]）§!"
  GPM_TITLE1: "§W[GET_GPM_Name]（[?support_of_GPM|0]）§!"
  GPM_pt: "§0[GET_GPM_Name]§!\n§L[GetGPMPartyDesc]§!\n政党意识形态：§g[GetGPMIdeologySubtype]§!\n政党领导人：§Y爱丽丝·玛格特罗依德§!\n支持率：§Y[?support_of_GPM]%§!"
  GPM_desc_initial: "在选举未能产生绝对多数、军方强行介入乱局后，爱丽丝领导的“[GET_GPM_Name]”成为了维持幻想乡运作的技术大脑。此时的联盟代表了军工复合体、精密魔导工程师与新兴技术官僚的利益。爱丽丝对议会的争吵和极端民族主义的狂热均不感兴趣，她认为国家应当像一台巨大的精密时钟。联盟致力于将大革命留下的粗放工业转化为高度标准化的“魔导工业体系”，通过提供精锐的人偶兵团和后勤补给，在风见幽香的武力和绵月姐妹的净化中寻得了某种脆弱的平衡。对于她而言，支持军政只是为了获得实验场地，将国家从“无序的人治”引向“逻辑的法治”。"
  GPM_desc_military_politicism: "随着三头同盟内部矛盾的激化，爱丽丝最终在政治斗争或血腥清洗中脱颖而出，建立了一个以“逻辑与效率”为唯一准则的技术专政政府。在独自掌权期间，国家联盟彻底废除了残余的共和制度，将其替换为由魔导计算核心主导的行政网络。爱丽丝推行大规模的社会自动化改造，将城市规划为完美的几何图形，并用人偶交警、人偶工人和人偶士兵替代了大部分低效的人工岗位。此时的社会虽然处于极高的物质生产率下，但人性中的偶然与自由被视为“系统的误差”。国民被要求像零件一样精准生活，虽然尚未失去意志，但他们的言行已经通过严密的法律和算法被束缚在看不见的丝线之上。"
  GPM_desc_Gestalt: "当爱丽丝认为即便最严苛的法律也无法消除人类和妖怪灵魂中的腐朽时，她启动了终极的“全球格式化计划”，正式成立了人偶之国。在这个阶段，所有的百姓——无论是人间之里的市民还是森林中的妖怪——都被剥离了残破的血肉意志，被彻底改造为由爱丽丝指尖操控的精美人偶。街道上回荡着统一的节拍，不再有争吵、饥饿或反抗，因为每一具躯壳都共用着爱丽丝那绝对冷静的意志。整个世界变成了一个宏大且静谧的剧场，万物皆在丝线的牵引下起舞。这是一种极致的和平，也是文明的终结。爱丽丝作为唯一的导演，坐在由齿轮与法阵构成的王座上，注视着这个由她亲手裁缝出的、永远不会再出现“错误”的纯粹理想国。"

  KYR_TITLE1: "§W[GET_KYR_Name]（[?support_of_KYR|0]）§!"
  KYR_pt: "§G[GET_KYR_Name]§!\n§L[GetKYRPartyDesc]§!\n政党意识形态：§G[GetKYRIdeologySubtype]§!\n政党领导人：§Y风见幽香§!\n支持率：§Y[?support_of_KYR]%§!"
  KYR_desc_initial: "在选举陷入僵局、军方强行接管政权后，风见幽香领导的“[GET_KYR_Name]”成为了三头同盟中最令人生畏的武力支柱。此时的政战线代表了前线激进军官、失意妖怪武士以及信奉丛林法则的极端分子。幽香将国家治理比作“园艺”，主张在乱世中必须以铁腕修剪掉那些阻碍国家生长的“杂草”。在这一阶段，她利用在大战和守矢反击战中积累的绝对威望，为三头同盟提供对内镇压和对外扩张的暴力保障。虽然她暂时忍受着爱丽丝的工业噪音和绵月姐妹的洁癖，但她那标志性的阳伞始终悬在议事厅的上空，提醒着同僚：所有的秩序都必须建立在对强者的绝对服从之上。"
  KYR_desc_military_politicism: "随着同盟的瓦解，风见幽香通过一场名为“大修剪”的军事行动肃清了所有竞争对手，正式确立了她的个人独裁。此时的[GET_KYR_Name]已彻底转型为一种带有原始自然崇拜色彩的极权组织。幽香废除了所有的文官法律，代之以简单残暴的自然法：适者生存。她开始大规模削减城市的行政功能，将国民强行驱赶回土地。虽然工业生产尚未完全废弃，但其唯一目的已变为制造收割领土的战争机器。金色的向日葵旗帜插遍了幻想乡的每一寸土地，象征着国民意志必须如向日葵般整齐划一地追随她这颗“唯一的太阳”。任何背阳而生的异见，都会被作为养料埋入地底。"
  KYR_desc_annihilationism: "当权力的修剪达到极致，幽香启动了重塑世界的终极魔导仪式，将整个国家转变为永恒的太阳花田。在这个阶段，所有的工业齿轮停止转动，曾经喧嚣的人间之里被疯狂生长的向日葵丛彻底吞噬。去工业化被推行到了最极端的程度——文明的痕迹被抹除，取而代之的是无边无际、灿烂得令人绝望的金色花海。所有的百姓不再作为独立的个体存在，他们的意识被幽香庞大的自然魔力所覆盖、同化，成为了维持花田繁茂的活体容器。国民在花丛中静默地伫立，脸上挂着统一且空洞的微笑，身体随着幽香的呼吸律动。这里不再有战争，也不再有痛苦，只有一种在极致暴力压制下实现的“自然和谐”。风见幽香撑着阳伞走在漫天花粉中，微笑着注视着这个由她亲手完成的、全世界最庞大也最安静的花园。"

  Sanae_TITLE1: "§W[GET_Party_of_Sanae]（[?support_of_Sanae|0]）§!"
  Sanae_pt: "§S[GET_Party_of_Sanae]§!\n§L[GetPOSPartyDesc]§!\n政党意识形态：§G[GetRulingIdeologySubtype]§!\n政党领导人：§Y东风谷早苗§!\n支持率：§Y[?support_of_Sanae]%§!"
  Sanae_party_desc_initial: "在华扇内阁因劳动法案引发大规模骚乱、国家行政陷入瘫痪的至暗时刻，东风谷早苗率领守矢军校的精锐官僚与前线勋贵发动了“雾雨月”政变。此时的“[GET_Party_of_Sanae]”并非传统意义上的政党，而是一个带有宗教色彩的军事管制委员会。早苗以“现人神”的威望向混乱的平民和激进的劳工宣布：唯有绝对的服从能换取生存的奇迹。军政府迅速取缔了争吵不休的议会，用守矢式的行政效率替代了腐败的官僚体系。在这一时期，早苗通过铁腕平定骚乱，并利用守矢神社的技术积累进行初步的军事动员，将国家从内战的边缘拉回到名为“秩序”的铁轨上。"
  Sanae_party_desc_Sanaeism: "随着秩序的恢复，早苗并不满足于仅仅做一个临时的独裁者，她效仿凯撒式的政治艺术，通过全民公投确立了其合法统治，将“奇迹党”转型为一个跨阶层的民族主义政党。她将大革命的理想与军国主义的荣耀缝合在一起：一方面保留了社民党时期部分惠民政策以安抚工农，另一方面通过对外强硬姿态赢得了军方的死忠。早苗宣扬“幻想乡天命论”，认为幻想乡不仅要自救，更要担负起领导整个欧洲的使命。通过一系列令人瞠目结舌的经济增长与军事重组，国民开始盲目地崇拜这位能“呼唤奇迹”的领袖，国家逐渐变成了一台为战争而呼吸的精密引擎。"

  HKP_TITLE1: "§W月夜议会（[?support_of_HKP|0]）§!"
  HKP_pt: "§g月夜议会§!\n§L[GetHKPPartyDesc]§!\n政党意识形态：§g绝对君主制§!\n政党领导人：§Y蓬莱山辉夜§!\n支持率：§Y[?support_of_HKP]%§!"
  HKP_desc_initial: "在国民阵线赢得多数席位并组建政府的初期，月夜议会以“退伍军官福利委员会”与“月兔侨民互助会”的名义潜伏在执政联盟内部。此时的议会是铃仙意志的铁杆执行机构，其成员主要由随铃仙退伍的月兔军官团（如清兰、铃瑚）以及对现状不满的高级技术人员组成。在纷乱的内阁中，月夜议会表现出了一种令人生畏的冷峻纪律感，他们并不直接参与繁琐的社会议题讨论，而是专注于渗透军队中枢与情报系统。\n在这一阶段，月夜议会的主要职责是为铃仙的威权统治提供“非对称支持”。他们利用先进的月之都通信技术建立了一套独立于国会之外的情报网络，协助国民阵线清算激进的左翼起义者和官僚体系内的反对派。对于外界而言，月夜议会是铃仙手中最锋利的匕首，负责执行那些“不便在议会公开”的秩序维护行动。\n与此同时，议会内部已经开始秘密进行“文化造势”。他们利用控制的报刊和电台，系统性地解构共和制的合法性，并暗中编纂关于“永远亭公主”的神圣家谱。这一时期的月夜议会更像是一个耐心的猎人，他们在执政联盟的掩护下不断扩张武力与财政基础，将国家行政权力逐步向“月兔官僚”集中。他们所有的退让与合作都指向一个唯一的终极目标：等待社会动荡的火候成熟，便撕开共和政体的外壳，迎接那轮真正的明月降临幻想乡的王座。"
  HKP_desc_monarchy: "“星辰拱卫明月，秩序重归大地。”\n\n月夜议会是幻想乡王国复辟后的唯一执政力量，它象征着铃仙所追求的“高效、简洁、团结”道路的终极形态。在国民阵线赢得大选并执政数年后，铃仙通过一系列精密的政治操弄与全境范围的造势运动，成功唤醒了民众对“神圣秩序”的渴望，将流亡已久的月之公主蓬莱山辉夜推上王座。随着王冠落地，旧有的共和制残余被彻底清洗，取而代之的是以辉夜女王为虚位元首、以铃仙为内阁首辅的全新政治实体——月夜议会。"

