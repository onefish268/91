  FRA_warlord_build_hinterland_industry: "建设后方工业"
  FRA_warlord_build_hinterland_industry_desc: ""
  FRA_warlord_new_gensokyo: "新幻想乡"
  FRA_warlord_new_gensokyo_desc: ""

#事件 
  FRA_Gensokyo.001.t: "舵手逝世"
  FRA_Gensokyo.001.desc: "“我很遗憾，我们的伟大舵手，幻想乡首位共和领袖——稗田阿求，今日起，因病不幸去世。她对幻想乡的无限热爱和卓越贡献，我们都看在眼里，记在心里。我们将会永远纪念阿求......”\n在悼念会上，选举委员会会长无比沉重的说道：“现在，我们要把没有完成的选举进行下去，全体成员跟我宣誓”\n\n底下人站起来齐刷刷喊道："
  FRA_Gensokyo.001.a: "“吾等将秉承国母遗志”"

  FRA_Gensokyo.002.t: "记者发布会"
  FRA_Gensokyo.002.desc: "随着36年过半，幻想乡境内的首次大选又让苦闷于没有大新闻的天狗们活跃起来了，这片充满苦难与屈辱的土地上迎来了首次可以决定自己命运的时刻，各个党派早就摩拳擦掌跃跃欲试，想要在接下来的大选崭露头角，一举拿下幻想乡地区的领导权。不过，天狗还是很想采访一下稗田阿求的看法，作为幻想乡共和的领袖，天狗们还是很想借着这位将死之人的看法来狠狠收波元子，至于谁上台，天狗们并不怎么关心。"
  FRA_Gensokyo.002.a: "“请给工人一个提问机会！”"
  FRA_Gensokyo.002.b: "“魔理沙小姐将参与选举吗？”"
  FRA_Gensokyo.002.c: "“政府将如何处理接下来的国际贸易问题？”"
  FRA_Gensokyo.002.d: "“我们真的要放任西方那些亡灵殖民者吗？”"
  FRA_be_as_left: "我们将扮演§P人民阵线§!"
  FRA_be_as_PFG: "我们将扮演§C幻想乡自由党§!"
  FRA_be_as_IDU: "我们将扮演§Y独立民主联盟§!"
  FRA_be_as_right: "我们将扮演§F国民联盟§!"

  FRA_Gensokyo.003.t: "人民阵线"
  FRA_Gensokyo.003.desc: "面对右翼与中间派势力的选举压力，同为左翼政党的革命共产主义同盟、幻想乡共产党与幻想乡社会民主党宣布组建以幻想乡社会民主党为首的选举联盟“人民阵线”，来争取不久后大选的胜利。"
  FRA_Gensokyo.003.a: "前进，为了社会主义的明天！"

  FRA_Gensokyo.004.t: "自-民联盟？"
  FRA_Gensokyo.004.desc: "幻想乡国内的左翼与右翼已经联合起来，很可能在接下来的大选中威胁到我们的地位，我们可以向同为中间派的政党抛出橄榄枝，组建的幻想乡自由党-独立民主联盟的选举联盟。"
  FRA_Gensokyo.004.a: "我们联合！"
  FRA_Gensokyo.004.b: "我们独自一人就可以对付这些极权分子了。"

  FRA_Gensokyo.005.t: "国民联盟"
  FRA_Gensokyo.005.desc: "面对左翼与中间派势力的选举压力，同为右翼政党的国民阵线与全国共和运动宣布组建组建以国民阵线为首选举联盟“国民联盟”，来争取不久后大选的胜利。"
  FRA_Gensokyo.005.a: "幻想乡必须夺回她应有的地位。"

  FRA_Gensokyo.006.t: "自-民联盟"
  FRA_Gensokyo.006.desc: "面对左翼与右翼势力的选举压力，幻想乡自由党-独立民主联盟宣布组建选举联盟“自-民联盟”，来争取不久后大选的胜利。"
  FRA_Gensokyo.006.a: "万恶的中间派"

  FRA_Gensokyo.007.t: "选举开始"
  FRA_Gensokyo.007.desc: "幻想乡1936大选正式开始进行，我们必须尽可能获得绝对多数的选票（支持我们选举联盟的选区>50%）。\n如果我们没能获得绝对多数而胜选，反对党很可能发动不信任议案来弹劾我们的总统。"
  FRA_Gensokyo.007.a: "我们必然胜利"

  FRA_Gensokyo.008.t: "黑色星期二波及幻想乡"
  FRA_Gensokyo.008.desc: "当幻想乡还沉浸在阿求离去的悲伤气氛中时，源自于圣杯王国的黑色星期二悄无声息来到幻想乡。霎时间股票崩盘，大多数企业支撑不住纷纷倒闭关门，就那些大企业也支撑不住开始裁员，幻想乡的经济弹指间便从春天到了寒冬，大街上站满了居无定所，饥肠辘辘寻找工作的人，政府税收几近枯竭，大企业的破产使得幻想乡生产水平甚至到不了原来的一半，农产品价格一落千丈，很多农庄纷纷出售拍卖，各地的游行示威也逐渐多了起来。阿求穷其一生建立的脆弱的共和国秩序如同破房屋般，轻轻一推便土崩瓦解。"
  FRA_Gensokyo.008.a: "这太糟了"

  FRA_Gensokyo.009.t: "选举结果出炉"
  FRA_Gensokyo.009.desc: "大萧条的阴霾并没有影响幻想乡选举的继续，相反这场灾难为各个政党提供了一个相当不错的机会去掌握幻想乡这艘大船的船桨。到了结束的那一天，相当一部分人们走上街头，去看看哪个政党支持率最高，争取到了对幻想乡的领导。当她们拿起文文新闻或者花果子念报时，上面赫然写着"
  FRA_Gensokyo.009.a: "为了祖国的明天！"

  FRA_Gensokyo.010.t: "红魔馆宣布独立"
  FRA_Gensokyo.010.desc: "当委员会忙的焦头烂额的时候，红魔馆独立的消息很快传到了人里，但是以幻想乡现在自己的问题都没时间处理，谁还有闲工夫处理红魔馆那个烂摊子。"
  FRA_Gensokyo.010.a: "我们无能为力"

  FRA_Gensokyo.011.t: "曾经的背叛，今日之分裂"
  FRA_Gensokyo.011.desc: "“众神眷恋的幻想乡，竟再遭此灾厄”\n随着幻想乡内部暴乱加剧，对红魔馆本就微不足道的统治终于宣告解体\n红魔馆和幻想乡本就微妙的联系随着妖精叛乱的发展早已变得支离破碎，大萧条也使得幻想乡无力继续控制红魔馆\n\n很快红魔馆上上下下的人员都动了起来，帕秋莉深藏在地下巨大魔法阵将红魔馆与幻想乡暂时隔绝起来了一段时间，一片红雾短时间内将整个地区给笼罩起来。幻想乡用来守备红魔馆的少量军队，抵挡不住整个红魔馆的突袭。即使，领头的人很快把军队重新集合了起来，领头的人刚想说些什么，突然，她就发现自己的脖子流出来鲜红的血液。\n咲夜拿着小刀站在旁边，猩红的恶魔从血红的雾中走出，说道“你们居然认为这次妖精暴动会对你们有利，真的是妄想。无论是谁赢，我们的命运都早已注定好了......”\n妖精女仆将她们团团围住，其余人见抵抗无望纷纷缴械投降"
  FRA_Gensokyo.011.a: "这次短暂的分裂，是为了更伟大的统一"

  FRA_Gensokyo.012.t: "不信任议案"
  FRA_Gensokyo.012.desc: "当这次这次投票结果出来之后，结果出乎人们的意料，大部分人认为政府操纵了选票结果。反对党联合起来向政府递交了不信任议案，要求重新进行大选，虽然政府方面及时出面做出了解释，但是愤怒的人们已经失去了对政府的信任，在反对派的鼓动下，人们纷纷涌到政府大楼前，要求政府重新选举，政府也作出了相应的措施，让警察出面维持秩序但也是仅仅能够将民众阻拦在大楼外。"
  FRA_Gensokyo.012.a: "混蛋。"

  FRA_Gensokyo.013.t: "人间之里动乱"
  FRA_Gensokyo.013.desc: "在双方僵持不下时，有人高喊道：“政府操纵了选票，她们违背了我们幻想乡民主的原则！我们的权利又一次遭到了强权的破坏，我们需要团结起来，捍卫民主！”这话便像导火索一般，点燃了现场积压已久的民众，现场顿时乱作一团，有人拿起啤酒瓶狠狠的砸向维持秩序的警察，警察也作出了反击，用弹幕狠狠的教训了那人一顿。政府大楼面前开始了警察与民众的弹幕大混战，混乱很快便像瘟疫一般蔓延开来，很快，整个人间之里都陷入了无政府的混乱，所有人都在宣泄大萧条以来的负面情绪。曾经的世界大都市仿佛陷入了一场无休止的闹剧之中。"
  FRA_Gensokyo.013.a: "太糟了"

  FRA_Gensokyo.014.t: "军队进入人间之里"
  FRA_Gensokyo.014.desc: "在委员会的再三请求下，爱丽丝决定带着她的人偶军队进入人里平定混乱。爱丽丝先是表现的犹豫不决，但是在最后的时候却又答应的很爽快，爽快到令人感到不安。\n“爱丽丝小姐，想必你已经准备好下一步要做什么了吧”风见幽香像往常一样优雅的坐在花田里品着茶。“不然，我也不会来找你”爱丽丝坐在幽香对面“和我一起，进入人里，平定叛乱，我们一起将幻想乡的权柄掌握在手心”幽香笑了，她很清楚爱丽丝只不过是借用自己令人胆寒的实力和自己强大威望服众罢了，不过她自己也很久没有这么彻底大闹一番了，这副历经千年岁月的身躯又有可以可以大展神威的时候了。幽香站了起来说道“走吧，我就看在神绮的面子上陪你走一趟”\n果然有了风见幽香坐镇，在人间之里几乎没遇见多少抵抗，那些实力强劲的妖怪和人类看见幽香也没了反抗的勇气，乖乖被抓了起来，就连路旁啼哭不止的儿童看见幽香，也被吓的停止了哭泣。\n爱丽丝顺利来到政府大楼前，委员会会长满脸笑意的走到爱丽丝和幽香面前，多谢爱丽丝小姐和幽香小姐愿意帮我们平定叛乱，自然我们也不是不会让你们白来一趟的，爱丽丝端详着政府大楼，观察着周围环境，压根就没有理会她。会长也不知道说些什么好，但是她已经感觉有点不对劲了。爱丽丝看了看，脸上露出了满意的笑容，爱丽丝对幽香使了个眼色，幽香心领神会，抬手捏住会长脖子，会长还没反应过来脖子就已经被幽香的怪力捏断了，委员会剩下的成员也都悉数除掉。爱丽丝接着痛心疾首的说道：“尽管我已经拼尽全力，但委员会全员皆被暴民屠戮殆尽，所以我宣布幻想乡进入紧急状态，由我和幽香暂时主管大权，誓要将杀尽委员会的贼人绳之以法！”"
  FRA_Gensokyo.014.a: "终于能稳定下来了"

  FRA_Gensokyo.015.t: "镇压！"
  FRA_Gensokyo.015.desc: "秩序重归人里，但是稳定并没有一同归来，爱丽丝将这次混乱的问题扣到了共产党和民主联盟的头上，人偶军团们开始出动，全国范围内肆意搜捕共产党人和民主联盟成员，这也引起了一些混乱和不必要的屠杀，很多人就仅仅挡了一下军队的行进路线，人偶便不由分说给就地枪决了，人偶军队的残酷镇压反而使整个幻想乡人心惶惶，还有异议的声音也渐渐的变得微小，幻想乡曾经的欢声笑语也被可怕的沉默取代了。"
  FRA_Gensokyo.015.a: "稳定是第一要务"

  FRA_Gensokyo.016.t: "士兵哗变"
  FRA_Gensokyo.016.desc: "最坚固的堡垒往往是从内部被破坏，这话对于爱丽丝的军政府来说无比贴切，原来那些支持幻想乡共产党的选区人民，并没有被所谓人偶军团吓倒，她们掩护着她们的领导人博丽灵梦躲过了一次又一次的搜查。华扇潜伏在幽香的军队里面，用言语策反着一个又一个士兵，士兵们在见到爱丽丝人偶兵团的暴行后，内心逐渐动摇，她们觉得再这样下去，自己家人也会受到生命安全的威胁。在华扇和灵梦的里应外合的作用下，时机终于成熟，随着华扇一声：“一切权利归属无产阶级”的怒吼，幽香部分军队背叛了独裁政府，灵梦也带着早早准备好的民兵从山间田野冲了出来，至此幻想乡掀起了一场前所未有的革命风暴。"
  FRA_Gensokyo.016.a: "一切归于劳动者！"

  FRA_Gensokyo.017.t: "自由派起义"
  FRA_Gensokyo.017.desc: "魔理沙眼见着选举成功，却又被军队半路截胡，她东躲西藏，最后被灵梦手底下的共产党人救了起来，并且秘密送回了民主联盟还在苟延残喘的地区。\n现在幻想乡民主与自由全然被破坏，自己如果作为共和的捍卫者全然不作为的话，她自己都不会原谅自己，虽然她不喜欢左派的作风和思想，但是共和最大的敌人当前，加上救命之恩不得不报。魔理沙毅然决定与左派并肩作战，为了捍卫幻想乡的民主与自由，哪怕粉身碎骨！\n在军政府与左派激战正酣时，魔理沙在民主同盟动员会上说道："
  FRA_Gensokyo.017.a: "保卫共和！联合反对独裁者！"

  FRA_Gensokyo.018.t: "仍需结束之事"
  FRA_Gensokyo.018.desc: "人们满心惊诧地看着市区那两个拔地而起的巨大街垒。那是由各种东西拼凑成的庞然大物：铺路石、碎家具、砖瓦、还有尸体。枪弹打不穿它，而炮弹也只能留下一道不深不浅的疤痕。这几乎是大革命时代暴民为“混沌”制出的最为完美的造物。\n交火已持续4天时间，但看上去暴动者的物资储备仍然充足。想来也是，革命者们为了今日已筹划许久。他们为这出寻死之举已经准备了不知多少年头。不过变数出现了：忠于茨木华扇的人们——尚未逃走的官僚、不愿坐以待毙的工人、无辜的宪兵。他们嚎叫着挥舞双手跑进了暴徒的阵地，视若仇雠的他们竟又重新亲如兄弟。\n纵使暴动者不再期望明天，但那并不妨碍那些跑进街垒的，新的殉道者用抑制不住的绝望、恐惧与愤怒再一次为他们最后的墓碑添砖加瓦。他们不知道茨木华扇现在如何，也不知道博丽灵梦是不是也完蛋了，他们只想活的更久一点，他们不想像丧家犬一样莫名其妙的死去。\n就这样，跨越了国民议会与总统府，摆在政变部队面前的，只剩下这两个庞然大物，那是革命的象征，也将是混乱的休止符。\n交火在进行了4天后仍异常激烈，暴动者封死了街巷周边，对可能被突破的地方都设置了火力点。政变部队一时间对其束手无策。在两个堡垒的另一头，数千名暴动者，带着各式轻重武器，时刻准备将他们的愤怒倾泻在那条目前可以说是唯一的道路上。\n东町师只用了4个小时就攻进了国民议会，用半天时间基本肃清了总统府，但在最后一道街垒面前，这支精锐中的精锐竟然寸步难行。早苗下达了不可毁坏市区的命令，但部队拉来的步兵炮却炸不开那道庞大的第一街垒。八坂神奈子亲自指挥着突入街垒的战斗，她甚至在火线上赞叹：“连野炮都炸不开它，要是打不进去，我们就都得上天啦，哈哈！”\n刚说完一发枪弹就给她的右肩来了一下，她就这么被干倒了。"
  FRA_Gensokyo.018.a: "他妈的，我们快没有时间了！"

  FRA_Gensokyo.019.t: "战争中的选举"
  FRA_Gensokyo.019.desc: "按照宪法，共和国的换届选举理当在这个月举行。但是我们仍处于与敌国焦灼的战争状态，举行换届选举必然会对我们社会的稳定与战争热情产生影响。"
  FRA_Gensokyo.019.a: "等到和平再选举吧。"
  FRA_Gensokyo.019.b: "战争不能阻止民主。"

  FRA_Gensokyo.020.t: "换届选举"
  FRA_Gensokyo.020.desc: "换届选举如期而至，毫无疑问，我们的执政党赢得了连任！"
  FRA_Gensokyo.020.a: "前进！"

  FRA_Gensokyo.021.t: "幻想乡联盟"
  FRA_Gensokyo.021.desc: "我们将在我们的非洲殖民地开始公投，决定她们的去留。"
  FRA_Gensokyo.021.a: "开始投票！"

  FRA_Gensokyo.022.t: "最长工时"
  FRA_Gensokyo.022.desc: "为了更好地保障我们工人的权益，规定了一个最长工时是必要的。"
  FRA_Gensokyo.022.a: "10小时"
  FRA_Gensokyo.022.b: "8小时"
  FRA_Gensokyo.022.c: "6小时"

  FRA_Gensokyo.023.t: "最低工资"
  FRA_Gensokyo.023.desc: "为了更好地保障我们工人的权益，规定了一个最低工资是必要的。"
  FRA_Gensokyo.023.a: "勉强温饱"
  FRA_Gensokyo.023.b: "不愁衣食"
  FRA_Gensokyo.023.c: "略有富余"

  FRA_Gensokyo.024.t: "密谋"
  FRA_Gensokyo.024.desc: "天色似暗未暗，酒店的走廊间，电灯微微的散出光亮。外面的喧嚣声仍在，但正慢慢沉寂。乱民们从她们亲手筑起的雉堞中爬出来回了家。执法者堪堪渡过可能手沾血迹的又一天。人间之里默默注视着，看着它伟大的人民在暴动的空气中窒息、翻滚。看着那庞然大物肆意挥甩着泥泞。\n万幸的是，链接着人里各地的要道都还未筑起街垒，这座城市的血液尚在流淌。一如往日，信心满满的社民党自己阻滞着劳工要求权利的义愤。她们正揣揣不安地站在暴民的对立面，用逝者的理想说服着自己。现在是决战的时候了！为了一个更美好的幻想乡！她们还在幻想什么呢？让她们仍然要去与汹汹的民意为敌？不过天真如此，她们也不免对东风谷早苗的归来感到忌惮。\n在早苗的房间里，光亮的黯淡比门外更甚，她布置好了祭器，默默跪坐，双手合十，一整天都在为那位已逝之人默哀。这一天，酒店外不少人等候着这位陆军元帅与神社领袖的现身，但副官均谢绝了她们的会面请求。随行的卫队驱散了人群与密探，夜色渐浓，此刻的丽兹酒店正宛如一座孤岛。偶有几只蝙蝠飞进巢穴，也难扰这长久的静谧。\n最后一位赶到的是洩矢诹访子，在她进入房间之时以是深夜。大楼那原本稍显黯淡的灯光此刻已然通明。当她按计划敲了三下房门，又一位将军，爱丽丝·玛格特罗伊德，悄悄将门缝探开，畏畏缩缩地四处张望，随后将前者拉进门隙。"
  FRA_Gensokyo.024.a: "你差点坏了大事，现在已是箭在弦上之时"

  FRA_Gensokyo.025.t: "处置方案"
  FRA_Gensokyo.025.desc: "我们已经国有化了人里银行，对于它的处置，我们可以选择政府雇员经营，这将挽回一些资本家们对我们的好感，但是联盟里的激进党派必然会不满；或者我们也可以听从激进党派的意见，将银行资产转移到国家银行。"
  FRA_Gensokyo.025.a: "政府雇员经营"
  FRA_Gensokyo.025.b: "资金转移至国家银行"

  FRA_Gensokyo.026.t: "过激的宣传运动招致谴责"
  FRA_Gensokyo.026.desc: ""
  FRA_Gensokyo.026.a: "呜呜呜~"

  FRA_Gensokyo.027.t: "[FRA.Getname]邀请我们谈判"
  FRA_Gensokyo.027.desc: "有着共同的祖先与文化，[FRA.Getname]号召我们放下武器、放下仇恨。欧洲的人类与妖族已经生活得十分融洽了，她们承诺她们将欢迎我们这些海外漂流了数百年的游子回家。"
  FRA_Gensokyo.027.a: "准备飞机，马上飞抵百慕大。"
  FRA_Gensokyo.027.b: "爬。"

  FRA_Gensokyo.028.t: "[NFA.Getname]同意了"
  FRA_Gensokyo.028.desc: "[NFA.Getname]同意了，[NFA.Getname]的法裔人口将会获得无条件移民我们的机会，而两国就此放下仇恨，结为盟国。"
  FRA_Gensokyo.028.a: "非常好提案，使我三色旗旋转。"

  FRA_Gensokyo.029.t: "[FROM.Getname]邀请我们组建欧洲共同体"
  FRA_Gensokyo.029.desc: ""
  FRA_Gensokyo.029.a: "好"
  FRA_Gensokyo.029.b: "爬"

  FRA_Gensokyo.030.t: "[FROM.Getname]同意了"
  FRA_Gensokyo.030.desc: ""
  FRA_Gensokyo.030.a: "太好了"

  FRA_Gensokyo.031.t: "[FROM.Getname]背叛盟约"
  FRA_Gensokyo.031.desc: "[FROM.Getname]背叛盟约，离开了我们的阵营。"
  FRA_Gensokyo.031.a: "这些混蛋"

  FRA_Gensokyo.032.t: "皇帝的新头像"
  FRA_Gensokyo.032.desc: ""
  FRA_Gensokyo.032.a: "军帽"
  FRA_Gensokyo.032.b: "月桂冠"
  FRA_Sanae_Laurel_Leaf_tt: "\n--------------------------------\n\n\n\n\n\n\n£FRA_Sanae_Laurel_Leaf\n\n\n\n\n\n\n\n--------------------------------"
  FRA_Sanae_Bonaparte_tt: "\n--------------------------------\n\n\n\n\n\n\n£FRA_Sanae_Bonaparte\n\n\n\n\n\n\n\n--------------------------------"

  FRA_Gensokyo.033.t: "早苗加冕"
  FRA_Gensokyo.033.desc: "近日，幻想乡共和国通过全民公投，正式将幻想乡共和国改为换幻想乡帝国，东风谷早苗为全幻想乡民族的皇帝，称早苗一世。\n\n皇帝在扈从护卫下，乘坐由八匹白马牵引的马车，前往守矢神社。教皇、八坂神奈子、洩矢诹访子及重要官员都在大教堂内迎候。典礼的装饰、将军的勋章都是查理曼风格的。早苗身着绛红皇袍，（按照前王朝传统，国王只有在接受祝圣后才能穿上它。）她头戴金质罗马式的桂冠，手持权杖和正义之手，象征拥有皇帝的全权。这一切，让人联想到的是查理大帝而非幻想乡国王。早苗登上教堂最深处的宝座。之后，在圣职人员的引领下，她来到祭台，教皇为其行傅油礼。\n\n早苗从八坂神奈子手中接过了本该由教皇为她戴上的冠冕，她为自己带上了这顶象征着权力的冠冕，以示权力出于自身。接着是加冕誓言。皇帝发誓“维护共和国领土的完整，尊重并使人尊重教务专约和宗教仪式自由，权利平等，政治自由和公民自由，国有财产的出售的不可撤销；只依法征税；维护荣誉军团；只为幻想乡人民的利益、幸福和荣耀而统治。”"
  FRA_Gensokyo.033.a: "为陛下三呼万岁！"

  FRA_Gensokyo.034.t: "加入反幻想乡包围网？"
  FRA_Gensokyo.034.desc: "[FRA.Getname]的扩张已经到了我们无法忽视的地步，这就是明目张胆的对和平的严重破坏行为。"
  FRA_Gensokyo.034.a: "我们必须遏制幻想乡"
  FRA_Gensokyo.034.b: "我们还不想和她们交恶"

  FRA_Gensokyo.037.t: "一场晚宴"
  FRA_Gensokyo.037.desc: "艾莉斯作为东风谷元帅“新自由”政策第一批受惠的“新贵族”，已经参加了数场规模庞大的晚宴，但是如今天这般大的规模还是她第一次参加，整个人间之里，哦不，可以说整个幻想乡的有头有脸的人物都来到了这场晚宴，甚至艾莉斯还看到了几个圣杯人与苏联人。\n正当艾莉斯思考这场晚宴的目的究竟是什么时，东风谷早苗和她的随从推门走入了大厅之中。艾莉斯以前只在远处看过了元帅的身影，今天还是她第一次在如此近的距离面见她的偶像。艾莉斯的举着酒杯的手开始不自觉的发抖，面色染上绯红。\n在不知过了多久之后，艾莉斯为自己面前的酒杯斟上了半杯香槟，走向了东风谷早苗。当艾莉斯逐渐靠近，八坂神奈子走向了会场上的舞台，大声宣布：\n“元帅为我们祖国立下了前无古人的丰功伟绩，我在此提名早苗陛下加冕为我们幻想乡的皇帝！”\n在起哄中，早苗露出了一幅为难的样子回答“我一个小小的巫女，怎么能当幻想乡的皇帝呢。”\n在几次的推辞之后，早苗在掌声中，走向了舞台，答应这个请求。"
  FRA_Gensokyo.037.a: "艾莉斯手中的酒杯滑落，她开始不自觉的鼓掌。"

  FRA_Gensokyo.038.t: "最后的革命"
  FRA_Gensokyo.038.desc: "老旧的木门被推开，薇薇安走入，将厚重的大衣脱下，来到逼仄的房间里，将今日按从人间之里收集到的报纸与情报放在桌子上。\n“该死的东风谷，又有几个革命据点失去联系了。”薇薇安一边吐槽一边猛喝了一口桌上的酒。薇薇安本来并不喝酒，但是在这种艰难的岁月里，她也逐渐习惯了喝酒的感觉。\n“薇薇安，少喝些，今晚还有工作要做。”赛琳把薇薇安手里的酒杯按下，用眼睛指了指一旁的印刷机，“我们要尽快印刷出更多的报纸，必须让全国人民都知道这个暴君的丑陋。”\n薇薇安看了眼眼前的人，又重新振作起来。她不经想起了以前一起批判社民党软弱政策的日子，果然那些社民党都不是好东西，反动武装来了第一批倒戈的就是她们。\n薇薇安又喝了一口酒，来到了印刷机边，准备开始工作，正当她坐下，赛琳突然安静，举手示意薇薇安注意。随后门外响起了一阵脚步声......\n咚--咚--咚--\n在脚步声逐渐平息后，赛琳和薇薇安刚刚松一口气，突然木门被一脚踹开，漆黑的枪口对准了室内的两人......"
  FRA_Gensokyo.038.a: "报告，已查禁非法刊物印刷点。"

  FRA_Gensokyo.039.t: "[GetYear]年党代表大会"
  FRA_Gensokyo.039.desc: ""
  FRA_Gensokyo.039.a: "茨木华扇连任！"
  FRA_Gensokyo.039.b: "博丽灵梦众望所归！"
  FRA_Gensokyo.039.c: "犬走椛赢得选举！"
  FRA_Gensokyo.039.d: "冈崎梦美弯道超车！"

  FRA_Gensokyo.040.t: "目眩之光"
  FRA_Gensokyo.040.desc: "“诸位，计划有变，原来我们的计划是先集中起总参谋部的人员，但是首都局势恶化的太快，暴动已经是板上钉钉的事情了。”早苗仍然跪坐在哪里，在她的背后，绵月丰姬临时用笔在地板上划出整个人里的草图，在狭小的客房内，几位将军围坐一团，场景看着实在颇为滑稽。\n“如果不出意外，三町步兵旅在2小时后就能够抵达作战位置，但是，现在我们等不起了，要是暴动发生一切都会功亏一篑。”说着，八坂神奈子抬手一划，将重点放在了中心。\n“现在，全城警察和中央步兵师都在准备应对可能的暴动，这就是机会，如果我们能此为借口让中央师出动，兄弟部队就能直接突入市区，制压警备处和国民议会。议会指挥不动部队，只要尽快让三町师掌控国防部与议会。社民党人也好自由党人也罢，她们便调动不了一兵一卒，事则成矣！”\n“直接突入市区？这分明是在告诉部下这是政变！我们无法避免交火！”绵月依姬仍忧心忡忡地提出了自己的疑虑。\n“顾不上掩饰了，暴民也好，同僚也罢，大革命时妖怪加上人类怎么也都牺牲了二十万人，我们也该做好这样的觉悟吧。爱丽丝将军，就由你的人偶第一师团打头阵。现在国家昏乱至此，也该有人来收拾残局了，不是吗！？”\n几位将军面面相觑，无人再有表示。\n早苗直起身子，她伸了伸懒腰，只此动静，诸位便忙慌转过身来，她们明白最关键的时刻即将来临。\n面对着这几幅各不相同的——兴奋的、忧虑的、若有所思的面孔。早苗不禁嘿嘿笑出声来。“那位确是幻想乡的大英雄，没有她就没有今天的幻想乡——”\n她又打了个哈欠，揉了揉眼睛，像是被强光惹的眩目。待到双眼重又睁开，那目光竟现出几分狰狞。"
  FRA_Gensokyo.040.a: "“只可惜在世之时，理应对其身后之事，更为深思熟虑才是。”"

  FRA_Gensokyo.041.t: "第二天"
  FRA_Gensokyo.041.desc: "经历了领袖猝薨与小丑跳梁，挣扎于艰难岁月，又在一场失败的革命中心惊胆战。这就是第二天被暖煦的晨光所照耀着的人间之里，或者说幻想乡——或者说法兰西。\n第二天，面对暴动后的烂摊子，沉默的人们照常上班，工厂慢慢响起往日的轰鸣声，这个城市似连伤口都不愿舔舐——她重又复苏。\n这样的沉默对国家来说是可怕的，它所代表的不是反抗，而是厌倦。\n这是一种难以妄下定义的中间阶段：衰退了的英雄主义、被满足的野心、对“蜷缩”的渴望。\n一言以蔽之，对于现在的幻想乡而言，便是：要过安生的日子了。\n从工人阶级中脱颖而出的弄潮儿和高呼“自由”的新贵都没能及时意识到这一点，一边将人民当作理所当然的支持者，另一边则将其当作权力魔术的看客。她们自认为不可被替代，自认为这个国家的未来将是非黑即白。她们孤注一掷，大吼一声跳到幻想乡的跟前，“庄严”宣布幻想乡的未来。这才是《新劳动法》这出闹剧的实质。\n所以她们垮了，垮的合理，垮的彻底。\n在尚未被打扫干净的战场之上，在议会的一地鸡毛之上，那位即将让整个幻想乡的命运置于其台前的那位元帅，仍然继续着她的守灵。但元帅从不相信灵魂。而她所思考的问题百年前便以有智者做过诘问。\n“在疲乏的人民要求暂歇之时，她们也要求既成事实亦得到保证。保证对于事实，正如人民对于休息，她们都是同一回事。”"
  FRA_Gensokyo.041.a: "现在，是机灵人的舞台。"

  FRA_Gensokyo.042.t: "凯旋门一日"
  FRA_Gensokyo.042.desc: "阿梅莉是首都人里高等师范学校的一名学生，今天她和同学们约定好一起前往凯旋门广场参与对伟大领袖稗田阿求的纪念活动。\n阿梅莉带着自己写的挽联和花束来到广场时，广场里已经聚集了相当数量的大学生，大家为领袖的遗像献上花束、轮流朗诵自己的写的挽联、诗词。每个人都在以自己的方式纪念这位带领祖国走向民主化的英雄。\n听着前面同学的一句句的真情流露，阿梅莉已经泪水浸润了眼眶。当轮到她朗诵时，她已经泣不成声，即使支支吾吾，她还是坚持读完了自己写的挽联，可以说，稗田阿求就是阿梅莉以及和她一样的无数幻想乡人的偶像。\n临近旁晚，曾经稗田阿求的副手雾雨魔理沙亲自来到了凯旋门，慰问了当场的学生们，并进行了对稗田阿求的赞美和对学生们的夸奖的讲话。"
  FRA_Gensokyo.042.a: "“我想，这是我的责任。”"

  FRA_Gensokyo.043.t: "人间之里在下雨"
  FRA_Gensokyo.043.desc: "在总统府的广播里传来茨木华扇要求她的支持者向军队投降的消息之时，屠杀已经接近尾声。\n所谓的“屠杀”在某种程度上其实是双向的，一发迫击炮弹就能夺走数十个“平民百姓”的生命，可状况没有发生丝毫转变：一支又一支突击小队突入街垒，随后在密集的枪炮面前丢下几十具尸体逃窜回来。\n接任街垒围攻工作的洩矢诹访子不再试图取巧，她命令麾下部队对街垒发动总攻，也许是革命者们的弹药终于见底，在街道被尸体塞满之后，这一次师团终于爬上了街垒，但暴动方的反击也开始变得不计代价，尸体攀附上了那道石墙，以供后来者攀登。\n下午3时，一支猎兵排用刺刀夺取了第一层街垒，东町师团自此终于倾巢突入街巷。\n很明显洩矢诹访子也开始犯前人的错误，她亲自带领着酣战的军士突入阵地，街垒里的混战似乎混淆了兵士与起义者的面容，在一片喊杀声中，唯有一面残破且沾血的幻想乡国旗仍然在街垒的最深处飘扬。\n暴动终于崩溃了，街垒进入最后的时刻。\n洩矢诹访子试图冲进起义者们最后的阵地，但副官与兵士们拉住了她。“长官！长官！结束了！我们赢了！我们拿下街垒了！战斗结束了！”\n“赢个屁！”愤怒的洩矢诹访子将拦住她的手甩开，她将手指向那面仍然在酒馆上空飘扬的旗帜，“那面旗帜不倒，这一战就还未分明！”\n但也就在这时，旗杆被突然砍断，旗子落了下去。\n放下了刺刀，士兵们难得的冷静了下来，他们茫然的看着刚刚被他们杀死的暴民，没人给他们下达后续命令。有心者还在搜刮着，看看也没有值得收起的战利品，但更多人在被他们攻占的阵地里手足无措。\n突然，一个士兵叫起来，豆大的雨水砸到了他脸上，顷刻间人间之里便下起了大雨。"
  FRA_Gensokyo.043.a: "理想、希望、葡萄酒，就这么被冲入黑暗之中。"

  FRA_Gensokyo.044.t: "决意"
  FRA_Gensokyo.044.desc: "在爱丽舍宫中的房间中，茨木华扇盯着手中的演讲稿，紧张地不停张望。人民阵线在第一次选举就取得了胜利，这出乎了很多人的预料，包括茨木华扇自己。博丽灵梦上前，拍了拍华扇的肩膀，以示安慰。\n\n“到点了”，秘书走进来通知房间中的二人。\n\n茨木华扇走在通道中，她从来没感觉这通道如此的长。虽然此前一直从事着政党工作，但是这是她第一次作为国家总统的身份发表讲话，她不知道她能否做好这个职务。不知不觉中，她已经走到了门边，她忐忑地推开了门，她听到的是--人民的呼声。"
  FRA_Gensokyo.044.a: "茨木华扇抬起头，丢掉了手中的演讲稿。"

  FRA_Gensokyo.045.t: "会面"
  FRA_Gensokyo.045.desc: "“总统阁下，不知您找到我们是什么意思。”犬走椛坐在座位上，抬眼看着在座的人--有最近声名鹊起的“教授”冈崎梦美、共产党领袖博丽灵梦甚至还有第三国际的代表，犬走椛思索了一会儿，对，她叫薇洛，当然，还有主位上的社民党领袖、人民阵线领袖和幻想乡共和国的总统茨木华扇。\n\n茨木华扇抬手示意安静：“诸位，我有一个大胆的想法，（--数据销毁--）”\n\n在座的无一不露出震惊的脸色，也明白了莫斯科来人的目的。在静默中，犬走椛率先举起手，我们将无条件支持此次行动；随后是第二个、第三个。"
  FRA_Gensokyo.045.a: "诸位，人民的未来现在就掌握在我们手中。"

  FRA_Gensokyo.046.t: "《所有制改革法案》"
  FRA_Gensokyo.046.desc: "看着《所有制改革法案》，中右翼政党的议员愤怒地将手中的复印件摔在桌上，“这简直是胡闹！”她们质问着台上的茨木华扇，已经全然不顾议会的秩序与规则了。\n\n“诸位，请你们冷静一下，免得你们不知道，我可要提醒诸位一句，红军和工人们已经包围了这座大楼。”茨木华扇没有波澜地说出这番话，但是刚刚还在叫嚣的议员都安静了下来，只剩的零星的几个还在反对，但是冲进来的士兵很快让她们闭了嘴。"
  FRA_Gensokyo.046.a: "“现在，表决开始。”"

  FRA_Gensokyo.047.t: "藤原妹红的教育方向"
  FRA_Gensokyo.047.desc: ""
  FRA_Gensokyo.047.a: "专注政治"
  FRA_Gensokyo.047.b: "专注军事"

  FRA_Gensokyo.048.t: "雾雨魔理沙的三箭矢"
  FRA_Gensokyo.048.desc: "一、指向共产主义与无政府主义\n共和国必须杜绝一切不稳定与威胁民主的因素，在这点上共产主义者的威胁与法西斯无异，故第一根箭矢必须用于消灭左翼匪徒，为了民主与自由。同时，左翼当中也有不少温和派，我们应该积极地与她们寻求合作。\n\n二、指向独裁者\n军队中最容易诞生野心家，共和国的民主果实决不能被军队的野心家窃取，故第二根箭矢用于消灭独裁暴君，维持军队的忠诚与民主制度的稳定。\n\n三、指向法西斯主义\n法西斯主义将毫无疑问地破坏民主制度并将国家引向战争，同时破坏良好的世界市场环境，故第三根箭矢用于消灭法西斯主义，我们必须维持自由民主的普世价值，不能被狭隘的民族主义控制。"
  FRA_Gensokyo.048.a: "共和万岁！民主万岁！"

  FRA_Gensokyo.049.t: "稗田阿求的遗体问题"
  FRA_Gensokyo.049.desc: "糟糕的事发生了。2月5日0时10分，在两次心脏病发作后，幻想乡共和国的伟大领袖和导师，稗田阿求总统去世了，享年30岁。尽管人民和国家还沉浸在悲伤中，我们仍需召集治丧委员会，决定如何送总统最后一程。"
  FRA_Gensokyo.049.a: "按照国母的意愿将她火化并建立一个纪念碑。"
  FRA_Gensokyo.049.b: "封入水晶棺，在凯旋门广场上建立一个纪念堂。"

  FRA_Gensokyo.050.t: "葬礼"
  FRA_Gensokyo.050.desc: "在魔理沙的演讲后，我们将国母的骨灰封入了广场上的纪念碑之内，共和国进入了为期3天的全国悼念活动。"
  FRA_Gensokyo.050.a: "共和国迎来了新时代。"

  FRA_Gensokyo.051.t: "葬礼"
  FRA_Gensokyo.051.desc: "在魔理沙的演讲后，我们将国母的遗体送入了广场上的纪念堂之内，共和国进入了为期3天的全国悼念活动。"
  FRA_Gensokyo.051.a: "共和国迎来了新时代。"

  FRA_Gensokyo.052.t: "一场小聚"
  FRA_Gensokyo.052.desc: "“烦请阁下浅酌一口，这是去年下来的波尔多，现在打开它正是时候。”德尔克为坐在首席的慧音倒了一杯酒，“阁下操劳，又在百忙之中抽出时间来召我等前来商议国事，鄙人不胜惶恐。”作为engie公司的董事长，这次的会面就是由他一手筹备的。\n他上来便是这般殷勤，倒使得慧音有些不好意思，她轻声回应：“大家都是朋友，别只给我一人倒酒。”她热切的望向台前的另外几位宾客。可是没人回应她的话语。\n雷诺汽车公司的老板路易只向面对他们的德尔克摆了摆手，而最后一位客人，幻想乡石油公司的总裁雷蒙德只是起身，礼貌的拿过葡萄酒瓶，为自己添了半杯。\n这近乎无礼，慧音只觉得气血在上涌，她和幕僚们盘算过这次会面要怎么与这些大腹便便的实业家打交道，不过看上去似乎并没有能够友善交流的空间。\n良久，慧音还是率先开了口，“诸位先生，这一次本人请诸位前来，是想讨论一下我们之间合作关系是否有着进一步的空间。”\n三位大佬互相对视了一眼，似乎都在组织措辞。这让慧音感觉很不舒服，这给她一种他们已经相互勾结的感觉。\n“为什么要这么说，这种话听着就像是，我们之间的友谊还不够深厚似的。”大腹便便的路易说话缓慢且浑浊，这让他的声音显得有些诡异。“我们相信阁下的能力，我们花了大价钱让你和你的妖精朋友达成你们的目的——哦，那位河城小姐甚至不用来这里和我们一起浪费时间，看上去你与她的合作关系比我们更加可靠。”\n“河童重工愿意协助我们，可是这不足以让政府渡过……”\n“所以来找我们，让我们继续为你出钱？在我们自己都一团糟的时候？”\n路易用手狠狠了磕了下桌子给他们双方的关系下了个简洁的定义。“你和你的人把我们都耍了。”\n“这是信口开河！我不能接受…”慧音的辩解被粗暴的打断"
  FRA_Gensokyo.052.a: "我从一开始就说过不要他妈的耍我们"

  FRA_Gensokyo.053.t: "一场交易"
  FRA_Gensokyo.053.desc: "慧音紧紧攥着椅沿，但终究不敢发作。\n“大家都是一条绳上的蚂蚱，没必要把话说的这么死。先生”在气氛无比紧张的时刻，还是这场会面的操办者，engie董事长德克出来打了个圆场。“败火可解决不了问题，各位，慧音小姐的诚意有目共睹，她来找我们商议事情一定有她的考量”\n路易点点头，没再说什么，慢慢的坐回位子，他的戏已经唱完了。\n“但是……”德克的眼珠子转了一转，直了直身子微微前倾，用真诚的语气解释他们遇到的困难。“事情已经恶化到超出我们的想象了，那位路易先生这么生气也是情有可原的——现在他手下的工厂有好几座在闹罢工，军警都无动于衷。我们的生意可都不景气，现在不比之前……整个人里差不多都快完蛋了，很多企业差一步就都得倒掉，贵政府却还在为他们发一些无关急要的补贴，让他们吊着一口气。”话说到这里没有再继续，德尔克的眼珠子又转了转，似乎在等待总统阁下作何反应。\n“你是说，希望政府将这些补贴给你们？我们得把钱用在刀刃上。”\n到这,这位绅士可掬的笑容终于变得有点僵硬，他不易察觉的啧了一口，遗憾的靠在椅子上。似乎在琢磨着这位女士是否在避开话题。“我们的意思是，我们没有能力继续陪阁下做无谓的合作。”\n“而我们现在就需要阁下的回报”最后一位，也是年纪最大的雷蒙德突然沉声说道。\n这位老人为这场会面定下了主基调，他撑着桌子起身，一字一句的提出了他的要求。“幻想乡的每一片城区，每一处工厂，都要处于贵党的治理之下……我们所有人的治理之下。”\n“你是什么意思？”慧音吞了口口水。\n“我们要那些倒闭的工厂——我们也要统治这里！”路易适时地开始嚷嚷。\n“休要胡说——小姐，但至少你得开始给我们分杯羹了。”言尽于此，德克倒也懒得再打圆场。"
  FRA_Gensokyo.053.a: "你应该不会是现在才明白吧，你本就是在和魔鬼做交易。"

  FRA_Gensokyo.054.t: "光荣与梦想"
  FRA_Gensokyo.054.desc: "“来一杯吗？”似乎又有人在邀请他\n他朝着不知什么地方摆摆手，在这家酒馆已经有好几个人殷勤的要请他来一杯了。但他却始终无动于衷。倒也不是想要扫别人的兴，他只觉得这个地方的喧闹让他感到陌生，陌生地让他开始无法对昨日珍酿下嘴。\n当然，这绝不是说以往这里并非喧闹之地，只是在他的记忆里，这家酒馆还没有那么多稀里糊涂的灯具，也没有在酒馆中央高歌的女郎。\n在他的印象里，酒馆是吵闹声与钢琴声一齐喧闹的地方，听同僚说，乐队这种东西曾经只出现在他们连进都进不去的高级咖啡馆里——不过在他回来的时候，后者倒已经绝迹了。\n他还记得在战争最艰难的岁月里，他从红魔馆前线退下来的时候，这里多的是号苦的人们，大家歌唱着自己的不幸，几位青楼女子游走在人群中间，时不时的还会高声哼唱几首滑稽小调。他记得很清楚，在失去一条腿之后，那是他生命中最艰难的时期。在人里这家随处可见的小酒馆里，他能见到各种各样的人：因故退役的老残废、兜里有几个小钱的富家公子、还有不少野蛮的工厂工人。这些不同但又相同的不幸者曾吼叫着将他托举出他人生中最为低迷的时刻。支撑着他一瘸一拐的离开这个夺去他一条腿的国度。\n又一场大战之后，因祸得福，只有一条腿的他避开了轰炸与炮火，从东方又一瘸一拐的走回了他脑海里的法兰西——我是说幻想乡。他显然没有对时代的变化做好心理准备。\n红的，绿的，黄的，三种颜色互相变化，像条银蛇一萦绕在他的眼前。这个地方只要稍稍打量就会发现它的布局与十年前并无二致，只是多了好几台霓虹灯，多了好几个歌舞女郎，还有一台电视，上面有个他不认识的日本女人在那载歌载舞。\n这个地方已不再存在不幸者，这地方的人们大多欢笑着，嘲笑着，拿明天的运命渡过今宵良夜。"
  FRA_Gensokyo.054.a: "到底还是没有举起酒杯，他粗暴地撞开扭捏的人群，摔门而去。"

  FRA_Gensokyo.055.t: "push it to the limit！"
  FRA_Gensokyo.055.desc: "“哈哈！朋友，快来请坐。”总统府邸里，路易大张双臂，热情的欢迎德尔克的到来，这家伙算是迟到了，不过这不成问题。慧音预定在两个小时之后与这几位大佬展开会谈，但政府上下不会有人告诉她这群企业家已经在这里等候多时。\n在几位的会谈开始之前，雷蒙德示意在室内随侍的两名警卫离场，虽说担心他们有所图谋的慧音几次命令属下监视他们，但没人敢去违背这几位的意志，他们很清楚一直以来是谁在发给他们工资。随后他轻轻摸了摸桌底，便将这周装在此处的窃听器摸了出来。这也同样是情报部门里的自己人告知他们的。“那个小姑娘也是蠢的可以”雷蒙德嘿嘿的笑出了声，听着有点恶心。\n“诸位，应该都记得吧，那位总统上周向国会提交的动议”这位年长者紧接着说。\n“记得，那小姑娘看着文静，说到底也是个战争贩子嘛，哈哈，还什么“再殖民运动”，哈哈。”路易哈哈笑着，但似乎还有什么话没有说出口。\n  德尔克皱了皱眉，“不管怎么说，我都不认为这是什么好事。我们上个星期才达成过共识，不是吗，没有必要支持这么一场战争。”\n“那是上个星期的事情了”路易把叼在嘴上的烟卷抽了下来，另一只手拿出来一张名片。\n“你们知道魔法少女吗？”德尔克点点头。“在南美的魔法少女有这么一种特殊的能力，在他们与魔女，还是说魔兽那种杂七杂八的东西反正我不清楚，与他们战斗之后会产生一种叫做“悲叹之种”的原料。”\n“继续。”德尔克点起根烟，示意路易继续说下去。“我去了一趟南美，和几位当地的毒枭打了个照面，他们有专门做在魔法少女的眼皮子底下里面偷取这些东西的生意。只要把悲叹之种里面的东西渗进原料里面……它可让叶子的价钱翻上一倍，一倍！”他眉飞色舞的打着手势向诸位介绍着。“可是，这和我们有什么关系，我们又不做这种生意。”德尔克疑惑的看向路易，但雷蒙德却随之开口。“正是因为如此，从南美到佛罗里达的这条路线相当受人青睐，在三四年，上百万吨被浸润过绝望的叶子被运到法国属地，就算是我是想象不出来还有什么比这更暴利的了。但是，从三七年开始，战争阻断了这条路线，现在，巴拿马已经不能用了，魔法少女们请求北美政府严查南海的走私船只，假以时日，南美恐怕就要成为一潭死水了。”\n“所以他们最后找上了我们？”德尔克试探着问。“严格意义上来说，是我们找上了他，他们承诺，只要解决中间环节，他们可以在他们的生意里每船给我们分5%的利润”\n“不不不，这也太蠢了，我们可没办法解决别国的海警队，这也是赔本买卖，我们又不能拿去……”德尔克想到了什么，他猛吸了一卷烟，用烟雾来掩盖自己正在进行的计算。他开窍了。“我们不用解决美洲的海警队，我们解决美洲就行了。等到那时候，你觉得那群墨西哥佬会找谁来卖这些东西？”路易将烟卷砸进烟灰缸里。\n德尔克折断了手中还未燃尽的烟，也砸进烟灰缸里。“我说过，慧音小姐的想法太过荒谬，这场战争没有任何打起来的必要……”"
  FRA_Gensokyo.055.a: "但说到底，这他妈也是上个星期的事情了"

  FRA_Gensokyo.056.t: "雾雨魔理沙总统的就职典礼"
  FRA_Gensokyo.056.desc: "“如果现在有任何一个人问我，‘魔理沙女士，你和爱丽丝的漫漫征程何时才会告终？’。对此，我的回答是:只要还有忠诚正直的幻想乡公民仍然遭受不公不义的野蛮迫害，只要社会正义仍然是虚无缥缈的空中楼阁，我们就别无选择，唯有继续前进！\n“倘若还有勤恳工作，默默奉献的公民难觅栖身之所，我们就绝不会满足。倘若公平正义的覆盖范围仅仅是从人间之里市中心扩大到首都圈的边界，我们就绝不会满足。倘若有一位妖怪不能参加选举，还有一位认为她的投票无济于事，我们就绝不会满足。倘若木之本樱或莉莎的激进思想还在荼毒这片土地，我们就绝不会满足。不！我们现在并不满足，我们将来也不会满足！除非正义如江海中那汹涌澎湃的波涛，荡涤一切罪恶，还幻想乡一个朗朗乾坤！\n“我深知来参加典礼的诸位中有过去饱尝苦难，遍历辛酸之人，但我绝不会用空洞的话语来哄骗你们！相反的，我谨代表本届内阁在此庄严起誓：\n“只要我还在任一天，即使我的生命只剩下一小时，哪怕叛贼距离我的办公室只有最后一分钟路程。在这仅有的时间里，幻想乡也仍然会是一个民有，民治，民享的自由国度！”\n\n台下掌声雷动。"
  FRA_Gensokyo.056.a: "向统帅致敬！"

  FRA_Gensokyo.057.t: "第200号总统令"
  FRA_Gensokyo.057.desc: "鉴于以苏维埃联盟为代表的国家持续在幻想乡共和国境内策动阴谋颠覆活动，为防止对国家民主体制的破坏，我现正式授权查禁幻想乡共和国境内一切涉嫌宣传共产主义等极左翼意识形态的媒体及出版物，并将涉事者驱逐出境。\n我在此进一步授权并指示司法部长与对外情报和反间谍局局长采取他们认为适当的其他措施，以确保各大区，单省大区，海外行政区及海外属地遵守本总统令。\n我在此进一步授权并指示所有行政部门、独立机构和共和国其他机构协助司法部长与对外情报和反间谍局局长执行本总统令。\n本总统令不得被解释为以任何方式限制或修改幻想乡共和国宪法授予幻想乡共和国总统与总理领导的内阁之权力。"
  FRA_Gensokyo.057.a: "雾雨魔理沙 即刻生效"

  FRA_Gensokyo.058.t: "会见博丽灵梦"
  FRA_Gensokyo.058.desc: "雾雨魔理沙总统抬起头，面无表情地看着桌子对面那位共产主义分子。“别看博丽灵梦现在一副人畜无害的样子，只要时机已到，她完全可以组织起一帮信众，再拉上犬走椛和射命丸文之流搞个什么‘总罢工’，顺便摧毁幻想乡的一切——尤其是国母稗田阿求亲自奠基的民主传统。”魔理沙对自己如是说。然后，她微微倾身，直视着灵梦，告诉她自己会盯紧她和她那群红的跟狒狒屁股似的跟屁虫。一听这话，灵梦好像挨了一记巴掌。她的紧张之情溢于言表，也随之开始滑稽地结巴起来。\n“但——但——是，我是说，看在阿求和爱丽丝的份上，魔理沙你——要——”灵梦吞吞吐吐地说。魔理沙淡定地从旁拿起一支笔把玩起来，但她始终与灵梦四目相对。\n“听着，”听到魔理沙那处变不惊的语调，灵梦不得不安静下来，“我不是威权主义者，但我也绝对不是一个娇滴滴的小女生。我知道你们确实想在建制框架内让幻想乡变得更好，因此我个人支持你们的一些想法，议会同样也容得下你们。但只要你们胆敢打破这框架，干些出格的事情，我就会像处理那帮极左分子一样对你们采取行动。你明白吗？”\n灵梦镇定下来，又开始极其小心地说起话：“魔理沙，我理解你——”\n魔理沙把笔放下，厉声说道：“博丽灵梦，我想对你说的就是，你和你那帮人要注意点！幻想乡固然会为你们留出一席之地，但对于你们中的危险分子，我也不会手下留情！”\n灵梦心中顿生厌恶，脸色也变得很难看。她从椅子上站了起来，“既然你甚至做不到听我说完，那我也不继续干坐在这里受罪了。雾雨魔理沙，你给我记住，你能坐上这个位子不过是因为你踩着阿求用自己生命铸就的垫脚石!”语毕，她冷冷地转过身，大步向门口走去。\n“记得去告诉你的跟屁虫们过得不要太滋润了！”\n听了这话的灵梦头也不回地摔门而去，魔理沙则大笑起来。"
  FRA_Gensokyo.058.a: "“哈！祝你们好运！”"

  FRA_Gensokyo.059.t: "雾雨魔理沙致人间之里大区全体公民的一封贺信"
  FRA_Gensokyo.059.desc: "听闻人间之里大区在打击极右翼分子和捍卫民主传统方面取得了优异成绩，我感到无比振奋和欣慰。因此，请允许我在此时此刻代表本届内阁，向人间之里的全体公民送上最诚挚的祝贺！你们的辛劳与汗水，不仅表现了对民主自由的坚定信念，更为整个共和国树立了光辉的榜样。\n在过去的一段时间里，幻想乡虽外有忧患，内有隐疾，但你们仍然积极配合行政与司法部门，自发采取了一系列有力措施来保障人间之里的社会和谐与公平正义。不论是积极推动完善相关法律法规从而铲除致使极端主义思想在社会中潜滋暗长的土壤，还是自发监督右翼组织的活动以增强人们对右翼思潮的警惕性，无不大大促进了社会的团结稳定。你们的勇气和智慧是幻想乡的骄傲，更是自由党，爱丽丝和我大步前进的动力所在。\n有鉴于此，我宣布正式授予人间之里大区“模范自由州”的光荣称号。这不仅是对人间之里大区的褒奖，更是对大区全体公民在民主事业上不懈奋斗的正式支持与认可。我也希望在未来的日子里，全国的公民们都能像他们一样，传承并发扬这自国母稗田阿求时期以来就一直引领我们奋勇前行的民主传统。\n愿幻想乡永远繁荣，和谐，更要永远自由！愿她迈向更美好的明天！"
  FRA_Gensokyo.059.a: "幻想乡共和国总统雾雨魔理沙，敬上"

  FRA_Gensokyo.060.t: "行动报告-第41号"
  FRA_Gensokyo.060.desc: "第一天：疑犯工作了一整天，下班后便立刻回家，并未发现其从事间谍活动。\n\n第三天：在核对了疑犯的作息时间后，趁其出门之际于其住处安装了窃听器，不过仍未寻获证明其从事间谍活动的可靠证据。\n\n第六天：疑犯在工作间隙与一位外国人会面——此人经进一步调查已被证实为阿勃维尔特工。同日，窃听器记录下了某种机械运作的声音。我们已获准将其逮捕。\n\n第七天：由（略去）和（略去）特工实施抓捕。在抓捕过程中，疑犯企图抵抗，但被击伤（使用橡胶子弹，其并无生命危险）。已缴获上文提到的机械——一台发报机（已交由技术部门处理）。疑犯亦已被抓捕归案，目前正在审讯。"
  FRA_Gensokyo.060.a: "又少了一个要忧心的纳粹。"

  FRA_Gensokyo.061.t: "暴君必须死，因为共和国必须生"
  FRA_Gensokyo.061.desc: "雾雨魔理沙（以下简称“魔理沙”）：诸位议员，我不知道你们懂不懂得一个道理。为打破某些人的无知，更为了把某些人从沉睡中叫醒，我在此再重复一遍：潜伏在自由共和国中的野心家与第五纵队只能在两种情况下派上用场：要么是危害政权的安定或是威胁公民们来之不易的自由，要么就是妄图同时实现这两个结果！\n国民议会议长（以下简称“议长”）：魔理沙女士，我完全理解并同意您保卫我们共和国与其民主传统的崇高追求。但还请您三思而后行——您的这份提案实属激进，恐难以服众。\n魔理沙：对此，我只望诸位记住，此时此刻的一切讨论都应当以一项基本人权——无罪推定为前提。因此我们必须通过立法来确保暴君们能够得到应有的审判——如果不通过审判来确定暴君们的累累罪行，又怎能宣告共和国无罪呢？\n议长：在这一点上，我相信在场的诸位议员都认同您的观点。但您是否有些杞人忧天了？现在的国内外形势已经不比往日，激进派与破坏分子的威胁恐怕并不是您所表示的那样——\n魔理沙：我始终认为，一切旨在捍卫共和国自由之举措都可被称做伟业，那为什么诸位还要用这种空洞乏味的理由来无休止地拖延这些伟业呢？且不说每时每刻都对幻想乡虎视眈眈的德意志雄鹰与苏维埃巨熊之类，是什么让你们觉得共和国就永远会像看上去的那样四平八稳，风平浪静呢？又是什么让你们不敢直击问题根源，并做出相应措施呢？难道你们是害怕违背人民的意愿吗？说得就好像人民唯独不怕自己的代表软弱无能或是心怀阴谋一样；说得就好像人民是一群下贱的牲畜，可怜巴巴地跟着压迫自己的暴君，甚至还非要做奴隶不可一样！还是说，你们是在害怕子孙后代的评判？是的，令子孙后代们为之惊诧的，不会是我的“杞人忧天”，而是你们的不负责任和软弱无能；而令子孙后代们为之羞愧的，更不会是我今日的这份提案，而是他们先辈的傲慢自大和自以为是！\n议长：那个，嗯……\n魔理沙：怎么？\n议长：您在提案中表示，对从内部侵蚀腐化共和国的所谓“暴君”绝不会心慈手软，定要让他们为自己的所作所为付出代价——为此您不惜大幅扩展死刑适用范围。这是否有违人道主义与康复性司法的精神？\n魔理沙：我先在此声明，我本人是坚决反对滥用死刑的。对于其他国家通过的，允许慷慨地执行死刑的法律，我本人同样非常反感。而对于暴君们，我不爱也不恨——我只平等的憎恨他们犯下的罪行。可诸位呢？我们伟大的民主传统在过去，现在以及未来所受的侵犯，与其说是共和国的不幸，不如说恰是诸位的软弱所致！诸位在此要求审慎使用死刑，而因此得以被从轻处罚的恰恰是那些正该被判处死刑的人！诸位在他们身前撑开那以“人道主义”为名的挡箭牌，就和他们本身的罪行一样邪恶！\n议长：但，魔理沙女士，我——\n魔理沙：诸位大可声称这份提案将监禁，流放，甚至杀死整整一个广场的人。但还请诸位记住，"
  FRA_Gensokyo.061.a: "一旦它表决通过并付诸实施，将拯救千万人！"

  FRA_Gensokyo.062.t: "总统信箱里的一封信"
  FRA_Gensokyo.062.desc: "亲爱的总统女士，\n我在一座您一定没听过，甚至地图上都不会标注的小镇出生并长大成人。虽然镇上的大家都说那是我的家乡，我却并没有体会到小镇哪怕一丝一毫的温暖：我的父亲在工厂打工，母亲在饭店做服务员。他们夜以继日地操劳，却只能拿到最微博的薪水。好不容易把我和弟弟妹妹们拉扯大，新的麻烦又来了：伴随着一条条新高速公路而来的是各种各样的游客。他们带来了金钱和新的工作机会，但是我们一家人却没有因此变得富裕，一点点都没有——只因为他们也带来了一样东西：毒品。我的父母难敌诱惑，相继染上毒瘾，不久便因此去世。没了收入来源，我和弟弟妹妹们很绝望。只能卖了老房子，搬到镇子的一个偏僻的角落住，只因为那里的房租便宜些。为了供弟弟妹妹们上学，我只能一边读书，一边打零工以补贴家用。说老实话，我并不懂什么政治。但我发誓，我只会把选票投给您，总统女士——您最近的努力让我能挣到更多的钱，让弟弟妹妹们能吃上饱饭，更让房东不敢随便赶我们走，这就足够了。我知道，这里还有很多人与我感同身受。我想代表他们，更代表我自己，对您说一句谢谢。谢谢您，总统女士，谢谢您所做的一切。\n\n一位普通的幻想乡公民。"
  FRA_Gensokyo.062.a: "她竭力微笑着，可泪水却止不住地滴落在信纸上。"

  FRA_Gensokyo.063.t: "向繁荣奔去"
  FRA_Gensokyo.063.desc: "当日早间，政治分析人士与各路媒体就已聚集在总统府前的台阶上等待着雾雨魔理沙总统：他们已经获悉总统将在此次新闻发布会上强调本届内阁在新任期的工作重心之一——经济改革。\n不久，魔理沙如约而至。她在摄像机镜头的簇拥下，热情洋溢而又处变不惊地演讲了近两小时。在抢足了在场所有人的风头的同时，也让守在电视机前的每一位公民对自己经济改革计划的宏伟蓝图了然于心。\n魔理沙内阁的多位人士均对总统的讲话表示完全赞同，如经济财政部部长公开宣称“此项计划不但会向全世界展现幻想乡不可小觑的经济实力，更能大幅提升她勤劳善良的人民的生活水平。”自由党也已经摩拳擦掌，誓要让对推动计划进程不可或缺的一系列立法顺利通过议会。\n而在另一边，众多反对党对魔理沙那雄心勃勃的计划则反应相对冷淡：大部分政客的迷惑不解与阴阳怪气早已盖过那寥寥无几的支持声音。但至少就目前而言，幻想乡已经成功迈出了她经济腾飞的第一步。"
  FRA_Gensokyo.063.a: "为了幻想乡！"

  FRA_Gensokyo.064.t: "捍卫民主自由，我们需要你"
  FRA_Gensokyo.064.desc: "幻想乡自由党在此关键时刻，郑重呼吁所有坚持民主路线的政党加入新近成立的泛民主联盟。而作为幻想乡忠勇善良的公民，你同样有责任和义务为民主事业贡献力量。因此，我们诚邀你加入自由党与泛民主联盟，共同捍卫幻想乡的民主传统！\n\n加入我们，你不但能够参与党内决策，发表你的观点和建议；更能亲身推动自由党，泛民主联盟与幻想乡的发展壮大。你的每一分投入都是对民主事业不可或缺的支持，而幻想乡的明天也离不开你——只有通过广泛的民主参与，我们才能建设一个更加美好，更加公平公正的新社会。\n\n让你我携手并肩，为民主之光照遍幻想乡的每一个角落而努力奋斗！而你，我的朋友，现在就请行动起来。快快加入自由党与泛民主联盟，让幻想乡成为欧洲无可撼动的民主堡垒！"
  FRA_Gensokyo.064.a: "入党申请第二天就在自由党各支部的桌上堆成了小山。"

  FRA_Gensokyo.065.t: "昨与今"
  FRA_Gensokyo.065.desc: "在过去，她只能默默忍受一系列不公对待，只因自己是妖怪而非人类。而现在，她终于可以挺直腰杆，大大方方的走在街上，周围人也不会再有异样的眼光。\n\n在过去，一场车祸无情的夺走了他的双亲，他只能被迫放弃学业外出打工以养活年幼的弟弟妹妹。而现在，他们在国家的补贴下都不愁吃穿住行，他也有机会接受教育，重拾那份对知识与智慧的渴望。\n\n在过去，她在血汗工厂中日夜操劳，却只换来一只断掉的手臂和一份无情的解聘书。而现在，她在国家的帮助下安上了假肢，找到了新工作，那位老板也因自己的所作所为被送进了监狱。\n\n在过去，因毫不掩饰民主信仰而被迫害的他颠沛流离，无时无刻不活在担惊受怕之中。而现在，他可以勇敢的站出来，为自由高声呼号，而不必担心因言获罪。\n\n他们素不相识，他们毫无交集，他们在人潮人海中从未谋面。\n\n不过，他们心中有一个共同的想法："
  FRA_Gensokyo.065.a: "这是属于我们的时代。"

  FRA_Gensokyo.066.t: "幻想乡之颂"
  FRA_Gensokyo.066.desc: "我从你那源远流长的\n民主传统来识别你，\n我因你那锋利无比的\n自由之剑而敬畏你。\n你统领着我们的精神，\n你指引我们走向远方。\n啊，幻想乡！\n你终将胜利，定将胜利！\n现在，让我们迎接你，\n迎接时代新秩序。\n万岁，自由！"
  FRA_Gensokyo.066.a: "万岁，幻想乡！"

  FRA_Gensokyo.067.t: "晚安"
  FRA_Gensokyo.067.desc: "“上到未来的新总统，下到不谙世事的小孩子。倘若要总结我这两届总统任期的遗产，那必定是长期野蛮迫害幻想乡公民的不公不义的诅咒的终结。\n“我坦言，在正义之光难以照耀之处，这诅咒仍会继续存在。但每一位幻想乡公民都可以放心，它已从人人闻之色变的，将整个社会无情笼罩在自己阴影下的利维坦，变成了通往美好年代的梦之路上的一个小插曲。如今的幻想乡，病者得其医，贫者得其食，种族与贫富的差距也不会催生傲慢与偏见。这梦之路不是一次无望之旅，而是我们国家已经驰骋其上的快车道。\n“迟早会有人接替我来掌控方向盘，但我的努力一定不会白费。幻想乡不必再担惊受怕落入暴君之手或在时代浪潮中摔得粉碎，而是将团结一致迈向那光明的未来。也许，千百年后的人会明白，幻想乡在这一刻终于名副其实的成为了一片任何人都能铸就伟业的土地。\n“阿求生前一直坚信，不论如何，都应该正确地做正确的事。毫无疑问，如果她还活着，也一定会为我这些年来的所作所为感到骄傲吧。”\n魔理沙又看了一遍日记中的文字。在确保没有写错哪怕一个标点后，她轻轻合上日记本。与此同时，她的嘴角微微上扬，再次露出了自己那标志性的笑容。\n只不过和以往的种种逢场作戏不同，这一次，她是发自真心的。"
  FRA_Gensokyo.067.a: "亲爱的魔理沙，做个好梦。"

  FRA_Gensokyo.068.t: "从莱茵兰撤军"
  FRA_Gensokyo.068.desc: "为了削减预算，我们不得不从莱茵兰撤军。"
  FRA_Gensokyo.068.a: "我们会回来的"

  FRA_Gensokyo.069.t: "[ENG.Getname]履行条约"
  FRA_Gensokyo.069.desc: ""
  FRA_Gensokyo.069.a: "太好了"

  FRA_Gensokyo.070.t: "[ENG.Getname]背叛了我们！"
  FRA_Gensokyo.070.desc: ""
  FRA_Gensokyo.070.a: "混蛋！"

  FRA_Gensokyo.071.t: "[DVL.Getname]进攻幻想乡"
  FRA_Gensokyo.071.desc: "根据此前签订的条约，我们有义务保障幻想乡的独立，现在到了我们选择的时候了......"
  FRA_Gensokyo.071.a: "圣杯不会抛弃她的朋友！"
  FRA_Gensokyo.071.b: "签订条约的是前任首相，关我什么事？"

  FRA_Gensokyo.072.t: "幻想乡永不投降！"
  FRA_Gensokyo.072.desc: ""
  FRA_Gensokyo.072.a: "民主不容亵渎！"

  FRA_Gensokyo.075.t: "“奇迹”"
  FRA_Gensokyo.075.desc: "“你叫我和神奈子过来是有何贵干？”洩矢诹访子打了个哈欠，对已在办公室里等候多时的东风谷早苗埋怨道：“本来从神社到你这里就不算近，你还非得在大清早搞突然袭击，害的我在睡梦中被神奈子叫醒，到现在还迷迷糊糊的。”\n“好，好，我道歉，现在麻烦你安静一下。”早苗有些无奈地摆了摆手，神奈子也对诹访子使了个眼色，让后者悻悻地闭上了嘴。“我之所以这么着急的召见你们，不为别的，只因有要事相求。”\n“什么？”这下轮到八坂神奈子疑惑了。\n“我虽不惧身死毅然发动革命，只为从国贼博丽灵梦与茨木华扇手中拯救国家。但非常遗憾，无数民众已被她们的谗言所蛊惑，不愿随我走上复兴幻想乡的正确道路，二位请随我看。”语毕，早苗回身拉开了办公室的一小面窗帘。只见远处的广场上满是临时搭起的营地，想必是持续彻夜的示威游行留下的，而“东风谷早苗下台”之类的标语和横幅更是随处可见。\n“所以说，你是想让我们把这些清理干净？”八坂神奈子问道。\n“这种小事我自己处理足矣，何必如此麻烦二位。”\n“那你是想从根本上解决问题？如果这么办的话，我现在就可以打个电话把我那些部队调过来，然后回去继续睡觉。”洩矢诹访子顺势接过话茬，不过她的起床气看来还没完全消除。\n“不不诹访子，你这就太不文明了。而且万一让圣杯她们知道了些什么，我还得再把你单独叫过来商量该找谁当替罪羊——除非你愿意自己认下，不过我猜你不会。”\n“好像也是。”诹访子红着脸，勉强挤出了个标准的营业式假笑。\n“所以你们不得不承认，你们这些个思维方式决定了你们只能跟着我干。”早苗一边坏笑着，一边将自己真正的目的缓缓和盘托出：“我想让你们帮我出出主意，好赢下下一届大选。而这么急，是因为我们只有三天时间了。”\n“可是早苗你不是已经宣布政——革命成功了吗？再搞这一出又是何必？”诹访子不敢相信自己的耳朵，她身旁的神奈子也把惊讶毫不遮掩的写在了脸上。\n“时间紧迫，我就不纠正你刚才的口误了，让我把话说完：我们必须组建自己的政党并堂堂正正的赢得选举。只有这样，才能扭转灵梦之流对民众的洗脑宣传，让她们发自内心的信任我们的领导。而叫来你们的原因，就是在组建政党一事上需要二位的协助。毕竟，你们再怎么说，也是和我一条船上的了。”\n一听这话，诹访子瞬间紧紧抱住了早苗，“早苗大人英明神武”这般溢美之词更是不绝于耳，让一旁的神奈子和早苗都很是尴尬。\n“算我求你，把手松开，现在。”早苗一脸黑线的说道。\n“好吧。”不过明显不情愿的诹访子还落了几滴眼泪，早苗见此不由得深深地叹了一口气。\n“谢谢你。神奈子，麻烦再搬两把椅子来。”\n“好的。”\n\n几分钟后，总统办公桌前：\n“名字就叫做‘奇迹党’如何？毕竟这在某种程度上可以被解读为‘我们会为幻想乡带来奇迹’，而且早苗你的能力就是‘奇迹’。”\n“我同意。那么，下一步就是党章了。我先列个大纲，届时你们看看，觉得大方向上没问题就一起扩写完整，如何。”\n“都听你的，早苗。”"
  FRA_Gensokyo.075.a: "那是一个料峭的早晨。"

  FRA_Gensokyo.076.t: "[DVL.Getname]进攻莱茵兰"
  FRA_Gensokyo.076.desc: "[DVL.Getname]已经向莱茵兰地区出兵，这是对我们之前秘密条约的公然挑衅，我们理当制止这种行为。\n但是秘密条约的内容我们也并不光彩，更何况我们正在饱受大萧条的折磨，很难说我们有没有能力去阻止[DVL.Getname]。"
  FRA_Gensokyo.076.a: "这是公然挑衅，立刻动员！"
  FRA_Gensokyo.076.b: "我们没有这个功夫，仅仅在外交上声讨一下"
  civil_war_will_begin: "§R一场内战将会爆发！§!"

  FRA_Gensokyo.077.t: "不可阻挡的败北"
  FRA_Gensokyo.077.desc: "魔导国的军团正在人间之里阅兵，而其他重要城市大多陷落。现在还能与中央联系的部队十不存一，我们很快就要被迫投降了。"
  FRA_Gensokyo.077.a: "向新人间之里撤离，幻想乡已经没希望了！"
  FRA_Gensokyo.077.b: "别慌，看我操作"

  FRA_Gensokyo.079.t: "[POL.Getname]的新方向"
  FRA_Gensokyo.079.desc: "[POL.Getname]的政治风向发生了剧烈变化，他们的新意识形态与[FRA.Getname]背道而驰。曾经的盟友如今理念不合，继续保障其独立已不再符合我们的国家利益。我们决定终止对[POL.Getname]的独立保障，转而专注于自身战略布局。"
  FRA_Gensokyo.079.a: "我们不再保障他们的独立。"

  FRA_Gensokyo.080.t: "幻想乡索要莱茵兰地区"
  FRA_Gensokyo.080.desc: "幻想乡向我们索要莱茵兰地区，在我们归乡后，莱茵西岸将被划入幻想乡的领土。"
  FRA_Gensokyo.080.a: "为了复国大业"
  FRA_Gensokyo.080.b: "德意志，缺一不可"
  FRA_Require_for_Rhineland_tt1: "§Y莱茵西岸§!与§Y埃尔萨斯-洛林根§!将不被视为德国领土"
  FRA_Require_for_Rhineland_tt2: "§Y[FROM.Getname]§!将会离开§Y[FROM.GetFactionName]§!"

  FRA_Gensokyo.081.t: "[FROM.Getname]同意了"
  FRA_Gensokyo.081.desc: ""
  FRA_Gensokyo.081.a: "很好"

  FRA_Gensokyo.082.t: "[FROM.Getname]拒绝了"
  FRA_Gensokyo.082.desc: ""
  FRA_Gensokyo.082.a: "希望德方明白，是德国需要幻想乡，而不是幻想乡需要德国。"

  FRA_Gensokyo.083.t: "幻想乡要求划定势力范围"
  FRA_Gensokyo.083.desc: ""
  FRA_Gensokyo.083.a: "可以"
  FRA_Gensokyo.083.b: "滚蛋"

  FRA_Gensokyo.084.t: "[FROM.Getname]同意了"
  FRA_Gensokyo.084.desc: ""
  FRA_Gensokyo.084.a: "很好"

  FRA_Gensokyo.085.t: "突袭议会"
  FRA_Gensokyo.085.desc: "不可否认，在我国漫长的历史中议会占有重要地位，也对国家发展有一些贡献。但现在议会已经完全成为了一大块不可燃垃圾，各种党派的头目想的不是增进民生福祉，从外国人手里保护国家，而是分配选区，协调议员们的蝇头小利，真正为国着想的壮士反而被拒之门外，因为他们不是医生也不是律师，没有所谓体面的职业，更没有世代传承的政治资本，只是万千普通大众中的一员。\n\n严峻的国际形势已经不允许议会继续饶舌鼓唇，最终我们迈出了光荣的一步，对议会发动冲击！无需理会宵小之徒的聒噪，一路向前，一往无前，为了幻想乡新的明天！"
  FRA_Gensokyo.085.a: "为了国家，对虫豸们发动政变吧！"

  FRA_Gensokyo.086.t: "[FROM.Getname]邀请我们加入£GFX_WSDO_text_icon §F波长同步防御条约组织§!"
  FRA_Gensokyo.086.desc: ""
  FRA_Gensokyo.086.a: "好"
  FRA_Gensokyo.086.b: "不好"

  FRA_Gensokyo.087.t: "首相选举"
  FRA_Gensokyo.087.desc: "在辉夜公主执掌大权后，我们应当仔细考虑首相的人选，毕竟公主殿下对政务不甚热衷，也不爱公开露面出席活动，需要有人负责这些无趣乏味的行政工作。目前入围的人选有四人：前总统铃仙、地上妖怪兔们的领袖因幡帝、公主殿下的老冤家藤原妹红和公主殿下的老师八意永琳，四个人各有优势，最终决定权应该在公主殿下自己手上。"
  FRA_Gensokyo.087.a: "铃仙·优昙华院·因幡"
  FRA_Gensokyo.087.b: "因幡帝"
  FRA_Gensokyo.087.c: "八意永琳"
  FRA_Gensokyo.087.d: "藤原妹红"

  FRA_Gensokyo.088.t: "白玉楼的虚无飨宴"
  FRA_Gensokyo.088.desc: "当八意永琳抵达白玉楼时，眼前的景象足以让最冷静的月之贤者也感到眼压升高。西行寺幽幽子正端坐在那棵巨大的西行妖下，面前的餐盘堆叠得比白玉楼的屋顶还要高。\n\n“哎呀，永琳，你是来加餐的吗？”幽幽子一边说着，一边将整整一盘特大号饭团塞进那仿佛连接着黑洞的嘴里。由于她进食的速度太快，食物中的生命能量在被虚无之力强行剥离时，产生了剧烈的物理排斥。大量的“食物残渣”混合着冥界的灵力，像紫色晶体一样从餐桌边缘喷溅出来。\n\n魂魄妖梦正化作一道残影，拼命挥舞着楼观剑拦截那些飞溅的油渍和饭粒，以免它们弄脏了庭院。她对着永琳大喊：“请留步！永琳大人！幽幽子大人现在的进食频率已经干扰了周边的因果律，随便靠近会被当成配菜卷入虚无的！”\n\n永琳推了推眼镜，丝毫不为所动。她观察到那些被幽幽子“消化”后排出的残渣，实际上是极度浓缩的生命流质。她精准地算准了妖梦出剑的间隙，在幽幽子吞下下一盘天妇罗的瞬间，用银质试管接住了那一抹散发着诡异紫光、兼具饱足感与毁灭气息的“剩饭”。"
  FRA_Gensokyo.088.a: "幽幽子：不赖"

  FRA_Gensokyo.089.t: "深层的潜意识荆棘"
  FRA_Gensokyo.089.desc: "地灵殿的大厅弥漫着一股焦灼的思维波动。古明地觉正紧紧按着第三只眼，面色苍白地迎接永琳：“八意医生，你来得真是不巧。恋恋现在正陷入一种‘自我封闭的狂欢’，她把自己藏进了无意识的深渊里，现在整个地灵殿都在她的精神边界上震荡。”\n\n仿佛为了印证这句话，一根粉色荧光的透明荆棘突然从虚空中生长出来，带着刺耳的划痕声擦过永琳的衣角。这根“玫瑰刺”并不是植物，而是古明地恋在完全隔绝他人感知时，潜意识产生的剧烈排斥反应。\n\n永琳冷静地蹲下身，试图用月都的频率探测仪捕捉那一闪而过的波动。但由于恋完全没有“存在感”，探测仪的指针在疯狂乱转后直接锁死。就在此时，恋那毫无感情起伏的声音突然在永琳脑海中响起，又像是从空气中飘过：“医生，你在找什么？是在找这个想扎人的坏孩子吗？”随着声音，无数荆棘如雨后春笋般破土而出，将现实世界撕裂出一道道逻辑断层。\n\n永琳意识到，单靠物理手段无法触碰这些虚无的结晶。她转向觉，提议进行一次高风险的“双向意识投射”：由觉敞开心扉，释放出对妹妹最深层的思念作为信号灯，吸引恋的潜意识产生瞬间的“共鸣”。在两股极其相似却又互补的精神力量交汇的一刹那，现实与虚无的边界会产生实体化的塌陷。永琳推了推眼镜，指尖划过虚空，精准地在那个因共鸣而产生的空洞中，强行截留了一截犹在颤动的粉色荆棘。"
  FRA_Gensokyo.089.a: "完成意识同步采集"

  FRA_Gensokyo.090.t: "凝固的苍穹碎片"
  FRA_Gensokyo.090.desc: "有顶天的玄云海翻涌着永恒的白浪，空气中弥漫着一种名为“无聊”的仙界气息。八意永琳站在云端的边缘，手中握着一支散发着微弱蓝光的月都震荡仪。她的目标是“玄云海的云朵结晶”——这种由于天人长期踩踏而产生的极高压力，将虚幻的云雾硬生生压制成了固态的结晶。它是炼制引力锚定药剂或浮空建筑加固剂的唯一基材。\n“哟，这不是那个蹲在森林地洞里的医生吗？”比那名居天子扛着绯想之剑，踏着云浪大摇大摆地走了过来，“怎么，地上的空气终于浑浊到让你想来有顶天洗肺了？还是说，你是来求我给你那沉闷的永远亭制造一点‘地震’惊喜的？”\n永琳优雅地关闭了震荡仪，推了推眼镜，目光并未看向天子，而是死死锁定在天子脚下那块泛着金属光泽的云层：“比那名居小姐，我只是来收集一点‘由于某人的胡作非为而产生的垃圾’。如你所知，由于你长期在玄云海进行高强度的踩踏和破坏，这里的云雾已经发生了严重的硬化病变。如果不及时清理，这些结晶可能会戳破你最心爱的那个‘桃子园’的底部。”\n“胡说八道！这叫‘天人的足迹’！”天子虽然嘴上强硬，但显然被勾起了好奇心，“而且，你要怎么‘清理’？用你那些苦得要命的药水吗？”\n永琳微微一笑，从药箱中取出一瓶散发着月光气息的“月都极性逆转液”。她将其精准地滴落在天子剑锋划过的一道裂隙中。瞬间，周围的云层开始剧烈颤动，原本柔软的云雾在极性的诱导下迅速向核心坍缩，发出如玻璃破碎般的清脆声响。\n趁着天子因为这种从未见过的物理现象而发呆的间隙，永琳指尖划过一道须臾的残影，从那坍缩的核心中精准地撬出了一块如同钻石般璀璨、却轻若无物的透明晶体。\n玄云海的云朵结晶躺在永琳的掌心，内部仿佛包裹着一整片微缩的暴风雨，正不安地跳动着。\n“采样完成。”永琳将结晶收入铅芯玻璃瓶，对着一脸懵逼的天子颔首示意，“感谢你的‘足迹’为医学进步做出的贡献。至于这些结晶的‘残留物’，你可以试着把它们当成冰糖吃——虽然口感大概像是嚼碎了的闪电。”"
  FRA_Gensokyo.090.a: "这只是仙界的废物利用。"
  FRA_Gensokyo.090.tt: "利用天子的虚荣心与好奇心，在对方围观的情况下优雅地完成了“清理式”采集。"

  FRA_Gensokyo.091.t: "终极的植物压花"
  FRA_Gensokyo.091.desc: "当八意永琳步入太阳花田时，周围的空气粘稠得让人窒息——那是高度浓缩的妖力和过于浓郁的花粉味。在金色的花海中心，风见幽香正优雅地撑着阳伞，修剪着一株长得比人还高的向日葵。\n\n“哎呀，月之贤者。你是来给我的宝贝们施肥的吗？”幽香转过身，笑容灿烂得让周围的向日葵都缩了缩脖子，“如果是的话，我建议从你的左腿开始，那里的钙质看起来很丰富。”\n\n永琳面不改色地从药箱里掏出一把银色的精密剪刀和一瓶淡绿色的活性液：“幽香小姐，我需要一朵在‘绝对光照’下生长、且含有高浓度纯粹生命力的向日葵标本。作为交换，我——”\n\n“交换？”幽香猛地收起阳伞，伞尖直指永琳的眉心，笑容变得有些危险，“我更喜欢看你在我的花田里跳一支‘躲避魔炮’的舞。如果你能在那根向日葵被烧焦之前拿到它，我就承认你是个合格的‘园丁’。但如果被我的花瓣碰一下，你这身月都的皮囊，就会成为我新一批花肥的养料。”\n\n永琳眼神一凝，她知道无法避免这场冲突了。在幽香出招前的一瞬间，永琳已经开启了须臾之力，她化作一道残影，在向日葵的叶片间穿梭。魔炮如同雨点般落下，地面被轰出一个个焦黑的坑洞，但永琳总是能提前半秒闪避。最终，在幽香愤怒地轰出最后一发巨型魔炮、试图将那朵目标向日葵连同永琳一起蒸发时，永琳逆着魔炮的轨迹冲了进去，用那把银色的剪刀，在火焰吞噬一切的前一刹那，精准地剪下了那朵向日葵！"
  FRA_Gensokyo.091.a: "“这朵花我收下了，下次我会给你带来新的惊喜。”"

  FRA_Gensokyo.092.t: "名为“借”的知识转移"
  FRA_Gensokyo.092.desc: "八意永琳站在魔法之森那充满霉味和毒蘑菇孢子的浓雾中，面前是堆满各种“不明来源”杂物的雾雨老店。她的目标是“‘借’来的红魔馆禁书残页”——这种素材因沾染了帕秋莉的防御咒文和魔理沙的粗鲁魔力，产生了一种独特的“强制解析”属性。\n\n“哟，这不是永远亭的大医生吗？什么风把你吹到这阴森森的地方来了？”魔理沙正骑在扫帚上，手里上下抛着一卷散发着不详红光的破损羊皮纸，露出标志性的虎牙，“如果你是来要回上次那些药草的钱，我可得提前声明，我现在手头只有这堆‘暂时借住’在我家的宝贝。”\n\n永琳推了推眼镜，目光锁定了那卷红光：“雾雨小姐，你手里那份关于‘命运干涉与血液浓缩’的残页，如果保存不当，会在三小时内把你这间漏风的小屋炸成红魔馆的形状。帕秋莉在上面施加了‘自燃式防盗术’。”\n\n魔理沙的动作僵住了，羊皮纸边缘果然开始冒出紫色的烟雾。“哇啊！你怎么不早说！那那那……你有什么办法？”\n\n永琳优雅地从袖子里取出一个特制的冷冻隔离盒：“我可以帮你处理这烫手的山芋，作为交换，这些被灼烧后的残页数据归我。另外，我这里有一瓶能让你的‘极限火花’射程增加10%的试管，算是这次‘借阅费’的补偿。”"
  FRA_Gensokyo.092.a: "“既然是‘借’，那我也‘借’走好了。”"

  FRA_Gensokyo.093.t: "蕴含法力的纯素碳水"
  FRA_Gensokyo.093.desc: "八意永琳站在命莲寺的食堂门口，看着那碗散发着金光（物理意义上）的斋面，陷入了沉思。她的目标是“圣白莲的斋面”——这种面条在制作过程中被白莲注入了海量的强化魔法与慈悲心，其蕴含的“安定能量”是稳定剧毒药剂的最佳基底。\n\n“八意医生，请不要客气，多吃一点对身体有好处的。”圣白莲带着慈母般的微笑，亲自为永琳递上碗筷。她身后的佛光闪烁，甚至让面汤产生了一种神圣的律动。\n\n然而，永琳注意到村纱水蜜正鬼鬼祟祟地在灶台边晃悠。这位幽灵船长趁白莲转身去迎接其他香客时，迅速从怀里掏出一瓶标有“圣辇船1号燃料”的诡异液体，试图往大锅里滴上两滴。\n\n“嘿嘿，白莲做的饭虽然能增强体力，但就是太‘平和’了。”村纱小声嘀咕着，“加点这个，能让这碗面产生‘如波涛般狂暴的推进力’，那才叫真正的强化嘛！”\n\n永琳推了推眼镜，手中的手术刀（兼餐具）在指尖飞速旋转。她意识到，如果让村纱把燃料加进去，这锅面会变成威力巨大的生物炸弹；但如果能精准地截留那部分被“燃料”污染但又被“佛法”净化的面条，就能获得一种兼具物理爆发力与精神安定性的梦幻素材。"
  FRA_Gensokyo.093.a: "“圣小姐，村纱似乎想帮您‘改进’配方。”"
  FRA_Gensokyo.093.tt: "白莲转过头，笑容依然慈悲但背景气压骤降：“村纱，我记得说过不许把引擎室的东西带进厨房吧？”在村纱被白莲带去“说教”（物理）时，永琳从容地从小锅里挑走了那份被经文浸润最久的斋面。"

  FRA_Gensokyo.094.t: "幸运绒毛与月都捕获陷阱"
  FRA_Gensokyo.094.desc: "永琳漫步在迷途森林中，这里浓雾弥漫，幻象丛生，正是捕捉“因幡帝的尾巴毛”的最佳地点。这种素材蕴含着“好运”与“恶意”的双重因果，是炼制“概率操控药剂”的理想选择。\n\n“啊哈哈哈！永琳医生，你又迷路啦？是不是想来沾沾我的好运啊？”因幡帝突然从一棵树后跳出来，露出标志性的狡黠笑容，她那蓬松的尾巴得意洋洋地甩来甩去，“不过，我的运气可不是随随便便就能‘分’给别人的哦！”\n\n永琳推了推眼镜，手中的月都特制捕获器散发出微弱的蓝光。她知道因幡帝的尾巴毛只有在极度“好运”或“倒霉”的瞬间才会脱落，而且本身带有强烈的因果斥力，难以捕捉。\n\n“因幡帝，我来是想研究你尾巴毛中蕴含的‘因果偏向性’。”永琳平静地说，“如果我能成功解析，就能制造出一种让你在玩‘恶作剧’时永远不会被抓到的药水。当然，你也可以选择继续在森林里乱跑，直到你的好运耗尽，然后被饥饿的妖精们拔光尾巴。”\n\n因幡帝的笑容僵在了脸上，她似乎想象到了自己被拔毛的悲惨场景。但她很快又恢复了调皮的表情：“哼！想拿我的尾巴毛？那可不是随便能碰的！不如我们玩个游戏吧？你来追我，如果能在我跑掉之前，从我尾巴上拔下一根毛，就算你赢！”\n\n永琳开启了药剂加速状态，在迷途森林中与因幡帝展开了一场匪夷所思的猫鼠游戏。在帝即将跳入一个虫洞（魔法之森的特产）的前一刻，永琳精准地投掷出捕获器，缠住了她那蓬松的尾巴，成功扯下一小撮毛。"
  FRA_Gensokyo.094.a: "“月都的追踪技术可不是闹着玩的。”"

  FRA_Gensokyo.095.t: "极致纯净的月之精华"
  FRA_Gensokyo.095.desc: "八意永琳重返月之都，这次她的目标是“绵月丰姬的体液”——这并非世俗意义上的凡物，而是月之民在极高纯度生命状态下分泌出的、蕴含着“波粒二象性”能量的泪液或唾液。\n\n当永琳抵达丰姬的私人花园时，绵月丰姬正瘫在柔软的云朵沙发上，一边嚼着月桃，一边懒洋洋地翻阅着禁书。而她的妹妹绵月依姬则全副武装，手持月光剑在周围焦虑地踱步。\n\n“永琳大人！您竟然还敢回到这里索要这种……这种无礼的东西！”依姬在听完永琳关于“科研采样”的申请后，气得浑身发抖，剑尖几乎要擦出火星。\n\n“依姬，别那么死板嘛。”丰姬嚼着果肉，含糊不清地笑道，“八意博士想要的是我身为‘天人’的生命信息。既然她能帮我把那堆无聊的公文处理掉，给她几滴眼泪又何妨？”\n\n就在依姬试图争辩的一瞬间，永琳已经推了推眼镜，身形在须臾之间化作残影。她精准地预判了丰姬因为笑声而引发的一声轻微咳嗽。在丰姬被果肉呛到、眼角溢出一滴晶莹泪珠的刹那，永琳手中的月都纳米试管早已在那待命。\n\n绵月丰姬的体液在空气中划过一道银色的弧线，分毫不差地落入试管，其纯净的光芒瞬间将整个采样器染成了如月光般的色泽。\n\n“采样完成。”永琳优雅地收回试管，对着呆若木鸡的依姬微微颔首，“过程完全无菌，依姬大人不必担心您的姐姐会因此‘受污染’。作为补偿，我会在下一份给月都的报告中，将您的剑术评价提升至‘神域级’。”"
  FRA_Gensokyo.095.a: "“这只是为了月之都的进化。”"

  FRA_Gensokyo.096.t: "充满奇迹的秘制酵母"
  FRA_Gensokyo.096.desc: "八意永琳站在位于妖怪之山巅峰的守矢神社前，这里的空气中弥漫着清新的山泉气息和……一种微妙的、带着果香的谷物发酵味。她的目标是“早苗的口嚼酒”——这是一种由现人神东风谷早苗亲自咀嚼米粒后，利用其体内的“奇迹之力”作为活性酶而酿造出的神力浓缩液。\n\n“哎呀，八意医生，这种‘古法酿造’其实挺害羞的，请不要一直盯着我看啊！”早苗满脸通红地捂着腮帮子，正坐在神殿一角进行着最后的“加工作业”。\n\n一旁的八坂神奈子大大咧咧地拍着永琳的肩膀，差点把这位月之贤者的眼镜震掉：“哈哈！永琳，你是来进货的吗？这可是我们神社为了筹集‘信仰点数’而开发的特产，如果你想通过非法途径获取，那得问问我背后的注连绳同不同意！”泄矢诹访子则蹲在石阶上，摆弄着铁圈冷笑道：“与其说是来买酒，不如说是想来偷取‘神明体质’的样本吧？月之民的胃口还真是大呢。”\n\n永琳优雅地避开了神奈子的铁掌，从药箱中取出一支真空吸管和一瓶特制的“月都口腔粘膜保护剂”：“神奈子大人，我并不是来窃取秘密，而是来协助‘奇迹’的量产。这种原始的方法产率太低，且容易混入不纯的细菌。如果你们能让我采集一份正在发酵中的原始样本，我可以用月都的微纳过滤技术帮你们把这批酒的酒精度提升到能让鬼族都断片的程度。”\n\n就在三位神明为了“商业前景”展开激烈辩论时，永琳趁着早苗因为羞涩而低头咳嗽的瞬间，以须臾之力介入了因果的缝隙。在早苗将那一小碗蕴含着奇迹能量的成品封存前，永琳手中的试管精准地从中截取了最精华的原始液。\n\n早苗的口嚼酒呈现出乳白色的荧光，在试管中缓缓流转，每一滴都散发着足以改变抽卡概率的神圣光辉。\n\n“实验样本已取样。”永琳收起试管，对着还在讨论“酒精度与信仰值换算比例”的神奈子微微一笑，“作为报酬，那瓶能让口腔永久保持薄荷清香的药剂就送给早苗小姐了。合作愉快。”"
  FRA_Gensokyo.096.a: "“奇迹也需要科学的背书。”"

  FRA_Gensokyo.097.t: "捕捉极速的残影"
  FRA_Gensokyo.097.desc: "八意永琳站在妖怪之山的峭壁之上，狂风卷着云雾在她身边呼啸。她的目标是“文的羽毛”——这种素材因长期在超音速状态下与空气摩擦，产生了一种能“无视阻力”的动力学特性。\n\n“呀呼！永琳医生，你是想在我的头条新闻里占个版位吗？”一道黑影伴随着强烈的气旋瞬间停在永琳面前。射命丸文扶着红色的叶团扇，露出职业性的商业微笑，“《震惊！月之贤者非法潜入天狗领地，疑似寻找长生不老药的秘密原料》——这个标题怎么样？”\n\n永琳优雅地理了理被风吹乱的鬓角，手中的精密捕获器已经悄然锁定了文背后的黑色羽翼：“射命丸小姐，我只是需要一根你在‘极限速度’下自然脱落的羽毛。作为交换，我可以为你提供一套月都最新的‘超感光镜头镀膜’。有了它，即便是你潜入红魔馆偷拍，也不会因为闪光灯被十六夜咲夜的飞刀捅成筛子。”\n\n“喔？听起来很有诱惑力嘛！”文的眼睛亮了一下，但随即变得狡黠起来，“不过，天狗的羽毛可是身份的象征。如果你想要，就试试看能不能捕捉到我的速度吧！只要你能碰到我的羽毛，我就白送给你！”\n\n话音未落，文瞬间爆发。气流在山巅炸裂，空气中留下一连串虚幻的残影。然而，永琳并没有移动，她只是冷静地推了推眼镜，将一支淡紫色的药剂掷向空中。药剂瓶碎裂的瞬间，周围的“须臾”被无限拉长，整个世界的流速在永琳眼中变得缓慢无比。\n\n在那缓慢如静止的帧率中，永琳看到文正保持着冲刺的姿势，而一根受力过猛的黑色羽毛正因离心力从其翼尖微微翘起。永琳精准地伸出银质长镊，轻轻一夹，那根蕴含着风之神力的羽毛便被收入了真空试管中。\n\n文的羽毛即使在试管内也依然在不安分地颤动，发出一阵阵低沉的破空声，仿佛随时准备切开容器。\n\n“虽然你自诩速度幻想乡第一，但在‘须臾’面前，所有的动态都只是静止的标本。”永琳对着由于药效结束而一脸懵逼、在半空中差点栽跟头的天狗挥了挥手，“镜头镀膜在永远亭的收发室，记得去取。”"
  FRA_Gensokyo.097.a: "“这就是科学与经验的胜利。”"

  FRA_Gensokyo.098.t: "蕴含夜盲症的碳水奇迹"
  FRA_Gensokyo.098.desc: "深夜的参拜道，米斯蒂娅·萝蕾拉的移动烤八目鳗摊位正散发着诱人的香气。八意永琳站在阴影中，目光锁定的却不是那些肥美的鲜鱼，而是米斯蒂娅为了制作“亲子丼面”而放在筐里的“米斯蒂娅的无精蛋”。这种素材富含极致的夜莺魔力与感知阻断成分，是炼制【视界掠夺药剂】或缓解【夜盲症】的顶级原料。\n\n“嘿嘿，这位医生客人，要来一份‘八目鳗魔音烧’吗？”米斯蒂娅一边欢快地唱着能让人大脑短路的歌，一边熟练地敲开一颗蛋，“这可是新鲜产出的……哎呀！”\n\n就在她敲蛋的瞬间，永琳推了推眼镜，指尖弹出一枚极细的银针，精准地挑动了空气中的气流。米斯蒂娅只觉得手滑了一下，那枚刚被敲开、闪烁着淡淡星光的蛋液并没有落入锅中，而是像被某种无形的引力牵引，划出一道完美的弧线，分毫不差地落入了永琳早已备好的医用烧杯里。\n\n“那个……我的蛋？”米斯蒂娅呆住了，举着空壳看着永琳。\n\n“不必惊慌，夜雀小姐。”永琳面不改色地将烧杯封存，米斯蒂娅的无精蛋在容器内呈现出半透明的幽蓝色，隐约还能听到细微的鸟鸣回响，“你的蛋中含有过量的‘噪音共振蛋白’，如果让那个正在赶路的博丽巫女吃下去，她可能会因为暂时的听觉失调而砸了你的摊子。我这是在为你进行‘有害物质回收’。”\n\n“虽然听不懂你在说什么，但那是我的食材啊！”米斯蒂娅委屈地扇动着翅膀，“没有了那个，我的特制套餐就少了一味灵魂！”\n\n永琳叹了口气，从袖口里取出一瓶散发着月光色泽的调味液：“这是月都提取的‘绝对鲜味素’，一滴就能让你的八目鳗卖出黄金的价格。就当是这份珍贵生物样本的交换费用吧。”"
  FRA_Gensokyo.098.a: "“这是为了公共卫生与炼金进步。”"

  FRA_Gensokyo.099.t: "尘封的第九世代残卷"
  FRA_Gensokyo.099.desc: "人间之里的午后，铃奈庵的书香中夹杂着一种名为“禁忌”的陈旧气息。八意永琳站在堆满古籍的柜台前，目光锐利地锁定在柜台深处一个被重重符咒包裹的漆木盒子上。她的目标是“《幻想乡缘起》的未公开底稿”——那是稗田阿求在转生前私下留给本居小铃保管的遗物，记录了许多因“政治不正确”或“过于真实”而被删减的妖怪真相。对于永琳而言，这些未被粉饰的历史是解析幻想乡因果结构的终极蓝图。\n\n“八意医生，我已经说过了，那个盒子里装的只是……只是阿求小姐留给我的私人信件！”本居小铃紧张地抓着袖口，试图挡住永琳的视线。\n\n永琳优雅地合上手中的《月都药草志》，发出一声轻响：“小铃小姐，私人信件可不会散发出如此浓烈的‘因果修正力’。如果我没猜错，那份底稿里记录了某些关于永远亭、乃至月之民的早期观察报告。如果这些信息由于保存不当导致灵力外泄，可能会吸引某些对‘真相’过度饥渴的妖怪来拆了你的店。”\n\n就在小铃犹豫的一瞬间，店外突然传来了吵闹声——原来是永琳提前安排好的“诱饵”：一群因喝了过量营养剂而兴奋过度、正试图在街道上表演“叠罗汉”的因幡兔。趁着小铃跑向门口维持秩序的混乱间隙，永琳推了推眼镜，指尖划出一道微缩的隔离阵法。\n\n她以月之贤者的绝对冷静，精准地穿透了漆木盒上的符咒锁扣。她的手在空气中带起一串须臾的残影，从小铃那卷叠得整整齐齐的文稿中，抽出了那几张被朱砂涂抹得密密麻麻的半透明纸页。\n\n《幻想乡缘起》的未公开底稿落在永琳手中时，纸面上的文字仿佛活物般蠕动着，那是记录者阿求残留的意志与记忆。\n\n“采样完成。”永琳在小铃回头前的一秒将原件归位，并顺手塞入了一份自制的《书籍防蛀指南》作为“占位符”。她转身对着气喘吁吁跑回来的小铃微微一笑：“看来外面的骚乱已经平息了。作为赔偿，我为你这些珍贵的藏书施加了一个‘永恒防火咒’，这样阿求小姐的遗物就能永远安全地存在下去了。”"
  FRA_Gensokyo.099.a: "“知识应当由专业人士来保管。”"

  FRA_Gensokyo.100.t: "高科技引擎的冷却剂"
  FRA_Gensokyo.100.desc: "玄武之泽的迷雾中，河城荷取正蹲在她的特制潜水艇“超级河童1号”上，挥舞着扳手试图修理一个漏油的推进器。八意永琳站在岸边，手中把玩着一支高精密生物采样枪。她的目标是“河城荷取的体液”——这种液体中由于混合了河童特有的水生激素与长期接触高科技零件产生的“机油抗性”。\n\n“呀！这不是永远亭的大医生吗？”荷取警惕地拉了拉她那塞满工具的背带，从潜水艇上跳了下来，“如果你是想来推销那种‘能让河童不长青苔的药膏’，那我可没钱付账。除非你愿意用这台引擎的密封零件来换！”\n\n永琳推了推眼镜，目光在荷取额头上细密的汗珠和由于过度劳累而略显湿润的皮肤上扫过：“河城小姐，我对你的引擎没兴趣，但我对你体内由于过度脑力劳动而产生的‘高导热生物液’很感兴趣。作为交换，我可以为你这台濒临报废的潜水艇提供一份月都级别的‘反重力浮力装置’。”\n\n“反重力？！”荷取的眼睛瞬间变成了齿轮形状，但她很快又捂住口袋，“等一下，体液采集？听起来很像那种变态的科研考察啊！要是被其他河童看到我被你拿针扎，我的商业信誉就全完了！”\n\n就在荷取犹豫并试图潜入水中逃跑的瞬间，永琳并没有使用暴力。她只是从药箱里取出了一瓶特制的“月都超冷感薄荷喷雾”。随着喷雾在空气中弥漫，玄武之泽那潮湿的热气瞬间凝结成霜。荷取被这突如其来的清凉激得打了个响亮的喷嚏，就在她眼角因为生理刺激而溢出泪水，同时体表因为温差反应而析出大量高纯度“河童汗腺分泌物”的一刹那，永琳动了。\n\n她以月之贤者的极速，用采集枪在空气中精准一掠，将那些半透明、带着淡淡机油香气和薄荷清凉的液体悉数收入密封舱内。\n\n河城荷取的体液在采集中呈现出幽蓝色的光泽，其浓度之高甚至让容器壁上凝结出了一层微小的电路纹路。\n\n“采样完成。”永琳优雅地收回采样枪，顺手将那套反重力图纸丢在呆若木鸡的荷取怀里，“过程完全符合《生物伦理法》，且你的汗水具有极佳的导热性。记得把图纸收好，别让它掉进水里糊了。”"
  FRA_Gensokyo.100.a: "“这就是资源的等价交换。”"

  FRA_Gensokyo.101.t: "蕴含密度的鬼之余屑"
  FRA_Gensokyo.101.desc: "博丽神社的宴会正如火如荼地进行着，空气中弥漫着劣质清酒的味道和足以震碎耳膜的笑声。八意永琳站在鸟居下，推了推眼镜，目光锁定在正抱着酒葫芦倒头大睡的伊吹萃香身上。她的目标是“从萃香的角上磨下的粉末”——鬼角是浓缩了“密度控制”权能的骨质结构，其磨下的粉末是炼制【空间压缩药剂】或【物质崩毁炸弹】的极品催化剂。\n\n“哎呀，永琳，你是来陪我喝酒的吗？”博丽灵梦一边数着赛钱箱里仅有的三枚硬币，一边有气无力地打着招呼，“如果你能把那个醉成一团的家伙从我的走廊上挪走，我可以考虑让你在神社后院非法行医一次。”\n\n永琳优雅地从药箱中取出一把闪烁着寒光的月都特制金刚石锉刀，以及一瓶散发着致命香气的“月都陈年醇浆”：“灵梦小姐，我只是来帮萃香小姐进行一次必要的‘角部护理’。如你所知，鬼角的过度生长会导致大脑密度失衡，进而引发长期的宿醉和胡言乱语。”\n\n就在这时，萃香似乎闻到了药瓶里的香气，她迷迷糊糊地嘟囔着“好香……”并试图翻身。永琳瞅准时机，先将那瓶极浓缩的酒香药剂放在萃香鼻尖，诱导这位小鬼进入更深层的“酒力幻梦”。紧接着，永琳的手腕化作一道残影，金刚石锉刀以高频振动的姿态掠过萃香那对巨大的鬼角。\n\n伴随着一阵轻微的、如同金属摩擦般的悦耳声响，在那对角最尖锐、能量最密集的边缘，一层细密如星尘的银灰色粉末被永琳用磁性采集盘精准地吸附殆尽。\n\n从萃香的角上磨下的粉末在盘中沉重得不可思议，虽然只有小小的一捧，却散发出足以让周围引力产生微小扭曲的强悍波动。\n\n“采样完成。”永琳将粉末倒入特制的铅芯玻璃瓶封存，对着刚好醒过来、正摸着感觉“变轻快了”的角的萃香微微颔首，“萃香小姐，这种轻微的磨损能让你下次变大时不会因为角太重而闪到脖子。至于那瓶药酒，就留给你们继续狂欢吧。”"
  FRA_Gensokyo.101.a: "“这只是为了神社的结构安全。”"

  FRA_Gensokyo.102.t: "命运红月的生命源泉"
  FRA_Gensokyo.102.desc: "红魔馆的露台被厚重的蕾丝遮阳伞严实地覆盖着，空气中飘荡着顶级红茶的香气，以及一种属于吸血鬼领地的微甜腥气。八意永琳端坐在蕾米莉亚·斯卡蕾特对面，优雅地放下一枚空茶杯。她的目标是“蕾米莉亚的鲜血”——这种血液中蕴含着强大的“命运扭曲力”与“不老不死的伪生命能”。\n\n“八意医生，你盯着我的手腕看了整整十分钟，这可不是一个合格客人的礼仪。”蕾米莉亚摇晃着手中的红酒杯，猩红的瞳孔带着一丝戏谑，“怎么，是觉得这杯‘B型血红茶’不合胃口，想亲自尝试一下我这位馆主的‘原汁原味’吗？”\n\n十六夜咲夜正笔直地立在蕾米莉亚身后，指间微微闪过飞刀的寒光：“八意大人，如果您有任何冒犯大小姐的举动，这里的时钟将为您停止跳动。”\n\n永琳面不改色，从随身携带的银色急救箱中取出了一支闪烁着冷光的纳米针头和一瓶紫色药剂：“大小姐，您最近是否感到命运的波动过于剧烈，导致您在‘威严’的维持上显得有些力不从心？我察觉到您的血液中由于长期饮用含有添加剂的人工血浆，产生了一种名为‘命运沉积’的代谢废物。如果不定期进行‘医疗性放血’，您的下一次符卡宣言可能会因为魔力堵塞而哑火。”\n\n蕾米莉亚的表情僵住了，她确实感觉到最近捉弄灵梦时的成功率有所下降。永琳趁热打铁，将那瓶紫色的“月都纯化液”推了过去：“作为交换，我会帮您净化体内的血液流向。而那部分‘排出的废物’，则由我作为医学标本回收。”\n\n在咲夜警惕的注视下，永琳以一种近似艺术的优雅姿态，用纳米针头在蕾米莉亚白皙的指尖轻轻一旋。没有任何痛感，甚至在伤口出现的瞬间，月都的止血活性剂就已同步生效。\n\n蕾米莉亚的鲜血顺着透明的软管流入真空瓶，它并未呈现普通的红色，而是像液态的红宝石一般，在阳光遮蔽的阴影中散发出妖异且高贵的紫红光泽。\n\n“采样完成。”永琳迅速将采样瓶存入深低温冷冻仓，对着蕾米莉亚微微躬身，“您现在的‘威严’已经通过血液循环得到了重启。顺带一提，咲夜小姐，那份血液标本的浓度足以证明大小姐的血统纯度，您可以放心了。”"
  FRA_Gensokyo.102.a: "“这就是高端的预防医学。”"

  FRA_Gensokyo.103.t: "绝对零度的笨蛋力"
  FRA_Gensokyo.103.desc: "雾之湖的湖面上，寒气以一种极不科学的方式在局部凝结。八意永琳撑着一把遮阳伞，站在没过脚踝的冰冷湖水中，目光锁定在正试图将一群青蛙速冻成“艺术品”的琪露诺身上。她的目标是“琪露诺制作的冰”——虽然这冰块看起来平平无奇，但由于产自“幻想乡最强（自称）”之手，其内部结构充满了混乱的妖力，能让任何化学反应在瞬间处于【思维停滞】状态。对于炼制【缓释型灵魂安定剂】来说，它是绝佳的稳定剂。\n\n“喂！那边的白大褂医生！你是想来挑战最强的琪露诺大人吗？”琪露诺背后六片冰翼剧烈扇动，溅起一地的冰渣，“如果你是想抢我的青蛙标本，我可是会把你冻成大冰棍的！”\n\n大妖精在旁边惊慌地挥着手：“琪露诺，快住手！那是永远亭的八意医生，她一挥手就能让你吃下一年份的苦味药水！”\n\n永琳优雅地从药箱中取出一支镶嵌着月亮碎片的测温计，以及一盒散发着诱人甜味的“月都浓缩炼乳”：“琪露诺小姐，我对你的青蛙没兴趣。我是在进行一项关于‘幻想乡硬度最高晶体’的科学评选。根据我的初步观测，整个雾之湖只有你亲手制造的冰块，才具备那种‘连智慧都能冻结’的极致寒冷。”\n\n“嘿嘿，那是当然！我可是最强的！”琪露诺立刻挺起胸膛，双手叉腰，周身的寒气瞬间暴涨，“看好了！这就是最强的冰！”\n\n只见她大喝一声，双手之间猛然压缩出一块散发着刺眼白光的冰晶。永琳在那冰晶成型的一瞬间，指尖轻弹，一枚带有磁场的收集针精准地刺入了冰块的核心。\n\n琪露诺制作的冰被永琳顺势收入了保温箱中。这块冰在容器里不仅没有融化，反而因为接触到了永琳的袖口，试图将整件衣服都变成硬邦邦的“冰雕”。\n\n“采集完成。”永琳将那盒炼乳丢给了双眼放光的琪露诺，“这是给‘最强冰块提供者’的奖品。顺带一提，这种冰块如果含在嘴里，能让你在思考加减法时，大脑由于物理性降温而不再感到‘发热’。”"
  FRA_Gensokyo.103.a: "“科学地利用‘笨蛋’的力量。”"

  FRA_Gensokyo.104.t: "审判法国王室"
  FRA_Gensokyo.104.desc: "昏聩无能的法国皇室丢下了他们的祖国，带着可悲的旧贵族和金银财宝逃亡新大陆，这并不是什么光辉的事情，在漫长的历史中，他们和这片土地的联结已经逐渐被切断，忘记了自己根本的民族是不可能获得成功的。\n现在，我国已经从铁与血中崛起，成为世界中最令人瞩目的力量，并且成功收回了我国在北美的旧殖民地，幻想乡再次成为跨越大洋的巨型殖民帝国，法国的旧皇室与贵族已经被我们控制，成为案板上的鱼肉任人宰割。\n我们应该如何处置？施以仁慈还是严惩不贷？"
  FRA_Gensokyo.104.a: "铁证如山，严惩不贷，学习伊比利亚宗教裁判所的精神。"
  FRA_Gensokyo.104.b: "让乐园的裁判长四季映姬大人进行绝对公正的裁判。"
  FRA_Gensokyo.104.c: "阿弥陀佛，我佛慈悲，让圣白莲进行大方的裁判。"
  about_half_nfa_character_add_in: "大约一半的法兰西角色将会加入我们"

  FRA_Gensokyo.105.t: "“新秩序”的降临"
  FRA_Gensokyo.105.desc: "随着最后一批选票统计完毕，原本喧闹的国民议会大厦陷入了死一般的沉寂。那个曾经被视为“退伍兵怪谈”的组织——国民阵线，在经历了数月的激进游说与铁腕造势后，以微弱但决定性的优势击败了已经分崩离析的自由党，夺取了多数席位。\n广场上，数以万计的退伍军人、失业工人和被“伟大战争”与“大萧条”创伤折磨的百姓齐聚于此。他们没有欢呼，而是以一种令人不安的、整齐划一的沉默等待着那个人的出现。\n当铃仙·优昙华院·因幡身着笔挺的深蓝色元帅礼服走上露台时，那一刻，夕阳残红。她没有翻开预备好的演讲稿，只是摘下了她的白手套，用那双散发着幽幽红光的双眼环视着下方的民众。\n“幻想乡的人民，”她的声音通过扩音装置在群山间回荡，冰冷而狂热，“漫长的混乱已经结束。自由曾许诺给你们面包，却只给了你们饥饿；民主曾许诺给你们尊严，却只给了你们内讧。现在，我要给你们第三种选择——秩序。”\n人群中爆发出了排山倒海般的呐喊，那是压抑已久的狂气被瞬间点燃的声音。而在不远处，旧政府的官僚们正低头匆匆离开，他们知道，那个由阿求苦心经营的、温和的共和时代已经随着这道浪潮，彻底崩塌在了历史的废墟之中。"
  FRA_Gensokyo.105.a: "幻想乡，挺起胸膛！"

  FRA_Gensokyo.106.t: "大政奉还"
  FRA_Gensokyo.106.desc: "将摄政权杖交还的那一刻，铃仙的心里有些空荡荡的，好像有什么东西被无形的大手抽走了。\n旁边观望的因幡帝上前安慰：“摄政总有还政的一天，现在仗也打完了，你没理由继续赖着不走。朝好处想想，你还可以继续参与首相的竞争，作为战争英雄你应该还有点优势，趁着大众还没把你忘了赶紧做点什么比较好。当然了我可不会让着你，大家各凭本事而已。”\n铃仙愤愤道：“要不是你们在背后给我使绊子，我何至于如此！”\n因幡帝朝她摊手：“你自己之前寻求我们的帮助，寻求我的强运、诸神的人望和月之公主的威望，那就应该做好准备，我们可不是任你摆布的棋子，也是有自己想法的。你有时候太突出了，这可不是什么很值得骄傲的事情哦，任何人之间或多或少都会有分歧，你太我行我素了。\n永琳还有其她几个家伙费了好大力气才说服公主亲自执政一段时间，好在公主姑且是个说话算话的人，应该短期内，几十年里可以指望一下。说这么多，其实我建议你快点行动，有想法的人不止你我，趁着现在还有不少军官和平民没被拉拢，应该未雨绸缪才是。”\n铃仙没有再接话，转身径直离开了大厅——她确实还有几位老朋友应该见见面。"
  FRA_Gensokyo.106.a: "江山辈有英雄出"

  FRA_Gensokyo.107.t: "“公主殿下”"
  FRA_Gensokyo.107.desc: "自古以来我国和月之都就存在紧密的联系，虽然在经济与政治层面偶有摩擦，但毫无疑问我们的文化能够在一定程度上和月之都产生共鸣，费拉不堪的法国王室背叛了这个国家，连同王国共存亡的勇气都没有，他们已经不配被称为这个国家的统治者，只能在世界的尽头苟延残喘。\n\n目前我们的国家需要一面崭新而又鲜明的旗帜，或许来自月之都的公主会是一个不错的选择，老派而不失优点。来自月之都的前公主蓬莱山辉夜是最佳人选，她降临到地面已经有数百年，经历了数次王朝更迭，对地面的情况有完整的了解，同时也在民间有不小的威望。\n\n铃仙和月之公主蓬莱山辉夜同为大贤者八意永琳的学生，往昔也有些来往，尽管铃仙本人对经常以欺负自己为乐的蓬莱山辉夜心存不满，但形势比人强，现在不是计较个人好恶的时候，我们应该请不老不死的月之公主蓬莱山辉夜出山，让她担任国家的名誉元首。"
  FRA_Gensokyo.107.a: "忠君爱国根本性，文韬武略冠异邦"

  FRA_Gensokyo.108.t: "因幡帝"
  FRA_Gensokyo.108.desc: "永远亭，曾经蓬莱山辉夜公主的隐居之地，尽管公主已经将行宫迁入人间之里，但此地仍旧有人留守。\n铃仙将追随自己的卫士们留在外界，孤身一人踏入竹林之内，长筒靴踩在青石板的地面上咚咚作响。\n竹林四周人影窜动，不时能看到一双双红色的眼睛紧盯着铃仙，令她的心里也有些紧张，但她还是坚持继续向前走去。\n眼前出现一处小亭子，铃仙继续向前走去，但在此时异变突生，她脚下的青石板忽然碎裂，一脚踩空的铃仙猝不及防之下，一条腿直接陷了进去，整个人也是一个踉跄差点摔倒。\n铃仙面色无奈，大声喊道：“喂！你们觉得很好玩吗？！”\n四周传来兔子们奚落的嘲笑声，铿锵的脚步声由远及近传来，和多年前一模一样，身穿一袭白衣的因幡帝出现在铃仙面前。\n她拉长声音反问道：“难道不好玩吗？一点简单的陷阱就能让人丑态毕露。”\n“我是和你谈正事来的！你考虑的怎么样了？！”\n“要我和你合作啊…其实也不是不行，公主大人走后，我在这边也有点无聊呢。但我要给手下们一个交代，你给的太少了。”\n“一个实权内阁部长，还有复数的次级实权职务，这还少？你也太贪心了吧。”\n“国运很重要哦，由我帮忙，幻想乡的国运会蒸蒸日上的。你手下的月兔也不够多吧，我的手下们可以填补你的人手空白，她们可有的是时间。”\n“…看在同为妖怪兔的份上，我再让一步，之前承诺的专项财政补贴再加三成。”\n因幡帝咧开嘴，露出灿烂的笑容：“早这样不就好了嘛！这事情我入伙了，三天之内你就会看到效果，最近可以去买点彩票之类的。”\n“谁会需要那种堕落的东西，将希望寄托在那种东西身上的都是白痴。”\n“那我换一个方法咯。”因幡帝耸肩，然后献宝似的捧出一个签盒。\n“你干什么？”\n“来吧，抽一根试试。”"
  FRA_Gensokyo.108.a: "如果没抽好就准备吃麻辣兔头吧！"

  FRA_Gensokyo.109.t: "八意永琳"
  FRA_Gensokyo.109.desc: "人间之里，，辉夜公主的临时宫殿。\n尽管法国王室留下的宫殿没有被拆除，但由于他们抛家舍业的名声实在太臭，让新的公主殿下住进去也不太体面，所以只能暂时先准备一个临时住所。算不上金碧辉煌四处鎏金，但确实也配得上蓬莱山辉夜的公主身份。\n铃仙走在宫殿内，没有去拜访蓬莱山辉夜，而是径直来到一处偏殿，八意永琳正在其中做着实验。\n她恭敬的行礼：“师匠，多日未见您风采依旧啊。”\n八意永琳全神贯注的盯着试管，没有分神关注她，但嘴上也在说话。\n“你倒是学会阿谀奉承了，时间过得真快。”\n“我们总是会改变的，最近学生在幻想乡的行动让学生有了很多长进。”\n“因为知道你的长进，我才知道你此番前来，肯定不是找我叙旧的，有什么事快点说吧，别耽误我的兴致。”\n“学生希望资助您的研究，不管是场地、人手、资金还是材料都好说，只要您能将成果和我们分享。”\n“有问过公主那边吗?”\n“现在说话的是我和师匠，有什么必要征得公主殿下同意呢？”\n八意永琳用眼角余光瞥了她一眼：“也可以，正好我最近有点感兴趣的课题。”\n“学生还给师匠准备了内阁的位置，您可以用心辅佐公主殿下了。身为月之头脑的您又有了可以一展身手的舞台，说不定这是一件大好事。”\n“以前的事情就用不着说了，总之既然你将责任交给我，我姑且就先试试看吧。顺便我这个新药你要不要试试看，应该是可以延年益寿的，大概。”\n“我才不要啊！！”"
  FRA_Gensokyo.109.a: "真的神医不止能治病，还能制病"

  FRA_Gensokyo.110.t: "藤原妹红"
  FRA_Gensokyo.110.desc: "博丽大结界，幻想乡与魔导国冷战的最前沿。\n四五名月兔联手勉强按着一个瘦弱的白色身影，七手八脚地将她押到铃仙面前。\n藤原妹红不满道：“喂！抓我作甚啊，我好像也没招惹你们吧？！”\n铃仙则耐心的跟她解释：“根据新法律，你在军事基地附近形迹可疑，可以被认为是出卖国家机密的间谍。”\n“我是间谍？”藤原妹红哑然失笑，“那你就判我呗，我看看该怎么罚。”\n“正常来说罪名成立，可以判处死刑或者二十年以上的监禁。”\n“那你们就按最大的来，枪毙我五分钟好了，随你们的。”\n面对一副无赖模样的藤原妹红，铃仙叹了口气。\n“我是来和你谈正事的，现在国家危难之际，需要你的帮助。”\n“我为什么要帮一群兔子？”\n“你帮的不是我这个月兔，也不是兔子们，而是整个幻想乡，幻想乡不是我的国家，也不只是人类的国家，是所有幻想乡人的国家，你能明白吗？现在危险的敌人太多了——圣杯佬、魔导国、苏联人、法国余孽乃至德意志人，都是我们潜在的竞争对手啊。稍有不慎，国家就有可能陷入万劫不复的境地。”\n这种严肃的说辞让藤原妹红语气正经了一点：“你都想让我干什么？”\n“你一直在试图保护幻想乡内处于弱势的人们，现在我希望你将这种使命发扬光大……”"
  FRA_Gensokyo.110.a: "老妹儿，借个火。"

  FRA_Gensokyo.111.t: "欧洲之主"
  FRA_Gensokyo.111.desc: "欧洲最伟大最统一的时代是什么时候？有关这个问题，有人会说罗马帝国，有人会说法兰克王国，还有人会说是大革命时代，现在他们在谈论的时候可以多一个选择了——就是现在，此时此刻。\n\n得益于伟大战争的胜利，我们成功缔结了欧洲有史以来最强大的联盟，半个欧洲的精髓尽入我们之手，我们现在完全有资格自称为欧洲大陆的主人。\n\n公民们，为幻想乡三呼万岁，没有一个国家像她这样光彩照人，没有一个国家像她这样强盛美丽，这就是我们的祖国，我们是欧洲的主宰者。"
  FRA_Gensokyo.111.a: "圣杯佬和德国佬，多看多学吧！"

  FRA_Gensokyo.112.t: "我们的红苹果"
  FRA_Gensokyo.112.desc: "幻想乡的一处边境小城，一名妖怪兔正在慷慨激昂的进行演讲。\n“‘和我月薪三十幻想乡磅的有什么关系’这种思想完全是一派胡言，那些质疑国家的人都应该看好了！看看我们伟大的政府和军队正在做些什么！一百多年前的那场战争让我们失去了几乎所有的海外殖民地，非洲殖民地还是我们拼尽全力才从圣杯佬口中抢过来的。\n我们现在拥有了强大的军队，已经足以从法国佬手中抢回失去的一切了。我们将会夺回路易斯安娜、夺回幻想乡属印度支那，甚至再开拓一片更加广大的土地！\n看看我们的生活吧，从右翼政府上台之后是不是更好了？我们能买得起小汽车，负担得起房子，甚至还能在休假的时候负担出游的花费，供孩子们上我们想都不敢想的学校。每年的经济景气都很好，就算在战争时我们也没少过衣食，战争结束后我们更是赢得了几乎一切曾经失去的东西——尊重、荣誉和繁荣已经在握。\n只要我们再赢下当前的这场战斗，我们的生活一定会更好！想想殖民地都有多少红苹果在等着我们采摘。糖、牛肉、矿产、木材、棉花、黄金，这些都会运回祖国供我们使用，我们将会过上比罗马贵族还要幸福奢侈的生活。\n所以不要再说蠢话了！这是我们文明的战争，和我们每个人的一切都有关系。”"
  FRA_Gensokyo.112.a: "我要成为全殖高手！"

  FRA_Gensokyo.113.t: "第四次守矢神社会议"
  FRA_Gensokyo.113.desc: "幻想乡目前最大的神社守矢神社内，几人正在沉默无言的面面相觑，谁也不知道应该如何开口，尴尬的气氛萦绕在整个房间。\n最终，换上一身巫女服的伊吹萃香开口打破循环。\n“灵梦不在，由我代行神主职责，我也没那么多讲究，所以就直接说了吧，辉夜那家伙的建议你们觉得怎么样？我先说了，我觉得很好，因为这样我就能省事了，今天跟白莲的信徒闹矛盾，明天跟神奈子的信徒斗殴，好无聊。”\n八坂神奈子手中端着一小杯酒，一边品酒一边随意道：“我倒是觉得不坏，这么多年了，我们之间吵也差不多吵腻了。其实有什么说不开的东西吗？无非就是下面的信徒比较活力充沛而已。”\n同为东道主的洩矢诹访子附和：“铃仙并不想打压诸神，反而有意提携，我们不妨接下这个顺水人情。能保证信徒数量的话，我们那些争执也不过芥藓之疾。”\n圣白莲没说话，只是微微点头表示同意。\n在场众人最后将视线投向	丰聪耳神子，她迫于无奈也只能同意：“其实我想说应该更加和而不同，偶尔带着信念吵吵架辩经也很好，可以打发时间，但确实是对社会发展不利，拖累民间大量的精力，所以好吧，我也同意了，会约束手下，同时尽量宣传宗教和解。”\n伊吹萃香继续试图主持会议：“那么很好，我们这些宗教领袖全部统一意见，下面的人也会慢慢改正吧，我们又不是法国人的十字教簇拥，不要求唯一，没那么核心的矛盾，一年十二个月，完全可以春天信博丽神道、夏天信佛、秋天信守矢神道、夏天信神子的道教，话说开就好。”\n八坂神奈子打断试图装正经的伊吹萃香：“总之，当浮一大白！”\n说罢就自顾自地喝起酒来。\n洩矢诹访子则招呼下人开始准备正式的酒宴，此举引起了其她两人的一致认同。\n“诹访子上道，到点了就该吃饭，没什么问题在宴会上解决不了。”\n“是啊！不过吃什么？”\n看着已经不正经起来的几人，伊吹萃香也没什么好办法，只好无奈的笑着加入其中。\n“来人呐，换大盏！”"
  FRA_Gensokyo.113.a: "干杯！"

  FRA_Gensokyo.114.t: "黑白老鼠"
  FRA_Gensokyo.114.desc: "人间之里，香榭丽舍附近的高级住宅区，雾雨魔理沙被数名警察团团包围，尽管已经被戴上了手铐，但她丝毫不惧，挺起胸膛气势十足的看着对面的铃仙。\n“现在你们演都不会演了吗？我承认我和你政见不和，但应该也没做什么错事，凭什么要抓我？！”\n铃仙平淡的摇头：“我没那么无聊，不是针对你，只是就事论事而已。红魔馆那边报案，你多次偷盗那边的书籍，我们布下的式神也有多次监测到你带着书本回到宅邸，那些书本经过我们检查，就是红魔馆的藏书。所以抓你是理所当然，这是一桩典型的偷盗案件。”\n雾雨魔理沙语气弱了不少：“我之后也会还回去的，偶尔确实会忘一部分在家里没错就是了…”\n“总之证据确凿，你应该为此付出代价，恭喜你成为第一个被信用系统处罚的魔法使。我们会下调你的信用评级，除了最基本的罚款之外你还需要再进行社会义务劳动和接受定期再教育，如果红魔馆那边坚持的话，四季映姬会对你进行处罚，比如监禁和言语教育之类的。”\n“唯独后面那个绝对不要啊！！！”雾雨魔理沙凄惨的叫了起来。\n“总之一路顺风，这次是特别来看望你的而已，本来这种小事用不到我出面。”\n铃仙风风火火的离开现场，留下一脸悲愤的雾雨魔理沙被警察们押上警车。"
  FRA_Gensokyo.114.a: "致敬传奇捕鼠人"

  FRA_Gensokyo.115.t: "吉祥物结局"
  FRA_Gensokyo.115.desc: "位于人间之里的新王宫，八意永琳推开房门，将一份报告呈给还在睡懒觉的蓬莱山辉夜。\n“有件事情公主大人不得不重视一下，铃仙要求您正式任命她为摄政，并且不限制期限。”\n蓬莱山辉夜揉着眼睛：“我看没什么不好，她愿意管让她管好了，我没意见。每年该给我拨过来的吃穿用度别少了，我也就会出席一些活动，权当领工资了。”\n“这样您可就真正意义上告别权力中心了，执政权力会彻底到她手上。”\n“本来我也不想要，是铃仙找上门要我当国王的，给她也无所谓，我还嫌麻烦呢。就这样吧，姑且你可以随意，继续和她玩玩参与政治也没事，那些实验也无所谓，我觉得虚君挺不错，不耽误我日常生活。”\n面对这个被架空但却没什么意见的国王，八意永琳无奈的退出房间。"
  FRA_Gensokyo.115.a: "双赢结局"

  FRA_Gensokyo.116.t: "赤蛮奇的日常工作"
  FRA_Gensokyo.116.desc: "夜晚，借着月色的掩护，一颗悬浮在空中的头颅扫过一间洋房的窗户，开始观察内里的情况，两人正在屋里密谈，同时桌子上有个大信封。\n赤蛮奇留在院子外的身体同时用笔记本开始记录——水利局长罗兰，勾结工厂挪用水坝发电量，收受贿赂。\n如果不出意外，这份报告明天就会被交给当地的青年团，然后再由他们将贪官捉拿归案，进行审判和惩戒。这是她这个月检举的第七个人，而她的任务目标不止是贪官污吏，还有极左翼分子和外国人，乃至是其他城镇的平民百姓。\n铃仙统治的第一年开始，她就在铃仙的青年团手下工作，一方面是因为该死的大萧条，当年什么工作都找不到，另一方面是她觉得这个工作其实还不错，很有社会价值。\n她对这些破坏国家稳定的人没有好感，做这个工作很有动力，事实证明国家在全国人的努力下就是越来越好了，算上绩效，她每个月都能攒下大概二十幻想乡磅，这比她之前的工资都高。\n妖怪们进行风险排查、人类的警察和会计进行抓捕和统计，最后的审判则交给公正的阎魔，一整个流程充分体现了幻想乡多民族的特点，幻想乡编织出了一张无形的大网，兜住了社会中的所有人。\n如果遵纪守法，不对国家说谎，日子可以过得很不错，但如果还抓着以前的老黄历不放，对国家有所隐瞒，那么结果会很不体面。\n飞出去的头颅回到身体，心中为这位官员默哀三秒，赤蛮奇离开这条街道，开始根据民众的检举寻找下一位目标。"
  FRA_Gensokyo.116.a: "咎由自取而已，好死。"

  FRA_Gensokyo.117.t: "接力长跑"
  FRA_Gensokyo.117.desc: "铃奈庵，幻想乡的一间书店内。\n“中央已经决定了，有你来续写《幻想乡缘起》!”八意永琳对本居小铃吩咐道。\n“不是我谦虚，但还请另请高明吧，我何德何能借此重担啊！”本居小铃礼貌地回绝。\n八意永琳也不恼火，继续解释：“自从稗田阿求死去之后，《幻想乡缘起》的续写工作就一直被搁置了。正常来说是等稗田氏的人轮回转世，之后长大成人继续写作。但你也知道，我们的国家现在正在高速发展，新的国土包含了新的民族和新的历史，这一切都需要纳入《幻想乡缘起》之内，等不及新的稗田氏之子了。”\n“那我推荐主持过史书编撰工作的丰聪耳神子，她比我经验丰富，也有威望，我不过是无名小卒而已。”\n“这是稗田阿礼死前的要求之一，她同你是旧识，选择你应该是有原因的，我们选择尊重本人的意愿。”\n本居小铃陷入沉默，很久之后才开口：“我都需要做些什么？”\n“很简单，之前的《幻想乡缘起》都要写什么，你就继续续写什么。当然有些涉及价值观的部分，需要我们把关，这点会有人帮助你进行确认，无须担心。”\n她叹了口气：“这会让一部伟大的作品变成庸俗的政治宣传读物。”\n“没有作品不存在立场，区别只是选择什么样的立场而已。如果你能参与其中的话，说不定结果会好上一些，可以和我们据理力争一下，我们也不是完全不通人情。”\n“那好吧，我们什么时候开始，又怎么安排？”\n“先从修改之前辉夜公主的内容开始吧，其中的一些记录有失公允了。”"
  FRA_Gensokyo.117.a: "伟大才需多言"

  FRA_Gensokyo.118.t: "竹光望月夜"
  FRA_Gensokyo.118.desc: "人间之里的夜晚一向是被喧嚣占据着，人类、妖族已经习惯在华灯下延续白昼时的生活状态，毕竟劳累总需要快乐来平衡。\n中央官邸区是少数能在宁静环境中观赏每月朔望变化的地方之一，据藤原妹红所言，除了静谧的竹林，只有“自家的住宅”能够称得上是理想的工作区，这也是为什么官邸核心办公室窗外移植了大片青翠的竹林，即使人间之里的气候并不适宜迷途森林的竹子生长。\n“哟！”，办公室大门被一脚踹开，妹红扯下身上的礼服随手扔到沙发上。“辉夜！今天的报告还没看完吗，美妙夜晚都要结束咯。”双手插进裤兜的白发不死鸟一屁股坐上办公桌，饶有兴致地看着趴倒在文件上的蓬莱山辉夜。\n“你知道把这些啰里吧嗦的陈腐文字全塞给我是不会有好结果的，为什么不能让慧音来解决呢，她看报告比我看小说都快。”辉夜仍然把脸埋在纸堆中，油润了几个世纪的黑长直居然在金色灯光下略显杂乱。\n“唉呀，我只不过想看看饱读诗书的大小姐会不会在安逸的办公室里面对正经工作依旧怡然自得嘛，反正我们俩都不会过劳死，多折腾一点也没关系。”\n妹红快步走到辉夜身后，两只手探入那黑色长发里：“内阁又不提供加班费，不如我们久违地出去放松一下，今晚普莉兹姆利巴乐团可是表演到凌晨呢。”，温热的食指和拇指揉搓着辉夜柔软微凉的耳廓，这种程度的按摩当然还无法唤醒辉夜执意”沉睡“的心灵，她的大脸仍然紧贴着桌上的文件堆。原本轻柔摩挲着耳边的指尖立刻用力掐住下方Q弹的脸蛋，妹红轻轻俯下身，将嘴唇凑近辉夜耳边缓缓吹到：”待在这种充满权钱气味的地方，宅太久对身心可都不太好呢，我的月光小姐。“\n辉夜被那双“炽热“的手拉起，自然地靠在了椅背上，两人一俯一仰四目相对。”你不就是想去露天剧院一边享受音乐一边享受满月夜的月光吗，月光今天已经累了，不想去那喧闹场所，三个工作日从早到晚都没和你接上话，难道我就应该被这样晾在办公室里被你随意差遣吗。”，妹红看着辉夜微红的脸颊，直接打开桌下一个抽屉，拿出两只竹\nZ筒杯。“既然如此，我还是稍稍尊重一下月都大小姐的意愿吧，今晚就你和我，不必离开官邸，在这里~共饮一杯？”，掏掏贴满符卡的红色口袋，桌上多出了一瓶雀酒。\n办公室照明忽然熄灭，月光在午夜时分恰好透过窗打在辉夜和妹红身上，照亮了桌前。妹红推开窗，清新的空气混着竹林的味道涌入房间，辉夜转过身来看向天空中一轮明亮的满月，手中被塞进一只竹筒杯。\n“你这家伙，工作日饮酒小心回永远亭被永琳敲头哦，肯定还要罚你和那两只兔子睡一起。”，辉夜拿好杯子，接下清澈闪光的酒液，嘴里仍然嘟囔着几天来妹红的“罪状”。\n“不要搞错了，辉夜，现在我才是永远亭的老大，先想想怎么弥补我露天剧院包厢的损失吧，因为你，今天我特意把官邸的日常电源关掉了，连音乐广播都听不到，怎么着也得还我双倍的“月光”才行，作为惩罚，从明天起休息室不再提供棉被，今晚过后，你就准备裹着妖怪之山的廉价毛毯睡觉吧哈哈。”藤原妹红轻抿一口竹筒杯中的酒液，低头看向仍然凝视着空中明月的蓬莱山辉夜和杯中倒映的满月，。"
  FRA_Gensokyo.118.a: "她撩起辉夜的长发，一向平淡的脸上流露出微微笑意。"

  FRA_Gensokyo.120.t: "小秘书蘑菇碳的第一天"
  FRA_Gensokyo.120.desc: "僭主蓬莱山辉夜僭位的第一天，藤原妹红便被强行抓来作为她的秘书，她别无选择，为了慧音老师的安全，也为了她心中怀有的理想，她只能强行扯出一副笑容去面对自己那位万年宿敌。\n“她会对我做什么呢？对我施加暴力？给我多到做不完的工作？到处找我的错处刁难我？”，在前往僭主办公所在地的路上，无数的念头，无数可怕的画面从她的脑海中闪过，但终于，她来到了那个房间门口"
  FRA_Gensokyo.120.a: "妹红推开了房门"

  FRA_Gensokyo.121.t: "华丽的女仆装"
  FRA_Gensokyo.121.desc: "她看见了什么？一件女仆装？！\n辉夜只是带着神秘的笑容，而几名仆从在一旁托举着那件堪称华丽的女仆装——为什么女仆装要做的这么华丽啊——很明显，这是让她换上的意思\n妹红的脸从白变红，整个人身上仿佛有蒸气升腾，她有一瞬间准备和这个混蛋爆了，但是辉夜只是用眼神向妹红指示了一下哨兵的所在，很明显的威胁不是吗？但是妹红屈服了，辉夜确实杀不了身为不死人的她，但却可以轻易地杀死她的所有同伴，摧毁她为之奋斗多年的事业，相较之下，一件衣服而已，不过是这个宿敌这么多年来的第一次胜利，就让让她吧\n妹红接过了那件女仆装，几位侍女准备服侍她穿上这件过于华丽繁琐的服侍——所以到底为什么要把女仆装做成这样啊！——妹红刚脱下外衣，正准备穿上这件华丽的服饰，便看见几位侍女拿出了两件贴身衣物，有着华丽的蕾丝边，用纯白的丝绸纺织而成的贴身衣物，而不远处那个混球还在饶有兴致地注视着自己，仿佛正等待着自己主动向她展示自己的一切，但妹红别无选择了，葱白的玉指划过自己的后背，轻轻解开扣带，如洁白大理石般的小山丘显露而出，正当妹红准备进一步褪去最后的屏障时，一只手突然抓住了她的手腕阻止了她的动作。\n那是一只柔弱无骨的小手，并没有用多大的力量，但妹红并没有勇气去抵抗辉夜的意志，只能由着那只手在自己的蜜桃附近肆意游转，由着辉夜为自己褪去衣物，让自己完全对她展示一切，感受着身上传来的酥麻，妹红不由得闭上了眼睛，等待着辉夜进一步的动作\n然而预想之中的进一步冒犯并没有到来，辉夜只是带着促狭的笑容看着她，这让妹红的脸从白里透红彻底变成了一片通红，但她有什么办法呢，只能默默的接受这可恨的宿敌强加于自身的一切\n出乎妹红的意料，接下来的一整天辉夜只是让她协助工作，并没有再对她进行任何的骚扰，也没有预想之中的各色刁难，仿佛辉夜让她穿上这身女仆装仅仅只是为了满足她的恶趣味——这么一看，辉夜可能人还不错？不不不，绝对不能这么想，这家伙和自己已经相杀上千年了，她绝对还有别的阴谋\n到太阳完全消失在地平线之下时，桌上堆积的文件终于全部消失了，妹红以为自己终于完成了自己的任务，起身准备向辉夜道别，赶紧逃离这个让她心中充满不安的地方\n“辉夜陛下，我的任务已经完成了，可否允许我返回自己的住处呢？”\n“好啊，”辉夜嘴角再次勾起令妹红感到不安的笑容，“侍女们，请带妹红小姐前往她今后的住处”"
  FRA_Gensokyo.121.a: "她到底要干嘛？"

  FRA_Gensokyo.122.t: "辉夜陛下的游戏时间"
  FRA_Gensokyo.122.desc: "辉夜为妹红提供的房间很好，有着不显奢华但令人舒适的装潢，有一个装满了各色华美服装和饰品的衣柜，甚至陈列了数台引进自超次元的游戏机，毫无疑问这是一个很适合居住的房间，但越是这样越是会让妹红发自内心的感到不安——辉夜那家伙能有这么好心？\n在房间内坐立不安了一段时间之后，随着门把手的转动，一个妹红不是很希望看见，但是早已料到的身影出现在了房间内\n“陪我打一会游戏吧，妹红卿”，辉夜拿起了一个手柄，向妹红发出了游戏邀请，很显然，妹红没有能力拒绝这一邀请，只能硬着头皮也拿起了手柄和辉夜玩起了游戏\n单机游戏，对抗游戏，合作游戏，数个小时的时间飞速流逝，在两人合力击败一个BOSS之后，妹红终于没有控制住谨慎小心的状态，欢呼出声“好耶！终于打掉这家伙了!”\n很快妹红便反应过来自己刚刚干了些什么，红晕再次迅速染上她的脸颊，而辉夜则投来饶有兴味的目光\n“已，已经很晚了，陛下，要不您先安寝，明天还会有很多繁重的国务需要处理”，妹红略带颤音的说出这些内容，试图稍微掩盖自己刚刚所说出的内容，然而这一句话刚出口她就后悔了\n“哦，妹红卿，您这话是在说我沉迷享乐，荒废国事吗”，辉夜作出愤怒的样子，“但不正是爱卿你在这里诱我堕落吗”，辉夜站起身来，向妹红前进了一步，“爱卿是想通过这种方式向我发泄不满吗”，妹红被辉夜这个架势吓到了，往后退了一步，“还是说，因为爱卿的不死之身，你觉得无论怎么做我都拿你没任何办法呢？”\n随着辉夜的步步逼近，妹红一不小心在后退的过程中被乱摆的游戏机绊倒在地，被辉夜逼到了墙角，辉夜低下身来，差一点就整个人压在妹红身上，然而就在妹红以为辉夜马上就要做些什么的时候，她却后退几步，“爱卿若是不想让我认为你心怀不轨的话，就把这个游戏打通吧”\n妹红看了一眼，不算很难的游戏，主要是要集中注意力，用作惩罚几乎和玩笑一般？她站起身来，正欲接过手柄，辉夜却一屁股坐在了床上，并招了招手，示意妹红坐到自己怀里\n拒绝吗？那恐怕自己的朋友们以后日子就不好过了，妹红只好强忍着羞涩，坐进辉夜怀中，拿起手柄开始游戏，刚开始一切顺利，但正当她完全沉浸入游戏里的时候，突然大叫出声——一双手放到了她的腰上，并开始不断游走，一下失神，她的游戏人物差点死亡\n“爱卿，要专心哦，游戏失败了话——”那双手的主人淡淡的说出了这样的话语，妹红对此毫无办法，只能一遍忍受着不断传来的异样感，一边强行把注意力集中在游戏画面上\n随着又是几个关卡被通过，汗水开始从妹红额头浮现。“爱卿觉得很热吗，那我便为爱卿去除几件累赘吧”，随之而来的是淅淅索索的布料摩擦声，和身上的束缚不断解除的轻松感和凉爽感，几缕不知何处而来的微风确实让妹红有那么一瞬间的松懈，但随之而来的，自胸口处传来的刺激感让她再次开始浑身发热，强忍住发出声音或者回头看一眼的冲动，妹红艰难地打入了游戏的最后阶段\n但就当画面上的人物来到最终BOSS门前的时候，终于那只邪恶的手越过了最终的界限，探入了妹红最隐秘的幽谷，妹红几乎要跳起来，但是辉夜的声音响起了，“爱卿？是有什么不适吗？”于是她又老老实实地忍受着一波又一波冲向大脑的浪潮，艰难地操控着游戏角色进行最后的BOSS战，而豆大的汗珠不断地从她的光洁的额头滑落，她咬紧了牙关，不让声音从自己眼中漏出\n终于，随着一阵音乐声响起，游戏角色成功战胜了最终魔王，而随着一波极致的刺激感传入大脑，妹红也终于控制不住，一丝令人面红耳赤，浑身酥麻的声音从她嘴中漏出，她再也坚持不住，从辉夜怀中滑出，跌倒在地，止不住地大口喘息起来，辉夜则是强行扳过来她的脸，双目相对，她看见了妹红眼中那抑制不住的羞耻和难以掩饰的浓烈情欲，辉夜忍不住露出了满意的笑容，然后吻了上去\n“爱卿，看起来你的嘴不像你的话语那么坚硬啊”\n“陛下....哈啊...请....唔嗯...请您..啾...宠幸我吧”妹红彻底放弃了抵抗，主动地开始迎合起辉夜的一切施为"
  FRA_Gensokyo.122.a: "夜色，逐渐掩盖了这对宿敌的战斗"

  FRA_Gensokyo.123.t: "雨夜之后"
  FRA_Gensokyo.123.desc: "放纵的一夜结束之后，辉夜和妹红惊讶的发现已经日出，而两人显然在前一天晚上是没有得到足够的修养的，面对着即将到来的繁重工作，两人决定用蓬莱人特有的回复方式来恢复体能——互相扭断对方的脖子\n在一进来发现两人气息全无倒在地上的侍女发出的尖叫声伴奏下，两人相视一笑，牵着手准备开始新一天的工作"
  FRA_Gensokyo.123.a: "你们俩不要把不死之身用在这种事上啊！"



  FRA_Gensokyo.138.t: "印度支那战争"
  FRA_Gensokyo.138.desc: ""
  FRA_Gensokyo.138.a: "草！"

  FRA_Gensokyo.139.t: "弹道奇迹"
  FRA_Gensokyo.139.desc: "在前线的实弹演习场上，硝烟尚未散去，空壳弹壳已堆如小山。参谋部的旧派军官们正拿着测距仪和战宽图纸擦着冷汗——按照旧教材的规范，在这样狭窄的阵面上塞入三个重炮营简直是自杀，火炮会互相干扰，后勤甚至会乱成一团麻。然而，坐在高处观测台上的早苗只是轻轻挥动了手中的御币。伴随着一阵诡异的狂风，漫天的炮火在空中划出了惊人一致的平行弧线，精准地将目标高地犁成了一片焦土。\n“看吧，先生们，”早苗转过身，深绿色的双眸中闪烁着狂热的光芒，“传统的战宽限制不过是缺乏信仰的懦夫给自己画的牢笼。在守矢的秩序下，风会为每一门火炮让出道路。从今天起，我们的炮兵不需要撤退，我们只需要更多的钢铁！”"
  FRA_Gensokyo.139.a: "“让敌人在神圣的炮火面前颤抖吧！”"
  tech_Sanae_Artillery: "守矢大炮"


  FRA_Gensokyo.801.t: "福利时间"
  FRA_Gensokyo.801.desc: "因为国民议会还没做完所以希尔决定让你直接通过了！"
  FRA_Gensokyo.801.a: "谢谢希尔"

  FRA_Gensokyo.802.t: "[FROM.Getname]拒绝了"
  FRA_Gensokyo.802.desc: ""
  FRA_Gensokyo.802.a: "太可惜了。"


  FRA_Gensokyo_Alliance.01.t: "北非投票加入"
  FRA_Gensokyo_Alliance.01.desc: "尽管多方势力对此非常惊讶。北非的人民认同合并为幻想乡联盟。在当地人民获得公民权的条件下，国民大会将给予她们对应数量的议席。\n\n虽然三国依然有残余的民族主义分子，但是她们已经被遏制，在短时间里已无力恢复了。"
  FRA_Gensokyo_Alliance.01.a: "她们也与我们一样博爱！"
  FRA_Gensokyo_Alliance.02.t: "北非投票脱离"
  FRA_Gensokyo_Alliance.02.desc: "尽管倾尽所有地方政府的努力，北非仍然拒绝了加入幻想乡联盟的请求。在投票结果公布后，主要城市出现了大量的示威者，而民族分子则开始了庆祝活动以及开始准备将来的全面独立。\n\n幻想乡的北非陆军司令要求对北非地区进行紧急增援，并预计该地区会出现更大范围的恶劣事件。"
  FRA_Gensokyo_Alliance.02.a: "忘恩负义！"
  FRA_Gensokyo_Alliance.03.t: "西非投票加入"
  FRA_Gensokyo_Alliance.03.desc: "经过几周的投票活动，幻想乡在西非的所有领地中的人民都被召集起来进行公投，决定是否成为新的幻想乡联盟的一部分。初步投票结果显示，同意加入联邦的占据大多数。民族主义事业还未萌芽就被扼杀了，而许多抱有独立思想的人士现在正准备从国民大会内部继续斗争以争取更多的政治自决。"
  FRA_Gensokyo_Alliance.04.t: "西非投票脱离"
  FRA_Gensokyo_Alliance.04.desc: "经过一场可以算得上是“激烈的”、混乱的投票活动后，民族主义者似乎已经赢得了幻想乡属西非大部分地区的关于是否加入幻想乡联盟的公投。尽管当地的欧洲裔人口都对这一件事情始料不及，但是独立运动的领导人已经呼吁立刻采取行动，并宣布独立这一结果是完全合法的，应该被实施。"
  FRA_Gensokyo_Alliance.05.t: "中非投票加入"
  FRA_Gensokyo_Alliance.05.desc: "在这个幅员辽阔、欠发达的地区，随着结果的缓慢到来，似乎有微弱多数的选民选择了加入新的幻想乡联盟的全民公投。民族主义团体已经承认失败，但要求新国家在当地发展中投入更多资金，以奖励她们的忠诚。"
  FRA_Gensokyo_Alliance.06.t: "中非投票脱离"
  FRA_Gensokyo_Alliance.06.desc: "随着一个又一个地区投票反对加入新的幻想乡联盟，幻想乡中部非洲各地的亲联盟政党遭受了一系列政治挫折。随着支持独立的政党一个接一个地庆祝胜利，许多积极分子声称幻想乡在该地区的统治已经被彻底击败。"
  FRA_Gensokyo_Alliance.07.t: "南非投票加入"
  FRA_Gensokyo_Alliance.07.desc: "幻想乡管制下的南非经过投票决定加入崭新的幻想乡联盟。虽然许多观察家此前认为该结果可能不高，但当地民众似乎认为，加入幻想乡联盟将确保该地区进入欧洲市场，并引进对当地经济的更多投资。"
  FRA_Gensokyo_Alliance.08.t: "南非投票反对"
  FRA_Gensokyo_Alliance.08.desc: "幻想乡联盟的全民投票结果在南非引起了热烈的欢呼，该地区以压倒性多数投票反对加入新的联邦。由于主要民族主义政党已经宣布公投是变相的独立投票，当地军事指挥官向首都发出了一系列令人不安的报告，并要求增援。"
  FRA_Gensokyo_Alliance.09.t: "埃及投票加入"
  FRA_Gensokyo_Alliance.09.desc: "埃及方面传来报告，埃及的人民在公投中以微小的差距决定，加入新成立的幻想乡联盟。公投的结果出乎了当地官员的意料，她们立即宣布会重新记票。埃及本地的民族主义团体士气崩溃、严重受挫，很多成员开始怀疑，自己是否真的可以代表广大人民的意志。"
  FRA_Gensokyo_Alliance.10.t: "埃及投票反对"
  FRA_Gensokyo_Alliance.10.desc: "埃及公投的结果比意料之中的更为惨淡。虽然首都中很少有相信那块民族主义泛滥的温床会投票加入联邦，但是现实证明，民族主义情结的传播比预料之中的更为广泛。公投结果显示，当地的所有地区中，没有一个以多数支持加入联邦。民族主义者认为现在就是争取民族独立的最好时机，她们叫嚣要立刻脱离幻想乡控制，甚至不惜诉诸战争。"
  FRA_Gensokyo_Alliance.11.t: "东非投票加入"
  FRA_Gensokyo_Alliance.11.desc: "东非方面传来报告，东非的人民在公投中以微小的差距决定，加入新成立的幻想乡联盟。公投的结果出乎了当地官员的意料，她们立即宣布会重新记票。东非本地的民族主义团体士气崩溃、严重受挫，很多成员开始怀疑，自己是否真的可以代表广大人民的意志。"
  FRA_Gensokyo_Alliance.12.t: "东非投票反对"
  FRA_Gensokyo_Alliance.12.desc: "东非公投的结果比意料之中的更为惨淡。虽然首都中很少有相信那块民族主义泛滥的温床会投票加入联邦，但是现实证明，民族主义情结的传播比预料之中的更为广泛。公投结果显示，当地的所有地区中，没有一个以多数支持加入联邦。民族主义者认为现在就是争取民族独立的最好时机，她们叫嚣要立刻脱离幻想乡控制，甚至不惜诉诸战争。"
  FRA_Gensokyo_Alliance.13.t: "刚果投票加入"
  FRA_Gensokyo_Alliance.13.desc: "刚果方面传来报告，刚果的人民在公投中以微小的差距决定，加入新成立的幻想乡联盟。公投的结果出乎了当地官员的意料，她们立即宣布会重新记票。刚果本地的民族主义团体士气崩溃、严重受挫，很多成员开始怀疑，自己是否真的可以代表广大人民的意志。"
  FRA_Gensokyo_Alliance.14.t: "刚果投票脱离"
  FRA_Gensokyo_Alliance.14.desc: "刚果公投的结果比意料之中的更为惨淡。虽然首都中很少有相信那块民族主义泛滥的温床会投票加入联邦，但是现实证明，民族主义情结的传播比预料之中的更为广泛。公投结果显示，当地的所有地区中，没有一个以多数支持加入联邦。民族主义者认为现在就是争取民族独立的最好时机，她们叫嚣要立刻脱离幻想乡控制，甚至不惜诉诸战争。"

#新闻
  FRA_Gensokyo_news.001.t: "$news_event_background$稗田阿求逝世"
  FRA_Gensokyo_news.001.desc: "昨日，幻想乡政府正式宣布，幻想乡现任总统稗田阿求因病抢救无效去世，享年三十岁。\n尽管幻想乡的居民们都知道御阿礼之子因为某些原因而寿命无法超过30年，但当阿求逝世的消息传出时，全幻想乡上下仍陷入了一片悲痛之中，各地都自发组织起了对阿求的哀悼活动，甚至有人试图去彼岸“拯救我们亲爱的总统小姐”。各国也陆续发来了吊唁信，圣杯则宣称愿意出资协助举办稗田阿求的葬礼仪式，幻想乡政府则尚未对此作出答复。\n截至目前，幻想乡的临时委员会已经接替了空出的总统职务，代管选举期间幻想乡国内大小事务。"
  FRA_Gensokyo_news.001.a: "舵手逝世，扬帆再起航！"
  FRA_Gensokyo_news.001.b: "何等悲痛的一天。"
  FRA_Gensokyo_news.001.c: "一位伟人就此离去。"
  FRA_Gensokyo_news.001.d: "让我们恭祝阿求三十大寿！"

  FRA_Gensokyo_news.002.t: "$news_event_background$幻想乡自由党赢得幻想乡大选"
  FRA_Gensokyo_news.002.desc1: "幻想乡，作为大革命与现代民主的发祥地，其民主程序在数十年的混乱与大战中停滞。其总统稗田阿求在大战后带领幻想乡进入了繁荣，并重启了共和国的民主化进程，在数年的准备后，第三共和国的第一届选举已在近日正式结束。\n根据幻想乡的报道，自-民联盟赢得了共和国选举。自-民联盟是幻想乡自由党和独立民主同盟组成的选举同盟，其领袖与候选人是幻想乡自由党的党魁雾雨魔理沙。\n总统雾雨魔理沙与总理爱丽丝·玛格特罗伊德在凯旋门广场发表了公开的就职演说，她们宣誓将继承国母遗志、将幻想乡建设一个“自由的幻想乡”。"
  FRA_Gensokyo_news.002.desc2: "幻想乡，作为大革命与现代民主的发祥地，其民主程序在数十年的混乱与大战中停滞。其总统稗田阿求在大战后带领幻想乡进入了繁荣，并重启了共和国的民主化进程，在数年的准备后，第三共和国的第一届选举已在近日正式结束。\n根据幻想乡的报道，幻想乡自由党赢得了共和国选举。幻想乡自由党的党魁是雾雨魔理沙，魔理沙是幻想乡前总统、“国母”稗田阿求的副手兼总理，是最热门的候选人之一。\n总统雾雨魔理沙与总理爱丽丝·玛格特罗伊德在凯旋门广场发表了公开的就职演说，她们宣誓将继承国母遗志、将幻想乡建设一个“自由的幻想乡”。"
  FRA_Gensokyo_news.002.a: "自由、平等、博爱\n（Liberté,Égalité,Fraternité）"
  FRA_Gensokyo_news.002.b: "希望我们能好好相处"
  FRA_Gensokyo_news.002.c: "这和我们又有什么关系呢？"
  FRA_Gensokyo_news.002.d: "这将是个威胁"
  FRA_Gensokyo_news.002.e: "无论如何，终究是软弱的民主政府"

  FRA_Gensokyo_news.003.t: "$news_event_background$人民阵线赢得幻想乡大选"
  FRA_Gensokyo_news.003.desc: "幻想乡，作为大革命与现代民主的发祥地，其民主程序在数十年的混乱与大战中停滞。其总统稗田阿求在大战后带领幻想乡进入了繁荣，并重启了共和国的民主化进程，在数年的准备后，第三共和国的第一届选举已在近日正式结束。\n根据幻想乡的报道，人民阵线赢得了共和国选举。人民阵线是幻想乡社会民主党、幻想乡共产党与革命共产主义同盟组成的选举同盟，其领袖与候选人是幻想乡社会民主党的党魁茨木华扇。\n总统茨木华扇与总理博丽灵梦在凯旋门广场发表了公开的就职演说，她们宣誓将幻想乡建设一个“人民的幻想乡”。"
  FRA_Gensokyo_news.003.a: "看看人间的苦难，可听见人民在呐喊？"
  FRA_Gensokyo_news.003.b: "希望我们能好好相处"
  FRA_Gensokyo_news.003.c: "这和我们又有什么关系呢？"
  FRA_Gensokyo_news.003.d: "这将是个威胁"
  FRA_Gensokyo_news.003.e: "我们终将击败她们"
  FRA_Gensokyo_news.003.f: "这群修正主义者。"

  FRA_Gensokyo_news.004.t: "$news_event_background$独立民主同盟赢得幻想乡大选"
  FRA_Gensokyo_news.004.desc1: "幻想乡，作为大革命与现代民主的发祥地，其民主程序在数十年的混乱与大战中停滞。其总统稗田阿求在大战后带领幻想乡进入了繁荣，并重启了共和国的民主化进程，在数年的准备后，第三共和国的第一届选举已在近日正式结束。\n根据幻想乡的报道，自-民联盟赢得了共和国选举。自-民联盟是幻想乡自由党和独立民主同盟组成的选举同盟，其领袖与候选人是独立民主同盟的党魁上白泽慧音。\n总统上白泽慧音与总理藤原妹红在凯旋门广场发表了公开的就职演说，她们宣誓将把幻想乡从大萧条的深渊中拯救出来，并使共和国的经济达到新的高峰。"
  FRA_Gensokyo_news.004.desc2: "幻想乡，作为大革命与现代民主的发祥地，其民主程序在数十年的混乱与大战中停滞。其总统稗田阿求在大战后带领幻想乡进入了繁荣，并重启了共和国的民主化进程，在数年的准备后，第三共和国的第一届选举已在近日正式结束。\n根据幻想乡的报道，独立民主同盟赢得了共和国选举。独立民主同盟的党魁上白泽慧音，上白泽慧音作为幻想乡最著名的教授，在知识分子中具有相当的影响力。\n总统上白泽慧音与总理藤原妹红在凯旋门广场发表了公开的就职演说，她们宣誓将把幻想乡从大萧条的深渊中拯救出来，并使共和国的经济达到新的高峰。"
  FRA_Gensokyo_news.004.a: "自由、平等、博爱\n（Liberté,Égalité,Fraternité）"
  FRA_Gensokyo_news.004.b: "希望我们能好好相处"
  FRA_Gensokyo_news.004.c: "这和我们又有什么关系呢？"
  FRA_Gensokyo_news.004.d: "这将是个威胁"
  FRA_Gensokyo_news.004.e: "无论如何，终究是软弱的民主政府"

  FRA_Gensokyo_news.005.t: "$news_event_background$国民同盟赢得幻想乡大选"
  FRA_Gensokyo_news.005.desc: "幻想乡，作为大革命与现代民主的发祥地，其民主程序在数十年的混乱与大战中停滞。其总统稗田阿求在大战后带领幻想乡进入了繁荣，并重启了共和国的民主化进程，在数年的准备后，第三共和国的第一届选举已在近日正式结束。\n根据幻想乡的报道，国民同盟赢得了共和国选举。国民同盟是由国民阵线与全国共和运动组建的选举同盟，其领袖与候选人是国民阵线的党魁铃仙·优昙华院·因幡。\n总统铃仙·优昙华院·因幡与总理蓬莱山辉夜在凯旋门广场发表了公开的就职演说，她们宣誓将逆转以往对外国人的优待政策，全面振兴幻想乡本国人的利益。"
  FRA_Gensokyo_news.005.a: "幻想乡优先！"
  FRA_Gensokyo_news.005.b: "我们终将击败她们"
  FRA_Gensokyo_news.005.c: "这将是个威胁"
  FRA_Gensokyo_news.005.d: "希望我们能好好相处"
  FRA_Gensokyo_news.005.e: "我们终将击败她们"

  FRA_Gensokyo_news.006.t: "$news_event_background$幻想乡共和国发生军事政变"
  FRA_Gensokyo_news.006.desc: "近日，一则重磅新闻从幻想乡共和国传来，“幻想乡的英雄”、“守矢的雄狮”东风谷早苗发动了针对幻想乡共和国总统—茨木华扇的军事政变。\n据消息人士称，幻想乡政变始于洩矢诹访子的突袭，此时政变部队已经俘获了该国大部分海军舰队。凌晨时分，总统卫队接到消息后立即采取行动。茨木华扇命令博丽灵梦通知元帅东风谷早苗增强保卫首都的力量。然而，博丽灵梦在前往总统府途中被政变部队逮捕。\n随后，幻想乡总统茨木华扇率领总统卫队前往总统府，并拒绝了下属们关于出国避难的建议。但局势急转直下。空军副官上白泽慧音通知茨木华扇，东风谷早苗和洩矢诹访子组成的军事委员会要求茨木华扇立即辞职。之后，激烈的冲突爆发在幻想乡首都的街头。茨木华扇拒绝辞职，宣布誓死守卫总统府，并两次向全国发表广播讲话，呼吁人民保卫政府。不过，出于对群众安全的考虑，她最终放弃了发动民众抵抗军队。\n在政变的最后，幻想乡发生了剧烈的战争。飞机轰炸了总统府，茨木华扇及其队伍被迫退入室内。茨木华扇号召战士们放下武器向军队投降。不久后，东风谷早苗宣布幻想乡军政府委员会成立，并宣布国家进入“内战”状态。政变部队开始搜捕左派人士和焚烧左翼书籍。人们对茨木华扇的命运各执一词，她是否已经殉职大为争议。\n现在幻想乡共和国社会已经陷入了完全的混乱状态，军队在城市内以搜捕“茨木华扇残党”的名义，大肆破坏与抢劫，每天都会有人被集中枪毙，大量难民涌入国际红十字会、外国使馆等地寻求庇护。\n对于此次事件，国际观察家普遍认为是茨木华扇政府的政策未能处理好国内资本家的权势，又没能完全得到工农的认同，同时军队不受控制、人民阵线摇摇欲坠共同早就这场军事政变的诞生。\n目前，各国政府与国家组织尚未对此事件发表任何看法。"
  FRA_Gensokyo_news.006.a: "我们自由了......吗？"
  FRA_Gensokyo_news.006.b: "同胞生活在水深火热中，我们必须尽快出兵"
  FRA_Gensokyo_news.006.c: "这是一场屠杀！"
  FRA_Gensokyo_news.006.d: "至少赤匪被清剿了，不是吗？"
  FRA_Gensokyo_news.006.e: "赤匪好似！"
  FRA_Gensokyo_news.006.f: "左派右派，都不是好东西"

  FRA_Gensokyo_news.007.t: "$news_event_background$西非剧变"
  FRA_Gensokyo_news.007.desc: "幻想乡，人间之里—— 在“伟大战争”爆发后的一段时间里，幻想乡政府经历了一系列挫折和战败，最终迎来了命定的终局。这一消息引爆了整个新妖联邦，分裂与对立开始在这片遗留之地蔓延。\n\n在幻想乡政府投降后不久，这些殖民地地区的统治权变得模糊不清。一些殖民地官员迅速转投北美的法兰西政府，并寻求与其合作以维持地方秩序。也仍有一些官员坚决反对着侵略者的统治，试图复兴幻想乡。\n\n法兰西回归主义和幻想乡复兴主义相互交织，进一步削弱了殖民地的稳定性和独立性。自由幻想乡在践行着自己的思想。而突尼斯海岸的难民营还源源不断的接收着逃亡的爱国者。位于沙漠中的一切被丢到一边。\n\n不管如何，西非大分裂已是既定事实。"
  FRA_Gensokyo_news.007.a: "我们还会回来的。"
  FRA_Gensokyo_news.007.b: "就这点东西，也能搞分裂？"

  FRA_Gensokyo_news.008.t: "$news_event_background$红魔馆宣布独立"
  FRA_Gensokyo_news.008.desc: "在大萧条降临后，幻想乡中央政府失去了对地方的掌控力。而引发了“伟大战争”的火药桶--红魔馆再次宣布她将从幻想乡政府独立。\n红魔馆由于特殊的地缘与历史，红魔馆一直以来就在幻想乡中保持了相当自治的地位；1914年3月，就是红魔馆独立危机导致了“伟大战争”的爆发。在“伟大战争”后，幻想乡政府恢复了对红魔馆的管辖地位。但是现在大萧条后，幻想乡的控制力再次下降，红魔馆又成为了反对幻想乡中央政府的急先锋，再次宣布独立。\n幻想乡共和国政府就此事对红魔馆政府发出强烈的外交抗议，并警告斯卡蕾特家族保持克制，否则幻想乡将采取严厉的行动。"
  FRA_Gensokyo_news.008.a: "那群混蛋"
  FRA_Gensokyo_news.008.b: "时机已到！"
  FRA_Gensokyo_news.008.c: "红魔馆又闹独立了？"

  FRA_Gensokyo_news.009.t: "$news_event_background$百慕大会谈成功举行"
  FRA_Gensokyo_news.009.desc: "第二次“伟大战争”后，幻想乡俨然成为了欧罗巴大陆的霸权，然后处于北美洲的“法兰西”依然对幻想乡维持了相当的敌对态度。\n由于历史原因，北美的[NFA.Getname]自称为“法兰西”正统，一直宣称着幻想乡的本土。[FRA.Getname]政府在大战结束后，腾出手的[FRA.Getname]决定解决这个百年难题，她向[NFA.Getname]发出外交照会，在大西洋的百慕大举行会谈。\n在经历了一段时间的谈判后，[FRA.Getname]和[NFA.Getname]达成一致，[NFA.Getname]的领导层与[FRA.Getname]组成联合政府，[FRA.Getname]对[NFA.Getname]的人民开放移民许可，同时美洲的土地宣布独立，留在美洲的新“路易安娜”人将为她们自己的国家奋斗。"
  FRA_Gensokyo_news.009.a: "博爱精神的延续！"
  FRA_Gensokyo_news.009.b: "[ROOT.Getfactionname]的力量正在增强。"
  FRA_Gensokyo_news.009.c: "敌人的力量增强了。"
  FRA_Gensokyo_news.009.d: "幻想乡变得更加强大了。"

  FRA_Gensokyo_news.010.t: "$news_event_background$百慕大会谈谈判破裂"
  FRA_Gensokyo_news.010.desc: "第二次“伟大战争”后，幻想乡俨然成为了欧罗巴大陆的霸权，然后处于北美洲的“法兰西”依然对幻想乡维持了相当的敌对态度。\n由于历史原因，北美的[NFA.Getname]自称为“法兰西”正统，一直宣称着幻想乡的本土。[FRA.Getname]政府在大战结束后，腾出手的[FRA.Getname]决定解决这个百年难题，她向[NFA.Getname]发出外交照会，在大西洋的百慕大举行会谈。\n在经历了一段时间的谈判后，[FRA.Getname]和[NFA.Getname]谈判破裂，双方代表愤然离开会场，不欢而别。"
  FRA_Gensokyo_news.010.a: "她们不够博爱！"
  FRA_Gensokyo_news.010.b: "可惜了"
  FRA_Gensokyo_news.010.c: "好！"
  FRA_Gensokyo_news.010.d: "这与我们有什么关系呢？"

  FRA_Gensokyo_news.011.t: "$news_event_background$东风谷早苗加冕"
  FRA_Gensokyo_news.011.desc: "当国家被左翼暴徒掌控，她带领忠诚的士兵拨乱反正，使国家回到了正确的道路上；当不死族陈兵边境，她同全幻想乡的人民一道，打赢了第二次“伟大战争”。\n“祖国的英雄”、“守矢的雄狮”--东风谷早苗迎接着人间之里人民的夹道欢迎骑着一匹白马进入了总统府，一如20年前那般。东风谷在掌权的数年里，以雷霆手段掌握了全国，平息了抵抗，打赢了战争，如今她的威望已经是全幻想乡历史上绝无仅有的崇高。\n前几日，人间之里传出消息东风谷即将加冕，起初国际观察家都以为是风言风语。可是就在昨日，早苗穿着最隆重的巫女服，进入了守矢神社，在来自全世界的权贵的见证下，从八坂神奈子手中接过了象征着绝对权力与冠冕--东风谷早苗正式加冕幻想乡帝国的皇帝，成为幻想乡历史上第一位皇帝。"
  FRA_Gensokyo_news.011.a: "万岁！万岁！万岁！"
  FRA_Gensokyo_news.011.b: "为幻想乡的皇帝献上贺礼。"
  FRA_Gensokyo_news.011.c: "她疯了？"

  FRA_Gensokyo_news.012.t: "$news_event_background$[FROM.Getname]宣布加入反幻想乡同盟"
  FRA_Gensokyo_news.012.desc: "在东风谷早苗成为[FRA.Getname]的皇帝，并表现出越来越强的侵略性后，[FROM.Getname]对[FRA.Getname]的侵略性与本国的安全越来越担忧，于是[FROM.Getname]宣布加入反幻想乡同盟，她们将和其它“一起维持欧陆和平”的国家一起战斗。"
  FRA_Gensokyo_news.012.a: "这群混蛋！"
  FRA_Gensokyo_news.012.b: "我们必须遏制不稳定要素。"
  FRA_Gensokyo_news.012.c: "希望不要牵连到我们。"

  FRA_Gensokyo_news.013.t: "$news_event_background$欧洲统一"
  FRA_Gensokyo_news.013.desc: "在经历了数年的政治与经济工作后，欧罗巴共同体的国家走得越来越近，最终，她们宣布欧洲将团结一致，组成了一个全新的国家。\n[FROM.Getleader]在欧洲议会上庄严宣布：欧罗巴就此团结一致，欧洲人千百年的溯源终于实现。"
  FRA_Gensokyo_news.013.a: "欧洲统一从此不再分离。"
  FRA_Gensokyo_news.013.b: "我们被开除欧洲籍了？"
  FRA_Gensokyo_news.013.c: "这是个巨大的威胁。"

  FRA_Gensokyo_news.014.t: "$news_event_background$幻想乡改革"
  FRA_Gensokyo_news.014.desc: "近日，人里传出了一则震惊世界的消息，人间之里的议会通过了《所有制改革法案》，将幻想乡共和国的私有制制度彻底废除，并向公有制转变，这使得幻想乡在事实上成为了一个社会主义国家，随着这个欧陆强权的大变革，世界外交局势也将引来大洗牌。\n\n国际评论家们纷纷认为，幻想乡将脱离自由世界，冷战的天平开始倾斜。"
  FRA_Gensokyo_news.014.a: "万里江山万里红！"
  FRA_Gensokyo_news.014.b: "这群叛徒！"
  FRA_Gensokyo_news.014.c: "同志，欢迎你们！"

  FRA_Gensokyo_news.015.t: "$news_event_background$《水神降临我身边》发售"
  FRA_Gensokyo_news.015.desc: "3月18日，一本名为《水神降临我身边》的小说发售，立刻引起了轩然大波。\n\n本书以第一人称写了一个男大学生，意外结识了一个笔友，并聊得很好。在一天晚上下课后，你收到消息，这位笔友很快就会来到你的大学门口。你在紧张的等待后，空无一人的大学门口驶来一辆轿车，车门打开，首先映入眼帘的就是衣服长长的拖尾--\n\n从车上下来的竟然是水神芙宁娜大人！如果梦幻的场景使得你直接愣住，在看到拖尾那一刻心脏就已经漏了一拍。你按照约定，向芙宁娜行了骑士礼，芙宁娜大人为你授勋，给予了你她的帽子与一些别的小礼物。在你愣神之时，芙宁娜捂住了你的眼睛，走到你的旁边，踮起脚尖在你的脸颊上献上了一个吻，然后便乘车离去。\n\n你仍然沉浸在这梦幻的场景中，无法判断刚刚是否是一场梦，但是手中的帽子又告诉你一切都是真实的。并由此，开启了你与芙宁娜的青春恋爱喜剧小说。\n\n据悉，枫丹廷的芙宁娜·德·枫丹本人尚未对此书做出回应或评价。"
  FRA_Gensokyo_news.015.a: "这是谁写的？给我查！"
  FRA_Gensokyo_news.015.b: "小楚南为了导管还挺有香香梨。"

  FRA_Gensokyo_news.016.t: "$news_event_background$幻想乡军队撤出莱茵兰"
  FRA_Gensokyo_news.016.desc: "由于大萧条的影响，为了缩减预算，幻想乡政府宣布从莱茵兰地区撤军。\n\n莱茵兰地区在1934年的德意志混乱中，被幻想乡政府以保护人权的理由占领，在两年的占领期，莱茵兰迎来了她的独立。她将与其它德国军阀统一，或者独立于世界甚至参与德意志的统一竞赛，尚不得而知。"
  FRA_Gensokyo_news.016.a: "我们别无他法。"
  FRA_Gensokyo_news.016.b: "人里政府无能的表现。"
  FRA_Gensokyo_news.016.c: "德意志永不为奴！"
  FRA_Gensokyo_news.016.d: "幻想乡的势力在缩小。"

  FRA_Gensokyo_news.017.t: "$news_event_background$幻想乡政变"
  FRA_Gensokyo_news.017.desc: "今日在幻想乡首都人间之里发生了暴力政变，政变的发起者是近期爆冷获选的总统，铃仙·优昙华院·因幡和作为其亲卫队的月兔军队，政变的对象则是幻想乡多年以来稳定执政的文官政府及作为其代表的议会。\n\n据称，铃仙总统是希望从低效腐败的文官政府手中拯救国家，令国家重获新生，她认为破后而立，必须铲除文官政府，国家才有再次伟大的可能。\n\n目前，政变基本获得成功，文官政府的大部分要员都被控制，如幻想乡自由党党魁雾雨魔理沙和党鞭爱丽丝·玛格特罗伊德，根据幻想乡官方传达出的消息，以自由党为首的其他党派表现出了继续同执政党合作的意愿，但幻想乡后续的政局仍旧不明朗，还需要进一步的观察。"
  FRA_Gensokyo_news.017.a: "幻想乡需要秩序与效率"
  FRA_Gensokyo_news.017.b: "幽默牢幻"
  FRA_Gensokyo_news.017.c: "路灯挂件再加几个"
  FRA_Gensokyo_news.017.d: "探探口风，是敌是友？"
  FRA_Gensokyo_news.017.e: "或许可以引为援手"
  FRA_Gensokyo_news.017.f: "旧世界的疯子总能整出点大新闻来"
  FRA_Gensokyo_news.017.g: "希望不会对我国在远东的利益造成阻碍"
  FRA_Gensokyo_news.017.h: "一场民主政治的灾难"
  FRA_Gensokyo_news.017.i: "被老保气晕"
  FRA_Gensokyo_news.017.j: "又一个强权诞生了"

  FRA_Gensokyo_news.018.t: "$news_event_background$蓬莱山辉夜复辟"
  FRA_Gensokyo_news.018.desc: "今日幻想乡的王室成员蓬莱山辉夜在凡尔赛宫镜厅举办了加冕典礼，曾经的月之都公主正式加冕为幻想乡女王。虽说如此，不过根据记者反馈，大部分平民仍旧更喜欢称呼辉夜公主殿下，因为辉夜流亡幻想乡的时间太久，已经在人群中形成了一定的思维惯性，想要扭转这种意识需要时间。 \n\n据记者所说，人间之里上下举国如狂，欢声雷动，民众对新即位的女王相当支持，民间支持率调查显示女王的复辟支持率高于70%，而且还在逐渐走高。幻想乡的新王室诞生，为欧洲的政治局势增添了几分不稳定性，已经二百多年没有诞生国王的幻想乡再度返回君主制，或许可以理解成右翼复潮的一种信号。目前尚且难以确定辉夜姬会如何处理对外关系，是否会延续铃仙所定下的对外方策，本报将会持续追踪热点消息。"
  FRA_Gensokyo_news.018.a: "国王万岁！"
  FRA_Gensokyo_news.018.b: "感觉不如骑士王"
  FRA_Gensokyo_news.018.c: "这帮幻想乡佬能整点新鲜的吗"
  FRA_Gensokyo_news.018.d: "幻想乡人的自娱自乐而已"
  FRA_Gensokyo_news.018.e: "希望不会影响我国的统一大业"
  FRA_Gensokyo_news.018.f: "一眼伪王，鉴定为纯纯的小丑"
  FRA_Gensokyo_news.018.g: "欧洲的旧事不需要太关注"
  FRA_Gensokyo_news.018.h: "越活越回去"
  FRA_Gensokyo_news.018.i: "被老保气晕"
  FRA_Gensokyo_news.018.j: "来人啊，准备礼物，我要写祝贺信了！"

  FRA_Gensokyo_news.019.t: "$news_event_background$印支革命胜利"
  FRA_Gensokyo_news.019.desc: "在将最后一支隶属于殖民地政府的部队赶下海后，印度支那联盟终于取得了最终的胜利，占据这片土地许久的幻想乡人终将得到清算。虽然还有许多问题亟待解决，但是历经艰难险阻的道路，真正属于这里的人民一定会让这片土地焕发新的生机！"
  FRA_Gensokyo_news.019.a: "“红旗指处海山开。"
  FRA_Gensokyo_news.019.b: "草！"
  FRA_Gensokyo_news.019.c: "送去祝福"
  FRA_Gensokyo_news.019.d: "谁会在意印支？"

  FRA_Gensokyo_news.020.t: "$news_event_background$幻想乡军团稳定印支"
  FRA_Gensokyo_news.020.desc: "在将最后一支隶属于印度支那联盟的部队彻底消灭后，幻想乡属印度支那取得了最终的胜利。来自星球另一头的殖民者仍然占据着这片古老的土地，贪婪地吮吸着从这里榨出的每一份利益。或许那些退入山林的游击队还在勉力抗争，但大局已定，这对殖民政府来说已经无伤大雅。"
  FRA_Gensokyo_news.020.a: "“铁幕沉沉覆旧苔。”"
  FRA_Gensokyo_news.020.b: "谁会在意印支？"

  FRA_Gensokyo_news.021.t: "$news_event_background$印度支那战争"
  FRA_Gensokyo_news.021.desc: "伴随着印度支那联盟正式向世界宣告他们的存在，已经在这片土地上盘桓许久的殖民地政府不得不作出将他们彻底剿灭的决定。而当那些身居高位的幻想乡人向远在万里之外的祖国发去求援的消息，却只收到大萧条的波涛震荡在每一处土地的余音。幻想乡政府已经无力向另一个大洲的殖民地派遣任何支援，是革命之火借此之势燃遍四野，还是旧日长夜遥遥无终不见尽头？这需要印度支那的人民自己给出答案。"
  FRA_Gensokyo_news.021.a: "“苍茫歧路待谁开？”"
  FRA_Gensokyo_news.021.b: "谁会在意印支？"

