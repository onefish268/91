  FRA_Defend_against_foreign_enemies_idea: "防范外来之敌"
  FRA_victors_of_Great_War: "“伟大战争”胜利者"
  FRA_victors_of_Great_War_desc: "从大战中取得胜利后，军队养成了一种危险的自满态度，使战略发展放缓，并带着某些不情愿的态度。"
  ENG_protect_FRA: "圣杯-幻想乡团结协定"
  ENG_protect_FRA_desc: "§Y圣杯-幻想乡团结协定§!是《白玉楼条约》中的一项附加条款，条款规定了当幻想乡的主权陷入“巨大的、难以逆转的”危机时，圣杯王国将会保护她的朋友。"
  ENG_protect_FRA_tt: "当我们被外敌入侵时，圣杯王国将会帮助我们。"
  FRA_Unfreeze_policy: "“解冻”政策"
  FRA_Step_in_Democratization: "迈入民主化"
  FRA_Step_in_Democratization_desc: "经过20年的修整，共和国政府已经完全平息了各地的野心家与谋反者，现在共和国的权力已经集中在人间之里的总统府，这个国家已经做好准备，成为一个真正的“共和国”。\n\n§CLiberté, Égalité, Fraternité§!"
  FRA_Financial_spree: "金融狂欢"
  FRA_Financial_spree_desc: "随便一笔投资都能赚钱，发达的金融业让每一个幻想乡人醒来第一件事就是看自己的投资让财富又增加了多少。"
  FRA_developed_industry: "实业发达"
  FRA_developed_industry_desc: "小到圆珠笔大到飞机舰艇，我们都能骄傲地说全是幻想乡自己的产品。"
  FRA_financial_system_collapsed: "金融体系崩坏"
  FRA_financial_system_collapsed_desc: ""
  FRA_Financial_crisis_HCP: "金融体系崩坏"
  FRA_Financial_crisis_HCP_desc: "砸了，全砸了！每一天高楼上都是一跃而下的人，这就是就是幻想乡的末日开端！\n§W--------------§!\n§O金融危机§!的危机度将对该buff产生直接影响。"
  FRA_Financial_crisis_HCP_TT: "HCP收入减少[?FRA_Financial_crisis_HCP_var|%+=] £hcp_small /月"
  FRA_Financial_crisis: "大萧条"
  FRA_Financial_crisis_desc: "工业生产下降、企业倒闭破产、对外贸易下降、农业危机加深，幻想乡人只能眼睁睁地看着国家经济的下滑，哪怕通过新人间之里殖民领转移了一部分债务，但依然改变不了政府的救市行动失败的事实，所有人都明白，大萧条来了。\n§W--------------§!\n§C信贷紧缩§!与§S产能过剩§!的危机度将对该buff产生直接影响。"
  FRA_Government_support_modifier: "政府支持度"
  FRA_Government_support_modifier_desc: "权威期刊提供的民意调查能充分反映我们的政府是否受到人民的喜爱。\n§W--------------§!\n§1政府支持率§!将对该buff产生直接影响。"
  FRA_Popular_Front_unity_modifier: "人民阵线团结度"
  FRA_Popular_Front_unity_modifier_desc: "人民阵线宣传部提供的党内调查报告能让我们看见党员们对人民阵线是否拥护。\n§W--------------§!\n§r人民阵线§!§C团结度§!将对该buff产生直接影响。"
