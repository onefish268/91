  trait_of_Huziwara_no_Mokou_3: "§Y领袖之资§!\n  - $MODIFIER_ARMY_ORG_FACTOR$：§G+10.00%§!\n$MODIFIER_MAX_COMMAND_POWER$：§Y+40§!"
  FRA_Huziwara_no_Mokou_desc: "藤原妹红是一个豪门望族家的女儿，吃了蓬莱仙药后变得不老不死，受到了人们的恐惧和排挤。近千年颠沛流离，最后隐居在迷途竹林中，过着苦行僧一样的生活来磨练自己。不亲近人类，却会秘密的帮助人类，强到被妖怪袭击也能轻松应付。不怎么擅长与人相处也不愿与别人说自己的身世，但是却喜欢听人类家族的故事。上白泽慧音是她的“少数理解者”。"
  FRA_Huziwara_no_Mokou_desc_Kaguya: "藤原妹红是一个豪门望族家的女儿，吃了蓬莱仙药后变得不老不死，受到了人们的恐惧和排挤。近千年颠沛流离，最后隐居在迷途竹林中，过着苦行僧一样的生活来磨练自己。不亲近人类，却会秘密的帮助人类，强到被妖怪袭击也能轻松应付。不怎么擅长与人相处也不愿与别人说自己的身世，但是却喜欢听人类家族的故事。\n月之公主和藤原妹红的斗争甚至可以追溯到卡佩王朝建立之前，经年累月下来已经成为一笔无头烂仗。\n尽管声称对月之公主等人极度厌恶，但恐怕也有因恨生爱这种少数情况发生的可能，至少在适当的劝慰和开导之下，藤原妹红并不介意帮助新政府进行一些活动——前提是这些活动对幻想乡有利。\n借助自己不老不死的能力和丰富的战斗经验，藤原妹红可以作为一员优秀的将领活跃在战场上。"

  FRA_Ibaraki_Kasen_desc_1: "§Y茨木华扇§!\n§Y民主社会主义支持者§!\n  - $democratic_drift$：§G+0.01§!\n  - $communism_drift$：§G+0.02§!\n  - $MODIFIER_STABILITY_WEEKLY$：§G+0.50%§!"
  FRA_Ibaraki_Kasen_Diplomacy_desc: "§Y茨木华扇§!\n@FRA§Y[FROM.Getname]§!的§t总理§!\n\n§Y民主社会主义支持者§!\n  - $democratic_drift$：§G+0.01§!\n  - $communism_drift$：§G+0.02§!\n  - $MODIFIER_STABILITY_WEEKLY$：§G+0.50%§!"
  FRA_Kasen_leader_desc: "突然出现在博丽神社，并自称为仙人的少女。受到魔理沙的邀请下，时常来拜访博丽神社。操弄著无数的动物，有着仙人般的谈吐举止，而且相当爱说教。住在妖怪深山里的修道场。据她所言，仙人的修练就是不断回想过去，但这有可能只是片面。右臂缠满了绷带且里面是中空的。右手能够徒手捏碎怨灵，因此怨灵害怕她。\n\n茨木华扇是幻想乡几大妖怪里，最温文尔雅怀的那一个，她对人、妖怪、动物都很温和，这也是她出任幻想乡社民党领袖最直接的原因。茨木华扇喜欢说教，感觉是个眼睛里揉不进沙的人。经常批评懒惰灵梦，也想治好魔理沙小偷的毛病。\n\n现在，茨木华扇成功成为了幻想乡共和国的领袖，她与博丽灵梦的伟大理想也将一步一步实现。\n\n§R我们能仰仗的，唯有人民。§!"

  FRA_Maurice_Thorez: "莫里斯·多列士"
  FRA_Maurice_Thorez_desc_1: "§Y莫里斯·多列士§!\n§Y革命战士§!\n  - $communism_drift$：§G+0.05§!\n  - $MODIFIER_MOBILIZATION_SPEED$：§G+10.00%§!\n  - $MODIFIER_CONSCRIPTION_FACTOR$：§G+10.00%§!"
  FRA_Maurice_Thorez_Diplomacy_desc: "§Y莫里斯·多列士§!\n@FRA§Y[FROM.Getname]§!的§t总理§!\n\n§Y革命战士§!\n  - $communism_drift$：§G+0.05§!\n  - $MODIFIER_MOBILIZATION_SPEED$：§G+10.00%§!\n  - $MODIFIER_CONSCRIPTION_FACTOR$：§G+10.00%§!"

  FRA_Jeanne_dArc: "贞德"
  FRA_Jeanne_dArc_desc_1: "§Y贞德§!\n§Y圣少女§!\n  - $MODIFIER_POLITICAL_POWER_FACTOR$：§G+15.00%§!\n  - $MODIFIER_STABILITY_FACTOR$：§G+10.00%§!"
