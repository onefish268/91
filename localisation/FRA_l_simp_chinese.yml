  FRA_Huziwara_no_Mokou_Diplomacy_desc_Kaguya: "§Y藤原妹红§!\n§Y[FROM.Getnamewithflag]§!的§g首相§!\n\n§Y$FRA_red_self_police_team$§!\n  - $MODIFIER_BREAKTHROUGH$：§G+15.00%§!\n  - $MODIFIER_ARMY_MORALE_FACTOR$：§G+20.00%§!\n[trait_of_Huziwara_no_Mokou]"
