  FRA_Political_sub_interface_title_text_1: "§Y茨木华扇§!并不希望通过快速、彻底的§R革命§!来颠覆§Y幻想乡共和国§!的§C资产阶级§!的成分；她更希望通过温和的§P改革§!，在不颠覆§C资产阶级民主制度§!的前提下，实现向§R社会主义§!的转变。\n因为，我们的政府必须平衡好国内§7农民§!、§Y工人§!、§O中产阶级§!、§C资产阶级§!的影响力与对我们的好感度，这将直接影响我们的§1政府支持率§!。"

  FRA_Political_sub_interface_title_text_2: "§r人民阵线§!是由$PSG_NAME$、$PCG_NAME$与$LCR_NAME$组成的竞选联盟，现在§r人民阵线§!的领袖由$PSG_NAME$的主席§Y茨木华扇§!担任。\n$PCG_NAME$和$LCR_NAME$一直对$PSG_NAME$温和的措施颇有微词；同时，§Y茨木华扇§!也未能完全统治$PSG_NAME$，其中不少人对于§Y茨木华扇§!同样由许多不满。\n我们必须平衡好$PSG_NAME$、$PCG_NAME$与$LCR_NAME$的影响力与好感度，这将决定§r人民阵线§!的存亡。"

  FRA_Political_sub_interface_title_text_3: "§C幻想乡共和国§!并非总统与总理的一言堂，§Y立法权§!、§Y罢免权§!等重大权力掌握在§5国民议会§!手中。\n我们必须尽可能地使我们的支持者进入§5国民议会§!以及争取议员们的支持。"

