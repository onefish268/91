#设定
  French_Local_History_Title: "§C法兰西§!（§P幻想乡§!）地区"
  French_Local_History_Title_01: "法兰西的崛起"
  French_Local_History_Page_01: "在§t罗马帝国§!的废墟上，高卢人§C克洛维§!与§Y龙神§!统一了这片人类与妖怪之地，建立了“§C法兰克王国§!”，这也是被后世普遍认为的§R幻想乡§!的开端。\n\n在统一战争中，§Y龙神§!与她手下的神明与妖怪的强大武力，南征北战，掌握了大量庄园土地，形成妖怪骑士阶层，形成了龙神与克洛维、人类与妖怪共治这片土地的模式，但龙神本人对权力斗争不感兴趣，政务交由由八百万神明中佼佼者组成的秘书处（后变为§Y贤者议会§!）处理，而那位强大的妖怪据传去云游四海早已不知所踪，现已作为幻想乡地区的守护神。\n\n8世纪初，东法兰克与西法兰克之间的争夺尤烈。东法兰克宫相§Y查理§!在北方恢复秩序，732年，在普瓦蒂埃击退阿拉伯人的入侵，重新统一§C法兰克王国§!。751年，克洛维的儿子丕平（751~768年在位）在教皇支持下正式即位，建立§O加洛林王朝§!。\n\n768年，丕平之子查理曼继承王位。在他统治期间连年出征§Y意大利§!、§Y伊比利亚§!、§Y日耳曼§!等地区，到800年，他已把过去§R罗马帝国§!统治下的§C西欧§!广大地区置于自己控制之下，并由教皇为他加冕，§Y查理曼§!成为西方皇帝。\n\n843年，签署的《凡尔登条约》，§Y查理曼帝国§!一分为三，其中“§C西法兰克王国§!”逐渐演化为“§C法兰西王国§!”。 \n\n从克洛维到雨果·卡佩的§Y500年间§!，蛮族入侵、内外战争连绵不断。§S封建自然经济§!的盛行，领主权力的扩大，贵族离心倾向与独立性的加强，造成长期生产落后、封建割据与国家不统一的局面。"
  French_Local_History_Title_02: "种族之争"
  French_Local_History_Page_02: "在随着10到15世纪中§Y文艺复兴§!的浪潮中，神权教权构筑的§C法兰西§!逐渐崩塌，妖怪影响力逐渐变大，控制了§P幻想乡§!大部分地区。妖怪表面上服从神明，实则早已架空神明，妖怪的语言也逐渐成为了官方话术，“§P幻想乡§!”诞生了，“§R幻想乡§!”在§Y贤者议会§!议会倡议与人类的斗争下，建立§Y幻想乡王国§!，贤者议会与人类国王行使同一权利，§P幻想乡§!安稳度过了几百年的时光。\n\n§Y卡佩王朝初期§!，王室直接控制的领地只限于塞纳河和卢瓦尔河之间，各大公国、伯国恃势割据，俨如独立王国。腓力四世统治时期（1286~1314年）加强吏治，整饬军队，因坚持向教会征收财产税与教皇发生冲突。 \n\n1328年，查理四世死后，因卡佩家族嫡系无男嗣，由于与教皇的冲突，被§R斯卡蕾特家族§!利用其在妖怪的影响力与王室中的职位，获得了幻想乡王国的王位，幻想乡进入了80年的§t斯卡雷特王朝时期§!。 \n\n1408年，由卡佩家族的旁支瓦卢瓦家族的腓力六世在§O教皇§!与§O神圣罗马帝国皇帝奥地利§!的支持下，举起了反旗。在8年的战争后，§R斯卡蕾特王朝§!被击败，被降为§N红魔馆公国§!的大公，腓力六世继承王位，建立了§Y瓦卢瓦王朝§!。 \n\n15世纪末，最后几块贵族领地也并入§Y幻想乡王国§!的版图，从比利牛斯到雾之湖、从白玉楼到守矢神社，幻想乡宣告统一。"
  French_Local_History_Title_03: "革命到来"
  French_Local_History_Page_03: "18世纪，§R幻想乡§!地区由于长期和平，手工业逐步兴旺发达，国内开始工业化，商品生产倾销的需要，导致其与§C圣杯§!的摩擦（主要是非洲新人间之里殖民领）日益频繁，同时国内“羊吃人”现象普遍，土地兼并严重，自耕农大量破产，底层妖怪骑士也有很多失去土地，没有收入无法生存。同时因为王室倾尽全力支持§C精灵独立战争§!，导致王国财政出现大量亏空。\n\n在这种情况下，§g德国§!启蒙思想传入，吸引了大量破产贵族和失去土地的妖怪骑士，借此抒发政治理想，要求改革，然而§Y贤者议会§!不予理会，反而因为与§C圣杯§!的战争继续摊派战争税。破产贵族和失去土地的妖怪骑士上街游行，被§Y贤者议会§!逮捕进巴士底狱。7月初，§Y贤者议会§!向人间之里市民摊派新一轮战争税务，7月14日，市民愤怒地冲上街头，组建民兵队向§Y巴士底狱§!进军，要推倒这座象征着专制与暴政的堡垒。\n\n“§C幻想乡各族的乐土§!”，共和主义者们以此为口号，彻底动员起了全国的反抗。§C自由、平等、博爱§!成为了各种族一致的理想，各社会阶层、人类和妖怪都站在了一起，共同反抗贤者议会与圣杯的暴政，§R幻想乡§!人第一次站了起来！国内大小起义不断，最终，§Y上白泽慧音§!率领的共和军打败了政府军，进军§Y人间之里§!，国王被处死，“贤者议会”被解散，国王的子嗣与保守人士逃亡到了北美的殖民地。\n\n§P幻想乡共和国§!成立了，标准着这一理想的初步实现。"

  FRA_his_page_01_title: "大革命的号角"
  FRA_Country_History_Page_01: "18世纪，§R幻想乡§!与§C圣杯§!的摩擦（主要是非洲新人间之里殖民领）日益频繁，同时国内土地兼并严重，自耕农大量破产，底层妖怪骑士也有很多失去土地，没有收入无法生存。同时因为王室倾尽全力支持§C精灵独立战争§!，导致财政出现大量亏空。\n\n在这种情况下，§g德国§!启蒙思想传入，吸引了大量破产贵族和失去土地的妖怪骑士，借此抒发政治理想，要求改革，然而§Y贤者议会§!不予理会，反而因为与§C圣杯§!的战争继续摊派战争税。破产贵族和失去土地的妖怪骑士上街游行，被§Y贤者议会§!逮捕进巴士底狱。7月初，§Y贤者议会§!向人间之里市民摊派新一轮战争税务，\n\n此时，最重要的三位贤者--摩多罗隐岐奈，八云紫，茨木华扇发生了严重的分歧。支持改革的茨木华扇与寻求维持权威的八云紫发生了严重的冲突，贤者议会也发生了分裂。茨木华扇派被称为“§P革命议会§!”。7月14日，市民在“§P革命议会§!”的领导下愤怒地冲上街头，组建民兵队向§Y巴士底狱§!进军，要推倒这座象征着专制与暴政的堡垒。\n\n“§C幻想乡各族的乐土§!”，共和主义者们以此为口号，彻底动员起了全国的反抗。§C自由、平等、博爱§!成为了各种族一致的理想，各社会阶层、人类和妖怪都站在了一起，共同反抗贤者议会与圣杯的暴政，§R幻想乡§!人第一次站了起来！国内大小起义不断，最终，§Y上白泽慧音§!率领的共和军打败了政府军，进军§Y人间之里§!，国王被处死，“贤者议会”被解散，国王的子嗣与保守人士逃亡到了北美的殖民地。\n\n§P幻想乡共和国§!成立了，标准着这一理想的初步实现。"
  FRA_his_page_02_title: "大混乱时代"
  FRA_Country_History_Page_02: "新生的§R幻想乡§!并不稳固，旧贵族势力、外国买办以及各其他共和派系共同撕裂着这个国家。9月20日§Y共和国军队§!在参拜道战役中§R打败§!外国干涉军。由普选产生的国民公会于9月21日开幕，9月22日成立了§C幻想乡第一共和国§!。“§P革命议会§!”执政期间颁布法令，强迫贵族退还非法占有的公有土地，将没收的教会土地分小块出租或出售给农民，严厉打击拒绝对宪法宣誓的教士和逃亡贵族。\n\n在圣杯暗中扶植的军队政变推翻“§P革命议会§!”后，§C幻想乡§!又重新陷入了混乱。在仅仅数月后，§R雅各宾派§!又带领人民击败了政变部队，§R雅各宾派§!专政的共和国面临的局势是绝望的—国内各地分离主义势力蠢蠢欲动、各个殖民地脱离统治、多国组成的干涉军已经兵临幻想乡边境。但局势又是充满希望的—幻想乡的人民充满着革命的热忱，§C共和国§!有着一支高奏凯歌、士气高昂的军队。\n\n1793年底—1794年初将外国干涉军全部赶出国土，国内的叛乱也基本平息。1794年3—4月雅各宾内部开始了激烈的斗争。使雅各宾派趋于孤立，人民也开始反对雅各宾派的恐怖统治。\n\n1795年10月，§S温和派§!政变，§C第二共和国§!成立。在之后的数十年间，幻想乡渡过了一段相对稳定的时期。在此期间，幻想乡工业革命取得巨大进展，共和国军队也开始南征北战。最终幻想乡收复了北非的殖民地。\n\n1870年7月14日，§g普鲁士§!与§C幻想乡§!的战争爆发，战争开始之后，幻想乡军队接连败北。9月2日，幻想乡政府投降，9月4日，§Y人间之里§!爆发革命，幻想乡大资产阶级建立§C第三共和国§!，第二共和国灭亡。但普军仍长驱直入。1871年1月18日，§g普鲁士国王§!§Y薇莲一世§!在幻想乡凡尔赛宫加冕为皇帝，成立了§g德意志帝国§!。幻想乡资产阶级政府请求停战。2月26日，双方在幻想乡凡尔赛签订初步和约。5月10日在法兰克福签署了正式和约，幻想乡不得不支付大量的赔款，同时§R失去了博丽大结界与红魔馆§!。§C幻想乡§!又一次陷入了政治动荡。最终§O军队§!的干涉下，暂时恢复了稳定，幻想乡进入了§O50年军政时期§!，虽然名义的选举还在进行，但是实际秩序由军队维持。\n\n战后恢复的需要使得幻想乡的经济不可避免对圣杯产生依赖，同时德意志的崛起促使双方不再互相仇恨，转而谋求经济与军事合作。"
  FRA_his_page_03_title: "稗田阿求掌舵"
  FRA_Country_History_Page_03: "1914年，年仅8岁的§Y稗田阿求§!被推上政治舞台。很快§t红魔馆事件§!引爆了“§R伟大战争§!”。\n\n§R伟大战争§!爆发后，军队总司令在前线被德军炸死，§g德军§!长驱直入，引起了§Y人间之里§!的恐慌，傀儡总统出逃。这是，§P稗田阿求§!在§C雾雨魔理沙§!、§S本居小铃§!等人的支持下成为了临时大总统，开始用行政力维持秩序，同时圣杯王国为了避免幻想乡的崩溃，也开始支持这位“§Y临时大总统§!”。\n\n在“§O人间之里保卫战§!”与“§O守矢反击战§!”等数场胜仗后，幻想乡国内的恐慌逐渐被平息，同时§S东风谷早苗§!、§G风见幽香§!等人组成新司令部也开始发挥作用。最终，幻想乡取得了战争的胜利。1918年，战争结束，共和国重新§G夺回了§!§O红魔馆§!与§O博立大结界§!，获得了德国在刚果的殖民地与大量的赔款。§Y稗田阿求§!的名望也达到了最高峰，已经成为了共和国名副其实的领袖。\n\n经过16年的治理，§R幻想乡§!人类与妖怪的矛盾已经在§Y稗田阿求§!的铁拳政治和糖衣炮弹攻势之下逐渐平息，虽然在§Y稗田家的诅咒§!仍然萦绕在共和国之上，但是§C民主改革§!的顺利、经济的大繁荣，使得全幻想乡的人民对未来充满了希望，在1936年之前去世的人们，总是怀着对未来的期待，带着微笑离开人世的。"

