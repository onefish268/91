  LCR_TITLE: "§W革命共产主义同盟（[?Total_Influence_of_LCR|0]）§!"
  LCR_NAME: "§N革命共产主义同盟§!"
  LCR_pt: "§N革命共产主义同盟§!\n§L[GetLCRPartyDesc]§!\n政党意识形态：§N[GetLCRIdeologySubtype]§!\n政党领导人：§Y[GetLCRLeaderName]§!\n支持率：§Y[?support_of_LCR]%§!"
  LCR_desc_Radical_socialism: "“森林、群山与公社的守望。”\n\n作为大天狗军队中的基层军官，犬走椛代表了幻想乡底层妖怪骑士与武装民兵的利益。她认为灵梦的道路过于依赖外来的城市学说，而忽视了幻想乡自古以来的社群传统。犬走椛主张建立以妖怪公社为核心的去中心化社会，强调人类与妖怪应当回归自然契约，摆脱圣杯工业文明的异化。这种道路虽然被批评为“带有小农色彩的空想”，但在基层士兵和山地妖怪中拥有极高的支持度。他们追求的是一种基于忠诚、共享与本土防卫的“群山社会主义”。"
  LCR_desc_Farsighted_socialism: "“唯有科学与真理，能带领幻想乡飞向星辰。”\n\n冈崎梦美作为一名追求统一理论的科学家，她眼中的社会主义不仅仅是阶级解放，更是对“真理”的绝对占有。这一派系认为幻想乡的落后根源在于生产力与魔导科学的断层。冈崎梦美主张将国家彻底改造为一个巨大的实验室，通过极致的计划经济压榨资源，用于研究超越时代的魔导技术。这种道路充满了冷酷的理性，为了千百年后全人类的进化，可以牺牲当下的消费与福利。在她们看来，当前的革命只是幻想乡走向高维文明的初级阶段。"

  PCG_TITLE: "§W幻想乡共产党（[?Total_Influence_of_PCG|0]）§!"
  PCG_NAME: "§t幻想乡共产党§!"
  PCG_pt: "§t幻想乡共产党§!\n§L[GetPCGPartyDesc]§!\n政党意识形态：§t[GetPCGIdeologySubtype]§!\n政党领导人：§Y博丽灵梦§!\n支持率：§Y[?support_of_PCG]%§!"
  PCG_desc_initial: "“为了博丽大结界的回归，为了无产阶级的解放！”\n\n长期以来，幻想乡的政权在贤者议会、圣杯买办与军方势力之间轮转，而底层的自耕农与妖怪骑士却在大萧条与土地兼并中流离失所。作为博丽大结界的传统守护者，灵梦意识到唯有通过最彻底的无产阶级革命，才能收复被割让的领土并终结这种循环。此时的共产党是一个由工农红军、激进妖怪知识分子组成的战斗组织，他们誓言要建立一个属于幻想乡各族的乐土。"
  PCG_desc_Market_socialism: "“贫穷不是社会主义。”\n\n为了应对大萧条后的经济废墟与圣杯的债务压力，灵梦选择了实用主义。她保留了社会主义的政治骨架，但允许旧贵族和妖怪商会在国家监督下进行投资。通过建立“人间之里证券交易所”，幻想乡利用市场活力加速工业革命的后续进展。这种模式在确保社会稳定的同时，也缓解了人类与妖怪的种族摩擦，旨在建立一个经济高度繁荣、多民族共存的市场化共和国。"
  PCG_desc_leninism: "“苏维埃政权加全幻想乡的电气化。”\n\n灵梦认为只有绝对的集中才能应对魔导国、德意志与圣杯的威胁。政权通过“五年计划”强行推进工业化，将红魔馆公国等旧领地彻底改造为国有重工业基地。先锋队组织深入社会每一个末梢，消灭了所有阶级残余和宗教迷信，将“博丽”的权威转化为党性的纯洁。国家变成了一座巨大的红色堡垒，随时准备通过“伟大战争”将革命输出到整个欧洲。"
  PCG_desc_Hakureiism: "“炮打司令部——砸碎异化的先锋队！”\n\n当革命胜利后的先锋队逐渐演变为新的“贤者议会”时，灵梦选择了背叛自己的官僚体系。她意识到，真正的共产主义不仅是生产力的提升，更是灵魂的彻底解放。她号召人间之里的工人和各族妖怪冲向政府大楼，通过大规模的群众运动清洗腐败的干部。这一版本的幻想乡不再有固定的阶级和官僚，它处于一种永恒的革命状态中，直到建成一个没有压迫、真正实现“自由、平等、博爱”理想的共产主义之国。"

  PSG_TITLE: "§W幻想乡社会民主党（[?Total_Influence_of_PSG|0]）§!"
  PSG_NAME: "§P幻想乡社会民主党§!"
  PSG_pt: "§P幻想乡社会民主党§!\n§L[GetPSGPartyDesc]§!\n政党意识形态：§P[GetPSGIdeologySubtype]§!\n政党领导人：§Y茨木华扇§!\n支持率：§Y[?support_of_PSG]%§!"
  PCG_desc_socialism: "“通过议会走向公正，通过法律守护博爱。”\n\n社会民主党继承了茨木华扇“革命议会”时期的核心政治理想。他们是《自由、平等、博爱》口号的最忠实履行者，致力于在不推翻现有共和国架构的前提下，通过立法改善破产自耕农和底层妖怪骑士的生存现状。华扇主张利用贤者阶层的智慧去引导而非压迫民众，通过温和的税务改革减轻人民负担，从而避免重蹈大革命时期那种处死国王、流血冲突的覆辙。在外交上，该党倾向于通过经济合作缓解与“圣杯”的紧张关系，同时在魔导国崛起带来的阴影中寻找和平的支点。"
  PCG_desc_warm_syndicalism_group: "“将土地与工厂归还于民，建立真正的乐土。”\n\n在成功颁布并落实了全面的所有制改革法案后，幻想乡社会民主党将国家带入了温和社会主义阶段。这一时期的政策重点在于彻底解决历史上长期存在的土地兼并和“羊吃人”现象。政权强制要求旧贵族和教会退还非法占有的公有土地，并将其以极低的价格租赁或出售给劳动者。\n与灵梦的激进路线不同，华扇的温和社会主义保留了社会的多元性。在上白泽慧音等共和派将领的支持下，新体制建立起了一套覆盖人类与妖怪的社会福利网。这不再是阿求时期的“铁拳政治与糖衣炮弹”，而是一种基于法治的社会再分配制度。社会生产力通过工业革命的成果得到释放，幻想乡在此结局下成为了一个既拥有强大生产能力，又充满人文关怀的“各族之乐土”。"

  PFG_TITLE: "§W幻想乡自由党（[?Total_Influence_of_PFG|0]）§!"
  PFG_NAME: "§C幻想乡自由党§!"
  PFG_pt: "§C幻想乡自由党§!\n§L[GetPFGPartyDesc]§!\n政党意识形态：§C自由主义§!\n政党领导人：§Y[Get_PFG_leader_name]§!\n支持率：§Y[?support_of_PFG]%§!"
  PCG_desc_Akyuu: "在稗田阿求掌舵的十六年间，幻想乡自由党是维持国家稳定的核心支柱。这一时期的政党带有深厚的威权色彩，其核心逻辑在于通过高效的行政力和军事威慑来换取社会发展的空间。1914年“伟大战争”爆发后，面对德军入侵和傀儡总统出逃带来的全国恐慌，年仅8岁的阿求在雾雨魔理沙等人的支持下出任临时大总统，利用强硬的行政手段重建了社会秩序。自由党在此时推行“铁拳政治与糖衣炮弹”并行的方略：一方面依靠军队维持实际秩序，镇压激进派系；另一方面通过平息种族矛盾、收复红魔馆与博丽大结界等失地，并配合经济大繁荣带来的物质利诱，成功安抚了各阶层民众。尽管名义上的民主选举仍在进行，但自由党实质上建立了一个由军队保驾护航、以稗田家权威为核心的稳定政体，使得全幻想乡的人民在1936年之前对未来充满了憧憬与希望。"
  PCG_desc_Marisa: "在阿求去世后，作为阿求曾经最坚定的支持者，雾雨魔理沙接掌了自由党，并展现出比前任更为强硬且激进的政治姿态。魔理沙时期的自由党将“保卫共和国”视为最高准则，她认为议会效率低下和各派系扯皮推诿正是民主异化的开端。不同于阿求时期那种通过经济赎买来消弭矛盾的手段，魔理沙对所有可能威胁民主根基的“极端分子”——无论是试图武装起义的左翼力量，还是试图突袭议会的右翼国民阵线——都主张采取先发制人的重拳打击。她利用在大战中积累的威望和军事支持，将自由党改造为一个半军事化的政治实体，通过颁布非常法令来绕过瘫痪的议会，试图以这种“防御性民主”的极端手段，强行清除那些她认为会干扰国家重回正轨的异端势力，甚至不惜以牺牲部分程序正义为代价来捍卫幻想乡的共和底色。"

  IDU_TITLE: "§W独立民主联盟（[?Total_Influence_of_IDU|0]）§!"
  IDU_NAME: "§Y独立民主联盟§!"
  IDU_pt: "§Y独立民主联盟§!\n§L作为曾经亲手终结旧王朝、率领共和军进军人间之里的革命元勋，上白泽慧音在阿求去世后的乱局中挺身而出，试图通过“独立民主联盟”整合破碎的共和派系。该党的核心意识形态被确立为激进的贸易自由主义，其初衷是利用幻想乡工业革命的深厚积淀，通过彻底废除关税壁垒和行政审批，吸引圣杯资本与德意志帝国的技术流入，从而快速修补“伟大战争”留下的经济创伤。§!\n政党意识形态：§Y贸易自由主义§!\n政党领导人：§Y上白泽慧音§!\n支持率：§Y[?support_of_IDU]%§!"
  GFN_TITLE: "§W国民阵线（[?Total_Influence_of_GFN|0]）§!"
  GFN_NAME: "§F国民阵线§!"
  GFN_pt: "§F国民阵线§!\n§L“一个旗帜，一个民族，一个幻想乡。”\n\n国民阵线并非起源于传统政治沙龙的清谈，而是诞生于第一次伟大战争的硝烟与战后破败的废墟之中。其核心领袖铃仙，曾作为月兔志愿军的战斗英雄，亲眼目睹了幻想乡人为之流血的胜利如何被唐宁街的圣杯官僚和凡尔赛的无能政客挥霍殆尽。\n在大萧条的冲击下，现行的议会制度已沦为效率低下的“扯皮机器”：官僚们热衷于权力斗争与推卸责任，却对北方崩溃的经济和食不果腹的民众视而不见。国民阵线以此为契机迅速崛起，他们公开蔑视这种老朽、腐旧且动辄朝令夕改的政治模式，主张建立一个高效、简洁且团结的新秩序。§!\n政党意识形态：§F[GetGFNIdeologySubtype]§!\n政党领导人：§Y铃仙·优昙华院·因幡§!\n支持率：§Y[?support_of_GFN]%§!"
  MNR_TITLE: "§W全国共和运动（[?Total_Influence_of_MNR|0]）§!"
  MNR_NAME: "§K全国共和运动§!"
  MNR_pt: "§K全国共和运动§!\n§L全国共和运动最初伪装成一个寻求秩序与复兴的传统共和派系，但在绵月姐妹接掌领导权后，其性质发生了根本性的异变。作为月之都月兔志愿军在大战期间的最高指挥阶层，绵月姐妹对这个由“污秽”的历史与腐朽的议会所统治的幻想乡感到彻底的失望。她们认为，无论是灵梦的红色革命还是魔理沙的强硬民主，都无法从根本上净化这片被战争、饥饿与金权政治污染的土地。§!\n政党意识形态：§F月面纯净主义§!\n政党领导人：§Y绵月丰姬§!\n支持率：§Y[?support_of_MNR]%§!"
  LCR_TITLE1: "§W革命共产主义同盟（[?support_of_LCR|0]）§!"
  PCG_TITLE1: "§W幻想乡共产党（[?support_of_PCG|0]）§!"
  PSG_TITLE1: "§W幻想乡社会民主党（[?support_of_PSG|0]）§!"
