l_simp_chinese:
 ZDM_infantry_equipment_0:0 "斯太尔-曼利夏M1895制式步枪"
 ZDM_infantry_equipment_0_short:0 "斯太尔-曼利夏M1895"
 ZDM_infantry_equipment_0_desc:0 "斯太尔-曼利夏M1895式步枪是由奥地利斯太尔公司与曼利夏公司联合研制的栓动步枪系列，包含卡宾枪、标准步枪及改进型等多个型号。该系列采用直动式枪机与弹夹插入供弹系统，主体结构由特种钢制成，可兼容8×50mm等制式弹药，自1895年起成为部分次要国家的主要制式武器。"
 ZDM_artillery_equipment_1:0 "8厘米FK M.5野战炮"
 ZDM_artillery_equipment_1_short:0 "8厘米FK M.5"
 ZDM_artillery_equipment_1_desc:0 "斯柯达在1905年完成了新式牵引野战炮的设计，虽然名为8厘米炮，它的实际口径为76.5毫米。该炮新旧技术杂糅在一起，同时期其它国家已经普遍采用钢制炮管，可FK M.5仍采用青铜炮管，使用水平滑动炮闩闭锁，炮管与一体式炮架之间安装了液压弹簧后坐系统。FK M.5及后续版本总共生产了3200多门，是一些国家陆军的主力装备之一，伟大战争期间使用广泛。"
 ZDM_infantry_equipment_1:0 "斯太尔‑曼利夏M95/30步枪"
 ZDM_infantry_equipment_1_short:0 "斯太尔‑曼利夏M95/30"
 ZDM_infantry_equipment_1_desc:0 "斯太尔‑曼利夏 M95/30 步枪是奥地利在 1930 年对 M1895 步枪的现代化改型，同样为直拉枪机结构，拥有步兵长枪版与短管卡宾版本。该枪更换枪管适配新型 8×56mmR 凸缘步枪弹，机匣带有 “S” 识别标记，内部大部分零件可与原版 M1895 互换，是奥地利在二战爆发前的主力制式步枪。1933德奥合并后德军将其编号 Gewehr 306 (ö)，卡宾版本编号 Kar 505 (ö)，多用于后方治安、占领区警戒，极少投入前线主力作战。"
 ZDM_infantry_equipment_2:0 "Kar98k 毛瑟短步枪（斯太尔工厂 bnz 代工版）"
 ZDM_infantry_equipment_2_short:0 "Kar98k 毛瑟短步枪"
 ZDM_infantry_equipment_2_desc:0 "Kar98k 毛瑟短步枪是纳粹德国的制式旋转后拉枪机步枪，由奥地利斯太尔‑戴姆勒‑普赫工厂代工生产，工厂代码 bnz/660。该枪采用毛瑟经典旋转闭锁枪机，5 发内置弹仓供弹，使用 7.92×57mm 毛瑟步枪弹，金属构件采用军工钢材，配有木质枪托护木。1938 至 1945 年间斯太尔工厂产出近百万支，供应德军与党卫军，该枪为德国设计，奥地利仅负责制造，并非奥地利自研武器。"
 ZDM_infantry_equipment_3:0 "曼利夏‑舍瑙尔步枪 M1903"
 ZDM_infantry_equipment_3_short:0 "曼利夏‑舍瑙尔M1903"
 ZDM_infantry_equipment_3_desc:0 "曼利夏‑舍瑙尔步枪是奥地利斯太尔生产的旋转后拉枪机步枪，拥有独特的旋转式盒式弹仓结构，可分离弹夹装填，分为军用、狩猎出口多个子型号。该枪做工精良，最初为希腊军队等海外客户设计，使用 6.5×54mm 舍瑙尔弹药，奥地利本国仅少量采购，二战期间几乎没有作为军用制式武器大规模参战，更多作为出口枪械和民间狩猎步枪。"
 ZDM_infantry_equipment_x:0 "斯太尔 SPG 自动步枪"
 ZDM_infantry_equipment_x_short:0 "斯太尔SPG"
 ZDM_infantry_equipment_x_desc:0 "斯太尔 SPG 自动步枪是二战后期奥地利斯太尔工厂研发的试验型自动步枪，采用短行程活塞自动原理，使用 7.92×57mm 毛瑟弹药，设计目标为替代德军栓动步枪。该枪仅制造少量原型样枪，没有完成定型量产，从未正式列装部队，属于二战奥地利未落地的武器方案。/卡宾枪，冲锋枪，手枪，进攻和防御手榴弹以及反坦克手榴弹。"
 ZDM_infantry_equipment_x_2:0 "FN FAL（斯太尔特许生产版，奥地利军用编号 StG‑58）"
 ZDM_infantry_equipment_x_2_short:0 "FN FAL"
 ZDM_infantry_equipment_x_2_desc:0 "StG‑58 步枪是奥地利斯太尔公司获得比利时 FN 公司授权生产的自动步枪，属于 FAL 枪族，采用偏移闭锁枪机、短行程活塞导气原理，20 发可拆卸弹匣供弹，发射 7.62×51mm 北约全威力弹，木质枪托版本为基础型号，1958 年正式成为奥地利国防军制式步枪。该枪做工精良，大量装备奥军，同时对外出口多国，是冷战早期奥地利主力军用步枪。"
 ZDM_infantry_equipment_x_3:0 "斯太尔 AUG A1步枪"
 ZDM_infantry_equipment_x_3_short:0 "斯太尔AUG A1"
 ZDM_infantry_equipment_x_3_desc:0 "斯太尔 AUG A1 步枪是奥地利斯太尔‑曼利夏公司自主研发的无托结构突击步枪，采用模块化设计，自带 1.5 倍光学瞄准镜，短行程活塞导气，30 发透明塑料弹匣供弹，发射 5.56×45mm 北约小口径弹药。1977 年正式列装奥地利联邦国防军，是世界上首批大规模服役的无托突击步枪，大量衍生子型号并出口全球数十个国家。"
 ZDM_support_equipment_1:0 "索尔兹伯里机械厂制造支援装备包"
 ZDM_support_equipment_1_short:0 "索尔兹伯里机械厂制造支援包"
 ZDM_motorized_equipment_0: "Austro‑Daimler ADGR 三轴越野卡车"
 ZDM_motorized_equipment_0_short: "Austro‑Daimler ADGR"
 ZDM_motorized_equipment_0_desc: "Austro‑Daimler ADGR 三轴越野卡车是奥地利奥斯特罗‑戴姆勒公司研制的 6×6 军用越野卡车，采用六缸汽油发动机，72 马力，三轴全驱布局，后轮双轮胎设计，额定载重 3 吨，钢制梯形车架，1936‑1940 年间生产，总计制造 361 台，是奥地利共和国陆军主力重型运输卡车。德奥合并之后被德军接收，多用于后方物资运输、炮兵牵引，主要服役于占领区二线单位。"
 ZDM_motorized_equipment_1: "斯太尔‑戴姆勒‑普赫 Steyr 1500A 轻型四驱越野卡车"
 ZDM_motorized_equipment_1_short: "斯太尔‑戴姆勒‑普赫 Steyr 1500A"
 ZDM_motorized_equipment_1_desc: "Steyr 1500A 轻型四驱越野卡车是奥地利斯太尔‑戴姆勒‑普赫公司联合保时捷设计的 4×4 多用途军用车辆，搭载 3.5 升风冷 V‑8 汽油发动机，85 马力，四轮驱动带分动箱，离地间隙大、涉水能力优秀，额定载重 1.675 吨，底盘通用性极强，可改装人员运输车、指挥车、无线电车、救护车等多种特种上装。1941 年投产，奥地利本土为主产地，后期德国工厂也授权生产，总产量约 18000 台，广泛用于德军各个战线，北非、东线大量使用，是二战最知名奥地利出身军车。"
 ZDM_mechanized_equipment_1:0 "斯太尔‑戴姆勒‑普赫 Sd.Kfz.251 半履带装甲运兵车"
 ZDM_mechanized_equipment_1_short:0 "斯太尔‑戴姆勒‑普赫 Sd.Kfz.251"
 ZDM_mechanized_equipment_1_desc:0 "Sd.Kfz.251 半履带装甲运兵车是纳粹德国标准半履带步兵装甲运兵车，由奥地利斯太尔工厂获得授权制造，并非奥地利自研。该车采用半履带行走机构，迈巴赫汽油引擎，12 毫米装甲，可搭载 12 名步兵，配有 MG34 机枪，用于伴随装甲部队输送步兵。斯太尔工厂战时生产该底盘，供给德军装甲掷弹兵部队，属于许可证代工产品。"
 ZDM_mechanized_equipment_2:0 "绍勒尔 4K‑4FA 履带式装甲运兵车"
 ZDM_mechanized_equipment_2_short:0 "绍勒尔 4K‑4FA"
 ZDM_mechanized_equipment_2_desc:0 "绍勒尔 4K‑4FA 是奥地利绍勒尔公司研制的履带式装甲运兵车，采用钢质焊接装甲车体，前置发动机布局，搭载六缸柴油发动机，车体后部载员舱可容纳 8 名步兵，乘员 2 人，配有机枪武器站，可执行人员输送、侦察、火力支援任务。1961 年列装奥地利联邦国防军，大量衍生改进型号，同时对外出口多国，是冷战奥地利核心装甲运兵装备。"
 ZDM_mechanized_equipment_3:0 "斯太尔‑绍勒尔 Pandur I “潘德 I” 6×6 轮式装甲运兵车"
 ZDM_mechanized_equipment_3_short:0 "斯太尔‑绍勒尔 Pandur I “潘德 I”"
 ZDM_mechanized_equipment_3_desc:0 "斯太尔‑绍勒尔潘德 I 是奥地利斯太尔‑绍勒尔公司开发的 6×6 轮式装甲运兵车，全焊接钢装甲车体，V 型车体具备防雷能力，柴油动力，可搭载 8 名步兵，武器可选机枪、自动榴弹发射器，可改装指挥车、救护车、侦察车等变体。1994 年列装奥军，大量出口海外，是奥地利经典轮式 APC。"
 ZDM_mechanized_equipment_x:0 "潘德 II 8×8 轮式装甲运兵车"
 ZDM_mechanized_equipment_x_short:0 "潘德 II 8×8"
 ZDM_mechanized_equipment_x_desc:0 "潘德 II 8×8 轮式装甲运兵车是潘德 I 的深度放大改进型号，8 轮驱动，防护等级提升，强化防雷与防弹能力，动力进一步增强，载员舱可容纳最多 10 名步兵，可搭载机关炮炮塔，衍生步兵战车、装甲运兵、抢修、救护等多种子型号，奥地利军队装备，同时大量外销多国。"
 ZDM_gw_armored_car_equipment:0 "Austro‑Daimler ADGZ (M35) 八轮重型装甲车"
 ZDM_gw_armored_car_equipment_short:0 "Austro‑Daimler ADGZ (M35)"
 ZDM_gw_armored_car_equipment_desc:0 "Austro‑Daimler ADGZ (M35) 装甲车是奥地利奥斯特罗‑戴姆勒公司研发的 8×8 重型轮式装甲车，可承担侦察、人员投送、治安作战，车体采用倾斜装甲，前后双向驾驶结构，搭载 150 马力六缸汽油发动机，装甲厚度 11 毫米，乘员 6 人，主武器为一门 20 毫米机关炮搭配多挺 MG34 机枪，公路最大时速 70 千米。1935‑1937 年交付奥地利陆军与警察部队，总产量 27 台；德奥合并后德军接收，党卫军后续追加 25 台订单，全部用于占领区治安、东线反游击作战，不用于前线突击运兵。"
 ZDM_armored_car_equipment_1:0 "Saurer Sd.Kfz.254（RK‑7）轮‑履两用装甲侦察车"
 ZDM_armored_car_equipment_1_short:0 "Saurer Sd.Kfz.254（RK‑7）"
 ZDM_armored_car_equipment_1_desc:0 "Saurer Sd.Kfz.254 是奥地利绍勒尔公司研制的轮履互换式装甲车辆，原型为奥地利炮兵观察车，既可以车轮公路高速行驶，也可切换履带越野机动，搭载 70 马力四缸柴油发动机，装甲 6‑15 毫米，乘员 7 人，装备一挺 MG34 机枪，可搭载少量步兵，兼顾侦察、炮兵观测与人员短途输送。1938 德奥合并前仅生产 12 台，德国接管后继续生产，总产 140 台，德军编号 Sd.Kfz.254，多用于东线炮兵单位，属于侦察型装甲运兵载体，并非专职步兵运兵车。"
 ZDM_armored_car_equipment_2:0 "施泰尔 ASCOD 步兵战车（含运兵亚型）"
 ZDM_armored_car_equipment_2_short:0 "施泰尔 ASCOD"
 ZDM_armored_car_equipment_2_desc:0 "ASCOD 是奥地利斯太尔与西班牙合作研发履带式步兵战车，基础版本为步兵战车，也存在装甲运兵改型，焊接复合装甲，大功率柴油发动机，可搭载 7 名步兵，装备 30 毫米机关炮，奥地利军队装备该型，兼顾运兵与突击作战。"
 ZDM_train_equipment_4:0 "kStB 80 型，奥地利联邦铁路 97 型 调机蒸汽机车"
 ZDM_train_equipment_4_short:0 "kStB 80 型"
 ZDM_train_equipment_4_desc:0 "kStB 80 是奥匈小型货运调车蒸汽机车，奥地利战后编号 97 型，德奥合并后 DR 97.20，多用于车站、军工厂调运军用列车、装甲车辆平板车，短小灵活，斯太尔、SGP 均有制造。"
 ZDM_train_equipment_5:0 "SGP 1080 型电力机车（奥地利联邦铁路）"
 ZDM_train_equipment_5_short:0 "SGP 1080 型"
 ZDM_train_equipment_5_desc:0 "SGP 1080 型电力机车，奥地利自研干线电力机车，适用于阿尔卑斯山区电气化铁路，功率大，适合山区重载。德奥合并后编入德国国铁，牵引军用物资、部队输送列车，阿尔卑斯山地核心机车。"
 ZDM_train_equipment_1: "奥地利联邦铁路 310 型蒸汽机车（kStB 310）"
 ZDM_train_equipment_1_short: "奥地利联邦铁路 310 型"
 ZDM_train_equipment_1_desc: "kStB 310 型蒸汽机车是奥匈帝国时期设计的 4‑6‑2 轮式客运蒸汽机车，战后奥地利联邦铁路继续沿用，锅炉压力高，行驶平稳，战时承担客运与军用人员列车牵引任务。德奥合并后德国铁路编号 DR 17.10，大量在奥地利本土线路服役，部分调拨德国本土使用。"
 ZDM_train_equipment_2: "奥地利联邦铁路 52 型蒸汽机车（战争机车，SGP 维也纳生产）"
 ZDM_train_equipment_2_short: "奥地利联邦铁路 52 型"
 ZDM_train_equipment_2_desc: "DR 52 “战争机车”，并非奥地利原创，由维也纳 SGP 工厂许可证生产。采用简化设计，节约钢材，大轮幅，煤水车一体，用于牵引军用物资列车、兵员列车，二战中后期大量制造，东线、巴尔干运输广泛使用。"
 ZDM_train_equipment_3: "格拉夫‑施蒂夫 铁路装甲列车"
 ZDM_train_equipment_3_short: "格拉夫‑施蒂夫"
 ZDM_train_equipment_3_desc: "格拉夫‑施蒂夫装甲列车，奥地利战前自研装甲列车，由该公司改造普通铁路车厢，钢板包裹车厢，搭载机枪、20 毫米机关炮，用于边境警戒、平乱。1938 德奥合并后全部被德军接收，部分改装加强火炮，投入巴尔干、东线反游击作战。编组含装甲炮车、步兵载员车厢、机车防护车厢。"
 ZDM_anti_air_equipment_1:0 "4cm Flak M.32 奥地利 40 毫米博勒高射炮"
 ZDM_anti_air_equipment_1_short:0 "4cm Flak M.32"
 ZDM_anti_air_equipment_1_desc:0 "4cm Flak M.32 高射炮是奥地利博勒公司研发的中型机关防空炮，弹链供弹，炮管水冷，轮式机动炮架，射速 120 发 / 分钟，有效射高 5500 米，兼顾对空与平射反坦克，为奥军核心机动中口径防空武器。德奥合并后德军编号 4cm Flak 280 (ö)，部分调拨巴尔干、本土防空，性能不及德军 Flak 38，逐步退居二线。"
 ZDM_anti_air_equipment_2:0 "2cm Flak M.35 奥地利 20 毫米博勒双联装机关炮"
 ZDM_anti_air_equipment_2_short:0 "2cm Flak M.35"
 ZDM_anti_air_equipment_2_desc:0 "2cm Flak M.35 高射机关炮是奥地利博勒公司研制的轻型防空机关炮，20 毫米口径，轮式炮架，弹匣供弹，射速 280 发每分钟，有效射高 2200 米，既可以车载也可阵地部署，奥地利陆军营级防空武器。德奥合并后德军编号 2cm Flak 155 (ö)，大量用于占领区反低空飞机、反游击作战。"
 ZDM_anti_air_equipment_3:0 "Flak18/36 88 毫米高炮"
 ZDM_anti_air_equipment_3_short:0 "Flak18/36"
 ZDM_anti_air_equipment_3_desc:1 "8.8cm Flak 系列高射炮为德国设计，奥地利博勒工厂战时参与炮管、炮架零部件生产，并非奥地利自研。该炮兼顾防空与反坦克，是德军标志性火炮，奥地利出产部件供给全欧洲防空部队。"
 ZDM_anti_air_equipment_x:0 "奥利康 35 毫米双管高炮 GDF‑005"
 ZDM_anti_air_equipment_x_short:0 "奥利康 35"
 ZDM_anti_air_equipment_x_desc:0 "引进瑞士奥利康 35 毫米双联高炮，奥地利联邦国防军长期主力中近程防空武器，可搭配火控雷达，打击飞机、直升机。"
 ZDM_anti_tank_equipment_1:0 "3.7cm Pak M.34 奥地利 37 毫米反坦克炮"
 ZDM_anti_tank_equipment_1_short:0 "3.7cm Pak M.34"
 ZDM_anti_tank_equipment_1_desc:0 "3.7cm Pak M.34 反坦克炮是奥地利博勒公司研发的轻型反坦克炮，轮式机动炮架，轻便易于马匹牵引，发射 37 毫米穿甲弹药，适合师属反坦克单位，用来对抗二三十年代轻型坦克。德奥合并后德军编号 3.7cm Pak 156 (ö)，很快就威力过时，多用于训练与占领区治安。"
 ZDM_anti_tank_equipment_2:0 "4cm Pak M.32 博勒 40 毫米反坦克炮（防空炮衍生）"
 ZDM_anti_tank_equipment_2_short:0 "4cm Pak M.32"
 ZDM_anti_tank_equipment_2_desc:0 "4cm Pak M.32 反坦克炮由 4cm Flak M.32 高射炮改来，炮身相同，更换反坦克炮架，弹链供弹，具备不错的穿甲能力，可高平两用，奥地利少量装备。德奥合并后德军接收，编号 4cm Pak 281 (ö)，因为重量偏大，没有大规模使用。"
 ZDM_anti_tank_equipment_3:0 "4.7cm Pak M.35 奥地利 47 毫米反坦克炮"
 ZDM_anti_tank_equipment_3_short:0 "4.7cm Pak M.35"
 ZDM_anti_tank_equipment_3_desc:0 "4.7cm Pak M.35 反坦克炮是奥地利博勒公司研制的轮式机动反坦克火炮，采用钢制身管，开式炮架，发射 47 毫米穿甲弹，炮口初速 630m/s，可打击装甲目标，也可平射压制步兵，是奥地利陆军主力反坦克炮。德奥合并后德军编号 4.7cm Pak 177 (ö)，大量配发给二线、占领区守备部队，面对后期苏军重型坦克威力不足。"
 ZDM_anti_tank_equipment_x:0 "7.5cm Pak 40 反坦克炮（许可生产）"
 ZDM_anti_tank_equipment_x_short:0 "7.5cm Pak 40"
 ZDM_anti_tank_equipment_x_desc:0 "7.5cm Pak40 反坦克炮为德国自研主力反坦克炮，奥地利博勒工厂代工生产炮管与炮架部件，并非奥地利设计。该炮 75 毫米口径，是德军二战中后期核心反坦克武器，奥地利生产的零部件供给各条战线。"
 ZDM_artillery_equipment_2:0 "10cm Feldhaubitze M.14 100 毫米 M.14 榴弹炮"
 ZDM_artillery_equipment_2_short:0 "10cm Feldhaubitze M.14"
 ZDM_artillery_equipment_2_desc:0 "10cm Feldhaubitze M.14 榴弹炮源自奥匈帝国一战老炮，奥地利共和国继续改进服役，骡马牵引，分体炮架，发射 100 毫米高爆榴弹，弹道弯曲用于阵地压制。德奥合并后德军编号 10cm FH 14 (ö)，大量用于占领区治安、海岸防御，性能老旧，二战中后期逐步退居训练用途。"
 ZDM_artillery_equipment_3:0 "15cm schwere Haubitze M.15 150 毫米 M.15 重型榴弹炮"
 ZDM_artillery_equipment_3_short:0 "15cm schwere Haubitze M.15"
 ZDM_artillery_equipment_3_desc:0 "15cm schwere Haubitze M.15 重型榴弹炮为奥匈一战遗留重榴弹炮，奥地利继续列装军属重炮单位，大口径弯曲弹道，负责摧毁工事、集群目标，需要重型车辆牵引。德奥合并后德军编号 15cm sFH 15 (ö)，多用于后方要塞、海岸防御，不适合机动作战。"
 ZDM_artillery_equipment_x:0 "15cm schwere Haubitze M.39 150 毫米 M.39 重型榴弹炮"
 ZDM_artillery_equipment_x_short:0 "15cm schwere Haubitze M.39"
 ZDM_artillery_equipment_x_desc:0 "15cm schwere Haubitze M.39 重型榴弹炮是奥地利战前最后一款自研重榴弹炮，改进炮架与后坐机构，重量优化，提升射程，计划作为奥军军属重炮，仅小批量生产。德奥合并后被德军接收，编号 15cm sFH 40 (ö)，产量稀少。"
 ZDM_rocket_artillery_equipment_1:0 "M‑51（RM‑51）130 毫米自行火箭炮"
 ZDM_rocket_artillery_equipment_1_short:0 "M‑51（RM‑51）"
 ZDM_rocket_artillery_equipment_1_desc:0 "M‑51 火箭炮是捷克斯洛伐克 RM‑51 火箭炮的奥地利改型，底盘更换为斯太尔 680M3 6×6 军用卡车，32 管发射装置，发射 130 毫米火箭弹，最大射程 8.2 千米，整车乘员 6 人，1974 年进入奥地利联邦国防军服役，承担师属远程火力压制任务，为奥军冷战主力火箭炮。"
 ZDM_rocket_artillery_equipment_2:0 "M‑63 “普拉门” 128 毫米火箭炮"
 ZDM_rocket_artillery_equipment_2_short:0 "M‑63 “普拉门”"
 ZDM_rocket_artillery_equipment_2_desc:0 "M‑63 “普拉门” 是南斯拉夫研制的 32 管 128 毫米牵引火箭炮，奥地利引进少量装备，用于团级火力支援，射程约 12 千米，作为 M‑51 的补充装备。"
 ZDM_rocket_artillery_equipment_x:0 "4K‑4FA 81 毫米多管火箭发射车"
 ZDM_rocket_artillery_equipment_x_short:0 "4K‑4FA"
 ZDM_rocket_artillery_equipment_x_desc:0 "4K‑4FA 81 毫米多管火箭发射车是奥地利绍勒尔公司在 4K‑4FA 履带装甲运兵车底盘上改装的火箭炮，车体后部安装回转式火箭发射架，每侧 9 管共 18 管 81 毫米火箭弹，可伴随机械化部队机动射击，仅小批量试验装备，后期退役，属于试验型近程火箭炮。"