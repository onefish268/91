  Great_Wall: "长城"
  Great_Wall_desc: "§L长城，又称万里长城，是中国古代的军事防御工事，是一道高大、坚固而且连绵不断的长垣，用以限隔敌骑的行动。长城不是一道单纯孤立的城墙，而是以城墙为主体，同大量的城、障、亭、标相结合的防御体系。\n长城修筑的历史可上溯到西周时期，发生在首都镐京（今陕西西安）的著名典故“烽火戏诸侯”就源于此。春秋战国时期，列国争霸，互相防守，长城修筑进入第一个高潮，但此时修筑的长度都比较短。秦灭六国统一天下后，秦始皇连接和修缮战国长城，始有万里长城之称。明朝是最后一个大修长城的朝代，人们所看到的长城多是此时修筑。§!"

  Kivotos_urban: "基沃托斯学院区"
  Kivotos_urban_desc: "§L这里不是传统的战场，而是由大理石校舍、防弹玻璃温室、错综复杂的地下商业街和充满青春气息的林荫道组成的特殊空间。在基沃托斯，‘校园’即是‘堡垒’。街道两旁随处可见的自动贩卖机和坚固的围墙为持有光环的学生们提供了完美的交火掩体。任何试图入侵此地的正规军都会发现，他们面对的是一个由无数教室和走廊构成的立体防御迷宫。§!"

