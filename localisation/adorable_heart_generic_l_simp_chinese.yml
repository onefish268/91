  generic.2017.desc: "随着我们战事的失利，我们不得不承认，我们已经失去了在欧洲的跳板，如果继续战争，我们必须要付出巨大的代价，仍至本土受到威胁。\n[FROM.Getname]向我们发来和谈请求，她希望我们放弃我们在欧洲的领土与盟友，同时她们也会放弃她们在美洲的利益，然后两国达成无条件和平。"
