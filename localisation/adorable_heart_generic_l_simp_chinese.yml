  magic_attack_DOCTRINE_LABEL: "灵装作战学说"
  magic_attack_DOCTRINE_DESC: "将有限的魔法能量瞬间转化为压倒性的物理破坏力。"
  special_forces_magic: "魔法同调"
  special_forces_magic_desc: "士兵们要让魔力回路和制式武器完美同步。只有呼吸一致了，手中的枪炮才不会仅仅是冰冷的铁块。"
  Magic_idea: "魔法同调"
  Magic_idea2: "疾风步伐"
  Magic_idea3: "绝对结界"
  Magic_idea4: "心念感应"
  Magic_idea5: "心之共鸣"
  Magic_idea6: "月之封印"
  Magic_idea7: "终末的交响曲"
  special_forces_Magic2: "疾风步伐"
  special_forces_Magic2_desc: "为什么要傻傻地站在原地挨打呢？我们要像风一样，呼地一下飞到敌人的侧面，然后再嗖地一下穿过去！"
  special_forces_Magic3: "绝对结界"
  special_forces_Magic3_desc: "我们要在这里扎根，将魔力化作拒绝一切恶意的叹息之墙。无论是炮弹还是恐惧，都别想越过这条线。"
  special_forces_Magic4: "魔力后勤"
  special_forces_Magic4_desc: "使用魔法的力量把补给和能量源源不断地送过去。只要后勤跟得上，大家就能一直精神满满地努力了！"
  special_forces_Magic4_tt:0 "魔法步兵部队: -§Y灵想兵装§!需求：§G-10§!\n魔炮营: -§Y魔炮§!需求：§G-5§!"
  special_forces_Magic5: "心念感应"
  special_forces_Magic5_desc: "隐藏着黑暗力量的……啊不对，是隐藏着潜能的新型灵装啊，请在我们的面前显示你真正的力量！"
  special_forces_Magic6: "心之共鸣"
  special_forces_Magic6_desc: "一个人是无法完成所有事情的，但是大家在一起的话，就会发生奇迹！步兵、坦克、飞机……大家要像好朋友一样手拉手！当你进攻的时候，我来掩护；当你防守的时候，我来支援。只要我们的心连在一起，这股力量就是无敌的！"
  special_forces_Magic7: "粉碎星辰的一击"
  special_forces_Magic7_desc: "汇聚所有的力量，集中在一点！不要犹豫，不要迷茫，把所有的希望都赌在这一击上！就像流星划破夜空一样，瞬间贯穿敌人的核心。只要这一下打得够准、够狠，所有的黑暗都会被瞬间驱散！这是最后的、也是最闪耀的必杀技！"
  special_forces_Magic8: "月之封印"
  special_forces_Magic8_desc: "不需要把坏东西都打碎，只要让他们动弹不得就好啦！我们要像温柔的月光一样，悄悄地、全面地包围她们，切断她们的退路，封锁她们的希望。等到她们发现自己无路可逃的时候，除了乖乖变回原来的样子（投降），就没有别的办法了！"
  special_forces_Magic9: "终末的交响曲"
  special_forces_Magic9_desc: "大家，把力量借给我吧！这已经是最后了，不需要再保留什么。所有的灵装同时全功率输出，让魔力的光辉像盛大的烟火一样覆盖整个战场！虽然会很吵闹，但这样就能一瞬间让敌人失去战斗意志，让和平快点到来！绝对没问题的！"

  magic_attack_subtitle1: "机动步兵"
  magic_attack_subtitle2: "魔法支援"
  magic_attack_subtitle3: "大规模训练"
  magic_attack_subtitle4: "精锐部队"

  cat_strategic_destruction: "战略破坏学说"


  strike_witches_xueshuo_name: "强袭魔女"
  strike_witches_xueshuo_desc: "天空不再是冰冷机床产出的钢铁坟场，而是属于魔女们的意志延伸。通过“强袭组件”将体内魔力转化为推进力与防护屏障，她们以凡人无法理解的机动轨迹穿梭于弹雨之间。这不仅是一场空军革命，更是人类首次将神秘学力量系统性地投射于万米高空。当魔纹在双翼闪耀之时，旧时代的航空理论将化为灰烬。"
