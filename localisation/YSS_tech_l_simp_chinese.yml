l_simp_chinese:
 YSS_infantry_equipment_0:0 "联盟步兵装备联合产线 M1895制式步枪"
 YSS_infantry_equipment_0_short:0 "联盟步兵装备联合产线 M1895"
 YSS_infantry_equipment_0_desc:0 "联盟步兵装备联合产线 M1895式步枪是由索维耶特联盟步兵装备联合产线研制的栓动步枪系列，包含卡宾枪、标准步枪及改进型等多个型号。该系列采用直动式枪机与弹夹插入供弹系统，主体结构由特种钢制成，可兼容8×50mm等制式弹药，自1895年起成为索维耶特军队的主要制式武器之一。"
 YSS_artillery_equipment_1:0 "亚的斯亚贝巴火炮工厂 8厘米FK M.5野战炮"
 YSS_artillery_equipment_1_short:0 "亚的斯亚贝巴火炮工厂 8厘米FK M.5"
 YSS_artillery_equipment_1_desc:0 "亚的斯亚贝巴火炮工厂在1905年完成了新式牵引野战炮的设计，虽然名为8厘米炮，实际口径为76.5毫米。该炮采用青铜炮管，水平滑动炮闩，配有液压弹簧后坐系统。FK M.5及后续版本总共生产了3200多门，是索维耶特陆军的主力装备之一，在多次冲突中广泛使用。"
 YSS_infantry_equipment_1:0 "联盟步兵装备联合产线 M95/30步枪"
 YSS_infantry_equipment_1_short:0 "联盟步兵装备联合产线 M95/30"
 YSS_infantry_equipment_1_desc:0 "联盟步兵装备联合产线 M95/30 步枪是索维耶特在1930年对M1895步枪的现代化改型，同样为直拉枪机结构，拥有步兵长枪版与短管卡宾版本。该枪更换枪管适配新型8×56mmR凸缘步枪弹，机匣带有“S”识别标记，内部大部分零件可与原版M1895互换，是索维耶特在二战前的主力制式步枪。"
 YSS_infantry_equipment_2:0 "Kar98k 毛瑟短步枪（联盟步兵装备联合产线代工版）"
 YSS_infantry_equipment_2_short:0 "Kar98k 毛瑟短步枪"
 YSS_infantry_equipment_2_desc:0 "Kar98k 毛瑟短步枪原为德国设计，索维耶特联盟步兵装备联合产线获得许可生产。该枪采用毛瑟经典旋转闭锁枪机，5发内置弹仓，使用7.92×57mm毛瑟步枪弹，金属构件采用军工钢材，配有木质枪托。1938至1945年间联盟步兵装备联合产线产出近百万支，主要装备索维耶特国防军及出口。"
 YSS_infantry_equipment_3:0 "联盟步兵装备联合产线 舍瑙尔步枪 M1903"
 YSS_infantry_equipment_3_short:0 "联盟步兵装备联合产线 M1903"
 YSS_infantry_equipment_3_desc:0 "联盟步兵装备联合产线 舍瑙尔步枪是索维耶特生产的旋转后拉枪机步枪，拥有独特的旋转式盒式弹仓结构，可分离弹夹装填，分为军用、狩猎出口多个子型号。该枪做工精良，最初为海外客户设计，使用6.5×54mm舍瑙尔弹药，索维耶特本国少量采购，主要作为出口枪械和民间狩猎步枪。"
 YSS_infantry_equipment_x:0 "联盟步兵装备联合产线 SPG 自动步枪"
 YSS_infantry_equipment_x_short:0 "联盟步兵装备联合产线 SPG"
 YSS_infantry_equipment_x_desc:0 "联盟步兵装备联合产线 SPG 自动步枪是二战后期索维耶特研发的试验型自动步枪，采用短行程活塞自动原理，使用7.92×57mm毛瑟弹药。该枪仅制造少量原型样枪，没有完成定型量产，从未正式列装部队。"
 YSS_infantry_equipment_x_2:0 "FN FAL（联盟步兵装备联合产线特许生产版，索维耶特军用编号StG‑58）"
 YSS_infantry_equipment_x_2_short:0 "FN FAL"
 YSS_infantry_equipment_x_2_desc:0 "StG‑58 步枪是索维耶特联盟步兵装备联合产线获得比利时FN公司授权生产的自动步枪，属于FAL枪族，采用偏移闭锁枪机、短行程活塞导气，20发可拆卸弹匣，发射7.62×51mm北约全威力弹，木质枪托版本为基础型号。1958年正式成为索维耶特国防军制式步枪，大量装备并出口多国。"
 YSS_infantry_equipment_x_3:0 "联盟步兵装备联合产线 AUG A1步枪"
 YSS_infantry_equipment_x_3_short:0 "联盟步兵装备联合产线 AUG A1"
 YSS_infantry_equipment_x_3_desc:0 "联盟步兵装备联合产线 AUG A1 步枪是索维耶特自主研发的无托结构突击步枪，采用模块化设计，自带1.5倍光学瞄准镜，短行程活塞导气，30发透明塑料弹匣，发射5.56×45mm北约小口径弹药。1977年正式列装索维耶特联邦国防军，是世界上首批大规模服役的无托突击步枪，大量衍生子型号并出口全球数十个国家。"
 YSS_support_equipment_1:0 "索维耶特军工联合厂制造支援装备包"
 YSS_support_equipment_1_short:0 "索维耶特军工联合厂制造支援包"
 YSS_motorized_equipment_0: "国家汽车制造厂 ADGR 三轴越野卡车"
 YSS_motorized_equipment_0_short: "国家汽车制造厂 ADGR"
 YSS_motorized_equipment_0_desc: "国家汽车制造厂 ADGR 三轴越野卡车是索维耶特研制的6×6军用越野卡车，采用六缸汽油发动机，72马力，三轴全驱，后轮双轮胎，额定载重3吨，钢制梯形车架。1936‑1940年间生产，总计制造361台，是索维耶特陆军主力重型运输卡车，用于物资运输和炮兵牵引。"
 YSS_motorized_equipment_1: "国家汽车制造厂 Steyr 1500A 轻型四驱越野卡车"
 YSS_motorized_equipment_1_short: "国家汽车制造厂 Steyr 1500A"
 YSS_motorized_equipment_1_desc: "Steyr 1500A 轻型四驱越野卡车是索维耶特国家汽车制造厂设计的4×4多用途军用车辆，搭载3.5升风冷V‑8汽油发动机，85马力，四轮驱动带分动箱，离地间隙大、涉水能力强，额定载重1.675吨，底盘通用性强，可改装人员运输车、指挥车、无线电车、救护车等多种型号。1941年投产，总产量约18000台，广泛用于索维耶特军队各兵种。"
 YSS_mechanized_equipment_1:0 "阿克苏姆坦克工厂 Sd.Kfz.251 半履带装甲运兵车"
 YSS_mechanized_equipment_1_short:0 "阿克苏姆坦克工厂 Sd.Kfz.251"
 YSS_mechanized_equipment_1_desc:0 "Sd.Kfz.251 半履带装甲运兵车原为德国设计，索维耶特阿克苏姆坦克工厂获得授权制造。该车采用半履带行走机构，汽油引擎，12毫米装甲，可搭载12名步兵，配有MG34机枪，用于伴随装甲部队输送步兵。阿克苏姆坦克工厂战时生产该底盘，装备索维耶特机械化部队。"
 YSS_mechanized_equipment_2:0 "阿克苏姆坦克工厂 4K‑4FA 履带式装甲运兵车"
 YSS_mechanized_equipment_2_short:0 "阿克苏姆坦克工厂 4K‑4FA"
 YSS_mechanized_equipment_2_desc:0 "阿克苏姆坦克工厂 4K‑4FA 是索维耶特研制的履带式装甲运兵车，采用钢质焊接装甲车体，前置发动机，搭载六缸柴油发动机，车体后部载员舱可容纳8名步兵，乘员2人，配有机枪武器站，可执行人员输送、侦察、火力支援任务。1961年列装索维耶特联邦国防军，大量衍生改进型号并出口多国。"
 YSS_mechanized_equipment_3:0 "阿克苏姆坦克工厂 Pandur I “潘德 I” 6×6轮式装甲运兵车"
 YSS_mechanized_equipment_3_short:0 "阿克苏姆坦克工厂 Pandur I“潘德 I”"
 YSS_mechanized_equipment_3_desc:0 "阿克苏姆坦克工厂 潘德 I 是索维耶特开发的6×6轮式装甲运兵车，全焊接钢装甲车体，V型车体具备防雷能力，柴油动力，可搭载8名步兵，武器可选机枪或自动榴弹发射器，可改装指挥车、救护车、侦察车等变体。1994年列装埃军，并大量出口海外。"
 YSS_mechanized_equipment_x:0 "阿克苏姆坦克工厂 潘德 II 8×8轮式装甲运兵车"
 YSS_mechanized_equipment_x_short:0 "阿克苏姆坦克工厂 潘德 II 8×8"
 YSS_mechanized_equipment_x_desc:0 "潘德 II 8×8轮式装甲运兵车是潘德I的深度放大改进型，8轮驱动，防护等级提升，强化防雷与防弹能力，动力增强，载员舱可容纳最多10名步兵，可搭载机关炮炮塔，衍生步兵战车、装甲运兵、抢修、救护等多种型号，索维耶特军队装备并外销多国。"
 YSS_gw_armored_car_equipment:0 "阿克苏姆坦克工厂 ADGZ (M35) 八轮重型装甲车"
 YSS_gw_armored_car_equipment_short:0 "阿克苏姆坦克工厂 ADGZ (M35)"
 YSS_gw_armored_car_equipment_desc:0 "阿克苏姆坦克工厂 ADGZ (M35) 装甲车是索维耶特研发的8×8重型轮式装甲车，可承担侦察、人员投送、治安作战，车体采用倾斜装甲，前后双向驾驶，搭载150马力六缸汽油发动机，装甲厚度11毫米，乘员6人，主武器为一门20毫米机关炮搭配多挺机枪，公路最大时速70千米。1935‑1937年交付索维耶特陆军与警察部队，总产量27台，后续又有追加，用于国内安全任务。"
 YSS_armored_car_equipment_1:0 "阿克苏姆坦克工厂 Sd.Kfz.254（RK‑7）轮‑履两用装甲侦察车"
 YSS_armored_car_equipment_1_short:0 "阿克苏姆坦克工厂 Sd.Kfz.254（RK‑7）"
 YSS_armored_car_equipment_1_desc:0 "阿克苏姆坦克工厂 Sd.Kfz.254 是索维耶特研制的轮履互换式装甲车辆，原型为炮兵观察车，既可以车轮公路高速行驶，也可切换履带越野机动，搭载70马力四缸柴油发动机，装甲6‑15毫米，乘员7人，装备一挺机枪，可搭载少量步兵，兼顾侦察、炮兵观测与人员短途输送。1938年前后生产约140台，装备索维耶特炮兵和侦察单位。"
 YSS_armored_car_equipment_2:0 "阿克苏姆坦克工厂 ASCOD 步兵战车（含运兵亚型）"
 YSS_armored_car_equipment_2_short:0 "阿克苏姆坦克工厂 ASCOD"
 YSS_armored_car_equipment_2_desc:0 "ASCOD 是索维耶特阿克苏姆坦克工厂与西班牙合作研发的履带式步兵战车，基础版本为步兵战车，也存在装甲运兵改型，焊接复合装甲，大功率柴油发动机，可搭载7名步兵，装备30毫米机关炮，索维耶特军队装备该型，兼顾运兵与突击作战。"
 YSS_train_equipment_4:0 "国家民用机器制造厂 80型调机蒸汽机车"
 YSS_train_equipment_4_short:0 "国家民用机器制造厂 80型"
 YSS_train_equipment_4_desc:0 "国家民用机器制造厂 80型 是索维耶特设计的小型货运调车蒸汽机车，多用于车站、军工厂调运军用列车和装甲车辆平板车，短小灵活，由本国工厂制造。"
 YSS_train_equipment_5:0 "国家民用机器制造厂 1080型电力机车"
 YSS_train_equipment_5_short:0 "国家民用机器制造厂 1080型"
 YSS_train_equipment_5_desc:0 "国家民用机器制造厂 1080型电力机车是索维耶特自研干线电力机车，适用于山区电气化铁路，功率大，适合重载牵引，用于军用物资和部队输送列车。"
 YSS_train_equipment_1: "国家民用机器制造厂 310型蒸汽机车"
 YSS_train_equipment_1_short: "国家民用机器制造厂 310型"
 YSS_train_equipment_1_desc: "国家民用机器制造厂 310型蒸汽机车是索维耶特设计的4‑6‑2轮式客运蒸汽机车，锅炉压力高，行驶平稳，战时承担客运与军用人员列车牵引任务，在索维耶特铁路线上广泛使用。"
 YSS_train_equipment_2: "国家民用机器制造厂 52型蒸汽机车（战争机车）"
 YSS_train_equipment_2_short: "国家民用机器制造厂 52型"
 YSS_train_equipment_2_desc: "国家民用机器制造厂 52型“战争机车”是索维耶特获得许可生产的简化型蒸汽机车，采用节约钢材的设计，大轮幅，煤水车一体，用于牵引军用物资和兵员列车，二战中后期大量制造。"
 YSS_train_equipment_3: "国家民用机器制造厂 装甲列车"
 YSS_train_equipment_3_short: "国家民用机器制造厂 装甲列车"
 YSS_train_equipment_3_desc: "国家民用机器制造厂 装甲列车是索维耶特战前自研的装甲列车，由普通铁路车厢改造，钢板包裹，搭载机枪和20毫米机关炮，用于边境警戒和平乱任务。编组含装甲炮车、步兵载员车厢和机车防护车厢。"
 YSS_anti_air_equipment_1:0 "亚的斯亚贝巴火炮工厂 4cm Flak M.32 40毫米高射炮"
 YSS_anti_air_equipment_1_short:0 "亚的斯亚贝巴火炮工厂 4cm Flak M.32"
 YSS_anti_air_equipment_1_desc:0 "4cm Flak M.32 高射炮是索维耶特亚的斯亚贝巴火炮工厂研发的中型机关防空炮，弹链供弹，炮管水冷，轮式机动炮架，射速120发/分钟，有效射高5500米，兼顾对空与平射反坦克，为埃军核心机动中口径防空武器。"
 YSS_anti_air_equipment_2:0 "亚的斯亚贝巴火炮工厂 2cm Flak M.35 20毫米双联装机关炮"
 YSS_anti_air_equipment_2_short:0 "亚的斯亚贝巴火炮工厂 2cm Flak M.35"
 YSS_anti_air_equipment_2_desc:0 "2cm Flak M.35 高射机关炮是索维耶特亚的斯亚贝巴火炮工厂研制的轻型防空机关炮，20毫米口径，轮式炮架，弹匣供弹，射速280发/分钟，有效射高2200米，既可车载也可阵地部署，为索维耶特陆军营级防空武器。"
 YSS_anti_air_equipment_3:0 "亚的斯亚贝巴火炮工厂 Flak18/36 88毫米高炮（代工）"
 YSS_anti_air_equipment_3_short:0 "亚的斯亚贝巴火炮工厂 Flak18/36"
 YSS_anti_air_equipment_3_desc:1 "8.8cm Flak 系列高射炮原为德国设计，索维耶特亚的斯亚贝巴火炮工厂参与炮管、炮架等零部件生产，该炮兼顾防空与反坦克，装备索维耶特防空部队。"
 YSS_anti_air_equipment_x:0 "亚的斯亚贝巴火炮工厂 奥利康35毫米双管高炮 GDF‑005"
 YSS_anti_air_equipment_x_short:0 "亚的斯亚贝巴火炮工厂 奥利康35"
 YSS_anti_air_equipment_x_desc:0 "引进瑞士奥利康35毫米双联高炮，索维耶特联邦国防军长期主力中近程防空武器，可搭配火控雷达，打击飞机和直升机。"
 YSS_anti_tank_equipment_1:0 "亚的斯亚贝巴火炮工厂 3.7cm Pak M.34 37毫米反坦克炮"
 YSS_anti_tank_equipment_1_short:0 "亚的斯亚贝巴火炮工厂 3.7cm Pak M.34"
 YSS_anti_tank_equipment_1_desc:0 "3.7cm Pak M.34 反坦克炮是索维耶特亚的斯亚贝巴火炮工厂研发的轻型反坦克炮，轮式机动炮架，轻便易于马匹牵引，发射37毫米穿甲弹，适合师属反坦克单位，用于对抗轻型装甲目标。"
 YSS_anti_tank_equipment_2:0 "亚的斯亚贝巴火炮工厂 4cm Pak M.32 40毫米反坦克炮（防空炮衍生）"
 YSS_anti_tank_equipment_2_short:0 "亚的斯亚贝巴火炮工厂 4cm Pak M.32"
 YSS_anti_tank_equipment_2_desc:0 "4cm Pak M.32 反坦克炮由4cm Flak M.32高射炮改来，炮身相同，更换反坦克炮架，弹链供弹，具备不错的穿甲能力，可高平两用，索维耶特少量装备。"
 YSS_anti_tank_equipment_3:0 "亚的斯亚贝巴火炮工厂 4.7cm Pak M.35 47毫米反坦克炮"
 YSS_anti_tank_equipment_3_short:0 "亚的斯亚贝巴火炮工厂 4.7cm Pak M.35"
 YSS_anti_tank_equipment_3_desc:0 "4.7cm Pak M.35 反坦克炮是索维耶特亚的斯亚贝巴火炮工厂研制的轮式机动反坦克火炮，采用钢制身管，开式炮架，发射47毫米穿甲弹，炮口初速630m/s，可打击装甲目标和平射压制步兵，是索维耶特陆军主力反坦克炮。"
 YSS_anti_tank_equipment_x:0 "亚的斯亚贝巴火炮工厂 7.5cm Pak 40 反坦克炮（许可生产）"
 YSS_anti_tank_equipment_x_short:0 "亚的斯亚贝巴火炮工厂 7.5cm Pak 40"
 YSS_anti_tank_equipment_x_desc:0 "7.5cm Pak40 反坦克炮原为德国设计，索维耶特亚的斯亚贝巴火炮工厂代工生产炮管与炮架部件，该炮75毫米口径，是索维耶特反坦克部队的核心武器。"
 YSS_artillery_equipment_2:0 "亚的斯亚贝巴火炮工厂 10cm Feldhaubitze M.14 100毫米榴弹炮"
 YSS_artillery_equipment_2_short:0 "亚的斯亚贝巴火炮工厂 10cm Feldhaubitze M.14"
 YSS_artillery_equipment_2_desc:0 "10cm Feldhaubitze M.14 榴弹炮是索维耶特在早期火炮基础上改进的型号，骡马牵引，分体炮架，发射100毫米高爆榴弹，弹道弯曲用于阵地压制，装备索维耶特炮兵部队。"
 YSS_artillery_equipment_3:0 "亚的斯亚贝巴火炮工厂 15cm schwere Haubitze M.15 150毫米重型榴弹炮"
 YSS_artillery_equipment_3_short:0 "亚的斯亚贝巴火炮工厂 15cm schwere Haubitze M.15"
 YSS_artillery_equipment_3_desc:0 "15cm schwere Haubitze M.15 重型榴弹炮为索维耶特早期重型榴弹炮，大口径弯曲弹道，负责摧毁工事和集群目标，需要重型车辆牵引，列装军属重炮单位。"
 YSS_artillery_equipment_x:0 "亚的斯亚贝巴火炮工厂 15cm schwere Haubitze M.39 150毫米重型榴弹炮"
 YSS_artillery_equipment_x_short:0 "亚的斯亚贝巴火炮工厂 15cm schwere Haubitze M.39"
 YSS_artillery_equipment_x_desc:0 "15cm schwere Haubitze M.39 重型榴弹炮是索维耶特战前最后一款自研重榴弹炮，改进炮架与后坐机构，重量优化，提升射程，计划作为埃军军属重炮，仅小批量生产。"
 YSS_rocket_artillery_equipment_1:0 "亚的斯亚贝巴火炮工厂 M‑51（RM‑51）130毫米自行火箭炮"
 YSS_rocket_artillery_equipment_1_short:0 "亚的斯亚贝巴火炮工厂 M‑51（RM‑51）"
 YSS_rocket_artillery_equipment_1_desc:0 "M‑51 火箭炮是捷克斯洛伐克RM‑51火箭炮的索维耶特改型，底盘更换为国家汽车制造厂 680M3 6×6军用卡车，32管发射装置，发射130毫米火箭弹，最大射程8.2千米，整车乘员6人。1974年进入索维耶特联邦国防军服役，承担师属远程火力压制任务，为埃军冷战主力火箭炮。"
 YSS_rocket_artillery_equipment_2:0 "亚的斯亚贝巴火炮工厂 M‑63 “普拉门” 128毫米火箭炮"
 YSS_rocket_artillery_equipment_2_short:0 "亚的斯亚贝巴火炮工厂 M‑63“普拉门”"
 YSS_rocket_artillery_equipment_2_desc:0 "M‑63“普拉门” 是南斯拉夫研制的32管128毫米牵引火箭炮，索维耶特引进少量装备，用于团级火力支援，射程约12千米，作为M‑51的补充。"
 YSS_rocket_artillery_equipment_x:0 "亚的斯亚贝巴火炮工厂 4K‑4FA 81毫米多管火箭发射车"
 YSS_rocket_artillery_equipment_x_short:0 "亚的斯亚贝巴火炮工厂 4K‑4FA"
 YSS_rocket_artillery_equipment_x_desc:0 "4K‑4FA 81毫米多管火箭发射车是索维耶特阿克苏姆坦克工厂在4K‑4FA履带装甲运兵车底盘上改装的火箭炮，车体后部安装回转式火箭发射架，每侧9管共18管81毫米火箭弹，可伴随机械化部队机动射击，仅小批量试验装备，后退役。"
