 YSS_medium_tank_equipment_0: "国家中央战车设计局 CM-1 中型坦克"
 YSS_medium_tank_equipment_0_short: "国家中央战车设计局 CM-1"
 YSS_medium_tank_equipment_0_desc: "国家中央战车设计局 CM-1 是索维耶特研制的中型坦克，采用焊接装甲车体，搭载大功率柴油发动机，主炮为一门75毫米线膛炮，可发射穿甲弹和高爆弹，车体前装甲厚度50毫米，乘员4人，最大公路时速45千米。该车于1950年代列装索维耶特陆军，承担装甲突击和支援任务，衍生出自行高炮、自行榴弹炮和自行反坦克炮等变种。"
 YSS_medium_tank_aa_equipment_0: "国家中央战车设计局 CM-1自行高射炮"
 YSS_medium_tank_aa_equipment_0_short: "国家中央战车设计局 CM-1自行高射炮"
 YSS_medium_tank_aa_equipment_0_desc: "在CM-1中型坦克底盘上拆除炮塔，安装双联装20毫米机关炮，用于伴随装甲部队提供低空防空掩护，也可平射压制地面目标。"
 YSS_medium_tank_artillery_equipment_0: "国家中央战车设计局 CM-1自行加榴炮"
 YSS_medium_tank_artillery_equipment_0_short: "国家中央战车设计局 CM-1自行加榴炮"
 YSS_medium_tank_artillery_equipment_0_desc: "在CM-1底盘上安装105毫米轻型榴弹炮，加装敞开式战斗室，用于直接火力支援，射程较牵引式火炮更远，机动性强。"
 YSS_medium_tank_destroyer_equipment_0: "国家中央战车设计局 CM-1自行反坦克炮"
 YSS_medium_tank_destroyer_equipment_0_short: "国家中央战车设计局 CM-1自行反坦克炮"
 YSS_medium_tank_destroyer_equipment_0_desc: "在CM-1底盘上安装长身管90毫米反坦克炮，配备装甲炮塔，专用于远距离击穿敌方重型装甲，是索维耶特反坦克部队的骨干装备。"
 YSS_heavy_tank_equipment_0: "喀土穆重型机械制造厂 CH-1 重型坦克"
 YSS_heavy_tank_equipment_0_short: "喀土穆重型机械制造厂 CH-1"
 YSS_heavy_tank_equipment_0_desc: "喀土穆重型机械制造厂 CH-1 是索维耶特研发的重型坦克，采用铸造炮塔和轧制装甲车体，正面装甲厚度达100毫米，主炮为一门88毫米坦克炮，搭载大马力汽油发动机，乘员5人，最大公路时速35千米。该车于1960年代小批量生产，用于突破敌方防线，因机动性较差，仅装备少数重装甲部队，衍生有自行榴弹炮和自行反坦克炮型号。"
 YSS_heavy_tank_aa_equipment_0: "喀土穆重型机械制造厂 CH-1自行高射炮"
 YSS_heavy_tank_aa_equipment_0_short: "喀土穆重型机械制造厂 CH-1自行高射炮"
 YSS_heavy_tank_aa_equipment_0_desc: "在CH-1重型坦克底盘上安装四联装20毫米高炮，提供重型装甲部队的机动防空火力，因底盘承载能力强，可携带更多弹药。"
 YSS_heavy_tank_artillery_equipment_0: "喀土穆重型机械制造厂 CH-1自行加榴炮"
 YSS_heavy_tank_artillery_equipment_0_short: "喀土穆重型机械制造厂 CH-1自行加榴炮"
 YSS_heavy_tank_artillery_equipment_0_desc: "在CH-1底盘上安装155毫米重型榴弹炮，采用后部战斗室，用于军属远程火力支援，射程远、威力大，但因底盘数量少，仅少量改装。"
 YSS_heavy_tank_destroyer_equipment_0: "喀土穆重型机械制造厂 CH-1自行反坦克炮"
 YSS_heavy_tank_destroyer_equipment_0_short: "喀土穆重型机械制造厂 CH-1自行反坦克炮"
 YSS_heavy_tank_destroyer_equipment_0_desc: "在CH-1底盘上安装长身管120毫米反坦克炮，配备重装甲战斗室，专为猎杀敌方最新重型坦克而设计，是索维耶特反坦克火力最强的自行炮。"
 YSS_medium_tank_equipment_1: "国家中央战车设计局 CM-2 中型坦克"
 YSS_medium_tank_equipment_1_short: "国家中央战车设计局 CM-2"
 YSS_medium_tank_equipment_1_desc: "CM-2 是CM-1的深度改进型，换装90毫米线膛炮，装甲增强至70毫米，更换新型柴油发动机，乘员4人，最大时速50千米。1960年代成为埃军主力，广泛装备各装甲师。"
 YSS_medium_tank_aa_equipment_1: "国家中央战车设计局 CM-2自行高射炮"
 YSS_medium_tank_aa_equipment_1_short: "国家中央战车设计局 CM-2自行高射炮"
 YSS_medium_tank_aa_equipment_1_desc: "在CM-2底盘上安装四联装12.7毫米高射机枪，用于低空防御。"
 YSS_medium_tank_artillery_equipment_1: "国家中央战车设计局 CM-2自行加榴炮"
 YSS_medium_tank_artillery_equipment_1_short: "国家中央战车设计局 CM-2自行加榴炮"
 YSS_medium_tank_artillery_equipment_1_desc: "在CM-2底盘上安装122毫米榴弹炮，增强火力支援能力。"
 YSS_medium_tank_destroyer_equipment_1: "国家中央战车设计局 CM-2自行反坦克炮"
 YSS_medium_tank_destroyer_equipment_1_short: "国家中央战车设计局 CM-2自行反坦克炮"
 YSS_medium_tank_destroyer_equipment_1_desc: "在CM-2底盘上安装105毫米反坦克炮，提升穿甲威力。"
 YSS_medium_tank_equipment_2: "国家中央战车设计局 CM-3 中型坦克"
 YSS_medium_tank_equipment_2_short: "国家中央战车设计局 CM-3"
 YSS_medium_tank_equipment_2_desc: "CM-3 是索维耶特1970年代研发的第三代中型坦克，采用复合装甲和105毫米线膛炮，搭载大功率柴油机，乘员4人，最大时速55千米。该车性能均衡，大量出口友好国家。"
 YSS_medium_tank_aa_equipment_2: "国家中央战车设计局 CM-3自行高射炮"
 YSS_medium_tank_aa_equipment_2_short: "国家中央战车设计局 CM-3自行高射炮"
 YSS_medium_tank_aa_equipment_2_desc: "在CM-3底盘上安装双管30毫米机关炮，配备简易火控，提升防空精度。"
 YSS_medium_tank_artillery_equipment_2: "国家中央战车设计局 CM-3自行加榴炮"
 YSS_medium_tank_artillery_equipment_2_short: "国家中央战车设计局 CM-3自行加榴炮"
 YSS_medium_tank_artillery_equipment_2_desc: "在CM-3底盘上安装155毫米轻型榴弹炮，用于军属远程支援。"
 YSS_medium_tank_destroyer_equipment_2: "国家中央战车设计局 CM-3自行反坦克炮"
 YSS_medium_tank_destroyer_equipment_2_short: "国家中央战车设计局 CM-3自行反坦克炮"
 YSS_medium_tank_destroyer_equipment_2_desc: "在CM-3底盘上安装120毫米滑膛反坦克炮，可发射尾翼稳定脱壳穿甲弹。"
 YSS_medium_tank_equipment_3: "国家中央战车设计局 CM-4 中型坦克"
 YSS_medium_tank_equipment_3_short: "国家中央战车设计局 CM-4"
 YSS_medium_tank_equipment_3_desc: "CM-4 是索维耶特1990年代推出的现代化中型坦克，配备数字化火控、120毫米滑膛炮和复合反应装甲，乘员3人（自动装弹机），最大时速65千米。该型为埃军当前主力，并参与国际维和行动。"
 YSS_medium_tank_aa_equipment_3: "国家中央战车设计局 CM-4自行高射炮"
 YSS_medium_tank_aa_equipment_3_short: "国家中央战车设计局 CM-4自行高射炮"
 YSS_medium_tank_aa_equipment_3_desc: "在CM-4底盘上安装双联35毫米高炮，集成搜索雷达，可伴随机械化部队防空。"
 YSS_medium_tank_artillery_equipment_3: "国家中央战车设计局 CM-4自行加榴炮"
 YSS_medium_tank_artillery_equipment_3_short: "国家中央战车设计局 CM-4自行加榴炮"
 YSS_medium_tank_artillery_equipment_3_desc: "在CM-4底盘上安装155毫米52倍径自行榴弹炮，具备自动装填和快速射击能力。"
 YSS_medium_tank_destroyer_equipment_3: "国家中央战车设计局 CM-4自行反坦克炮"
 YSS_medium_tank_destroyer_equipment_3_short: "国家中央战车设计局 CM-4自行反坦克炮"
 YSS_medium_tank_destroyer_equipment_3_desc: "在CM-4底盘上安装长身管135毫米反坦克炮，采用无人炮塔，是埃军反坦克火力最强的履带式平台。"
 YSS_heavy_tank_equipment_1: "喀土穆重型机械制造厂 CH-2 重型坦克"
 YSS_heavy_tank_equipment_1_short: "喀土穆重型机械制造厂 CH-2"
 YSS_heavy_tank_equipment_1_desc: "CH-2 是CH-1的改进型，换装100毫米坦克炮，增强动力系统，装甲强化至120毫米，乘员5人，最大时速38千米。该型产量较低，主要用于军事阅兵和重点防御。"
 YSS_heavy_tank_aa_equipment_1: "喀土穆重型机械制造厂 CH-2自行高射炮"
 YSS_heavy_tank_aa_equipment_1_short: "喀土穆重型机械制造厂 CH-2自行高射炮"
 YSS_heavy_tank_aa_equipment_1_desc: "在CH-2底盘上安装双联37毫米高炮，提升对中低空目标的毁伤能力。"
 YSS_heavy_tank_artillery_equipment_1: "喀土穆重型机械制造厂 CH-2自行加榴炮"
 YSS_heavy_tank_artillery_equipment_1_short: "喀土穆重型机械制造厂 CH-2自行加榴炮"
 YSS_heavy_tank_artillery_equipment_1_desc: "在CH-2底盘上安装203毫米重型榴弹炮，具备战略级火力打击能力。"
 YSS_heavy_tank_destroyer_equipment_1: "喀土穆重型机械制造厂 CH-2自行反坦克炮"
 YSS_heavy_tank_destroyer_equipment_1_short: "喀土穆重型机械制造厂 CH-2自行反坦克炮"
 YSS_heavy_tank_destroyer_equipment_1_desc: "在CH-2底盘上安装150毫米反坦克炮，威力巨大，但因底盘数量稀少仅改装数辆。"
 YSS_heavy_tank_equipment_2: "喀土穆重型机械制造厂 CH-3 重型坦克"
 YSS_heavy_tank_equipment_2_short: "喀土穆重型机械制造厂 CH-3"
 YSS_heavy_tank_equipment_2_desc: "CH-3 是索维耶特1970年代研发的多炮塔重型坦克（但仅保留主炮塔），采用焊接装甲和复合防护，主炮为122毫米线膛炮，乘员5人，最大时速40千米。该车因重量过大仅装备警卫部队。"
 YSS_heavy_tank_aa_equipment_2: "喀土穆重型机械制造厂 CH-3自行高射炮"
 YSS_heavy_tank_aa_equipment_2_short: "喀土穆重型机械制造厂 CH-3自行高射炮"
 YSS_heavy_tank_aa_equipment_2_desc: "在CH-3底盘上安装四管25毫米高炮，具备高射速和大弹药基数。"
 YSS_heavy_tank_artillery_equipment_2: "喀土穆重型机械制造厂 CH-3自行加榴炮"
 YSS_heavy_tank_artillery_equipment_2_short: "喀土穆重型机械制造厂 CH-3自行加榴炮"
 YSS_heavy_tank_artillery_equipment_2_desc: "在CH-3底盘上安装180毫米榴弹炮，用于远程压制。"
 YSS_heavy_tank_destroyer_equipment_2: "喀土穆重型机械制造厂 CH-3自行反坦克炮"
