 ZDM_luomu: "罗姆"
 ZDM_luomu_warrior_desc: "§L艾里希·冯·罗姆已经到达了人生的顶峰。\n艾里希·冯·罗姆，自称是德意志国的退伍上将，在戴维斯决定革命的时候找上了她。戴维斯并不觉得这个个子矮小的女人可靠，但还是接受了她。在杜马共和国成立后，罗姆理所应当的成为了大元帅——这是对她成功投资的报酬。罗姆并不认同哈里的理念，认为“任何妄图抹去战争的想法都是可笑的”，两人经常因为理念不合而争吵不休。罗姆的私生活非常的糟糕，平日里光鲜亮丽的大元帅晚上就成了兽耳娘的奴仆，宁愿呆在夜店里泡一个通宵也不愿意回去批改任何一份公文。但无论如何，只要罗姆还在共和国一日，没有人会担心这栋房子会被什么东西砸塌。\n狡猾的骗子，信任的魁首。§!"
 daiweisi_DESC: "如果结果注定是失败，哈里·戴维斯会笑着接受命运。\n若是要从罗德西亚的民主人士中选择一个代表，那一定是戴维斯。她或许不是最出色的，但一定是最受兽娘们欢迎的白人。戴维斯不是一开始就是革命的拥护者，为了实现她那幼稚的理想，她曾在总督府门前于瓢泼大雨中站了一天一夜，只为让德拉蒙德同意让兽人能和白人可以同上厕所，而不是兽人只能在野外解决方便。在总督断然拒绝后，她又进入了自治领议会，试图在这里为兽人谋取一些福祉，可她又失败了。议会不过是德拉蒙德的橡皮图章。但她从未气馁。\n人人都能和平共处的世界终将实现。"
