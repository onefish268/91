 zdm.1.t: "路人"
 zdm.1.d: "戴维斯是在新里斯本西区边缘的一条红土路上遇见她的。\n那天下午她刚参加完一场工人集会，没有坐车。她的司机早就习惯了——每次集会结束后，戴维斯都会独自走一段路。她说走在路上才能慢慢把声音过滤掉，听到普通人的声音。司机把车停在集会场地三公里外等她。戴维斯沿着一条向西延伸的窄巷走，地面是压实的红土，两旁的房屋从砖墙逐渐过渡到铁皮棚屋。她走得不快，时不时停下来看路边的菜摊或蹲在门口剥豆子的人。路过一个水井时她蹲下来洗了洗手，和井边打水的妇人聊了几句收成——她的绍纳语说得不流利，但对方能听懂。正是在这段路上，她看见路边蹲着一个小小的身影。\n一个兽人女孩，大约七八岁，穿着一件明显大了许多的旧衬衫，袖口卷了好几圈，露出细瘦的手腕。她蹲在墙根底下，手里攥着一根树枝，在地上划拉着什么。\n戴维斯停下脚步，在她旁边蹲下来，和她平视。\n“小朋友，你怎么一个人在这里？”\n小女孩抬起头。眼睛很大，眼瞳是浅褐色的，兽耳从乱蓬蓬的头发里支棱出来，左耳的尖端缺了一个小角。\n“你叫什么名字？”\n“他们没有给我起名字。”\n她说得很轻。\n戴维斯没有追问，站起来，朝女孩伸出手。\n“跟我来，我带你去个暖和的地方。”\n女孩看了那只手一会儿，慢慢站起来，把树枝放下。戴维斯牵着她，沿着来时的红土路慢慢往回走。司机看见她牵着一个兽人小女孩走回来时，他只是拉开车门，但戴维斯摆了摆手。\n从西区到新里斯本行政办公室大约四公里，路不短。戴维斯牵着女孩一路走，穿过逐渐密集的街区和人群。有人认出她来，在路边驻足行礼，她点头回应，脚步没有减慢。女孩的步伐小，走一段就要小跑几步跟上来，戴维斯察觉到，便放慢了步子，配合她的速度。她时不时蹲下来给女孩指路边的东西——一丛开着白花的灌木，一只蹲在墙头的猫——让这一路不至于太漫长。\n走进办公室所在的那条街道时，天色已经开始泛黄。新里斯本的傍晚比索尔兹伯里来得更早，西边的天空被低矮的丘陵挡住，整座城市提前进入了阴影。办公室里，女孩被安置在会客区的皮质沙发上。她坐上去之后腿够不到地面，悬在半空轻轻晃荡。戴维斯从抽屉里翻出几张空白稿纸和一支铅笔放在茶几上。\n“你可以用这些做点什么，有什么事叫我。”\n女孩点了点头。她拿起铅笔，安静地伏在茶几上，在纸上写写画画，铅笔在纸面上划过的沙沙声几乎被窗外的街道噪音完全盖住。戴维斯坐回办公桌后面继续批文件，她每隔一段时间就抬头看一眼——女孩非常安分，没有她观念中的小孩子特有的活泼。窗外的光线从昏黄变成橙红再变成深蓝，办公室里只剩下台灯的暖光。\n戴维斯放下笔，走到茶几旁边蹲下来，轻轻碰了碰女孩的肩膀。\n“小朋友，你的父母呢？”\n女孩抬起头，手里的铅笔停住了。\n“死了。”\n她说。\n戴维斯的眉头轻轻皱了一下。\n“那你还有别的亲人吗？”\n女孩摇了一下头。\n“没有了。他们都被官老爷们叫走了，再也没有回来过。”\n办公室里安静了几秒。\n戴维斯看着她，良久，她伸开双臂。\n“来吧。”\n女孩怔了一下。她把铅笔放在茶几上，从沙发上滑下来，走进了戴维斯的臂弯里。\n戴维斯把她抱起来，她的身体比看起来更轻，像一捆用旧衣裳裹着的干树枝。她的脸埋在戴维斯的肩膀旁边，兽耳的尖端蹭到了戴维斯的下巴。"
 zdm.1.a: "触感毛茸茸的。"
 zdm.2.t: "一个角落"
 zdm.2.d: "克雷尔是在索罗伦村行政长官这个位置上坐了十四年的老手。\n他接任时这个村子只有不到两百户，现在已经扩张到三百来户——不完全是自然增长，而是因为周围几个更小的村子被合并了进来。合村的时候，上面拨了一笔安置款，克雷尔把它记在账目里，分批次领出来，给每户发了折半的物资，剩下的数额划进了另一本账上。那本账放在他卧室衣柜夹层里，用油布包着，不记账簿，记的是“公务杂支”。\n他以为自己会在这个位置上坐到退休，然后带着这些年攒下来的钱回去。海边的房子已经托人看好了，每年的渔获和盐田收入足够他过完后半辈子。\n换主子这件事，他最初并没有太放在心上。民主党的人来了，把村口那块旧牌子拆掉，换了一块新的，上面写着“杜马人民共和国·索罗伦村委员会”。他看着那块新牌子，心里想的只有一件事：新来的这批人，给他的油水能不能跟以前一样多。他在旧体制里学会了衡量权力的尺度，每次换上头，他都能在最短的时间内摸清新主子的胃口和底线，调整好自己的姿态，让自己既不引人注目，又不至于被当作弃子丢掉，所以他在新政府派来的第一个联络员面前表现得很配合——交出旧账本、主动提供人口登记表、反复表示“愿意为新共和国效劳”。他对自己说：太阳照常升起，井水照样打，村子还是那个村子。谁在上面坐着，他就在下面给谁干活。反正干活的人是他，真正知道怎么管这个村子的人也是他。上面那些人只管收税和要报告，只要数字对得上，没有人会真的翻他的账本。\n可他今天在村口看到了两个不该出现的人。\n那是两个穿灰外套的陌生人，站在老槐树底下，手里夹着一个薄薄的文件夹。他们在村里走访了一个上午，最后径直走向了克雷尔的家。克雷尔当时正在自家后院清点新收的一批粮食储备，看见他们跨进院门时，心里咯噔一下，随即又恢复镇定。他挂上惯常的那副诚恳而殷勤的面孔，迎上去：\n“两位兄弟，有什么事？”\n其中一个灰外套的人合上文件夹，语气平淡如常：\n“克雷尔先生，我们查看了旧自治领时期的物资调拨记录，发现索罗伦村在几年内多次超额申领安置物资，但村里的人口增长记录和物资发放清单之间存在较大的差额。作为过渡期的行政负责人，这需要向我们做个说明。”\n克雷尔的笑容没有变化，但嘴唇的颜色暗暗褪了几分。\n“差额？怕是统计误差罢了，旧政府的账目一向混乱，数字有出入也在所难免。我都是按章办事的，你们可以查嘛。”\n“查过了。”\n灰外套的语气依然平稳，\n“旧政府的账目确实混乱，但村里的发放签收册保存得很好，每一批物资的去向都有人签名按手印。我们做了对比——发放到村民手里的数量，和申领批文上的数量，对不上。”\n他顿了顿，\n“差额的去向，需要你亲自跟我们说清楚。”\n克雷尔站在原地，感觉脑袋里那根弦断了。\n他忽然发作了。嗓门一下子拔高，整个人像是在用声音抵住那扇正在关上的门。\n“你们不是民主吗？为什么要抓一个无辜的人？你们不需要人来管理地方了吗？”"
 zdm.2.a: "旧的伤口不会凭空消失，而是会被翻出来，重新切开。"
 zdm.3.t: "寻找"
 zdm.3.d: "戴维斯沿着河岸走了大约二十分钟，才找到罗姆。\n河是新里斯本城外那条，不宽，水也不深，两岸长着齐膝的野草和几棵歪脖子树。午后的太阳正烈，水面泛着白晃晃的光，偶尔有一阵风从河面刮过去，把草叶压得贴着地面。戴维斯远远地就看见罗姆坐在河边的一块石头上了，穿着那件旧衬衫，袖子挽到肘部，手里握着一根自制的竹竿，身边放着一只铁皮桶，桶里空空荡荡的。\n戴维斯踩着草走过去，靴子踩断枯枝的声响在空旷的河岸上传得很远，但罗姆没有回头。她继续盯着河面，姿势不动，像是已经在那个位置上生了根。戴维斯走近到她身后大约两米的地方，停下来，发现罗姆脚边还放着一顶旧草帽，帽檐压得低低的，像是扔在那儿挡了半天的太阳。\n“罗姆。”\n戴维斯开口。\n罗姆没有反应。她握着竿，保持着同一副姿势。\n“钓鱼呢？”\n还是没有反应。罗姆甚至没有点头或摇头，完全把她当空气。戴维斯等了一会儿，往前又凑了半步，弯下腰，凑到她耳边，提高声音：\n“喂！”\n罗姆翻了个白眼。\n那个白眼翻得幅度不大，但精准地表达了她此刻的全部心情。她还是没有扭头，也没有说话，目光依然盯着河面那枚一动不动的浮漂，但那个白眼已经回答了所有问题。\n“……”\n戴维斯直起身，站在她旁边，觉得自己像个主动凑上去挨了个无声巴掌的人。她张了张嘴，想说什么，又觉得说出来也没什么用。河岸上的风又吹了一阵过来，吹得河面皱起来，罗姆的浮漂跟着轻轻晃了晃，她握着竿的手纹丝不动。戴维斯看了一会儿那个浮漂，又看了一会儿罗姆那张什么表情也没有的侧脸。最终她说：\n“行吧。那你钓。我回去了。”\n罗姆仍然没有回应。\n戴维斯转过身，沿着来时的河岸往回走。走了十几步，她忍不住侧头看了一眼——罗姆还坐在那块石头上，背影笔直，竹竿的一端伸向波光粼粼的水面，像是那条河上唯一一根没有动的树枝。戴维斯转过弯，走上通往新里斯本的土路，步子比来时快了一些。风从她身后吹过来，带着河水和草叶的气味。她走到半路时才想起来：罗姆桶里根本没鱼。也不知道在那儿钓了几个钟头了。\n她想，这人大概是在偷懒。"
 zdm.3.a: "算了，接着干活去吧。"
 zdm.4.t: "野火"
 zdm.4.d: "苏联的报纸印刷用纸粗糙，边角已经在运输途中磨得起毛，版面上的油墨味混着一股旧船舱的潮气。\n戴维斯在翻阅到第三版的时候停了下来。那是一个不起眼的小专栏，没有标题，只有一段短短的通讯，讲述“另一片大陆的一片红旗”——某个不知名的远方国家里，一群人以某种她不完全理解的方式在反抗他们自己的旧秩序。报道很短，没有细节，没有照片，像一封被剪掉了开头和结尾的信。但那段文字里有个她熟悉的词：平等。\n她把报纸举起来，转向旁边的沙发。\n罗姆正半躺在那里，脚踝交叠搁在扶手上，闭着眼睛，像在养神。\n“看看这个。”戴维斯把报纸递过去。\n罗姆伸手接过来，拿在手里举到面前，睁开眼睛瞥了一下。视线在那段文字上停留了大约两秒，然后她松开手指，报纸从她手里掉下去，落在沙发边的地面上，纸页翻了一下，摊开朝下，露出背面的广告栏。\n“嘿！”\n戴维斯的声音一下子提高了半度。她弯腰把报纸捡起来，用手掌拍掉上面的灰——虽然地板上并没有什么灰尘，但她觉得必须拍一下才合适。\n“你干嘛呢？”\n罗姆换了个姿势，把脸转向窗户那边。\n“看完了。”\n“你就看两秒？”\n“两秒够长了。”罗姆的声音隔着一层懒散，“他们在他们那边干他们的事。我们在我们这边干我们的事。需要看什么？”\n戴维斯把报纸重新抖开，折好，搁在茶几上。\n“我们得做点什么。”她说。\n罗姆的眉毛动了一下。她没有睁开眼睛，但嘴角弯了一个小小的弧度——不是笑，更像是一种预判性的确认。\n“我们得帮帮他们。”戴维斯说。\n罗姆这次睁开了眼睛。她侧过头，看着戴维斯，看了大约三秒钟，然后坐起来，把脚从扶手上放下来，双手撑着膝盖。\n“你觉得我们现在有能力吗？”\n戴维斯没有立刻回答。\n她看着茶几上那份摊开的报纸，看着那篇短短的小通讯，心里有些东西在转动，像齿轮缓慢啮合。那词还在那儿——平等——写得清晰，却没有告诉他们究竟发生了什么。她甚至不确定那词所指代的东西，与她自己脑子里想象的影像是否一致。但她仍然看着它们，像看一面从遥远的地方飘过来的旗帜，看不清图案，但能辨认出颜色。"
 zdm.4.a: "最愚蠢的是什么也不做。"
 zdm.5.t: "信"
 zdm.5.d: "戴维斯在办公桌前坐了很久，面前的纸上只写了五个字：“尊敬的同志”。她盯着那五个字，觉得不妥。\n她从未给远在另一片大陆的陌生人写过信。这不是公函，没有格式可循；这也不是朋友间的私信，对方甚至连她的名字都没听说过。她不能用“我们期待你的进一步表现”这种话——那听起来像殖民办公室在考评下属。她也不能写“加油，坚持住”——那太轻了，像在鼓励一个在运动会上摔倒了的孩子。\n她把那张纸揉掉，换了新的，写下：“你们的事迹让我们深受鼓舞。”读了一遍，又揉掉了。这像是套话。像是外交照会里用来填充篇幅的无意义段落。她写的东西必须看起来很真诚，哪怕是写给一个素未谋面的人，也必须让她自己先相信。\n她换了个角度。她试着想象对方——一个她完全不认识的人，被一篇没有署名的报纸通讯粗略描绘过，在一片她从未踏足的土地上做着某种变革。她不知道对方长什么样，不知道对方的声音、年龄、任何背景。她只知道那面红旗的存在，知道那个符号所代表的东西。\n她写了第三遍：“我们也在做着类似的事，虽然我们的规模很小。”她又停下来，读了三遍，觉得这句话太像在比较。像是在说“我们也很重要”，像是在要一张回执。\n这不是她想要的。\n她想要的只是让对方知道，有人在看着，有人在想，有人在另一片大陆的某个角落里，把那段小小的通讯折好放进了抽屉里。\n罗姆不知道什么时候走进了办公室。她靠在门框边，看了一会儿戴维斯摊在桌面上的那堆揉皱的纸团。\n“写了多久了？”\n“四十分钟。”戴维斯说。\n罗姆走过去，瞥了一眼那张纸上唯一没被划掉的半句话。\n“你直接写'我们和你们站在一起'。”她说。\n戴维斯皱了皱眉：\n“我们连他们在哪都不知道。”\n“所以呢？站在一起又不是说站在同一个经纬度上。”罗姆转过身，走了出去。她的脚步声在走廊里渐行渐远。\n戴维斯在桌前又坐了一会儿，然后拿起笔，在一张新纸上写下了那句话——“我们和你们站在一起”。她没有再揉掉它。写完后，她没有署名，只在末尾加了一行小字：“来自另一片大陆的一个小共和国。”她把纸折好，放进信封，在信封上注明“待发”。然后她把它放在桌角，打算在这封信与货船一同前往那片陌生的大陆之前，再读最后一遍。但她又没有立刻打开看。她只是让它安静地躺在那儿，觉得这样也挺好。"
 zdm.5.a: "希望船队能安全抵达。"
 zdm.6.t: "船队遭遇暴风"
 zdm.6.d: "我们的船队遇上了暴风雨，由于缺乏足够的设备来预防，整支队伍就这样全军覆没了！现在党内的所有人都开始指责哈里·戴维斯的冒险行为，因为这是我们唯一一支有经验的船队。"
 zdm.6.a: "这是我的错......"
 zdm.7.t: "辩解"
 zdm.7.d: "戴维斯正在批阅文件的时候，办公室的门被猛地推开了。罗姆大步走进来，靴子踩在地板上发出沉闷的声响，手里攥着几张皱巴巴的信纸，指节发白。她走到办公桌前，把信纸“啪”地甩在桌面，纸页滑出去，散开成几片，上面是手写的字迹，有些字被用力划掉了，旁边写满注脚。\n“你看了？”罗姆问。她的声音比平时高，带着一种压不住的火气，像是憋了一路没撒出来的那种。\n戴维斯放下笔，靠在椅背里。\n“看了一些。”\n“那你应该明白，那些话做不得真！”罗姆把双手撑在桌面上，身体前倾，像是要把自己整个人压进桌板里去，“独断专权？我独断了什么？他们说什么？说我在征兵的时候绕过地方委员会？那是因为地方委员会根本处理不了那种事，一个村子一天之内能征齐的兵，他们拖了整整一个星期！我还有多少时间等他们？”她停了一下，像要把嗓子里的什么东西咽回去，“反正那些东西，你一个字也不要信。”\n戴维斯没有说话。她看着罗姆，看了几秒钟，然后开口。“说完了？”\n罗姆愣了一下。“……说完了。”\n戴维斯从椅子里坐直，伸手把桌面上那几张信纸拢到一起，叠整齐。她站起来，端着那叠信纸，绕过办公桌，走到壁炉旁边。炉子里还有昨夜没烧尽的炭火，红彤彤地埋在灰烬底下，偶尔窜出一小簇火苗。她把那叠信纸扔进了火炉里。纸张的边缘先卷曲起来，然后变黑，火焰从纸角蔓延开来，将那些手写的字迹一张一张吞进去。火光映在戴维斯的脸上，她的表情很平静，没有什么变化，也没有说话。她站在那里看着火苗把那几页纸卷成灰烬，直到最后一片带着字迹的纸角也变成黑色，塌进炭火里。\n罗姆还站在办公桌前，眼睛盯着壁炉，像是没有完全反应过来。她张了张嘴，没说出话。戴维斯转过身，拍了拍手上沾到的灰，走回办公桌后面重新坐下，端起茶杯喝了一口，像是刚才只是在处理一件极小的杂务。罗姆还在看她，眼神里那股原先的愤怒已经被另一种东西替代——一种她不太确定该怎么命名的情绪。罗姆站在那里，过了一会儿，慢慢直起身，把撑在桌面的手收了回来。\n“……你不怕他们说得对？”\n“你说他们说得不对。”"
 zdm.7.a: "“你就信了？”"








































