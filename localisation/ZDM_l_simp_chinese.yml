 zdm.1.t: "路人"
 zdm.1.d: "戴维斯是在新里斯本西区边缘的一条红土路上遇见她的。\n那天下午她刚参加完一场工人集会，没有坐车。她的司机早就习惯了——每次集会结束后，戴维斯都会独自走一段路。她说走在路上才能慢慢把声音过滤掉，听到普通人的声音。司机把车停在集会场地三公里外等她。戴维斯沿着一条向西延伸的窄巷走，地面是压实的红土，两旁的房屋从砖墙逐渐过渡到铁皮棚屋。她走得不快，时不时停下来看路边的菜摊或蹲在门口剥豆子的人。路过一个水井时她蹲下来洗了洗手，和井边打水的妇人聊了几句收成——她的绍纳语说得不流利，但对方能听懂。正是在这段路上，她看见路边蹲着一个小小的身影。\n一个兽人女孩，大约七八岁，穿着一件明显大了许多的旧衬衫，袖口卷了好几圈，露出细瘦的手腕。她蹲在墙根底下，手里攥着一根树枝，在地上划拉着什么。\n戴维斯停下脚步，在她旁边蹲下来，和她平视。\n“小朋友，你怎么一个人在这里？”\n小女孩抬起头。眼睛很大，眼瞳是浅褐色的，兽耳从乱蓬蓬的头发里支棱出来，左耳的尖端缺了一个小角。\n“你叫什么名字？”\n“他们没有给我起名字。”\n她说得很轻。\n戴维斯没有追问，站起来，朝女孩伸出手。\n“跟我来，我带你去个暖和的地方。”\n女孩看了那只手一会儿，慢慢站起来，把树枝放下。戴维斯牵着她，沿着来时的红土路慢慢往回走。司机看见她牵着一个兽人小女孩走回来时，他只是拉开车门，但戴维斯摆了摆手。\n从西区到新里斯本行政办公室大约四公里，路不短。戴维斯牵着女孩一路走，穿过逐渐密集的街区和人群。有人认出她来，在路边驻足行礼，她点头回应，脚步没有减慢。女孩的步伐小，走一段就要小跑几步跟上来，戴维斯察觉到，便放慢了步子，配合她的速度。她时不时蹲下来给女孩指路边的东西——一丛开着白花的灌木，一只蹲在墙头的猫——让这一路不至于太漫长。\n走进办公室所在的那条街道时，天色已经开始泛黄。新里斯本的傍晚比索尔兹伯里来得更早，西边的天空被低矮的丘陵挡住，整座城市提前进入了阴影。办公室里，女孩被安置在会客区的皮质沙发上。她坐上去之后腿够不到地面，悬在半空轻轻晃荡。戴维斯从抽屉里翻出几张空白稿纸和一支铅笔放在茶几上。\n“你可以用这些做点什么，有什么事叫我。”\n女孩点了点头。她拿起铅笔，安静地伏在茶几上，在纸上写写画画，铅笔在纸面上划过的沙沙声几乎被窗外的街道噪音完全盖住。戴维斯坐回办公桌后面继续批文件，她每隔一段时间就抬头看一眼——女孩非常安分，没有她观念中的小孩子特有的活泼。窗外的光线从昏黄变成橙红再变成深蓝，办公室里只剩下台灯的暖光。\n戴维斯放下笔，走到茶几旁边蹲下来，轻轻碰了碰女孩的肩膀。\n“小朋友，你的父母呢？”\n女孩抬起头，手里的铅笔停住了。\n“死了。”\n她说。\n戴维斯的眉头轻轻皱了一下。\n“那你还有别的亲人吗？”\n女孩摇了一下头。\n“没有了。他们都被官老爷们叫走了，再也没有回来过。”\n办公室里安静了几秒。\n戴维斯看着她，良久，她伸开双臂。\n“来吧。”\n女孩怔了一下。她把铅笔放在茶几上，从沙发上滑下来，走进了戴维斯的臂弯里。\n戴维斯把她抱起来，她的身体比看起来更轻，像一捆用旧衣裳裹着的干树枝。她的脸埋在戴维斯的肩膀旁边，兽耳的尖端蹭到了戴维斯的下巴，触感毛茸茸的。"
 zdm.1.a: "接7号。"
 zdm.2.t: "一个角落"
 zdm.2.d: "克雷尔是在索罗伦村行政长官这个位置上坐了十四年的老手。\n他接任时这个村子只有不到两百户，现在已经扩张到三百来户——不完全是自然增长，而是因为周围几个更小的村子被合并了进来。合村的时候，上面拨了一笔安置款，克雷尔把它记在账目里，分批次领出来，给每户发了折半的物资，剩下的数额划进了另一本账上。那本账放在他卧室衣柜夹层里，用油布包着，不记账簿，记的是“公务杂支”。\n他以为自己会在这个位置上坐到退休，然后带着这些年攒下来的钱回去。海边的房子已经托人看好了，每年的渔获和盐田收入足够他过完后半辈子。\n换主子这件事，他最初并没有太放在心上。民主党的人来了，把村口那块旧牌子拆掉，换了一块新的，上面写着“杜马人民共和国·索罗伦村委员会”。他看着那块新牌子，心里想的只有一件事：新来的这批人，给他的油水能不能跟以前一样多。他在旧体制里学会了衡量权力的尺度，每次换上头，他都能在最短的时间内摸清新主子的胃口和底线，调整好自己的姿态，让自己既不引人注目，又不至于被当作弃子丢掉，所以他在新政府派来的第一个联络员面前表现得很配合——交出旧账本、主动提供人口登记表、反复表示“愿意为新共和国效劳”。他对自己说：太阳照常升起，井水照样打，村子还是那个村子。谁在上面坐着，他就在下面给谁干活。反正干活的人是他，真正知道怎么管这个村子的人也是他。上面那些人只管收税和要报告，只要数字对得上，没有人会真的翻他的账本。\n可他今天在村口看到了两个不该出现的人。\n那是两个穿灰外套的陌生人，站在老槐树底下，手里夹着一个薄薄的文件夹。他们在村里走访了一个上午，最后径直走向了克雷尔的家。克雷尔当时正在自家后院清点新收的一批粮食储备，看见他们跨进院门时，心里咯噔一下，随即又恢复镇定。他挂上惯常的那副诚恳而殷勤的面孔，迎上去：\n“两位兄弟，有什么事？”\n其中一个灰外套的人合上文件夹，语气平淡如常：\n“克雷尔先生，我们查看了旧自治领时期的物资调拨记录，发现索罗伦村在几年内多次超额申领安置物资，但村里的人口增长记录和物资发放清单之间存在较大的差额。作为过渡期的行政负责人，这需要向我们做个说明。”\n克雷尔的笑容没有变化，但嘴唇的颜色暗暗褪了几分。\n“差额？怕是统计误差罢了，旧政府的账目一向混乱，数字有出入也在所难免。我都是按章办事的，你们可以查嘛。”\n“查过了。”\n灰外套的语气依然平稳，\n“旧政府的账目确实混乱，但村里的发放签收册保存得很好，每一批物资的去向都有人签名按手印。我们做了对比——发放到村民手里的数量，和申领批文上的数量，对不上。”\n他顿了顿，\n“差额的去向，需要你亲自跟我们说清楚。”\n克雷尔站在原地，感觉脑袋里那根弦断了。\n他忽然发作了。嗓门一下子拔高，整个人像是在用声音抵住那扇正在关上的门。\n“你们不是民主吗？为什么要抓一个无辜的人？你们不需要人来管理地方了吗？”"
 zdm.2.a: "旧的伤口不会凭空消失，而是会被翻出来，重新切开。"
