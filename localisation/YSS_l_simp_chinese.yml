#人物介绍
 YSS_byner_name: "阿勒姆沃·贝耶尼"
 YSS_byner_DESC_1: "阿勒姆沃·贝耶尼\n@YSS§Y索维耶特联盟§!的§O国家主席§!"
 YSS_byner_warrior_desc: "§L她站在最高处，却始终是一张朴素而熟悉的面孔。\n\n她的手指因为长年握笔而微微变形，她的外套上永远沾着一小块洗不掉的墨水渍。贝耶尼并不介意这些。她介意的是，如果她今天不签完这些文件，明天就会有更多的人在饥饿和混乱中挣扎。人们总是记住总书记在政治局会议上拍桌子的样子，却很少留意到，在那之后，是谁留下来把被打翻的墨水瓶扶正，把散落的文件捡起，把那些被怒火烧得发烫的议题重新冷却、整理、归档。贝耶尼就是那个收拾残局的人，一个从未在欢呼声中登场的人物。她的信念更像是一种习惯。她读过《共产党宣言》，也读过《资本论》，但她更清楚的是，在一个被撕扯得千疮百孔的国家里，理想主义的火炬需要有人去点燃，也需要有人去守护。时代把她们推到了这个位置，历史借走了她们的双手。但贝耶尼不在乎这些。她只在乎，当她合上文件夹、在凌晨独自走回家的时候，亚的斯亚贝巴的街头是否比昨天更安静了一些。\n\n教师是人类的灵魂工程师。§!"
 YSS_byner_Diplomacy_desc: "阿勒姆沃·贝耶尼\n@YSS§Y索维耶特联盟§!的§O国家名誉主席§!"
 mlym_DESC: "列宁的礼物赠给世界人民，而门格斯图·海尔·马里亚姆的礼物就是联盟本身。\n\n她并非生来就是铁石心肠。面对呈上的一摞摞处决名单，面对陷入瘫痪的基层运转，面对空无一物的国库与那些宁可背叛也不愿直面现实的“山头”，她何尝没有过短暂的犹疑？然而，亚的斯亚贝巴的狂风不容她软弱，帝国主义的铁幕不容她退缩。在历史的巨轮前，她只能将那份庞大的、笨重的、充满着沉疴痼疾的联盟，以一种近乎暴烈的姿态强行扛在肩上。她将灵魂献祭给了这束红色的微火，只为给世界留下一个绝不屈服的乌托邦。至于这份礼物最终是成为凡人的福祉，还是成为历史的绝唱，她已无暇顾及。历史借走了她的手，而她，只用沉默的脊背，扛下了所有的赞颂与诅咒。\n\n也许历史的风向，早已对你不再有意义了吧。"
