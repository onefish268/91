 YSS_1: "一团乱麻的宗教信仰"
 YSS_1_desc: "社会主义？逊尼派？阿克苏姆教义？基督教？没人说的上来联盟到底信仰什么，古老且分裂的国家兴许自己都不知道自己应该用什么来凝聚起人民。"
