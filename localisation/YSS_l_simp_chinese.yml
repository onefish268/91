#城市介绍
 Adorable_heart_city_story_title_ydsybb: "鲜花之都-亚的斯亚贝巴"
 Adorable_heart_city_story_title_hegs: "红海之滨-哈尔格萨"
 Adorable_heart_city_story_title_ktm: "大象之鼻-喀土穆"
 Adorable_heart_city_story_title_mjds: "金色之城-摩加迪沙"
 Adorable_heart_city_story_desc_ydsybb: "亚的斯亚贝巴在阿姆哈拉语中意为“新鲜的花朵”。这座建于1886年的城市，在半个世纪的时光中，已从孟尼利克二世皇后泰图的一片营帐，生长为非洲之角最庞大的都会。然而1936年的它，所绽放的并非温室中的娇蕊，而是高原之上、战火边缘的一丛坚韧野花——根系深扎于阿克苏姆千年帝国的古老土壤，花瓣却染上了“索维耶特”革命的赤土红。它是这个庞大联盟的神经中枢，是七块加盟土地共同仰望的“花蕊”，也是列强领事们用望远镜终日审视的棋盘。\n亚的斯亚贝巴的城市肌理，就是整个阿克苏姆-索维耶特联盟的缩影。城市被一道无形的界限分割，却又在每日的喧嚣中彼此交融。北城——革命之城。以人民议会大厦为中心，赤土红旗在花岗岩建筑上飘扬。这里是1914年政变者们的大本营，留俄归来的军官们穿着深褐色制服，在走廊间用阿姆哈拉语夹杂着德语战术术语争论。城北的军事学院里，年轻的索维耶特军官正在操练，他们的步枪是克虏伯工厂的产物，但他们的军歌旋律却改编自阿克苏姆时代的古赞美诗。南城——帝国之影。阿克苏姆圣城来的宗主教在此设有驻跸处，旧帝国的宫廷官僚依然用吉兹语书写文书，贵族们住在石砌的宅邸中，院子里种着从也门引进的咖啡树。他们称这座城市为芬芬——这是它的古称——仿佛亚的斯亚贝巴这个新名字只是一层临时覆盖的薄纱。交界处——梅斯克尔广场。每年九月，这里会点燃巨大的篝火庆祝梅斯克尔节——传说公元4世纪圣海伦娜在此发现了真十字架碎片。但1936年的广场上，篝火旁多了一排刚从德国进口的扩音器，播放着索维耶特人民委员会的通告。传统与现代在此相遇，有时相撞，有时共舞。\n§C亚的斯亚贝巴是非洲之角最嘈杂也最和谐的巴别塔。§!"
 Adorable_heart_city_story_desc_hegs: "哈尔格萨在索马里语中意为“那片隐藏的水潭”。这座城市注定与“隐藏”二字结下不解之缘——它藏在非洲之角干旱高原的褶皱深处，距离亚丁湾的碧蓝海面尚有百余公里的山路，却从未有一天停止与红海的呼吸同频。对于阿克苏姆-索维耶特联盟而言，哈尔格萨是东部的第二心脏。如果说亚的斯亚贝巴是联盟的政治大脑，那么哈尔格萨就是它的骆驼脊背——驮着沙漠贸易、边陲战火和千年来帝国与部族之间那根从未松弛的缰绳。这座城市位于欧加登高原与索马里北部干草原的交界处，是沙漠商队从红海沿岸向内陆进发的最后一个大型补给点，哈尔格萨的味道是骆驼皮和乳香的混合，它的声音是清真寺宣礼、索马里语长篇诗歌吟唱、以及远处偶尔传来的军用卡车引擎轰鸣。\n哈尔格萨的宗教信仰，是所有城市矛盾中最柔软、也最坚韧的那一层。大清真寺——城中心建于1880年的石砌清真寺，是索马里伊萨氏族的信仰中心。宣礼塔不高，但足够让全城听到每日五次的召唤。清真寺的管理者谢赫·阿卜杜拉是伊萨氏族中最受尊重的长者，他同时兼任贵族议事会的顾问——伊斯兰教法和索马里习惯法在他那里融合。阿克苏姆正教会的驻点——城南一幢不起眼的小教堂，由政府拨款修建，供驻军中的提格雷族士兵和少数阿克苏姆裔官员使用。教堂的外观刻意低调，仿照当地民居，避免引发宗教敏感。但门楣上刻着一个微小的阿克苏姆十字架——十字架的四角同样宽大，这是在阿克苏姆帝国的古老传统中代表“福音传遍四方”。\n§C水井是所有部落共用的，敌人是所有部落共有的。§!"
 Adorable_heart_city_story_desc_ktm: "喀土穆在阿拉伯语中意为“象鼻”——这座城市坐落于白尼罗河与青尼罗河的交汇处，从高空俯瞰，两河汇流后的河段宛如一头巨象的鼻子伸向远方，而城池就坐落在象鼻的根部。这个命名是如此的贴切，以至于每一位到访者都会感叹：没有比这更准确的名字了。喀土穆是最西端的前哨、最遥远的边疆、也是最令人不安的“悬疑之城”。它是联盟七大加盟地区中苏丹大区的首府，却也是一座被埃及商船、苏丹象牙贩子和阿拉伯骆驼商队共同塑造的混血都市。联盟的赤土红旗虽然飘扬在城市上空，但这座城市的大多数居民私下里会用埃及磅而不是索维耶特银元算账，用尼罗河水位而不是阿克苏姆历法来安排农时。喀土穆是联盟最年轻的领土。与阿克苏姆帝国千年传承的埃塞俄比亚高原不同，苏丹东部行省在1882年才被孟尼利克二世趁马赫迪起义之机吞并，此后一直保持着高度的自治——当地的阿拉伯部落首领和贝贾族酋长们，像是一群与中央合伙经营的独立商人，他们对亚的斯亚贝巴的忠诚仅限于“不交税、不出兵，但承认你们的旗帜”。\n喀土穆的市井生活完全由两条尼罗河塑造。每年的汛期（7月至10月），青尼罗河的暴涨会将大量泥沙和浮木冲刷下来，白尼罗河则带来更为清澈的南苏丹水源。两股不同颜色的河水在喀土穆汇流处形成一道长达数公里的水线——青尼罗河的水是浑浊的赭色，白尼罗河的水是浅淡的灰绿，它们在同一个河道中并行流淌了近一公里才完全交融。这个自然奇观被当地阿拉伯人称为“真主的两条指印”。河畔市场——苏克·尼罗是非洲之角最奇特的集市之一，因为它既是陆上集市，又是水上集市。河岸边排列着上百艘各式船只——从阿拉伯三角帆帆船（用于长途货运）到南苏丹式独木舟（用于短途渔猎），商贩们在船头摆摊，顾客站在岸边石阶上与他们讨价还价。交易的商品种类繁多，从上游南苏丹来的象牙、橡胶、野生蜂蜜，到下游埃及来的纺织品、煤油灯、白糖，再到从吉布提港经联盟铁路转运来的欧洲火柴和印度茶叶。\n§C鼻子是动物最敏感的器官，而喀土穆是整个联盟最敏锐的“嗅觉预警器”。§!"
 Adorable_heart_city_story_desc_mjds: "摩加迪沙这个名称的源头已不可考——波斯商人称之为“马格迪沙乌”，阿拉伯地理学家写作“马克迪沙乌”，葡萄牙人则按其海岸轮廓音译为“摩加迪休”——但无论名字如何变换，这座城市在印度洋西岸的灯影从未熄灭超过一千年。它是联盟七大加盟地区中索马里大区的首府，但这座城市的真实统治者既不是亚的斯亚贝巴，也不是当地索马里氏族的苏丹，而是阿拉伯商人、印度裔钱庄主、以及上了年纪的葡萄牙-阿曼混血老船长的秘密联盟——他们掌控着城中的船舶、仓库、货币兑换率和走私渠道，而联盟的赤土红旗，只是在他们的屋顶上借风飘扬。摩加迪沙是联盟七个加盟地区中唯二拥有深水港的东部海岸城市。这座城市的天然港口被一道古老的珊瑚礁庇护，形成了长约两公里的避风锚地，每年有超过三百艘商船在此停泊——从阿拉伯帆船到英国蒸汽轮，再到印度洋季风季节的独桅帆船队。\n联盟中央对摩加迪沙的态度，可以用一句话概括：又爱又怕。爱它，因为它是联盟唯一的硬通货换汇口。内陆的咖啡、兽皮、象牙等物产通过哈勒尔-贝莱德文公路运到摩加迪沙，以银元计价卖给外国商船，换回联盟急需的步枪子弹、无线电零件和瑞士钟表。1935年，摩加迪沙海关上缴的关税占联盟财政收入总额的22%。怕它，因为这座城市太容易“飘走”。摩加迪沙的索马里商业精英阶层与阿拉伯半岛、印度的商业网络紧密相连，他们更关心的是卢比的汇率、季风的动向和家族钱庄的信用评级，而不是阿克苏姆帝国的千年法统。如果亚的斯亚贝巴向他们征税过重，他们随时可以“用脚投票”——把货柜转到意大利控制的基斯马尤港，或是直接投靠英国的桑给巴尔贸易体系。中央军可以驻守兵营，但无法控制每一个商人的账本。\n§C它只是存在着，在自己的时间内，按照季风与潮汐的古老节律运转。§!"
