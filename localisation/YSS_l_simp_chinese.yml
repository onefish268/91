 YSS_GATHERING_STORM_DESC: "阿比西尼亚，古老的非洲国度。\n\n它屹立在非洲高谷之上，在列强和反动势力的制衡下缓步前行。然而，再多的困难，也挡不住这伟大土地的人民追求自由的理想，在曲折中，人民大步向前，去为了泛亚非利加的自由之梦而战斗。"
 YSS_new_tips: "@YSS§O索维耶特社会主义共和国联盟§!的全新内容"
