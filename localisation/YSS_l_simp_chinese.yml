 YSS_loca_his_t_01: "千年帝国"
 YSS_loca_his_t_02: "殖民幸存者"
 YSS_loca_his_t_03: "红旗？"
 YSS_Country_History_Page_01: "即使再伟大的帝国，也有崩溃的时刻。时间像一把锋利的刀，渐渐把那强盛的阿比西尼亚黄金之都和欧罗巴大陆的机械运转声割裂，而年轻的留学军官则成为了这古与今之间的唯一桥梁。\n\n在某个精心策划后的夜晚，军官们冲进了皇宫，并把皇帝“请”下台，并宣称所谓“阿克苏姆-索维耶特人民联邦”的建立——当然，名义上的。作为交换：贵族们承认“索维耶特联邦”为“阿克苏姆帝国的唯一合法代理人”，并交出对外宣战权、外交权和关税征收权。"
 YSS_Country_History_Page_02: "总书记马里亚姆确实无法撼动，也无力撼动那错综复杂的封建地主根基，因此，她创造性的提出了“文化教育大革命”理论，在教育上传承马克思主义，意图从思想上改变下一代，于是阿比西尼亚就出现了这么一副离奇的情形：披金带银的贵族子弟带着象征革命的红色袖章，在私人护卫的护送下来到被安排好的顶尖学府学习马克思和恩格斯的书籍——虽然这一幕看上去非常荒诞，但它确实在发生着。\n\n同时，三年计划也在缓慢的推行者，在政府能控制的区域内，工业化体系被建立起来，但这不意味着全国都进入了工业化——军阀和王公控制的地区，工业化进程异常缓慢，毕竟，与其效忠一个与之前模样没什么区别的中央，不如自己捞钱来得舒服。"
 YSS_Country_History_Page_03: "作为草草革命，草草建立的苏维埃共和国，军阀的力量是一群毛头军官所暂时无法击倒的。王公的力量就像鱿鱼的触手，带着吸盘紧紧粘在苏维埃的一切——教育，经济，军事，法治。三年计划根本没有在全国落实，而近年来的军事整编也暴露出来了巨大的问题，军头为了完成指标，虚报了至少三倍的兵力，而作为最吃钱的空天军，甚至根本组不齐一支完整的编队，陆军更是有一大半发不上武器。寡头的影响越来越制约着苏维埃的发展，而软弱的中央兴许只有放手一搏。\n\n但这也说不准呢…"
 YSS_Local_History_Page_01: "公元7世纪，阿拉伯帝国崛起，阿克苏姆失去红海贸易垄断，随后逐渐衰亡，退化为埃塞俄比亚北部的一个小王国。\n\n公元710年，阿克苏姆末代皇帝在临终前，将帝国一分为三，但留下一条铁律：“帝国永不灭亡，只有暂时蛰伏。任何一脉王室后裔，只要有朝一日能同时集齐三顶王冠，便可重启帝国。此后的一千年里，这三脉分分合合，互相通婚也互相厮杀，但始终没有一个外部势力能彻底征服这三块核心区——因为无论谁打进来，都会发现自己在面对三个互相配合的王室分支。"
 YSS_Local_History_Page_02: "当欧洲列强开始瓜分非洲时，她们惊讶地发现：这个“传说中灭亡的帝国”不仅有完整的外交体系，而且有欧洲地图上根本不存在的边界主张。1832年：圣杯王国海军试图在泽拉建立加煤站，被当地阿克苏姆“东脉亲王”以“阿克苏姆帝国海军领水”为由驱逐。圣杯外交官查阅梵蒂冈档案后，发现公元6世纪拜占庭文献中确实记载了阿克苏姆对红海沿岸的宗主权——法理上无法驳斥。\n\n列强在谈判桌上争吵非洲之角的划分时，阿克苏姆“南脉”的统治者孟尼利克以合法继承人的身份向各国递交了一份长达80页的《阿克苏姆帝国边界备忘录》最后列强们虽然不情愿，但谁也无法从法理上否定阿克苏姆的存在（因为它在欧洲外交文件里一直以“传说中的基督教帝国”身份被提及）。加上各国互相牵制——圣杯不希望幻想乡独占吉布提，幻想乡不希望圣杯独占尼罗河。双方最终在1888年《伦敦议定书》中达成妥协。"
 YSS_Local_History_Page_03: "892年，帝国派遣50名贵族子弟前往英国桑赫斯特皇家军事学院和法国圣西尔军校留学，但留洋归来的军官团发现，阿克苏姆帝国虽然名义上存续千年，但内部已腐朽不堪。于是，她们在1914年12月军官团用德语和法语密谋（避免被监听），在亚的斯亚贝巴发动快速政变，皇帝被软禁，但没有被处决——她被送往阿克苏姆圣城“担任祭司”，名义上仍是“帝国精神领袖”。之后军官团宣布成立 “索维耶特人民联邦”，但国号中保留了“阿克苏姆”四个字：全称为 “阿克苏姆-索维耶特人民联邦”。在1914年政变后，军官团宣布：“皇帝已隐退，但帝国仍在。所有封臣（贵族）的领地和爵位，由‘人民联邦’重新确认。”作为交换：贵族们承认“索维耶特联邦”为“阿克苏姆帝国的唯一合法代理人”，并交出对外宣战权、外交权和关税征收权。\n\n而现在，历史让这个国家站在了交叉路口，谁也不知道这个国家未来的命运是什么。"
