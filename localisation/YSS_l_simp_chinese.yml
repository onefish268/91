#人物介绍
 YSS_byner_name: "高海千歌"
 YSS_byner_DESC_1: "§Y高海千歌§!\n@YSS§Y索维耶特联盟§!的§O国家主席§!"
 YSS_byner_warrior_desc: "§L她站在最高处，却始终是一张朴素而熟悉的面孔。\n\n她的手指因为长年握笔而微微变形，她的外套上永远沾着一小块洗不掉的墨水渍。高海千歌并不介意这些。她介意的是，如果她今天不签完这些文件，明天就会有更多的人在饥饿和混乱中挣扎。人们总是记住总书记在政治局会议上拍桌子的样子，却很少留意到，在那之后，是谁留下来把被打翻的墨水瓶扶正，把散落的文件捡起，把那些被怒火烧得发烫的议题重新冷却、整理、归档。高海千歌就是那个收拾残局的人，一个从未在欢呼声中登场的人物。她的信念更像是一种习惯。她读过《共产党宣言》，也读过《资本论》，但她更清楚的是，在一个被撕扯得千疮百孔的国家里，理想主义的火炬需要有人去点燃，也需要有人去守护。时代把她们推到了这个位置，历史借走了她们的双手。但高海千歌不在乎这些。她只在乎，当她合上文件夹、在凌晨独自走回家的时候，亚的斯亚贝巴的街头是否比昨天更宁和了一些。\n\n教师是人类的灵魂工程师。§!"
 YSS_byner_Diplomacy_desc: "§Y高海千歌§!\n@YSS§Y索维耶特联盟§!的§O国家名誉主席§!"
 mlym_DESC: "列宁把礼物赠给世界人民，门柯思图的礼物是联盟本身。\n\n她不是天生就下得了狠手的人。处决名单一摞摞送上来，基层瘫着，国库空着，几个“山头”宁可背叛也不肯面对现实。她也犹疑过。可亚的斯亚贝巴的风不容她软弱，封锁的铁幕不容她退缩。她只能把这样一个庞大、笨重、满是沉疴的联盟硬扛在肩上。她把自己交给了这束红色的微火，只为给世界留下一个不肯低头的乌托邦。这份礼物最后是福祉还是绝唱，她顾不上。历史借走了她的手，她只用沉默的脊背扛下赞颂，也扛下诅咒。\n\n也许历史的风向，早已对你不再有意义了吧。"
 YSS_mlym_NEW_DESC: "门柯思图最近总是睡得很浅。\n\n夜里醒来的时候，她会坐在床沿上，让护士把灯拨到最暗。她的身体这几年一直在往下走——医生说是常年积劳，心脏和血压都不大好，可没有人敢把话说尽。她自己心里有数：还能支撑多久，谁也说不准。\n\n她的视线有些模糊，眼前那些象征着权力的红色卷宗，模糊地叠成了1910年的讲稿。那时她意气风发。她想起了那些已经躺进坟墓的老战友，想起了曾经在她面前谄媚过的反对派，想起了王宫里那个疲惫的老国王。"
