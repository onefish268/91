#城市介绍
 Adorable_heart_city_story_title_ydsybb: "鲜花之都-亚的斯亚贝巴"
 Adorable_heart_city_story_title_hegs: "红海之滨-哈尔格萨"
 Adorable_heart_city_story_title_ktm: "大象之鼻-喀土穆"
 Adorable_heart_city_story_title_mjds: "金色之城-摩加迪沙"
 Adorable_heart_city_story_desc_ydsybb: "亚的斯亚贝巴在阿姆哈拉语中意为“新鲜的花朵”。这座建于1886年的城市，半个世纪前还是孟尼利克二世皇后泰图的一片营帐，如今已是非洲之角最大的都会。它开的花不在温室里：根扎在阿克苏姆千年的土里，花瓣染着“索维耶特”的赤土红。它是这个联盟的神经中枢，是人民仰望的“花蕊”，列强的领事们也终日在望远镜里盯着它。\n亚的斯亚贝巴的城市肌理，就是整个阿克苏姆-索维耶特联盟的缩影：一道看不见的界把城分开，每天又在喧闹里混到一起。\n北城是革命之城。人民议会大厦居中，赤土红旗在花岗岩上飘着。这里是1910年政变者的大本营，留学回来的军官穿深褐色制服，在走廊里用阿姆哈拉语夹着外语战术术语争论。城北军事学院里，年轻的索维耶特军官在操练，枪是近代工厂造的，军歌的调子却还是阿克苏姆时代的古赞美诗。\n南城是帝国之影。阿克苏姆圣城来的宗主教在此设驻跸处，旧帝国的宫廷官僚仍用吉兹语写文书，贵族住在石砌宅邸里，院里种着从也门引进的咖啡树。她们管这座城市叫芬芬，那是它的古称，仿佛“亚的斯亚贝巴”只是临时盖上去的一层薄纱。\n交界处是梅斯克尔广场。每年九月这里点起大篝火过梅斯克尔节，传说公元四世纪圣海伦娜在此发现了真十字架碎片。今年篝火旁多了一排刚从德国进口的扩音器，播着索维耶特人民委员会的通告。传统与现代在这里相遇，有时相撞，有时共舞。\n§C亚的斯亚贝巴是非洲之角最嘈杂也最和谐的巴别塔。§!"
 Adorable_heart_city_story_desc_hegs: "哈尔格萨在索马里语中意为“那片隐藏的水潭”。它藏在非洲之角干旱高原的褶皱深处，离亚丁湾的碧蓝海面还有一百多公里山路，却从没停止过与红海同频呼吸。对阿克苏姆-索维耶特联盟来说，哈尔格萨是东部的第二心脏。亚的斯亚贝巴是政治大脑，哈尔格萨就是骆驼脊背，驮着沙漠贸易、边陲战火，以及千年来帝国与部族之间那根从没松过的缰绳。城在欧加登高原与索马里北部干草原的交界处，是沙漠商队从红海沿岸往内陆走的最后一个大补给点。哈尔格萨的味道是骆驼皮和乳香的混合；它的声音是清真寺宣礼、索马里语长篇诗歌吟唱，还有远处偶尔传来的军用卡车引擎。\n城里的宗教，是所有矛盾中最柔软也最韧的一层。大清真寺在城中心，1880年砌的石墙，是索马里伊萨氏族的信仰中心。宣礼塔不高，足够让全城听到每天五次的召唤。管事的是谢赫·阿卜杜拉，伊萨氏族里最受敬重的长者，她同时是贵族议事会的顾问，伊斯兰教法和索马里习惯法在她那儿合到一处。城南还有阿克苏姆正教会的驻点，一幢不起眼的小教堂，由政府拨款修建，供驻军里的提格雷族士兵和少数阿克苏姆裔官员使用。外观刻意仿照当地民居，怕惹宗教上的麻烦；门楣上却刻着一个很小的阿克苏姆十字架，四角同样宽大，按帝国的老规矩，那是“福音传遍四方”的意思。\n§C水井是所有部落共用的，敌人是所有部落共有的。§!"
 Adorable_heart_city_story_desc_ktm: "喀土穆在阿拉伯语中意为“象鼻”。城市坐在白尼罗河与青尼罗河的交汇处，从空中看，汇流后的河段像一条象鼻伸向远方，城就落在鼻根上。到过的人都说，没有比这更准确的名字。\n喀土穆是联盟最西端的前哨，也是最让人不安的一座边境城。它由埃及商船、象牙贩子和阿拉伯骆驼商队一起喂大。旗子是联盟的，账却用埃及磅算，不用索维耶特银元；农时看尼罗河水位，不看阿克苏姆历法。\n它也是联盟最年轻的领土。埃塞俄比亚高原那一带是阿克苏姆帝国千年的家底，这片尼罗河谷地并入得晚，此后一直高度自治。当地的阿拉伯部落首领和贝贾族酋长像一群和中央合伙做生意的商人，她们对亚的斯亚贝巴的忠诚只有一个限度：不交税，不出兵，但承认你们的旗子。\n喀土穆的市井生活全由两条尼罗河安排。每年汛期（七月到十月），青尼罗河暴涨，冲下大量泥沙和浮木；白尼罗河把更清的上游水送来。两股颜色不同的水在汇流处拉开一道几公里长的水线：青尼罗河是浑浊的赭色，白尼罗河是浅淡的灰绿，并排流了近一公里才混到一起。当地人管这叫“真主的两条指印”。\n河畔市场叫苏克·尼罗，是非洲之角最奇的集市之一，因为它既是陆上集市，又是水上集市。岸边排着上百条船，跑长途货运的阿拉伯三角帆船挨着河湾里打鱼的小独木舟，商贩在船头摆摊，顾客站在石阶上还价。卖的东西从上游河谷的象牙、橡胶、野蜂蜜，到下游埃及运来的纺织品、煤油灯、白糖，还有从吉布提港经联盟铁路转运来的欧洲火柴和印度茶叶。\n§C鼻子是动物最敏感的器官，而喀土穆是整个联盟最敏锐的“嗅觉预警器”。§!"
 Adorable_heart_city_story_desc_mjds: "摩加迪沙这个名称的源头已经查不清了。波斯商人管它叫“马格迪沙乌”，阿拉伯地理学家写成“马克迪沙乌”，葡萄牙人按海岸轮廓音译成“摩加迪休”。名字换来换去，这座城市在印度洋西岸的灯影却一千多年没熄过。\n真正统治这里的，不是亚的斯亚贝巴，也不是当地氏族的苏丹，而是阿拉伯商人、印度裔钱庄主和几个上了年纪的葡萄牙-阿曼混血老船长结成的秘密联盟。船、仓库、汇率和走私渠道都在她们手里，联盟的赤土红旗只是在她们的屋顶上借风飘着。摩加迪沙是联盟东部海岸少数有深水港的城市之一。天然港被一道老珊瑚礁护住，形成长约两公里的避风锚地，每年三百多条商船在此停泊，阿拉伯帆船、英国蒸汽轮、季风季节的独桅帆船队都来。\n中央对摩加迪沙的态度四个字：又爱又怕。爱它，因为这是联盟唯一的硬通货换汇口。内陆的咖啡、兽皮、象牙经哈勒尔-贝莱德文公路运到这里，以银元计价卖给外国商船，换回联盟急需的步枪子弹、无线电零件和瑞士钟表。怕它，因为这座城市太容易“飘走”。摩加迪沙的索马里商业精英与阿拉伯半岛、印度的商业网络连得很紧，她们关心的是卢比汇率、季风动向和家族钱庄的信用评级，不是阿克苏姆帝国的千年法统。亚的斯亚贝巴要是征税过重，她们随时可以“用脚投票”，把货柜转到意呆莉控制的基斯马尤港，或者直接投靠英国的桑给巴尔贸易体系。中央军能守住兵营，守不住每一个商人的账本。\n§C它只是存在着，在自己的时间内，按照季风与潮汐的古老节律运转。§!"
