#事件介绍
 YSS.2.t: "解体"
 YSS.2.d: "由于我们没有妥善处理好国内，中央已经无法压制那些封建余孽，她们把修道院里的皇帝搬了出来，推翻了无产阶级的统治。"
 YSS.2.a: "啊，道路......"
 YSS.3.t: "议程一"
 YSS.3.d: "对于过去联盟取得的成果，国际经济统筹委员会的主要负责人梅嫩·阿斯富同志面向全体代表作出了报告，以下是阿斯富同志报告内容的摘要：\n“......在过去的26年中，我们从零到有建设了最基础的工业体系，创立了近20个国家企业，完成了首都亚的斯亚贝巴的现代化建设，建立了国家第一支人民军队，新加入的党员有十万余名，实现了从封建社会向社会主义社会的伟大进步。”"
 YSS.3.a: "干的好啊，同志们！"
 YSS.4.t: "议程二"
 YSS.4.d: "农业人民委员马克南同志与重工业人民委员阿拉盖同志向大会作出了关于国内现状的报告。\n报告指出，虽然基础工业体系已初步建成，但农业集体化进程缓慢，加之旧官僚主义作风严重，导致部分地区面临严重的粮食短缺问题。此外，潜伏的旧势力残余仍在暗中破坏，威胁着新生联盟的稳定。加快农业改造，整顿吏治，已成为当前亟待解决的核心问题。"
 YSS.4.a: "加快农业集体化进程，解决温饱问题。"
 YSS.5.t: "议程三"
 YSS.5.d: "外交人民委员达格同志为代表们作关于现今国际局势的报告。\n报告表明，当前邪恶势力正在世界各地迅速扩张，各帝国主义列强对我国虎视眈眈，并对我们实行了严密的军事和经济封锁。作为非洲唯一的社会主义国家，我们正处于帝国主义的包围圈中。唯有迅速建立强大的重工业和国防工业体系，积极声援世界民族解放运动，才能打破封锁，站稳脚跟。"
 YSS.5.a: "加强战备，时刻准备应对帝国主义的武装干涉。"
 YSS.6.t: "突发议程"
 YSS.6.d: "就在国家主席贝耶尼同志准备结束这次会议的时候，马里亚姆同志突然打断了主席同志的发言，宣布了关于索维耶特联盟新宪法的草案进度，并将宪法草案分发到了每个代表的桌上。虽然很多人都已经或多或少知道了新宪法正在草拟的情况，但总书记同志的突然袭击让她们感到措手不及。"
 YSS.6.a: "总书记同志想要干什么？"
 YSS.7.t: ""
 YSS.7.d: "致：联盟国家主席 阿勒姆沃·贝耶尼同志\n\n贝耶尼同志：\n关于宪法的问题，我有一些想法需要与你沟通。\n1910年的宪法是在国家刚刚成立、形势尚未稳固的时期制定的。它完成了它的历史任务，但已经无法反映我们今天取得的巨大成就。我们建立了社会主义工业体系，完成了国家现代化，阶级力量对比已经发生了根本性的变化。一部旧的宪法，无法体现这些新的社会现实。\n我认为，新宪法不应该是一部纲领性的文件，不应与党的纲领混为一谈。它应该记录我们已经取得的成就，而不是我们未来想要达成的目标。我们需要一部能够巩固现有成果、并为未来的发展提供稳定法律框架的根本大法。\n宪法的各项基本原则不应散落在条文中，而应作为开篇条款，起到统领全篇的作用。此外，我倾向于引入全民公决制度，让这部宪法在程序上更具合法性。\n这份工作必须严肃对待。我希望你能以中央执行委员会主席的身份，在近期组织相关同志，开始新宪法的宣传准备工作。我们需要在下一届苏维埃代表大会上，正式提出并通过这部新宪法。\n\n祝你诸事顺遂。"
 YSS.7.a: "你的海尔"
 YSS.8.t: "沉默"
 YSS.8.d: "出于突然袭击的考虑，新宪法并未让代表们提前知晓其中内容，以避免互相串联的情况。但在粗略看完手中的草案后，面对其中提出的将地方权利收归中央的条款，所有人都自发默契地在举手发表意见时选择了沉默，以冷暴力的方式抗拒中央。"
 YSS.8.a: "将选择权交给人民。"
 YSS.9.t: "地方集团的抵制"
 YSS.9.d: "草案中废除地方自治、将权力收归中央的条款引起了地方集团的高度警觉。她们暗中串通，利用手中把持的资源和影响力，在基层大肆散布谣言，煽动不满情绪，试图以集体抵制的强硬姿态逼迫中央退让。"
 YSS.9.a: "她们压不倒我们。"
 YSS.10.t: "民众对宪法漠不关心"
 YSS.10.d: "由于新宪法的起草始终在高层进行，未向普通民众公开详细内容，加上接连不断的争论和拖延，底层民众普遍认为这只是高层官僚之间的权力斗争，与她们关系不大，因此对宪法的推行表现出极度的冷漠和旁观态度。"
 YSS.10.a: "这可是关乎到她们的利益！"
 YSS.11.t: "来自全国各地的反对信"
 YSS.11.d: "随着地方保守势力的暗中煽动，来自全国各地基层干部的反对信如雪片般飞往首都。信中大谈中央收权将会破坏地方稳定，并暗示强行通过宪法会导致社会动荡，这让中央内部对强行推行新宪法的决心产生了动摇。"
 YSS.11.a: "难道新宪法的内容确实不适合现在的环境？"
 YSS.12.t: "表决再次失败"
 YSS.12.d: "在巨大阻力的干扰下，重新召开的表决会议再次以失败告终。赞成票数远远达不到法定要求，新宪法的通过陷入了死胡同。"
 YSS.12.a: "或许我们应该考虑一些干部们的意见。"
 YSS.12.b: "一定是地方干部们堵住了人民的嘴。"
 YSS.13.t: "修订"
 YSS.13.d: "为了打破僵局，宪法修订委员会痛定思痛，删除了部分过于激进的集权条款，在征税权、地方干部任免权上做出了重大让步。修订后的草案很大程度上顾及了地方干部的利益，终于换取了大部分人的初步赞同。"
 YSS.13.a: "那就这样吧。"
 YSS.14.t: "积极参与的人民群众"
 YSS.14.d: "在彻底放开言论限制，动员民众进行集体讨论后，被压抑已久的广大人民群众终于发出了自己的声音。她们自发组织集会，发表联名信，强烈支持中央集权，怒斥地方干部是为了保住自己的一己私利而阻挡国家进步，形成了声势浩大的倒地方运动！"
 YSS.14.a: "我就知道！"
 YSS.15.t: "最终草案"
 YSS.15.d: "经过反复拉锯和修订后的最终草案摆在了面前。虽然它在很大程度上是对地方势力妥协的产物，放弃了部分最初的理想，但这已经是当前环境下能够达成的最稳定的平衡。"
 YSS.15.a: "可以发布了。"
 YSS.16.t: "最终草案"
 YSS.16.d: "顶着地方干部集团的重重压力，在人民群众排山倒海般的支持和拥护下，我们最终敲定并强行通过了这份充满进步意义的最终草案。打破僵局的时刻终于到来！"
 YSS.16.a: "可以发布了！"
 YSS.17.t: ""
 YSS.17.d: "亲爱的门格斯图同志：\n\n请接受来自莫斯科的诚挚问候，以及联共（布）中央对贵国工人阶级与农民群众的坚定声援。\n在红海之滨，在曾经被黄金王座和封建锁链统治了千年的古老土地上，你们打碎了旧世界的枷锁，升起了苏维埃的红旗。你们的存在，是我们这个时代最令人振奋的奇迹之一。正如列宁同志所言，帝国主义链条会在最薄弱的环节断裂，而你们——索维耶特社会主义共和国联盟——已经证明了非洲之角同样能够孕育出属于劳动人民的红色灯塔。你们顶住了圣杯王国和幻想乡等帝国主义势力的外交讹诈与法理围剿，捍卫了民族独立与主权尊严，第三国际为拥有你们这样的兄弟党而感到骄傲。\n但是，门格斯图同志，作为革命者，我们不能仅仅沉醉于鲜花与掌声。作为你们的同志，我有责任向你们指出目前联盟内部正在蔓延的、确切无疑的修正主义毒瘤。这不仅是对马克思主义的背叛，更是对1910年那些流血牺牲的起义军官和士兵的亵渎！\n门格斯图同志，切记，妥协换不来和平，只会换来得寸进尺的反扑。你们的身体与政治生命，与无产阶级革命事业是绑在一起的。面对错综复杂的封建地主根基，软弱就等同于慢性自杀。非洲的红色灯塔，绝不能被修正主义的阴霾笼罩。希望你们能够重温《共产党宣言》的最后一句话：“全世界无产者，联合起来！” 联共（布）与第三国际，将在国际主义的原则下，继续关注你们的斗争。\n期待听到你们清扫污泥浊水、取得社会主义彻底胜利的消息。\n\n致以崇高的共产主义敬礼！"
 YSS.17.a: "木之本樱"
 YSS.18.t: "消息"
 YSS.18.d: "苏联表示愿意与我们达成协议，但对于我们国内的情况，联共提出要派驻内务部特派员来“监督社会主义建设工作”。"
 YSS.18.a: "这是什么意思？！"
 YSS.19.t: "转变"
 YSS.19.d: "在我们拒绝了苏联的请求后，她们不出意外地展示出了强硬的态度，并提出了更苛刻的要求。"
 YSS.19.a: "我们不是她们的加盟国。"
 YSS.20.t: "最后谈判"
 YSS.20.d: "在漫长的争吵过后，苏联最终提出了妥协方案，她们表示如果联盟在非洲“秉承着国际分工精神听从苏维埃的召唤”，那么她们将欢迎我们。"
 YSS.20.a: "我看啊，俄罗斯是想当全世界人民的沙皇了！"
 YSS.20.b: "这也不无不可......"
 YSS.21.t: "只剩滚木的空军"
 YSS.21.d: "委员会对红军航空兵部队的初步调查报告彻底曝光了令人窒息的现状。昔日翱翔天际的空军如今名存实亡，广阔的机场停机坪上，不仅没有一架完好的战机，甚至连用于修补跑道的枕木都干裂破碎，放眼望去，只剩几截垫脚的滚木和满地生锈的废铁。"
 YSS.21.a: "？"
 YSS.22.t: "玄学训练法"
 YSS.22.d: "随着调查的深入，飞行员训练科目的真相令人啼笑皆非。由于缺乏燃油、实机和合格的教练，基层飞行大队竟退化到了中世纪。飞行员们不再研究空战战术，而是沉迷于占卜风向、跳大神、供奉“空中战神”，企图用虔诚的玄学信仰来弥补技术上的绝对空白。"
 YSS.22.a: "？？"
 YSS.23.t: "不称职的军官"
 YSS.23.d: "航空兵各级指挥岗位被大量毫无飞行经验、只擅长政治钻营的官僚占据。这些指挥官连基本的气象图都看不懂，却能大肆挥霍宝贵的航空预算。在最近的一次演习中，一位连操纵杆都没摸过几次的指挥官，硬是将三架宝贵的战机开进了沼泽地里，事后却还在推诿责任、互相指责。"
 YSS.23.a: "好好好！"
 YSS.24.t: "空无一物的库存"
 YSS.24.d: "当委员会强行清点空军后勤仓库时，令人发指的腐败巨案浮出水面。账本上明明白白记录着上千架备用战机、成堆的航空炸弹和几万吨高辛烷值燃油，但实际仓库里除了老鼠和伪造的出入库单据，什么都没有。巨大的物资黑洞证明，空军高层的硕鼠们正在将国家财产疯狂倒卖。"
 YSS.24.a: "？？？"
 YSS.25.t: "空军中的破坏分子"
 YSS.25.d: "内务人民委员部的介入揭开了最深层的黑幕。调查证实，空军内部的腐败不仅是贪财，更是一场有组织、有预谋的破坏行动。敌对分子潜伏在机务和参谋系统中，蓄意在战机发动机中掺入沙砾、在燃油里注水、篡改领航数据。这不仅是在瓦解联盟的防空力量，更是在谋杀我们的飞行员，企图从内部彻底摧毁联盟的空中防线！"
 YSS.25.a: "岂有此理！"
 YSS.26.t: "来自国家经济统筹委员会的报告"
 YSS.26.d: "第二个五年计划步入尾声，国家经济统筹委员会向中央提交了总结报告。报告指出，联盟在工业和基础建设上取得了举世瞩目的成就，数个大型钢铁厂和水电站拔地而起，人民的生活水平有了质的飞跃。"
 YSS.26.a: "我们仍需努力，不要沉醉于既有成功。"
 YSS.27.t: "阿拉盖同志的报告"
 YSS.27.d: "负责重工业技术指导的阿拉盖同志在补充报告中直言不讳地指出了当前面临的窘境：我们虽然建起了厂房，却极度缺乏熟练的技术工人和工程师；由于西方国家的封锁，精密机床和核心零件的进口渠道被完全掐断。许多工厂只能靠拆东墙补西墙来维持运转。"
 YSS.27.a: "看来我们要重视技术上的难关。"
 YSS.28.t: "建设当中的实际问题"
 YSS.28.d: "许多官员为了迎合上面的指标，不顾实际条件，盲目上马大型项目。资金拨下去了，设备运到了，却因为没有配套的水电设施和交通网络，导致项目烂尾，大量宝贵的国家资源被白白浪费。"
 YSS.28.a: "记下了。"
 YSS.29.t: "混乱的具体流程"
 YSS.29.d: "随着建设规模扩大，国家内部的行政效率却急剧下降。一个基建项目从审批到动工，往往需要经过十几个部门的层层盖章，官僚们相互推诿扯皮，吃拿卡要。繁琐僵化的流程严重拖慢了国家的建设进度。"
 YSS.29.a: "记下了。"
 YSS.30.t: ""
 YSS.30.d: "阿拉盖，你好：\n\n我已经仔细审阅了重工业人民委员部提交的关于第二个五年计划执行情况的进度报告。总体而言，我对此感到满意。亚的斯亚贝巴钢铁厂的产出稳定增长，提格雷的煤炭产量也达到了预期指标。你们重工业战线上的同志们，在极其困难的国际环境的条件下，顶住了压力，为苏维埃国家的工业化奠定了坚实的钢铁骨架。帝国主义者总盼着我们垮台，但你们的成绩单，是对她们最好的回击。你个人的辛劳，中央是看在眼里的。\n但是，阿拉盖，我们不能被胜利冲昏头脑。报告中也暴露出了令人不安的不足之处。我注意到，在钢铁与机械产量达标的同时，产品的质量问题依然突出。一些工厂为了完成纸面上的数字指标，粗制滥造，浪费了大量的优质原材料；部分新投产的矿井和车间，管理混乱，由于官僚主义的拖延，设备利用率甚至不足设计标准的一半。此外，在技术人员的培养上，我们仍然过于依赖外国专家，必须加快培养我们自己的红色工程师队伍。告诉那些厂长老实一点，不要试图用虚假的报表来糊弄中央，否则她们将面临最严厉的纪律处分。\n\n不过，这些是明天开会要讨论的工作问题。今天写信给你，是因为我注意到了另一件极其重要、却被你本人长期忽视的事情——你的身体。\n阿拉盖，我最近听马克南同志说，你很久没有好好睡过一觉了。你常常在办公室里工作到凌晨，甚至连续几周每天只睡三四个小时，靠着浓茶和香烟硬撑着。你把全部精力都献给了重工业，这很好，但你认为，一个疲惫不堪、神经衰弱的阿拉盖，还能带领重工业人民委员部打赢接下来的硬仗吗？\n因此，阿拉盖，我以中央委员会的名义，给你下达一项硬性任务：请你务必在最近几天内，给自己放一天假。就一天。不要去办公室，不要接见下属，不要看任何报表。去自己的别墅走走，或者就在亚的斯亚贝巴郊外的树林里散散步。把所有的电话线拔掉，躺在床上，哪怕只是闭着眼睛什么都不做。这是命令。\n希望在这封信送达后，我能从医生的报告里看到你终于睡了一个好觉。\n\n致以同志的问候。"
 YSS.30.a: "门格斯图"
 YSS.31.t: "马克南同志的报告"
 YSS.31.d: "马克南同志递交了关于地方吏治的详细报告。她指出，许多地方干部长期在一个地方任职，拉帮结派，任人唯亲，形成了针插不进、水泼不进的“山头”。她们不仅抗拒中央的调令，甚至暗中煽动地方主义情绪，对抗中央的监督。"
 YSS.31.a: "看来地方同志的山头主义很严重啊。"
 YSS.32.t: "杂乱无章的交通网络"
 YSS.32.d: "地方各自为政的恶果在基建上暴露无遗。各地修建的公路和铁路标准不一，宽窄各异，缺乏全国统一的规划。大量“断头路”导致物资运输效率极其低下，甚至出现相邻两个州的铁路因为轨距不同而无法通车，严重阻碍了国际的经济血脉。"
 YSS.32.a: "记下了。"
 YSS.33.t: "偷工减料的建筑工程"
 YSS.33.d: "巡视组在检查地方工程时发现了骇人听闻的贪腐案。地方官员与承包商相互勾结，大肆虚报预算，在建筑材料上偷工减料。刚建成的厂房墙体开裂，大桥尚未通车便出现沉降，这不仅造成了巨大的经济损失，更埋下了严重的安全隐患。"
 YSS.33.a: "记下了。"
 YSS.34.t: "不配合的地方官僚"
 YSS.34.d: "当中央试图深入调查这些乱象时，却遭到了地方官僚体系的软抵抗。她们不仅隐瞒账目、销毁证据，甚至煽动不明真相的群众围堵调查人员，高呼“保卫地方利益”，企图用无赖手段逼迫中央停止调查。"
 YSS.34.a: "记下了。"
 YSS.35.t: "完成第二个三年计划"
 YSS.35.d: "尽管内部充满了阻力，但在广大党员和人民群众的艰苦奋斗下，第二个三年计划的核心指标终究还是完成了。联盟的工业产能翻了一番，为国防力量的建立打下了基石！"
 YSS.35.a: "向着胜利迈步！"
 YSS.36.t: "海洋工业的欠缺"
 YSS.36.d: "联盟的造船工业基础极为薄弱。我们不仅缺乏能够建造大型水面舰艇的干船坞和重型龙门吊，甚至连生产合格舰用特种钢材和精密动力系统的能力都严重不足。目前的几家造船厂大多只能勉强拼装内河小艇和民用渔船，工人们甚至没见过现代军舰的图纸。海军同志想要拥有属于自己的现代化舰队，可谓是巧妇难为无米之炊。"
 YSS.36.a: "尽力克服吧。"
 YSS.37.t: "地理环境的限制"
 YSS.37.d: "海军参谋部无奈地指出，联盟的地理位置对海军发展构成了天然的致命限制。我们仅有的几个出海港口不仅远离国家核心重工业区，而且完全暴露在帝国主义列强的军事基地监视之下。一旦爆发冲突，敌方只需在关键海峡部署水雷或潜艇，就能轻易将我们的舰队封锁在港内。我们本就缺乏拥有战略纵深的优良港湾，任何试图走向深蓝的尝试，都将面临被敌人瓮中捉鳖的巨大风险。"
 YSS.37.a: "我们本就处在风口浪尖......"
 YSS.38.t: "极为有限的财政预算"
 YSS.38.d: "在中央“先陆军、后空军、最后海军”的资源分配原则下，海军提交的造舰计划和基地扩建预算被一再压缩。面对空荡荡的国库和愤怒的海军将领，中央只能无奈地让她们继续等待。"
 YSS.38.a: "海军同志们再隐忍一下吧。"
 YSS.39.t: "军事改革一塌糊涂"
 YSS.39.d: "调查委员会提交的军事改革评估报告却令人大跌眼镜。由于长期的选择性忽视，加上地方势力的阳奉阴违，我们引以为傲的红军已名存实亡。大量部队被拆散为地方防御部队，指挥体系混乱不堪，所谓的现代化改革就是一堆纸上谈兵的废纸。"
 YSS.39.a: "事情比我想象的更糟糕......"
 YSS.40.t: "我们在政治工作上的失败"
 YSS.40.d: "委员会在内务人民委员部的协助下，揭露了红军政治系统触目惊心的腐败。各级政治宣传员与军事主官沆瀣一气，将政治工作变成了争权夺利、打压异己的工具。许多政工干部占据了位置却毫无建树，每日只知吃拿卡要、虚报功绩，导致中央的政策无法下达基层，士兵的思想被地方主义严重侵蚀。"
 YSS.40.a: "尸位素餐。"
 YSS.41.t: "空有斗志的红军"
 YSS.41.d: "尽管指挥与政工系统烂到了根子里，但巡视组在基层却看到了令人心酸的一幕：底层的红军战士依然保持着极高的革命热情和昂扬斗志，她们甘愿为联盟流尽最后一滴血。可是，当询问起现代战术协同、步坦结合等基本科目时，这些战士却一脸茫然。敌人拥有飞机大炮，而我们只有赤诚的胸膛，这种缺乏专业军事技能支撑的“斗志”，在现代化战场上无异于集体自杀。"
 YSS.41.a: "这是怎么回事？"
 YSS.42.t: "严重漏缺的各式装备"
 YSS.42.d: "红军的武器库同样惨不忍睹。账面上满编的机械化军，实际连卡车轮胎都凑不齐；承诺下发的火炮，大多在运输途中被地方官僚倒卖。红军战士们手里拿着老掉牙的步枪，甚至连人均几发子弹都无法保证。正是这些硕鼠和叛徒，在挖联盟的墙角，试图让红军流尽最后一滴血。"
 YSS.42.a: "有些人要为此付出代价！"
 YSS.43.t: ""
 YSS.43.d: "致：亚的斯亚贝巴钢铁厂 里韦诺同志\n\n里韦诺同志：\n你好。我今天写这封信，是因为我在重工业人民委员部的生产简报上，看到了你的名字。简报上说，你在过去三个月中，累计超额完成生产定额的百分之一百四十七，并且主动将自己摸索出的快速铸铁法传授给了同车间的十二名工友。为此，我代表联盟中央委员会，向你表达诚挚的赞许。\n里韦诺同志，你可能觉得自己只是做了分内之事——多炼了几炉铁，多带了几个人。我要告诉你，你所做的，远比你以为的更加重要。联盟的社会主义工业体系，正是靠着千千万万个像你这样的工人，一砖一瓦地建立起来的。你在炉火前的每一滴汗水，都是在为联盟的独立与尊严铸造铠甲。帝国主义者与国内的那些王公老爷们，巴不得我们的工厂停工、高炉熄火。而你和你的工友们，用实实在在的产量，给了她们一记响亮的耳光。\n我听说你出身于提格雷的农民家庭，父亲死于旧帝国贵族的横征暴敛。你没有上过大学，但你凭着自己的钻研，改进了祖辈传下来的土法冶炼技术。这就是无产阶级的智慧！这就是马克思主义所说的“人民群众创造历史”！你不必因为自己没有文凭而自卑。恰恰相反，你对生产流程的深刻理解，是那些只会坐在办公室里画图纸的官僚永远学不会的。中央现在正在号召“红色工程师”运动，我希望你能把你的经验整理成文字，让更多的工人兄弟受益。\n不过，里韦诺同志，我也有几句话要叮嘱你。赞扬容易让人松懈，而革命事业容不得半点松懈。你的快速铸铁法虽然有效，但质量监察委员会的报告中也提到，部分采用该法的炉次出现了硬度不达标的问题。我建议你与厂里的技术员合作，进一步完善工艺，在提高产量的同时，务必确保质量。列宁同志说过，数量本身可以转化为质量——但转化的前提，是我们每一道工序都经得起检验。\n最后，请代我向你的母亲问好。我听说她一直为你的健康担心，怕你夜班太多熬坏了身子。你告诉她，门格斯图同志说了——一个健康的里韦诺，才是联盟最宝贵的财富。联盟需要你，里韦诺同志。继续努力。\n\n致以同志的问候。"
 YSS.43.a: "门格斯图"
 YSS.44.t: ""
 YSS.44.d: "致：联盟国家主席 阿勒姆沃·贝耶尼同志\n\n贝耶尼：\n见信如晤。\n写这封信的时候，已经是凌晨两点了。我刚从政治局会议厅走出来，桌面上还堆着今天没来得及批复的三十多份文件。我提笔写这封信，只是作为一个疲惫的人，想找你发发牢骚。\n贝耶尼，我必须对你说实话：我快要撑不住了。我不是铁打的，我是个人，一个血肉之躯。每天一睁眼，迎接我的就是无穷无尽的报告。重工业的钢材产量不达标，我要听阿拉盖的汇报；空天军的编制少得可怜，我要拍桌子骂人；王公们又在地方上抗税，我要批示调查委员会；甚至就连贵族子弟学校里那些戴着红袖章学马克思的少爷小姐们闹出了丑闻，最后也全都要汇总到我这里来。事情永远做不完，每当我批完一摞文件，第二天清晨就会有更高的一摞出现在我的办公桌上。\n我最近常常失眠，整宿整宿地盯着天花板。马克南同志上次来汇报工作时，看见我咳得直不起腰，劝我去看医生，我把她骂回去了。我怎么能休息？我连睡一个整觉都是奢侈。\n你还记得吗？1910年政变那晚，我们冲进皇宫时，是何等的意气风发？我以为推翻了老皇帝，建立了苏维埃，一切就会好起来。可如今二十多年过去了，我还是在跟腐朽的封建残余作斗争，还是在看着那些该死的官僚用假报表糊弄我。有时候我真的觉得，这个国家的每一块砖，都需要我亲自去烧。\n我把这些话倾诉给你，是因为在整个中央政治局里，只有你见过我最狼狈的样子。我不是在寻求你的怜悯，我是在恳求你：分担一些我的工作吧。 不要让我一个人扛着所有的雷。你以国家主席的身份直接去督促一下进展。我需要喘一口气，哪怕只有半天。我累极了，贝耶尼。我真的不是铁人。\n今晚的这封信，你就当是一个老布尔什维克在发牢骚。明天太阳升起的时候，我依然会坐在那张办公桌前，继续和那些官僚、军阀、资本家死磕到底。但此刻，我只想躺下，闭上眼睛，什么都不想。\n\n祝好。"
 YSS.44.a: "门格斯图"
 YSS.45.t: ""
 YSS.45.d: "致：我亲爱的娜塔莎\n\n娜塔莎，我的爱人：\n夜已经很深了，亚的斯亚贝巴的晚风终于带走了白天的燥热。我刚刚送走了最后一位汇报工作的同志，独自坐在书房的台灯下。窗外偶尔传来巡逻哨兵的脚步声，这让我突然无比想念你，想念你泡的茶，想念你在我身旁翻动书页时那种安静的呼吸声。\n你最近过得怎么样？上周我从马克南同志那里听说，你去了城南的妇女识字班教课，还带着那些女工们在院子里开垦了一小块菜地。我真为你感到骄傲，娜塔莎。你总是能在最琐碎的日常里，找到让生活变得美好的力量。请一定要按时吃饭，你的胃一直不太好，不要为了照顾那些孩子而忘记了自己。\n我知道，你一定又在报纸上看到了那些风言风语。你总是那么敏锐，我能想象你深夜看着报纸时皱起的眉头。但娜塔莎，请你相信我，也相信我们的党，一切都很好。\n我必须向你坦白一点小小的内疚。这段时间我实在太忙了，没能好好陪你在院子里散步，甚至连你新种的那几株咖啡树都没来得及去看一眼。有些时候，我觉得自己把所有的精力都交给了国家，留给你的只剩下疲惫的背影。对不起，娜塔莎。\n有时候我觉得，只要回到你身边，那些繁杂的报表和官僚主义的恶臭，就全都被挡在门外了。只要看到你，我就觉得我为之奋斗的这一切——让人民过上有尊严的生活、让下一代不再被奴役——都是真实且可以触碰的。\n不要为我担心。我的身体很好，只是偶尔需要多喝几杯浓咖啡。等下周忙完这阵子，我向你保证，我一定会抽出半天时间，我们一起去恩托托山脚下走走，就我们两个人，不谈政治，不看文件，就像我们年轻时那样。\n愿一切安宁。\n\n永远爱你的，"
 YSS.45.a: "门格斯图"
 YSS.46.t: "就粮食征购问题致各省党委的紧急指示"
 YSS.46.d: "致：各省党委、各专区苏维埃\n\n同志们：今年南方的收成，据农业人民委员部初步估算，比去年略有增长。这本来是一件好事。但最近几天，我连续收到了来自阿姆哈拉、提格雷和锡达莫三个地区的紧急报告，说当地农民在完成国家征购任务后，手中口粮严重不足，有些村庄已经开始以野菜和树皮充饥。\n我在这里必须把话说清楚：国家征购是必要的。城市工人在挨饿，红军战士在挨饿，如果我们不把粮食集中起来，工业建设就是一句空话。但是，征购不能变成掠夺。有些地方的干部，为了在报表上超额完成任务，把农民来年的种子粮都收走了。这不是革命，这是犯罪。\n我命令：立即以各省苏维埃主席团的名义，重新核查所有已下达的征购指标。凡发现征购后农民人均口粮低于最低生存标准的，必须在本月内退还部分粮食，或从国家储备中调拨补充。这件事由各省党委书记亲自负责，不得推诿给下属。谁要是再把农民逼上绝路，谁就要上革命法庭。\n同时，我也要提醒各级干部：不要因为中央说了‘纠偏’，就走到另一个极端，把征购任务全部取消。国家需要粮食，城市需要粮食，红军需要粮食。关键是要有分寸，要会算账，要懂得农民也是人。\n另外，我听说有些县的干部在征购过程中收了富农的贿赂，把她们的粮仓留了下来，却把贫农的种子粮拉走了。这种事，查到一件，处理一件，绝不姑息。\n，中央信任你们，但中央也在看着你们。请立即执行。\n\n致以同志的问候。"
 YSS.46.a: "门格斯图"
 YSS.47.t: ""
 YSS.47.d: "致：《人民报》编辑部\n\n同志们：\n我最近看了贵报最近三期的文艺副刊，有些话不得不说。\n你们在第三版连载了一篇题为《红海日出》的小说，讲一个红军战士在战斗中与敌人肉搏的故事。写得很有激情，但里面有一个情节让我很不舒服：主人公在弹尽粮绝之际，掏出怀里的《共产党宣言》挡了一颗子弹，然后高喊“为了联盟”冲出战壕。同志们，马克思主义不是护身符，更不是防弹衣。把革命理论写成符咒，这是对理论的侮辱。\n还有第五版那首长诗《拖拉机颂》，把拖拉机比作“钢铁的骏马”、“大地的情人”。诗写得漂亮，但我们的农民现在连牛都喂不饱，拖拉机还停在省城的仓库里生锈。文艺可以浪漫，但不能脱离实际。\n当然，我不是说你们不应该歌颂劳动和革命。我的意思是，歌颂要建立在真实的基础上。红军战士的英勇是真实的，农民的辛劳是真实的，工人的汗水是真实的。写这些真实的东西，比编造神话更有力量。\n我建议你们派两个记者去提格雷的铁矿和锡达莫的棉花田住上一个月，和工人农民一起吃饭、一起干活，然后再写。\n\n致以同志的问候。"
 YSS.47.a: "门格斯图"
 YSS.48.t: ""
 YSS.48.d: "致：国家经济统筹委员会、各人民委员部\n\n同志们：\n第三个三年计划纲要的草案，经过政治局三次讨论、各人民委员部两轮修订，我逐条看完了，总体上同意提交第八次党大会审议。但有几处，我必须写下我的意见。\n第一，重工业指标定得过高。草案要求钢产量在三年内翻一番，达到年产五十万吨。同志们，第二个三年计划结束时，我们的钢产量才二十四万吨。翻一番不是不可能，但前提是提格雷的铁矿要如期扩产、亚的斯亚贝巴的焦炭要稳定供应、铁路运输要跟上。这三件事，哪一件没有把握？我建议把指标下调到四十万吨，留出余地。超额完成是英雄，完不成是笑话。\n第二，农业集体化的进度，草案要求三年内覆盖全国百分之六十的农户。这个数字是坐在办公室里算出来的。你们去问问马克南同志，去年集体农庄的实际巩固率是多少？有些农庄春天成立，秋天就散了。集体化要讲质量，不是讲百分比。我建议改为‘在条件成熟的地区推进，不设全国统一指标’。\n第三，国防工业的篇幅太少。草案里只写了‘加强军工生产’，这太含糊。要具体到步枪、火炮、弹药的年产目标，要具体到新建几个兵工厂、改造几个老厂。红军整顿刚刚有了起色，不能断了装备供应。\n第四，也是最重要的一点。草案通篇讲生产指标，讲厂房、讲机器、讲产量，但很少讲人。工人住在哪里？吃什么？生病了怎么办？孩子上学怎么办？我们搞工业化，不是为了在纸上画出一堆数字，是为了让联盟的人民过上好日子。如果工人饿着肚子炼钢，农民勒紧裤腰带交粮，那这个计划就是失败的。\n请统筹委员会根据以上意见，在十天内拿出修订稿。第八次党大会不能开成一个念数字的大会。\n\n致以同志的问候。"
 YSS.48.a: "门格斯图"
 YSS.49.t: ""
 YSS.49.d: "致：内务人民委员部、中央调查委员会\n\n同志们：\n经过政治局扩大会议的激烈讨论，中央决定对内务部的权限进行调整。这不是对内务部同志们的惩罚，更不是对清洗工作的否定。恰恰相反，正是因为清洗工作取得了阶段性胜利，我们才有条件将专政机关重新改组，让其更好地为我们的国家服务。\n具体决定如下：第一，内务部今后执行逮捕、搜查、查抄等强制措施，必须事先取得中央调查委员会或同级苏维埃检察院的书面批准。紧急情况下可先行处置，但须在四十八小时内补办手续。第二，内务部不再拥有对党员进行‘政治审查’的专属权力，所有涉及党员的审查案件，一律移交中央调查委员会复核。第三，内务部在押人员的关押期限、审讯记录、上诉渠道，必须按新颁布的《联盟刑事诉讼法》执行，刑讯逼供者，一经查实，以反革命罪论处。\n我知道，内务部的同志们会有情绪。你们在过去两年里做了大量工作，抓出了不少隐藏的敌人，保卫了联盟的安全。中央感谢你们。但是，同志们，一个革命政权如果连自己的专政机关都管不住，那它和旧帝国的秘密警察还有什么区别？我们清洗敌人，不是为了制造恐惧，是为了让人民安心。\n谁有意见，可以按组织程序提出，但不准消极怠工，不准散布不满言论。内务部仍然是联盟的利剑，只是这把剑的剑柄，必须握在政治局手里，而不是握在某个部门手里。\n\n致以同志的问候。"
 YSS.49.a: "门格斯图"
 YSS.50.t: ""
 YSS.50.d: "致：联盟文化委员 阿塔丘同志\n\n阿塔丘同志：\n你好。\n今天写这封信，没有什么紧急的事务，只是想和你聊聊最近的一些感受。\n你是联盟的老同志了。从1910年那个夜晚开始，你就跟着我们一路走过来，办报纸、建学校、组织文艺演出，二十多年如一日。你的头发比我第一次见你时白了许多，但你那股子认真劲儿，我一直是看在眼里的。\n最近我走访了几个工厂和机关，注意到一个让我有些在意的现象。大家似乎不太习惯用“同志”来称呼彼此了。有人喊上级“老爷”，有人叫领导“长官”。起初我以为只是个别现象，但走得多了，发现这并非孤例。\n阿塔丘，你比我更了解文化战线的敏感度。称呼这件事，说大不大，说小也不小。它不会立刻让工厂停产，也不会让红军少一发子弹。但它是面镜子，照出的是我们脑子里的一些东西。也许是旧习惯改起来比想象中难，也许是大家觉得这样叫更顺口、更方便。我不确定原因，但我总觉得，这个苗头值得注意。\n当然，我不是说谁犯了什么大错。这些年在你的主持下，文化教育大革命取得了不少成绩，文艺界的风气也在慢慢转变。我知道你比我更操心这些事，你经手的东西比我细致。所以，我只是把看到的、听到的告诉你，至于怎么理解、要不要做点什么，你自己斟酌。你是老同志了，分寸拿捏得比我准。\n另外，前些天听马克南同志说，你最近又熬了好几个通宵审剧本。工作要紧，身体也要紧。别学我，我是个不听话的病人，你可别跟我一样。\n\n愿你身心俱康。"
 YSS.50.a: "门格斯图"
 YSS.51.t: ""
 YSS.51.d: "致：克贝德元帅同志\n\n克贝德同志：\n你好。\n红军重建是一件极其艰难的事情。帝国主义者在外面虎视眈眈，国内的王公军阀又阳奉阴违。你接手的摊子很重。但在这几个月里，我看到你顶住了压力，你做得很扎实。作为一名从旧军队里走出来的元帅，你的军事素养和战略眼光，中央是非常认可的。红军正在重新成为一支真正属于无产阶级的武装力量，这其中包含了你极大的心血。\n但是，元帅，有些话我必须直说。革命不是毕其功于一役。我们打垮了旧帝国，建立了联盟，但我们在军事上的落后是客观存在的。在军改的推进中，不可避免会遇到来自旧军阀势力的软磨硬泡，也会有部分干部因为循规蹈矩而跟不上你的步伐。我知道你是个急性子，眼睛里揉不得沙子。但正如我们在政治工作中强调的那样，思想上的改造需要时间，军队的现代化更是如此。我们要有热情，更要有耐心。\n在这个过程中，无论是遇到军费预算被卡、装备补充跟不上，还是某些地方干部对红军建设指手画脚、阳奉阴违，你随时可以跟我说。不要因为觉得“自己能解决”就一个人硬扛，只要是阻碍红军重建的绊脚石，中央会帮你一起搬开。\n另外，我听马克南同志提起，你最近频繁奔波于亚的斯亚贝巴和各军区之间，作息很不规律。工作虽然要紧，但你也要顺便注意一下自己的身体，别把弦绷得太紧了。红军重建还有很长的路要走，接下来的硬仗，还需要你有一个清醒的头脑和好身体去指挥。\n保重。\n\n致以同志的问候。"
 YSS.51.a: "门格斯图"
 YSS.52.t: ""
 YSS.52.d: "致：利杰同志\n\n利杰同志：\n我已经看过了关于空天军编制和装备情况的报告。坦白说，在看到报告的那一刻，我是极其气愤的。今天写这封信，我只想就你对空军事务的漠不关心，严肃地跟你谈一谈。\n红军重建这段时间，你确实在陆军整顿上下了功夫，这点我不否认。但是，利杰同志，你似乎忘了一件极其根本的事情——联盟的天空，同样是你的防区。 我注意到，你把绝大部分精力都放在了步兵编制和装甲旅的重组上，却对空天军建设表现出令人费解的冷淡。那些关于航空燃油分配混乱、飞行员训练小时数严重不足、甚至连一架完整战机编队都拼凑不齐的报告，你究竟看过没有？\n我们是在什么样的环境下搞国防？圣杯王国的飞机随时可能掠过红海，帝国主义者正在不断刺探我们的领空。没有制空权，我们的步兵就算在陆地上打赢了，也随时会被敌人的轰炸机炸成废墟。你把空军当成“次要事务”，这种眼光是极其短视的，是对联盟国防体系的严重不负责任！\n我们的工业基础薄弱，财政预算极为有限，这我知道。我从来没有要求你像欧洲列强那样拥有一支庞大的战略空军。但是，资源不足和态度冷漠是完全不同的两码事。空天军的人民委员部不是没有努力，她们在简陋的厂房里搞出了简约式机体的航空尝试，可你这个空军元帅，又给了她们多少关注？给了她们多少实际支持？\n写这封信，不是为了单纯地训斥你，而是希望你明白，你肩负的是整个联盟的武装力量，不仅仅是地球上的那几条防线。我希望你今天回去之后，把手头的报表先放一放，关上门，对着镜子里的自己，认认真真地反省一下。反思你对空军的认识究竟偏到了哪里，反思你是否因为畏难情绪而选择性地忽视了蓝天。\n我期待在下一周，能看到一份由你亲自主持制定的、真正有执行力的空天军建设规划。不要给我找借口，我要看到行动。\n\n希望你好好反省。"
 YSS.52.a: "门格斯图"
 YSS.53.t: ""
 YSS.53.d: "致：利奥波德同志\n\n利奥波德：\n你好。\n你还记得吗？上个月我第三次去你家找你。那天亚的斯亚贝巴下了点小雨，我提着两罐茶叶，想着咱们好久没坐下来好好聊聊了。我脑子里攒了一堆关于新工业区扩建的想法，想听听你这个专家怎么说。结果你的警卫员站在门口，一脸为难地看着我，说你今天不太方便。我往门缝里瞅了一眼，客厅的灯亮着，但没人应声。我只好把茶叶留在门口，自己走回去了。\n这已经不是第一次了，利奥波德。前两次也差不多。第一次说是身体不适，第二次我敲了半天门，里面传来什么东西倒地的声音。说实话，我心里挺不是滋味的。我不是什么难缠的客人，我只是想和你坐下来，喝杯茶，聊聊工程上的事。结果每次都是我满怀期待地去，又灰溜溜地走回来。\n我听说你最近喝得很凶。我不知道是因为工程上的压力太大，还是有什么别的事在折磨你。如果是前者，你完全不必一个人扛着。如果是后者——利奥波德，你难道连老朋友都不愿意相信了吗？\n现在，我每次去找你，看到的都是紧闭的门，和门口那些空酒瓶。\n我不是在指责你。我知道每个人都有自己的难处。但作为朋友，我想说：你如果有什么过不去的坎，可以跟我说。哪怕只是坐下来，把心里的话倒一倒，也比你一个人对着酒瓶强。我或许帮不了你什么，但至少我能听你说说话，能陪你喝一杯茶——而不是让你一个人烂醉如泥。\n当然，如果你实在不愿意见人，我也不会强求。但我希望你知道，我不只是想找你谈工程，我也是真的关心你。\n下次你清醒的时候，给我回个信吧。哪怕就一句“我还好”，也行。\n\n你永远的朋友，"
 YSS.53.a: "门格斯图"
 YSS.54.t: ""
 YSS.54.d: "致：娜塔莎\n\n娜塔莎，我的爱人：\n最近还好吗？\n其实我知道你还好。昨天马克南同志路过城南，回来说看见你在妇女识字班给学生们上课，讲得很认真。我听了挺高兴的。你一直比我更懂得怎么和人相处，怎么把温暖带给别人。我总是板着脸，动不动就训人，连阿拉盖那样勤勤恳恳的同志都被我骂得抬不起头。你却能让那些不识字的妇女围坐在一起，笑着听你讲道理。这大概就是你的天赋吧。\n我这边……还是老样子。文件永远批不完，会议永远开不完，报告一份比一份厚。今天又有人跟我汇报，说某个军区的装备缺口比上个月还大。我拍桌子骂了人，骂完之后又觉得没意思。骂人解决不了问题，可如果不骂，某些同志就以为中央好糊弄。有时候我真觉得累。\n其实我写这封信也没什么大事。就是想问问你，今天中午吃了什么？胃还疼吗？最近天气转凉了，晚上记得盖厚一点。我知道你总是操心别人，却顾不上自己。我这边一切都好，你不用担心。忙归忙，身体还撑得住。就是偶尔会觉得，书房太大了，一个人坐着有些空。\n你看到这封信的时候，大概已经很晚了。早点睡吧。我这边也快批完了，批完就去躺一会儿。\n......\n好像也没什么要说的了。就是想和你说说话。写完了，心里舒坦了些。\n晚安，娜塔莎。\n\n永远爱你的，"
 YSS.54.a: "门格斯图"
 YSS.55.t: ""
 YSS.55.d: "致：森奈尔小姐\n\n森奈尔：\n你好。\n明天下午的日程，帮我全部推掉。那些会议能顺延的顺延，不能顺延的就让贝耶尼同志代为主持。如果有人问起，就说总书记身体不适，需要休息，闭门谢客。内务部那边我会亲自打招呼，你不用担心。\n不要问我去哪里，也不要安排警卫员跟随。我只需要一辆普通的车，不要任何标志，司机也找一个不爱说话的。对了，把我那件灰色的旧大衣准备好，就是平时不怎么穿的那件。太显眼的制服就不要带了。\n明天是马克南同志的生日。森奈尔，你大概也注意到了，那家伙最近忙得连轴转。中央调查委员会的工作堆积如山，她白天要跑军区，晚上要审报告，常常凌晨两三点钟还在办公室里。上周我让人给她送了几份文件过去，勤务员回来说，她桌上的咖啡杯已经连成了排。我问她最近睡得怎么样，她笑着说“还行”。还行？她眼睛里全是血丝。\n这个马克南，跟着我从1910年一路走到现在，二十多年了。当年在皇宫外面的巷子里，是她替我挡了一枪。后来搞文化教育大革命，她一个人跑到提格雷的穷乡僻壤去搞调研，回来的时候瘦了十几斤。我骂她不知道爱惜身体，她只是笑。现在倒好，职位越高，越不懂得照顾自己，连自己的生日都忘了。\n所以森奈尔，我要去给她庆生。不带警卫，不带随从，不搞什么隆重的仪式。我让厨房准备了一点点心——就一点点，你千万不要告诉别人是从中央厨房拿的——还有一瓶葡萄酒。我自己去，敲门，然后祝她生日快乐。就这样。\n有些同志，你跟她谈三年计划，她听得进去；你跟她谈思想作风，她也听得进去。可你跟她谈“你要照顾好自己”，她左耳进右耳出。对付这种人，只能用这种办法——直接出现在她面前，把蛋糕拍在她桌子上，告诉她：你给我吃。\n好了，就写到这里。明天我离开之后，这里的事就交给你了。如果有人来访，就说我在休息。如果有人非常紧急地找我，可以通过贝耶尼同志转达。你知道怎么做的。\n\n替我保密，森奈尔。"
 YSS.55.a: "门格斯图"
 YSS.56.t: ""
 YSS.56.d: "致：联盟国家主席 贝耶尔同志\n\n贝耶尔同志：\n你好。\n今天的政治局会议，气氛有些微妙。散会之后，我独自在办公室坐了很久。我注意到，当我在会上拍着桌子要求继续彻查那些贵族残余，并且坚决反对再做任何实质性妥协时，有几个同志的脸色很难看。他们虽然没有当面反驳，但那种沉默和眼神，我太熟悉了。\n贝耶尔，我知道，最近党内外对我颇有微词。那些被我撤换的地方干部在私下抱怨，那些被我动了奶酪的人在咬牙切齿，甚至一些老同志也觉得门格斯图太独断、太不近人情，把局面搞得太紧张了。他们说我像个暴君，说我不懂妥协的艺术，说我这样会把联盟推向深渊。\n他们说得没错。我确实树敌太多。但我从不在乎。\n我只是想对你说一句交底的话：我知道，我死后，有人会把一大堆垃圾扔到我的坟上，但历史的风会毫不留情地把这堆垃圾刮走。\n他们巴不得我早一天倒下。他们会在我的坟前倾倒所有的脏水，把我描绘成一个不折不扣的独裁者。但我根本不在乎。\n你是国家主席，你要面对那些外交上的斡旋和妥协，我知道你的难处，我也谢谢你一直替我分担这些明枪暗箭。但在这条道路上，我绝不退缩。历史的车轮必须由我们这些意志坚定的人来推动，哪怕是碾碎那些抱怨和指责。\n不用为我担心。那些抱怨声，不过是即将被大风刮走的灰尘罢了。\n\n愿你有一颗赤诚的心。"
 YSS.56.a: "门格斯图"
 YSS.57.t: ""
 YSS.57.d: "致：娜塔莎同志\n\n娜塔莎同志：\n昨天在中央调查委员会处理完最后一批积压的报告，已经是深夜了。离开办公室时，我路过恩托托山脚下，不知怎的，就想起了你。回到家后，我泡了杯热茶，坐在窗前，脑子里全是这二十年的光景，辗转反侧，于是提笔写下这封信。\n你前几天托人送来的茶，我收到了。谢谢你。我是个粗人，平时连轴转起来连饭都忘了吃，要不是你还惦记着我这老战友，我大概早就靠啃干面包度日了。对了，我还要坦白一件事，前几天门格斯图同志不知怎么搞到了我的新住址，提着一瓶葡萄酒和点心突然来敲我的门，说是给我庆生。我当时狼狈极了，桌上堆满了文件，连个下脚的地方都没有。她把我骂了一顿，逼着我吃了两块点心才走。我猜，这件事大概也瞒不过你。\n其实我心里一直萦绕着一个挥之不去的念头：原来在她领导的二十年中，她的祖国已经走过这么多路程了。\n当我偶然抬起头，翻开历史档案，把1910年的亚的斯亚贝巴和今天的景象放在一起时，我才猛然惊醒。二十年前，这里还是一个被封建枷锁捆绑的、连外交都无法自主的古老帝国。而今天，我们有了粗具规模的工业体系，有了自己的钢铁厂，有了一支正在重建的红军，甚至有了那条法理上的新宪法。我们推翻了老皇帝，赶走了外来的殖民者，把马克思主义的火种播撒在了尼罗河与红海之间。\n这一切，全都发生在她执政的这二十年里。而这一切，全都是她用无数个不眠之夜、无数次拍桌子的愤怒、甚至是透支生命换来的。\n娜塔莎，你是最了解她的人。我们这些在外冲锋陷阵的人，常常只看到她在会议上威严无比、在文件上批下最严厉措辞的样子。我现在才真正意识到，她那副永远挺直的脊梁背后，压着多么沉重的担子。她也会累，也会在深夜的办公室里孤独地坐着。\n所以，娜塔莎同志，我写这封信，既是一个老战友对你的倾诉，也是一份郑重的托付。你是她唯一的港湾。请一定要照顾好她，多陪她说说话，多劝她休息。告诉她，马克南虽然总是跟她唱反调，但马克南这条命，二十年前就是她护下来的，现在也一样，随时准备为她、为这个联盟去扛下任何脏活累活。\n愿联盟的明天如她所愿，也愿你和她一切安好。\n\n致以同志的敬意。"
 YSS.57.a: "马克南"
 YSS.58.t: ""
 YSS.58.d: "致：联盟国家主席 贝耶尼同志\n\n贝耶尼同志：\n你好。\n我不禁问自己：我们这一代人，拼尽全力甚至透支生命想要留下的，究竟是什么？\n他们只盯着眼前的权力与利益，却看不到我们所肩负的历史坐标。不论事态如何发展，一段时间之后，子孙后代的目光仍将关注着我们社会主义祖国的活动和胜利。后代人将举起自已先辈的旗帜，他们将按照自己过去的榜样来建设自己的未来。\n我们所做的一切，绝不仅仅是为了解决眼下的军阀割据或是财政危机，而是要为人类历史的洪流立下一块属于无产阶级的丰碑。阿克苏姆的黄金之都曾经辉煌过，那是靠着封建君主的剥削和奴隶的尸骨堆砌而成的辉煌。而今天，我们要在同样的土地上，建立起一个没有剥削、没有压迫的红色灯塔。无论我们的宪法经历了怎样的波折，无论我们的三年计划遭遇到怎样的阻力，只要我们把根基扎进工农群众之中，只要我们彻底清洗掉旧时代的污泥浊水，历史的天平就一定会倒向我们。\n我们要为后代树立一个无可挑剔的榜样，即使那条路布满荆棘，我们也必须硬着头皮走下去，绝不能回头。\n我们正在创造的历史，将是后人眼中最璀璨的黎明。\n\n愿你我都记住今天的誓言。"
 YSS.58.a: "门格斯图"
 YSS.59.t: ""
 YSS.59.d: "致：哈瓦里亚同志\n\n哈瓦里亚同志：\n你好。\n昨天深夜，我收到了你关于南部农业合作社推进受阻的报告。你在字里行间流露出的那种疲惫、困惑，甚至是一丝难以掩饰的灰心，我隔着纸面都能真切地感受到。\n你问，社会主义的蓝图究竟还要多久才能真正降临在这片古老的土地上？\n哈瓦里亚，你还年轻，你的革命热情就像亚的斯亚贝巴正午的太阳。但作为长辈，我今天必须向你坦诚地交底：我们也许不得不承认这样一个事实：有时理想与现实之间一定会存在着连续的巨大的沟壑。\n这沟壑，不是一两个人的软弱造成的，也不是一两场运动就能填平的。它是千年的封建残余、错综复杂的军阀网络、根深蒂固的官僚恶习，以及我们自身认知局限的叠加。我们试图用二十年的时间，去跨越别人用了几个世纪才走完的路，这怎么可能不流血、不摔跤？那种撕裂感是真实存在的。这种理想与现实的落差，有时真的能让人感到窒息。\n但也要知道，这样的沟壑是可以被跨越的。如果我们因为眼前的沟壑就停下脚步，甚至为了图省事而选择向旧势力妥协，那么先烈的鲜血就白流了，我们和那些骑着高头大马的旧军阀又有什么区别？\n哈瓦里亚，不要因为当下的泥泞，就对远方的星辰失去信心。你要记住，马克思主义从来不是写在纸上供人观赏的教条，它是我们用来劈开现实荆棘的利剑。理想与现实的落差，正是我们这些共产党人存在的意义——如果世界已经完美，我们还需要革命做什么？\n擦干眼泪，挺直腰杆。革命不是请客吃饭，跨越大沟壑注定是极其痛苦的，但也唯有跨越过去，我们才能迎来真正的黎明。\n去干活吧，哈瓦里亚同志。我在亚的斯亚贝巴，等着看你胜利的报告。\n\n致以同志的问候。"
 YSS.59.a: "门格斯图"

 YSS.60.t: "关于民族问题上的错误倾向"
 YSS.60.d: "致：中央组织局、各民族地区党委\n\n同志们：\n最近，我收到了来自厄立特里亚、阿法尔、索马里和南苏丹等地区的一系列报告。这些报告来自我们自己的地方党委，来自内务部特派员，也来自一些普通党员。这些材料摊在桌上，让一个令人不安的图景浮现出来了。我不想绕弯子，直接说：我们的一些党员干部，在民族问题上拉偏架。\n什么叫拉偏架？就是嘴上讲民族团结，实际办事的时候，屁股坐到了多数民族那一头。提格雷的干部到了阿法尔地区，就自觉不自觉地按提格雷人的规矩办事；阿姆哈拉的干部到了索马里地区，就嫌人家说话听不懂、礼拜太频繁、风俗太落后。更有甚者，个别地方党委在分配灌溉用水、审批贸易许可、处理部落纠纷时，公然偏袒多数民族一方，把少数民族群众的合理诉求压下去，还美其名曰‘维护大局稳定’。这不是大局稳定，这是把少数民族往敌人怀里推。\n同志们，我们联盟的国号里为什么保留‘阿克苏姆’四个字？因为我们不是某一个民族的政权。我们既不是阿姆哈拉的党，也不是提格雷的党，更不是索马里的党。我们是联盟的党，是全体劳动人民的党。少数民族的工人、农民、牧民，和多数民族的工人、农民、牧民，一样受旧帝国的压迫，一样在1914年支持过我们，一样在三年计划里流了汗。谁要是把民族成分当作亲疏远近的标准，谁就不是布尔什维克，谁就是旧帝国‘分而治之’那一套的继承人。\n值得注意的是，有人用多数压迫少数的同时，有些干部为自己民族撑腰，以为这是‘爱族’，其实是‘害族’。在地方上偏袒本族，别的民族就记恨你的族。今天你用水优先，明天他交粮拖延，后天边境上就有人给外国势力递消息。民族矛盾一旦被点燃，第一个烧死的就是那些自以为得意的‘撑腰者’。中央绝不允许任何干部用民族身份给自己划地盘、拉山头。\n因此，中央决定：第一，各民族地区的主要负责人，实行民族回避制度。阿法尔地区的党委书记，不得由阿法尔族干部担任；索马里地区的行政首长，不得由索马里族干部担任。这不是不信任少数民族干部，恰恰是为了让他们在更广阔的岗位上施展才干，同时避免陷入本地民族纠纷。第二，凡查实有偏袒本族、压制他族行为的干部，不论功劳多大、资格多老，一律先调查，再撤职。第三，各地方党委近期要召开一次民族工作专题会议，把本地区存在的民族歧视、民族偏袒问题摆到桌面上，不许和稀泥。\n民族问题是联盟的命门。谁在这里拉偏架，谁就是在挖联盟的墙脚。\n\n致以同志的问候。"

 YSS.60.a: "门格斯图"

 YSS.61.t: “关于从城市看农村的错误思想”
 YSS.61.d: "致：中央宣传部、农业人民委员部、各级党校\n\n同志们：\n我们党的干部队伍，有一个天生的毛病，我今天要把它指出。那就是，绝大多数干部是在城市里长大的，是在亚的斯亚贝巴、哈尔格萨、摩加迪沙这些地方读的书、入的党、当的干部。他们对城市的马路、工厂、学校、报馆很熟悉，对农村的田埂、水井、牲口棚、部落议事会却一无所知。无知不要紧，可以学。要命的是，无知还要装懂，装懂还要下命令。\n最近我看了几份地方工作报告，这些报告暴露了我们党在这方面的弊病。有一份报告说，某县的农民‘思想落后，不愿意加入集体农庄，需要加强宣传教育’。我让内务部去查，查回来什么？那个县的农民不是不愿意入社，是入社之后连种子粮都被公家收走了，来年吃什么都不知道，你让他们怎么积极？还有一份报告说，某地的牧民‘抗拒国家征购，觉悟低下’。再一查，征购价定得比集市价低了一半，牧民卖一头羊的钱，买不回一双靴子。这种事，坐在办公室里是看不见的，坐在城市里是想不到的。\n同志们，你们要懂一个道理：城市人吃的每一口粮，是农民种的；工厂里纺的每一寸棉，是农民摘的；红军战士穿的每一件军装，是农民养的羊、种的麻换来的。你们在城市里开会、写报告、念数字的时候，有没有想过，这些东西的背后要多少人的心血去填补？你们嫌农民‘落后’，可你们自己连一头牛怎么喂、一亩地怎么犁、一场旱灾怎么熬，都说不清楚。谁给你们资格，去指责农民落后？\n更危险的是，这种‘从城市看农村’的毛病，正在影响我们的政策。有些干部主张，为了加快工业化，农村就应该多交粮、多出人、多流汗，城市先富起来再说。这是一种‘剥夺农民’的论调，不是我们联盟的路线。我们搞工业化，是为了让全体人民过上好日子，不是为了让城市骑在农村头上。如果工业化的代价是农民饿肚子，那这个工业化就是失败的，就是反革命的。\n我要求：第一，各级党校从下一期起，所有城市出身的干部学员，必须到农村学习至少三个月，和农民同吃同住同劳动，回来写一份调查报告，写不出真实情况的，不予毕业。第二，中央宣传部要组织一批记者、作家、画家，长期驻在农业地区，写出真正反映农村生活的报告、作品，不要总是坐在城市里去幻想所谓的‘田园牧歌’。第三，各人民委员部在制定涉及农村的政策时，必须征求农业人民委员部和当地苏维埃的意见，不准几个城市干部关起门来自己做主。\n农民不是我们的负担，农民是我们的根。谁忘了这一点，谁就不配当联盟的干部。\n\n致以同志的问候。"
 YSS.61.a: "门格斯图"