 YSS_1_3: "一团乱麻的宗教信仰"
 YSS_1_4: "世俗化的宗教信仰"
 YSS_2: "联盟红军"
 YSS_2_desc: "国家红军是一支保卫人民的军队，她们对党忠诚，时刻准备着为了联盟抛头颅洒热血。"
 YSS_3: "联盟海军"
 YSS_3_desc: "索马里和东非之角的海洋将由联盟掌控。虽然海军仍处于起步阶段，但联盟的理想是建立一支东可以出击印度洋，北可以掌控尼罗河的强大海军。"
 YSS_4: "联盟空军"
 YSS_4_desc: "非洲的旷阔天空，只有雄鹰翱翔了一千年。联盟的设想是建立一支独立自主的空军，就算不能够匹敌西方，也至少要保家卫国，现今随着第三战场理论的开辟，空军需要被提上日程。"
 YSS_5: "小农经济主导"
 YSS_5_desc: "阿克苏姆本质还是那个阿克苏姆——沉寂了千年的黑非洲农业社会。共和国留下的那点工厂重新开了起来，可土地还攥在王公与富农手里，小农经济为主导的劣势依旧没有改变。"
 YSS_6: "经济封锁"
 YSS_6_desc: "作为所有帝国主义者都不希望看到的国家，我们面临着多个国家组成的联合经济封锁网。"
 YSS_7: "中央政治局"
 YSS_7_desc: "中央政治局是我国的最高决策机构，党代表大会闭会期间，一切大事由它拍板。从1910年政变时的几十个人，到现在遍布全国的党组织，这个东非的革命之脑的一举一动，都影响着阿克苏姆的千万人。无论有人称赞或是讽刺，有一点是肯定的：想轻易摧毁它，并非易事。"
 YSS_8: "经济统筹委员会"
 YSS_8_desc: "经委会是为统筹全国经济而设立的。党代会一直认定，高度集中的计划经济可以快速推动工业发展——前提是先凑齐实行计划经济的条件：一份可信的统计、一批能读懂图纸的工程师，还有足够的粮食。"
 YSS_9: "不纯洁的党组织"
 YSS_9_desc: "§R我讨厌她们。§!\n\n为了快速实现革命，我们党没有采取任何激进的清洗措施，很多旧王公为了在新政权保持原有地位，也加入了我们党，除了她们胸前曾经的狮子徽章变成了镰刀锤子，并没有什么不同。而许多新加入的党员，其身份背景也有待商酌......"
 YSS_10: "严峻的国际局势"
 YSS_10_desc: "阿克苏姆作为新兴的社会主义国家，被数个殖民总督区团团包围，红军必须时刻警戒，以应对一切可能的西方国家对我国主权的无理侵犯。"
 YSS_11: "提供给她国的资金"
