#国家精神
 YSS_1: "一团乱麻的宗教信仰"
 YSS_1_desc: "社会主义？逊尼派？阿克苏姆教义？基督教？没人说的上来联盟到底信仰什么，古老且分裂的国家兴许自己都不知道自己应该用什么来凝聚起人民。"
 YSS_1_0: "一团乱麻的宗教信仰"
 YSS_1_1: "一团乱麻的宗教信仰"
 YSS_1_2: "一团乱麻的宗教信仰"
 YSS_1_3: "一团乱麻的宗教信仰"
 YSS_1_4: "世俗化的宗教信仰"
 YSS_2: "联盟红军"
 YSS_2_desc: "国家红军是一支保卫人民的军队，来自各地各省选出的优秀子弟，他们对党忠诚，时刻准备着为了联盟抛头颅洒热血。"
 YSS_3: "联盟海军"
 YSS_3_desc: "索马里和东非之角的海洋将由联盟掌控。虽然海军仍处于起步阶段，但联盟的理想是建立一支东可以出击印度洋，北可以掌控尼罗河的强大海军。"
 YSS_4: "联盟空军"
 YSS_4_desc: "非洲的旷阔天空，只有雄鹰翱翔了一千年。联盟的设想是建立一支独立自主的空军，就算不能够匹敌西方，也至少要保家卫国，现今随着第三战场理论的开辟，空军需要被提上日程。"
 YSS_5: "小农经济主导"
 YSS_5_desc: "阿克苏姆本质还是那个阿克苏姆—沉寂了千年的黑非洲农业社会。即使工业化连续进行了六年，但由于地方红色王公的控制，小农经济为主导的劣势依旧没有改变。"
 YSS_6: "过于开放的外贸"
 YSS_6_desc: "由于我们的工业体系过于落后，我们不得不向发达国家卖出原料，换取工业品。虽然名义上我们是一个主权国家，但在国际资源分配，世界市场上都处于明显的被动局面。"
 YSS_7: "中央政治局"
 YSS_7_desc: "最高苏维埃是我国的决策机构，从几个小兵到现在庞大的党组织，泛非苏维埃的一举一动，都影响着阿克苏姆的千万人。无论有人称赞或是讽刺，有一点是肯定的，想轻易摧毁这个东非的革命之脑，并非易事。"
 YSS_8: "经济统筹委员会"
 YSS_8_desc: "经委会，为了统筹全国经济而成立，新党代会一直认定，高度集中的计划经济可以快速促进工业发展——当然，首先是有实行计划经济的条件。但目前来看，这个所谓的经委会和旧贵族的提款机似乎没什么两样。"
 YSS_9: "不纯洁的党组织"
 YSS_9_desc: "§R我讨厌他们。§!\n\n为了快速实现革命，我们党没有采取任何激进的清洗措施，很多旧王公为了在新政权保持原有地位，也加入了非联共，除了他们胸前曾经的狮子徽章变成了镰刀锤子，并没有什么不同。而许多新加入的党员，其身份背景也有待商酌......"
 YSS_10: "严峻的国际局势"
 YSS_10_desc: "阿克苏姆作为新兴的苏维埃国家，被数个殖民总督区团团包围，红军必须时刻警戒，以应对一切可能的西方国家对我国主权的无理侵犯。"
