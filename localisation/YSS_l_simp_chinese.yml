 YSS_faction_panel_banner_desc: "如果说§Y第一次大革命§!是针对旧势力的特权，那么§Y第二次大革命§!则是针对旧势力的根基。只要土地仍掌握在贵族手里，联盟的§Y社会主义改造§!便无从说起。大清洗期间，§Y中央§!将开始§G逐步收回土地§!，而§Y地方王公§!则会尽一切力量来阻挠政府的措施。一旦选择终止调查，将§R无法再进行任何改革，你只能被动的接受后果，而无法做出任何措施§!。§O革命烈度§!表示了人民对大革命的§G支持§!程度，§O革命烈度§!越高，人民对大革命的§G支持§!就越强烈，反之则会出现更多的反对声音。§O革命烈度§!过低将会导致大革命失败，而§O革命烈度§!过高将会导致中央会愈发掌控不住局势，扣除巨量稳定度，而这将导致国家解体。"
