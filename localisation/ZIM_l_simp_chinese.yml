 ZIM_route_guide_desc: "一、罗德西亚自治领地路线指南\n\n§R罗德西亚内容正在修订与更新中，目前游玩可能出现缺少文案、图标或者设定冲突的情况，如有问题请在评论区反馈§!\n\n一.§Y内战前夕§!：\n伊菲尔总督心事重重，将1月1日的新年演讲一拖再拖，在确认国内状况无虞后，总督会进行原有流程。\n\n二.§Y总督遇刺§!：\n-在§Y刺杀§!事件后，持续推进后续国策，直到老总督咽下最后一口气。\n\n\n三 .§Y老大万岁-一心会§!：\n在总督咽气后，于事件“§Y崩溃§!”中选择§G以老大的名义！§!选项\n\n四.§R未完成§!-§Y孤举赤旗-津巴布韦尔社会共和国§!：\n在总督咽气后，于事件“§Y崩溃§!”中选择§R以人民的名义！§!选项\n\n五.§Y离乡甚远-圣杯联邦§!：\n在总督咽气后，于事件“§Y崩溃§!”中选择§C以陛下的名义！§!选项\n\n\n\n还有一条§C彩§!§0蛋§!§O路§!§G线§!，请自行探索。"
