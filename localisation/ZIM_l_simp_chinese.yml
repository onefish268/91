 ZSB_win_ZHJ: "在§Y罗德西亚的命运之战§!中，\n@ZSB§C圣杯联邦§!击败了@ZHJ§7皇家勘采公司§!\n\n\n§7金钱买得到枪，买不到扣扳机的手。§!"
 ZSB_win_ZSH: "在§Y罗德西亚的命运之战§!中，\n@ZSB§C圣杯联邦§!击败了@ZSH§R津巴布韦尔社会主义共和国§!\n\n\n§R他们承诺的丰饶，止于谷仓外第一个冬天。§!"
 ZSB_win_ZYX: "在§Y罗德西亚的命运之战§!中，\n@ZSB§C圣杯联邦§!击败了@ZYX§Y一心会§!\n\n\n§Y罗德西亚需要一名恺撒——但领袖既不是恺撒，罗德西亚也不是罗马。§!"
#人物介绍
 yifeier_DESC: "这就是留给伊菲尔·德拉蒙德的结局。\n\n很多人都认为她是罗德西亚的恩人，事实似乎也是如此。罗德西亚的新一代人仅仅在他们出生到成年的这段时间，就经历了罗德西亚从一个荒芜之地变为了一个任何非洲国家都羡慕的繁荣的地方的过程。所有人都对她赞誉有加，觉得她是圣杯王国建国以来最有能力的总督。\n\n但这一切都建立在原住民的血泪上。兽人在泥泞的土地中蹒跚前行，而白人则坐着高雅的马车从旁边疾驰而过。反抗的火种从未消灭，而在圣杯王国经历了一次经济危机后，伊菲尔·德拉蒙德已经没有精力去关注这些微小的细节。\n\n这位总督仍旧沉醉于自己的伟大壮举中。"



