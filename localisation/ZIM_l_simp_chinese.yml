 Adorable_heart_city_story_title_Salisbury: "非洲的铁心脏--索尔兹伯里"
 Adorable_heart_city_story_desc_Salisbury: "“如果你想去罗德西亚看看，那你一定要来索尔兹伯里。”\n索尔兹伯里，罗德西亚自治领的首府，坐落在非洲南部广阔的高原上，海拔约一千五百米。这座城市以英国首相索尔兹伯里侯爵命名，始建于十九世纪末，殖民者沿着一条由北向南延伸的铁路线，在哈拉雷人世代居住的土地上划出方格街区和市政用地。到1936年，它已经从一个尘土飞扬的筑路营地，长成一座拥有数万人口的殖民都会。\n城市的建筑风格呈现出一种移民社会特有的杂糅。市中心的商业街区矗立着维多利亚式砖楼、爱德华时代的拱廊和少数几座受过装饰艺术风格影响的现代混凝土建筑，外墙刷着白色或浅米色的灰泥，铁艺阳台和百叶窗交替排列。火车站是索尔兹伯里的标志性建筑之一，红砖拱顶配以铸铁花饰，站前广场上终日人来人往，穿灰色西装的商人、戴软木遮阳帽的行政官员、头顶行李的 兽人搬运工和身着旧军装的退伍老兵在此交汇，构成一幅混杂而有序的殖民地生活图景。\n这座高原城市坐落在罗德西亚的心脏地带，四通八达的公路和铁路使它成为各方势力暗中角力的棋盘。那些宽阔的林荫道和整齐的花园洋房之下，暗流已开始涌动——也许从某条街巷深处会传来一声枪响，也许某个早晨市政厅的旗杆上会升起一面陌生的旗帜。但在1936年的这个时间点上，索尔兹伯里依然是那座骄傲的、整洁的、不肯低头的殖民都会，蓝花楹的树冠在风中轻轻摇晃，绿树成荫的街道等待着下一个翻开历史新篇章的人。\n§C索尔兹伯里在观望。§!"
 Adorable_heart_city_story_title_Lusaka: "铜都--卢萨卡"
 Adorable_heart_city_story_desc_ZIM_Lusaka: "卢萨卡在罗德西亚自治领治下，是这片广袤殖民地腹地上一座不起眼但根基坚实的中枢城市。它位于罗德西亚中部高原的南缘，海拔约一千三百米，气候温和，旱季天高云淡，雨季偶有骤雨洗刷红土街道。与首府索尔兹伯里相比，卢萨卡的规模小得多，行政级别也低一级，但因地处通往加丹加矿区的必经之路上，又恰是南北铁路与东西商道的交汇点，它的存在感远非地图上的一个小圆圈所能概括。\n市区的主干道称作国王大道，从火车站一路向北延伸约一公里，直抵总督府所在地的行政山丘。路面是压实的碎石，两侧人行道铺着水泥方砖，行道树以蓝花楹为主，每年花期将整条街道笼罩在蓝紫色的云雾中。沿途的建筑以殖民政府风格为主，多为单层或双层的灰砖楼房，屋顶铺设红瓦，门廊和窗框涂成白色。市政厅设在国王大道中段，是一栋带有钟楼的两层建筑，外墙新近粉刷过，草坪前的旗杆上日间悬挂着自治领旗帜。街对面是邮政局和一间小型图书馆，图书馆的藏书量有限，但当地的白人居民仍引以为傲——毕竟在南罗德西亚的城镇中，拥有阅览室的城市屈指可数。\n自治领时期的卢萨卡是一座平静到近乎乏味的城镇。殖民体系在这里运转得像一台老旧的座钟，指针缓慢而恒定地向前移动，总督每年照例发表新年致辞，市政预算按照惯例审核通过，矿区的产量报告准时递交至索尔兹伯里。种族隔离与行政架构的等级分明是这座城市的根基，白人官员居住在山丘上的荫凉之处，原住民工人在西边的洼地中劳作，双方鲜少交集，互不打扰。偶尔有欧洲来的旅行者途经此地，在俱乐部的留言簿上写下“偏远而整洁的小城”之类的评语，然后搭上下一班火车继续南下。\n§C它似乎会一直平静下去。§!"
 Adorable_heart_city_story_desc_ZSB_Lusaka: "卢萨卡在罗德西亚自治领治下，是这片广袤殖民地腹地上一座不起眼但根基坚实的中枢城市。它位于罗德西亚中部高原的南缘，海拔约一千三百米，气候温和，旱季天高云淡，雨季偶有骤雨洗刷红土街道。与首府索尔兹伯里相比，卢萨卡的规模小得多，行政级别也低一级，但因地处通往加丹加矿区的必经之路上，又恰是南北铁路与东西商道的交汇点，它的存在感远非地图上的一个小圆圈所能概括。\n市区的主干道称作国王大道，从火车站一路向北延伸约一公里，直抵总督府所在地的行政山丘。路面是压实的碎石，两侧人行道铺着水泥方砖，行道树以蓝花楹为主，每年花期将整条街道笼罩在蓝紫色的云雾中。沿途的建筑以殖民政府风格为主，多为单层或双层的灰砖楼房，屋顶铺设红瓦，门廊和窗框涂成白色。市政厅设在国王大道中段，是一栋带有钟楼的两层建筑，外墙新近粉刷过，草坪前的旗杆上日间悬挂着自治领旗帜。街对面是邮政局和一间小型图书馆，图书馆的藏书量有限，但当地的白人居民仍引以为傲——毕竟在南罗德西亚的城镇中，拥有阅览室的城市屈指可数。\n在斯坦利伯爵来到这里后，这里变了不少。国王大道发生了最直观的变化。从前为总督和官员保留的行政办公区向原住民敞开了门——市政厅大楼的底层开设了一间市民接待室，专门受理原住民递交的请愿和申诉，门口的长凳上常常坐着从西区赶来的老人，裹着褪色的格子布披肩，安静地等待叫号。图书馆门前的草坪上立起了一块公告栏，上面贴着议会会议的摘要公告，日期、议程和表决结果用打字机清晰誊写，旁边歪歪扭扭地加了一行手写的注脚：“下周一上午九时，议会厅设原住民代表咨询时段，欢迎列席旁听。”\n市长府——如今挂着“联邦行政办公室”的铜牌——是整座城市最忙碌的建筑。那扇曾被铁链锁住的侧门如今日夜敞开着，穿西装和穿工装的官员交替进出，台阶上的石板被来回走动的脚步磨得发亮。办公楼的走廊里增加了不少新面孔，有年轻的白人文员端着文件来回小跑，也有一位穿粗布裙的 兽人女工每天清晨准时来打扫办公室，她擦桌子的动作很慢，但每张桌角都擦得干干净净。一楼的大厅里多了一张长桌，桌上摊开着一册厚厚的登记簿，前来拜访的公民或团体代表需在上面留下姓名和来意。\n或许这座小城没什么大不了的，即便如此，卢萨卡的确是变了。那种改变不剧烈，像缓慢浸润土壤的雨水，它藏在杂货店门口新挂起的一排制服布料中，藏在图书馆里围在一起翻阅印刷品的少年们的窃窃私语里，藏在那间从不停歇的联邦行政办公室里彻夜不灭的灯光里。这座曾经乏善可陈的高原小城正在笨拙、混乱、嘈杂地重新学习如何运转——以圣杯联邦的名义。\n§C阳光从未如此清晰的照在它的脸庞。§!"
 ZIM_Local_History_Page_01: "在圣杯王国的“大人物们”踏上这片土地之前，罗德西亚这个名字并不存在。由当地兽族——恩德贝莱人与绍纳人——建立的大小国家交错分布，将这片高原分割成数以百计的有名之地。\n\n恩德贝莱人占据着西部和南部的草原地带，以游牧和突袭为生，骁勇善战，崇尚武力。他们在领袖的号令下结为松散的军事联盟，领地随着牛群和战争不断迁移，没有固定的边界线，只有不断变化的势力范围。他们的村落以圆形茅屋排列成环，中央是酋长的议事棚，篝火彻夜不熄，战鼓声能在草原上传出数里之遥。\n\n绍纳人则聚居在东部和北部的高地，以农耕和贸易为根基，建立起更为稳固的城邦和王国。他们在山谷间开垦梯田，种植黍类和豆科作物，用石墙围筑村落，沿着贸易路线修筑了星罗棋布的定居点。绍纳人的工匠善于冶铁和制陶，他们的铜器和铁器沿着古老的商路向北流通至内陆，向南抵达海岸。他们的社会结构比恩德贝莱人更为复杂，拥有世袭的祭司阶层、专职的贸易中介和负责外交的使节，各城邦之间维持着松散的盟约关系，偶有战争，但更常见的是联姻与贸易。\n\n这两大兽族之间既有冲突也有交换。草原上的恩德贝莱人偶尔会劫掠绍纳人的农田和集市，而绍纳人则用铁器与铜矿向恩德贝莱人换取皮革和牲畜。他们的语言不同、信仰各异、社会组织方式天差地别，但在长达数百年的时间里，他们共同构建了一套无需地图和国界的区域秩序。领土是模糊的，忠诚是流动的，一条河流的上游归某人管辖，而河水的下游则属于另一个人的领地——没有人觉得这有什么问题。\n\n1890年，第一批圣杯王国的殖民者以“勘探与商路开拓”的名义抵达这片高原。他们顺着绍纳人走了几百年的古老商路深入内陆，在绍纳人的贸易站遗址上搭起了自己的帐篷，在恩德贝莱人的放牧地边缘划下了第一道测量线。\n\n他们用笔在纸上画出直线，在地图上标记地标名称，将那些从未有过固定名称的草原、河谷与丘陵，称为“罗德西亚”——以圣杯王国的一位首相的名字命名。\n\n那一年，一位殖民队长在一条不知名的河流上游，将一面绣有金徽的旗帜插入红土之中。他身后站着测绘员和武装护卫，河流对岸的草丛里，有恩德贝莱人的斥候安静地注视着他们。旗帜在风中展开。没有人知道这片土地的旧名字是什么。圣杯的官员们也不打算问。"
 ZIM_Local_History_Page_02: "1900年，圣杯王国的最后一场清剿战役在北部高地结束。\n\n恩德贝莱人的最后一支抵抗力量被围困在一片开阔的河谷中，弹尽粮绝后被迫投降。绍纳人的城邦则更早地失去了抵抗意志——他们的石墙挡不住火炮，祭司的预言无法让子弹转弯。战争结束时，两个兽族的大部分酋长要么死于战场，要么被流放至沿海地区的集中营，剩下的寥寥数人签署了“臣服协议”，同意交出治权和土地。\n殖民者们用了十年时间，将这处地区打造成一个整齐有序的行政单元。他们沿绍纳人的古老商路修建铁路，在恩德贝莱人的放牧地上划分农场，按图纸布局规划城镇网格。测绘员们带着皮尺和经纬仪走遍了这片高原，将那些只有口头流传的地名逐一抹去，替换为测绘册上的编号和字母。一个村庄在官方的文件里不再叫“伊萨纳”，而是变成了“编号113号定居点”。一条河流不再叫“水源之河”，而是被标注为“支流C-7”。\n\n为了方便管理，殖民者将这片原本由上百个无边界领地构成的地区统称为“罗德西亚地区”，并将这一名称延伸至整个中南非地区的行政版图。他们在每一份公文、每一张地图、每一块路牌上都反复印刷这个名字，以铁规和墨水的方式反复敲打。殖民政府设立了土著事务局，在每一个定居点派驻白人专员，负责征收劳役税、分配劳动名额和执行通行证制度。原住民的工作时间、居住地点和迁徙范围全部被写进白纸黑字的规章里，违规者将面临监禁、罚款或肉体惩罚。\n\n起初，恩德贝莱人和绍纳人对“罗德西亚”这个称呼感到陌生，甚至觉得荒唐。他们的曾祖父没有在这个名字下生活过，他们的土地也不应该由一个远在伦敦办公室里的官员随意命名。但随着时间的流逝，新的一代成长起来。他们在殖民者的学校里学会了读写英语，在矿区里听到了来自不同部落的同一种语言，在铁路工地上与曾经互为仇敌的邻族并肩劳作。他们开始用“罗德西亚人”来指代自己，尽管说出口时仍带着一丝犹豫——像在试穿一件不太合身的旧外套。\n\n1914年，第一次伟大战争爆发。罗德西亚的矿工、农场佃户和城市工人被征召入伍，组成罗德西亚步兵团，被送往东非战场。出发前夜，一群被征召的绍纳青年围坐在营地篝火旁，用各自的语言聊着天，忽然有人问了一句：“我们都是罗德西亚人，对吧？”沉默了一会儿，另一个人说：“我们是罗德西亚人。至少现在是。”没有人反驳。战争结束后，帝国为表彰罗德西亚的贡献，正式授予其“自治领”地位。新旗帜在总督府楼顶升起的那一刻，索尔兹伯里的殖民官员们站在露台上鼓掌，欢呼声顺着台阶流下。几个原住民劳工被安排在广场外围打扫卫生，他们抬头看了一眼那面陌生的旗帜，然后低头继续扫地。\n\n名字就这样定了下来。"
 ZIM_Local_History_Page_03: "1918年，战争结束的钟声敲响，罗德西亚自治领进入了它最辉煌的时代。\n\n新成立的自治政府将首府设在索尔兹伯里，在总督府上空升起新旗，并以一份慷慨的预算案开启了大规模城市建设的序幕。来自圣杯本土和南非的资本涌入这片高原，矿业公司在加丹加和中部矿区铺设新的铁路支线，农场主在东部平原上购置更多的土地，城市扩张的蓝图被一笔一笔画在了纸上。\n\n伊菲尔总督在这一过程中扮演了总设计师的角色。她熟悉预算表的每一个数字，曾在深夜独自计算过三年内自治领财政收支的全部走向，并将此结论写进了一份仅有五页的规划书中。自治领在短短十八年内实现了GDP总量增长近四十倍的奇迹，城市的版图扩张了数倍，索尔兹伯里的商业区兴建了新的银行和百货商店，卢萨卡的车站广场周围涌现出成排的砖楼，就连曾经只有土屋和铁皮棚的小镇也陆续铺设了自来水管和柏油路面。罗德西亚的农牧产品和矿产品出口额连续数年位居圣杯属非洲殖民地首位，被殖民办公室的年度报告誉为“发展最快的自治领”。\n\n支撑这座奇迹的根基，是伊菲尔精心维护的种族等级制度。兽族原住民被排除在大多数统计指标之外，他们在法律上被视为“劳动力资源”，而非“国民”。矿区的兽族工人在没有通风设施的坑道中日均作业十二小时，东部的农业区严格执行着定期的劳役制度，每一个适龄的兽族男性都必须每年为殖民政府提供一段时间的无偿劳动。他们被编入劳工登记册，被列入役畜序列号，被计算在“矿场工人死亡预估”和“铁路建设损耗率”之中——但这些数字从未出现在任何一份年度报告里。\n\n伊菲尔从未公开谈论过这套制度的道德含义。她以沉默回应一切质询，就像她在谈判桌上惯用的方式一样。她的注意力只放在如何让这套制度更高效地运转上，因为她比谁都清楚，一切繁荣都需要代价，而罗德西亚的代价并没有记录在任何一份账本中。"
