 #国家介绍#
  ZIM_GATHERING_STORM_DESC:0"罗德西亚自治领，是坐落于非洲中南部的英式自治领国家，依托广袤的内陆腹地、富集的矿产资源与稳固的殖民自治体系存续发展。但她真的稳固吗？"
  ZIM_neutrality_party:0 "罗德西亚总督府"
  ZIM_democratic_party:0 "民主进步党"
  ZIM_fascism_party:0 "一心会"
  ZIM_communism_party:0 "工农共产党"
  ZYXTY:0 "罗德西亚社会共和国"
  Adorable_heart_city_story_title_Salisbury:0 "非洲的铁心脏--索尔兹伯里"
  Adorable_heart_city_story_desc_Salisbury:0 "“如果你想去罗德西亚看看，那你一定要来索尔兹伯里。”\n索尔兹伯里，罗德西亚自治领的首府，坐落在非洲南部广阔的高原上，海拔约一千五百米。这座城市以英国首相索尔兹伯里侯爵命名，始建于十九世纪末，殖民者沿着一条由北向南延伸的铁路线，在哈拉雷人世代居住的土地上划出方格街区和市政用地。到1936年，它已经从一个尘土飞扬的筑路营地，长成一座拥有数万人口的殖民都会。\n城市的建筑风格呈现出一种移民社会特有的杂糅。市中心的商业街区矗立着维多利亚式砖楼、爱德华时代的拱廊和少数几座受过装饰艺术风格影响的现代混凝土建筑，外墙刷着白色或浅米色的灰泥，铁艺阳台和百叶窗交替排列。火车站是索尔兹伯里的标志性建筑之一，红砖拱顶配以铸铁花饰，站前广场上终日人来人往，穿灰色西装的商人、戴软木遮阳帽的行政官员、头顶行李的 兽人搬运工和身着旧军装的退伍老兵在此交汇，构成一幅混杂而有序的殖民地生活图景。\n这座高原城市坐落在罗德西亚的心脏地带，四通八达的公路和铁路使它成为各方势力暗中角力的棋盘。那些宽阔的林荫道和整齐的花园洋房之下，暗流已开始涌动——也许从某条街巷深处会传来一声枪响，也许某个早晨市政厅的旗杆上会升起一面陌生的旗帜。但在1936年的这个时间点上，索尔兹伯里依然是那座骄傲的、整洁的、不肯低头的殖民都会，蓝花楹的树冠在风中轻轻摇晃，绿树成荫的街道等待着下一个翻开历史新篇章的人。\n§C索尔兹伯里在观望。§!"
  Adorable_heart_city_story_title_Lusaka:0 "铜都--卢萨卡"
  Adorable_heart_city_story_desc_ZIM_Lusaka:0 "卢萨卡在罗德西亚自治领治下，是这片广袤殖民地腹地上一座不起眼但根基坚实的中枢城市。它位于罗德西亚中部高原的南缘，海拔约一千三百米，气候温和，旱季天高云淡，雨季偶有骤雨洗刷红土街道。与首府索尔兹伯里相比，卢萨卡的规模小得多，行政级别也低一级，但因地处通往加丹加矿区的必经之路上，又恰是南北铁路与东西商道的交汇点，它的存在感远非地图上的一个小圆圈所能概括。\n市区的主干道称作国王大道，从火车站一路向北延伸约一公里，直抵总督府所在地的行政山丘。路面是压实的碎石，两侧人行道铺着水泥方砖，行道树以蓝花楹为主，每年花期将整条街道笼罩在蓝紫色的云雾中。沿途的建筑以殖民政府风格为主，多为单层或双层的灰砖楼房，屋顶铺设红瓦，门廊和窗框涂成白色。市政厅设在国王大道中段，是一栋带有钟楼的两层建筑，外墙新近粉刷过，草坪前的旗杆上日间悬挂着自治领旗帜。街对面是邮政局和一间小型图书馆，图书馆的藏书量有限，但当地的白人居民仍引以为傲——毕竟在南罗德西亚的城镇中，拥有阅览室的城市屈指可数。\n自治领时期的卢萨卡是一座平静到近乎乏味的城镇。殖民体系在这里运转得像一台老旧的座钟，指针缓慢而恒定地向前移动，总督每年照例发表新年致辞，市政预算按照惯例审核通过，矿区的产量报告准时递交至索尔兹伯里。种族隔离与行政架构的等级分明是这座城市的根基，白人官员居住在山丘上的荫凉之处，原住民工人在西边的洼地中劳作，双方鲜少交集，互不打扰。偶尔有欧洲来的旅行者途经此地，在俱乐部的留言簿上写下“偏远而整洁的小城”之类的评语，然后搭上下一班火车继续南下。\n§C它似乎会一直平静下去。§!"
  Adorable_heart_city_story_desc_ZSB_Lusaka:0 "卢萨卡在罗德西亚自治领治下，是这片广袤殖民地腹地上一座不起眼但根基坚实的中枢城市。它位于罗德西亚中部高原的南缘，海拔约一千三百米，气候温和，旱季天高云淡，雨季偶有骤雨洗刷红土街道。与首府索尔兹伯里相比，卢萨卡的规模小得多，行政级别也低一级，但因地处通往加丹加矿区的必经之路上，又恰是南北铁路与东西商道的交汇点，它的存在感远非地图上的一个小圆圈所能概括。\n市区的主干道称作国王大道，从火车站一路向北延伸约一公里，直抵总督府所在地的行政山丘。路面是压实的碎石，两侧人行道铺着水泥方砖，行道树以蓝花楹为主，每年花期将整条街道笼罩在蓝紫色的云雾中。沿途的建筑以殖民政府风格为主，多为单层或双层的灰砖楼房，屋顶铺设红瓦，门廊和窗框涂成白色。市政厅设在国王大道中段，是一栋带有钟楼的两层建筑，外墙新近粉刷过，草坪前的旗杆上日间悬挂着自治领旗帜。街对面是邮政局和一间小型图书馆，图书馆的藏书量有限，但当地的白人居民仍引以为傲——毕竟在南罗德西亚的城镇中，拥有阅览室的城市屈指可数。\n在斯坦利伯爵来到这里后，这里变了不少。国王大道发生了最直观的变化。从前为总督和官员保留的行政办公区向原住民敞开了门——市政厅大楼的底层开设了一间市民接待室，专门受理原住民递交的请愿和申诉，门口的长凳上常常坐着从西区赶来的老人，裹着褪色的格子布披肩，安静地等待叫号。图书馆门前的草坪上立起了一块公告栏，上面贴着议会会议的摘要公告，日期、议程和表决结果用打字机清晰誊写，旁边歪歪扭扭地加了一行手写的注脚：“下周一上午九时，议会厅设原住民代表咨询时段，欢迎列席旁听。”\n市长府——如今挂着"联邦行政办公室"的铜牌——是整座城市最忙碌的建筑。那扇曾被铁链锁住的侧门如今日夜敞开着，穿西装和穿工装的官员交替进出，台阶上的石板被来回走动的脚步磨得发亮。办公楼的走廊里增加了不少新面孔，有年轻的白人文员端着文件来回小跑，也有一位穿粗布裙的 兽人女工每天清晨准时来打扫办公室，她擦桌子的动作很慢，但每张桌角都擦得干干净净。一楼的大厅里多了一张长桌，桌上摊开着一册厚厚的登记簿，前来拜访的公民或团体代表需在上面留下姓名和来意。\n或许这座小城没什么大不了的，即便如此，卢萨卡的确是变了。那种改变不剧烈，像缓慢浸润土壤的雨水，它藏在杂货店门口新挂起的一排制服布料中，藏在图书馆里围在一起翻阅印刷品的少年们的窃窃私语里，藏在那间从不停歇的联邦行政办公室里彻夜不灭的灯光里。这座曾经乏善可陈的高原小城正在笨拙、混乱、嘈杂地重新学习如何运转——以圣杯联邦的名义。\n§C阳光从未如此清晰的照在它的脸庞。§!"
