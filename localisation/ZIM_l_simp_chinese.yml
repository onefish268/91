 ZIM_Country_History_Page_01: "                                                 §G王权下属罗德西亚自治领地§!\n                                      §GThe Crown Dominion of Rhodesia§!\n\n  罗德西亚的故事始于十九世纪末的殖民拓荒浪潮。圣杯王国的一支远征队在“勘探与商路开拓”的名义下进入非洲南部高原，与当地恩德贝莱人和绍纳人的部族政权爆发了持续数年的武装冲突。至二十世纪初，圣杯王国通过一系列条约、军事占领和土地兼并，建立了正式的殖民行政体系，将这片广袤的高原纳入帝国版图。\n  第一次伟大战争成为罗德西亚命运的转折点。自治领的前身——南罗德西亚保护地——向帝国输送了数万名非洲士兵和大量矿产物资，罗德西亚步兵团在东非战场浴血奋战，以鲜血和忠诚换来了帝国的信任。大战结束后，圣杯王国为表彰其贡献，正式授予罗德西亚“自治领”地位，准许其成立自治政府、设立总督府和民选议会——尽管选举权仅限于拥有固定财产的白人男性。罗德西亚由此从一块普通的殖民地晋升为帝国体系中享有有限自治权的“高贵成员”，索尔兹伯里与卢萨卡的城市建设也由此拉开了序幕。\n  新的旗帜在总督府楼顶升起，自治领的行政架构逐日成型，罗德西亚在这个被称为“帝国哨兵”的新身份中迎来了它最辉煌的时刻。"
 ZIM_Country_History_Page_02: "  1918年，伊菲尔爵士被任命为罗德西亚自治领总督，此后18年间，她的名字与这片土地牢牢绑定。\n  伊菲尔是一位典型的帝国派官僚，务实而冷峻，擅长在宗主国、矿业公司和地方精英之间周旋，以维持微妙的势力平衡。在她的治理下，罗德西亚经历了近四分之一个世纪的稳定期：农场产量逐年攀升，矿区出口稳步增长，白人中产阶级在索尔兹伯里和卢萨卡过上了与英国本土相差无几的文明生活。殖民体系在她的铁腕治理下运转得像一台老旧的座钟，指针缓慢而恒定地向前移动。总督每年照例发表新年致辞，市政预算按照惯例审核通过，矿区的产量报告准时递交至索尔兹伯里。种族隔离与行政架构的等级分明是这座城市的根基——白人官员居住在山丘上的荫凉之处，原住民工人在西边的洼地中劳作，双方鲜少交集，互不打扰。偶尔有欧洲来的旅行者途经此地，在俱乐部的留言簿上写下“偏远而整洁的城市”之类的评语，然后搭上下一班火车继续南下。\n  在伊菲尔治下的近四分之一个世纪里，罗德西亚似乎从未被历史的波澜打搅过——它就这样安静地嵌在非洲的高原上，像一枚被遗忘在帝国棋盘角落的棋子，沉默、稳固、不为所动。"
 ZIM_Country_History_Page_03: "  伊菲尔总督在年底的机密备忘录中曾亲手写下：“罗德西亚的繁荣是建在火山口上的。矿工们每一锹挖下去的，不止是矿石，还有他们自己的坟墓。”但这份备忘录被归入加密档案柜后便无人再提起。\n  自治领的白人精英们仍然保持着从容。他们按照惯例，将1936年的新年庆祝活动安排在了索尔兹伯里市政厅广场，伊菲尔总督的新年致辞照例要在午时钟声后发表——正如这18年来的每一个元旦。总督府按惯例筹备着1936年的新年庆祝活动，秘书处正在起草总督的新年致辞，稿纸上满是关于“共克时艰”和“团结一致”的套话——与过去18年的每一份讲稿并无二致。\n1936年3月2日，索尔兹伯里市中心广场。伊菲尔总督站在市政厅二楼的露台上，身后是新年的红白布幔，面前是聚集了数千名市民的广场，白人居前，原住民被隔在铁栅栏外的外围。总督展开致辞的手稿，清了清嗓子，声音通过扩音器传遍广场，§R一切如常§!，§R四平八稳§!。"
 ZIM_GATHERING_STORM_DESC: "  骄傲的帝国前哨、高原上的明珠、圣杯王冠上最有潜力的一颗宝石……能将这诸多称号集于一身的，正是这座嵌在非洲腹地的殖民都会——罗德西亚自治领。自十九世纪末的拓荒者在此升起第一面圣杯旗帜以来，罗德西亚便以其丰饶的矿脉和无垠的农田，为日不落帝国源源不断地输送着铜与粮食。第一次伟大战争中，罗德西亚步兵团赴东非战场浴血奋战，为王国赢得大战胜利贡献了来自南部非洲的血与火，由此被正式授予自治领地位，享有在女王陛下治下的有限自治权。\n诚然，罗德西亚的繁荣建立在一条分明的界线上——界线以北是修剪齐整的花园洋房、俱乐部酒会和翘腿阅读《泰晤士报》的殖民官员；界线以南是铁皮屋顶连绵起伏的原住民聚居区，尘土飞扬的巷弄中潜伏着无声的积怨。但在这片高原上，没有人怀疑总督府的权威。伊菲尔爵士在这座灰白色石楼中端坐了18年，以铁腕与圆熟维系着自治领的平衡，让矿业公司的账目保持盈余，让农场主的小麦按时装车，让每一列驶向南非的火车都满载着令人满意的报表。罗德西亚自治领的信条简洁而坚定——秩序高于一切，而总督府的灯光将日夜不息地照耀着这片土地。\n\n\n“§R她早该走了§!”"
 ZIM_start_game_text: "流淌着奶与蜜的应许之地......"
 ZIM_new_tips: "罗德西亚自治领地的全新内容:\n\n-在索尔兹伯里总督府的白色廊柱下，§Y伊菲尔爵士§!以铁腕和仪表盘般的精准统治着这片南疆富土，矿车沿铁路日夜不息地驶向南方，蓝花楹在整齐的街道上按时盛开，仿佛一切混乱与裂隙都只是一场永远不会到来的远雷。\n\n-从卢旺达街头的束棒集会起步，见证§Y安丘比菲§!从法西斯党魁到非洲独裁者的崛起，以凯撒之志为鞭、以狂热为刃，将一盘散沙的追随者锻造成南部非洲最锋利的黑色军刀，最终让印度洋到大西洋之间的每一座城市皆跪伏在§Y一心会§!的黑旗之下。\n\n-从卢萨卡市政厅的烛光会议起步，见证§Y斯坦利伯爵§!从经济专员到国家领袖的蜕变，以法律为剑、以民意为盾，将四分五裂的罗德西亚锻造成非洲腹地最坚韧的共和国基石，最终让赤道以南的每一寸土地皆听见§C圣杯联邦§!议会厅中的辩论回响。\n\n-从东部农业区的谷仓与铁锤起步，见证§Y共产党人§!以土地改革和集体农庄唤醒赤贫农民的觉醒，在殖民废墟上铺开红旗，宣称每一粒粮食都属于耕种它的人，最终让§R赤色§!的镰刀锤头旗插遍罗德西亚最肥沃的田野。\n\n-当故国再度在亡灵浪潮中沦为废墟，流亡政府背负着残存的旗帜与破碎的荣耀横渡大洋，在罗德西亚的红土地上扎下最后的据点，§Y戈林§!、§Y戈培尔§!与§Y希尔§!围绕那顶空缺的冠冕展开无声的角逐，而封闭房间内的§Y莉莎§!正对着墙上的地图反复描摹故国的轮廓——等待着某一天，§R黑鹰重新从非洲起飞，一路向北§!。\n\n\n§B唯有死亡才算是责任的尾声§!"
