 ZYX_win_ZSH: "在§Y罗德西亚的命运之战§!中，\n@ZYX§Y一心会§!击败了@ZSH§R津巴布韦尔社会主义共和国§!\n\n\n§R历史的车轮碾过谷物与镰刀，只留下一个被碾碎的理想主义者的残骸。§!"
