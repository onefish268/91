 ZSB_win_ZSH: "在§Y罗德西亚内战§!中，\n@ZSB§C圣杯联邦§!击败了@ZSH§R津巴布韦尔社会主义共和国§!\n\n\n§R他们承诺的丰饶，止于谷仓外第一个冬天。§!"
 ZSB_win_ZYX: "在§Y罗德西亚内战§!中，\n@ZSB§C圣杯联邦§!击败了@ZYX§G一心会§!\n\n\n§G罗德西亚需要一名恺撒——但领袖既不是恺撒，罗德西亚也不是罗马。§!"





