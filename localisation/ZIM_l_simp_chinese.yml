  ZIM_GATHERING_STORM_DESC:0"罗德西亚自治领，是坐落于非洲中南部的英式自治领国家，依托广袤的内陆腹地、富集的矿产资源与稳固的殖民自治体系存续发展。但她真的稳固吗？"
