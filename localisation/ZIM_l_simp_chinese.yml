 ZYX_win_ZCS: "在§Y罗德西亚内战§!中，\n@ZYX§G一心会§!击败了@ZCS§7城市自治委员会§!\n\n\n§7在权力的棋盘上，生存的法则从未改变——要么征服，要么被征服。§!"
 ZYX_win_ZXS: "在§Y罗德西亚内战§!中，\n@ZYX§G一心会§!击败了@ZXS§0邪神教会§!\n\n\n§0当神祇默然无语，刀锋便代替神谕开口说话。§!"
 ZYX_win_ZSH: "在§Y罗德西亚内战§!中，\n@ZYX§G一心会§!击败了@ZSH§R津巴布韦尔社会主义共和国§!\n\n\n§R历史的车轮碾过谷物与镰刀，只留下一个被碾碎的理想主义者的残骸。§!"
 ZYX_win_ZSB: "在§Y罗德西亚内战§!中，\n@ZYX§G一心会§!击败了@ZSB§C母国的联邦§!\n\n\n§C我至死也未能见到照耀我祖国的曙光。§!"
