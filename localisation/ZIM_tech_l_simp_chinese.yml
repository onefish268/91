l_simp_chinese:
 ZIM_infantry_equipment_0:0 "斯太尔-曼利夏M1895制式步枪"
 ZIM_infantry_equipment_0_short:0 "斯太尔-曼利夏M1895"
 ZIM_infantry_equipment_0_desc:0 "斯太尔-曼利夏M1895式步枪是由奥地利斯太尔公司与曼利夏公司联合研制的栓动步枪系列，包含卡宾枪、标准步枪及改进型等多个型号。该系列采用直动式枪机与弹夹插入供弹系统，主体结构由特种钢制成，可兼容8×50mm等制式弹药，自1895年起成为部分次要国家的主要制式武器。"
 ZIM_artillery_equipment_1:0 "8厘米FK M.5野战炮"
 ZIM_artillery_equipment_1_short:0 "8厘米FK M.5"
 ZIM_artillery_equipment_1_desc:0 "斯柯达在1905年完成了新式牵引野战炮的设计，虽然名为8厘米炮，它的实际口径为76.5毫米。该炮新旧技术杂糅在一起，同时期其它国家已经普遍采用钢制炮管，可FK M.5仍采用青铜炮管，使用水平滑动炮闩闭锁，炮管与一体式炮架之间安装了液压弹簧后坐系统。FK M.5及后续版本总共生产了3200多门，是一些国家陆军的主力装备之一，伟大战争期间使用广泛。"
 ZIM_infantry_equipment_1:0 "斯太尔‑曼利夏M95/30步枪"
 ZIM_infantry_equipment_1_short:0 "斯太尔‑曼利夏M95/30"
 ZIM_infantry_equipment_1_desc:0 "斯太尔‑曼利夏 M95/30 步枪是奥地利在 1930 年对 M1895 步枪的现代化改型，同样为直拉枪机结构，拥有步兵长枪版与短管卡宾版本。该枪更换枪管适配新型 8×56mmR 凸缘步枪弹，机匣带有 “S” 识别标记，内部大部分零件可与原版 M1895 互换，是奥地利在二战爆发前的主力制式步枪。1933德奥合并后德军将其编号 Gewehr 306 (ö)，卡宾版本编号 Kar 505 (ö)，多用于后方治安、占领区警戒，极少投入前线主力作战。"
 ZIM_infantry_equipment_2:0 "Kar98k 毛瑟短步枪（斯太尔工厂 bnz 代工版）"
 ZIM_infantry_equipment_2_short:0 "Kar98k 毛瑟短步枪"
 ZIM_infantry_equipment_2_desc:0 "Kar98k 毛瑟短步枪是纳粹德国的制式旋转后拉枪机步枪，由奥地利斯太尔‑戴姆勒‑普赫工厂代工生产，工厂代码 bnz/660。该枪采用毛瑟经典旋转闭锁枪机，5 发内置弹仓供弹，使用 7.92×57mm 毛瑟步枪弹，金属构件采用军工钢材，配有木质枪托护木。1938 至 1945 年间斯太尔工厂产出近百万支，供应德军与党卫军，该枪为德国设计，奥地利仅负责制造，并非奥地利自研武器。"
 ZIM_infantry_equipment_3:0 "曼利夏‑舍瑙尔步枪 M1903"
 ZIM_infantry_equipment_3_short:0 "曼利夏‑舍瑙尔M1903"
 ZIM_infantry_equipment_3_desc:0 "曼利夏‑舍瑙尔步枪是奥地利斯太尔生产的旋转后拉枪机步枪，拥有独特的旋转式盒式弹仓结构，可分离弹夹装填，分为军用、狩猎出口多个子型号。该枪做工精良，最初为希腊军队等海外客户设计，使用 6.5×54mm 舍瑙尔弹药，奥地利本国仅少量采购，二战期间几乎没有作为军用制式武器大规模参战，更多作为出口枪械和民间狩猎步枪。"
 ZIM_infantry_equipment_x:0 "斯太尔 SPG 自动步枪"
 ZIM_infantry_equipment_x_short:0 "斯太尔SPG"
 ZIM_infantry_equipment_x_desc:0 "斯太尔 SPG 自动步枪是二战后期奥地利斯太尔工厂研发的试验型自动步枪，采用短行程活塞自动原理，使用 7.92×57mm 毛瑟弹药，设计目标为替代德军栓动步枪。该枪仅制造少量原型样枪，没有完成定型量产，从未正式列装部队，属于二战奥地利未落地的武器方案。/卡宾枪，冲锋枪，手枪，进攻和防御手榴弹以及反坦克手榴弹。"
 ZIM_infantry_equipment_x_2:0 "48年轻武器"
 ZIM_infantry_equipment_x_2_short:0 "48年轻武器"
 ZIM_infantry_equipment_x_2_desc:0 "个人和部队使用的步兵武器，以及士兵所需的其他装备。由1948年制式服装，服役中的突击步枪，轻机枪，手枪，进攻和防御手榴弹以及反坦克手榴弹/弹药组成。"
 ZIM_infantry_equipment_x_3:0 "52年轻武器"
 ZIM_infantry_equipment_x_3_short:0 "52年轻武器"
 ZIM_infantry_equipment_x_3_desc:0 "个人和部队使用的步兵武器，以及士兵所需的其他装备。由1950年制式服装，服役中的突击步枪，轻机枪，手枪，进攻和防御手榴弹以及反坦克手榴弹/弹药组成。"
